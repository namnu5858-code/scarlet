<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Locket</title>
  <style>
    :root {
      --bg-color: #000000;
      --surface-color: #1c1c1e;
      --surface-glass: rgba(38, 38, 40, 0.72);
      --accent-gold: #ffb800;
      --text-primary: #ffffff;
      --text-secondary: #8e8e93;
      --safe-top: env(safe-area-inset-top, 20px);
      --safe-bottom: env(safe-area-inset-bottom, 20px);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: var(--bg-color);
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      overscroll-behavior: none;
    }

    #app {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding-top: calc(var(--safe-top) + 8px);
      padding-bottom: calc(var(--safe-bottom) + 12px);
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
      height: 44px;
      z-index: 20;
    }

    .icon-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--surface-color);
      border: none;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.15s ease, background 0.2s;
    }

    .icon-btn:active {
      transform: scale(0.92);
    }

    .friends-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--surface-color);
      padding: 8px 16px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 600;
      color: var(--text-primary);
    }

    .header-title {
      font-size: 17px;
      font-weight: 700;
      letter-spacing: -0.2px;
    }

    /* Viewfinder */
    .viewfinder-wrapper {
      position: relative;
      width: 100%;
      padding: 0 12px;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: auto 0;
    }

    .viewfinder {
      position: relative;
      width: 100%;
      max-width: 420px;
      aspect-ratio: 1 / 1;
      border-radius: 44px;
      overflow: hidden;
      background: #141416;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.6);
    }

    #camera-video, #preview-canvas, #preview-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    #camera-video.mirror {
      transform: scaleX(-1);
    }

    .vf-top-controls {
      position: absolute;
      top: 16px;
      left: 16px;
      right: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }

    .vf-badge {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(30, 30, 32, 0.65);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: none;
      color: #fff;
      font-size: 13px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .vf-badge.active {
      background: var(--accent-gold);
      color: #000;
    }

    /* Caption & Widgets Carousel inside Viewfinder */
    .overlay-carousel-container {
      position: absolute;
      bottom: 16px;
      left: 0;
      right: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 15;
    }

    .overlay-track {
      display: flex;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      scroll-behavior: smooth;
      width: 100%;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }

    .overlay-track::-webkit-scrollbar {
      display: none;
    }

    .overlay-slide {
      flex: 0 0 100%;
      scroll-snap-align: center;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 0 24px;
    }

    .caption-pill {
      background: rgba(35, 35, 38, 0.72);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 999px;
      padding: 10px 18px;
      min-width: 160px;
      max-width: 88%;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .caption-input {
      background: transparent;
      border: none;
      color: #ffffff;
      font-size: 15px;
      font-weight: 600;
      text-align: center;
      width: 100%;
      outline: none;
      user-select: text;
    }

    .caption-input::placeholder {
      color: rgba(255, 255, 255, 0.85);
      font-weight: 600;
    }

    .widget-pill {
      background: rgba(35, 35, 38, 0.78);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 999px;
      padding: 9px 16px;
      font-size: 14px;
      font-weight: 600;
      color: #fff;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      cursor: pointer;
    }

    .widget-pill.gold {
      background: rgba(255, 184, 0, 0.9);
      color: #000;
    }

    .widget-pill.purple {
      background: linear-gradient(135deg, #7c3aed, #9333ea);
      color: #fff;
    }

    .widget-pill.blue {
      background: rgba(56, 189, 248, 0.88);
      color: #fff;
    }

    /* Dots indicator below viewfinder */
    .carousel-dots {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 6px;
      margin-top: 12px;
      height: 10px;
    }

    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.25);
      transition: all 0.2s ease;
    }

    .dot.active {
      background: #ffffff;
      transform: scale(1.2);
    }

    /* Camera Bottom Controls */
    .bottom-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
      padding: 0 20px;
    }

    .camera-controls {
      width: 100%;
      max-width: 360px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
    }

    .side-action-btn {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: transparent;
      border: none;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.15s ease;
    }

    .side-action-btn:active {
      transform: scale(0.9);
    }

    .shutter-outer {
      width: 84px;
      height: 84px;
      border-radius: 50%;
      border: 4px solid var(--accent-gold);
      padding: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.12s ease;
    }

    .shutter-outer:active {
      transform: scale(0.93);
    }

    .shutter-inner {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: #ffffff;
    }

    /* Preview Action Row (Large X, Send, Aa+) */
    .preview-controls {
      width: 100%;
      max-width: 360px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
    }

    .large-circle-btn {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: transparent;
      border: none;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.15s ease, background 0.2s;
    }

    .large-circle-btn:active {
      transform: scale(0.9);
      background: rgba(255, 255, 255, 0.1);
    }

    .send-main-btn {
      width: 84px;
      height: 84px;
      border-radius: 50%;
      background: #2c2c2e;
      border: none;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.15s ease, background 0.2s;
    }

    .send-main-btn:active {
      transform: scale(0.92);
      background: #3a3a3c;
    }

    /* Recipient Selector */
    .recipients-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 18px;
      width: 100%;
      overflow-x: auto;
      padding: 4px 12px;
      scrollbar-width: none;
    }

    .recipients-row::-webkit-scrollbar {
      display: none;
    }

    .recipient-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      min-width: 56px;
    }

    .recipient-avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: #2c2c2e;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 700;
      color: #fff;
      border: 2px solid transparent;
      padding: 2px;
      transition: border-color 0.2s;
    }

    .recipient-item.selected .recipient-avatar {
      border-color: var(--accent-gold);
    }

    .recipient-avatar-inner {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: #3a3a3c;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .recipient-item.selected .recipient-avatar-inner {
      background: rgba(255, 184, 0, 0.18);
      color: var(--accent-gold);
    }

    .recipient-name {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-secondary);
    }

    .recipient-item.selected .recipient-name {
      color: var(--accent-gold);
    }

    /* History Trigger */
    .history-trigger {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      padding: 6px 16px;
    }

    .history-trigger-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 15px;
      font-weight: 700;
      color: #ffffff;
    }

    .history-thumb-preview {
      width: 24px;
      height: 24px;
      border-radius: 6px;
      background: #2c2c2e;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      color: var(--text-secondary);
    }

    .history-thumb-preview img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* History Fullscreen Sheet (Swipe Down to Close, No Back Button) */
    #history-sheet {
      position: fixed;
      inset: 0;
      background: #000000;
      z-index: 100;
      display: flex;
      flex-direction: column;
      transform: translateY(100%);
      transition: transform 0.34s cubic-bezier(0.22, 1, 0.36, 1);
      padding-top: calc(var(--safe-top) + 10px);
      padding-bottom: calc(var(--safe-bottom) + 16px);
      touch-action: pan-y;
    }

    #history-sheet.open {
      transform: translateY(0);
    }

    .sheet-drag-handle {
      width: 40px;
      height: 5px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.28);
      margin: 0 auto 12px auto;
      flex-shrink: 0;
    }

    .sheet-header {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px 20px 14px 20px;
      flex-shrink: 0;
    }

    .sheet-title {
      font-size: 17px;
      font-weight: 700;
      color: #ffffff;
    }

    .history-feed {
      flex: 1;
      overflow-y: auto;
      padding: 8px 16px 32px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 28px;
      -webkit-overflow-scrolling: touch;
    }

    .empty-history {
      margin: auto;
      text-align: center;
      color: var(--text-secondary);
      font-size: 15px;
      font-weight: 500;
    }

    .history-card {
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .history-card-img-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 40px;
      overflow: hidden;
      background: #1c1c1e;
    }

    .history-card-img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .history-card-caption {
      position: absolute;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(35, 35, 38, 0.78);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 8px 16px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 600;
      color: #fff;
      max-width: 85%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .history-card-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-secondary);
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>
  <div id="app">
    <!-- Camera Header -->
    <div id="camera-header" class="header">
      <button class="icon-btn" aria-label="Profile">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
          <circle cx="12" cy="7" r="4"></circle>
        </svg>
      </button>
      <div class="friends-pill">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
          <path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/>
        </svg>
        <span>Bạn bè</span>
      </div>
      <button id="open-history-top" class="icon-btn" aria-label="Messages">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path>
        </svg>
      </button>
    </div>

    <!-- Preview Header -->
    <div id="preview-header" class="header hidden">
      <div style="width: 40px;"></div>
      <div class="header-title">Gửi đến...</div>
      <button id="download-btn" class="icon-btn" aria-label="Tải ảnh xuống">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
          <polyline points="7 10 12 15 17 10"></polyline>
          <line x1="12" y1="15" x2="12" y2="3"></line>
        </svg>
      </button>
    </div>

    <!-- Center Viewfinder -->
    <div class="viewfinder-wrapper">
      <div style="width: 100%; max-width: 420px; display: flex; flex-direction: column; align-items: center;">
        <div class="viewfinder">
          <!-- Camera Live Stream -->
          <video id="camera-video" autoplay playsinline muted class="mirror"></video>
          <!-- Captured Image -->
          <img id="preview-img" class="hidden" alt="Preview" />
          <canvas id="preview-canvas" class="hidden"></canvas>

          <!-- Camera Top Overlay Controls -->
          <div id="camera-vf-controls" class="vf-top-controls">
            <button id="flash-btn" class="vf-badge" aria-label="Flash">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                <path d="M7 2v11h3v9l7-12h-4l4-8z"/>
              </svg>
            </button>
            <button id="zoom-btn" class="vf-badge">1x</button>
          </div>

          <!-- Preview Swipeable Overlay Widgets -->
          <div id="preview-overlays" class="overlay-carousel-container hidden">
            <div id="overlay-track" class="overlay-track">
              <!-- Slide 0: Text Caption -->
              <div class="overlay-slide" data-index="0">
                <div class="caption-pill">
                  <input id="caption-input" class="caption-input" type="text" placeholder="Thêm một tin nhắn" maxlength="60" />
                </div>
              </div>
              <!-- Slide 1: Star Rating -->
              <div class="overlay-slide" data-index="1">
                <div id="widget-stars" class="widget-pill" data-stars="5">
                  <span>⭐⭐⭐⭐⭐</span>
                </div>
              </div>
              <!-- Slide 2: Location -->
              <div class="overlay-slide" data-index="2">
                <div id="widget-location" class="widget-pill">
                  <span>📍</span>
                  <span id="location-text">Thêm vị trí</span>
                </div>
              </div>
              <!-- Slide 3: Weather -->
              <div class="overlay-slide" data-index="3">
                <div id="widget-weather" class="widget-pill blue">
                  <span>⛅</span>
                  <span id="weather-text">26°C Hà Nội</span>
                </div>
              </div>
              <!-- Slide 4: Time -->
              <div class="overlay-slide" data-index="4">
                <div id="widget-time" class="widget-pill">
                  <span>🕒</span>
                  <span id="time-text">13:28</span>
                </div>
              </div>
              <!-- Slide 5: Streak -->
              <div class="overlay-slide" data-index="5">
                <div id="widget-streak" class="widget-pill gold">
                  <span>🔥</span>
                  <span>1</span>
                </div>
              </div>
              <!-- Slide 6: Zodiac -->
              <div class="overlay-slide" data-index="6">
                <div id="widget-zodiac" class="widget-pill purple">
                  <span>♐</span>
                  <span>Mùa Nhân Mã</span>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- Carousel Dots (Visible in Preview) -->
        <div id="carousel-dots" class="carousel-dots hidden">
          <span class="dot active" data-dot="0"></span>
          <span class="dot" data-dot="1"></span>
          <span class="dot" data-dot="2"></span>
          <span class="dot" data-dot="3"></span>
          <span class="dot" data-dot="4"></span>
          <span class="dot" data-dot="5"></span>
          <span class="dot" data-dot="6"></span>
        </div>
      </div>
    </div>

    <!-- Bottom Camera Controls -->
    <div id="camera-bottom" class="bottom-section">
      <div class="camera-controls">
        <button id="gallery-btn" class="side-action-btn" aria-label="Thư viện ảnh">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="4" ry="4"></rect>
            <circle cx="8.5" cy="8.5" r="1.5"></circle>
            <polyline points="21 15 16 10 5 21"></polyline>
          </svg>
        </button>
        <input id="gallery-input" type="file" accept="image/*" class="hidden" />

        <button id="shutter-btn" class="shutter-outer" aria-label="Chụp ảnh">
          <div class="shutter-inner"></div>
        </button>

        <button id="flip-btn" class="side-action-btn" aria-label="Đổi camera">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 2v6h-6"></path>
            <path d="M3 12a9 9 0 0 1 15-6.7L21 8"></path>
            <path d="M3 22v-6h6"></path>
            <path d="M21 12a9 9 0 0 1-15 6.7L3 16"></path>
          </svg>
        </button>
      </div>

      <!-- History Swipe/Tap Bar -->
      <div id="history-trigger" class="history-trigger">
        <div class="history-trigger-row">
          <div id="history-thumb" class="history-thumb-preview">0</div>
          <span>Lịch sử</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="6 9 12 15 18 9"></polyline>
          </svg>
        </div>
      </div>
    </div>

    <!-- Bottom Preview Controls -->
    <div id="preview-bottom" class="bottom-section hidden">
      <div class="preview-controls">
        <!-- Large X Button -->
        <button id="cancel-btn" class="large-circle-btn" aria-label="Hủy">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>

        <!-- Large Send Button -->
        <button id="send-btn" class="send-main-btn" aria-label="Gửi">
          <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" style="transform: translate(-1px, 1px);">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
        </button>

        <!-- Large Aa+ Widget Cycle Button -->
        <button id="aa-btn" class="large-circle-btn" aria-label="Tiện ích">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <text x="2" y="18" font-size="14" font-weight="700" fill="currentColor" stroke="none" font-family="-apple-system, sans-serif">Aa</text>
            <path d="M19 4v4M17 6h4" stroke-width="2"></path>
          </svg>
        </button>
      </div>

      <!-- Recipients Selector (Starts empty except "Tất cả") -->
      <div class="recipients-row">
        <div class="recipient-item selected" data-recipient="Tất cả">
          <div class="recipient-avatar">
            <div class="recipient-avatar-inner">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                <path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/>
              </svg>
            </div>
          </div>
          <span class="recipient-name">Tất cả</span>
        </div>
      </div>
    </div>
  </div>

  <!-- History Fullscreen Sheet (No Back Button - Swipe Straight Down to Close) -->
  <div id="history-sheet">
    <div class="sheet-drag-handle"></div>
    <div class="sheet-header">
      <div class="sheet-title">Lịch sử</div>
    </div>
    <div id="history-feed" class="history-feed">
      <div class="empty-history">Chưa có ảnh nào được gửi</div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'locket_user_photos_v1';
    let photos = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
    let facingMode = 'environment';
    let currentStream = null;
    let flashEnabled = false;
    let zoomLevel = 1;
    let capturedDataUrl = '';
    let activeSlideIndex = 0;

    const videoEl = document.getElementById('camera-video');
    const previewImg = document.getElementById('preview-img');
    const previewCanvas = document.getElementById('preview-canvas');
    const cameraHeader = document.getElementById('camera-header');
    const previewHeader = document.getElementById('preview-header');
    const cameraVfControls = document.getElementById('camera-vf-controls');
    const previewOverlays = document.getElementById('preview-overlays');
    const carouselDots = document.getElementById('carousel-dots');
    const cameraBottom = document.getElementById('camera-bottom');
    const previewBottom = document.getElementById('preview-bottom');
    const overlayTrack = document.getElementById('overlay-track');
    const captionInput = document.getElementById('caption-input');
    const historySheet = document.getElementById('history-sheet');
    const historyFeed = document.getElementById('history-feed');
    const historyThumb = document.getElementById('history-thumb');

    async function startCamera() {
      if (currentStream) {
        currentStream.getTracks().forEach(t => t.stop());
      }
      try {
        currentStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: facingMode, width: { ideal: 1080 }, height: { ideal: 1080 } },
          audio: false
        });
        videoEl.srcObject = currentStream;
        if (facingMode === 'user') {
          videoEl.classList.add('mirror');
        } else {
          videoEl.classList.remove('mirror');
        }
      } catch (err) {
        console.warn('Camera access unavailable:', err);
      }
    }

    function updateTimeWidget() {
      const now = new Date();
      const hh = String(now.getHours()).padStart(2, '0');
      const mm = String(now.getMinutes()).padStart(2, '0');
      document.getElementById('time-text').textContent = `${hh}:${mm}`;
    }

    function enterPreviewMode(dataUrl) {
      capturedDataUrl = dataUrl;
      previewImg.src = dataUrl;
      videoEl.classList.add('hidden');
      previewImg.classList.remove('hidden');

      cameraHeader.classList.add('hidden');
      previewHeader.classList.remove('hidden');

      cameraVfControls.classList.add('hidden');
      previewOverlays.classList.remove('hidden');
      carouselDots.classList.remove('hidden');

      cameraBottom.classList.add('hidden');
      previewBottom.classList.remove('hidden');

      activeSlideIndex = 0;
      overlayTrack.scrollTo({ left: 0, behavior: 'instant' });
      updateDots(0);
      updateTimeWidget();
    }

    function exitPreviewMode() {
      capturedDataUrl = '';
      captionInput.value = '';
      previewImg.classList.add('hidden');
      videoEl.classList.remove('hidden');

      previewHeader.classList.add('hidden');
      cameraHeader.classList.remove('hidden');

      previewOverlays.classList.add('hidden');
      carouselDots.classList.add('hidden');
      cameraVfControls.classList.remove('hidden');

      previewBottom.classList.add('hidden');
      cameraBottom.classList.remove('hidden');
    }

    function capturePhoto() {
      const size = 1080;
      previewCanvas.width = size;
      previewCanvas.height = size;
      const ctx = previewCanvas.getContext('2d');

      if (videoEl.videoWidth && videoEl.videoHeight) {
        const vw = videoEl.videoWidth;
        const vh = videoEl.videoHeight;
        const minSide = Math.min(vw, vh);
        const sx = (vw - minSide) / 2;
        const sy = (vh - minSide) / 2;

        ctx.save();
        if (facingMode === 'user') {
          ctx.translate(size, 0);
          ctx.scale(-1, 1);
        }
        ctx.drawImage(videoEl, sx, sy, minSide, minSide, 0, 0, size, size);
        ctx.restore();
      } else {
        ctx.fillStyle = '#1c1c1e';
        ctx.fillRect(0, 0, size, size);
      }

      const dataUrl = previewCanvas.toDataURL('image/jpeg', 0.9);
      enterPreviewMode(dataUrl);
    }

    function getActiveOverlayText() {
      if (activeSlideIndex === 0) return captionInput.value.trim();
      if (activeSlideIndex === 1) return document.getElementById('widget-stars').textContent.trim();
      if (activeSlideIndex === 2) return `📍 ${document.getElementById('location-text').textContent}`;
      if (activeSlideIndex === 3) return `⛅ ${document.getElementById('weather-text').textContent}`;
      if (activeSlideIndex === 4) return `🕒 ${document.getElementById('time-text').textContent}`;
      if (activeSlideIndex === 5) return `🔥 1`;
      if (activeSlideIndex === 6) return `♐ Mùa Nhân Mã`;
      return '';
    }

    function renderHistory() {
      if (photos.length === 0) {
        historyThumb.innerHTML = '0';
        historyFeed.innerHTML = '<div class="empty-history">Chưa có ảnh nào được gửi</div>';
        return;
      }

      historyThumb.innerHTML = `<img src="${photos[0].image}" alt="Latest" />`;
      historyFeed.innerHTML = photos.map(item => `
        <div class="history-card">
          <div class="history-card-img-wrap">
            <img src="${item.image}" alt="Locket" />
            ${item.caption ? `<div class="history-card-caption">${escapeHtml(item.caption)}</div>` : ''}
          </div>
          <div class="history-card-meta">
            <span>Bạn</span>
            <span>•</span>
            <span>${item.time}</span>
          </div>
        </div>
      `).join('');
    }

    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, m => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[m]));
    }

    function updateDots(index) {
      document.querySelectorAll('.dot').forEach((d, idx) => {
        d.classList.toggle('active', idx === index);
      });
    }

    // Event Listeners
    document.getElementById('shutter-btn').addEventListener('click', capturePhoto);

    document.getElementById('flip-btn').addEventListener('click', () => {
      facingMode = facingMode === 'user' ? 'environment' : 'user';
      startCamera();
    });

    document.getElementById('flash-btn').addEventListener('click', (e) => {
      flashEnabled = !flashEnabled;
      e.currentTarget.classList.toggle('active', flashEnabled);
    });

    document.getElementById('zoom-btn').addEventListener('click', (e) => {
      zoomLevel = zoomLevel === 1 ? 0.5 : 1;
      e.currentTarget.textContent = zoomLevel === 0.5 ? '.5x' : '1x';
    });

    document.getElementById('gallery-btn').addEventListener('click', () => {
      document.getElementById('gallery-input').click();
    });

    document.getElementById('gallery-input').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => enterPreviewMode(ev.target.result);
      reader.readAsDataURL(file);
      e.target.value = '';
    });

    document.getElementById('cancel-btn').addEventListener('click', exitPreviewMode);

    document.getElementById('aa-btn').addEventListener('click', () => {
      const totalSlides = 7;
      const nextIndex = (activeSlideIndex + 1) % totalSlides;
      const slideWidth = overlayTrack.clientWidth;
      overlayTrack.scrollTo({ left: nextIndex * slideWidth, behavior: 'smooth' });
    });

    overlayTrack.addEventListener('scroll', () => {
      const slideWidth = overlayTrack.clientWidth || 1;
      const index = Math.round(overlayTrack.scrollLeft / slideWidth);
      if (index !== activeSlideIndex) {
        activeSlideIndex = index;
        updateDots(index);
      }
    });

    document.getElementById('widget-stars').addEventListener('click', (e) => {
      let stars = parseInt(e.currentTarget.dataset.stars || '5', 10);
      stars = stars >= 5 ? 1 : stars + 1;
      e.currentTarget.dataset.stars = stars;
      e.currentTarget.innerHTML = `<span>${'⭐'.repeat(stars)}</span>`;
    });

    document.getElementById('widget-location').addEventListener('click', () => {
      const locEl = document.getElementById('location-text');
      locEl.textContent = locEl.textContent === 'Thêm vị trí' ? 'Hà Nội, Việt Nam' : 'Thêm vị trí';
    });

    document.getElementById('download-btn').addEventListener('click', () => {
      if (!capturedDataUrl) return;
      const a = document.createElement('a');
      a.href = capturedDataUrl;
      a.download = `locket_${Date.now()}.jpg`;
      a.click();
    });

    document.getElementById('send-btn').addEventListener('click', () => {
      if (!capturedDataUrl) return;
      const now = new Date();
      const timeStr = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
      photos.unshift({
        id: Date.now(),
        image: capturedDataUrl,
        caption: getActiveOverlayText(),
        time: timeStr
      });
      localStorage.setItem(STORAGE_KEY, JSON.stringify(photos));
      renderHistory();
      exitPreviewMode();
    });

    // Open History Sheet
    function openHistorySheet() {
      renderHistory();
      historySheet.style.transition = 'transform 0.34s cubic-bezier(0.22, 1, 0.36, 1)';
      historySheet.style.transform = 'translateY(0)';
      historySheet.classList.add('open');
    }

    function closeHistorySheet() {
      historySheet.style.transition = 'transform 0.3s cubic-bezier(0.22, 1, 0.36, 1)';
      historySheet.style.transform = 'translateY(100%)';
      historySheet.classList.remove('open');
    }

    document.getElementById('history-trigger').addEventListener('click', openHistorySheet);
    document.getElementById('open-history-top').addEventListener('click', openHistorySheet);

    // Swipe up on camera bottom to open history
    let camTouchStartY = 0;
    document.getElementById('camera-bottom').addEventListener('touchstart', (e) => {
      camTouchStartY = e.touches[0].clientY;
    }, { passive: true });

    document.getElementById('camera-bottom').addEventListener('touchend', (e) => {
      const deltaY = camTouchStartY - e.changedTouches[0].clientY;
      if (deltaY > 45) {
        openHistorySheet();
      }
    }, { passive: true });

    // Swipe straight down on history sheet to dismiss (no back button needed)
    let sheetStartY = 0;
    let sheetCurrentY = 0;
    let isDraggingSheet = false;

    historySheet.addEventListener('touchstart', (e) => {
      if (historyFeed.scrollTop <= 0) {
        sheetStartY = e.touches[0].clientY;
        isDraggingSheet = true;
        historySheet.style.transition = 'none';
      }
    }, { passive: true });

    historySheet.addEventListener('touchmove', (e) => {
      if (!isDraggingSheet) return;
      const dy = e.touches[0].clientY - sheetStartY;
      if (dy > 0 && historyFeed.scrollTop <= 0) {
        sheetCurrentY = dy;
        historySheet.style.transform = `translateY(${dy}px)`;
      } else {
        isDraggingSheet = false;
        historySheet.style.transform = 'translateY(0)';
      }
    }, { passive: true });

    historySheet.addEventListener('touchend', () => {
      if (!isDraggingSheet) return;
      isDraggingSheet = false;
      if (sheetCurrentY > 90) {
        closeHistorySheet();
      } else {
        openHistorySheet();
      }
      sheetCurrentY = 0;
    }, { passive: true });

    // Init
    renderHistory();
    startCamera();
  </script>
</body>
</html>
