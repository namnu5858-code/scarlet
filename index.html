<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khuôn Viên Trường 3D - Hiệu Ứng Pháo Hoa Hội Tụ</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #050811;
            font-family: sans-serif;
        }
        #canvas-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }
        #ui-overlay {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
        }
        button {
            padding: 14px 32px;
            font-size: 16px;
            font-weight: bold;
            color: #fff;
            background: linear-gradient(45deg, #ff0055, #ff9900, #00e5ff);
            background-size: 200% 200%;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(0, 229, 255, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
            animation: gradientBG 3s ease infinite;
        }
        button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.8);
        }
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
    </style>
    <!-- Three.js & OrbitControls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <div id="canvas-container"></div>
    <div id="ui-overlay">
        <button id="start-btn">KÍCH HOẠT PHÁO HOA HỘI TỤ</button>
    </div>

    <script>
        let scene, camera, renderer, controls;
        let particleSystem, particleGeometry, particleMaterial;
        let audioCtx;
        
        const PARTICLE_COUNT = 90000;
        let animationTime = 0;
        let isAnimating = false;

        // Các giai đoạn hiệu ứng
        const DURATION_GATHER = 4.0;    // Gom tất cả hạt trong khuôn viên về tâm
        const DURATION_SPIN = 2.0;      // Xoáy tròn rực rỡ tại tâm
        const DURATION_LAUNCH = 1.2;    // Phóng vút lên cao
        const DURATION_EXPLODE = 4.5;   // Bùng nổ đa sắc màu + rơi xuống

        const TOTAL_DURATION = DURATION_GATHER + DURATION_SPIN + DURATION_LAUNCH + DURATION_EXPLODE;

        function init() {
            const container = document.getElementById('canvas-container');

            // Scene setup
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a0e1a);
            scene.fog = new THREE.FogExp2(0x0a0e1a, 0.008);

            // Camera setup
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 35, 90);

            // Renderer setup
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            container.appendChild(renderer.domElement);

            // Orbit Controls
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.maxPolarAngle = Math.PI / 2 - 0.01;
            controls.target.set(0, 10, 0);

            // Lights
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(50, 80, 40);
            dirLight.castShadow = true;
            scene.add(dirLight);

            // Xây dựng Khuôn Viên Trường 3D
            buildCampus();

            // Khởi tạo Hệ thống hạt Pháo hoa
            createFireworksParticles();

            // Âm thanh
            initAudio();

            window.addEventListener('resize', onWindowResize);
            document.getElementById('start-btn').addEventListener('click', startFireworksShow);

            // Tự động kích hoạt hội tụ sau 1 giây
            setTimeout(() => {
                startFireworksShow();
            }, 1000);
        }

        // Mô hình Khuôn viên Trường học 3D
        function buildCampus() {
            // Sân trường / Mặt đất
            const groundGeo = new THREE.PlaneGeometry(200, 200);
            const groundMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.8 });
            const ground = new THREE.Mesh(groundGeo, groundMat);
            ground.rotation.x = -Math.PI / 2;
            ground.receiveShadow = true;
            scene.add(ground);

            // Đường đi trung tâm
            const pathGeo = new THREE.PlaneGeometry(20, 200);
            const pathMat = new THREE.MeshStandardMaterial({ color: 0x334155 });
            const path = new THREE.Mesh(pathGeo, pathMat);
            path.rotation.x = -Math.PI / 2;
            path.position.y = 0.01;
            scene.add(path);

            // Tòa nhà Chính (Giảng đường trung tâm)
            createBuilding(0, 15, -40, 50, 30, 25, 0x3b82f6);
            
            // Các Tòa nhà Học phần Hai bên
            createBuilding(-50, 10, -10, 25, 20, 40, 0x64748b);
            createBuilding(50, 10, -10, 25, 20, 40, 0x64748b);
            createBuilding(-50, 10, 35, 25, 20, 40, 0x475569);
            createBuilding(50, 10, 35, 25, 20, 40, 0x475569);

            // Cây xanh quanh khuôn viên
            for (let i = -80; i <= 80; i += 20) {
                if (Math.abs(i) > 15) {
                    createTree(i, 0, 15);
                    createTree(i, 0, -15);
                    createTree(-75, 0, i);
                    createTree(75, 0, i);
                }
            }

            // Cột đèn chiếu sáng sân trường
            createLampPost(-12, 0, 10);
            createLampPost(12, 0, 10);
            createLampPost(-12, 0, -20);
            createLampPost(12, 0, -20);
        }

        function createBuilding(x, y, z, w, h, d, color) {
            const group = new THREE.Group();
            
            // Thân nhà
            const geo = new THREE.BoxGeometry(w, h, d);
            const mat = new THREE.MeshStandardMaterial({ color: color, roughness: 0.5 });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            group.add(mesh);

            // Cửa sổ phát sáng
            const winGeo = new THREE.PlaneGeometry(1.5, 2);
            const winMat = new THREE.MeshBasicMaterial({ color: 0xfef08a });

            for (let wx = -w / 2 + 3; wx < w / 2 - 3; wx += 4) {
                for (let wy = -h / 2 + 4; wy < h / 2 - 3; wy += 5) {
                    const win = new THREE.Mesh(winGeo, winMat);
                    win.position.set(wx, wy, d / 2 + 0.1);
                    group.add(win);
                }
            }

            group.position.set(x, y, z);
            scene.add(group);
        }

        function createTree(x, y, z) {
            const group = new THREE.Group();
            
            // Thân cây
            const trunkGeo = new THREE.CylinderGeometry(0.6, 0.8, 5);
            const trunkMat = new THREE.MeshStandardMaterial({ color: 0x451a03 });
            const trunk = new THREE.Mesh(trunkGeo, trunkMat);
            trunk.position.y = 2.5;
            group.add(trunk);

            // Tán lá
            const leavesGeo = new THREE.ConeGeometry(3.5, 8, 8);
            const leavesMat = new THREE.MeshStandardMaterial({ color: 0x15803d, roughness: 0.9 });
            const leaves = new THREE.Mesh(leavesGeo, leavesMat);
            leaves.position.y = 7;
            group.add(leaves);

            group.position.set(x, y, z);
            scene.add(group);
        }

        function createLampPost(x, y, z) {
            const group = new THREE.Group();
            
            const postGeo = new THREE.CylinderGeometry(0.2, 0.3, 8);
            const postMat = new THREE.MeshStandardMaterial({ color: 0x0f172a });
            const post = new THREE.Mesh(postGeo, postMat);
            post.position.y = 4;
            group.add(post);

            const lightGeo = new THREE.SphereGeometry(0.8, 16, 16);
            const lightMat = new THREE.MeshBasicMaterial({ color: 0xfde047 });
            const lightMesh = new THREE.Mesh(lightGeo, lightMat);
            lightMesh.position.y = 8;
            group.add(lightMesh);

            const pointLight = new THREE.PointLight(0xfde047, 0.8, 20);
            pointLight.position.y = 8;
            group.add(pointLight);

            group.position.set(x, y, z);
            scene.add(group);
        }

        // Tạo Hệ Thống Hạt Pháo Hoa Hội Tụ Từ Toàn Khuôn Viên
        function createFireworksParticles() {
            particleGeometry = new THREE.BufferGeometry();

            const startPositions = new Float32Array(PARTICLE_COUNT * 3);
            const gatherPositions = new Float32Array(PARTICLE_COUNT * 3);
            const explodeVelocities = new Float32Array(PARTICLE_COUNT * 3);
            const colors = new Float32Array(PARTICLE_COUNT * 3);
            const sizes = new Float32Array(PARTICLE_COUNT);
            const randoms = new Float32Array(PARTICLE_COUNT * 3);

            const colorObj = new THREE.Color();

            for (let i = 0; i < PARTICLE_COUNT; i++) {
                const i3 = i * 3;

                // 1. Phủ kín mọi góc, mọi điểm trong khuôn viên trường 3D
                startPositions[i3]     = (Math.random() - 0.5) * 180;
                startPositions[i3 + 1] = Math.random() * 50;
                startPositions[i3 + 2] = (Math.random() - 0.5) * 180;

                // 2. Hội tụ về điểm trung tâm sân trường (0, 2, 0)
                const u = Math.random();
                const v = Math.random();
                const theta = u * 2.0 * Math.PI;
                const phi = Math.acos(2.0 * v - 1.0);
                const r = Math.cbrt(Math.random()) * 2.0;

                gatherPositions[i3]     = r * Math.sin(phi) * Math.cos(theta);
                gatherPositions[i3 + 1] = r * Math.sin(phi) * Math.sin(theta) + 2.0;
                gatherPositions[i3 + 2] = r * Math.cos(phi);

                // 3. Vận tốc bùng nổ đa hướng
                const expTheta = Math.random() * Math.PI * 2;
                const expPhi = Math.acos((Math.random() * 2) - 1);
                const expSpeed = 18.0 + Math.random() * 40.0;

                explodeVelocities[i3]     = expSpeed * Math.sin(expPhi) * Math.cos(expTheta);
                explodeVelocities[i3 + 1] = expSpeed * Math.sin(expPhi) * Math.sin(expTheta);
                explodeVelocities[i3 + 2] = expSpeed * Math.cos(expPhi);

                // 4. Toàn bộ dải màu rực rỡ sắc màu (Full Spectrum HSL)
                const hue = Math.random(); 
                colorObj.setHSL(hue, 1.0, 0.6);
                colors[i3]     = colorObj.r;
                colors[i3 + 1] = colorObj.g;
                colors[i3 + 2] = colorObj.b;

                sizes[i] = 1.2 + Math.random() * 2.5;
                randoms[i3]     = Math.random();
                randoms[i3 + 1] = Math.random();
                randoms[i3 + 2] = Math.random();
            }

            particleGeometry.setAttribute('position', new THREE.BufferAttribute(startPositions, 3));
            particleGeometry.setAttribute('aGatherPos', new THREE.BufferAttribute(gatherPositions, 3));
            particleGeometry.setAttribute('aExplodeVel', new THREE.BufferAttribute(explodeVelocities, 3));
            particleGeometry.setAttribute('aColor', new THREE.BufferAttribute(colors, 3));
            particleGeometry.setAttribute('aSize', new THREE.BufferAttribute(sizes, 1));
            particleGeometry.setAttribute('aRandom', new THREE.BufferAttribute(randoms, 3));

            const vertexShader = `
                uniform float uTime;
                attribute vec3 aGatherPos;
                attribute vec3 aExplodeVel;
                attribute vec3 aColor;
                attribute float aSize;
                attribute vec3 aRandom;

                varying vec3 vColor;
                varying float vAlpha;

                const float T_GATHER = ${DURATION_GATHER.toFixed(1)};
                const float T_SPIN = ${DURATION_SPIN.toFixed(1)};
                const float T_LAUNCH = ${DURATION_LAUNCH.toFixed(1)};
                const float T_EXPLODE = ${DURATION_EXPLODE.toFixed(1)};

                mat3 rotateY(float angle) {
                    float c = cos(angle);
                    float s = sin(angle);
                    return mat3(c, 0, s, 0, 1, 0, -s, 0, c);
                }

                void main() {
                    vColor = aColor;
                    vAlpha = 1.0;
                    vec3 pos = position;

                    float t1 = T_GATHER;
                    float t2 = t1 + T_SPIN;
                    float t3 = t2 + T_LAUNCH;
                    float t4 = t3 + T_EXPLODE;

                    if (uTime < t1) {
                        // 1. Tự động gom toàn bộ hạt từ mọi điểm khuôn viên về tâm
                        float progress = uTime / t1;
                        float ease = progress * progress * (3.0 - 2.0 * progress);
                        pos = mix(position, aGatherPos, ease);
                    } 
                    else if (uTime < t2) {
                        // 2. Tụ tại tâm, quay xoáy tròn rực rỡ
                        float spinTime = uTime - t1;
                        float angle = spinTime * 14.0 + aRandom.x * 6.28;
                        pos = rotateY(angle) * aGatherPos;
                        vColor += vec3(sin(spinTime * 10.0), cos(spinTime * 8.0), sin(spinTime * 12.0)) * 0.35;
                    } 
                    else if (uTime < t3) {
                        // 3. Phóng vút lên bầu trời khuôn viên
                        float launchTime = uTime - t2;
                        float progress = launchTime / T_LAUNCH;
                        float height = progress * 45.0;
                        float spin = launchTime * 22.0;
                        
                        pos = rotateY(spin) * (aGatherPos * (1.0 - progress * 0.6));
                        pos.y += height;
                    } 
                    else if (uTime < t4) {
                        // 4. Bùng nổ cực hoành tráng + Trọng lực kéo xuống + Mờ dần
                        float expTime = uTime - t3;
                        vec3 launchEndPos = vec3(0.0, 47.0, 0.0);
                        
                        float drag = exp(-expTime * 0.75);
                        vec3 vel = aExplodeVel * drag;
                        vec3 gravity = vec3(0.0, -9.8 * expTime * expTime * 0.5, 0.0);
                        
                        pos = launchEndPos + vel * expTime + gravity;
                        vAlpha = smoothstep(T_EXPLODE, T_EXPLODE * 0.25, expTime);
                    } else {
                        vAlpha = 0.0;
                    }

                    vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
                    gl_PointSize = aSize * (220.0 / -mvPosition.z);
                    gl_Position = projectionMatrix * mvPosition;
                }
            `;

            const fragmentShader = `
                varying vec3 vColor;
                varying float vAlpha;

                void main() {
                    float dist = length(gl_PointCoord - vec2(0.5));
                    if (dist > 0.5 || vAlpha <= 0.0) discard;
                    
                    float intensity = pow(1.0 - dist * 2.0, 1.4);
                    gl_FragColor = vec4(vColor, intensity * vAlpha);
                }
            `;

            particleMaterial = new THREE.ShaderMaterial({
                vertexShader: vertexShader,
                fragmentShader: fragmentShader,
                uniforms: {
                    uTime: { value: 0 }
                },
                transparent: true,
                depthWrite: false,
                blending: THREE.AdditiveBlending
            });

            particleSystem = new THREE.Points(particleGeometry, particleMaterial);
            scene.add(particleSystem);
        }

        // Âm Thanh Chân Thực
        function initAudio() {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            audioCtx = new AudioContext();
        }

        function playLaunchSound() {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            
            osc.type = 'sine';
            osc.frequency.setValueAtTime(120, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(850, audioCtx.currentTime + DURATION_LAUNCH);
            
            gain.gain.setValueAtTime(0.01, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.35, audioCtx.currentTime + DURATION_LAUNCH * 0.8);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + DURATION_LAUNCH);

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.start();
            osc.stop(audioCtx.currentTime + DURATION_LAUNCH);
        }

        function playExplosionSound() {
            if (!audioCtx) return;

            const bufferSize = audioCtx.sampleRate * 2.8;
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) {
                data[i] = Math.random() * 2 - 1;
            }

            const noise = audioCtx.createBufferSource();
            noise.buffer = buffer;

            const filter = audioCtx.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(900, audioCtx.currentTime);
            filter.frequency.exponentialRampToValueAtTime(25, audioCtx.currentTime + 2.2);

            const gain = audioCtx.createGain();
            gain.gain.setValueAtTime(1.0, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 2.8);

            noise.connect(filter);
            filter.connect(gain);
            gain.connect(audioCtx.destination);

            noise.start();
        }

        function startFireworksShow() {
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            animationTime = 0;
            isAnimating = true;

            setTimeout(() => {
                playLaunchSound();
            }, (DURATION_GATHER + DURATION_SPIN) * 1000);

            setTimeout(() => {
                playExplosionSound();
            }, (DURATION_GATHER + DURATION_SPIN + DURATION_LAUNCH) * 1000);
        }

        function animate() {
            requestAnimationFrame(animate);

            controls.update();

            if (isAnimating) {
                animationTime += 0.016;
                particleMaterial.uniforms.uTime.value = animationTime;

                if (animationTime > TOTAL_DURATION + 1.0) {
                    isAnimating = false;
                }
            }

            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        init();
        animate();
    </script>
</body>
</html>
