<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hiệu Ứng Pháo Hoa Hoành Tráng 3D</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: sans-serif;
        }
        #canvas-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }
        #ui-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
            text-align: center;
        }
        button {
            padding: 15px 35px;
            font-size: 18px;
            font-weight: bold;
            color: #fff;
            background: linear-gradient(45deg, #ff0055, #ff9900, #00e5ff);
            background-size: 200% 200%;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
            animation: gradientBG 3s ease infinite;
        }
        button:hover {
            transform: scale(1.08);
            box-shadow: 0 0 35px rgba(255, 255, 255, 0.8);
        }
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
    </style>
    <!-- Three.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="canvas-container"></div>
    <div id="ui-overlay">
        <button id="start-btn">KÍCH HOẠT PHÁO HOA</button>
    </div>

    <script>
        let scene, camera, renderer, particleSystem, particleGeometry, particleMaterial;
        let audioCtx, listener, explosionSoundBuffer, launchSoundBuffer;
        
        const PARTICLE_COUNT = 80000;
        let animationTime = 0;
        let isAnimating = false;

        // Cấu hình các giai đoạn thời gian (giây)
        const DURATION_GATHER = 3.5;    // Giai đoạn 1: Gom hạt từ toàn không gian về tâm
        const DURATION_SPIN = 2.0;      // Giai đoạn 2: Xoáy tròn rực rỡ tại tâm
        const DURATION_LAUNCH = 1.2;    // Giai đoạn 3: Phóng vút lên cao
        const DURATION_EXPLODE = 4.0;   // Giai đoạn 4: Bùng nổ hoành tráng đa sắc màu

        const TOTAL_DURATION = DURATION_GATHER + DURATION_SPIN + DURATION_LAUNCH + DURATION_EXPLODE;

        function init() {
            const container = document.getElementById('canvas-container');

            // Scene, Camera, Renderer
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x000000, 0.015);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 15, 60);
            camera.lookAt(0, 15, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            container.appendChild(renderer.domElement);

            createParticles();
            initAudio();

            window.addEventListener('resize', onWindowResize);
            document.getElementById('start-btn').addEventListener('click', startShow);
        }

        function createParticles() {
            particleGeometry = new THREE.BufferGeometry();

            const startPositions = new Float32Array(PARTICLE_COUNT * 3);
            const gatherPositions = new Float32Array(PARTICLE_COUNT * 3);
            const explodeVelocities = new Float32Array(PARTICLE_COUNT * 3);
            const colors = new Float32Array(PARTICLE_COUNT * 3);
            const sizes = new Float32Array(PARTICLE_COUNT);
            const randoms = new Float32Array(PARTICLE_COUNT * 3);

            const colorObj = new THREE.Color();

            for (let i = 0; i < PARTICLE_COUNT; i++) {
                const i3 = i * 3;

                // 1. Vị trí ban đầu: Rải rác khắp không gian khuôn viên
                startPositions[i3]     = (Math.random() - 0.5) * 120;
                startPositions[i3 + 1] = (Math.random() - 0.5) * 80 + 20;
                startPositions[i3 + 2] = (Math.random() - 0.5) * 120;

                // 2. Vị trí hội tụ quanh tâm (hình cầu nhỏ nén chặt)
                const u = Math.random();
                const v = Math.random();
                const theta = u * 2.0 * Math.PI;
                const phi = Math.acos(2.0 * v - 1.0);
                const r = Math.cbrt(Math.random()) * 2.5;

                gatherPositions[i3]     = r * Math.sin(phi) * Math.cos(theta);
                gatherPositions[i3 + 1] = r * Math.sin(phi) * Math.sin(theta) + 2.0;
                gatherPositions[i3 + 2] = r * Math.cos(phi);

                // 3. Vận tốc bùng nổ: Hướng ra ngoài mọi phía đa dạng
                const expTheta = Math.random() * Math.PI * 2;
                const expPhi = Math.acos((Math.random() * 2) - 1);
                const expSpeed = 15.0 + Math.random() * 35.0;

                explodeVelocities[i3]     = expSpeed * Math.sin(expPhi) * Math.cos(expTheta);
                explodeVelocities[i3 + 1] = expSpeed * Math.sin(expPhi) * Math.sin(expTheta);
                explodeVelocities[i3 + 2] = expSpeed * Math.cos(expPhi);

                // 4. Bảng màu phong phú toàn bộ dải màu (Full Spectrum HSL)
                const hue = Math.random(); 
                colorObj.setHSL(hue, 1.0, 0.6);
                colors[i3]     = colorObj.r;
                colors[i3 + 1] = colorObj.g;
                colors[i3 + 2] = colorObj.b;

                // Kích thước hạt & Ngẫu nhiên
                sizes[i] = 1.0 + Math.random() * 2.5;
                randoms[i3]     = Math.random();
                randoms[i3 + 1] = Math.random();
                randoms[i3 + 2] = Math.random();
            }

            particleGeometry.setAttribute('position', new THREE.BufferAttribute(startPositions, 3));
            particleGeometry.setAttribute('aGatherPos', new THREE.BufferAttribute(gatherPositions, 3));
            particleGeometry.setAttribute('aExplodeVel', new THREE.BufferAttribute(explodeVelocities, 3));
            particleGeometry.setAttribute('aColor', new THREE.BufferAttribute(colors, 3));
            particleGeometry.setAttribute('aSize', new THREE.BufferAttribute(sizes, 1));
            particleGeometry.setAttribute('aRandom', new THREE.BufferAttribute(randoms, 3));

            // Shader riêng biệt xử lý toàn bộ quỹ đạo & màu sắc
            const vertexShader = `
                uniform float uTime;
                attribute vec3 aGatherPos;
                attribute vec3 aExplodeVel;
                attribute vec3 aColor;
                attribute float aSize;
                attribute vec3 aRandom;

                varying vec3 vColor;
                varying float vAlpha;

                // Giai đoạn thời gian
                const float T_GATHER = ${DURATION_GATHER.toFixed(1)};
                const float T_SPIN = ${DURATION_SPIN.toFixed(1)};
                const float T_LAUNCH = ${DURATION_LAUNCH.toFixed(1)};
                const float T_EXPLODE = ${DURATION_EXPLODE.toFixed(1)};

                mat3 rotateY(float angle) {
                    float c = cos(angle);
                    float s = sin(angle);
                    return mat3(c, 0, s, 0, 1, 0, -s, 0, c);
                }

                void main() {
                    vColor = aColor;
                    vAlpha = 1.0;
                    vec3 pos = position;

                    float t1 = T_GATHER;
                    float t2 = t1 + T_SPIN;
                    float t3 = t2 + T_LAUNCH;
                    float t4 = t3 + T_EXPLODE;

                    if (uTime < t1) {
                        // 1. Gom hạt từ khắp nơi về tâm
                        float progress = uTime / t1;
                        float ease = progress * progress * (3.0 - 2.0 * progress);
                        pos = mix(position, aGatherPos, ease);
                    } 
                    else if (uTime < t2) {
                        // 2. Xoáy tròn rực rỡ tại điểm trung tâm
                        float spinTime = uTime - t1;
                        float angle = spinTime * 12.0 + aRandom.x * 6.28;
                        pos = rotateY(angle) * aGatherPos;
                        
                        // Đổi màu rực rỡ khi xoáy
                        vColor += vec3(sin(spinTime * 10.0), cos(spinTime * 8.0), sin(spinTime * 12.0)) * 0.3;
                    } 
                    else if (uTime < t3) {
                        // 3. Phóng vút lên cao theo đường xoắn
                        float launchTime = uTime - t2;
                        float progress = launchTime / T_LAUNCH;
                        
                        float height = progress * 30.0;
                        float spin = launchTime * 20.0;
                        
                        pos = rotateY(spin) * (aGatherPos * (1.0 - progress * 0.5));
                        pos.y += height;
                    } 
                    else if (uTime < t4) {
                        // 4. Bùng nổ hoành tráng + Trọng lực kéo xuống + Mờ dần
                        float expTime = uTime - t3;
                        vec3 launchEndPos = vec3(0.0, 32.0, 0.0);
                        
                        // Lực cản không khí
                        float drag = exp(-expTime * 0.8);
                        vec3 vel = aExplodeVel * drag;
                        
                        // Trọng lực
                        vec3 gravity = vec3(0.0, -9.8 * expTime * expTime * 0.5, 0.0);
                        
                        pos = launchEndPos + vel * expTime + gravity;
                        
                        // Mờ dần theo thời gian
                        vAlpha = smoothstep(T_EXPLODE, T_EXPLODE * 0.3, expTime);
                    } else {
                        vAlpha = 0.0;
                    }

                    vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
                    gl_PointSize = aSize * (200.0 / -mvPosition.z);
                    gl_Position = projectionMatrix * mvPosition;
                }
            `;

            const fragmentShader = `
                varying vec3 vColor;
                varying float vAlpha;

                void main() {
                    // Tạo hạt hình tròn mềm mại phát sáng
                    float dist = length(gl_PointCoord - vec2(0.5));
                    if (dist > 0.5 || vAlpha <= 0.0) discard;
                    
                    float intensity = pow(1.0 - dist * 2.0, 1.5);
                    gl_FragColor = vec4(vColor, intensity * vAlpha);
                }
            `;

            particleMaterial = new THREE.ShaderMaterial({
                vertexShader: vertexShader,
                fragmentShader: fragmentShader,
                uniforms: {
                    uTime: { value: 0 }
                },
                transparent: true,
                depthWrite: false,
                blending: THREE.AdditiveBlending
            });

            particleSystem = new THREE.Points(particleGeometry, particleMaterial);
            scene.add(particleSystem);
        }

        // Tự tạo Âm thanh tổng hợp chân thực bằng Web Audio API (Không dùng file ngoài)
        function initAudio() {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            audioCtx = new AudioContext();
        }

        function playLaunchSound() {
            if (!audioCtx) return;
            
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            
            osc.type = 'sine';
            osc.frequency.setValueAtTime(150, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + DURATION_LAUNCH);
            
            gain.gain.setValueAtTime(0.01, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.3, audioCtx.currentTime + DURATION_LAUNCH * 0.8);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + DURATION_LAUNCH);

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.start();
            osc.stop(audioCtx.currentTime + DURATION_LAUNCH);
        }

        function playExplosionSound() {
            if (!audioCtx) return;

            // Tạo tiếng nổ trầm đục (Sub-bass explosion)
            const bufferSize = audioCtx.sampleRate * 2.5;
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) {
                data[i] = Math.random() * 2 - 1;
            }

            const noise = audioCtx.createBufferSource();
            noise.buffer = buffer;

            const filter = audioCtx.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(800, audioCtx.currentTime);
            filter.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + 2.0);

            const gain = audioCtx.createGain();
            gain.gain.setValueAtTime(1.0, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 2.5);

            noise.connect(filter);
            filter.connect(gain);
            gain.connect(audioCtx.destination);

            noise.start();
        }

        function startShow() {
            document.getElementById('ui-overlay').style.display = 'none';
            
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            animationTime = 0;
            isAnimating = true;

            // Hẹn giờ phát âm thanh khớp từng giai đoạn
            setTimeout(() => {
                playLaunchSound();
            }, (DURATION_GATHER + DURATION_SPIN) * 1000);

            setTimeout(() => {
                playExplosionSound();
            }, (DURATION_GATHER + DURATION_SPIN + DURATION_LAUNCH) * 1000);
        }

        function animate() {
            requestAnimationFrame(animate);

            if (isAnimating) {
                animationTime += 0.016;
                particleMaterial.uniforms.uTime.value = animationTime;

                // Xoay nhẹ góc nhìn Camera cho hiệu ứng 3D sống động
                camera.position.x = Math.sin(animationTime * 0.2) * 65;
                camera.position.z = Math.cos(animationTime * 0.2) * 65;
                camera.lookAt(0, 15, 0);

                if (animationTime > TOTAL_DURATION + 1.0) {
                    isAnimating = false;
                    document.getElementById('ui-overlay').style.display = 'block';
                    document.getElementById('start-btn').innerText = 'KÍCH HOẠT LẠI';
                }
            }

            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        init();
        animate();
    </script>
</body>
</html>
