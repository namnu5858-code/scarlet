<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Locket</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: #000000;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      user-select: none;
    }

    .app-container {
      width: 100%;
      height: 100%;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background: #000000;
    }

    /* Camera View */
    .camera-screen {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 16px 16px 28px;
    }

    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 44px;
      z-index: 10;
    }

    .icon-btn {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.12);
      border: none;
      color: #ffffff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      cursor: pointer;
    }

    .friends-pill {
      background: rgba(255, 255, 255, 0.12);
      color: #ffffff;
      border: none;
      border-radius: 999px;
      padding: 10px 18px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }

    .viewfinder-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 44px;
      overflow: hidden;
      background: #141414;
      margin: auto 0;
    }

    video, .captured-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .camera-overlay-controls {
      position: absolute;
      inset: 14px;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .overlay-top-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .mini-glass-btn {
      pointer-events: auto;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #ffffff;
      font-size: 14px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .zoom-row {
      pointer-events: auto;
      align-self: center;
      display: flex;
      gap: 6px;
      background: rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(10px);
      padding: 4px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.12);
    }

    .zoom-btn {
      border: none;
      background: transparent;
      color: #ffffff;
      font-size: 12px;
      font-weight: 600;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      cursor: pointer;
    }

    .zoom-btn.active {
      background: rgba(255, 255, 255, 0.25);
    }

    .shutter-area {
      display: flex;
      align-items: center;
      justify-content: space-around;
      padding: 12px 16px 4px;
    }

    /* Nút chụp tròn viền vàng đặc trưng */
    .shutter-outer {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      border: 7px solid #ffb800;
      background-color: #000000;
      padding: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.12s ease;
    }

    .shutter-outer:active {
      transform: scale(0.94);
    }

    .shutter-inner {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: #ffffff;
    }

    .history-bar {
      text-align: center;
      margin-top: 10px;
      font-size: 14px;
      color: rgba(255, 255, 255, 0.75);
      font-weight: 500;
    }

    /* Preview Screen */
    .preview-screen {
      display: none;
      width: 100%;
      height: 100%;
      flex-direction: column;
      justify-content: space-between;
      padding: 16px 16px 24px;
    }

    .preview-screen.active {
      display: flex;
    }

    .camera-screen.hidden {
      display: none;
    }

    .preview-header {
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      height: 44px;
    }

    .preview-title {
      font-size: 17px;
      font-weight: 700;
      color: #ffffff;
    }

    .download-btn {
      position: absolute;
      right: 0;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.14);
      border: none;
      color: #ffffff;
      font-size: 18px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .preview-stage {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 44px;
      overflow: hidden;
      background: #141414;
      margin: auto 0;
    }

    .widget-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding: 20px;
    }

    .widget-box {
      pointer-events: auto;
      background: rgba(38, 38, 40, 0.78);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 24px;
      padding: 12px 18px;
      color: #ffffff;
      max-width: 90%;
      text-align: center;
    }
