<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bạn Bè Quanh Đây</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --accent-color: #38bdf8;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        .header {
            padding: 16px 20px;
            font-size: 1.25rem;
            font-weight: 600;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .map-container {
            position: relative;
            flex: 1;
            background: radial-gradient(circle, #1e293b 0%, #0f172a 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Hiệu ứng Radar quét */
        .radar {
            position: absolute;
            width: 300px;
            height: 300px;
            border: 2px solid rgba(56, 189, 248, 0.3);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .radar::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: conic-gradient(from 0deg at 50% 50%, rgba(56, 189, 248, 0) 0deg, rgba(56, 189, 248, 0.4) 360deg);
            animation: spin 4s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .user-dot {
            position: absolute;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 2px solid var(--accent-color);
            background-size: cover;
            background-position: center;
            cursor: pointer;
            transition: transform 0.3s ease;
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.5);
        }

        .user-dot:hover {
            transform: scale(1.2);
        }

        .friend-list-container {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border-top-left-radius: 24px;
            border-top-right-radius: 24px;
            padding: 20px;
            max-height: 40vh;
            overflow-y: auto;
            box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.3);
        }

        .friend-card {
            display: flex;
            align-items: center;
            padding: 12px;
            margin-bottom: 10px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            transition: background 0.2s;
        }

        .friend-card:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .friend-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            object-fit: cover;
            margin-right: 15px;
            border: 2px solid var(--accent-color);
        }

        .friend-info h4 {
            margin: 0 0 4px 0;
            font-size: 1rem;
        }

        .friend-info p {
            margin: 0;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .scan-btn {
            background: var(--accent-color);
            color: #0f172a;
            border: none;
            padding: 10px 20px;
            font-weight: 600;
            border-radius: 20px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(56, 189, 248, 0.3);
            transition: opacity 0.2s;
        }

        .scan-btn:active {
            opacity: 0.8;
        }
    </style>
</head>
<body>

    <div class="header">
        <span>Khám Phá Quanh Đây</span>
        <button class="scan-btn" onclick="triggerScan()">Quét Lại</button>
    </div>

    <div class="map-container" id="mapContainer">
        <div class="radar"></div>
        <!-- Các điểm user xuất hiện động qua JS -->
    </div>

    <div class="friend-list-container">
        <h3 style="margin-top: 0; font-size: 1.1rem; color: var(--text-secondary);">Trực tuyến gần bạn</h3>
        <div id="friendList">
            <!-- Danh sách bạn bè đổ vào đây -->
        </div>
    </div>

    <script>
        const friends = [
            { id: 1, name: "Hoàng Anh", distance: "Cách 120m", avatar: "https://picsum.photos/seed/user1/100/100", x: -60, y: -40 },
            { id: 2, name: "Thanh Hằng", distance: "Cách 350m", avatar: "https://picsum.photos/seed/user2/100/100", x: 80, y: -50 },
            { id: 3, name: "Minh Quân", distance: "Cách 500m", avatar: "https://picsum.photos/seed/user3/100/100", x: -20, y: 70 }
        ];

        function renderUI() {
            const mapContainer = document.getElementById('mapContainer');
            const friendList = document.getElementById('friendList');

            // Xóa các điểm cũ trên radar (giữ lại element radar)
            const oldDots = mapContainer.querySelectorAll('.user-dot');
            oldDots.forEach(dot => dot.remove());

            friendList.innerHTML = '';

            friends.forEach(friend => {
                // Tạo chấm trên bản đồ radar
                const dot = document.createElement('div');
                dot.className = 'user-dot';
                dot.style.backgroundImage = `url(${friend.avatar})`;
                dot.style.transform = `translate(${friend.x}px, ${friend.y}px)`;
                mapContainer.appendChild(dot);

                // Tạo item trong danh sách
                const item = document.createElement('div');
                item.className = 'friend-card';
                item.innerHTML = `
                    <img src="${friend.avatar}" class="friend-avatar" alt="${friend.name}">
                    <div class="friend-info">
                        <h4>${friend.name}</h4>
                        <p>${friend.distance}</p>
                    </div>
                `;
                friendList.appendChild(item);
            });
        }

        function triggerScan() {
            // Giả lập hiệu ứng quét tìm kiếm mới
            const btn = document.querySelector('.scan-btn');
            btn.textContent = "Đang quét...";
            setTimeout(() => {
                btn.textContent = "Quét Lại";
                renderUI();
            }, 1000);
        }

        // Khởi chạy giao diện lần đầu
        renderUI();
    </script>
</body>
</html>
