<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>Cam Thung Middle School - 3D Campus</title>
<style>
*{
  box-sizing:border-box;
  -webkit-user-select:none;
  user-select:none;
  -webkit-touch-callout:none;
}
html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#8fd4f5;
  touch-action:none;
  font-family:Arial,sans-serif;
}
#game-container{
  position:fixed;
  top:0;
  left:0;
  width:100vw;
  height:100vh;
  z-index:1;
}
canvas{
  display:block;
  width:100vw !important;
  height:100vh !important;
}
.glass-ui{
  background:rgba(255,255,255,.18);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  border:1px solid rgba(255,255,255,.4);
  box-shadow:0 8px 32px rgba(0,0,0,.18);
}
#joystick-wrapper{
  position:absolute;
  left:32px;
  bottom:32px;
  width:120px;
  height:120px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:20;
  touch-action:none;
}
#joystick-stick{
  position:absolute;
  width:52px;
  height:52px;
  border-radius:50%;
  background:rgba(255,255,255,.58);
  border:1px solid rgba(255,255,255,.85);
  box-shadow:0 4px 14px rgba(0,0,0,.18);
  pointer-events:none;
}
#jump-btn{
  position:absolute;
  right:32px;
  bottom:38px;
  width:72px;
  height:72px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:20;
  touch-action:none;
  transition:background .3s ease,transform .1s ease;
}
#jump-btn.flying{
  background:rgba(255,215,0,.55);
  border-color:rgba(255,255,255,.9);
  box-shadow:0 0 15px rgba(255,215,0,.6);
}
#jump-btn:active{
  transform:scale(.94);
}
#jump-btn svg{
  width:34px;
  height:34px;
  fill:none;
  stroke:white;
  stroke-width:2.5;
  stroke-linecap:round;
  stroke-linejoin:round;
}
#loading{
  position:absolute;
  top:14px;
  right:16px;
  padding:8px 14px;
  border-radius:10px;
  background:rgba(0,0,0,.42);
  color:white;
  font-size:12px;
  z-index:30;
  pointer-events:none;
}
#zalo-chat-wrapper {
  position: absolute;
  left: 20px;
  top: 20px;
  z-index: 40;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
}
#zalo-chat-toggle-btn {
  width: 42px;
  height: 42px;
  border-radius: 12px;
  background: rgba(0, 0, 0, 0.55);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1.5px solid rgba(255,255,255,0.3);
  color: white;
  font-size: 18px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  box-shadow: 0 4px 15px rgba(0,0,0,0.3);
  transition: transform 0.2s ease, background 0.2s ease;
  outline: none;
}
#zalo-chat-toggle-btn:active {
  transform: scale(0.92);
}
#roblox-chat-container {
  width: 320px;
  height: 180px;
  background: rgba(18, 18, 18, 0.82);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border-radius: 12px;
  border: 1px solid rgba(255, 255, 255, 0.15);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  box-shadow: 0 8px 30px rgba(0, 0, 0, 0.55);
  margin-top: 8px;
  transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
  transform-origin: top left;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}
#roblox-chat-container.minimized {
  opacity: 0;
  transform: scale(0.85);
  pointer-events: none;
  height: 0;
  margin-top: 0;
  border: none;
}
#roblox-chat-messages {
  flex: 1;
  padding: 8px 12px;
  overflow-y: auto;
  font-size: 12.5px;
  color: #fff;
  display: flex;
  flex-direction: column;
  gap: 5px;
  scroll-behavior: smooth;
}
.chat-msg {
  background: rgba(0, 0, 0, 0.38);
  padding: 5px 8px;
  border-radius: 5px;
  word-break: break-word;
  line-height: 1.35;
}
.chat-msg span.system {
  color: #ffcc00;
  font-weight: bold;
}
.chat-msg span.username {
  color: #8ac2ff;
  font-weight: bold;
}
#roblox-chat-input-wrap {
  padding: 8px;
  background: rgba(12, 12, 12, 0.75);
  border-top: 1px solid rgba(255, 255, 255, 0.08);
  display: flex;
  align-items: center;
  gap: 6px;
}
#roblox-chat-input {
  flex: 1;
  height: 32px;
  background: rgba(0, 0, 0, 0.5);
  border: 1px solid rgba(255, 255, 255, 0.18);
  border-radius: 6px;
  padding: 0 10px;
  color: #fff;
  font-size: 12.5px;
  outline: none;
  -webkit-user-select: text;
  user-select: text;
  transition: border-color 0.2s;
}
#roblox-chat-input:focus {
  border-color: rgba(255, 255, 255, 0.45);
}
#roblox-chat-input::placeholder {
  color: rgba(255, 255, 255, 0.4);
}
#roblox-send-btn {
  width: 32px;
  height: 32px;
  background: rgba(0, 0, 0, 0.5);
  border: 1px solid rgba(255, 255, 255, 0.18);
  border-radius: 6px;
  color: #fff;
  font-size: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: background 0.2s, transform 0.1s;
  outline: none;
}
#roblox-send-btn:active {
  transform: scale(0.92);
  background: rgba(255, 255, 255, 0.2);
}
</style>

<body>
<div id="game-container"></div>
<div id="youtube-player-container">
  <div id="yt-player"></div>
</div>
<div id="zalo-chat-wrapper">
  <button id="zalo-chat-toggle-btn" title="Mở khung chat">💬</button>
  <div id="roblox-chat-container" class="minimized">
    <div id="roblox-chat-messages"></div>
    <div id="roblox-chat-input-wrap">
      <input id="roblox-chat-input" type="text" placeholder="To chat click here or press '/' key" autocomplete="off">
      <button id="roblox-send-btn" title="Gửi">➤</button>
    </div>
  </div>
</div>
<div id="loading">
Đang dựng khuôn viên trường 3D...
</div>
<div id="joystick-wrapper" class="glass-ui">
  <div id="joystick-stick"></div>
</div>
<div id="jump-btn" class="glass-ui">
  <svg viewBox="0 0 24 24">
    <path d="M12 19V5"></path>
    <path d="M5 12l7-7 7 7"></path>
  </svg>
</div>
<script src="https://www.youtube.com/iframe_api"></script>
<script type="module">
import * as THREE from "three";
import {GLTFLoader} from "three/addons/loaders/GLTFLoader.js";

// ============================================================
// YOUTUBE & CHAT
// ============================================================
let ytPlayer = null;
window.onYouTubeIframeAPIReady = function() {
  ytPlayer = new YT.Player('yt-player', {
    height: '0',
    width: '0',
    videoId: '6dEKnnPzxSc',
    playerVars: {
      'autoplay': 0,
      'loop': 1,
      'playlist': '6dEKnnPzxSc'
    },
    events: {
      'onReady': (event) => {}
    }
  });
};

const chatContainer = document.getElementById("roblox-chat-container");
const chatToggleBtn = document.getElementById("zalo-chat-toggle-btn");
const chatInput = document.getElementById("roblox-chat-input");
const chatMessages = document.getElementById("roblox-chat-messages");
const sendBtn = document.getElementById("roblox-send-btn");

chatToggleBtn.addEventListener("click", () => {
  chatContainer.classList.toggle("minimized");
  if (!chatContainer.classList.contains("minimized")) {
    chatInput.focus();
  }
});

function pushChatMessage(sender, text, isSystem = false) {
  const div = document.createElement("div");
  div.className = "chat-msg";
  if (isSystem) {
    div.innerHTML = `<span class="system">${sender}:</span> ${text}`;
  } else {
    div.innerHTML = `<span class="username">[${sender}]</span> ${text}`;
  }
  chatMessages.appendChild(div);
  chatMessages.scrollTop = chatMessages.scrollHeight;
}

function handleMusicCommand(cmd) {
  const lower = cmd.toLowerCase();
  if (!ytPlayer || typeof ytPlayer.playVideo !== 'function') {
    pushChatMessage("Hệ thống", "Trình phát YouTube đang tải, vui lòng thử lại sau giây lát!", true);
    return;
  }
  
  if (lower === "t") {
    ytPlayer.playVideo();
    pushChatMessage("Hệ thống", "Đã bật nhạc nền YouTube!", true);
  } else if (lower === "a") {
    ytPlayer.playVideo();
    pushChatMessage("Hệ thống", "Đã tiếp tục phát nhạc nền!", true);
  } else if (lower === "s") {
    ytPlayer.pauseVideo();
    pushChatMessage("Hệ thống", "Đã dừng nhạc nền!", true);
  }
}

function processChatAction() {
  const val = chatInput.value.trim();
  if (val) {
    pushChatMessage("Bạn", val);
    handleMusicCommand(val);
    chatInput.value = "";
  }
}

chatInput.addEventListener("keydown", (e) => {
  if (e.key === "Enter") {
    processChatAction();
  }
});

sendBtn.addEventListener("click", () => {
  processChatAction();
});

window.addEventListener("keydown", (e) => {
  if (e.key === "/") {
    if (document.activeElement !== chatInput) {
      e.preventDefault();
      chatContainer.classList.remove("minimized");
      chatInput.focus();
    }
    return;
  }
  if (document.activeElement === chatInput) return;
  const key = e.key.toUpperCase();
  if (key === "T") {
    handleMusicCommand("t");
  } else if (key === "A") {
    handleMusicCommand("a");
  } else if (key === "S") {
    handleMusicCommand("s");
  }
});

// ============================================================
// SCENE & RENDERER
// ============================================================
const container=document.getElementById("game-container");
const loading=document.getElementById("loading");
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x8fd4f5);
scene.fog=new THREE.FogExp2(0xbfeafa,0.0012);

const cameraPivot=new THREE.Object3D();
scene.add(cameraPivot);

const camera=new THREE.PerspectiveCamera(
  60,
  window.innerWidth/window.innerHeight,
  0.1,
  3000
);
cameraPivot.add(camera);

let cameraDistance=10;
let targetCameraDistance=10;
let cameraAngleX=0.1;
let cameraAngleY=0;
let targetCameraAngleX=0.1;
let targetCameraAngleY=0;

const renderer=new THREE.WebGLRenderer({
  antialias:true,
  powerPreference:"high-performance"
});
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.12;
container.appendChild(renderer.domElement);

// ============================================================
// CAMERA COLLISION
// ============================================================
const raycaster=new THREE.Raycaster();
const cameraCollisionObjects=[];

function updateCamera(){
  cameraAngleY=THREE.MathUtils.lerp(cameraAngleY,targetCameraAngleY,0.18);
  cameraAngleX=THREE.MathUtils.lerp(cameraAngleX,targetCameraAngleX,0.18);
  cameraDistance=THREE.MathUtils.lerp(cameraDistance,targetCameraDistance,0.12);
  cameraPivot.rotation.y=cameraAngleY;
  cameraPivot.rotation.x=cameraAngleX;
  const origin=cameraPivot.position.clone();
  const dir=new THREE.Vector3(0,0,1).applyQuaternion(cameraPivot.quaternion);
  raycaster.set(origin,dir);
  let actualDistance=cameraDistance;
  if(cameraCollisionObjects.length>0){
    const hits=raycaster.intersectObjects(cameraCollisionObjects,true);
    if(hits.length>0 && hits[0].distance<cameraDistance){
      actualDistance=Math.max(hits[0].distance-0.3,0.5);
    }
  }
  camera.position.set(0,0,actualDistance);
  camera.lookAt(cameraPivot.position);
}

// ============================================================
// LIGHTING
// ============================================================
const hemisphere=new THREE.HemisphereLight(0xe8f8ff,0x516b3b,1.5);
scene.add(hemisphere);

const sunlight=new THREE.DirectionalLight(0xfff3d2,2.2);
sunlight.position.set(100,130,80);
sunlight.castShadow=true;
sunlight.shadow.mapSize.width=2048;
sunlight.shadow.mapSize.height=2048;
sunlight.shadow.camera.near=1;
sunlight.shadow.camera.far=400;
sunlight.shadow.camera.left=-250;
sunlight.shadow.camera.right=250;
sunlight.shadow.camera.top=250;
sunlight.shadow.camera.bottom=-250;
sunlight.shadow.bias=-0.0003;
scene.add(sunlight);

// ============================================================
// MATERIALS & COLORS (MÔ HÌNH CHUẨN)
// ============================================================
const MAT={};

// 1. Tường tòa nhà: Kem (#EAE6DF), roughness 0.5
MAT.matWall = new THREE.MeshStandardMaterial({
  color: 0xEAE6DF,
  roughness: 0.5
});

// 2. Sàn gạch hành lang & các tầng: Gạch đỏ nâu (#BB5533), roughness 0.6
MAT.matFloor = new THREE.MeshStandardMaterial({
  color: 0xBB5533,
  roughness: 0.6
});

// 3. Trụ cột vuông: Trắng tinh (#FFFFFF), roughness 0.3
MAT.matColumn = new THREE.MeshStandardMaterial({
  color: 0xFFFFFF,
  roughness: 0.3
});

// 4. Lan can / Tay vịn: Đen kim loại/Inox đen (#111111), metalness 0.85, roughness 0.2
MAT.matRailing = new THREE.MeshStandardMaterial({
  color: 0x111111,
  metalness: 0.85,
  roughness: 0.2
});

// 5. Mái nhà dốc: Xám dốc
MAT.roofBlueGray = new THREE.MeshStandardMaterial({
  color: 0x68777b,
  roughness: 0.5,
  metalness: 0.3
});

// 6. Kính cửa sổ
MAT.glass = new THREE.MeshPhysicalMaterial({
  color: 0x76b9d2,
  roughness: 0.08,
  metalness: 0.05,
  transparent: true,
  opacity: 0.68
});

MAT.darkMetal = new THREE.MeshStandardMaterial({
  color: 0x222222,
  roughness: 0.55,
  metalness: 0.65
});

MAT.yellow = new THREE.MeshStandardMaterial({
  color: 0xe7d16a,
  roughness: 0.8
});

MAT.roofMetal = new THREE.MeshStandardMaterial({
  color: 0x68777b,
  roughness: 0.65,
  metalness: 0.45
});

MAT.concrete = new THREE.MeshStandardMaterial({
  color: 0xb8b9b3,
  roughness: 0.9
});

// ============================================================
// HELPER FUNCTIONS
// ============================================================
function box(w,h,d,x,y,z,material,parent=scene){
  const mesh=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),material);
  mesh.position.set(x,y,z);
  mesh.castShadow=true;
  mesh.receiveShadow=true;
  parent.add(mesh);
  return mesh;
}

function createPrismRoof(w, h, d, x, y, z, mat, parent=scene) {
  const shape = new THREE.Shape();
  shape.moveTo(-w/2, 0);
  shape.lineTo(0, h);
  shape.lineTo(w/2, 0);
  shape.closePath();

  const extrudeSettings = { depth: d, bevelEnabled: false };
  const geom = new THREE.ExtrudeGeometry(shape, extrudeSettings);
  geom.center();
  const mesh = new THREE.Mesh(geom, mat);
  mesh.position.set(x, y + h/2, z);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  parent.add(mesh);
  return mesh;
}

// ============================================================
// CAMPUS & GROUND
// ============================================================
const campus=new THREE.Group();
scene.add(campus);

const CAMPUS_W=260;
const CAMPUS_D=210;

// Sân cỏ (groundMat): Xanh lá (#557A46), roughness 0.8
const groundMat = new THREE.MeshStandardMaterial({ color: 0x557A46, roughness: 0.8 });
const baseGround=box(2500, 1, 2500, 0, -0.7, 0, groundMat, campus);
cameraCollisionObjects.push(baseGround);

const courtyard=box(258, .45, 208, 0, 0, 0, MAT.matFloor, campus);
cameraCollisionObjects.push(courtyard);

const tileLineMaterial=new THREE.MeshStandardMaterial({ color: 0x5e2b26, roughness: .9 });
for(let x=-129; x<=129; x+=3){
  box(.12, .03, 208, x, .235, 0, tileLineMaterial, campus);
}
for(let z=-104; z<=104; z+=3){
  box(258, .03, .12, 0, .235, z, tileLineMaterial, campus);
}

// ============================================================
// FENCE
// ============================================================
function createFenceX(z){
  box(CAMPUS_W,2,1,0,1,z,MAT.yellow,campus);
  for(let x=-130;x<=130;x+=4){
    box(.16,2.5,.16,x,2.25,z,MAT.darkMetal,campus);
  }
  box(CAMPUS_W,.16,.16,0,3.4,z,MAT.darkMetal,campus);
  box(CAMPUS_W,.16,.16,0,2.35,z,MAT.darkMetal,campus);
}

function createFenceZ(x){
  box(1,2,CAMPUS_D,x,1,0,MAT.yellow,campus);
  for(let z=-105;z<=105;z+=4){
    box(.16,2.5,.16,x,2.25,z,MAT.darkMetal,campus);
  }
  box(.16,.16,CAMPUS_D,x,3.4,0,MAT.darkMetal,campus);
}

createFenceX(-105);
createFenceX(105);
createFenceZ(-130);
createFenceZ(130);

// ============================================================
// DÃY NHÀ CHỮ L (CHUẨN HÌNH HỌC, TIẾT DIỆN CỘT VÀ KẾT NỐI LAN CAN)
// ============================================================
const buildingL = new THREE.Group();
campus.add(buildingL);

// --- CÁC THAM SỐ HÌNH HỌC VÀ KÍCH THƯỚC ---
const floorCount = 3;         // 3 tầng
const floorHeight = 3.5;      // Chiều cao mỗi tầng (3.5m)
const totalHeight = floorCount * floorHeight; // 10.5m

const wingLength = 30.0;      // Chiều dài mỗi cánh (30m)
const bodyWidth = 6.8;        // Bề rộng phòng học (6.8m)
const walkWidth = 2.4;        // Bề rộng hành lang đi lại (2.4m)
const totalWidth = bodyWidth + walkWidth; // Tổng bề rộng (9.2m)

const colSize = 0.35;         // Trụ cột vuông tiết diện 0.35m x 0.35m
const railHeight = 0.95;      // Chiều cao lan can (0.95m)
const railThick = 0.08;       // Độ dày thanh lan can
const baySize = 5.0;          // Khoảng cách nhịp giữa 2 cột (5m)

// Gốc tọa độ khối chữ L (Đặt tại góc Tây-Bắc của trường)
const ORIGIN_X = -80.0;
const ORIGIN_Z = -50.0;

// ============================================================
// 1. DÃY A (Cánh Ngang chạy dọc theo Trục X - Hướng Tây sang Đông)
// ============================================================
// Thân nhà Dãy A (khối phòng học + hành lang)
const wingA_Length = wingLength;
const wingA_CenterX = ORIGIN_X + wingA_Length / 2;
const wingA_CenterZ = ORIGIN_Z + bodyWidth / 2;

const bodyA = box(wingA_Length, totalHeight, bodyWidth, wingA_CenterX, totalHeight / 2, wingA_CenterZ, MAT.matWall, buildingL);
cameraCollisionObjects.push(bodyA);

// Mái dốc Dãy A
createPrismRoof(totalWidth, 3.5, wingA_Length, wingA_CenterX, totalHeight, wingA_CenterZ, MAT.roofBlueGray, buildingL).rotation.y = Math.PI / 2;

// Sàn các tầng Dãy A
for (let f = 0; f <= floorCount; f++) {
  const yFloor = f * floorHeight;
  box(wingA_Length, 0.25, totalWidth, wingA_CenterX, yFloor, ORIGIN_Z + totalWidth / 2, MAT.matFloor, buildingL);
}

// Cửa sổ mặt sau Dãy A (hướng Bắc - Z = ORIGIN_Z)
for (let f = 0; f < floorCount; f++) {
  const yWin = f * floorHeight + 1.8;
  for (let xWin = ORIGIN_X + 2.5; xWin <= ORIGIN_X + wingA_Length - 2.5; xWin += 4.5) {
    box(2.8, 1.6, 0.15, xWin, yWin, ORIGIN_Z - 0.05, MAT.glass, buildingL);
    box(2.9, 0.1, 0.12, xWin, yWin - 0.8, ORIGIN_Z - 0.08, MAT.darkMetal, buildingL);
    box(2.9, 0.1, 0.12, xWin, yWin + 0.8, ORIGIN_Z - 0.08, MAT.darkMetal, buildingL);
  }
}

// ============================================================
// 2. DÃY B (Cánh Dọc chạy dọc theo Trục Z - Hướng Bắc xuống Nam)
// ============================================================
// Thân nhà Dãy B (bắt đầu tiếp giáp từ mép Nam Dãy A)
const wingB_Length = wingLength - totalWidth; // 20.8m kéo dài về phía Nam
const wingB_CenterX = ORIGIN_X + bodyWidth / 2;
const wingB_CenterZ = ORIGIN_Z + totalWidth + wingB_Length / 2;

const bodyB = box(bodyWidth, totalHeight, wingB_Length, wingB_CenterX, totalHeight / 2, wingB_CenterZ, MAT.matWall, buildingL);
cameraCollisionObjects.push(bodyB);

// Mái dốc Dãy B
createPrismRoof(totalWidth, 3.5, wingB_Length, wingB_CenterX, totalHeight, wingB_CenterZ, MAT.roofBlueGray, buildingL);

// Sàn các tầng Dãy B
for (let f = 0; f <= floorCount; f++) {
  const yFloor = f * floorHeight;
  box(totalWidth, 0.25, wingB_Length, ORIGIN_X + totalWidth / 2, yFloor, wingB_CenterZ, MAT.matFloor, buildingL);
}

// Cửa sổ mặt sau Dãy B (hướng Tây - X = ORIGIN_X)
for (let f = 0; f < floorCount; f++) {
  const yWin = f * floorHeight + 1.8;
  for (let zWin = ORIGIN_Z + totalWidth + 2.5; zWin <= ORIGIN_Z + totalWidth + wingB_Length - 2.5; zWin += 4.5) {
    box(0.15, 1.6, 2.8, ORIGIN_X - 0.05, yWin, zWin, MAT.glass, buildingL);
    box(0.12, 0.1, 2.9, ORIGIN_X - 0.08, yWin - 0.8, zWin, MAT.darkMetal, buildingL);
    box(0.12, 0.1, 2.9, ORIGIN_X - 0.08, yWin + 0.8, zWin, MAT.darkMetal, buildingL);
  }
}

// ============================================================
// 3. TRỤ CỘT VUÔNG VÀ LAN CAN KẾT NỐI KHÔNG ĐÂM XUYÊN
// ============================================================
const colPosA_X = []; // Tọa độ X các cột Dãy A
const colPosB_Z = []; // Tọa độ Z các cột Dãy B

// Tọa độ mép ngoài cùng hành lang
const railLineA_Z = ORIGIN_Z + totalWidth - colSize / 2; // Hành lang Dãy A chạy dọc X tại Z này
const railLineB_X = ORIGIN_X + totalWidth - colSize / 2; // Hành lang Dãy B chạy dọc Z tại X này

// Khởi tạo tọa độ tâm các cột dọc Dãy A (từ Đông sang Tây)
for (let x = ORIGIN_X + wingA_Length - colSize / 2; x >= ORIGIN_X + totalWidth; x -= baySize) {
  colPosA_X.push(x);
}

// Khởi tạo cột góc chữ L trùng khớp tuyệt đối tại điểm giao
const CORNER_COL_X = railLineB_X;
const CORNER_COL_Z = railLineA_Z;
colPosA_X.push(CORNER_COL_X); // Đặt làm cột cuối Dãy A

// Khởi tạo tọa độ tâm các cột dọc Dãy B (từ điểm góc đi tiếp về phía Nam)
colPosB_Z.push(CORNER_COL_Z);
for (let z = CORNER_COL_Z + baySize; z <= ORIGIN_Z + totalWidth + wingB_Length - colSize / 2; z += baySize) {
  colPosB_Z.push(z);
}

// Render Cột vuông xuyên suốt từ Tầng 1 đến Tầng 3
// Dãy A Cột
for (let i = 0; i < colPosA_X.length; i++) {
  const x = colPosA_X[i];
  box(colSize, totalHeight, colSize, x, totalHeight / 2, CORNER_COL_Z, MAT.matColumn, buildingL);
}
// Dãy B Cột (Bỏ qua phần tử 0 vì trùng Cột Góc)
for (let j = 1; j < colPosB_Z.length; j++) {
  const z = colPosB_Z[j];
  box(colSize, totalHeight, colSize, CORNER_COL_X, totalHeight / 2, z, MAT.matColumn, buildingL);
}

// DỰNG LAN CAN CHUẨN XÁC DỪNG TẠI MẶT NGOÀI CỦA CỘT (TẦNG 2 VÀ TẦNG 3)
for (let f = 1; f < floorCount; f++) {
  const yFloor = f * floorHeight;
  const yRailTop = yFloor + railHeight;
  const yRailMid = yFloor + railHeight / 2;

  // --- Lan can Dãy A (Song song trục X) ---
  for (let i = 0; i < colPosA_X.length - 1; i++) {
    const xCurr = colPosA_X[i];     // Cột bên phải (X lớn hơn)
    const xNext = colPosA_X[i + 1]; // Cột bên trái (X nhỏ hơn)

    // Khoảng cách giữa 2 mặt cột kề nhau
    const segLengthA = (xCurr - colSize / 2) - (xNext + colSize / 2);
    const segCenterX = (xCurr - colSize / 2 + xNext + colSize / 2) / 2;

    // Thanh tay vịn trên
    box(segLengthA, railThick, railThick, segCenterX, yRailTop, CORNER_COL_Z, MAT.matRailing, buildingL);
    // Thanh giữa
    box(segLengthA, railThick * 0.7, railThick * 0.7, segCenterX, yRailMid, CORNER_COL_Z, MAT.matRailing, buildingL);

    // Ca-nông/Thanh dọc nhỏ bảo vệ khoảng giữa
    const subVertCount = Math.floor(segLengthA / 0.4);
    for (let sv = 1; sv < subVertCount; sv++) {
      const xSub = (xNext + colSize / 2) + sv * (segLengthA / subVertCount);
      box(railThick * 0.5, railHeight, railThick * 0.5, xSub, yFloor + railHeight / 2, CORNER_COL_Z, MAT.matRailing, buildingL);
    }
  }

  // --- Lan can Dãy B (Song song trục Z) ---
  for (let j = 0; j < colPosB_Z.length - 1; j++) {
    const zCurr = colPosB_Z[j];     // Cột phía Bắc (Z nhỏ hơn)
    const zNext = colPosB_Z[j + 1]; // Cột phía Nam (Z lớn hơn)

    // Khoảng cách giữa 2 mặt cột kề nhau
    const segLengthB = (zNext - colSize / 2) - (zCurr + colSize / 2);
    const segCenterZ = (zCurr + colSize / 2 + zNext - colSize / 2) / 2;

    // Thanh tay vịn trên
    box(railThick, railThick, segLengthB, CORNER_COL_X, yRailTop, segCenterZ, MAT.matRailing, buildingL);
    // Thanh giữa
    box(railThick * 0.7, railThick * 0.7, segLengthB, CORNER_COL_X, yRailMid, segCenterZ, MAT.matRailing, buildingL);

    // Ca-nông/Thanh dọc nhỏ
    const subVertCount = Math.floor(segLengthB / 0.4);
    for (let sv = 1; sv < subVertCount; sv++) {
      const zSub = (zCurr + colSize / 2) + sv * (segLengthB / subVertCount);
      box(railThick * 0.5, railHeight, railThick * 0.5, CORNER_COL_X, yFloor + railHeight / 2, zSub, MAT.matRailing, buildingL);
    }
  }
}

function updateClockCanvas() {

  clockCtx.fillRect(0, 0, 2048, 950);
  
  const now = new Date();

  const dd = String(now.getDate()).padStart(2, '0');
  const mm = String(now.getMonth() + 1).padStart(2, '0');

// PLAYER & MODEL LOADER
// ============================================================
const player=new THREE.Group();
scene.add(player);

let model=null;
const leafMeshes=[];
const armMeshes=[];
const rootMeshes=[];
const initialData=new Map();

const loader=new GLTFLoader();
loader.load(
  "scene.gltf",
  function(gltf){
    model=gltf.scene;
    model.position.y=.22;
    model.traverse(function(object){
      if(!object.isMesh) return;
      object.castShadow=true;
      object.receiveShadow=true;
      initialData.set(object,{
        position:object.position.clone(),
        rotation:object.rotation.clone(),
        scale:object.scale.clone()
      });
      const name=object.name.toLowerCase();
      if(name.includes("leaf")||name.includes("leaves")||name.includes("foliage")||name.includes("la")){
        leafMeshes.push(object);
      }
      if(name.includes("arm")||name.includes("hand")||name.includes("tay")){
        armMeshes.push(object);
      }
      if(name.includes("root")||name.includes("re")){
        rootMeshes.push(object);
      }
    });
    player.add(model);
    loading.style.display="none";
  },
  undefined,
  function(){
    loading.textContent="Không tìm thấy scene.gltf";
  }
);

// ============================================================
// CONTROLS & MOVEMENT
// ============================================================
const input=new THREE.Vector2(0,0);
const velocity=new THREE.Vector3(0,0,0);
const walkSpeed=80.556;
const FLY_SPEED=97.222;
let moveSpeed=walkSpeed;
const gravity=-20;
let grounded=true;
let isFlying=false;

// ============================================================
// JOYSTICK
// ============================================================
const joystick=document.getElementById("joystick-wrapper");
const stick=document.getElementById("joystick-stick");
let joystickTouch=null;
let centerX=0;
let centerY=0;
const radius=40;

joystick.addEventListener("touchstart",function(event){
  event.preventDefault();
  const touch=event.changedTouches[0];
  joystickTouch=touch.identifier;
  const rect=joystick.getBoundingClientRect();
  centerX=rect.left+rect.width/2;
  centerY=rect.top+rect.height/2;
  updateJoystick(touch);
},{passive:false});

function updateJoystick(touch){
  const dx=touch.clientX-centerX;
  const dy=touch.clientY-centerY;
  const distance=Math.hypot(dx,dy);
  const angle=Math.atan2(dy,dx);
  const limited=Math.min(distance,radius);
  const x=Math.cos(angle)*limited;
  const y=Math.sin(angle)*limited;
  stick.style.transform=`translate(${x}px,${y}px)`;
  input.x=x/radius;
  input.y=-y/radius;
}

function resetJoystick(){
  joystickTouch=null;
  input.set(0,0);
  velocity.x=0;
  velocity.z=0;
  stick.style.transform="translate(0px,0px)";
}

window.addEventListener("touchmove",function(event){
  for(let i=0;i<event.changedTouches.length;i++){
    if(event.changedTouches[i].identifier===joystickTouch){
      updateJoystick(event.changedTouches[i]);
    }
  }
},{passive:false});

window.addEventListener("touchend",function(event){
  for(let i=0;i<event.changedTouches.length;i++){
    if(event.changedTouches[i].identifier===joystickTouch){
      resetJoystick();
    }
  }
});
window.addEventListener("touchcancel",resetJoystick);

// ============================================================
// JUMP / FLY
// ============================================================
const jump=document.getElementById("jump-btn");
let isJumpHolding=false;

jump.addEventListener("touchstart",function(event){
  event.preventDefault();
  isJumpHolding=true;
  if(!isFlying){
    isFlying=true;
    grounded=false;
    jump.classList.add("flying");
    moveSpeed=FLY_SPEED;
  }
},{passive:false});

jump.addEventListener("touchend",function(event){
  event.preventDefault();
  isJumpHolding=false;
});
jump.addEventListener("touchcancel",function(){
  isJumpHolding=false;
});

// ============================================================
// CAMERA ROTATION & ZOOM
// ============================================================
let cameraTouch=null;
let lastX=0;
let lastY=0;
let initialPinchDistance=null;
let initialCameraDistance=targetCameraDistance;

window.addEventListener("wheel",function(event){
  event.preventDefault();
  const zoomSensitivity=.015;
  targetCameraDistance+=event.deltaY*zoomSensitivity;
  targetCameraDistance=THREE.MathUtils.clamp(targetCameraDistance,1.5,60);
},{passive:false});

window.addEventListener("touchstart",function(event){
  if(event.touches.length===2){
    initialPinchDistance=Math.hypot(
      event.touches[0].clientX-event.touches[1].clientX,
      event.touches[0].clientY-event.touches[1].clientY
    );
    initialCameraDistance=targetCameraDistance;
    return;
  }
  const touch=event.changedTouches[0];
  if(touch.identifier!==joystickTouch && cameraTouch===null){
    cameraTouch=touch.identifier;
    lastX=touch.clientX;
    lastY=touch.clientY;
  }
});

window.addEventListener("touchmove",function(event){
  if(event.touches.length===2 && initialPinchDistance!==null){
    const currentDistance=Math.hypot(
      event.touches[0].clientX-event.touches[1].clientX,
      event.touches[0].clientY-event.touches[1].clientY
    );
    if(currentDistance>0){
      const factor=initialPinchDistance/currentDistance;
      targetCameraDistance=THREE.MathUtils.clamp(initialCameraDistance*factor,1.5,60);
    }
    return;
  }
  for(let i=0;i<event.changedTouches.length;i++){
    const touch=event.changedTouches[i];
    if(touch.identifier===cameraTouch){
      const dx=touch.clientX-lastX;
      const dy=touch.clientY-lastY;
      targetCameraAngleY-=dx*.005;
      targetCameraAngleX=THREE.MathUtils.clamp(
        targetCameraAngleX+dy*.005,
        -Math.PI/2+.01,
        Math.PI/2-.05
      );
      lastX=touch.clientX;
      lastY=touch.clientY;
    }
  }
},{passive:false});

window.addEventListener("touchend",function(event){
  if(event.touches.length<2){
    initialPinchDistance=null;
  }
  for(let i=0;i<event.changedTouches.length;i++){
    if(event.changedTouches[i].identifier===cameraTouch){
      cameraTouch=null;
    }
  }
});
window.addEventListener("touchcancel",function(){
  cameraTouch=null;
  initialPinchDistance=null;
});

// ============================================================
// ANIMATIONS
// ============================================================
let animationTime=0;
let animationBlend=0;

function animateLeaves(delta,moving){
  if(!model) return;
  leafMeshes.forEach((mesh,index)=>{
    const original=initialData.get(mesh);
    if(!original) return;
    const speed=.72+(index%7)*.085;
    const phase=index*.67;
    const t=animationTime*speed+phase;
    const wave1=Math.sin(t);
    const wave2=Math.sin(t*1.73+index);
    const wave3=Math.cos(t*.57+index*.4);
    const movement=(wave1*.62+wave2*.23+wave3*.15)*animationBlend;
    const side=index%2===0?1:-1;
    mesh.rotation.z=original.rotation.z+movement*.30*side;
    mesh.rotation.x=original.rotation.x+wave3*.15*animationBlend;
    mesh.rotation.y=original.rotation.y+wave2*.10*animationBlend;
  });
}

function animateSunflower(delta,moving){
  if(!model) return;
  const target=moving?1:0;
  animationBlend=THREE.MathUtils.lerp(animationBlend,target,Math.min(delta*7,1));
  if(moving){
    animationTime+=delta*9.5;
  }
  const wave=Math.sin(animationTime);
  const bounce=Math.abs(wave)*.10*animationBlend;
  model.position.y=THREE.MathUtils.lerp(model.position.y,.22+bounce,Math.min(delta*13,1));
  model.rotation.z=THREE.MathUtils.lerp(model.rotation.z,wave*.035*animationBlend,Math.min(delta*8,1));
  animateLeaves(delta,moving);
  armMeshes.forEach((mesh,index)=>{
    const original=initialData.get(mesh);
    if(!original) return;
    const side=index%2===0?1:-1;
    mesh.rotation.z=original.rotation.z+wave*.32*side*animationBlend;
  });
  rootMeshes.forEach((mesh,index)=>{
    const original=initialData.get(mesh);
    if(!original) return;
    const side=index%2===0?1:-1;
    mesh.rotation.z=original.rotation.z+Math.sin(animationTime+Math.PI)*.20*side*animationBlend;
  });
}

// ============================================================
// GAME LOOP
// ============================================================
const clock=new THREE.Clock();

function animate(){
  requestAnimationFrame(animate);
  const delta=Math.min(clock.getDelta(),.05);
  const moving=input.lengthSq()>.01;
  if(moving){
    const forward=new THREE.Vector3(0,0,-1);
    const right=new THREE.Vector3(1,0,0);
    forward.applyAxisAngle(new THREE.Vector3(0,1,0),cameraAngleY);
    right.applyAxisAngle(new THREE.Vector3(0,1,0),cameraAngleY);
    const movement=new THREE.Vector3();
    movement.addScaledVector(right,input.x);
    movement.addScaledVector(forward,input.y);
    if(movement.lengthSq()>0){
      movement.normalize();
      velocity.x=movement.x*moveSpeed;
      velocity.z=movement.z*moveSpeed;
      if(model){
        const targetRotation=Math.atan2(movement.x,movement.z);
        let difference=targetRotation-model.rotation.y;
        difference=Math.atan2(Math.sin(difference),Math.cos(difference));
        model.rotation.y+=difference*Math.min(delta*10,1);
      }
    }
  }else{
    velocity.x=0;
    velocity.z=0;
  }
  animateSunflower(delta,moving);
  if(isFlying){
    if(isJumpHolding){
      velocity.y=THREE.MathUtils.lerp(velocity.y,50,delta*5);
    }else{
      velocity.y=THREE.MathUtils.lerp(velocity.y,0,delta*3);
    }
  }else{
    velocity.y+=gravity*delta;
  }
  player.position.y+=velocity.y*delta;
  if(player.position.y<=0){
    player.position.y=0;
    velocity.y=0;
    grounded=true;
    if(isFlying){
      isFlying=false;
      jump.classList.remove("flying");
      moveSpeed=walkSpeed;
    }
  }
  player.position.x+=velocity.x*delta;
  player.position.z+=velocity.z*delta;
  cameraPivot.position.copy(player.position);
  cameraPivot.position.y+=1.6;
  updateCamera();
  renderer.render(scene,camera);
}
animate();

  const height=window.innerHeight;
  camera.aspect=width/height;

  renderer.setSize(width,height);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
}

  setTimeout(onResize,100);
