<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Mo Hinh Truong Hoc 3D - Cam Thuong</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #000;
            font-family: Arial, sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }

        /* Ẩn trình phát YouTube nhưng vẫn cho phép tải nhạc (dùng kỹ thuật đẩy ra ngoài hoặc thu nhỏ kích thước về 0) */
        #youtube-player-container {
            position: absolute;
            top: -9999px;
            left: -9999px;
            width: 1px;
            height: 1px;
            overflow: hidden;
            opacity: 0;
            pointer-events: none;
        }

        /* Joystick Di Chuyển */
        #joystick-zone {
            position: absolute;
            bottom: 30px;
            left: 30px;
            width: 120px;
            height: 120px;
            background: rgba(255, 255, 255, 0.15);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            touch-action: none;
            z-index: 10;
        }

        #joystick-handle {
            position: absolute;
            top: 35px;
            left: 35px;
            width: 50px;
            height: 50px;
            background: rgba(255, 255, 255, 0.7);
            border-radius: 50%;
            pointer-events: none;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        /* Nút Nhảy / Bay */
        #jump-btn {
            position: absolute;
            bottom: 50px;
            right: 40px;
            width: 75px;
            height: 75px;
            background: rgba(0, 150, 255, 0.6);
            border: 2px solid rgba(255, 255, 255, 0.8);
            border-radius: 50%;
            color: white;
            font-size: 16px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: manipulation;
            z-index: 10;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
            cursor: pointer;
        }

        #jump-btn:active {
            background: rgba(0, 150, 255, 0.9);
            transform: scale(0.95);
        }

        /* Khung Chat Kiểu Zalo / Roblox */
        #chat-container {
            position: absolute;
            bottom: 170px;
            left: 30px;
            width: 280px;
            max-height: 200px;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            z-index: 10;
            overflow: hidden;
            backdrop-filter: blur(5px);
        }

        #chat-messages {
            flex: 1;
            padding: 10px;
            overflow-y: auto;
            color: #fff;
            font-size: 13px;
            max-height: 150px;
        }

        .chat-msg {
            margin-bottom: 6px;
            word-break: break-word;
        }

        .chat-msg span.user {
            color: #4da6ff;
            font-weight: bold;
        }

        #chat-input-form {
            display: flex;
            border-top: 1px solid rgba(255, 255, 255, 0.2);
        }

        #chat-input {
            flex: 1;
            background: transparent;
            border: none;
            padding: 8px 10px;
            color: white;
            font-size: 13px;
            outline: none;
        }

        #chat-input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        /* Thông tin hướng dẫn nhỏ */
        #info-overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            background: rgba(0, 0, 0, 0.5);
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 13px;
            pointer-events: none;
            z-index: 10;
            backdrop-filter: blur(4px);
        }
    </style>
</head>
<body>

    <div id="canvas-container"></div>

    <!-- Trình phát YouTube ẩn nhưng hoạt động đầy đủ -->
    <div id="youtube-player-container">
        <div id="youtube-player"></div>
    </div>

    <!-- Joystick Điều Khiển -->
    <div id="joystick-zone">
        <div id="joystick-handle"></div>
    </div>

    <!-- Nút Nhảy -->
    <div id="jump-btn">NHẢY</div>

    <!-- Khung Chat -->
    <div id="chat-container">
        <div id="chat-messages">
            <div class="chat-msg"><span class="user">Hệ thống:</span> Chào mừng bạn đến Cam Thượng School! Gõ phím T để bật nhạc, F để dừng.</div>
        </div>
        <form id="chat-input-form">
            <input type="text" id="chat-input" placeholder="Nhập tin nhắn hoặc lệnh...">
        </form>
    </div>

    <div id="info-overlay">
        <strong>Trường THCS Cam Thượng</strong><br>
        Sử dụng Joystick để di chuyển.
    </div>

    <!-- Thư viện Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- YouTube IFrame API -->
    <script src="https://www.youtube.com/iframe_api"></script>

    <script>
        // --- 1. KHỞI TẠO YOUTUBE PLAYER ---
        let player;
        function onYouTubeIframeAPIReady() {
            player = new YT.Player('youtube-player', {
                height: '1',
                width: '1',
                videoId: '6dEKnnPzxSc',
                playerVars: {
                    'autoplay': 1,
                    'controls': 0,
                    'loop': 1,
                    'playlist': '6dEKnnPzxSc'
                },
                events: {
                    'onReady': (event) => {
                        event.target.playVideo();
                        event.target.setVolume(50);
                    }
                }
            });
        }

        // --- 2. THREE.JS SCENE SETUP ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb); // Bầu trời xanh
        scene.fog = new THREE.FogExp2(0x87ceeb, 0.015);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        container.appendChild(renderer.domElement);

        // Ánh sáng
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(50, 100, 50);
        dirLight.castShadow = true;
        scene.add(dirLight);

        // --- 3. XÂY DỰNG MÔ HÌNH TRƯỜNG HỌC ---
        // Sân trường
        const groundGeo = new THREE.PlaneGeometry(300, 300);
        const groundMat = new THREE.MeshStandardMaterial({ color: 0x335533, roughness: 0.9 });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);

        // Sân bê tông chính
        const courtyardGeo = new THREE.PlaneGeometry(80, 100);
        const courtyardMat = new THREE.MeshStandardMaterial({ color: 0xcccccc, roughness: 0.8 });
        const courtyard = new THREE.Mesh(courtyardGeo, courtyardMat);
        courtyard.rotation.x = -Math.PI / 2;
        courtyard.position.set(0, 0.05, 0);
        courtyard.receiveShadow = true;
        scene.add(courtyard);

        // Tạo Tòa nhà lớp học đơn giản
        function createSchoolBuilding(x, z, width, depth, height) {
            const buildingGroup = new THREE.Group();

            const bodyGeo = new THREE.BoxGeometry(width, height, depth);
            const bodyMat = new THREE.MeshStandardMaterial({ color: 0xfffaed, roughness: 0.7 });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.position.y = height / 2;
            body.castShadow = true;
            body.receiveShadow = true;
            buildingGroup.add(body);

            // Mái trường
            const roofGeo = new THREE.BoxGeometry(width + 2, 1, depth + 2);
            const roofMat = new THREE.MeshStandardMaterial({ color: 0xb22222 });
            const roof = new THREE.Mesh(roofGeo, roofMat);
            roof.position.y = height + 0.5;
            roof.castShadow = true;
            buildingGroup.add(roof);

            buildingGroup.position.set(x, 0, z);
            scene.add(buildingGroup);
        }

        // Xây dựng các tòa xung quanh sân
        createSchoolBuilding(0, -70, 100, 20, 15); // Tòa nhà chính phía sau
        createSchoolBuilding(-60, 0, 20, 80, 15);  // Tòa nhà cánh trái
        createSchoolBuilding(60, 0, 20, 80, 15);   // Tòa nhà cánh phải

        // --- 4. NHÂN VÂN & ĐIỀU KHIỂN ---
        const playerGroup = new THREE.Group();
        const playerBodyGeo = new THREE.BoxGeometry(1, 2, 1);
        const playerBodyMat = new THREE.MeshStandardMaterial({ color: 0x1e90ff });
        const playerMesh = new THREE.Mesh(playerBodyGeo, playerBodyMat);
        playerMesh.position.y = 1;
        playerMesh.castShadow = true;
        playerGroup.add(playerMesh);
        scene.add(playerGroup);

        let playerPos = { x: 0, z: 40 };
        let playerY = 0;
        let velocityY = 0;
        let isJumping = false;
        let moveVector = { x: 0, y: 0 };

        // --- 5. XỬ LÝ JOYSTICK & TOUCH/KEYBOARD ---
        const joystickZone = document.getElementById('joystick-zone');
        const joystickHandle = document.getElementById('joystick-handle');
        let joystickTouchId = null;
        let joystickCenter = { x: 0, y: 0 };

        joystickZone.addEventListener('touchstart', (e) => {
            if (joystickTouchId !== null) return;
            const touch = e.changedTouches[0];
            joystickTouchId = touch.identifier;
            const rect = joystickZone.getBoundingClientRect();
            joystickCenter = { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 };
        });

        window.addEventListener('touchmove', (e) => {
            if (joystickTouchId === null) return;
            for (let i = 0; i < e.changedTouches.length; i++) {
                const touch = e.changedTouches[i];
                if (touch.identifier === joystickTouchId) {
                    const dx = touch.clientX - joystickCenter.x;
                    const dy = touch.clientY - joystickCenter.y;
                    const dist = Math.min(50, Math.sqrt(dx * dx + dy * dy));
                    const angle = Math.atan2(dy, dx);

                    const hx = Math.cos(angle) * dist;
                    const hy = Math.sin(angle) * dist;
                    joystickHandle.style.transform = `translate(${hx}px, ${hy}px)`;

                    moveVector.x = hx / 50;
                    moveVector.y = hy / 50;
                }
            }
        });

        window.addEventListener('touchend', (e) => {
            for (let i = 0; i < e.changedTouches.length; i++) {
                if (e.changedTouches[i].identifier === joystickTouchId) {
                    joystickTouchId = null;
                    joystickHandle.style.transform = `translate(0px, 0px)`;
                    moveVector.x = 0;
                    moveVector.y = 0;
                }
            }
        });

        // Nút nhảy
        document.getElementById('jump-btn').addEventListener('click', () => {
            if (!isJumping) {
                velocityY = 0.3;
                isJumping = true;
            }
        });

        // Phím tắt bàn phím (Hỗ trợ máy tính / giả lập)
        const keys = {};
        window.addEventListener('keydown', (e) => {
            keys[e.key.toLowerCase()] = true;
            if (e.key.toLowerCase() === 't' && player && player.playVideo) player.playVideo();
            if (e.key.toLowerCase() === 'f' && player && player.pauseVideo) player.pauseVideo();
        });
        window.addEventListener('keyup', (e) => {
            keys[e.key.toLowerCase()] = false;
        });

        // --- 6. HỆ THỐNG CHAT & LỆNH ---
        const chatForm = document.getElementById('chat-input-form');
        const chatInput = document.getElementById('chat-input');
        const chatMessages = document.getElementById('chat-messages');

        chatForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const text = chatInput.value.trim();
            if (!text) return;

            addChatMessage("Bạn", text);
            
            // Xử lý lệnh đơn giản
            if (text.toLowerCase() === '/nhac') {
                if (player && player.playVideo) player.playVideo();
                addChatMessage("Hệ thống", "Đã phát nhạc nền!");
            } else if (text.toLowerCase() === '/dung') {
                if (player && player.pauseVideo) player.pauseVideo();
                addChatMessage("Hệ thống", "Đã dừng nhạc nền!");
            }

            chatInput.value = '';
            chatMessages.scrollTop = chatMessages.scrollHeight;
        });

        function addChatMessage(sender, msg) {
            const div = document.createElement('div');
            div.className = 'chat-msg';
            div.innerHTML = `<span class="user">${sender}:</span> ${msg}`;
            chatMessages.appendChild(div);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        // --- 7. VÒNG LẶP RENDER & CẬP NHẬT ---
        function animate() {
            requestAnimationFrame(animate);

            // Xử lý di chuyển bàn phím
            let currentMoveX = moveVector.x;
            let currentMoveZ = moveVector.y;

            if (keys['w'] || keys['arrowup']) currentMoveZ = -1;
            if (keys['s'] || keys['arrowdown']) currentMoveZ = 1;
            if (keys['a'] || keys['arrowleft']) currentMoveX = -1;
            if (keys['d'] || keys['arrowright']) currentMoveX = 1;

            if (keys[' ']) {
                if (!isJumping) {
                    velocityY = 0.3;
                    isJumping = true;
                }
            }

            // Cập nhật vị trí nhân vật
            playerPos.x += currentMoveX * 0.4;
            playerPos.z += currentMoveZ * 0.4;

            // Xử lý nhảy & trọng lực
            if (isJumping) {
                playerY += velocityY;
                velocityY -= 0.015;
                if (playerY <= 0) {
                    playerY = 0;
                    isJumping = false;
                    velocityY = 0;
                }
            }

            playerGroup.position.set(playerPos.x, playerY, playerPos.z);

            // Camera bám theo nhân vật
            camera.position.set(playerPos.x, playerPos.y + 8, playerPos.z + 15);
            camera.lookAt(playerPos.x, playerPos.y + 1, playerPos.z);

            renderer.render(scene, camera);
        }

        animate();

        // Responsive khi đổi kích thước màn hình
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
