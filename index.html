<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scarlet - Khám Phá</title>
    <style>
        :root {
            --bg-color: #070b19;
            --accent-color: #38bdf8;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --card-bg: rgba(30, 41, 59, 0.9);
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0b0f19;
            color: var(--text-primary);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .phone-frame {
            width: 100%;
            max-width: 420px;
            height: 100%;
            max-height: 840px;
            background-color: var(--bg-color);
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 10px 40px rgba(0,0,0,0.6);
            overflow: hidden;
            border: 4px solid #1e293b;
            border-radius: 36px;
        }

        .content-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        .header {
            padding: 16px 20px;
            font-size: 1.15rem;
            font-weight: 600;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(15, 23, 42, 0.9);
            z-index: 10;
        }

        .connect-btn {
            background: var(--accent-color);
            color: #0f172a;
            border: none;
            padding: 8px 16px;
            font-weight: 600;
            font-size: 0.85rem;
            border-radius: 16px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(56, 189, 248, 0.3);
            transition: all 0.2s ease;
        }

        .map-container {
            position: relative;
            flex: 1;
            background: radial-gradient(circle at center, #1e293b 0%, var(--bg-color) 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            display: none;
        }

        .ambient-ring {
            position: absolute;
            width: 340px;
            height: 340px;
            border: 2px dashed rgba(56, 189, 248, 0.2);
            border-radius: 50%;
            animation: rotateBg 20s linear infinite;
        }
        
        @keyframes rotateBg { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        .convergence-core {
            position: absolute;
            width: 14px;
            height: 14px;
            background: var(--accent-color);
            border-radius: 50%;
            box-shadow: 0 0 20px var(--accent-color);
            z-index: 2;
        }

        .bottom-nav {
            height: 60px;
            background: rgba(15, 23, 42, 0.98);
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 40;
        }

        .nav-item {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 0.75rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
        }

        .nav-item.active { color: var(--accent-color); font-weight: 600; }
        .nav-item span.icon { font-size: 1.15rem; margin-bottom: 2px; }
    </style>
</head>
<body>
    <div class="phone-frame">
        <div class="content-area">
            <div class="header">
                <span>Scarlet</span>
                <button class="connect-btn" onclick="startSearch()">Kết Nối</button>
            </div>
            
            <div id="mapContainer" class="map-container">
                <div class="ambient-ring"></div>
                <div class="convergence-core"></div>
            </div>
        </div>

        <div class="bottom-nav">
            <button class="nav-item">
                <span class="icon">💬</span>
                <span>Trò chuyện</span>
            </button>
            <button class="nav-item active">
                <span class="icon">📍</span>
                <span>Khám phá</span>
            </button>
            <button class="nav-item">
                <span class="icon">👤</span>
                <span>Cá nhân</span>
            </button>
        </div>
    </div>

    <script>
        function startSearch() {
            const map = document.getElementById('mapContainer');
            alert("Đang quét tìm bạn bè...");
            setTimeout(() => {
                map.style.display = 'flex';
                alert("Đã tìm thấy bạn bè!");
            }, 2000);
        }
    </script>
</body>
</html>
