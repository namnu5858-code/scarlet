<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>3D World</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: sans-serif;
        }
        #webgl-container {
            width: 100%;
            height: 100%;
            display: block;
        }
        .ui-btn {
            position: absolute;
            background: rgba(255, 255, 255, 0.3);
            border: 2px solid rgba(255, 255, 255, 0.6);
            border-radius: 50%;
            touch-action: none;
        }
        #joystick-container {
            bottom: 30px;
            left: 30px;
            width: 120px;
            height: 120px;
        }
        #joystick-knob {
            position: absolute;
            top: 35px;
            left: 35px;
            width: 50px;
            height: 50px;
            background: rgba(255, 255, 255, 0.7);
            border-radius: 50%;
        }
        #btn-fly {
            bottom: 40px;
            right: 40px;
            width: 80px;
            height: 80px;
            background: rgba(255, 200, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 30px;
            color: white;
            font-weight: bold;
        }
        #btn-fly:active {
            background: rgba(255, 200, 0, 0.8);
        }
    </style>
    <!-- Three.js library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="webgl-container"></div>

    <div id="joystick-container" class="ui-btn">
        <div id="joystick-knob"></div>
    </div>

    <div id="btn-fly" class="ui-btn">↑</div>

    <script>
        // --- CẤU HÌNH CƠ BẢN ---
        const container = document.getElementById('webgl-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        container.appendChild(renderer.domElement);

        // --- ÁNH SÁNG ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(50, 100, 50);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 2048;
        dirLight.shadow.mapSize.height = 2048;
        scene.add(dirLight);

        // --- SÀN LÁT GẠCH (BỀ MẶT) ---
        const floorY = 0; // Đỉnh của mặt đất
        const floorSize = 200;
        
        // Tạo gạch nền
        const gridHelper = new THREE.GridHelper(floorSize, 40, 0x444444, 0x888888);
        gridHelper.position.y = floorY + 0.01;
        scene.add(gridHelper);

        const floorGeo = new THREE.PlaneGeometry(floorSize, floorSize);
        const floorMat = new THREE.MeshStandardMaterial({ color: 0xc2593f, roughness: 0.6 });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        floor.position.y = floorY;
        floor.receiveShadow = true;
        scene.add(floor);

        // --- TÒA NHÀ & MÔ TRƯỜNG ---
        function createBuilding(x, z, w, h, d, color) {
            const geo = new THREE.BoxGeometry(w, h, d);
            const mat = new THREE.MeshStandardMaterial({ color: color });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.set(x, h / 2, z);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            scene.add(mesh);
        }

        createBuilding(-20, -30, 15, 25, 40, 0x2b5b84);
        createBuilding(20, -30, 15, 25, 40, 0x2b5b84);
        createBuilding(0, -60, 50, 15, 10, 0x333333);

        // --- NHÂN VẬT ---
        const playerGroup = new THREE.Group();
        playerGroup.position.set(0, floorY, 0);
        scene.add(playerGroup);

        const charGeo = new THREE.SphereGeometry(0.8, 16, 16);
        const charMat = new THREE.MeshStandardMaterial({ color: 0x111111 });
        const charMesh = new THREE.Mesh(charGeo, charMat);
        charMesh.position.y = 0.8;
        charMesh.castShadow = true;
        playerGroup.add(charMesh);

        // --- CAMERA PIVOT & KHÔNG CHO XUYÊN ĐẤT ---
        const cameraPivot = new THREE.Group();
        playerGroup.add(cameraPivot);
        cameraPivot.position.y = 1.2; // Chiều cao ngang tầm mắt/đầu nhân vật

        let camDistance = 8;
        camera.position.set(0, 0, camDistance);
        cameraPivot.add(camera);

        let pitch = 0; // Góc xoay lên/xuống
        let yaw = 0;   // Góc xoay trái/phải

        // --- ĐIỀU KHIỂN & BAY ---
        let isFlyingPressed = false;
        const flySpeed = 18; // Tốc độ bay lên nhanh
        const gravity = 25;
        let verticalVelocity = 0;

        const joystickContainer = document.getElementById('joystick-container');
        const joystickKnob = document.getElementById('joystick-knob');
        const btnFly = document.getElementById('btn-fly');

        let joystickActive = false;
        let joystickVector = { x: 0, y: 0 };
        let joystickTouchId = null;

        // Joystick Touch Events
        joystickContainer.addEventListener('touchstart', (e) => {
            e.preventDefault();
            const touch = e.changedTouches[0];
            joystickTouchId = touch.identifier;
            joystickActive = true;
            updateJoystick(touch);
        }, { passive: false });

        window.addEventListener('touchmove', (e) => {
            if (!joystickActive) return;
            for (let i = 0; i < e.changedTouches.length; i++) {
                if (e.changedTouches[i].identifier === joystickTouchId) {
                    updateJoystick(e.changedTouches[i]);
                    break;
                }
            }
        }, { passive: false });

        function endJoystick(e) {
            if (!joystickActive) return;
            for (let i = 0; i < e.changedTouches.length; i++) {
                if (e.changedTouches[i].identifier === joystickTouchId) {
                    joystickActive = false;
                    joystickVector = { x: 0, y: 0 };
                    joystickKnob.style.transform = `translate(0px, 0px)`;
                    break;
                }
            }
        }
        window.addEventListener('touchend', endJoystick);
        window.addEventListener('touchcancel', endJoystick);

        function updateJoystick(touch) {
            const rect = joystickContainer.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            let dx = touch.clientX - centerX;
            let dy = touch.clientY - centerY;
            const maxRadius = rect.width / 2;
            const dist = Math.hypot(dx, dy);

            if (dist > maxRadius) {
                dx = (dx / dist) * maxRadius;
                dy = (dy / dist) * maxRadius;
            }

            joystickKnob.style.transform = `translate(${dx}px, ${dy}px)`;
            joystickVector.x = dx / maxRadius;
            joystickVector.y = dy / maxRadius;
        }

        // Fly Button Touch Events (Nhấn giữ để bay)
        btnFly.addEventListener('touchstart', (e) => {
            e.preventDefault();
            isFlyingPressed = true;
        }, { passive: false });

        btnFly.addEventListener('touchend', (e) => {
            e.preventDefault();
            isFlyingPressed = false;
        }, { passive: false });

        // --- XOAY CAMERA BẰNG CẢM ỨNG (TOUCH SWIPE) ---
        let cameraTouchId = null;
        let lastTouchX = 0;
        let lastTouchY = 0;

        window.addEventListener('touchstart', (e) => {
            for (let i = 0; i < e.changedTouches.length; i++) {
                const touch = e.changedTouches[i];
                // Nếu touch không phải vào joystick hay nút bay
                if (touch.clientX > window.innerWidth / 3 && cameraTouchId === null) {
                    cameraTouchId = touch.identifier;
                    lastTouchX = touch.clientX;
                    lastTouchY = touch.clientY;
                }
            }
        });

        window.addEventListener('touchmove', (e) => {
            for (let i = 0; i < e.changedTouches.length; i++) {
                const touch = e.changedTouches[i];
                if (touch.identifier === cameraTouchId) {
                    const deltaX = touch.clientX - lastTouchX;
                    const deltaY = touch.clientY - lastTouchY;

                    yaw -= deltaX * 0.005;
                    pitch -= deltaY * 0.005;

                    // Giới hạn pitch tự do nhìn lên bầu trời nhưng giới hạn không bao giờ đâm xuống đất
                    pitch = Math.max(-Math.PI / 2 + 0.05, Math.min(Math.PI / 2 - 0.05, pitch));

                    lastTouchX = touch.clientX;
                    lastTouchY = touch.clientY;
                }
            }
        });

        function endCameraTouch(e) {
            for (let i = 0; i < e.changedTouches.length; i++) {
                if (e.changedTouches[i].identifier === cameraTouchId) {
                    cameraTouchId = null;
                }
            }
        }
        window.addEventListener('touchend', endCameraTouch);
        window.addEventListener('touchcancel', endCameraTouch);

        // --- GAME LOOP & TÍNH TOÁN VỊ TRÍ CAMERA ---
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();

            // 1. Xử lý bay & Trọng lực
            if (isFlyingPressed) {
                verticalVelocity = flySpeed;
            } else {
                verticalVelocity -= gravity * delta;
            }

            playerGroup.position.y += verticalVelocity * delta;

            // Chạm đất
            if (playerGroup.position.y < floorY) {
                playerGroup.position.y = floorY;
                verticalVelocity = 0;
            }

            // 2. Xử lý di chuyển nhân vật theo Joystick
            if (joystickVector.x !== 0 || joystickVector.y !== 0) {
                const moveSpeed = 8 * delta;
                const moveAngle = Math.atan2(-joystickVector.x, -joystickVector.y) + yaw;

                playerGroup.position.x += Math.sin(moveAngle) * moveSpeed;
                playerGroup.position.z += Math.cos(moveAngle) * moveSpeed;

                playerGroup.rotation.y = yaw;
            }

            // 3. Cập nhật góc Xoay Camera Pivot
            cameraPivot.rotation.y = yaw;
            cameraPivot.rotation.x = pitch;

            // 4. KHÓA CAMERA TUYỆT ĐỐI KHÔNG XUYÊN QUA BỀ MẶT ĐẤT
            cameraPivot.updateMatrixWorld();
            const worldCamPos = new THREE.Vector3();
            camera.getWorldPosition(worldCamPos);

            // Tối thiểu Camera phải cao hơn mặt đất lát gạch 0.3 đơn vị
            const minCamHeight = floorY + 0.3;
            if (worldCamPos.y < minCamHeight) {
                worldCamPos.y = minCamHeight;
                camera.position.y = cameraPivot.worldToLocal(worldCamPos).y;
            } else {
                camera.position.set(0, 0, camDistance);
            }

            renderer.render(scene, camera);
        }

        animate();

        // --- THÍCH ỨNG MÀN HÌNH ---
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
