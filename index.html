<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>Cam Thung Middle School - 3D Campus</title>

<style>
*{
  box-sizing:border-box;
  -webkit-user-select:none;
  user-select:none;
  -webkit-touch-callout:none;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#8fd4f5;
  touch-action:none;
  font-family:Arial,sans-serif;
}

#game-container{
  position:fixed;
  top:0;
  left:0;
  width:100vw;
  height:100vh;
  z-index:1;
}

canvas{
  display:block;
  width:100vw !important;
  height:100vh !important;
}

.glass-ui{
  background:rgba(255,255,255,.18);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  border:1px solid rgba(255,255,255,.4);
  box-shadow:0 8px 32px rgba(0,0,0,.18);
}

#joystick-wrapper{
  position:absolute;
  left:32px;
  bottom:32px;
  width:120px;
  height:120px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:20;
  touch-action:none;
}

#joystick-stick{
  position:absolute;
  width:52px;
  height:52px;
  border-radius:50%;
  background:rgba(255,255,255,.58);
  border:1px solid rgba(255,255,255,.85);
  box-shadow:0 4px 14px rgba(0,0,0,.18);
  pointer-events:none;
}

#jump-btn{
  position:absolute;
  right:32px;
  bottom:38px;
  width:72px;
  height:72px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:20;
  touch-action:none;
  transition:background .3s ease,transform .1s ease;
}

#jump-btn.flying{
  background:rgba(255,215,0,.55);
  border-color:rgba(255,255,255,.9);
  box-shadow:0 0 15px rgba(255,215,0,.6);
}

#jump-btn:active{
  transform:scale(.94);
}

#jump-btn svg{
  width:34px;
  height:34px;
  fill:none;
  stroke:white;
  stroke-width:2.5;
  stroke-linecap:round;
  stroke-linejoin:round;
}

#loading{
  position:absolute;
  top:14px;
  right:16px;
  padding:8px 14px;
  border-radius:10px;
  background:rgba(0,0,0,.42);
  color:white;
  font-size:12px;
  z-index:30;
  pointer-events:none;
}
</style>

<script type="importmap">
{
  "imports":{
    "three":"https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>

<body>

<div id="game-container"></div>

<div id="loading">
Đang dựng khuôn viên trường 3D...
</div>

<div id="joystick-wrapper" class="glass-ui">
  <div id="joystick-stick"></div>
</div>

<div id="jump-btn" class="glass-ui">
  <svg viewBox="0 0 24 24">
    <path d="M12 19V5"></path>
    <path d="M5 12l7-7 7 7"></path>
  </svg>
</div>

<script type="module">

import * as THREE from "three";
import {GLTFLoader} from "three/addons/loaders/GLTFLoader.js";

const YOUTUBE_API_KEY = "AIzaSyCNhZt6ZKBuvcIbj_z7Nybmwai0YNzq8SU";

// ============================================================
// SCENE & RENDERER
// ============================================================

const container=document.getElementById("game-container");
const loading=document.getElementById("loading");

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x8fd4f5);
scene.fog=new THREE.FogExp2(0xbfeafa, 0.0012);

const cameraPivot=new THREE.Object3D();
scene.add(cameraPivot);

const camera=new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 3000);
cameraPivot.add(camera);

let cameraDistance=10;
let targetCameraDistance=10;
let cameraAngleX=0.1;
let cameraAngleY=0;
let targetCameraAngleX=0.1;
let targetCameraAngleY=0;

const renderer=new THREE.WebGLRenderer({
  antialias:true,
  powerPreference:"high-performance"
});

renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.12;

container.appendChild(renderer.domElement);

// ============================================================
// CAMERA COLLISION
// ============================================================

const raycaster=new THREE.Raycaster();
const cameraCollisionObjects=[];

function updateCamera(){
  cameraAngleY=THREE.MathUtils.lerp(cameraAngleY, targetCameraAngleY, 0.18);
  cameraAngleX=THREE.MathUtils.lerp(cameraAngleX, targetCameraAngleX, 0.18);
  cameraDistance=THREE.MathUtils.lerp(cameraDistance, targetCameraDistance, 0.12);

  cameraPivot.rotation.y=cameraAngleY;
  cameraPivot.rotation.x=cameraAngleX;

  const origin=cameraPivot.position.clone();
  const dir=new THREE.Vector3(0,0,1).applyQuaternion(cameraPivot.quaternion);

  raycaster.set(origin,dir);
  let actualDistance=cameraDistance;

  if(cameraCollisionObjects.length>0){
    const hits=raycaster.intersectObjects(cameraCollisionObjects, true);
    if(hits.length>0 && hits[0].distance<cameraDistance){
      actualDistance=Math.max(hits[0].distance-0.3, 0.5);
    }
  }

  camera.position.set(0, 0, actualDistance);
  camera.lookAt(cameraPivot.position);
}

// ============================================================
// LIGHTING
// ============================================================

const hemisphere=new THREE.HemisphereLight(0xe8f8ff, 0x516b3b, 1.5);
scene.add(hemisphere);

const sunlight=new THREE.DirectionalLight(0xfff3d2, 2.2);
sunlight.position.set(100,130,80);
sunlight.castShadow=true;
sunlight.shadow.mapSize.width=2048;
sunlight.shadow.mapSize.height=2048;
sunlight.shadow.camera.near=1;
sunlight.shadow.camera.far=400;
sunlight.shadow.camera.left=-250;
sunlight.shadow.camera.right=250;
sunlight.shadow.camera.top=250;
sunlight.shadow.camera.bottom=-250;
sunlight.shadow.bias=-0.0003;
scene.add(sunlight);

// ============================================================
// MATERIALS
// ============================================================

const MAT={};
MAT.redTile=new THREE.MeshStandardMaterial({color:0xa94c3d, roughness:.78});
MAT.lightBlue=new THREE.MeshStandardMaterial({color:0x9ed9ec, roughness:.7});
MAT.white=new THREE.MeshStandardMaterial({color:0xf4f5f0, roughness:.72});
MAT.yellow=new THREE.MeshStandardMaterial({color:0xe7d16a, roughness:.8});
MAT.darkMetal=new THREE.MeshStandardMaterial({color:0x30383b, roughness:.55, metalness:.65});
MAT.steel=new THREE.MeshStandardMaterial({color:0xadb7ba, roughness:.35, metalness:.8});
MAT.roofMetal=new THREE.MeshStandardMaterial({color:0x68777b, roughness:.65, metalness:.45});
MAT.glass=new THREE.MeshPhysicalMaterial({color:0x76b9d2, roughness:.08, metalness:.05, transparent:true, opacity:.68});
MAT.concrete=new THREE.MeshStandardMaterial({color:0xb8b9b3, roughness:.9});

function box(w, h, d, x, y, z, material, parent=scene){
  const mesh=new THREE.Mesh(new THREE.BoxGeometry(w,h,d), material);
  mesh.position.set(x,y,z);
  mesh.castShadow=true;
  mesh.receiveShadow=true;
  parent.add(mesh);
  return mesh;
}

// ============================================================
// CAMPUS & GROUND
// ============================================================

const campus=new THREE.Group();
scene.add(campus);

const baseGround=box(2500, 1, 2500, 0, -0.7, 0, new THREE.MeshStandardMaterial({color:0x73b951, roughness:1}), campus);
cameraCollisionObjects.push(baseGround);

const courtyard=box(240, .45, 190, 0, 0, 0, MAT.redTile, campus);
cameraCollisionObjects.push(courtyard);

// ============================================================
// MÀN HÌNH 3D YOUTUBE TRỰC TIẾP
// ============================================================

const screenGroup=new THREE.Group();
campus.add(screenGroup);

const SCREEN_X=-10;
const SCREEN_Z=10;
const SCREEN_W=16.0;
const SCREEN_H=9.0;

const screenCanvas=document.createElement('canvas');
screenCanvas.width=2048;
screenCanvas.height=1152;
const ctx=screenCanvas.getContext('2d');

let searchResults = [];
let currentSearchQuery = "THCS Cẩm Thung";
let isSearching = false;
let selectedVideoTitle = "Đang sẵn sàng phát video...";

const screenTexture=new THREE.CanvasTexture(screenCanvas);
screenTexture.colorSpace=THREE.SRGBColorSpace;

function drawScreenUI(){
  ctx.fillStyle='#0f0f0f';
  ctx.fillRect(0,0,2048,1152);

  // Thanh tiêu đề YouTube
  ctx.fillStyle='#212121';
  ctx.fillRect(0,0,2048,120);

  ctx.fillStyle='#ff0000';
  ctx.beginPath();
  ctx.roundRect(40,30,90,60,12);
  ctx.fill();

  ctx.fillStyle='#ffffff';
  ctx.beginPath();
  ctx.moveTo(75,48);
  ctx.lineTo(98,60);
  ctx.lineTo(75,72);
  ctx.fill();

  ctx.font='bold 42px Arial';
  ctx.textAlign='left';
  ctx.fillText('YouTube 3D Campus',150,72);

  // Thanh Tìm kiếm (Chạm vào đây để tìm)
  ctx.fillStyle='#121212';
  ctx.beginPath();
  ctx.roundRect(700,25,850,70,35);
  ctx.fill();
  ctx.strokeStyle='#303030';
  ctx.lineWidth=3;
  ctx.stroke();

  ctx.fillStyle='#aaaaaa';
  ctx.font='30px Arial';
  ctx.fillText(`🔍 ${currentSearchQuery}`,730,70);

  // Khu vực phát Video chính (Bên trái)
  ctx.fillStyle='#000000';
  ctx.fillRect(40,150,1280,720);
  ctx.strokeStyle='#303030';
  ctx.strokeRect(40,150,1280,720);

  // Nút Play lớn ở giữa
  ctx.beginPath();
  ctx.arc(680,510,70,0,Math.PI*2);
  ctx.fillStyle='rgba(255,0,0,0.85)';
  ctx.fill();

  ctx.beginPath();
  ctx.moveTo(665,475);
  ctx.lineTo(710,510);
  ctx.lineTo(665,545);
  ctx.fillStyle='#ffffff';
  ctx.fill();

  // Tiêu đề video đang chọn
  ctx.fillStyle='#ffffff';
  ctx.font='bold 36px Arial';
  ctx.fillText(selectedVideoTitle,40,920);

  // Danh sách video liên quan (Bên phải)
  ctx.fillStyle='#aaaaaa';
  ctx.font='bold 32px Arial';
  ctx.fillText('Danh sách Video',1360,180);

  for(let i=0; i<4; i++){
    const y = 210 + i * 220;
    ctx.fillStyle='#1f1f1f';
    ctx.beginPath();
    ctx.roundRect(1360, y, 640, 200, 16);
    ctx.fill();

    if(searchResults[i]){
      // Vẽ Thumbnail / Thông tin
      ctx.fillStyle='#333';
      ctx.fillRect(1375, y+20, 250, 160);

      ctx.fillStyle='#ffffff';
      ctx.font='bold 26px Arial';
      let title = searchResults[i].snippet.title;
      if(title.length > 25) title = title.substring(0, 25) + '...';
      ctx.fillText(title, 1640, y+60);

      ctx.fillStyle='#888888';
      ctx.font='22px Arial';
      ctx.fillText(searchResults[i].snippet.channelTitle, 1640, y+110);
    } else {
      ctx.fillStyle='#555555';
      ctx.font='24px Arial';
      ctx.fillText(`Video gợi ý ${i+1}`, 1520, y+110);
    }
  }

  screenTexture.needsUpdate = true;
}

async function fetchYouTubeData(query){
  if(isSearching) return;
  isSearching = true;
  selectedVideoTitle = "Đang tải danh sách...";
  drawScreenUI();

  try{
    const url = `https://www.googleapis.com/youtube/v3/search?part=snippet&maxResults=4&q=${encodeURIComponent(query)}&type=video&key=${YOUTUBE_API_KEY}`;
    const res = await fetch(url);
    const data = await res.json();

    if(data.items && data.items.length > 0){
      searchResults = data.items;
      selectedVideoTitle = searchResults[0].snippet.title;
    } else {
      selectedVideoTitle = "Không tìm thấy kết quả nào.";
    }
  } catch(e) {
    selectedVideoTitle = "Lỗi kết nối API YouTube.";
  }

  isSearching = false;
  drawScreenUI();
}

drawScreenUI();
fetchYouTubeData(currentSearchQuery);

const screenFrameMaterial=new THREE.MeshStandardMaterial({color:0x111315, roughness:.2, metalness:.85});
const screenDisplayMaterial=new THREE.MeshBasicMaterial({map:screenTexture});

box(SCREEN_W+.6, SCREEN_H+.6, 0.3, SCREEN_X, (SCREEN_H+.6)/2+1.2, SCREEN_Z, screenFrameMaterial, screenGroup);
const interactiveScreen=box(SCREEN_W, SCREEN_H, 0.32, SCREEN_X, SCREEN_H/2+1.5, SCREEN_Z-.02, screenDisplayMaterial, screenGroup);

box(.6, 3.0, .6, SCREEN_X-5.5, 0, SCREEN_Z, screenFrameMaterial, screenGroup);
box(.6, 3.0, .6, SCREEN_X+5.5, 0, SCREEN_Z, screenFrameMaterial, screenGroup);

// ============================================================
// CHẠM TRỰC TIẾP LÊN MÀN HÌNH 3D TO INTERACT
// ============================================================

const screenRaycaster=new THREE.Raycaster();
const screenPointer=new THREE.Vector2();

function handleScreenClick(clientX, clientY){
  const rect=renderer.domElement.getBoundingClientRect();
  screenPointer.x=((clientX-rect.left)/rect.width)*2-1;
  screenPointer.y=-((clientY-rect.top)/rect.height)*2+1;

  screenRaycaster.setFromCamera(screenPointer, camera);
  const hits=screenRaycaster.intersectObject(interactiveScreen, true);

  if(hits.length>0 && hits[0].uv){
    const uv = hits[0].uv;
    const canvasX = uv.x * 2048;
    const canvasY = (1 - uv.y) * 1152;

    // Chạm vào thanh Tìm kiếm
    if(canvasX >= 700 && canvasX <= 1550 && canvasY >= 25 && canvasY <= 95){
      const newQuery = prompt("Nhập từ khóa tìm kiếm YouTube:", currentSearchQuery);
      if(newQuery && newQuery.trim() !== ""){
        currentSearchQuery = newQuery.trim();
        fetchYouTubeData(currentSearchQuery);
      }
    }

    // Chạm vào các Video bên phải
    if(canvasX >= 1360 && canvasX <= 2000){
      for(let i=0; i<4; i++){
        const y = 210 + i * 220;
        if(canvasY >= y && canvasY <= y + 200){
          if(searchResults[i]){
            selectedVideoTitle = searchResults[i].snippet.title;
            drawScreenUI();
          }
        }
      }
    }
  }
}

renderer.domElement.addEventListener("click", (e) => {
  handleScreenClick(e.clientX, e.clientY);
});

// ============================================================
// PLAYER & GAME LOOP
// ============================================================

const player=new THREE.Group();
scene.add(player);

const loader=new GLTFLoader();
loader.load("scene.gltf", (gltf) => {
  const model=gltf.scene;
  model.position.y=.22;
  player.add(model);
  loading.style.display="none";
}, undefined, () => {
  loading.textContent="Đang chạy mô hình sân trường 3D";
});

const input=new THREE.Vector2(0,0);
const joystick=document.getElementById("joystick-wrapper");
const stick=document.getElementById("joystick-stick");

let joystickTouch=null;

joystick.addEventListener("touchstart", (e) => {
  e.preventDefault();
  const touch=e.changedTouches[0];
  joystickTouch=touch.identifier;
  updateJoystick(touch);
}, {passive:false});

function updateJoystick(touch){
  const rect=joystick.getBoundingClientRect();
  const dx=touch.clientX - (rect.left + rect.width/2);
  const dy=touch.clientY - (rect.top + rect.height/2);
  const angle=Math.atan2(dy,dx);
  const dist=Math.min(Math.hypot(dx,dy), 40);

  stick.style.transform=`translate(${Math.cos(angle)*dist}px,${Math.sin(angle)*dist}px)`;
  input.x=Math.cos(angle)*(dist/40);
  input.y=-Math.sin(angle)*(dist/40);
}

window.addEventListener("touchmove", (e) => {
  for(let t of e.changedTouches){
    if(t.identifier === joystickTouch) updateJoystick(t);
  }
}, {passive:false});

window.addEventListener("touchend", () => {
  joystickTouch=null;
  input.set(0,0);
  stick.style.transform="translate(0px,0px)";
});

const clock=new THREE.Clock();

function animate(){
  requestAnimationFrame(animate);
  const delta=Math.min(clock.getDelta(), .05);

  if(input.lengthSq() > .01){
    const forward=new THREE.Vector3(0,0,-1).applyAxisAngle(new THREE.Vector3(0,1,0), cameraAngleY);
    const right=new THREE.Vector3(1,0,0).applyAxisAngle(new THREE.Vector3(0,1,0), cameraAngleY);
    const movement=new THREE.Vector3().addScaledVector(right, input.x).addScaledVector(forward, input.y).normalize();

    player.position.x += movement.x * 30 * delta;
    player.position.z += movement.z * 30 * delta;
  }

  cameraPivot.position.copy(player.position);
  cameraPivot.position.y += 1.6;
  updateCamera();

  renderer.render(scene, camera);
}

animate();

window.addEventListener("resize", () => {
  camera.aspect=window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

</script>
</body>
</html>
