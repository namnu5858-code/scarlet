<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>3D Campus Model</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: sans-serif;
            background-color: #87ceeb;
            touch-action: none;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
        }
        #ui-loading {
            position: absolute;
            top: 20px;
            right: 20px;
            color: white;
            font-weight: bold;
            background: rgba(0,0,0,0.5);
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 14px;
            pointer-events: none;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>
    <div id="canvas-container"></div>
    <div id="ui-loading">Đang dựng khuôn viên trường 3D...</div>

    <script>
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 20, 80);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(100, 150, 50);
        dirLight.castShadow = true;
        scene.add(dirLight);

        // Mở rộng bãi cỏ bao quanh
        const grassGeo = new THREE.PlaneGeometry(500, 500);
        const grassMat = new THREE.MeshLambertMaterial({ color: 0x66bb33 });
        const grassMesh = new THREE.Mesh(grassGeo, grassMat);
        grassMesh.rotation.x = -Math.PI / 2;
        grassMesh.position.y = -0.1;
        scene.add(grassMesh);

        // Mở rộng mặt sân gạch đỏ
        const courtyardGeo = new THREE.PlaneGeometry(200, 200);
        const courtyardMat = new THREE.MeshLambertMaterial({ color: 0xc8553d });
        const courtyardMesh = new THREE.Mesh(courtyardGeo, courtyardMat);
        courtyardMesh.rotation.x = -Math.PI / 2;
        scene.add(courtyardMesh);

        const gridHelper = new THREE.GridHelper(200, 50, 0x000000, 0xaa4433);
        gridHelper.position.y = 0.01;
        scene.add(gridHelper);

        function createBuilding(width, height, depth, color) {
            const group = new THREE.Group();
            const geo = new THREE.BoxGeometry(width, height, depth);
            const mat = new THREE.MeshLambertMaterial({ color: color });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.y = height / 2;
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            group.add(mesh);
            return group;
        }

        // Tòa nhà A
        const buildingA = createBuilding(80, 14, 18, 0xeeeeee);
        buildingA.position.set(-10, 0, 30);
        scene.add(buildingA);

        // Tòa nhà B (Sắp xếp góc vuông hình chữ L - giao nhau bên phải)
        const buildingB = createBuilding(70, 14, 18, 0xdddddd);
        const BX = 45;
        const BZ = -80;
        buildingB.position.set(BX, 0, BZ);
        buildingB.rotation.y = Math.PI / 2;
        scene.add(buildingB);

        // Tối ưu quán tính di chuyển (giúp giảm giật/khựng khi dừng bay)
        const velocity = new THREE.Vector3();
        const moveState = { forward: 0, right: 0, up: 0 };
        const DAMPING_FACTOR = 0.82;

        window.addEventListener('keydown', (e) => {
            switch(e.key.toLowerCase()) {
                case 'w': moveState.forward = 1; break;
                case 's': moveState.forward = -1; break;
                case 'a': moveState.right = -1; break;
                case 'd': moveState.right = 1; break;
                case 'q': moveState.up = 1; break;
                case 'e': moveState.up = -1; break;
            }
        });

        window.addEventListener('keyup', (e) => {
            switch(e.key.toLowerCase()) {
                case 'w': case 's': moveState.forward = 0; break;
                case 'a': case 'd': moveState.right = 0; break;
                case 'q': case 'e': moveState.up = 0; break;
            }
        });

        function animate() {
            requestAnimationFrame(animate);

            const accel = 0.08;
            if (moveState.forward !== 0) velocity.z -= moveState.forward * accel;
            if (moveState.right !== 0) velocity.x += moveState.right * accel;
            if (moveState.up !== 0) velocity.y += moveState.up * accel;

            velocity.x *= DAMPING_FACTOR;
            velocity.y *= DAMPING_FACTOR;
            velocity.z *= DAMPING_FACTOR;

            camera.translateX(velocity.x);
            camera.translateY(velocity.y);
            camera.translateZ(velocity.z);

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
