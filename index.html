<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=overlays-content">
    <title>Chat App - Coha</title>
    <style>
        :root {
            --bg-color: #f2f3f5;
            --chat-bg: #ffffff;
            --text-color: #2c2e33;
            --input-bg: rgba(0, 0, 0, 0.05);
            --input-border: rgba(0, 0, 0, 0.12);
            --input-text: #2c2e33;
            --placeholder-color: #8c9199;
            --button-bg: #2b2d32;
            --button-hover: #1a1b1e;
            --button-icon: #ffffff;
            --shadow: 0 4px 24px rgba(0, 0, 0, 0.05);
            --msg-bg: #f0f1f4;
            --logo-url: url('image_0.png');
            --logo-height: 50px;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #121316;
                --chat-bg: #1a1b1e;
                --text-color: #e1e3e8;
                --input-bg: rgba(255, 255, 255, 0.06);
                --input-border: rgba(255, 255, 255, 0.15);
                --input-text: #ffffff;
                --placeholder-color: #71757e;
                --button-bg: #e1e3e8;
                --button-hover: #ffffff;
                --button-icon: #1a1b1e;
                --shadow: 0 4px 24px rgba(0, 0, 0, 0.4);
                --msg-bg: #25262b;
                --logo-url: url('image_0.png');
            }
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            height: 100%;
            height: 100dvh;
            overflow: hidden;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .logo-container {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px 0;
            position: fixed;
            top: 0;
            left: 0;
            background-color: var(--bg-color);
            z-index: 100;
        }

        .coha-logo {
            background-image: var(--logo-url);
            background-size: contain;
            background-position: center;
            background-repeat: no-repeat;
            height: var(--logo-height);
            width: 150px;
        }

        .chat-container {
            width: 100%;
            max-width: 720px;
            height: 100dvh;
            background-color: var(--chat-bg);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
            margin-top: calc(var(--logo-height) + 30px);
            transition: margin-top 0.3s ease;
        }

        .messages-area {
            flex: 1;
            padding: clamp(12px, 3vw, 24px);
            padding-top: 10px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            scroll-behavior: smooth;
            position: relative;
        }

        @keyframes vibrant-rainbow {
            0% { background-position: 0% 50%; opacity: 0.9; }
            50% { background-position: 100% 50%; opacity: 1; }
            100% { background-position: 0% 50%; opacity: 0.9; }
        }

        .rainbow-prefix {
            font-weight: 600;
            background: linear-gradient(90deg, #ff2a2a, #ff7f00, #ffeb00, #00cc00, #0066ff, #8b00ff, #ff2a2a);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            color: transparent;
            animation: vibrant-rainbow 5s ease infinite;
            display: inline;
            margin-right: 4px;
        }

        .message {
            max-width: min(85%, 520px);
            padding: 12px 18px;
            border-radius: 20px;
            font-size: clamp(0.95rem, 2.5vw, 1.05rem);
            line-height: 1.5;
            align-self: flex-start;
            word-break: break-word;
            background-color: var(--msg-bg);
            color: var(--text-color);
            border-bottom-left-radius: 4px;
            transition: transform 1.2s cubic-bezier(0.55, 0.055, 0.675, 0.19), opacity 1.2s ease-in, filter 1.2s ease-in;
            position: relative;
        }

        .input-bar {
            padding: clamp(10px, 2.5vw, 16px) clamp(12px, 3vw, 24px);
            padding-bottom: max(clamp(10px, 2.5vw, 16px), env(safe-area-inset-bottom));
            display: flex;
            align-items: center;
            gap: 10px;
            background-color: var(--chat-bg);
            z-index: 10;
        }

        .input-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            background-color: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: 30px;
            padding: 10px 18px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .input-wrapper:focus-within {
            border-color: rgba(140, 145, 153, 0.4);
            box-shadow: 0 0 0 2px rgba(140, 145, 153, 0.15);
        }

        .chat-input {
            width: 100%;
            background: transparent;
            border: none;
            outline: none;
            color: var(--input-text);
            font-size: clamp(0.95rem, 2.5vw, 1rem);
        }

        .chat-input::placeholder {
            color: var(--placeholder-color);
        }

        .send-button {
            width: clamp(42px, 10vw, 48px);
            height: clamp(42px, 10vw, 48px);
            border-radius: 50%;
            background-color: var(--button-bg);
            border: 1px solid var(--input-border);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: transform 0.2s ease, background-color 0.2s ease;
            flex-shrink: 0;
        }

        .send-button:active {
            transform: scale(0.95);
        }

        @media (hover: hover) {
            .send-button:hover {
                background-color: var(--button-hover);
                transform: scale(1.05);
            }
        }

        .send-button svg {
            width: 18px;
            height: 18px;
            fill: var(--button-icon);
            transform: translateX(1px);
        }

        /* Black Hole Effect Styles */
        .blackhole-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            width: 180px;
            height: 180px;
            pointer-events: none;
            z-index: 999;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.27);
        }

        .blackhole-container.active {
            transform: translate(-50%, -50%) scale(1);
        }

        .blackhole-container.vanish {
            transform: translate(-50%, -50%) scale(0);
            transition: transform 0.6s ease-in;
        }

        .blackhole-core {
            width: 60px;
            height: 60px;
            background: #000;
            border-radius: 50%;
            box-shadow: 0 0 20px 10px #000, 0 0 40px 20px #8a2be2, 0 0 60px 30px #4b0082;
            animation: pulse-core 0.15s infinite alternate;
        }

        .blackhole-accretion {
            position: absolute;
            width: 140px;
            height: 140px;
            border-radius: 50%;
            border: 4px solid transparent;
            border-top: 4px solid #d8bfd8;
            border-right: 4px solid #9400d3;
            border-bottom: 4px solid #4b0082;
            animation: spin-disk 0.4s linear infinite;
            filter: blur(1px);
        }

        @keyframes spin-disk {
            0% { transform: rotate(0deg) scaleY(0.6); }
            100% { transform: rotate(360deg) scaleY(0.6); }
        }

        @keyframes pulse-core {
            0% { transform: scale(0.95); }
            100% { transform: scale(1.05); }
        }

        .sucked-in {
            opacity: 0 !important;
            filter: blur(8px) brightness(2) !important;
        }

        /* Meteor Effect Styles */
        .meteor-element {
            position: absolute;
            top: -100px;
            left: 50%;
            width: 60px;
            height: 60px;
            background: radial-gradient(circle at 30% 30%, #ffcc00, #ff4500, #8b0000);
            border-radius: 50%;
            box-shadow: 0 0 20px #ff4500, 0 0 50px #ff8c00, 0 0 80px #ff0000;
            z-index: 999;
            pointer-events: none;
            transform: translateX(-50%);
            opacity: 0;
        }

        .meteor-element::before {
            content: '';
            position: absolute;
            top: -120px;
            left: 50%;
            transform: translateX(-50%);
            width: 12px;
            height: 140px;
            background: linear-gradient(to top, rgba(255, 140, 0, 0.9), transparent);
            filter: blur(4px);
        }

        @keyframes meteorFall {
            0% {
                top: -120px;
                opacity: 1;
                transform: translateX(-50%) scale(0.6);
            }
            70% {
                opacity: 1;
            }
            100% {
                top: 45%;
                opacity: 1;
                transform: translateX(-50%) scale(1.4);
            }
        }

        .explosion-shockwave {
            position: absolute;
            top: 45%;
            left: 50%;
            width: 10px;
            height: 10px;
            background: radial-gradient(circle, #ffffff 10%, #ff4500 50%, transparent 80%);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            z-index: 998;
            pointer-events: none;
            opacity: 0;
        }

        @keyframes shockwaveExpand {
            0% {
                width: 10px;
                height: 10px;
                opacity: 1;
            }
            100% {
                width: 600px;
                height: 600px;
                opacity: 0;
            }
        }

        .char-shard {
            display: inline-block;
            white-space: pre;
            transition: transform 1.2s cubic-bezier(0.1, 0.8, 0.3, 1), opacity 1.2s ease-out, filter 1.2s ease-out;
            will-change: transform, opacity, filter;
        }

        .char-shard.shattered {
            transform: translate(var(--tx), var(--ty)) rotate(var(--rot)) scale(var(--sc));
            opacity: 0;
            filter: blur(4px);
        }

        @keyframes screenShake {
            0% { transform: translate(0, 0) rotate(0deg); }
            10% { transform: translate(-8px, -5px) rotate(-1deg); }
            20% { transform: translate(7px, 6px) rotate(1.5deg); }
            30% { transform: translate(-6px, 4px) rotate(-1deg); }
            40% { transform: translate(5px, -7px) rotate(1deg); }
            50% { transform: translate(-4px, 5px) rotate(-0.5deg); }
            70% { transform: translate(3px, -3px) rotate(0.5deg); }
            100% { transform: translate(0, 0) rotate(0deg); }
        }

        .shake-active {
            animation: screenShake 0.6s ease-in-out;
        }
    </style>
</head>
<body>

    <div class="logo-container">
        <div class="coha-logo"></div>
    </div>

    <div class="chat-container" id="chatContainer">
        <div class="messages-area" id="messagesArea">
            <div class="blackhole-container" id="blackHole">
                <div class="blackhole-accretion"></div>
                <div class="blackhole-core"></div>
            </div>
        </div>

        <div class="input-bar">
            <div class="input-wrapper">
                <input type="text" class="chat-input" id="messageInput" placeholder=": Nhập tin nhắn..." autocomplete="off">
            </div>
            <button class="send-button" id="sendBtn" aria-label="Gửi">
                <svg viewBox="0 0 24 24">
                    <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path>
                </svg>
            </button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-analytics.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, serverTimestamp, getDocs, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAGMiTFxmNO81YoEQEp6CN4Eap0EdDqIOE",
            authDomain: "coha-17e45.firebaseapp.com",
            projectId: "coha-17e45",
            storageBucket: "coha-17e45.firebasestorage.app",
            messagingSenderId: "850821117693",
            appId: "1:850821117693:web:ac2d3435a695e0de397094",
            measurementId: "G-GK4BK517DW"
        };

        const app = initializeApp(firebaseConfig);
        const analytics = getAnalytics(app);
        const db = getFirestore(app);

        const sendBtn = document.getElementById('sendBtn');
        const messageInput = document.getElementById('messageInput');
        const messagesArea = document.getElementById('messagesArea');
        const blackHole = document.getElementById('blackHole');
        const chatContainer = document.getElementById('chatContainer');

        function playBlackHoleSound() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();

                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + 2.5);

                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 2.5);

                osc.connect(gain);
                gain.connect(audioCtx.destination);

                osc.start();
                osc.stop(audioCtx.currentTime + 2.5);
            } catch (e) {
                console.log("Audio not allowed without user interaction.");
            }
        }

        function playMeteorAudio() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

                const osc = audioCtx.createOscillator();
                const gainOsc = audioCtx.createGain();
                osc.type = "sine";
                osc.frequency.setValueAtTime(800, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.8);
                gainOsc.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gainOsc.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.8);

                osc.connect(gainOsc);
                gainOsc.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.8);

                setTimeout(() => {
                    const bufferSize = audioCtx.sampleRate * 1.5;
                    const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                    const data = buffer.getChannelData(0);
                    for (let i = 0; i < bufferSize; i++) {
                        data[i] = Math.random() * 2 - 1;
                    }

                    const noise = audioCtx.createBufferSource();
                    noise.buffer = buffer;

                    const filter = audioCtx.createBiquadFilter();
                    filter.type = "lowpass";
                    filter.frequency.setValueAtTime(800, audioCtx.currentTime);
                    filter.frequency.linearRampToValueAtTime(50, audioCtx.currentTime + 1.5);

                    const gainNoise = audioCtx.createGain();
                    gainNoise.gain.setValueAtTime(1.0, audioCtx.currentTime);
                    gainNoise.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 1.5);

                    noise.connect(filter);
                    filter.connect(gainNoise);
                    gainNoise.connect(audioCtx.destination);

                    noise.start();
                    noise.stop(audioCtx.currentTime + 1.5);
                }, 750);
            } catch (e) {
                console.log("Audio not allowed without user interaction.");
            }
        }

        async function triggerBlackHole() {
            playBlackHoleSound();

            blackHole.classList.remove('vanish');
            blackHole.classList.add('active');

            const msgElements = messagesArea.querySelectorAll('.message');
            const holeRect = blackHole.getBoundingClientRect();
            const holeCenterX = holeRect.left + holeRect.width / 2;
            const holeCenterY = holeRect.top + holeRect.height / 2;

            msgElements.forEach((el, index) => {
                const rect = el.getBoundingClientRect();
                const elCenterX = rect.left + rect.width / 2;
                const elCenterY = rect.top + rect.height / 2;

                const deltaX = holeCenterX - elCenterX;
                const deltaY = holeCenterY - elCenterY;

                setTimeout(() => {
                    el.style.transform = `translate(${deltaX}px, ${deltaY}px) scale(0) rotate(${720 + index * 90}deg)`;
                    el.classList.add('sucked-in');
                }, index * 80);
            });

            setTimeout(async () => {
                blackHole.classList.add('vanish');
                blackHole.classList.remove('active');

                try {
                    const snapshot = await getDocs(collection(db, "messages"));
                    const deletePromises = snapshot.docs.map(document => deleteDoc(doc(db, "messages", document.id)));
                    await Promise.all(deletePromises);
                } catch (e) {
                    console.error("Lỗi xóa cơ sở dữ liệu: ", e);
                }
            }, 2200);
        }

        async function triggerMeteor() {
            playMeteorAudio();

            const meteor = document.createElement("div");
            meteor.className = "meteor-element";
            chatContainer.appendChild(meteor);

            const shockwave = document.createElement("div");
            shockwave.className = "explosion-shockwave";
            chatContainer.appendChild(shockwave);

            meteor.style.animation = "meteorFall 0.8s cubic-bezier(0.5, 0, 0.8, 1) FORWARDS";

            setTimeout(() => {
                shockwave.style.animation = "shockwaveExpand 0.7s ease-out FORWARDS";
                chatContainer.classList.add("shake-active");

                meteor.remove();

                const shards = messagesArea.querySelectorAll(".char-shard");
                shards.forEach((shard) => {
                    const randomX = (Math.random() - 0.5) * 500;
                    const randomY = (Math.random() - 0.5) * 500;
                    const randomRot = (Math.random() - 0.5) * 720;
                    const randomScale = Math.random() * 0.5 + 0.2;

                    shard.style.setProperty("--tx", `${randomX}px`);
                    shard.style.setProperty("--ty", `${randomY}px`);
                    shard.style.setProperty("--rot", `${randomRot}deg`);
                    shard.style.setProperty("--sc", `${randomScale}`);

                    shard.classList.add("shattered");
                });

                setTimeout(() => {
                    chatContainer.classList.remove("shake-active");
                    shockwave.remove();
                }, 700);

                setTimeout(async () => {
                    try {
                        const snapshot = await getDocs(collection(db, "messages"));
                        const deletePromises = snapshot.docs.map(document => deleteDoc(doc(db, "messages", document.id)));
                        await Promise.all(deletePromises);
                    } catch (e) {
                        console.error("Lỗi xóa cơ sở dữ liệu: ", e);
                    }
                }, 1200);

            }, 750);
        }

        async function sendMessage() {
            const text = messageInput.value.trim();

            if (text === "/bh") {
                messageInput.value = "";
                triggerBlackHole();
                return;
            }

            if (text === "search m") {
                messageInput.value = "";
                triggerMeteor();
                return;
            }

            if (text !== "") {
                try {
                    await addDoc(collection(db, "messages"), {
                        text: text,
                        createdAt: serverTimestamp()
                    });
                    messageInput.value = "";
                } catch (e) {
                    console.error("Lỗi khi gửi tin nhắn: ", e);
                }
            }
        }

        sendBtn.addEventListener('click', sendMessage);
        messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });

        const q = query(collection(db, "messages"), orderBy("createdAt", "asc"));
        onSnapshot(q, (snapshot) => {
            if (blackHole.classList.contains('active')) return;

            const existingBH = blackHole.cloneNode(true);
            messagesArea.innerHTML = "";
            messagesArea.appendChild(existingBH);

            snapshot.forEach((doc) => {
                const data = doc.data();
                const messageDiv = document.createElement('div');
                messageDiv.className = 'message';

                const prefixSpan = document.createElement('span');
                prefixSpan.className = 'rainbow-prefix';
                prefixSpan.textContent = '[nwm]';

                messageDiv.appendChild(prefixSpan);

                const text = data.text || "";
                const fragmentedHTML = text.split("").map((char) => {
                    return `<span class="char-shard">${char === " " ? "&nbsp;" : char}</span>`;
                }).join("");

                const textSpan = document.createElement('span');
                textSpan.innerHTML = ': ' + fragmentedHTML;
                messageDiv.appendChild(textSpan);

                messagesArea.appendChild(messageDiv);
            });
            messagesArea.scrollTop = messagesArea.scrollHeight;
        });
    </script>
</body>
</html>
