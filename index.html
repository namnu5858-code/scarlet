<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice Assistant Interface</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #050505;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .phone-frame {
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle at center, #1a1a2e 0%, #050505 70%);
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            padding-bottom: 40px;
        }

        .interface-container {
            width: 90%;
            max-width: 400px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 50px;
            padding: 15px 25px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5),
                        0 0 20px rgba(74, 144, 226, 0.2);
        }

        .input-placeholder {
            color: rgba(255, 255, 255, 0.6);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            font-size: 16px;
            font-weight: 450;
            letter-spacing: -0.2px;
            margin-left: 10px;
        }

        .icon-group {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .icon {
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .mic-icon svg {
            width: 20px;
            height: 20px;
            fill: rgba(255, 255, 255, 0.8);
        }

        .wave-container {
            display: flex;
            align-items: center;
            gap: 4px;
            height: 24px;
        }

        .wave-bar {
            width: 4px;
            height: 100%;
            background: linear-gradient(to top, #4a90e2, #00f2fe);
            border-radius: 2px;
            animation: pulse 1.5s infinite ease-in-out;
        }

        .wave-bar:nth-child(1) { animation-delay: 0.1s; height: 40%; }
        .wave-bar:nth-child(2) { animation-delay: 0.3s; height: 80%; }
        .wave-bar:nth-child(3) { animation-delay: 0.2s; height: 100%; }
        .wave-bar:nth-child(4) { animation-delay: 0.4s; height: 60%; }
        .wave-bar:nth-child(5) { animation-delay: 0.15s; height: 90%; }

        @keyframes pulse {
            0%, 100% { transform: scaleY(0.3); opacity: 0.5; }
            50% { transform: scaleY(1); opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="phone-frame">
        <div class="interface-container">
            <div class="input-placeholder">Hỏi Gemini</div>
            <div class="icon-group">
                <div class="icon mic-icon">
                    <svg viewBox="0 0 24 24">
                        <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
                        <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
                    </svg>
                </div>
                <div class="icon wave-container">
                    <div class="wave-bar"></div>
                    <div class="wave-bar"></div>
                    <div class="wave-bar"></div>
                    <div class="wave-bar"></div>
                    <div class="wave-bar"></div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
