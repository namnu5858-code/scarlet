
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demon Slayer Chat & Text Effects</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Noto+Sans+JP:wght@900&family=Roboto:wght@400;700&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #08090c;
            color: #ffffff;
            font-family: 'Roboto', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
        }

        .chat-container {
            position: relative;
            width: 100%;
            max-width: 800px;
            height: 90vh;
            background: rgba(15, 18, 25, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
            overflow: hidden;
        }

        .chat-header {
            padding: 20px;
            background: #0d1017;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            text-align: center;
            font-family: 'Cinzel Decorative', serif;
            font-size: 1.2rem;
            letter-spacing: 2px;
            color: #d1d5db;
        }

        .chat-messages {
            flex: 1;
            padding: 25px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .message {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            max-width: 85%;
        }

        .message.bot {
            align-self: flex-start;
        }

        .message.user {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        /* Tách riêng phần tiền tố và nội dung */
        .msg-prefix {
            font-weight: 700;
            font-size: 0.85rem;
            padding: 6px 12px;
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.05);
            color: #9ca3af;
            white-space: nowrap;
            user-select: none;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .msg-content {
            background: rgba(30, 35, 45, 0.8);
            padding: 12px 18px;
            border-radius: 12px;
            line-height: 1.5;
            font-size: 1rem;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* -------------------------------------------------------------
           HIỆU ỨNG HƠI THỞ CỦA LỬA (FLAME BREATHING)
        ------------------------------------------------------------- */
        .ds-text-flame {
            position: relative;
            display: inline-block;
            font-family: 'Noto Sans JP', 'Cinzel Decorative', sans-serif;
            font-size: 2.2rem;
            font-weight: 900;
            color: #fff;
            background: linear-gradient(180deg, #ffffff 0%, #ffe600 25%, #ff4800 65%, #000000 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 2px #000) drop-shadow(0 0 8px #ff3300) drop-shadow(0 0 15px #ff8800);
            animation: flameGlow 1.5s infinite alternate ease-in-out;
            padding: 0 10px;
        }

        .ds-text-flame::before,
        .ds-text-flame::after {
            content: attr(data-text);
            position: absolute;
            left: 10px;
            top: 0;
            z-index: -1;
            background: linear-gradient(0deg, #000000 0%, #ff1100 50%, transparent 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .ds-text-flame::before {
            animation: flameEmbers 0.1s infinite alternate;
        }

        @keyframes flameGlow {
            0% {
                filter: drop-shadow(0 0 2px #000) drop-shadow(0 0 6px #ff2200) drop-shadow(0 0 12px #ff7700);
            }
            100% {
                filter: drop-shadow(0 0 4px #000) drop-shadow(0 0 12px #ff4400) drop-shadow(0 0 22px #ffaa00);
            }
        }

        @keyframes flameEmbers {
            0% {
                transform: translate(-1px, -2px) skewX(2deg);
                opacity: 0.8;
            }
            100% {
                transform: translate(1px, -4px) skewX(-2deg);
                opacity: 0.3;
            }
        }

        /* -------------------------------------------------------------
           HIỆU ỨNG HƠI THỞ CỦA NƯỚC (WATER BREATHING)
        ------------------------------------------------------------- */
        .ds-text-water {
            position: relative;
            display: inline-block;
            font-family: 'Noto Sans JP', 'Cinzel Decorative', sans-serif;
            font-size: 2.2rem;
            font-weight: 900;
            color: #fff;
            background: linear-gradient(180deg, #ffffff 10%, #00d2ff 35%, #0044ff 70%, #050b14 95%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 2px #000) drop-shadow(0 0 6px #00d2ff) drop-shadow(0 0 15px #0044ff);
            animation: waterFlow 2s infinite ease-in-out;
            padding: 0 10px;
        }

        .ds-text-water::after {
            content: attr(data-text);
            position: absolute;
            left: 10px;
            top: 0;
            z-index: -1;
            text-shadow: 
                -2px -2px 0 #fff,
                 2px -2px 0 #fff,
                -2px  2px 0 #0044ff,
                 2px  2px 0 #0044ff,
                 0px  0px 10px #00ffff;
            -webkit-text-fill-color: initial;
            opacity: 0.6;
            animation: waterSplash 0.3s infinite alternate;
        }

        @keyframes waterFlow {
            0%, 100% {
                filter: drop-shadow(0 0 2px #000) drop-shadow(0 0 6px #00d2ff) drop-shadow(0 0 12px #0044ff);
            }
            50% {
                filter: drop-shadow(0 0 4px #000) drop-shadow(0 0 12px #80e5ff) drop-shadow(0 0 20px #0066ff);
            }
        }

        @keyframes waterSplash {
            0% {
                transform: scale(1) translate(0, 0);
            }
            100% {
                transform: scale(1.02) translate(-1px, 1px);
            }
        }

        /* -------------------------------------------------------------
           BLACK HOLE CONTAINER (ĐÃ CĂN GIỮA MÀN HÌNH CHAT)
        ------------------------------------------------------------- */
        .blackhole-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            width: 200px;
            height: 200px;
            pointer-events: none;
            z-index: 100;
            transition: transform 0.5s ease-in-out, opacity 0.5s ease-in-out;
            opacity: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .blackhole-container.active {
            transform: translate(-50%, -50%) scale(1);
            opacity: 1;
        }

        .blackhole-core {
            width: 80px;
            height: 80px;
            background: #000;
            border-radius: 50%;
            box-shadow: 
                0 0 20px #000,
                0 0 40px #ff3300,
                0 0 80px #ff6600;
            animation: pulseCore 1s infinite alternate;
        }

        .blackhole-ring {
            position: absolute;
            width: 160px;
            height: 160px;
            border-radius: 50%;
            border: 4px solid transparent;
            border-top-color: #ff4500;
            border-bottom-color: #00bfff;
            animation: spinRing 1s linear infinite;
        }

        @keyframes spinRing {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes pulseCore {
            0% { transform: scale(0.9); }
            100% { transform: scale(1.1); }
        }
    </style>
</head>
<body>

    <div class="chat-container">
        <div class="chat-header">DEMON SLAYER CHAT SYSTEM</div>
        
        <div class="chat-messages">
            <!-- Tin nhắn mẫu với phần tiền tố và nội dung được tách biệt -->
            <div class="message bot">
                <div class="msg-prefix">Hệ thống</div>
                <div class="msg-content">Chào mừng bạn! Hãy kiểm tra các hiệu ứng bên dưới.</div>
            </div>

            <div class="message user">
                <div class="msg-prefix">Người dùng</div>
                <div class="msg-content">
                    <span class="ds-text-flame" data-text="炎の呼吸">炎の呼吸</span>
                </div>
            </div>

            <div class="message user">
                <div class="msg-prefix">Người dùng</div>
                <div class="msg-content">
                    <span class="ds-text-water" data-text="水の呼吸">水の呼吸</span>
                </div>
            </div>
        </div>

        <!-- Blackhole Container Căn Giữa Màn Hình Chat -->
        <div class="blackhole-container" id="blackhole">
            <div class="blackhole-core"></div>
            <div class="blackhole-ring"></div>
        </div>
    </div>

    <script>
        // Kích hoạt Blackhole container khi cần thiết
        function triggerBlackhole() {
            const bh = document.getElementById('blackhole');
            bh.classList.add('active');
            setTimeout(() => {
                bh.classList.remove('active');
            }, 3000);
        }
    </script>
</body>
</html>
