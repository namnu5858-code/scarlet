<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Widget Slide</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #0b0b0d;
      color: #f5f5f7;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .widget-slider {
      display: flex;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      gap: 12px;
      width: 100%;
      max-width: 360px;
      padding: 8px 16px;
      scrollbar-width: none;
    }

    .widget-slider::-webkit-scrollbar {
      display: none;
    }

    .widget-slide {
      flex: 0 0 100%;
      scroll-snap-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
    }

    /* Slide 2: Viên thuốc xám nhạt bán trong suốt, nhỏ gọn */
    .palette-pill {
      background: rgba(215, 215, 222, 0.22);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      padding: 4px 7px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      width: fit-content;
      margin: 0 auto;
    }

    .palette-swatch {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      cursor: pointer;
      border: none;
      padding: 0;
      transition: transform 0.18s ease, box-shadow 0.18s ease;
    }

    .palette-swatch.active {
      transform: scale(1.12);
      box-shadow: 0 0 0 1.5px rgba(255, 255, 255, 0.85);
    }
  </style>
</head>
<body>
  <div class="widget-slider" id="widgetSlider">
    <!-- Slide 1 -->
    <div class="widget-slide" id="slide-1"></div>

    <!-- Slide 2: Bảng màu -->
    <div class="widget-slide" id="slide-palette">
      <div class="palette-pill">
        <button type="button" class="palette-swatch" data-color="#b5892e" style="background-color: #b5892e;"></button>
        <button type="button" class="palette-swatch" data-color="#e8dcc8" style="background-color: #e8dcc8;"></button>
        <button type="button" class="palette-swatch" data-color="#2c2c2e" style="background-color: #2c2c2e;"></button>
        <button type="button" class="palette-swatch" data-color="#636366" style="background-color: #636366;"></button>
        <button type="button" class="palette-swatch" data-color="#aeaeb2" style="background-color: #aeaeb2;"></button>
      </div>
    </div>
  </div>

  <script>
    document.querySelectorAll('#slide-palette .palette-swatch').forEach((swatch) => {
      swatch.addEventListener('click', function () {
        const isActive = this.classList.contains('active');
        document.querySelectorAll('#slide-palette .palette-swatch').forEach((item) => {
          item.classList.remove('active');
        });
        if (!isActive) {
          this.classList.add('active');
        }
      });
    });
  </script>
</body>
</html>
