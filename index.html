<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Voice Assistant</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 h-screen flex flex-col justify-between text-slate-100 font-sans relative overflow-hidden">
    
    <header class="p-4 text-center border-b border-slate-800/80 bg-slate-900/40 backdrop-blur-md">
        <h1 class="text-sm font-semibold tracking-wide text-slate-300">Neural Assistant</h1>
    </header>

    <div id="chat-box" class="flex-1 overflow-y-auto p-4 space-y-4 max-w-2xl w-full mx-auto">
        <div class="flex items-start space-x-3">
            <div class="bg-slate-900/80 backdrop-blur border border-slate-800 text-slate-200 px-4 py-3 rounded-2xl max-w-md text-sm leading-relaxed shadow-lg">
                System online. Ready for interaction.
            </div>
        </div>
    </div>

    <div id="voice-overlay" class="fixed inset-0 bg-slate-950/90 backdrop-blur-xl hidden flex flex-col items-center justify-center z-50 transition-all duration-300">
        <div class="relative flex items-center justify-center">
            <div class="absolute w-48 h-48 bg-cyan-500/10 rounded-full animate-ping"></div>
            <div class="absolute w-36 h-36 bg-cyan-500/20 rounded-full animate-pulse"></div>
            <div class="w-24 h-24 bg-gradient-to-tr from-cyan-600 to-blue-600 rounded-full flex items-center justify-center shadow-2xl shadow-cyan-500/40">
                <svg class="w-10 h-10 text-white animate-pulse" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 18.75a6 6 0 006-6v-1.5m-12 7.5a6 6 0 01-6-6v-1.5m12 7.5v3.75m-3.75 0h7.5M12 1.5a3 3 0 013 3v7.5a3 3 0 01-6 0v-7.5a3 3 0 013-3z"></path>
                </svg>
            </div>
        </div>
        <p class="mt-8 text-slate-400 text-sm font-medium tracking-wider uppercase">Listening...</p>
    </div>

    <div class="p-4 bg-slate-900/60 backdrop-blur-md border-t border-slate-800/80">
        <form id="chat-form" class="max-w-2xl mx-auto relative">
            <div class="flex items-center bg-slate-900/90 rounded-full px-5 py-2.5 border border-slate-800 shadow-2xl focus-within:border-slate-700 transition-all">
                <input type="text" id="user-input" placeholder="Type a message or use voice..." autocomplete="off"
                    class="flex-1 bg-transparent text-slate-100 py-2 focus:outline-none text-sm placeholder-slate-500">
                
                <button type="button" id="close-btn" title="Stop"
                    class="hidden ml-2 bg-slate-800 hover:bg-slate-700 text-slate-200 w-9 h-9 rounded-full flex items-center justify-center transition shadow">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"></path>
                    </svg>
                </button>

                <button type="button" id="mic-btn" title="Voice Input"
                    class="ml-2 bg-slate-800 hover:bg-cyan-600 text-slate-300 hover:text-white w-9 h-9 rounded-full flex items-center justify-center transition-all duration-200 shadow">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="1.75" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 18.75a6 6 0 006-6v-1.5m-12 7.5a6 6 0 01-6-6v-1.5m12 7.5v3.75m-3.75 0h7.5M12 1.5a3 3 0 013 3v7.5a3 3 0 01-6 0v-7.5a3 3 0 013-3z"></path>
                    </svg>
                </button>

                <button type="submit" class="ml-2 bg-cyan-600 hover:bg-cyan-500 text-white px-4 py-2 rounded-full text-xs font-medium tracking-wide transition shadow">
                    Send
                </button>
            </div>
        </form>
    </div>
