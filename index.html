
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scarlet PWA</title>
  <style>
    :root {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --accent-color: #ff3b30;
      --text-color: #ffffff;
      --text-sub: #aaa;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-color); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
    
    /* Header & Navigation */
    header { padding: 16px; text-align: center; background: var(--card-bg); font-weight: bold; font-size: 1.2rem; border-bottom: 1px solid #333; }
    .content { flex: 1; overflow-y: auto; padding: 16px; position: relative; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* Nav Bar */
    nav { display: flex; background: var(--card-bg); border-top: 1px solid #333; }
    nav button { flex: 1; padding: 12px; background: none; border: none; color: var(--text-sub); font-size: 0.9rem; cursor: pointer; }
    nav button.active { color: var(--accent-color); font-weight: bold; }

    /* Components UI */
    .card { background: var(--card-bg); padding: 16px; border-radius: 12px; margin-bottom: 16px; }
    input, textarea, button.btn { width: 100%; padding: 10px; margin-top: 8px; border-radius: 8px; border: 1px solid #333; background: #2a2a2a; color: #fff; }
    button.btn-primary { background: var(--accent-color); border: none; font-weight: bold; cursor: pointer; }

    /* Radar UI */
    .radar-box { width: 200px; height: 200px; border-radius: 50%; border: 2px solid var(--accent-color); margin: 20px auto; position: relative; overflow: hidden; background: radial-gradient(circle, #2a0000 0%, #121212 70%); }
    .radar-sweep { width: 100%; height: 100%; background: conic-gradient(from 0deg, transparent 0deg, transparent 300deg, rgba(255, 59, 48, 0.4) 360deg); animation: spin 3s linear infinite; border-radius: 50%; }
    @keyframes spin { 100% { transform: rotate(360deg); } }

    /* Scanner UI */
    video { width: 100%; height: 220px; background: #000; border-radius: 8px; object-fit: cover; }

    /* GHI CHÚ KIỂU MESSENGER/TIKTOK (Chỉnh sửa riêng phần này) */
    .note-profile-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 0;
      cursor: pointer;
    }
    .note-bubble {
      position: relative;
      background: #2a2a2a;
      border: 1px solid #3d3d3d;
      padding: 8px 14px;
      border-radius: 16px;
      font-size: 13px;
      color: #fff;
      max-width: 160px;
      text-align: center;
      margin-bottom: 10px;
      word-break: break-word;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }
    .note-bubble::after {
      content: '';
      position: absolute;
      bottom: -6px;
      left: 50%;
      transform: translateX(-50%);
      border-width: 6px 6px 0;
      border-style: solid;
      border-color: #2a2a2a transparent;
    }
    .avatar-wrapper {
      position: relative;
      width: 72px;
      height: 72px;
    }
    .avatar-img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--accent-color);
    }
    .add-badge {
      position: absolute;
      bottom: 0;
      right: 0;
      background: var(--accent-color);
      width: 22px;
      height: 22px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: bold;
      border: 2px solid var(--bg-color);
    }

    /* Modal nhập liệu */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
      z-index: 999;
    }
    .modal-overlay.active { opacity: 1; pointer-events: auto; }
    .modal-box { background: var(--card-bg); padding: 20px; border-radius: 16px; width: 85%; max-width: 300px; text-align: center; }
  </style>
</head>
<body>

  <header>Scarlet App</header>

  <main class="content">
    <!-- Tab 1: Ghi chú trạng thái (Kiểu Messenger / TikTok) -->
    <section id="tab-notes" class="tab-content active">
      <div class="card">
        <div class="note-profile-wrapper" onclick="openNoteModal()">
          <div class="note-bubble" id="userNoteDisplay">Chia sẻ suy nghĩ...</div>
          <div class="avatar-wrapper">
            <img src="https://i.pravatar.cc/150?img=68" alt="Avatar" class="avatar-img" />
            <div class="add-badge" id="badgeStatus">+</div>
          </div>
          <span style="font-size: 12px; color: var(--text-sub); margin-top: 6px;">Ghi chú của bạn</span>
        </div>
      </div>
    </section>

    <!-- Tab 2: Radar tìm bạn -->
    <section id="tab-radar" class="tab-content">
      <div class="card" style="text-align: center;">
        <h3>Radar Quét Bán Kính</h3>
        <div class="radar-box">
          <div class="radar-sweep"></div>
        </div>
        <p id="radarStatus">Đang tìm kiếm thiết bị xung quanh...</p>
        <button class="btn btn-primary" onclick="toggleRadar()">Bật/Tắt Quét</button>
      </div>
    </section>

    <!-- Tab 3: Quét mã QR -->
    <section id="tab-qr" class="tab-content">
      <div class="card">
        <h3>Quét Mã QR Camera</h3>
        <video id="webcam" autoplay playsinline></video>
        <button class="btn btn-primary" onclick="startCamera()">Mở Camera</button>
        <button class="btn" style="margin-top:4px;" onclick="stopCamera()">Tắt Camera</button>
        <p id="qrResult" style="margin-top: 10px; color: var(--accent-color);"></p>
      </div>
    </section>
  </main>

  <!-- Modal Nhập Ghi Chú -->
  <div class="modal-overlay" id="noteModal">
    <div class="modal-box">
      <h4>Ghi chú của bạn</h4>
      <input type="text" id="noteInput" placeholder="Chia sẻ suy nghĩ..." maxlength="60" />
      <div style="display: flex; gap: 8px; margin-top: 10px;">
        <button class="btn" onclick="closeNoteModal()">Hủy</button>
        <button class="btn btn-primary" onclick="saveNote()">Chia sẻ</button>
      </div>
    </div>
  </div>

  <!-- Navigation -->
  <nav>
    <button class="nav-btn active" onclick="switchTab('tab-notes', this)">Ghi chú</button>
    <button class="nav-btn" onclick="switchTab('tab-radar', this)">Radar</button>
    <button class="nav-btn" onclick="switchTab('tab-qr', this)">Quét QR</button>
  </nav>

  <script>
    // Xử lý chuyển Tab
    function switchTab(tabId, element) {
      document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
      document.getElementById(tabId).classList.add('active');
      element.classList.add('active');
    }

    // Xử lý Ghi chú
    const NOTE_KEY = 'scarlet_my_note';

    document.addEventListener('DOMContentLoaded', loadNote);

    function loadNote() {
      const savedNote = localStorage.getItem(NOTE_KEY);
      const display = document.getElementById('userNoteDisplay');
      const badge = document.getElementById('badgeStatus');

      if (savedNote) {
        display.innerText = savedNote;
        badge.innerText = '✓';
      } else {
        display.innerText = 'Chia sẻ suy nghĩ...';
        badge.innerText = '+';
      }
    }

    function openNoteModal() {
      document.getElementById('noteInput').value = localStorage.getItem(NOTE_KEY) || '';
      document.getElementById('noteModal').classList.add('active');
    }

    function closeNoteModal() {
      document.getElementById('noteModal').classList.remove('active');
    }

    function saveNote() {
      const text = document.getElementById('noteInput').value.trim();
      if (text) {
        localStorage.setItem(NOTE_KEY, text);
      } else {
        localStorage.removeItem(NOTE_KEY);
      }
      loadNote();
      closeNoteModal();
    }

    // Xử lý Radar
    let isScanning = true;
    function toggleRadar() {
      const sweep = document.querySelector('.radar-sweep');
      const status = document.getElementById('radarStatus');
      isScanning = !isScanning;
      if (isScanning) {
        sweep.style.animationPlayState = 'running';
        status.innerText = 'Đang tìm kiếm thiết bị xung quanh...';
      } else {
        sweep.style.animationPlayState = 'paused';
        status.innerText = 'Đã dừng quét.';
      }
    }

    // Xử lý Camera QR
    let streamRef = null;
    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
        streamRef = stream;
        document.getElementById('webcam').srcObject = stream;
        document.getElementById('qrResult').innerText = 'Camera sẵn sàng...';
      } catch (err) {
        document.getElementById('qrResult').innerText = 'Không thể truy cập camera.';
      }
    }

    function stopCamera() {
      if (streamRef) {
        streamRef.getTracks().forEach(track => track.stop());
        document.getElementById('webcam').srcObject = null;
        document.getElementById('qrResult').innerText = 'Đã tắt camera.';
      }
    }
  </script>
</body>
</html>
