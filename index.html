// ============================================================
// CAMERA
// ============================================================

const cameraPivot=new THREE.Object3D();
scene.add(cameraPivot);

const camera=new THREE.PerspectiveCamera(
  60,
  window.innerWidth/window.innerHeight,
  0.1,
  2000
);

cameraPivot.add(camera);

let cameraDistance=10;
let targetCameraDistance=10;

let cameraAngleX=0.05;
let cameraAngleY=0;

let targetCameraAngleX=0.05;
let targetCameraAngleY=0;

function updateCamera(){

  cameraAngleY=THREE.MathUtils.lerp(
    cameraAngleY,
    targetCameraAngleY,
    .15
  );

  cameraAngleX=THREE.MathUtils.lerp(
    cameraAngleX,
    targetCameraAngleX,
    .15
  );

  cameraDistance=THREE.MathUtils.lerp(
    cameraDistance,
    targetCameraDistance,
    .15
  );

  cameraPivot.rotation.y=cameraAngleY;
  cameraPivot.rotation.x=cameraAngleX;

  camera.position.set(0,0,cameraDistance);
  camera.lookAt(cameraPivot.position);

  // ========================================================
  // KHÔNG CHO CAMERA XUYÊN QUA MẶT GẠCH
  // Kiểm tra vị trí camera thực tế trong thế giới.
  // ========================================================

  const cameraWorldPosition=new THREE.Vector3();
  camera.getWorldPosition(cameraWorldPosition);

  const MIN_CAMERA_HEIGHT=.38;

  if(cameraWorldPosition.y<MIN_CAMERA_HEIGHT){

    const correction=MIN_CAMERA_HEIGHT-cameraWorldPosition.y;

    cameraWorldPosition.y=MIN_CAMERA_HEIGHT;

    const pivotWorldPosition=new THREE.Vector3();
    cameraPivot.getWorldPosition(pivotWorldPosition);

    const localPosition=cameraWorldPosition.clone();
    camera.parent.worldToLocal(localPosition);

    camera.position.copy(localPosition);

    // Không cho tiếp tục vuốt xuống theo góc gây xuyên sân.
    const maxSafeAngle=Math.min(
      Math.PI/2.2,
      Math.max(
        -Math.PI/4,
        Math.asin(
          THREE.MathUtils.clamp(
            (cameraPivot.position.y-MIN_CAMERA_HEIGHT)/
            Math.max(cameraDistance,.1),
            -1,
            1
          )
        )
      )
    );

    if(targetCameraAngleX>maxSafeAngle){
      targetCameraAngleX=maxSafeAngle;
    }
  }
}

function box(w,h,d,x,y,z,material,parent=scene){

  const mesh=new THREE.Mesh(
    new THREE.BoxGeometry(w,h,d),
    material
  );

  mesh.position.set(x,y,z);
  mesh.castShadow=true;
  mesh.receiveShadow=true;

  parent.add(mesh);

  return mesh;
}

function cylinder(
  radius,
  height,
  x,
  y,
  z,
  material,
  segments=20,
  parent=scene
){

  const mesh=new THREE.Mesh(
    new THREE.CylinderGeometry(
      radius,
      radius,
      height,
      segments
    ),
    material
  );

  mesh.position.set(x,y,z);
  mesh.castShadow=true;
  mesh.receiveShadow=true;

  parent.add(mesh);

  return mesh;
}

function textPlane(
  text,
  width,
  height,
  x,
  y,
  z,
  rotationY=0
){

  const canvas=document.createElement("canvas");

  canvas.width=1024;
  canvas.height=256;

  const ctx=canvas.getContext("2d");

  ctx.clearRect(0,0,1024,256);

  ctx.fillStyle="#ffffff";
  ctx.font="bold 72px Arial";
  ctx.textAlign="center";
  ctx.textBaseline="middle";

  ctx.fillText(text,512,128);

  const texture=new THREE.CanvasTexture(canvas);

  texture.colorSpace=THREE.SRGBColorSpace;

  const material=new THREE.MeshBasicMaterial({
    map:texture,
    transparent:true
  });

  const mesh=new THREE.Mesh(
    new THREE.PlaneGeometry(width,height),
    material
  );

  mesh.position.set(x,y,z);
  mesh.rotation.y=rotationY;

  scene.add(mesh);

  return mesh;
}

campus.add(stairGroup);

const stairX=43;
const stairFrontZ=BZ-25;

const stairGreen=new THREE.MeshStandardMaterial({
  color:0x248f45,

  metalness:.45,
  roughness:.45
});

  16,

  8,

  stairGreenDark,
  stairGroup
);

  4.2,
  stairX+4.3,
  8,

  stairGroup

// Bốn tầng riêng biệt

const stairLevels=[
  {bottom:0,top:4,dir:1},
  {bottom:4,top:8,dir:-1},
  {bottom:8,top:12,dir:1},
  {bottom:12,top:16,dir:-1}
];

stairLevels.forEach((level,index)=>{

  const steps=12;
  const rise=4/steps;
  const run=10/steps;

  const startZ=
    level.dir===1
    ? stairFrontZ+5
    : stairFrontZ+15;

  for(let i=0;i<steps;i++){

    const step=new THREE.Mesh(
      new THREE.BoxGeometry(
        6.8,
        .30,
        1.0
      ),
      stairStepMaterial
    );

    const localI=i+.5;

    step.position.x=stairX;

    step.position.y=
      level.bottom+
      rise*localI;

    step.position.z=
      startZ+
      level.dir*run*localI;

    step.castShadow=true;
    step.receiveShadow=true;

    stairGroup.add(step);

    // Viền mép từng bậc

    const edge=new THREE.Mesh(
      new THREE.BoxGeometry(
        6.9,
        .09,
        .08
      ),
      stairEdgeMaterial
    );

      .45,
      18

  );

  wheel1.rotation.z=Math.PI/2;
  wheel1.position.set(0,1.25,-2.4);

  const wheel2=wheel1.clone();

      o.receiveShadow=true;

  });

}

let model=null;

const leafMeshes=[];
const armMeshes=[];
const rootMeshes=[];
const initialData=new Map();

const loader=new GLTFLoader();

loader.load(
  "scene.gltf",
  function(gltf){

    model=gltf.scene;

    model.traverse(function(object){

      if(!object.isMesh)return;

      object.castShadow=true;
      object.receiveShadow=true;

      initialData.set(
        object,
        {
          position:object.position.clone(),
          rotation:object.rotation.clone(),
          scale:object.scale.clone()
        }
      );

      const name=object.name.toLowerCase();

      if(
        name.includes("leaf")||
        name.includes("leaves")||
        name.includes("foliage")||
        name.includes("la")
      ){
        leafMeshes.push(object);
      }

      if(
        name.includes("arm")||
        name.includes("hand")||
        name.includes("tay")
      ){
        armMeshes.push(object);
      }

      if(
        name.includes("root")||
        name.includes("re")
      ){
        rootMeshes.push(object);
      }
    });

    player.add(model);

    loading.style.display="none";
  },
  undefined,
  function(error){

    loading.textContent=
      "Không tìm thấy scene.gltf";
  }
);

// ============================================================
// JOYSTICK
// ============================================================

const joystick=
  document.getElementById("joystick-wrapper");

const stick=
  document.getElementById("joystick-stick");

let joystickTouch=null;

let centerX=0;
let centerY=0;

const radius=40;

joystick.addEventListener(
  "touchstart",
  function(event){

    event.preventDefault();

    const touch=event.changedTouches[0];

    joystickTouch=touch.identifier;

    const rect=
      joystick.getBoundingClientRect();

    centerX=
      rect.left+
      rect.width/2;

    centerY=
      rect.top+
      rect.height/2;

    updateJoystick(touch);
  },
  {passive:false}
);

function updateJoystick(touch){

  const dx=
    touch.clientX-centerX;

  const dy=
    touch.clientY-centerY;

  const distance=
    Math.hypot(dx,dy);

  const angle=
    Math.atan2(dy,dx);

  const limited=
    Math.min(distance,radius);

  const x=
    Math.cos(angle)*limited;

  const y=
    Math.sin(angle)*limited;

  stick.style.transform=
    `translate(${x}px,${y}px)`;

  input.x=x/radius;
  input.y=-y/radius;
}

function resetJoystick(){

  joystickTouch=null;

  input.set(0,0);

  stick.style.transform=
    "translate(0px,0px)";
}

window.addEventListener(
  "touchmove",
  function(event){

    for(
      let i=0;
      i<event.changedTouches.length;
      i++
    ){

      if(
        event.changedTouches[i].identifier===
        joystickTouch
      ){

        updateJoystick(
          event.changedTouches[i]
        );
      }
    }
  },
  {passive:false}
);

window.addEventListener(
  "touchend",
  function(event){

    for(
      let i=0;
      i<event.changedTouches.length;
      i++
    ){

      if(
        event.changedTouches[i].identifier===
        joystickTouch
      ){

        resetJoystick();
      }
    }
  }
);

window.addEventListener(
  "touchcancel",
  resetJoystick
);

  "touchstart",
  function(event){

    event.preventDefault();

    tapCount++;

    clearTimeout(tapTimer);

    tapTimer=setTimeout(()=>{

      if(tapCount===1){

        if(isFlying){

          velocity.y=5.0;

        }else if(grounded){

          velocity.y=8;

          grounded=false;
        }

      }else if(tapCount===2){

        isFlying=true;

        jump.classList.add("flying");

        velocity.y=3.0;

        moveSpeed=FLY_SPEED;

      }else if(tapCount>=3){

        isFlying=false;

        jump.classList.remove("flying");

        moveSpeed=walkSpeed;

        velocity.y=-10;
      }

      tapCount=0;

    },300);
  },
  {passive:false}
);
