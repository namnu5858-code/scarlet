<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>3D School Simulation - Third Person</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
        }
        
        /* UI Trái tim & Máu (Góc trái trên) */
        #ui-health {
            position: absolute;
            top: 20px;
            left: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }
        .heart-icon {
            width: 80px;
            height: 70px;
            background-color: #ff2a2a;
            position: relative;
            transform: rotate(-45deg);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 10px rgba(0,0,0,0.3);
        }
        .heart-icon::before,
        .heart-icon::after {
            content: "";
            width: 80px;
            height: 80px;
            background-color: #ff2a2a;
            border-radius: 50%;
            position: absolute;
        }
        .heart-icon::before {
            top: -40px;
            left: 0;
        }
        .heart-icon::after {
            left: 40px;
            top: 0;
        }
        .health-text {
            position: absolute;
            z-index: 10;
            color: #ffffff;
            font-size: 22px;
            font-weight: bold;
            transform: rotate(45deg); /* Bù lại góc xoay của trái tim */
            text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
            pointer-events: none;
        }

        /* Control UI (Cần di chuyển & Nút nhảy) */
        #joystick-zone {
            position: absolute;
            bottom: 40px;
            left: 40px;
            width: 120px;
            height: 120px;
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            touch-action: none;
            z-index: 100;
        }
        #joystick-knob {
            position: absolute;
            top: 35px;
            left: 35px;
            width: 50px;
            height: 50px;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 50%;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
        }
        #jump-btn {
            position: absolute;
            bottom: 50px;
            right: 40px;
            width: 70px;
            height: 70px;
            background: rgba(255, 255, 255, 0.3);
            border: 2px solid rgba(255, 255, 255, 0.6);
            border-radius: 50%;
            color: white;
            font-size: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 100;
            touch-action: none;
        }
        #jump-btn:active {
            background: rgba(255, 255, 255, 0.6);
        }
    </style>
    <!-- Import Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <!-- UI Máu Trái tim -->
    <div id="ui-health">
        <div class="heart-icon">
            <span class="health-text">125</span>
        </div>
    </div>

    <!-- UI Điều khiển Mobile/Touch -->
    <div id="joystick-zone">
        <div id="joystick-knob"></div>
    </div>
    <div id="jump-btn">▲</div>

    <div id="canvas-container"></div>

    <script>
        // --- SETUP SCENE, CAMERA, RENDERER ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb); // Bầu trời xanh
        scene.fog = new THREE.FogExp2(0x87ceeb, 0.015);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        container.appendChild(renderer.domElement);

        // --- LIGHTING ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(50, 80, 50);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 2048;
        dirLight.shadow.mapSize.height = 2048;
        scene.add(dirLight);

        // --- ENVIRONMENT (Môi trường & Mô hình trường học) ---
        // Đất / Cánh đồng xung quanh
        const groundGeo = new THREE.PlaneGeometry(300, 300);
        const groundMat = new THREE.MeshLambertMaterial({ color: 0x557a2b });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);

        // Sân trường gạch đỏ
        const courtyardGeo = new THREE.PlaneGeometry(80, 60);
        const courtyardMat = new THREE.MeshLambertMaterial({ color: 0xb85235 });
        const courtyard = new THREE.Mesh(courtyardGeo, courtyardMat);
        courtyard.rotation.x = -Math.PI / 2;
        courtyard.position.set(0, 0.05, 0);
        courtyard.receiveShadow = true;
        scene.add(courtyard);

        // Hàm tạo tòa nhà đơn giản (Dãy A & Dãy B)
        function createBuilding(x, z, width, length, name) {
            const group = new THREE.Group();
            
            // Tường nhà chính (3 tầng)
            const bldGeo = new THREE.BoxGeometry(width, 12, length);
            const bldMat = new THREE.MeshLambertMaterial({ color: 0xf0e6d2 });
            const bld = new THREE.Mesh(bldGeo, bldMat);
            bld.position.y = 6;
            bld.castShadow = true;
            bld.receiveShadow = true;
            group.add(bld);

            // Lan can Inox hành lang
            const railGeo = new THREE.BoxGeometry(width, 1, 0.2);
            const railMat = new THREE.MeshStandardMaterial({ color: 0xcccccc, metalness: 0.8, roughness: 0.2 });
            const rail1 = new THREE.Mesh(railGeo, railMat);
            rail1.position.set(0, 4.5, length/2 + 0.1);
            const rail2 = rail1.clone();
            rail2.position.y = 8.5;
            group.add(rail1);
            group.add(rail2);

            // Biển tên dãy nhà
            group.position.set(x, 0, z);
            scene.add(group);
            return group;
        }

        const buildingA = createBuilding(-25, 0, 15, 50, "Dãy A");
        const buildingB = createBuilding(25, 0, 15, 50, "Dãy B");

        // Cổng trường
        const gateGroup = new THREE.Group();
        const pillarGeo = new THREE.BoxGeometry(2, 6, 2);
        const pillarMat = new THREE.MeshLambertMaterial({ color: 0x8b0000 });
        const p1 = new THREE.Mesh(pillarGeo, pillarMat);
        p1.position.set(-8, 3, 30);
        const p2 = new THREE.Mesh(pillarGeo, pillarMat);
        p2.position.set(8, 3, 30);
        gateGroup.add(p1);
        gateGroup.add(p2);
        scene.add(gateGroup);

        // --- CHARACTER (Nhân vật) ---
        const playerGroup = new THREE.Group();
        const bodyGeo = new THREE.CylinderGeometry(0.5, 0.5, 1.8, 16);
        const bodyMat = new THREE.MeshLambertMaterial({ color: 0x1e90ff });
        const body = new THREE.Mesh(bodyGeo, bodyMat);
        body.position.y = 0.9;
        body.castShadow = true;
        playerGroup.add(body);

        playerGroup.position.set(0, 0, 15);
        scene.add(playerGroup);

        // --- GAME LOGIC & CONTROLS ---
        let moveData = { x: 0, y: 0 };
        let velocityY = 0;
        let isGrounded = true;
        const gravity = -0.015;
        const speed = 0.15;

        // Bàn phím WASD / Mũi tên
        const keys = {};
        window.addEventListener('keydown', (e) => keys[e.code] = true);
        window.addEventListener('keyup', (e) => keys[e.code] = false);

        // Cần Joystick Touch / Mouse
        const joystickZone = document.getElementById('joystick-zone');
        const joystickKnob = document.getElementById('joystick-knob');
        let dragging = false;
        let joystickCenter = { x: 0, y: 0 };

        function handleStart(e) {
            dragging = true;
            const rect = joystickZone.getBoundingClientRect();
            joystickCenter = { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 };
        }

        function handleMove(e) {
            if (!dragging) return;
            const touch = e.touches ? e.touches[0] : e;
            const dx = touch.clientX - joystickCenter.x;
            const dy = touch.clientY - joystickCenter.y;
            const dist = Math.min(Math.hypot(dx, dy), 40);
            const angle = Math.atan2(dy, dx);

            const knobX = Math.cos(angle) * dist;
            const knobY = Math.sin(angle) * dist;
            joystickKnob.style.transform = `translate(${knobX}px, ${knobY}px)`;

            moveData.x = knobX / 40;
            moveData.y = knobY / 40;
        }

        function handleEnd() {
            dragging = false;
            joystickKnob.style.transform = `translate(0px, 0px)`;
            moveData = { x: 0, y: 0 };
        }

        joystickZone.addEventListener('mousedown', handleStart);
        window.addEventListener('mousemove', handleMove);
        window.addEventListener('mouseup', handleEnd);

        joystickZone.addEventListener('touchstart', handleStart);
        window.addEventListener('touchmove', handleMove);
        window.addEventListener('touchend', handleEnd);

        // Nút nhảy
        const jumpBtn = document.getElementById('jump-btn');
        function doJump() {
            if (isGrounded) {
                velocityY = 0.3;
                isGrounded = false;
            }
        }
        jumpBtn.addEventListener('touchstart', (e) => { e.preventDefault(); doJump(); });
        jumpBtn.addEventListener('mousedown', doJump);

        // --- ANIMATION LOOP ---
        function animate() {
            requestAnimationFrame(animate);

            // Tính toán di chuyển
            let dirX = moveData.x;
            let dirZ = moveData.y;

            if (keys['KeyW'] || keys['ArrowUp']) dirZ = -1;
            if (keys['KeyS'] || keys['ArrowDown']) dirZ = 1;
            if (keys['KeyA'] || keys['ArrowLeft']) dirX = -1;
            if (keys['KeyD'] || keys['ArrowRight']) dirX = 1;
            if (keys['Space']) doJump();

            if (Math.abs(dirX) > 0.1 || Math.abs(dirZ) > 0.1) {
                const moveAngle = Math.atan2(dirX, dirZ);
                playerGroup.rotation.y = moveAngle;
                
                playerGroup.position.x += Math.sin(moveAngle) * speed;
                playerGroup.position.z += Math.cos(moveAngle) * speed;
            }

            // Xử lý Trọng lực & Nhảy
            playerGroup.position.y += velocityY;
            if (!isGrounded) {
                velocityY += gravity;
                if (playerGroup.position.y <= 0) {
                    playerGroup.position.y = 0;
                    velocityY = 0;
                    isGrounded = true;
                }
            }

            // Camera Góc nhìn thứ 3 (Third-person Camera)
            const camOffset = new THREE.Vector3(0, 5, 10);
            camera.position.x = playerGroup.position.x + camOffset.x;
            camera.position.y = playerGroup.position.y + camOffset.y;
            camera.position.z = playerGroup.position.z + camOffset.z;
            camera.lookAt(playerGroup.position.x, playerGroup.position.y + 1, playerGroup.position.z);

            renderer.render(scene, camera);
        }

        // Window Resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
