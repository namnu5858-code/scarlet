<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Locket</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      overflow: hidden;
    }

    .top-bar {
      width: 100%;
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .pill-btn {
      background: rgba(255, 255, 255, 0.14);
      backdrop-filter: blur(10px);
      border: none;
      color: #fff;
      padding: 8px 16px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    .camera-wrapper {
      position: relative;
      width: 92vw;
      max-width: 400px;
      aspect-ratio: 1 / 1;
      border-radius: 44px;
      overflow: hidden;
      background: #1a1a1a;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
    }

    video, canvas#preview-canvas {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    video.mirrored, canvas#preview-canvas.mirrored {
      transform: scaleX(-1);
    }

    .cam-overlay-btn {
      position: absolute;
      top: 16px;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.45);
      border: none;
      color: #fff;
      font-size: 14px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 5;
    }

    #flash-btn { left: 16px; }
    #zoom-btn { right: 16px; }

    .controls-area {
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      padding-bottom: 24px;
    }

    .shutter-row {
      width: 100%;
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 0 24px;
    }

    .side-btn {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: transparent;
      border: none;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    /* Nút chụp mô phỏng Locket iOS */
    #shutter-btn {
      width: 84px;
      height: 84px;
      border-radius: 50%;
      background: transparent;
      border: 4px solid #ffb800;
      padding: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      transition: transform 0.12s cubic-bezier(0.22, 1, 0.36, 1);
    }

    #shutter-btn .inner-circle {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background-color: #fff;
      transition: background-color 0.12s ease, transform 0.12s ease;
    }

    #shutter-btn.is-pressing {
      transform: scale(0.92);
    }

    #shutter-btn.is-pressing .inner-circle {
      background-color: #555555;
      transform: scale(0.94);
    }

    .history-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 15px;
      font-weight: 600;
      color: #e5e5e5;
      cursor: pointer;
    }

    /* Màn hình Gửi đến... */
    #send-screen {
      position: fixed;
      inset: 0;
      background: #000;
      z-index: 50;
      display: none;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 20px 0 32px;
    }

    #send-screen.active {
      display: flex;
    }

    .send-header {
      width: 100%;
      padding: 0 24px;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      font-size: 18px;
      font-weight: 700;
    }

    #download-btn {
      position: absolute;
      right: 24px;
      background: none;
      border: none;
      color: #fff;
      cursor: pointer;
    }

    .preview-box {
      position: relative;
      width: 92vw;
      max-width: 400px;
      aspect-ratio: 1 / 1;
      border-radius: 44px;
      overflow: hidden;
      background: #1a1a1a;
    }

    .caption-input-wrap {
      position: absolute;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      width: 80%;
      display: flex;
      justify-content: center;
    }

    #caption-input {
      background: rgba(30, 30, 30, 0.72);
      backdrop-filter: blur(12px);
      border: none;
      border-radius: 999px;
      padding: 10px 18px;
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      text-align: center;
      width: 100%;
      outline: none;
    }

    #caption-input::placeholder {
      color: rgba(255, 255, 255, 0.8);
    }

    .send-actions {
      width: 100%;
      max-width: 400px;
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 0 32px;
    }

    .action-circle {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.12);
      border: none;
      color: #fff;
      font-size: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    #confirm-send-btn {
      width: 78px;
      height: 78px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.22);
      border: none;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.12s ease;
    }

    #confirm-send-btn:active {
      transform: scale(0.92);
    }
  </style>
</head>
<body>

  <!-- Thanh trên cùng -->
  <div class="top-bar">
    <button class="pill-btn">Hồ sơ</button>
    <button class="pill-btn">11 người bạn</button>
    <button class="pill-btn">Chat</button>
  </div>

  <!-- Khung Camera -->
  <div class="camera-wrapper">
    <button id="flash-btn" class="cam-overlay-btn">⚡</button>
    <button id="zoom-btn" class="cam-overlay-btn">1x</button>
    <video id="camera-stream" class="mirrored" autoplay playsinline muted></video>
  </div>

  <!-- Điều khiển chụp -->
  <div class="controls-area">
    <div class="shutter-row">
      <button id="gallery-btn" class="side-btn" title="Thư viện">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="18" height="18" rx="4"/>
          <circle cx="8.5" cy="8.5" r="1.5"/>
          <path d="M21 15l-5-5L5 21"/>
        </svg>
      </button>

      <button id="shutter-btn" aria-label="Chụp ảnh">
        <div class="inner-circle"></div>
      </button>

      <button id="switch-cam-btn" class="side-btn" title="Đổi camera">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M20 11A8.1 8.1 0 0 0 4.5 9M4 5v4h4"/>
          <path d="M4 13a8.1 8.1 0 0 0 15.5 2m.5 4v-4h-4"/>
        </svg>
      </button>
    </div>

    <div class="history-bar">
      <span>Lịch sử ⌄</span>
    </div>
  </div>

  <!-- Màn hình Gửi đến... -->
  <div id="send-screen">
    <div class="send-header">
      <span>Gửi đến...</span>
      <button id="download-btn" title="Lưu ảnh">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="7 10 12 15 17 10"/>
          <line x1="12" y1="15" x2="12" y2="3"/>
        </svg>
      </button>
    </div>

    <div class="preview-box">
      <canvas id="preview-canvas"></canvas>
      <div class="caption-input-wrap">
        <input id="caption-input" type="text" placeholder="Thêm một tin nhắn" maxlength="60" />
      </div>
    </div>

    <div class="send-actions">
      <button id="close-send-btn" class="action-circle">✕</button>
      <button id="confirm-send-btn">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="22" y1="2" x2="11" y2="13"/>
          <polygon points="22 2 15 22 11 13 2 9 22 2"/>
        </svg>
      </button>
      <button id="widget-btn" class="action-circle">Aa+</button>
    </div>
  </div>

  <script>
    const video = document.getElementById('camera-stream');
    const shutterBtn = document.getElementById('shutter-btn');
    const switchCamBtn = document.getElementById('switch-cam-btn');
    const sendScreen = document.getElementById('send-screen');
    const previewCanvas = document.getElementById('preview-canvas');
    const closeSendBtn = document.getElementById('close-send-btn');
    const confirmSendBtn = document.getElementById('confirm-send-btn');
    const downloadBtn = document.getElementById('download-btn');
    const captionInput = document.getElementById('caption-input');

    let currentFacingMode = 'user';
    let currentStream = null;
    let pressTimer = null;
    let isLongPress = false;
    const LONG_PRESS_DURATION = 350;

    // Khởi động Camera
    async function startCamera(facingMode = 'user') {
      if (currentStream) {
        currentStream.getTracks().forEach(track => track.stop());
      }
      try {
        currentStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: facingMode, aspectRatio: 1 },
          audio: false
        });
        video.srcObject = currentStream;
        if (facingMode === 'user') {
          video.classList.add('mirrored');
        } else {
          video.classList.remove('mirrored');
        }
      } catch (err) {
        console.error('Không thể mở camera:', err);
      }
    }

    // Phản hồi rung & tiếng đập nhẹ mô phỏng Taptic Engine trên iPhone
    function triggerHapticFeedback() {
      if (navigator.vibrate) {
        navigator.vibrate(25);
      }
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (AudioCtx) {
          const ctx = new AudioCtx();
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(145, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(42, ctx.currentTime + 0.035);
          gain.gain.setValueAtTime(0.18, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.035);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start();
          osc.stop(ctx.currentTime + 0.035);
        }
      } catch (e) {}
    }

    // Chụp khung hình từ video vào canvas và mở giao diện Gửi đến...
    function captureAndOpenSendScreen() {
      const size = Math.min(video.videoWidth || 720, video.videoHeight || 720);
      previewCanvas.width = size;
      previewCanvas.height = size;
      const ctx = previewCanvas.getContext('2d');

      const sx = ((video.videoWidth || size) - size) / 2;
      const sy = ((video.videoHeight || size) - size) / 2;

      ctx.save();
      if (currentFacingMode === 'user') {
        ctx.translate(size, 0);
        ctx.scale(-1, 1);
      }
      if (video.readyState >= 2) {
        ctx.drawImage(video, sx, sy, size, size, 0, 0, size, size);
      }
      ctx.restore();

      captionInput.value = '';
      sendScreen.classList.add('active');
    }

    // Xử lý nhấn giữ và chạm chụp trên nút shutter
    shutterBtn.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      isLongPress = false;
      shutterBtn.classList.add('is-pressing');
      triggerHapticFeedback();

      pressTimer = setTimeout(() => {
        isLongPress = true;
        triggerHapticFeedback();
        shutterBtn.classList.remove('is-pressing');
        captureAndOpenSendScreen();
      }, LONG_PRESS_DURATION);
    });

    const handlePointerRelease = () => {
      shutterBtn.classList.remove('is-pressing');
      if (pressTimer) {
        clearTimeout(pressTimer);
        pressTimer = null;
      }
      if (!isLongPress) {
        captureAndOpenSendScreen();
      }
      isLongPress = false;
    };

    shutterBtn.addEventListener('pointerup', handlePointerRelease);
    shutterBtn.addEventListener('pointercancel', handlePointerRelease);
    shutterBtn.addEventListener('pointerleave', () => {
      if (pressTimer) {
        clearTimeout(pressTimer);
        pressTimer = null;
      }
      shutterBtn.classList.remove('is-pressing');
    });

    // Đổi camera trước / sau
    switchCamBtn.addEventListener('click', () => {
      triggerHapticFeedback();
      currentFacingMode = currentFacingMode === 'user' ? 'environment' : 'user';
      startCamera(currentFacingMode);
    });

    // Đóng màn hình Gửi đến...
    closeSendBtn.addEventListener('click', () => {
      triggerHapticFeedback();
      sendScreen.classList.remove('active');
    });

    // Gửi ảnh
    confirmSendBtn.addEventListener('click', () => {
      triggerHapticFeedback();
      sendScreen.classList.remove('active');
    });

    // Tải ảnh về máy
    downloadBtn.addEventListener('click', () => {
      triggerHapticFeedback();
      const link = document.createElement('a');
      link.download = `locket-${Date.now()}.png`;
      link.href = previewCanvas.toDataURL('image/png');
      link.click();
    });

    startCamera(currentFacingMode);
  </script>
</body>
</html>
