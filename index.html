<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Cổng trường THCS Cam Thượng</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#bfe8f7;
    font-family:Arial,Helvetica,sans-serif;
}

#scene{
    position:fixed;
    inset:0;
}

canvas{
    display:block;
    width:100%;
    height:100%;
}
</style>
</head>

<body>

<div id="scene"></div>

<script type="importmap">
{
    "imports":{
        "three":"https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"
    }
}
</script>

<script type="module">

import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

/* =========================================================
   CƠ BẢN
========================================================= */

const scene = new THREE.Scene();

scene.background = new THREE.Color(0xbfe8f7);
scene.fog = new THREE.Fog(0xbfe8f7, 75, 180);

const camera = new THREE.PerspectiveCamera(
    48,
    window.innerWidth / window.innerHeight,
    0.1,
    500
);

camera.position.set(39,18,42);

const renderer = new THREE.WebGLRenderer({
    antialias:true,
    powerPreference:"high-performance"
});

renderer.setSize(window.innerWidth,window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.08;

document.getElementById("scene").appendChild(renderer.domElement);


/* =========================================================
   ÁNH SÁNG
========================================================= */

const hemi = new THREE.HemisphereLight(
    0xffffff,
    0x667766,
    2.1
);

scene.add(hemi);

const sun = new THREE.DirectionalLight(
    0xffffff,
    3.2
);

sun.position.set(-45,70,35);
sun.castShadow = true;

sun.shadow.mapSize.width = 2048;
sun.shadow.mapSize.height = 2048;

sun.shadow.camera.left = -80;
sun.shadow.camera.right = 80;
sun.shadow.camera.top = 80;
sun.shadow.camera.bottom = -80;

scene.add(sun);


/* =========================================================
   VẬT LIỆU
========================================================= */

const MAT = {

    concrete : new THREE.MeshStandardMaterial({
        color:0xe4c98c,
        roughness:0.82,
        metalness:0.02
    }),

    concreteLight : new THREE.MeshStandardMaterial({
        color:0xf0dba3,
        roughness:0.78,
        metalness:0.02
    }),

    white : new THREE.MeshStandardMaterial({
        color:0xffffff,
        roughness:0.62
    }),

    blue : new THREE.MeshStandardMaterial({
        color:0x003366,
        roughness:0.38,
        metalness:0.05
    }),

    roof : new THREE.MeshStandardMaterial({
        color:0x8f1e19,
        roughness:0.72
    }),

    dark : new THREE.MeshStandardMaterial({
        color:0x56472d,
        roughness:0.85
    }),

    ground : new THREE.MeshStandardMaterial({
        color:0xcaa96a,
        roughness:0.95
    }),

    grass : new THREE.MeshStandardMaterial({
        color:0x6e9d45,
        roughness:0.95
    })
};


/* =========================================================
   HÀM TẠO KHỐI
========================================================= */

function box(
    w,
    h,
    d,
    material,
    x,
    y,
    z,
    bevel=0
){

    let geometry;

    if(bevel > 0){

        geometry = new THREE.BoxGeometry(
            w,
            h,
            d,
            1,
            1,
            1
        );

    }else{

        geometry = new THREE.BoxGeometry(w,h,d);

    }

    const mesh = new THREE.Mesh(
        geometry,
        material
    );

    mesh.position.set(x,y,z);
    mesh.castShadow = true;
    mesh.receiveShadow = true;

    scene.add(mesh);

    return mesh;
}


/* =========================================================
   MẶT ĐẤT
========================================================= */

box(
    160,
    0.6,
    110,
    MAT.ground,
    0,
    -0.3,
    0
);

box(
    155,
    0.08,
    100,
    MAT.grass,
    0,
    0.02,
    0
);


/* =========================================================
   KHU VỰC SÂN TRƯỚC CỔNG
========================================================= */

box(
    110,
    0.18,
    30,
    MAT.ground,
    0,
    0.12,
    18
);


/* =========================================================
   THÔNG SỐ CỔNG
========================================================= */

const GATE_WIDTH = 32;
const GATE_HEIGHT = 9;

const LEFT_X  = -16;
const RIGHT_X = 16;


/* =========================================================
   TRỤ CỔNG CHÍNH
========================================================= */

function createMainPillar(x){

    /* thân trụ */
    box(
        3.4,
        8.3,
        3.2,
        MAT.concrete,
        x,
        4.15,
        0
    );

    /* chân đế */
    box(
        4.3,
        0.65,
        4.1,
        MAT.concreteLight,
        x,
        0.33,
        0
    );

    /* tầng chân thứ hai */
    box(
        3.9,
        0.55,
        3.8,
        MAT.concreteLight,
        x,
        0.9,
        0
    );

    /* phần chuyển tiếp trên thân */
    box(
        3.8,
        0.5,
        3.7,
        MAT.concreteLight,
        x,
        7.55,
        0
    );

    /* đầu trụ */
    box(
        4.5,
        0.75,
        4.25,
        MAT.concreteLight,
        x,
        8.0,
        0
    );

    /* mái nhỏ trên đỉnh */
    const roof = new THREE.Mesh(
        new THREE.ConeGeometry(
            2.65,
            1.55,
            4
        ),
        MAT.roof
    );

    roof.position.set(
        x,
        9.05,
        0
    );

    roof.rotation.y = Math.PI/4;

    roof.castShadow = true;
    roof.receiveShadow = true;

    scene.add(roof);


    /* họa tiết dọc giữa trụ */
    for(let i=0;i<4;i++){

        box(
            0.34,
            0.85,
            0.22,
            MAT.white,
            x,
            2.0 + i*1.25,
            -1.67
        );

    }

    /* viền trang trí phía trước */
    box(
        2.7,
        0.28,
        0.28,
        MAT.white,
        x,
        1.35,
        -1.7
    );

    box(
        2.7,
        0.28,
        0.28,
        MAT.white,
        x,
        7.2,
        -1.7
    );
}

createMainPillar(LEFT_X);
createMainPillar(RIGHT_X);


/* =========================================================
   CỔNG NHỎ BÊN TRÁI
   CHỈ LÀ KHUNG, CHƯA CÓ CỬA
========================================================= */

const smallGateX = -8.3;

box(
    1.7,
    6.8,
    2.2,
    MAT.concrete,
    smallGateX,
    3.4,
    0
);

box(
    2.3,
    0.55,
    2.8,
    MAT.concreteLight,
    smallGateX,
    6.9,
    0
);

box(
    2.7,
    0.55,
    3.0,
    MAT.concreteLight,
    smallGateX,
    7.35,
    0
);


/* =========================================================
   KHUNG CỔNG PHÍA TRÊN
========================================================= */

box(
    25.5,
    0.65,
    2.6,
    MAT.concrete,
    0,
    7.75,
    0
);

box(
    26.8,
    0.45,
    3.0,
    MAT.concreteLight,
    0,
    8.2,
    0
);


/* =========================================================
   PHẦN TRANG TRÍ HAI ĐẦU KHUNG
========================================================= */

for(const x of [-12.5,12.5]){

    box(
        1.0,
        1.25,
        2.9,
        MAT.concreteLight,
        x,
        8.7,
        0
    );

}


/* =========================================================
   BIỂN TÊN TRƯỜNG
========================================================= */

const signWidth = 25.5;
const signHeight = 3.55;
const signDepth = 0.28;

box(
    signWidth,
    signHeight,
    signDepth,
    MAT.blue,
    0,
    10.0,
    -1.48
);


/* =========================================================
   VIỀN TRẮNG BIỂN
========================================================= */

box(
    signWidth + 0.34,
    0.18,
    0.12,
    MAT.white,
    0,
    11.72,
    -1.68
);

box(
    signWidth + 0.34,
    0.18,
    0.12,
    MAT.white,
    0,
    8.28,
    -1.68
);

box(
    0.18,
    signHeight + 0.15,
    0.12,
    MAT.white,
    -12.82,
    10.0,
    -1.68
);

box(
    0.18,
    signHeight + 0.15,
    0.12,
    MAT.white,
    12.82,
    10.0,
    -1.68
);


/* =========================================================
   CHỮ TRÊN BIỂN
========================================================= */

function createTextTexture(text){

    const canvas = document.createElement("canvas");

    canvas.width = 1800;
    canvas.height = 280;

    const ctx = canvas.getContext("2d");

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    ctx.font = "bold 108px Arial";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    ctx.fillStyle = "#ffffff";

    ctx.fillText(
        text,
        canvas.width/2,
        canvas.height/2
    );

    const texture = new THREE.CanvasTexture(canvas);

    texture.colorSpace = THREE.SRGBColorSpace;
    texture.anisotropy = renderer.capabilities.getMaxAnisotropy();

    return texture;
}

const signTexture = createTextTexture(
    "TRƯỜNG THCS CAM THƯỢNG"
);

const textMaterial = new THREE.MeshBasicMaterial({
    map:signTexture,
    transparent:true,
    side:THREE.DoubleSide
});

const textPlane = new THREE.Mesh(
    new THREE.PlaneGeometry(
        23.7,
        3.0
    ),
    textMaterial
);

textPlane.position.set(
    0,
    10.0,
    -1.66
);

scene.add(textPlane);


/* =========================================================
   HỌA TIẾT TRÊN ĐỈNH BIỂN
========================================================= */

const ornamentMaterial = MAT.white;

for(let i=-4;i<=4;i++){

    const ornament = new THREE.Mesh(
        new THREE.CylinderGeometry(
            0.10,
            0.10,
            0.55,
            12
        ),
        ornamentMaterial
    );

    ornament.rotation.z = Math.PI/2;

    ornament.position.set(
        i*1.65,
        11.92,
        -1.5
    );

    scene.add(ornament);
}


/* =========================================================
   HAI KHỐI TRANG TRÍ BÊN DƯỚI BIỂN
========================================================= */

for(const x of [-13.2,13.2]){

    box(
        1.0,
        1.6,
        2.8,
        MAT.concreteLight,
        x,
        9.6,
        0
    );

}


/* =========================================================
   CÁC CỘT NHỎ TẠO CHI TIẾT KHUNG
========================================================= */

for(let x=-10;x<=10;x+=5){

    box(
        0.32,
        1.3,
        0.35,
        MAT.white,
        x,
        7.05,
        -1.45
    );

}


/* =========================================================
   CÂY XANH HAI BÊN CỔNG
========================================================= */

function createTree(x,z,scale=1){

    const trunk = new THREE.Mesh(
        new THREE.CylinderGeometry(
            0.32*scale,
            0.45*scale,
            3.2*scale,
            10
        ),
        MAT.dark
    );

    trunk.position.set(
        x,
        1.6*scale,
        z
    );

    trunk.castShadow = true;

    scene.add(trunk);


    const crown = new THREE.Mesh(
        new THREE.SphereGeometry(
            2.2*scale,
            18,
            14
        ),
        MAT.grass
    );

    crown.position.set(
        x,
        4.1*scale,
        z
    );

    crown.castShadow = true;

    scene.add(crown);
}

createTree(-29,8,1.15);
createTree(29,8,1.15);

createTree(-35,15,0.9);
createTree(35,15,0.9);


/* =========================================================
   HÀNG CÂY PHÍA SAU
========================================================= */

for(let x=-50;x<=50;x+=12){

    if(Math.abs(x)<25) continue;

    createTree(
        x,
        28,
        0.8
    );

}


/* =========================================================
   CAMERA
========================================================= */

const controls = new OrbitControls(
    camera,
    renderer.domElement
);

controls.enableDamping = true;
controls.dampingFactor = 0.06;

controls.target.set(
    0,
    5.0,
    0
);

controls.minDistance = 22;
controls.maxDistance = 90;

controls.maxPolarAngle = Math.PI * 0.48;
controls.minPolarAngle = Math.PI * 0.20;

controls.enablePan = false;


/* =========================================================
   KHÓA CAMERA KHÔNG ĐI XUỐNG MẶT ĐẤT
========================================================= */

function updateCamera(){

    if(camera.position.y < 2.2){

        camera.position.y = 2.2;

    }

}


/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
    "resize",
    ()=>{

        camera.aspect =
            window.innerWidth /
            window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

    }
);


/* =========================================================
   ANIMATION
========================================================= */

function animate(){

    requestAnimationFrame(animate);

    controls.update();

    updateCamera();

    renderer.render(
        scene,
        camera
    );
}

animate();

</script>

</body>
</html>
