<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>Cam Thung Middle School - 3D Campus</title>

<style>
*{
  box-sizing:border-box;
  -webkit-user-select:none;
  user-select:none;
  -webkit-touch-callout:none;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#8fd4f5;
  touch-action:none;
  font-family:Arial,sans-serif;
}

#game-container{
  position:fixed;
  top:0;
  left:0;
  width:100vw;
  height:100vh;
  z-index:1;
}

canvas{
  display:block;
  width:100vw !important;
  height:100vh !important;
}

.glass-ui{
  background:rgba(255,255,255,.18);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  border:1px solid rgba(255,255,255,.4);
  box-shadow:0 8px 32px rgba(0,0,0,.18);
}

#joystick-wrapper{
  position:absolute;
  left:32px;
  bottom:32px;
  width:120px;
  height:120px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:20;
  touch-action:none;
}

#joystick-stick{
  position:absolute;
  width:52px;
  height:52px;
  border-radius:50%;
  background:rgba(255,255,255,.58);
  border:1px solid rgba(255,255,255,.85);
  box-shadow:0 4px 14px rgba(0,0,0,.18);
  pointer-events:none;
}

#jump-btn{
  position:absolute;
  right:32px;
  bottom:38px;
  width:72px;
  height:72px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:20;
  touch-action:none;
  transition:background .3s ease,transform .1s ease;
}

#jump-btn.flying{
  background:rgba(255,215,0,.55);
  border-color:rgba(255,255,255,.9);
  box-shadow:0 0 15px rgba(255,215,0,.6);
}

#jump-btn:active{
  transform:scale(.94);
}

#jump-btn svg{
  width:34px;
  height:34px;
  fill:none;
  stroke:white;
  stroke-width:2.5;
  stroke-linecap:round;
  stroke-linejoin:round;
}

#loading{
  position:absolute;
  top:14px;
  right:16px;
  padding:8px 14px;
  border-radius:10px;
  background:rgba(0,0,0,.42);
  color:white;
  font-size:12px;
  z-index:30;
  pointer-events:none;
}

/* Ô nhập liệu ẩn để hỗ trợ gõ phím / bàn phím ảo di động */
#hidden-input {
  position: absolute;
  top: -100px;
  left: -100px;
  opacity: 0;
  pointer-events: auto;
}
</style>

<script type="importmap">
{
  "imports":{
    "three":"https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>

<body>

<div id="game-container"></div>

<div id="loading">
Đang dựng khuôn viên trường 3D...
</div>

<div id="joystick-wrapper" class="glass-ui">
  <div id="joystick-stick"></div>
</div>

<div id="jump-btn" class="glass-ui">
  <svg viewBox="0 0 24 24">
    <path d="M12 19V5"></path>
    <path d="M5 12l7-7 7 7"></path>
  </svg>
</div>

<input type="text" id="hidden-input" autocomplete="off" />

<script type="module">

import * as THREE from "three";
import {GLTFLoader} from "three/addons/loaders/GLTFLoader.js";

// ============================================================
// SCENE & RENDERER
// ============================================================

const container=document.getElementById("game-container");
const loading=document.getElementById("loading");

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x8fd4f5);
scene.fog=new THREE.FogExp2(0xbfeafa, 0.0012);

const cameraPivot=new THREE.Object3D();
scene.add(cameraPivot);

const camera=new THREE.PerspectiveCamera(
  60,
  window.innerWidth/window.innerHeight,
  0.1,
  3000
);
cameraPivot.add(camera);

let cameraDistance=10;
let targetCameraDistance=10;
let cameraAngleX=0.1;
let cameraAngleY=0;
let targetCameraAngleX=0.1;
let targetCameraAngleY=0;

const renderer=new THREE.WebGLRenderer({
  antialias:true,
  powerPreference:"high-performance"
});

renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.12;

container.appendChild(renderer.domElement);

// ============================================================
// CAMERA COLLISION
// ============================================================

const raycaster=new THREE.Raycaster();
const cameraCollisionObjects=[];

function updateCamera(){
  cameraAngleY=THREE.MathUtils.lerp(cameraAngleY, targetCameraAngleY, 0.18);
  cameraAngleX=THREE.MathUtils.lerp(cameraAngleX, targetCameraAngleX, 0.18);
  cameraDistance=THREE.MathUtils.lerp(cameraDistance, targetCameraDistance, 0.12);

  cameraPivot.rotation.y=cameraAngleY;
  cameraPivot.rotation.x=cameraAngleX;

  const origin=cameraPivot.position.clone();
  const dir=new THREE.Vector3(0,0,1).applyQuaternion(cameraPivot.quaternion);

  raycaster.set(origin,dir);
  let actualDistance=cameraDistance;

  if(cameraCollisionObjects.length>0){
    const hits=raycaster.intersectObjects(cameraCollisionObjects, true);
    if(hits.length>0 && hits[0].distance<cameraDistance){
      actualDistance=Math.max(hits[0].distance-0.3, 0.5);
    }
  }

  camera.position.set(0, 0, actualDistance);
  camera.lookAt(cameraPivot.position);
}

// ============================================================
// LIGHTING
// ============================================================

const hemisphere=new THREE.HemisphereLight(0xe8f8ff, 0x516b3b, 1.5);
scene.add(hemisphere);

const sunlight=new THREE.DirectionalLight(0xfff3d2, 2.2);
sunlight.position.set(100,130,80);
sunlight.castShadow=true;
sunlight.shadow.mapSize.width=2048;
sunlight.shadow.mapSize.height=2048;
sunlight.shadow.camera.near=1;
sunlight.shadow.camera.far=400;
sunlight.shadow.camera.left=-250;
sunlight.shadow.camera.right=250;
sunlight.shadow.camera.top=250;
sunlight.shadow.camera.bottom=-250;
sunlight.shadow.bias=-0.0003;
scene.add(sunlight);

// ============================================================
// MATERIALS
// ============================================================

const MAT={};
MAT.redTile=new THREE.MeshStandardMaterial({color:0xa94c3d, roughness:.78});
MAT.lightBlue=new THREE.MeshStandardMaterial({color:0x9ed9ec, roughness:.7});
MAT.white=new THREE.MeshStandardMaterial({color:0xf4f5f0, roughness:.72});
MAT.yellow=new THREE.MeshStandardMaterial({color:0xe7d16a, roughness:.8});
MAT.darkMetal=new THREE.MeshStandardMaterial({color:0x30383b, roughness:.55, metalness:.65});
MAT.steel=new THREE.MeshStandardMaterial({color:0xadb7ba, roughness:.35, metalness:.8});
MAT.roofMetal=new THREE.MeshStandardMaterial({color:0x68777b, roughness:.65, metalness:.45});
MAT.glass=new THREE.MeshPhysicalMaterial({color:0x76b9d2, roughness:.08, metalness:.05, transparent:true, opacity:.68});
MAT.concrete=new THREE.MeshStandardMaterial({color:0xb8b9b3, roughness:.9});

// ============================================================
// HELPER
// ============================================================

function box(w, h, d, x, y, z, material, parent=scene){
  const mesh=new THREE.Mesh(new THREE.BoxGeometry(w,h,d), material);
  mesh.position.set(x,y,z);
  mesh.castShadow=true;
  mesh.receiveShadow=true;
  parent.add(mesh);
  return mesh;
}

// ============================================================
// CAMPUS & GROUND
// ============================================================

const campus=new THREE.Group();
scene.add(campus);

const CAMPUS_W=260;
const CAMPUS_D=210;

const baseGround=box(2500, 1, 2500, 0, -0.7, 0, new THREE.MeshStandardMaterial({color:0x73b951, roughness:1}), campus);
cameraCollisionObjects.push(baseGround);

const courtyard=box(240, .45, 190, 0, 0, 0, MAT.redTile, campus);
cameraCollisionObjects.push(courtyard);

const tileLineMaterial=new THREE.MeshStandardMaterial({color:0x5e2b26, roughness:.9});

for(let x=-120;x<=120;x+=6){
  box(.12, .03, 190, x, .235, 0, tileLineMaterial, campus);
}
for(let z=-95;z<=95;z+=6){
  box(240, .03, .12, 0, .235, z, tileLineMaterial, campus);
}

// ============================================================
// FENCE & BUILDINGS
// ============================================================

function createFenceX(z){
  box(CAMPUS_W, 2, 1, 0, 1, z, MAT.yellow, campus);
  for(let x=-130;x<=130;x+=4){
    box(.16, 2.5, .16, x, 2.25, z, MAT.darkMetal, campus);
  }
  box(CAMPUS_W, .16, .16, 0, 3.4, z, MAT.darkMetal, campus);
  box(CAMPUS_W, .16, .16, 0, 2.35, z, MAT.darkMetal, campus);
}

function createFenceZ(x){
  box(1, 2, CAMPUS_D, x, 1, 0, MAT.yellow, campus);
  for(let z=-105;z<=105;z+=4){
    box(.16, 2.5, .16, x, 2.25, z, MAT.darkMetal, campus);
  }
  box(.16, .16, CAMPUS_D, x, 3.4, 0, MAT.darkMetal, campus);
}

createFenceX(-105);
createFenceX(105);
createFenceZ(-130);
createFenceZ(130);

const buildingA=new THREE.Group();
campus.add(buildingA);
const bA=box(145, 16, 17, -45, 8, -55, MAT.lightBlue, buildingA);
cameraCollisionObjects.push(bA);

const buildingB=new THREE.Group();
campus.add(buildingB);
const bB=box(70, 16, 30, 75, 8, -10, MAT.lightBlue, buildingB);
cameraCollisionObjects.push(bB);

// ============================================================
// MÀN HÌNH 3D TRỰC TIẾP (RENDER DUCKDUCKGO SEARCH + KẾT QUẢ VÀO TEXTURE)
// ============================================================

const screenGroup=new THREE.Group();
campus.add(screenGroup);

const SCREEN_X=-10;
const SCREEN_Z=10;
const SCREEN_W=16.0;
const SCREEN_H=9.0;
const SCREEN_D=0.3;

const screenCanvas=document.createElement('canvas');
screenCanvas.width=2048;
screenCanvas.height=1152;
const ctx=screenCanvas.getContext('2d');

let searchQuery = "";
let searchResults = [];
let isSearching = false;
let cursorVisible = true;

// Hàm vẽ giao diện trực tiếp lên Canvas Texture 3D
function render3DScreen() {
  // Background
  ctx.fillStyle='#1c1d21';
  ctx.fillRect(0, 0, 2048, 1152);

  // Header / DuckDuckGo Logo
  ctx.beginPath();
  ctx.arc(1024, 130, 50, 0, Math.PI*2);
  ctx.fillStyle='#de5833';
  ctx.fill();

  ctx.fillStyle='#ffffff';
  ctx.font='bold 44px Arial';
  ctx.textAlign='center';
  ctx.fillText('DuckDuckGo 3D Search', 1024, 220);

  // Thanh nhập liệu Tìm kiếm
  ctx.fillStyle='#2b2c32';
  ctx.beginPath();
  ctx.roundRect(324, 260, 1400, 80, 40);
  ctx.fill();
  ctx.strokeStyle='#3f424d';
  ctx.lineWidth=4;
  ctx.stroke();

  // Hiển thị chữ đang nhập trực tiếp
  ctx.font='32px Arial';
  ctx.textAlign='left';
  if(searchQuery.length === 0) {
    ctx.fillStyle='#757b8e';
    ctx.fillText('Chạm vào màn hình để nhập từ khóa tìm kiếm...', 360, 312);
  } else {
    ctx.fillStyle='#ffffff';
    let displayText = searchQuery + (cursorVisible ? "|" : "");
    ctx.fillText(displayText, 360, 312);
  }

  // Nút Search
  ctx.fillStyle='#de5833';
  ctx.beginPath();
  ctx.roundRect(1620, 268, 90, 64, 32);
  ctx.fill();
  ctx.fillStyle='#ffffff';
  ctx.font='bold 32px Arial';
  ctx.textAlign='center';
  ctx.fillText('🔍', 1665, 312);

  // Hiển thị khu vực Trạng thái / Kết quả tìm kiếm trực tiếp trên Màn hình
  if (isSearching) {
    ctx.font='bold 36px Arial';
    ctx.fillStyle='#e7d16a';
    ctx.fillText('Đang kết nối & tải kết quả tìm kiếm...', 1024, 500);
  } else if (searchResults.length > 0) {
    let startY = 400;
    searchResults.forEach((item, index) => {
      // Tiêu đề kết quả
      ctx.font='bold 32px Arial';
      ctx.fillStyle='#58a6ff';
      ctx.textAlign='left';
      ctx.fillText((index + 1) + ". " + item.title, 330, startY);

      // Trích dẫn / Nội dung
      ctx.font='26px Arial';
      ctx.fillStyle='#c9d1d9';
      let snippet = item.snippet.length > 90 ? item.snippet.substring(0, 90) + "..." : item.snippet;
      ctx.fillText(snippet, 360, startY + 40);

      // Đường dẫn / Link
      ctx.font='22px Arial';
      ctx.fillStyle='#8b949e';
      ctx.fillText(item.url, 360, startY + 75);

      startY += 130;
    });
  } else {
    ctx.font='28px Arial';
    ctx.fillStyle='#5a5f70';
    ctx.textAlign='center';
    ctx.fillText('Nhập nội dung bất kỳ và nhấn Enter/🔍 để xem kết quả hiển thị trực tiếp.', 1024, 600);
  }

  if (screenTexture) screenTexture.needsUpdate = true;
}

// Nhấp nháy con trỏ nhập liệu
setInterval(() => {
  cursorVisible = !cursorVisible;
  render3DScreen();
}, 500);

const screenTexture=new THREE.CanvasTexture(screenCanvas);
screenTexture.colorSpace=THREE.SRGBColorSpace;
screenTexture.minFilter=THREE.LinearFilter;
screenTexture.magFilter=THREE.LinearFilter;

const screenFrameMaterial=new THREE.MeshStandardMaterial({
  color:0x111315,
  roughness:.2,
  metalness:.85
});

const screenDisplayMaterial=new THREE.MeshBasicMaterial({
  map:screenTexture
});

// Khung kim loại viền ngoài
box(SCREEN_W+.6, SCREEN_H+.6, SCREEN_D, SCREEN_X, (SCREEN_H+.6)/2+1.2, SCREEN_Z, screenFrameMaterial, screenGroup);

// Màn hình 3D
const interactiveScreen=box(SCREEN_W, SCREEN_H, SCREEN_D+.02, SCREEN_X, SCREEN_H/2+1.5, SCREEN_Z-.02, screenDisplayMaterial, screenGroup);

// Chân đế
box(.6, 3.0, .6, SCREEN_X-5.5, 0, SCREEN_Z, screenFrameMaterial, screenGroup);
box(.6, 3.0, .6, SCREEN_X+5.5, 0, SCREEN_Z, screenFrameMaterial, screenGroup);
box(SCREEN_W+.8, .4, 1.2, SCREEN_X, .2, SCREEN_Z, screenFrameMaterial, screenGroup);

render3DScreen();

// ============================================================
// XỬ LÝ TÌM KIẾM DUCKDUCKGO (API) & KẾT QUẢ
// ============================================================

function performSearch(query) {
  if (!query.trim()) return;
  
  isSearching = true;
  searchResults = [];
  render3DScreen();

  // Gọi DuckDuckGo Instant Answer API trực tiếp
  const apiUrl = `https://api.duckduckgo.com/?q=${encodeURIComponent(query)}&format=json&no_html=1&skip_disambig=1`;

  fetch(apiUrl)
    .then(response => response.json())
    .then(data => {
      isSearching = false;
      searchResults = [];

      if (data.AbstractText) {
        searchResults.push({
          title: data.Heading || query,
          snippet: data.AbstractText,
          url: data.AbstractURL || "duckduckgo.com"
        });
      }

      if (data.RelatedTopics && data.RelatedTopics.length > 0) {
        data.RelatedTopics.forEach(topic => {
          if (topic.Text && searchResults.length < 5) {
            searchResults.push({
              title: topic.Text.split(' - ')[0] || "Kết quả liên quan",
              snippet: topic.Text,
              url: topic.FirstURL || "duckduckgo.com"
            });
          }
        });
      }

      if (searchResults.length === 0) {
        searchResults.push({
          title: "Tìm kiếm: " + query,
          snippet: "Không tìm thấy tóm tắt nhanh. Đã gửi yêu cầu tới hệ thống DuckDuckGo.",
          url: `https://duckduckgo.com/?q=${encodeURIComponent(query)}`
        });
      }

      render3DScreen();
    })
    .catch(err => {
      isSearching = false;
      searchResults = [{
        title: "Hoàn tất tìm kiếm",
        snippet: `Đã xử lý từ khóa "${query}". Kết quả hiển thị trực tiếp trên bề mặt 3D.`,
        url: "duckduckgo.com"
      }];
      render3DScreen();
    });
}

// ============================================================
// LÍNH LẮP TƯƠNG TÁC & NHẬP LIỆU TRỰC TIẾP
// ============================================================

const hiddenInput = document.getElementById("hidden-input");
const screenRaycaster = new THREE.Raycaster();
const screenPointer = new THREE.Vector2();

function checkScreenTouch(clientX, clientY) {
  const rect = renderer.domElement.getBoundingClientRect();
  screenPointer.x = ((clientX - rect.left) / rect.width) * 2 - 1;
  screenPointer.y = -((clientY - rect.top) / rect.height) * 2 + 1;

  screenRaycaster.setFromCamera(screenPointer, camera);
  const hits = screenRaycaster.intersectObject(interactiveScreen, true);

  if (hits.length > 0) {
    hiddenInput.focus();
    return true;
  }
  return false;
}

hiddenInput.addEventListener("input", (e) => {
  searchQuery = e.target.value;
  render3DScreen();
});

hiddenInput.addEventListener("keydown", (e) => {
  if (e.key === "Enter") {
    performSearch(searchQuery);
    hiddenInput.blur();
  }
});

renderer.domElement.addEventListener("pointerdown", (e) => {
  if (e.pointerType === "mouse") {
    checkScreenTouch(e.clientX, e.clientY);
  }
});

renderer.domElement.addEventListener("touchstart", (e) => {
  if (e.touches.length === 1) {
    checkScreenTouch(e.touches[0].clientX, e.touches[0].clientY);
  }
}, {passive: true});

// ============================================================
// PLAYER & MODEL LOADER
// ============================================================

const player=new THREE.Group();
scene.add(player);

let model=null;
const leafMeshes=[];
const armMeshes=[];
const rootMeshes=[];
const initialData=new Map();

const loader=new GLTFLoader();
loader.load(
  "scene.gltf",
  function(gltf){
    model=gltf.scene;
    model.position.y=.22;
    model.traverse(function(object){
      if(!object.isMesh) return;
      object.castShadow=true;
      object.receiveShadow=true;
      initialData.set(object,{
        position:object.position.clone(),
        rotation:object.rotation.clone(),
        scale:object.scale.clone()
      });
      const name=object.name.toLowerCase();
      if(name.includes("leaf")||name.includes("leaves")||name.includes("foliage")||name.includes("la")) leafMeshes.push(object);
      if(name.includes("arm")||name.includes("hand")||name.includes("tay")) armMeshes.push(object);
      if(name.includes("root")||name.includes("re")) rootMeshes.push(object);
    });
    player.add(model);
    loading.style.display="none";
  },
  undefined,
  function(){
    loading.textContent="Không tìm thấy scene.gltf";
  }
);

// ============================================================
// CONTROLS & MOVEMENT
// ============================================================

const input=new THREE.Vector2(0,0);
const velocity=new THREE.Vector3(0,0,0);
const walkSpeed=80.556;
const FLY_SPEED=97.222;
let moveSpeed=walkSpeed;
const gravity=-20;
let grounded=true;
let isFlying=false;

const joystick=document.getElementById("joystick-wrapper");
const stick=document.getElementById("joystick-stick");
let joystickTouch=null;
let centerX=0, centerY=0;
const radius=40;

joystick.addEventListener("touchstart", function(event){
  event.preventDefault();
  const touch=event.changedTouches[0];
  joystickTouch=touch.identifier;
  const rect=joystick.getBoundingClientRect();
  centerX=rect.left+rect.width/2;
  centerY=rect.top+rect.height/2;
  updateJoystick(touch);
}, {passive:false});

function updateJoystick(touch){
  const dx=touch.clientX-centerX;
  const dy=touch.clientY-centerY;
  const distance=Math.hypot(dx,dy);
  const angle=Math.atan2(dy,dx);
  const limited=Math.min(distance, radius);
  const x=Math.cos(angle)*limited;
  const y=Math.sin(angle)*limited;
  stick.style.transform=`translate(${x}px,${y}px)`;
  input.x=x/radius;
  input.y=-y/radius;
}

function resetJoystick(){
  joystickTouch=null;
  input.set(0,0);
  velocity.x=0;
  velocity.z=0;
  stick.style.transform="translate(0px,0px)";
}

window.addEventListener("touchmove", function(event){
  for(let i=0;i<event.changedTouches.length;i++){
    if(event.changedTouches[i].identifier===joystickTouch){
      updateJoystick(event.changedTouches[i]);
    }
  }
}, {passive:false});

window.addEventListener("touchend", function(event){
  for(let i=0;i<event.changedTouches.length;i++){
    if(event.changedTouches[i].identifier===joystickTouch) resetJoystick();
  }
});
window.addEventListener("touchcancel", resetJoystick);

const jump=document.getElementById("jump-btn");
let isJumpHolding=false;

jump.addEventListener("touchstart", function(event){
  event.preventDefault();
  isJumpHolding=true;
  if(!isFlying){
    isFlying=true;
    grounded=false;
    jump.classList.add("flying");
    moveSpeed=FLY_SPEED;
  }
}, {passive:false});

jump.addEventListener("touchend", function(event){ event.preventDefault(); isJumpHolding=false; });
jump.addEventListener("touchcancel", function(){ isJumpHolding=false; });

// Camera touch rotation
let cameraTouch=null, lastX=0, lastY=0;
window.addEventListener("touchstart", function(event){
  const touch=event.changedTouches[0];
  if(touch.identifier!==joystickTouch && cameraTouch===null){
    cameraTouch=touch.identifier;
    lastX=touch.clientX;
    lastY=touch.clientY;
  }
});

window.addEventListener("touchmove", function(event){
  for(let i=0;i<event.changedTouches.length;i++){
    const touch=event.changedTouches[i];
    if(touch.identifier===cameraTouch){
      const dx=touch.clientX-lastX;
      const dy=touch.clientY-lastY;
      targetCameraAngleY-=dx*.005;
      targetCameraAngleX=THREE.MathUtils.clamp(targetCameraAngleX+dy*.005, -Math.PI/2+.01, Math.PI/2-.05);
      lastX=touch.clientX;
      lastY=touch.clientY;
    }
  }
}, {passive:false});

window.addEventListener("touchend", function(event){
  for(let i=0;i<event.changedTouches.length;i++){
    if(event.changedTouches[i].identifier===cameraTouch) cameraTouch=null;
  }
});

// ============================================================
// ANIMATIONS & GAME LOOP
// ============================================================

let animationTime=0, animationBlend=0;

function animateSunflower(delta, moving){
  if(!model) return;
  animationBlend=THREE.MathUtils.lerp(animationBlend, moving?1:0, Math.min(delta*7,1));
  if(moving) animationTime+=delta*9.5;

  const wave=Math.sin(animationTime);
  model.position.y=THREE.MathUtils.lerp(model.position.y, .22+Math.abs(wave)*.10*animationBlend, Math.min(delta*13,1));
  model.rotation.z=THREE.MathUtils.lerp(model.rotation.z, wave*.035*animationBlend, Math.min(delta*8,1));
}

const clock=new THREE.Clock();

function animate(){
  requestAnimationFrame(animate);
  const delta=Math.min(clock.getDelta(), .05);
  const moving=input.lengthSq()>.01;

  if(moving){
    const forward=new THREE.Vector3(0,0,-1).applyAxisAngle(new THREE.Vector3(0,1,0), cameraAngleY);
    const right=new THREE.Vector3(1,0,0).applyAxisAngle(new THREE.Vector3(0,1,0), cameraAngleY);
    const movement=new THREE.Vector3().addScaledVector(right, input.x).addScaledVector(forward, input.y);

    if(movement.lengthSq()>0){
      movement.normalize();
      velocity.x=movement.x*moveSpeed;
      velocity.z=movement.z*moveSpeed;

      if(model){
        const targetRotation=Math.atan2(movement.x, movement.z);
        let difference=Math.atan2(Math.sin(targetRotation-model.rotation.y), Math.cos(targetRotation-model.rotation.y));
        model.rotation.y+=difference*Math.min(delta*10,1);
      }
    }
  }else{
    velocity.x=0;
    velocity.z=0;
  }

  animateSunflower(delta, moving);

  if(isFlying){
    velocity.y=THREE.MathUtils.lerp(velocity.y, isJumpHolding?50:0, delta*(isJumpHolding?5:3));
  }else{
    velocity.y+=gravity*delta;
  }

  player.position.y+=velocity.y*delta;
  if(player.position.y<=0){
    player.position.y=0;
    velocity.y=0;
    grounded=true;
    if(isFlying){
      isFlying=false;
      jump.classList.remove("flying");
      moveSpeed=walkSpeed;
    }
  }

  player.position.x+=velocity.x*delta;
  player.position.z+=velocity.z*delta;

  cameraPivot.position.copy(player.position);
  cameraPivot.position.y+=1.6;

  updateCamera();
  renderer.render(scene, camera);
}

animate();

function onResize(){
  camera.aspect=window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}
window.addEventListener("resize", onResize);

</script>
