<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini AI Assistant</title>
    <style>
        :root {
            --bg-color: #212121;
            --sidebar-color: #171717;
            --chat-bg: #212121;
            --user-msg-bg: #303030;
            --text-color: #ececec;
            --border-color: #383838;
            --input-bg: #2f2f2f;
            --accent-color: #10a37f;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Container chính */
        .app-container {
            display: flex;
            width: 100%;
            height: 100%;
        }

        /* Main Chat Area */
        .main-chat {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100%;
            position: relative;
        }

        /* Top Header */
        .header {
            padding: 12px 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--bg-color);
        }

        .header h1 {
            font-size: 16px;
            font-weight: 600;
        }

        .api-key-container {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .api-key-input {
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 13px;
            width: 240px;
            outline: none;
        }

        /* Message List */
        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .chat-wrapper {
            width: 100%;
            max-width: 768px;
            padding: 0 16px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .message {
            display: flex;
            gap: 16px;
            padding: 8px 0;
            line-height: 1.6;
            font-size: 15px;
        }

        .message.user {
            justify-content: flex-end;
        }

        .message-content {
            max-width: 80%;
            border-radius: 18px;
            padding: 12px 18px;
        }

        .message.user .message-content {
            background-color: var(--user-msg-bg);
            color: var(--text-color);
        }

        .message.assistant .message-content {
            background-color: transparent;
            color: var(--text-color);
            padding-left: 0;
        }

        .avatar {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: bold;
            flex-shrink: 0;
        }

        .assistant .avatar {
            background-color: #ab68ff;
            color: #fff;
        }

        /* Input Area */
        .input-container {
            padding: 16px;
            display: flex;
            justify-content: center;
            background-color: var(--bg-color);
        }

        .input-box {
            width: 100%;
            max-width: 768px;
            position: relative;
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 10px 16px;
            display: flex;
            align-items: center;
        }

        textarea {
            width: 100%;
            background: transparent;
            border: none;
            color: var(--text-color);
            font-size: 15px;
            resize: none;
            outline: none;
            max-height: 150px;
            height: 24px;
            line-height: 24px;
        }

        .send-btn {
            background-color: var(--text-color);
            color: #000;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-left: 8px;
            transition: opacity 0.2s;
        }

        .send-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .loading-dots span {
            animation: blink 1.4s infinite continuous;
            animation-fill-mode: both;
        }
        .loading-dots span:nth-child(2) { animation-delay: .2s; }
        .loading-dots span:nth-child(3) { animation-delay: .4s; }

        @keyframes blink {
            0% { opacity: .2; }
            20% { opacity: 1; }
            100% { opacity: .2; }
        }
    </style>
</head>
<body>

<div class="app-container">
    <div class="main-chat">
        <!-- Top Navigation -->
        <div class="header">
            <h1>Gemini ChatGPT Interface</h1>
            <div class="api-key-container">
                <input type="password" id="apiKey" class="api-key-input" placeholder="Dán Gemini API Key vào đây..." />
            </div>
        </div>

        <!-- Chat Stream Window -->
        <div class="messages-container" id="messagesContainer">
            <div class="chat-wrapper" id="chatWrapper">
                <div class="message assistant">
                    <div class="avatar">G</div>
                    <div class="message-content">
                        Xin chào! Tôi có thể giúp gì cho bạn hôm nay? Vui lòng nhập API Key ở góc trên bên phải để bắt đầu trò chuyện.
                    </div>
                </div>
            </div>
        </div>

        <!-- Input Box -->
        <div class="input-container">
            <div class="input-box">
                <textarea id="userInput" placeholder="Gửi tin nhắn cho Gemini..." rows="1" onkeydown="handleKeyDown(event)"></textarea>
                <button id="sendBtn" class="send-btn" onclick="sendMessage()">
                    ↑
                </button>
            </div>
        </div>
    </div>
</div>

<script>
    // Tự động thay đổi chiều cao của khung nhập liệu theo nội dung
    const textarea = document.getElementById('userInput');
    textarea.addEventListener('input', function() {
        this.style.height = 'auto';
        this.style.height = Math.min(this.scrollHeight, 150) + 'px';
    });

    function handleKeyDown(event) {
        if (event.key === 'Enter' && !event.shiftKey) {
            event.preventDefault();
            sendMessage();
        }
    }

    async function sendMessage() {
        const apiKey = document.getElementById('apiKey').value.trim();
        const inputField = document.getElementById('userInput');
        const messageText = inputField.value.trim();
        const chatWrapper = document.getElementById('chatWrapper');

        if (!messageText) return;
        if (!apiKey) {
            alert('Vui lòng nhập Gemini API Key ở ô phía trên trước khi gửi!');
            return;
        }

        // 1. Hiển thị tin nhắn của Người dùng
        appendMessage('user', messageText);
        inputField.value = '';
        inputField.style.height = '24px';

        // 2. Tạo khung phản hồi tạm thời cho AI
        const loadingId = 'loading-' + Date.now();
        appendLoadingMessage(loadingId);

        try {
            // 3. Trực tiếp gọi API của Gemini (Dùng mô hình gemini-1.5-flash)
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    contents: [{
                        parts: [{ text: messageText }]
                    }]
                })
            });

            const data = await response.json();
            
            // Xóa hiệu ứng loading
            document.getElementById(loadingId).remove();

            if (data.candidates && data.candidates[0].content.parts[0].text) {
                const aiResponse = data.candidates[0].content.parts[0].text;
                appendMessage('assistant', aiResponse);
            } else if (data.error) {
                appendMessage('assistant', `[Lỗi API]: ${data.error.message}`);
            } else {
                appendMessage('assistant', 'Không nhận được phản hồi hợp lệ từ hệ thống.');
            }

        } catch (error) {
            document.getElementById(loadingId).remove();
            appendMessage('assistant', `[Lỗi kết nối]: Không thể gửi yêu cầu. Chi tiết: ${error.message}`);
        }
    }

    function appendMessage(role, content) {
        const chatWrapper = document.getElementById('chatWrapper');
        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${role}`;

        if (role === 'user') {
            msgDiv.innerHTML = `
                <div class="message-content">${escapeHtml(content)}</div>
            `;
        } else {
            msgDiv.innerHTML = `
                <div class="avatar">G</div>
                <div class="message-content">${formatText(content)}</div>
            `;
        }

        chatWrapper.appendChild(msgDiv);
        scrollToBottom();
    }

    function appendLoadingMessage(id) {
        const chatWrapper = document.getElementById('chatWrapper');
        const msgDiv = document.createElement('div');
        msgDiv.className = 'message assistant';
        msgDiv.id = id;
        msgDiv.innerHTML = `
            <div class="avatar">G</div>
            <div class="message-content loading-dots">
                Đang suy nghĩ<span>.</span><span>.</span><span>.</span>
            </div>
        `;
        chatWrapper.appendChild(msgDiv);
        scrollToBottom();
    }

    function scrollToBottom() {
        const container = document.getElementById('messagesContainer');
        container.scrollTop = container.scrollHeight;
    }

    function escapeHtml(text) {
        return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    function formatText(text) {
        // Xuống dòng cơ bản
        return escapeHtml(text).replace(/\n/g, '<br>');
    }
</script>

</body>
</html>
