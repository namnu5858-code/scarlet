<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scarlet</title>
    
    <link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-title" content="Scarlet">
    <meta name="theme-color" content="#ffffff">

    <style>
        :root {
            --bg-body: #121212;
            --bg-app: #000000;
            --text-main: #ffffff;
            --text-sub: #8c939d;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        body, html {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: var(--bg-body);
            overflow: hidden;
        }
        .app-container {
            width: 100%;
            max-width: 420px;
            height: 100%;
            max-height: 850px;
            background-color: var(--bg-app);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            position: relative;
        }
        .splash-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-app);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 99;
        }
        .splash-logo {
            width: 120px;
            height: 120px;
            object-fit: contain;
            border-radius: 24px;
        }
        .footer-text {
            position: absolute;
            bottom: 30px;
            font-weight: 700;
            font-size: 14px;
            letter-spacing: 1px;
            color: #ffffff;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Màn hình chờ (Splash Screen) -->
        <div class="splash-screen" id="splashScreen">
            <img src="logo.png" alt="Logo" class="splash-logo">
            <div class="footer-text">BY TIEN</div>
        </div>

        <!-- Nội dung chính của ứng dụng -->
        <div style="padding: 20px; text-align: center; margin-top: 50px;">
            <h2>Ứng dụng Scarlet</h2>
        </div>
    </div>

</body>
</html>
