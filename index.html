<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sunflower Game 3D - School & Vampire Flower</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            font-family: Arial, sans-serif;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
        }
        #ui-layer {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #fff;
            text-shadow: 1px 1px 3px #000;
            pointer-events: none;
        }
        .btn-panel {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
            background: rgba(0, 0, 0, 0.6);
            padding: 10px 20px;
            border-radius: 30px;
            backdrop-filter: blur(5px);
        }
        button {
            background: #ff4757;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        button:hover {
            background: #ff6b81;
            transform: scale(1.05);
        }
    </style>
    <!-- Three.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
    <div id="canvas-container"></div>
    
    <div id="ui-layer">
        <h2>Sunflower Game 3D</h2>
        <p>Góc nhìn 3D: Trường học & Hoa Ma Cà Rồng</p>
    </div>

    <div class="btn-panel">
        <button id="btn-action">Hành Động</button>
        <button id="btn-reset">Đặt Lại Viễn Cảnh</button>
        <button id="btn-toggle-light">Đổi Ngày / Đêm</button>
    </div>

    <script>
        // 1. Khởi tạo Scene, Camera & Renderer
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a0521); // Màu nền tối huyền bí

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 15, 30);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        // 2. Ánh sáng (Lighting)
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xff5555, 0.8);
        dirLight.position.set(20, 40, 20);
        dirLight.castShadow = true;
        scene.add(dirLight);

        // 3. Mặt đất (Ground)
        const floorGeo = new THREE.PlaneGeometry(80, 80);
        const floorMat = new THREE.MeshStandardMaterial({ color: 0x221133 });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        floor.receiveShadow = true;
        scene.add(floor);

        // 4. Mô hình Trường Học (School Building)
        const schoolGroup = new THREE.Group();
        
        // Thân nhà chính
        const mainBuildingGeo = new THREE.BoxGeometry(20, 10, 10);
        const buildingMat = new THREE.MeshStandardMaterial({ color: 0x4a4a5a });
        const mainBuilding = new THREE.Mesh(mainBuildingGeo, buildingMat);
        mainBuilding.position.y = 5;
        mainBuilding.castShadow = true;
        schoolGroup.add(mainBuilding);

        // Mái nhà
        const roofGeo = new THREE.ConeGeometry(15, 5, 4);
        const roofMat = new THREE.MeshStandardMaterial({ color: 0x8b0000 });
        const roof = new THREE.Mesh(roofGeo, roofMat);
        roof.position.y = 12.5;
        roof.rotation.y = Math.PI / 4;
        schoolGroup.add(roof);

        // Cửa chính
        const doorGeo = new THREE.BoxGeometry(3, 5, 0.2);
        const doorMat = new THREE.MeshStandardMaterial({ color: 0x111111 });
        const door = new THREE.Mesh(doorGeo, doorMat);
        door.position.set(0, 2.5, 5.1);
        schoolGroup.add(door);

        schoolGroup.position.set(0, 0, -15);
        scene.add(schoolGroup);

        // 5. Mô hình Hoa Ma Cà Rồng (Vampire Flower)
        const flowerGroup = new THREE.Group();

        // Thân cây
        const stemGeo = new THREE.CylinderGeometry(0.3, 0.4, 6, 8);
        const stemMat = new THREE.MeshStandardMaterial({ color: 0x2d5a27 });
        const stem = new THREE.Mesh(stemGeo, stemMat);
        stem.position.y = 3;
        flowerGroup.add(stem);

        // Nhụy hoa Ma Cà Rồng (Tối / Đỏ)
        const coreGeo = new THREE.SphereGeometry(1.5, 16, 16);
        const coreMat = new THREE.MeshStandardMaterial({ color: 0x800020, roughness: 0.3 });
        const core = new THREE.Mesh(coreGeo, coreMat);
        core.position.y = 6;
        flowerGroup.add(core);

        // Cánh hoa
        const petalCount = 8;
        const petals = [];
        for (let i = 0; i < petalCount; i++) {
            const angle = (i / petalCount) * Math.PI * 2;
            const petalGeo = new THREE.ConeGeometry(0.8, 2.5, 4);
            const petalMat = new THREE.MeshStandardMaterial({ color: 0xd63031 });
            const petal = new THREE.Mesh(petalGeo, petalMat);
            
            petal.position.set(
                Math.sin(angle) * 1.8,
                6,
                Math.cos(angle) * 1.8
            );
            petal.rotation.x = Math.PI / 2;
            petal.rotation.z = -angle;
            
            flowerGroup.add(petal);
            petals.push(petal);
        }

        // Răng nanh ma cà rồng nhỏ trên hoa
        const fangGeo = new THREE.ConeGeometry(0.15, 0.6, 4);
        const fangMat = new THREE.MeshStandardMaterial({ color: 0xffffff });
        const fang1 = new THREE.Mesh(fangGeo, fangMat);
        fang1.position.set(-0.4, 5.5, 1.4);
        fang1.rotation.x = Math.PI;
        const fang2 = fang1.clone();
        fang2.position.x = 0.4;
        
        flowerGroup.add(fang1);
        flowerGroup.add(fang2);

        flowerGroup.position.set(0, 0, 5);
        scene.add(flowerGroup);

        // 6. Xử lý nút chức năng cơ bản
        let isNight = true;
        document.getElementById('btn-action').addEventListener('click', () => {
            // Hiệu ứng hoa xoay và nhảy nhẹ khi bấm
            flowerGroup.rotation.y += Math.PI / 2;
            flowerGroup.position.y = 1;
            setTimeout(() => flowerGroup.position.y = 0, 200);
        });

        document.getElementById('btn-reset').addEventListener('click', () => {
            camera.position.set(0, 15, 30);
            controls.reset();
            flowerGroup.rotation.set(0, 0, 0);
        });

        document.getElementById('btn-toggle-light').addEventListener('click', () => {
            isNight = !isNight;
            if (isNight) {
                scene.background.setHex(0x1a0521);
                ambientLight.intensity = 0.4;
            } else {
                scene.background.setHex(0x87ceeb); // Bầu trời sáng
                ambientLight.intensity = 0.8;
            }
        });

        // 7. Vòng lặp Render & Animation
        function animate() {
            requestAnimationFrame(animate);
            
            // Xoay cánh hoa chậm tạo hiệu ứng sinh động
            core.rotation.y += 0.01;
            
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        // Xử lý Co giãn màn hình (Resize)
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
