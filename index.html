<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Locket Clone</title>
    <style>
        :root {
            --bg-color: #000000;
            --surface-color: #1c1c1e;
            --surface-light: #2c2c2e;
            --primary-yellow: #ffb800;
            --text-main: #ffffff;
            --text-muted: #8e8e93;
            --danger-red: #ff453a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            height: 100dvh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Auth Screens */
        .screen {
            display: none;
            width: 100%;
            height: 100%;
            flex-direction: column;
            padding: 20px;
            position: relative;
        }

        .screen.active {
            display: flex;
        }

        .top-nav {
            display: flex;
            align-items: center;
            height: 44px;
            margin-bottom: 20px;
        }

        .back-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: var(--surface-color);
            border: none;
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .auth-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding-bottom: 60px;
        }

        .auth-title {
            font-size: 28px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 24px;
            letter-spacing: -0.5px;
        }

        .input-box {
            width: 100%;
            background-color: var(--surface-color);
            border: none;
            border-radius: 18px;
            padding: 18px 20px;
            color: var(--text-main);
            font-size: 17px;
            font-weight: 600;
            outline: none;
            margin-bottom: 16px;
            user-select: text;
        }

        .input-box::placeholder {
            color: #636366;
        }

        .pill-btn {
            align-self: center;
            background-color: var(--surface-color);
            color: var(--text-main);
            border: none;
            border-radius: 20px;
            padding: 10px 18px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 4px;
        }

        .auth-footer {
            display: flex;
            flex-direction: column;
            gap: 16px;
            padding-bottom: 10px;
        }

        .terms-text {
            font-size: 12px;
            color: var(--text-muted);
            text-align: center;
            line-height: 1.4;
            padding: 0 10px;
        }

        .terms-text span {
            color: var(--text-main);
            font-weight: 600;
        }

        .continue-btn {
            width: 100%;
            height: 56px;
            border-radius: 28px;
            border: none;
            background-color: var(--surface-color);
            color: #636366;
            font-size: 17px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: not-allowed;
            transition: all 0.2s ease;
        }

        .continue-btn.ready {
            background-color: var(--primary-yellow);
            color: #000000;
            cursor: pointer;
        }

        /* Main Screen Initial State: Clean with compact Add button */
        #main-screen {
            padding: 20px;
            justify-content: center;
            align-items: center;
        }

        .initial-actions {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            width: 100%;
            max-width: 300px;
        }

        .add-photos-hero-btn {
            width: 100%;
            padding: 20px;
            border-radius: 28px;
            background-color: var(--surface-color);
            border: 2px dashed #3a3a3c;
            color: var(--text-main);
            font-size: 18px;
            font-weight: 700;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            transition: border-color 0.2s ease;
        }

        .add-photos-hero-btn:hover {
            border-color: var(--primary-yellow);
        }

        .history-btn-standalone {
            background-color: var(--surface-color);
            color: var(--text-muted);
            border: none;
            padding: 12px 24px;
            border-radius: 20px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Active Camera/Editor State */
        .active-editor-ui {
            display: none;
            flex-direction: column;
            width: 100%;
            height: 100%;
            justify-content: space-between;
        }

        .main-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 44px;
            width: 100%;
        }

        .icon-circle {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background-color: var(--surface-color);
            border: none;
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .viewfinder-container {
            width: 100%;
            aspect-ratio: 1 / 1;
            background-color: #141414;
            border-radius: 44px;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        video#camera-stream, img#captured-preview {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
        }

        video#camera-stream.mirrored {
            transform: scaleX(-1);
        }

        .camera-overlay-btn {
            position: absolute;
            top: 16px;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background-color: rgba(44, 44, 46, 0.75);
            backdrop-filter: blur(8px);
            border: none;
            color: var(--text-main);
            font-size: 13px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 10;
        }

        .flash-btn { left: 16px; }
        .flash-btn.active { background-color: var(--primary-yellow); color: #000000; }
        .zoom-btn { right: 16px; }

        .caption-input {
            position: absolute;
            bottom: 18px;
            left: 50%;
            transform: translateX(-50%);
            background-color: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(10px);
            border: none;
            border-radius: 20px;
            padding: 12px 20px;
            color: #ffffff;
            font-size: 16px;
            font-weight: 600;
            text-align: center;
            width: 85%;
            outline: none;
            z-index: 10;
            user-select: text;
        }

        .controls-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            width: 100%;
        }

        .shutter-row {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-around;
            padding: 0 12px;
        }

        .action-icon-btn {
            width: 48px;
            height: 48px;
            border-radius: 14px;
            background-color: var(--surface-color);
            border: 1.5px solid #3a3a3c;
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .shutter-outer {
            width: 84px;
            height: 84px;
            border-radius: 50%;
            border: 4px solid var(--primary-yellow);
            padding: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.1s ease;
        }

        .shutter-outer:active { transform: scale(0.92); }

        .shutter-inner {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background-color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Modals */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background-color: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(16px);
            z-index: 100;
            display: none;
            flex-direction: column;
            padding: 20px;
            animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .modal-overlay.active { display: flex; }

        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 20px;
            border-bottom: 1px solid #2c2c2e;
        }

        .modal-title { font-size: 20px; font-weight: 700; }

        .close-modal {
            background-color: var(--surface-color);
            border: none;
            color: var(--text-main);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .empty-state {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: var(--text-muted);
            gap: 12px;
        }

        .empty-state p { font-size: 18px; font-weight: 700; color: var(--text-main); }
        .empty-state span { font-size: 14px; max-width: 260px; line-height: 1.4; }

        .history-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            padding-top: 20px;
            overflow-y: auto;
            align-content: start;
        }

        .history-card {
            aspect-ratio: 1 / 1;
            border-radius: 20px;
            overflow: hidden;
            background-color: var(--surface-color);
            position: relative;
        }

        .history-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .toast {
            position: fixed;
            top: 40px;
            left: 50%;
            transform: translateX(-50%);
            background-color: var(--surface-light);
            color: var(--text-main);
            padding: 12px 24px;
            border-radius: 24px;
            font-size: 15px;
            font-weight: 600;
            z-index: 300;
            display: none;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid #3a3a3c;
        }
    </style>
</head>
<body>

    <div id="toast" class="toast"></div>

    <!-- Screen 1: Email -->
    <div id="email-screen" class="screen active">
        <div class="top-nav">
            <button class="back-btn" onclick="showToast('Bạn đang ở bước đầu tiên')">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
            </button>
        </div>

        <div class="auth-content">
            <h1 class="auth-title">Email của bạn là gì?</h1>
            <input type="email" id="email-input" class="input-box" placeholder="Địa chỉ email" autocomplete="email">
            <button class="pill-btn" onclick="toggleAuthMode()">Sử dụng số điện thoại thay cho cách này</button>
        </div>

        <div class="auth-footer">
            <p class="terms-text">
                Bằng cách nhấn Tiếp tục, bạn đồng ý với <span>Điều khoản dịch vụ</span> và <span>Chính sách quyền riêng tư</span>
            </p>
            <button id="email-continue-btn" class="continue-btn" disabled onclick="goToPassword()">
                Tiếp tục
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
            </button>
        </div>
    </div>

    <!-- Screen 2: Password -->
    <div id="password-screen" class="screen">
        <div class="top-nav">
            <button class="back-btn" onclick="goBackToEmail()">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
            </button>
        </div>

        <div class="auth-content">
            <h1 class="auth-title">Điền mật khẩu của bạn</h1>
            <input type="password" id="password-input" class="input-box" placeholder="Mật khẩu">
            <button class="pill-btn" onclick="showToast('Chức năng chưa khả dụng')">Quên mật khẩu?</button>
        </div>

        <div class="auth-footer">
            <button id="password-continue-btn" class="continue-btn" disabled onclick="completeLogin()">
                Tiếp tục
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
            </button>
        </div>
    </div>

    <!-- Screen 3: Main Screen (Starts clean) -->
    <div id="main-screen" class="screen">
        
        <!-- Compact Initial State -->
        <div id="initial-state-ui" class="initial-actions">
            <button class="add-photos-hero-btn" onclick="triggerAddPhotos()">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="16"></line><line x1="8" y1="12" x2="16" y2="12"></line></svg>
                <span>Thêm Ảnh</span>
            </button>
            <button class="history-btn-standalone" onclick="openModal('history-modal')">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
                Lịch sử hoạt động
            </button>
        </div>

        <!-- Active Camera/Editor UI (Hidden initially) -->
        <div id="active-editor-ui" class="active-editor-ui">
            <div class="main-header">
                <button class="icon-circle" onclick="switchStateToInitial()">
                    ✕
                </button>
                <button class="history-btn-standalone" style="padding: 6px 16px; font-size: 13px;" onclick="triggerAddPhotos()">
                    + Thêm ảnh khác
                </button>
            </div>

            <div class="viewfinder-container">
                <button id="flash-btn" class="camera-overlay-btn flash-btn" onclick="toggleFlash()">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>
                </button>
                <button id="zoom-btn" class="camera-overlay-btn zoom-btn" onclick="toggleZoom()">1x</button>

                <video id="camera-stream" autoplay playsinline muted></video>
                <img id="captured-preview" alt="Preview">
                <input type="text" id="caption-input" class="caption-input" placeholder="Thêm chú thích...">
            </div>

            <div class="controls-area">
                <div class="shutter-row">
                    <button id="left-action-btn" class="action-icon-btn" onclick="handleLeftAction()">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="4" ry="4"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
                    </button>
                    <input type="file" id="file-picker" accept="image/*" style="display: none;" onchange="handleFileSelect(event)">

                    <div class="shutter-outer" onclick="handleShutter()">
                        <div id="shutter-inner" class="shutter-inner"></div>
                    </div>

                    <button class="action-icon-btn" onclick="flipCamera()">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.8-4.3M22 12.5a10 10 0 0 1-18.8 4.2"/></svg>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modals -->
    <div id="history-modal" class="modal-overlay">
        <div class="modal-header">
            <span class="modal-title">Lịch sử</span>
            <button class="close-modal" onclick="closeModal('history-modal')">✕</button>
        </div>
        <div id="history-empty" class="empty-state">
            <p>Chưa có ảnh nào</p>
            <span>Khoảnh khắc của bạn sẽ xuất hiện ở đây sau khi gửi.</span>
        </div>
        <div id="history-grid" class="history-grid" style="display: none;"></div>
    </div>

    <canvas id="capture-canvas" style="display: none;"></canvas>

    <script>
        let stream = null;
        let facingMode = "user";
        let zoomLevel = 1;
        let flashOn = false;
        let isPreviewMode = false;
        let photos = [];

        const emailInput = document.getElementById('email-input');
        const emailBtn = document.getElementById('email-continue-btn');
        const passInput = document.getElementById('password-input');
        const passBtn = document.getElementById('password-continue-btn');

        emailInput.addEventListener('input', () => {
            emailBtn.classList.toggle('ready', emailInput.value.trim().length > 3);
            emailBtn.disabled = !emailInput.value.trim().length > 3;
        });

        passInput.addEventListener('input', () => {
            passBtn.classList.toggle('ready', passInput.value.length >= 1);
            passBtn.disabled = !passInput.value.length >= 1;
        });

        function toggleAuthMode() {
            const isPhone = emailInput.type === "email";
            emailInput.placeholder = isPhone ? "Số điện thoại" : "Địa chỉ email";
            emailInput.type = isPhone ? "tel" : "email";
            document.querySelector('#email-screen .auth-title').textContent = isPhone ? "Số điện thoại của bạn là gì?" : "Email của bạn là gì?";
            document.querySelector('#email-screen .pill-btn').textContent = isPhone ? "Sử dụng email thay cho cách này" : "Sử dụng số điện thoại thay cho cách này";
        }

        function goToPassword() {
            switchScreen('password-screen');
            setTimeout(() => passInput.focus(), 100);
        }

        function goBackToEmail() { switchScreen('email-screen'); }

        function completeLogin() {
            passBtn.textContent = "Đã sẵn sàng!";
            setTimeout(() => {
                switchScreen('main-screen');
                passBtn.innerHTML = `Tiếp tục <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>`;
            }, 300);
        }

        function switchScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        // State switching between clean initial state and active editor
        function switchStateToInitial() {
            stopCamera();
            resetPreview();
            document.getElementById('initial-state-ui').style.display = 'flex';
            document.getElementById('active-editor-ui').style.display = 'none';
        }

        function triggerAddPhotos() {
            document.getElementById('initial-state-ui').style.display = 'none';
            document.getElementById('active-editor-ui').style.display = 'flex';
            startCamera();
        }

        // Camera Logic
        async function startCamera() {
            stopCamera();
            const video = document.getElementById('camera-stream');
            try {
                stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: facingMode, aspectRatio: 1 },
                    audio: false
                });
                video.srcObject = stream;
                video.style.display = 'block';
                video.classList.toggle('mirrored', facingMode === 'user');
            } catch (err) {
                console.warn("Camera access denied or unavailable", err);
            }
        }

        function stopCamera() {
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
                stream = null;
            }
        }

        function flipCamera() {
            if (isPreviewMode) return;
            facingMode = facingMode === 'user' ? 'environment' : 'user';
            startCamera();
        }

        function toggleZoom() {
            const video = document.getElementById('camera-stream');
            zoomLevel = zoomLevel === 1 ? 2 : 1;
            document.getElementById('zoom-btn').textContent = zoomLevel + 'x';
            video.style.transform = facingMode === 'user' ? `scaleX(-1) scale(${zoomLevel})` : `scale(${zoomLevel})`;
        }

        function toggleFlash() {
            flashOn = !flashOn;
            document.getElementById('flash-btn').classList.toggle('active', flashOn);
            showToast(flashOn ? 'Đã bật đèn flash' : 'Đã tắt đèn flash');
        }

        function handleShutter() {
            if (!isPreviewMode) {
                capturePhoto();
            } else {
                sendPhoto();
            }
        }

        function capturePhoto() {
            const video = document.getElementById('camera-stream');
            const canvas = document.getElementById('capture-canvas');
            const preview = document.getElementById('captured-preview');

            canvas.width = 600;
            canvas.height = 600;
            const ctx = canvas.getContext('2d');

            if (video.style.display === 'block' && video.videoWidth > 0) {
                if (facingMode === 'user') {
                    ctx.translate(canvas.width, 0);
                    ctx.scale(-1, 1);
                }
                const size = Math.min(video.videoWidth, video.videoHeight);
                const sx = (video.videoWidth - size) / 2;
                const sy = (video.videoHeight - size) / 2;
                ctx.drawImage(video, sx, sy, size, size, 0, 0, canvas.width, canvas.height);
            } else {
                ctx.fillStyle = '#1c1c1e';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }

            preview.src = canvas.toDataURL('image/jpeg', 0.9);
            enterPreviewMode();
        }

        function handleLeftAction() {
            if (isPreviewMode) {
                resetPreview();
            } else {
                document.getElementById('file-picker').click();
            }
        }

        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                document.getElementById('captured-preview').src = e.target.result;
                enterPreviewMode();
            };
            reader.readAsDataURL(file);
            event.target.value = '';
        }

        function enterPreviewMode() {
            isPreviewMode = true;
            document.getElementById('camera-stream').style.display = 'none';
            document.getElementById('captured-preview').style.display = 'block';
            document.getElementById('caption-input').style.display = 'block';
            document.getElementById('left-action-btn').innerHTML = '✕';
            document.getElementById('shutter-inner').innerHTML = `<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2.5"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>`;
        }

        function resetPreview() {
            isPreviewMode = false;
            document.getElementById('captured-preview').style.display = 'none';
            document.getElementById('caption-input').style.display = 'none';
            document.getElementById('caption-input').value = '';
            document.getElementById('left-action-btn').innerHTML = `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="4" ry="4"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>`;
            document.getElementById('shutter-inner').innerHTML = '';
            if (stream) {
                document.getElementById('camera-stream').style.display = 'block';
            }
        }

        function sendPhoto() {
            const imgData = document.getElementById('captured-preview').src;
            photos.unshift(imgData);
            updateHistoryUI();
            showToast('Đã gửi Locket!');
            switchStateToInitial();
        }

        function updateHistoryUI() {
            const emptyState = document.getElementById('history-empty');
            const grid = document.getElementById('history-grid');
            if (photos.length === 0) {
                emptyState.style.display = 'flex';
                grid.style.display = 'none';
            } else {
                emptyState.style.display = 'none';
                grid.style.display = 'grid';
                grid.innerHTML = photos.map(src => `<div class="history-card"><img src="${src}" alt="Locket"></div>`).join('');
            }
        }

        function openModal(id) { document.getElementById(id).classList.add('active'); }
        function closeModal(id) { document.getElementById(id).classList.remove('active'); }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.style.display = 'block';
            clearTimeout(window.toastTimer);
            window.toastTimer = setTimeout(() => { toast.style.display = 'none'; }, 2200);
        }
    </script>
</body>
</html>
