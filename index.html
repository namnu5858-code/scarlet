<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khuôn viên 3D Trường THCS Cam Thượng - Three.js</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
            user-select: none;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
        }
    </style>
    <!-- Import Three.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div id="canvas-container"></div>

    <script>
        // ==========================================
        // LỚP QUẢN LÝ NHÂN VẬT (PLAYER CONTROLLER)
        // ==========================================
        class PlayerController {
            constructor(camera) {
                this.camera = camera;
                this.position = new THREE.Vector3(0, 1.7, 80);
                this.velocity = new THREE.Vector3();
                this.height = 1.7;
                this.isFlying = false;
                this.isGrounded = true;

                // Thông số tốc độ
                this.walkSpeed = 5.0; // m/s
                this.flySpeed = 35.0 / 3.6; // 35 km/h (~9.72 m/s)
                this.gravity = -9.81;
                this.jumpForce = 5.0;

                // Góc xoay Camera
                this.pitch = 0;
                this.yaw = 0;
                this.isMouseDown = false;
                this.mouseX = 0;
                this.mouseY = 0;

                this.keys = {};
                this.spaceClickCount = 0;
                this.lastSpaceTime = 0;
                this.multiTapDelay = 350;

                this.initEventListeners();
            }

            initEventListeners() {
                window.addEventListener('keydown', (e) => {
                    this.keys[e.code] = true;
                    if (e.code === 'Space') {
                        const now = performance.now();
                        if (now - this.lastSpaceTime < this.multiTapDelay) {
                            this.spaceClickCount++;
                        } else {
                            this.spaceClickCount = 1;
                        }
                        this.lastSpaceTime = now;
                        this.handleSpaceMultiTap();
                    }
                });

                window.addEventListener('keyup', (e) => {
                    this.keys[e.code] = false;
                });

                document.addEventListener('mousedown', (e) => {
                    if (e.button === 0) {
                        this.isMouseDown = true;
                        this.mouseX = e.clientX;
                        this.mouseY = e.clientY;
                    }
                });

                document.addEventListener('mouseup', () => {
                    this.isMouseDown = false;
                });

                document.addEventListener('mousemove', (e) => {
                    if (!this.isMouseDown) return;

                    const deltaX = e.clientX - this.mouseX;
                    const deltaY = e.clientY - this.mouseY;

                    this.mouseX = e.clientX;
                    this.mouseY = e.clientY;

                    this.yaw -= deltaX * 0.003;
                    this.pitch -= deltaY * 0.003;

                    // Giới hạn camera: không nhìn xuyên xuống đất, ngước được lên trời
                    const maxPitch = Math.PI / 2 - 0.05;
                    const minPitch = 0.0;
                    this.pitch = Math.max(minPitch, Math.min(maxPitch, this.pitch));
                });
            }

            handleSpaceMultiTap() {
                setTimeout(() => {
                    if (this.spaceClickCount === 1) {
                        if (this.isGrounded && !this.isFlying) {
                            this.velocity.y = this.jumpForce;
                            this.isGrounded = false;
                        }
                    } else if (this.spaceClickCount === 2) {
                        // Kích hoạt bay (35 km/h)
                        this.isFlying = true;
                        this.velocity.set(0, 0, 0);
                    } else if (this.spaceClickCount >= 3) {
                        // Tắt bay / Đáp đất
                        this.isFlying = false;
                    }
                    this.spaceClickCount = 0;
                }, this.multiTapDelay);
            }

            update(delta) {
                const euler = new THREE.Euler(this.pitch, this.yaw, 0, 'YXZ');
                const lookDirection = new THREE.Vector3(0, 0, -1).applyEuler(euler);

                const forwardVector = new THREE.Vector3(Math.sin(this.yaw), 0, Math.cos(this.yaw)).negate();
                const sideVector = new THREE.Vector3().crossVectors(new THREE.Vector3(0, 1, 0), forwardVector).negate();

                const moveDir = new THREE.Vector3();

                if (this.keys['KeyW']) moveDir.add(forwardVector);
                if (this.keys['KeyS']) moveDir.sub(forwardVector);
                if (this.keys['KeyA']) moveDir.sub(sideVector);
                if (this.keys['KeyD']) moveDir.add(sideVector);

                moveDir.normalize();

                if (this.isFlying) {
                    const flyVector = moveDir.clone().multiplyScalar(this.flySpeed * delta);
                    if (this.keys['KeyW']) flyVector.y += lookDirection.y * this.flySpeed * delta;

                    this.position.add(flyVector);

                    if (this.position.y < this.height) {
                        this.position.y = this.height;
                    }
                } else {
                    this.position.addScaledVector(moveDir, this.walkSpeed * delta);

                    this.velocity.y += this.gravity * delta;
                    this.position.y += this.velocity.y * delta;

                    if (this.position.y <= this.height) {
                        this.position.y = this.height;
                        this.velocity.y = 0;
                        this.isGrounded = true;
                    }
                }

                this.camera.position.copy(this.position);
                this.camera.lookAt(this.position.clone().add(lookDirection));
            }
        }

        // ==========================================
        // 1. KHỞI TẠO SCENE, CAMERA, RENDERER
        // ==========================================
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb);
        scene.fog = new THREE.FogExp2(0x87ceeb, 0.0015);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1500);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        // Khởi tạo Nhân vật
        const playerController = new PlayerController(camera);

        // ==========================================
        // 2. HỆ THỐNG ÁNH SÁNG (LIGHTING)
        // ==========================================
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
        scene.add(ambientLight);

        const sunLight = new THREE.DirectionalLight(0xffffff, 0.8);
        sunLight.position.set(150, 250, 100);
        sunLight.castShadow = true;
        sunLight.shadow.mapSize.width = 2048;
        sunLight.shadow.mapSize.height = 2048;
        sunLight.shadow.camera.near = 0.5;
        sunLight.shadow.camera.far = 800;
        const d = 200;
        sunLight.shadow.camera.left = -d;
        sunLight.shadow.camera.right = d;
        sunLight.shadow.camera.top = d;
        sunLight.shadow.camera.bottom = -d;
        scene.add(sunLight);

        // ==========================================
        // 3. TẠO PROCEDURAL TEXTURES (VÂN GẠCH NÂU HỒNG)
        // ==========================================
        function generateCourtyardTileTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 256;
            canvas.height = 256;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = '#b5655b';
            ctx.fillRect(0, 0, 256, 256);

            ctx.strokeStyle = '#e0a899';
            ctx.lineWidth = 6;

            const cols = 4;
            const rows = 8;
            const w = 256 / cols;
            const h = 256 / rows;

            for (let i = 0; i < cols; i++) {
                for (let j = 0; j < rows; j++) {
                    ctx.strokeRect(i * w, j * h, w, h);
                }
            }

            const texture = new THREE.CanvasTexture(canvas);
            texture.wrapS = THREE.RepeatWrapping;
            texture.wrapT = THREE.RepeatWrapping;
            return texture;
        }

        const courtyardTexture = generateCourtyardTileTexture();
        courtyardTexture.repeat.set(65, 52.5);

        // ==========================================
        // 4. DỰNG NỀN ĐẤT VÀ SÂN TRƯỜNG
        // ==========================================
        const outerGroundGeo = new THREE.PlaneGeometry(900, 900);
        const outerGroundMat = new THREE.MeshStandardMaterial({ color: 0x557a46, roughness: 0.9 });
        const outerGround = new THREE.Mesh(outerGroundGeo, outerGroundMat);
        outerGround.rotation.x = -Math.PI / 2;
        outerGround.position.y = -0.1;
        outerGround.receiveShadow = true;
        scene.add(outerGround);

        const mainCourtyardGeo = new THREE.PlaneGeometry(260, 210);
        const mainCourtyardMat = new THREE.MeshStandardMaterial({ 
            map: courtyardTexture, 
            roughness: 0.6 
        });
        const mainCourtyard = new THREE.Mesh(mainCourtyardGeo, mainCourtyardMat);
        mainCourtyard.rotation.x = -Math.PI / 2;
        mainCourtyard.position.set(0, 0, 0);
        mainCourtyard.receiveShadow = true;
        scene.add(mainCourtyard);

        // ==========================================
        // 5. DỰNG TÒA NHÀ A (HÌNH CHỮ L - 4 TẦNG)
        // ==========================================
        const buildingAGroup = new THREE.Group();

        const wallLightBlueMat = new THREE.MeshStandardMaterial({ color: 0xa0c4ff, roughness: 0.5 });
        const wallWhiteMat = new THREE.MeshStandardMaterial({ color: 0xf8f9fa, roughness: 0.4 });
        const roofMat = new THREE.MeshStandardMaterial({ color: 0x343a40, roughness: 0.3 });
        const windowFrameMat = new THREE.MeshStandardMaterial({ color: 0x212529, roughness: 0.2 });
        const glassMat = new THREE.MeshStandardMaterial({ color: 0x89cff0, roughness: 0.1, transparent: true, opacity: 0.6 });
        const stairMat = new THREE.MeshStandardMaterial({ color: 0xd3d3d3, roughness: 0.6 });

        const floorHeight = 4.0;
        const totalFloors = 4;
        const buildingHeight = floorHeight * totalFloors;
        const wingWidth = 15;

        function createBuildingBlock(length, height, depth) {
            const blockGroup = new THREE.Group();

            const mainMesh = new THREE.Mesh(new THREE.BoxGeometry(length, height, depth), wallLightBlueMat);
            mainMesh.position.y = height / 2;
            mainMesh.castShadow = true;
            mainMesh.receiveShadow = true;
            blockGroup.add(mainMesh);

            const baseWhiteMesh = new THREE.Mesh(new THREE.BoxGeometry(length + 0.2, 1.5, depth + 0.2), wallWhiteMat);
            baseWhiteMesh.position.y = 0.75;
            baseWhiteMesh.castShadow = true;
            blockGroup.add(baseWhiteMesh);

            for (let f = 1; f < totalFloors; f++) {
                const bandMesh = new THREE.Mesh(new THREE.BoxGeometry(length + 0.2, 0.4, depth + 0.2), wallWhiteMat);
                bandMesh.position.y = f * floorHeight;
                bandMesh.castShadow = true;
                blockGroup.add(bandMesh);
            }

            const roofMesh = new THREE.Mesh(new THREE.BoxGeometry(length + 0.6, 0.6, depth + 0.6), roofMat);
            roofMesh.position.y = height + 0.3;
            roofMesh.castShadow = true;
            blockGroup.add(roofMesh);

            const windowWidth = 2.0;
            const windowHeight = 1.8;
            const spacing = 4.0;
            const numWindows = Math.floor(length / spacing) - 1;

            for (let f = 0; f < totalFloors; f++) {
                const yPos = f * floorHeight + 2.2;
                for (let i = 0; i < numWindows; i++) {
                    const xPos = -length / 2 + spacing * (i + 1);

                    const winGroupFront = createSingleWindow(windowWidth, windowHeight);
                    winGroupFront.position.set(xPos, yPos, depth / 2 + 0.05);
                    blockGroup.add(winGroupFront);

                    const winGroupBack = createSingleWindow(windowWidth, windowHeight);
                    winGroupBack.position.set(xPos, yPos, -depth / 2 - 0.05);
                    winGroupBack.rotation.y = Math.PI;
                    blockGroup.add(winGroupBack);
                }
            }

            return blockGroup;
        }

        function createSingleWindow(w, h) {
            const winGroup = new THREE.Group();
            const frame = new THREE.Mesh(new THREE.BoxGeometry(w, h, 0.1), windowFrameMat);
            const pane = new THREE.Mesh(new THREE.BoxGeometry(w - 0.2, h - 0.2, 0.12), glassMat);
            winGroup.add(frame);
            winGroup.add(pane);
            return winGroup;
        }

        const wingLengthA = 80;
        const wingA = createBuildingBlock(wingLengthA, buildingHeight, wingWidth);
        wingA.position.set(wingLengthA / 2, 0, 0);
        buildingAGroup.add(wingA);

        const wingLengthB = 60;
        const wingB = createBuildingBlock(wingLengthB, buildingHeight, wingWidth);
        wingB.rotation.y = Math.PI / 2;
        wingB.position.set(wingWidth / 2, 0, wingLengthB / 2 + wingWidth / 2);
        buildingAGroup.add(wingB);

        const stairGroup = new THREE.Group();
        const numStepsPerFloor = 10;
        const stepWidth = 4.0;
        const stepDepth = 0.4;
        const stepHeight = floorHeight / numStepsPerFloor;

        for (let f = 0; f < totalFloors - 1; f++) {
            for (let s = 0; s < numStepsPerFloor; s++) {
                const stepMesh = new THREE.Mesh(new THREE.BoxGeometry(stepWidth, stepHeight, stepDepth), stairMat);
                stepMesh.position.set(
                    wingWidth + 2,
                    f * floorHeight + s * stepHeight + stepHeight / 2,
                    wingWidth + s * stepDepth + (f % 2 === 0 ? 0 : numStepsPerFloor * stepDepth)
                );
                stepMesh.castShadow = true;
                stepMesh.receiveShadow = true;
                stairGroup.add(stepMesh);
            }
        }
        buildingAGroup.add(stairGroup);

        buildingAGroup.position.set(-80, 0, -60);
        scene.add(buildingAGroup);

        // ==========================================
        // 6. KHU VỰC LỄ ĐƯỜNG / SÂN KHẤU GIẢNG ĐƯỜNG
        // ==========================================
        const stageGroup = new THREE.Group();

        const stageBase = new THREE.Mesh(new THREE.BoxGeometry(30, 1.0, 15), wallWhiteMat);
        stageBase.position.set(0, 0.5, 0);
        stageBase.castShadow = true;
        stageBase.receiveShadow = true;
        stageGroup.add(stageBase);

        const stageStepsCount = 5;
        for (let i = 0; i < stageStepsCount; i++) {
            const step = new THREE.Mesh(new THREE.BoxGeometry(30, 0.2, 0.5), stairMat);
            step.position.set(0, i * 0.2 + 0.1, 7.5 + i * 0.5 + 0.25);
            step.castShadow = true;
            step.receiveShadow = true;
            stageGroup.add(step);
        }

        const pillarMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.3 });
        const pillarGeo = new THREE.CylinderGeometry(0.6, 0.6, 6, 16);
        const pillarPositions = [-12, -4, 4, 12];

        pillarPositions.forEach(x => {
            const pillar = new THREE.Mesh(pillarGeo, pillarMat);
            pillar.position.set(x, 4.0, -5);
            pillar.castShadow = true;
            pillar.receiveShadow = true;
            stageGroup.add(pillar);
        });

        const stageRoof = new THREE.Mesh(new THREE.BoxGeometry(32, 0.5, 18), roofMat);
        stageRoof.position.set(0, 7.25, -1);
        stageRoof.castShadow = true;
        stageGroup.add(stageRoof);

        stageGroup.position.set(0, 0, 10);
        scene.add(stageGroup);

        // ==========================================
        // 7. VÒNG LẶP CẬP NHẬT (ANIMATION LOOP)
        // ==========================================
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();

            // Cập nhật logic nhân vật
            playerController.update(delta);

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
