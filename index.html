<style>
*{
  box-sizing:border-box;
  -webkit-user-select:none;
  user-select:none;
  -webkit-touch-callout:none;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#8fd4f5;
  touch-action:none;
  font-family:Arial,sans-serif;
}

#game-container{
  position:fixed;
  top:0;
  left:0;
  width:100vw;
  height:100vh;
  z-index:1;
}

canvas{
  display:block;
  width:100vw !important;
  height:100vh !important;
}

.glass-ui{
  background:rgba(255,255,255,.18);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  border:1px solid rgba(255,255,255,.4);
  box-shadow:0 8px 32px rgba(0,0,0,.18);
}

#joystick-wrapper{
  position:absolute;
  left:32px;
  bottom:32px;
  width:120px;
  height:120px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:20;
  touch-action:none;
}

#joystick-stick{
  position:absolute;
  width:52px;
  height:52px;
  border-radius:50%;
  background:rgba(255,255,255,.58);
  border:1px solid rgba(255,255,255,.85);
  box-shadow:0 4px 14px rgba(0,0,0,.18);
  pointer-events:none;
}

#jump-btn{
  position:absolute;
  right:32px;
  bottom:38px;
  width:72px;
  height:72px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:20;
  touch-action:none;
  transition:background .3s ease,transform .1s ease;
}

#jump-btn.flying{
  background:rgba(255,215,0,.55);
  border-color:rgba(255,255,255,.9);
  box-shadow:0 0 15px rgba(255,215,0,.6);
}

#jump-btn:active{
  transform:scale(.94);
}

#jump-btn svg{
  width:34px;
  height:34px;
  fill:none;
  stroke:white;
  stroke-width:2.5;
  stroke-linecap:round;
  stroke-linejoin:round;
}

#loading{
  position:absolute;
  top:14px;
  right:16px;
  padding:8px 14px;
  border-radius:10px;
  background:rgba(0,0,0,.42);

.yt-logo-icon {

.yt-search-box {

.yt-search-box button {

#close-yt-btn {

#youtube-body {

#yt-player-container {

#yt-player-container iframe {

#yt-results-list {

// ============================================================

const camera=new THREE.PerspectiveCamera(
  60,
  window.innerWidth/window.innerHeight,
  0.1,

);
cameraPivot.add(camera);

let cameraDistance=10;
let targetCameraDistance=10;

let cameraAngleX=0.1;
let cameraAngleY=0;

let targetCameraAngleX=0.1;
let targetCameraAngleY=0;

const renderer=new THREE.WebGLRenderer({
  antialias:true,
  powerPreference:"high-performance"
});

renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.12;

container.appendChild(renderer.domElement);

// ============================================================
// CAMERA COLLISION
// ============================================================

const raycaster=new THREE.Raycaster();
const cameraCollisionObjects=[];

function updateCamera(){

  cameraAngleY=THREE.MathUtils.lerp(
    cameraAngleY,
    targetCameraAngleY,
    0.18
  );

  cameraAngleX=THREE.MathUtils.lerp(
    cameraAngleX,
    targetCameraAngleX,
    0.18
  );

  cameraDistance=THREE.MathUtils.lerp(
    cameraDistance,
    targetCameraDistance,
    0.12
  );

  cameraPivot.rotation.y=cameraAngleY;
  cameraPivot.rotation.x=cameraAngleX;

  const origin=cameraPivot.position.clone();

  const dir=new THREE.Vector3(0,0,1)
    .applyQuaternion(cameraPivot.quaternion);

  raycaster.set(origin,dir);

  let actualDistance=cameraDistance;

  if(cameraCollisionObjects.length>0){

    const hits=raycaster.intersectObjects(
      cameraCollisionObjects,
      true
    );

    if(
      hits.length>0 &&
      hits[0].distance<cameraDistance
    ){

      actualDistance=Math.max(
        hits[0].distance-0.3,
        0.5
      );
    }
  }

  camera.position.set(
    0,
    0,
    actualDistance
  );

  camera.lookAt(cameraPivot.position);
}

function box(
  w,
  h,
  d,
  x,
  y,
  z,
  material,
  parent=scene
){

  const mesh=new THREE.Mesh(
    new THREE.BoxGeometry(w,h,d),
    material
  );

  mesh.position.set(x,y,z);
  mesh.castShadow=true;
  mesh.receiveShadow=true;

  parent.add(mesh);

  return mesh;
}

function createMotorbike(x,z){

  const bike=new THREE.Group();

  const wheelMat=new THREE.MeshStandardMaterial({
    color:0x181b1d,
    roughness:.7
  });

  const bodyMat=new THREE.MeshStandardMaterial({
    color:0x303d46,
    metalness:.3,
    roughness:.55
  });

  const wheel1=new THREE.Mesh(
    new THREE.CylinderGeometry(1.25,1.25,.45,18),
    wheelMat
  );

  wheel1.rotation.z=Math.PI/2;
  wheel1.position.set(0,1.25,-2.4);
  bike.add(wheel1);

  const wheel2=wheel1.clone();
  wheel2.position.z=2.4;
  bike.add(wheel2);

  const body=new THREE.Mesh(
    new THREE.BoxGeometry(1.5,.8,4),
    bodyMat
  );

  body.position.y=2;
  bike.add(body);

  bike.position.set(x,0,z);
  bike.rotation.y=Math.PI/2;

  parking.add(bike);
}

// YOUTUBE INTERACTION OVERLAY LOGIC
const ytOverlay=document.getElementById("youtube-overlay");
const ytSearchInput=document.getElementById("yt-search-input");
const ytSearchBtn=document.getElementById("yt-search-btn");
const ytCloseBtn=document.getElementById("close-yt-btn");
const ytIframe=document.getElementById("yt-iframe");
const ytResultsList=document.getElementById("yt-results-list");

function openYouTubeOverlay(){
  ytOverlay.style.display="flex";
  searchYouTube(ytSearchInput.value || "Lo Người Ướt Áo");
}

function closeYouTubeOverlay(){
  ytOverlay.style.display="none";
  ytIframe.src="";
}

ytCloseBtn.addEventListener("click", closeYouTubeOverlay);

async function searchYouTube(query){
  if(!query.trim()) return;
  ytResultsList.innerHTML="<div style='color:#aaa;padding:12px;'>Đang tìm kiếm...</div>";

  try{
    const response = await fetch(`https://www.googleapis.com/youtube/v3/search?part=snippet&maxResults=6&q=${encodeURIComponent(query)}&type=video&key=${YOUTUBE_API_KEY}`);
    const data = await response.json();

    if(data.items && data.items.length > 0){
      ytResultsList.innerHTML="";
      playVideo(data.items[0].id.videoId);

      data.items.forEach(item => {
        const div = document.createElement("div");
        div.className = "yt-item";
        div.innerHTML = `
          <img src="${item.snippet.thumbnails.default.url}" />
          <div class="yt-item-info">
            <div class="yt-item-title">${item.snippet.title}</div>
            <div class="yt-item-channel">${item.snippet.channelTitle}</div>
          </div>
        `;
        div.onclick = () => playVideo(item.id.videoId);
        ytResultsList.appendChild(div);
      });
    } else {
      ytResultsList.innerHTML="<div style='color:#aaa;padding:12px;'>Không tìm thấy kết quả phù hợp.</div>";
    }
  }catch(e){
    ytResultsList.innerHTML="<div style='color:#ff5555;padding:12px;'>Lỗi kết nối API YouTube.</div>";
  }
}

function playVideo(videoId){
  ytIframe.src = `https://www.youtube.com/embed/${videoId}?autoplay=1`;
}

ytSearchBtn.addEventListener("click", () => searchYouTube(ytSearchInput.value));
ytSearchInput.addEventListener("keypress", (e) => {
  if(e.key === "Enter") searchYouTube(ytSearchInput.value);
});

// RAYCAST TOUCH ON 3D SCREEN
const screenRaycaster=new THREE.Raycaster();
const screenPointer=new THREE.Vector2();

function check3DScreenTouch(clientX,clientY){
  const rect=renderer.domElement.getBoundingClientRect();
  screenPointer.x=((clientX-rect.left)/rect.width)*2-1;
  screenPointer.y=-((clientY-rect.top)/rect.height)*2+1;

  screenRaycaster.setFromCamera(screenPointer,camera);
  const hits=screenRaycaster.intersectObject(interactiveScreen,true);

  if(hits.length>0){
    openYouTubeOverlay();
    return true;
  }
  return false;
}

renderer.domElement.addEventListener("pointerdown", (e)=>{
  if(e.pointerType==="mouse"){
    check3DScreenTouch(e.clientX, e.clientY);
  }
});

renderer.domElement.addEventListener("touchstart", (e)=>{
  if(e.touches.length!==1) return;
  const touch=e.touches[0];

  const joyRect=joystick.getBoundingClientRect();
  if(touch.clientX>=joyRect.left && touch.clientX<=joyRect.right && touch.clientY>=joyRect.top && touch.clientY<=joyRect.bottom) return;

  const jumpRect=jump.getBoundingClientRect();
  if(touch.clientX>=jumpRect.left && touch.clientX<=jumpRect.right && touch.clientY>=jumpRect.top && touch.clientY<=jumpRect.bottom) return;

  check3DScreenTouch(touch.clientX, touch.clientY);
}, {passive:true});

// ============================================================
// PLAYER & MODEL LOADER
// ============================================================

const player=new THREE.Group();
scene.add(player);

let model=null;

const leafMeshes=[];
const armMeshes=[];
const rootMeshes=[];
const initialData=new Map();

const loader=new GLTFLoader();

loader.load(
  "scene.gltf",

  function(gltf){

    model=gltf.scene;

    model.position.y=.22;

    model.traverse(function(object){

      if(!object.isMesh) return;

      object.castShadow=true;
      object.receiveShadow=true;

      initialData.set(object,{
        position:object.position.clone(),
        rotation:object.rotation.clone(),
        scale:object.scale.clone()
      });

      const name=object.name.toLowerCase();

      if(
        name.includes("leaf")||
        name.includes("leaves")||
        name.includes("foliage")||
        name.includes("la")
      ){
        leafMeshes.push(object);
      }

      if(
        name.includes("arm")||
        name.includes("hand")||
        name.includes("tay")
      ){
        armMeshes.push(object);
      }

      if(
        name.includes("root")||
        name.includes("re")
      ){
        rootMeshes.push(object);
      }

    });

    player.add(model);

    loading.style.display="none";
  },

  undefined,

  function(){

    loading.textContent=
      "Không tìm thấy scene.gltf";

  }
);

// ============================================================
// CONTROLS & MOVEMENT
// ============================================================

const input=new THREE.Vector2(0,0);
const velocity=new THREE.Vector3(0,0,0);

const walkSpeed=80.556;
const FLY_SPEED=97.222;

let moveSpeed=walkSpeed;

const gravity=-20;

let grounded=true;
let isFlying=false;

// ============================================================
// JOYSTICK
// ============================================================

const joystick=document.getElementById(
  "joystick-wrapper"
);

const stick=document.getElementById(
  "joystick-stick"
);

let joystickTouch=null;

let centerX=0;
let centerY=0;

const radius=40;

joystick.addEventListener(
  "touchstart",
  function(event){

    event.preventDefault();

    const touch=event.changedTouches[0];

    joystickTouch=touch.identifier;

    const rect=joystick.getBoundingClientRect();

    centerX=rect.left+rect.width/2;
    centerY=rect.top+rect.height/2;

    updateJoystick(touch);

  },
  {passive:false}
);

function updateJoystick(touch){

  const dx=touch.clientX-centerX;
  const dy=touch.clientY-centerY;

  const distance=Math.hypot(dx,dy);
  const angle=Math.atan2(dy,dx);

  const limited=Math.min(
    distance,
    radius
  );

  const x=Math.cos(angle)*limited;
  const y=Math.sin(angle)*limited;

  stick.style.transform=
    `translate(${x}px,${y}px)`;

  input.x=x/radius;
  input.y=-y/radius;
}

function resetJoystick(){

  joystickTouch=null;

  input.set(0,0);

  velocity.x=0;
  velocity.z=0;

  stick.style.transform=
    "translate(0px,0px)";
}

window.addEventListener(
  "touchmove",
  function(event){

    for(
      let i=0;
      i<event.changedTouches.length;
      i++
    ){

      if(
        event.changedTouches[i].identifier===
        joystickTouch
      ){

        updateJoystick(
          event.changedTouches[i]
        );
      }
    }
  },
  {passive:false}
);

window.addEventListener(
  "touchend",
  function(event){

    for(
      let i=0;
      i<event.changedTouches.length;
      i++
    ){

      if(
        event.changedTouches[i].identifier===
        joystickTouch
      ){

        resetJoystick();
      }
    }
  }
);

window.addEventListener(
  "touchcancel",
  resetJoystick
);

// ============================================================
// JUMP / FLY
// ============================================================

const jump=document.getElementById(
  "jump-btn"
);

let isJumpHolding=false;

jump.addEventListener(
  "touchstart",
  function(event){

    event.preventDefault();

    isJumpHolding=true;

    if(!isFlying){

      isFlying=true;

      grounded=false;

      jump.classList.add("flying");

      moveSpeed=FLY_SPEED;
    }

  },
  {passive:false}
);

jump.addEventListener(
  "touchend",
  function(event){

    event.preventDefault();

    isJumpHolding=false;

  }
);

jump.addEventListener(
  "touchcancel",
  function(){

    isJumpHolding=false;

  }
);

// ============================================================
// CAMERA ROTATION & ZOOM
// ============================================================

let cameraTouch=null;

let lastX=0;
let lastY=0;

let initialPinchDistance=null;
let initialCameraDistance=
  targetCameraDistance;

window.addEventListener(
  "wheel",
  function(event){

    event.preventDefault();

    const zoomSensitivity=.015;

    targetCameraDistance+=
      event.deltaY*zoomSensitivity;

    targetCameraDistance=
      THREE.MathUtils.clamp(
        targetCameraDistance,
        1.5,
        60
      );

  },
  {passive:false}
);

window.addEventListener(
  "touchstart",
  function(event){

    if(event.touches.length===2){

      initialPinchDistance=
        Math.hypot(
          event.touches[0].clientX-
          event.touches[1].clientX,

          event.touches[0].clientY-
          event.touches[1].clientY
        );

      initialCameraDistance=
        targetCameraDistance;

      return;
    }

    const touch=
      event.changedTouches[0];

    if(
      touch.identifier!==joystickTouch &&
      cameraTouch===null
    ){

      cameraTouch=
        touch.identifier;

      lastX=touch.clientX;
      lastY=touch.clientY;
    }

  }
);

window.addEventListener(
  "touchmove",
  function(event){

    if(
      event.touches.length===2 &&
      initialPinchDistance!==null
    ){

      const currentDistance=
        Math.hypot(
          event.touches[0].clientX-
          event.touches[1].clientX,

          event.touches[0].clientY-
          event.touches[1].clientY
        );

      if(currentDistance>0){

        const factor=
          initialPinchDistance/
          currentDistance;

        targetCameraDistance=
          THREE.MathUtils.clamp(
            initialCameraDistance*factor,
            1.5,
            60
          );
      }

      return;
    }

    for(
      let i=0;
      i<event.changedTouches.length;
      i++
    ){

      const touch=
        event.changedTouches[i];

      if(
        touch.identifier===
        cameraTouch
      ){

        const dx=
          touch.clientX-lastX;

        const dy=
          touch.clientY-lastY;

        targetCameraAngleY-=
          dx*.005;

        targetCameraAngleX=
          THREE.MathUtils.clamp(
            targetCameraAngleX+
            dy*.005,

            -Math.PI/2+.01,
            Math.PI/2-.05
          );

        lastX=touch.clientX;
        lastY=touch.clientY;
      }
    }

  },
  {passive:false}
);

window.addEventListener(
  "touchend",
  function(event){

    if(event.touches.length<2){
      initialPinchDistance=null;
    }

    for(
      let i=0;
      i<event.changedTouches.length;
      i++
    ){

      if(
        event.changedTouches[i].identifier===
        cameraTouch
      ){

        cameraTouch=null;
      }
    }

  }
);

window.addEventListener(
  "touchcancel",
  function(){

    cameraTouch=null;
    initialPinchDistance=null;

  }
);

// ============================================================
// ANIMATIONS
// ============================================================

let animationTime=0;
let animationBlend=0;

function animateLeaves(delta,moving){

  if(!model) return;

  leafMeshes.forEach(
    (mesh,index)=>{

      const original=
        initialData.get(mesh);

      if(!original) return;

      const speed=
        .72+(index%7)*.085;

      const phase=index*.67;

      const t=
        animationTime*speed+phase;

      const wave1=Math.sin(t);
      const wave2=
        Math.sin(t*1.73+index);

      const wave3=
        Math.cos(t*.57+index*.4);

      const movement=
        (
          wave1*.62+
          wave2*.23+
          wave3*.15
        )*animationBlend;

      const side=
        index%2===0?1:-1;

      mesh.rotation.z=
        original.rotation.z+
        movement*.30*side;

      mesh.rotation.x=
        original.rotation.x+
        wave3*.15*animationBlend;

      mesh.rotation.y=
        original.rotation.y+
        wave2*.10*animationBlend;
    }
  );
}

function animateSunflower(
  delta,
  moving
){

  if(!model) return;

  const target=
    moving?1:0;

  animationBlend=
    THREE.MathUtils.lerp(
      animationBlend,
      target,
      Math.min(delta*7,1)
    );

  if(moving){
    animationTime+=delta*9.5;
  }

  const wave=
    Math.sin(animationTime);

  const bounce=
    Math.abs(wave)*.10*animationBlend;

  model.position.y=
    THREE.MathUtils.lerp(
      model.position.y,
      .22+bounce,
      Math.min(delta*13,1)
    );

  model.rotation.z=
    THREE.MathUtils.lerp(
      model.rotation.z,
      wave*.035*animationBlend,
      Math.min(delta*8,1)
    );

  animateLeaves(
    delta,
    moving
  );

  armMeshes.forEach(
    (mesh,index)=>{

      const original=
        initialData.get(mesh);

      if(!original) return;

      const side=
        index%2===0?1:-1;

      mesh.rotation.z=
        original.rotation.z+
        wave*.32*
        side*
        animationBlend;
    }
  );

  rootMeshes.forEach(
    (mesh,index)=>{

      const original=
        initialData.get(mesh);

      if(!original) return;

      const side=
        index%2===0?1:-1;

      mesh.rotation.z=
        original.rotation.z+
        Math.sin(
          animationTime+Math.PI
        )*.20*
        side*
        animationBlend;
    }
  );
}

// ============================================================
// GAME LOOP
// ============================================================

const clock=new THREE.Clock();

function animate(){

  requestAnimationFrame(animate);

  const delta=
    Math.min(
      clock.getDelta(),
      .05
    );

  const moving=
    input.lengthSq()>.01;

  if(moving){

    const forward=
      new THREE.Vector3(
        0,
        0,
        -1
      );

    const right=
      new THREE.Vector3(
        1,
        0,
        0
      );

    forward.applyAxisAngle(
      new THREE.Vector3(0,1,0),
      cameraAngleY
    );

    right.applyAxisAngle(
      new THREE.Vector3(0,1,0),
      cameraAngleY
    );

    const movement=
      new THREE.Vector3();

    movement.addScaledVector(
      right,
      input.x
    );

    movement.addScaledVector(
      forward,
      input.y
    );

    if(movement.lengthSq()>0){

      movement.normalize();

      velocity.x=
        movement.x*moveSpeed;

      velocity.z=
        movement.z*moveSpeed;

      if(model){

        const targetRotation=
          Math.atan2(
            movement.x,
            movement.z
          );

        let difference=
          targetRotation-
          model.rotation.y;

        difference=
          Math.atan2(
            Math.sin(difference),
            Math.cos(difference)
          );

        model.rotation.y+=
          difference*
          Math.min(delta*10,1);
      }
    }

  }else{

    velocity.x=0;
    velocity.z=0;
  }

  animateSunflower(
    delta,
    moving
  );

  // ==========================================================
  // FLYING
  // ==========================================================

  if(isFlying){

    if(isJumpHolding){

      velocity.y=
        THREE.MathUtils.lerp(
          velocity.y,
          50,
          delta*5
        );

    }else{

      velocity.y=
        THREE.MathUtils.lerp(
          velocity.y,
          0,
          delta*3
        );
    }

  }else{

    velocity.y+=
      gravity*delta;
  }

  player.position.y+=
    velocity.y*delta;

  if(player.position.y<=0){

    player.position.y=0;

    velocity.y=0;

    grounded=true;

    if(isFlying){

      isFlying=false;

      jump.classList.remove(
        "flying"
      );

      moveSpeed=walkSpeed;
    }
  }

  player.position.x+=
    velocity.x*delta;

  player.position.z+=
    velocity.z*delta;

  cameraPivot.position.copy(
    player.position
  );

  cameraPivot.position.y+=1.6;

  updateCamera();

  renderer.render(
    scene,
    camera
  );
}

animate();

// ============================================================
// RESIZE
// ============================================================

function onResize(){

  const width=
    window.innerWidth;

  const height=
    window.innerHeight;

  camera.aspect=
    width/height;

  camera.updateProjectionMatrix();

  renderer.setSize(
    width,
    height
  );

  renderer.setPixelRatio(
    Math.min(
      window.devicePixelRatio,
      2
    )
  );
}

window.addEventListener(
  "resize",
  onResize
);

window.addEventListener(
  "orientationchange",
  function(){

    setTimeout(
      onResize,
      100
    );

  }
);

onResize();
