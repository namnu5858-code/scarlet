<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cam Thuong Secondary School Gate</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #87ceeb;
            font-family: Arial, sans-serif;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
        }
        #ui-overlay {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: white;
            text-shadow: 1px 1px 2px black;
            pointer-events: none;
        }
    </style>
    <!-- Three.js & OrbitControls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
    <div id="canvas-container"></div>

    <script>
        // 1. Khởi tạo Scene, Camera, Renderer
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 4, 15);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.shadowMap.enabled = true;
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.target.set(0, 3, 0);

        // 2. Ánh sáng & Mặt đất
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(10, 20, 10);
        dirLight.castShadow = true;
        scene.add(dirLight);

        const groundGeo = new THREE.PlaneGeometry(100, 100);
        const groundMat = new THREE.MeshLambertMaterial({ color: 0x557a2b });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);

        // 3. Dựng Cổng Trường
        function buildSchoolGate() {
            const gateGroup = new THREE.Group();

            const pillarMat = new THREE.MeshLambertMaterial({ color: 0xdfd3b6 }); 
            const roofMat = new THREE.MeshLambertMaterial({ color: 0x8b3a2b });   
            const ironMat = new THREE.MeshLambertMaterial({ color: 0x222222 });   

            // Các trụ cổng (2 trụ chính, 1 trụ phụ phải)
            const mainPillarGeo = new THREE.BoxGeometry(1.2, 4.5, 1.2);
            
            const pillarLeft = new THREE.Mesh(mainPillarGeo, pillarMat);
            pillarLeft.position.set(-3.5, 2.25, 0);
            
            const pillarRight = new THREE.Mesh(mainPillarGeo, pillarMat);
            pillarRight.position.set(3.5, 2.25, 0);

            const sidePillar = new THREE.Mesh(mainPillarGeo, pillarMat);
            sidePillar.position.set(6.0, 2.25, 0);

            gateGroup.add(pillarLeft, pillarRight, sidePillar);

            // Mái che xà ngang chính
            const mainBeamGeo = new THREE.BoxGeometry(8.2, 0.9, 1.4);
            const mainBeam = new THREE.Mesh(mainBeamGeo, roofMat);
            mainBeam.position.set(0, 4.5, 0);
            gateGroup.add(mainBeam);

            // Mái che cổng phụ
            const sideBeamGeo = new THREE.BoxGeometry(2.0, 0.5, 1.3);
            const sideBeam = new THREE.Mesh(sideBeamGeo, roofMat);
            sideBeam.position.set(4.75, 4.2, 0);
            gateGroup.add(sideBeam);

            // Bảng tên trường bằng Canvas Texture
            const canvas = document.createElement('canvas');
            canvas.width = 1024;
            canvas.height = 256;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = '#003366';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#FFFFFF';
            ctx.font = 'Bold 46px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('TRƯỜNG THCS CAM THƯỢNG', canvas.width / 2, canvas.height / 2);

            const nameTexture = new THREE.CanvasTexture(canvas);
            const boardGeo = new THREE.PlaneGeometry(5.8, 1.1);
            const nameMat = new THREE.MeshBasicMaterial({ map: nameTexture, side: THREE.DoubleSide });
            
            const nameBoardFront = new THREE.Mesh(boardGeo, nameMat);
            nameBoardFront.position.set(0, 3.7, 0.71);
            gateGroup.add(nameBoardFront);

            // Khung cổng sắt chính & Cổng phụ
            const mainGateFenceGeo = new THREE.BoxGeometry(5.6, 2.8, 0.1);
            const mainGateFence = new THREE.Mesh(mainGateFenceGeo, ironMat);
            mainGateFence.position.set(0, 1.4, 0);

            const sideGateFenceGeo = new THREE.BoxGeometry(1.3, 2.4, 0.1);
            const sideGateFence = new THREE.Mesh(sideGateFenceGeo, ironMat);
            sideGateFence.position.set(4.75, 1.2, 0);

            gateGroup.add(mainGateFence, sideGateFence);

            scene.add(gateGroup);
        }

        buildSchoolGate();

        // 4. Vòng lặp Render & Resize
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
