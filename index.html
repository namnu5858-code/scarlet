<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sân trường Cẩm Thung - 3D DuckDuckGo Screen</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            font-family: Arial, sans-serif;
        }
        #webgl-container {
            width: 100vw;
            height: 100vh;
        }
        /* Style để nhúng Iframe CSS3D hoàn toàn nằm trong không gian 3D */
        .css3d-screen-container {
            width: 1920px;
            height: 1080px;
            background-color: #000;
            border: 8px solid #222;
            box-sizing: border-box;
            border-radius: 12px;
            overflow: hidden;
        }
        .css3d-screen-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
    <!-- Three.js Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/renderers/CSS3DRenderer.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>

    <div id="webgl-container"></div>

    <script>
        // 1. Khởi tạo Scene, Camera, WebGLRenderer & CSS3DRenderer
        const container = document.getElementById('webgl-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb); // Bầu trời xanh sân trường

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 5, 15);

        // WebGL Renderer cho mô hình 3D
        const webglRenderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        webglRenderer.setSize(window.innerWidth, window.innerHeight);
        webglRenderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        webglRenderer.shadowMap.enabled = true;
        container.appendChild(webglRenderer.domElement);

        // CSS3D Renderer cho màn hình nhúng web nhạy tương tác
        const css3dRenderer = new THREE.CSS3DRenderer();
        css3dRenderer.setSize(window.innerWidth, window.innerHeight);
        css3dRenderer.domElement.style.position = 'absolute';
        css3dRenderer.domElement.style.top = '0';
        css3dRenderer.domElement.style.pointerEvents = 'none'; // Chỉ nhận sự kiện tương tác trên Iframe
        container.appendChild(css3dRenderer.domElement);

        // Controls
        const controls = new THREE.OrbitControls(camera, webglRenderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        // 2. Ánh sáng sân trường
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);

        const sunLight = new THREE.DirectionalLight(0xffffff, 1.0);
        sunLight.position.set(20, 40, 20);
        sunLight.castShadow = true;
        scene.add(sunLight);

        // 3. Khôi phục Cấu trúc Sân trường & Mô hình 3D
        // Sàn sân trường trung tâm
        const courtyardGeo = new THREE.PlaneGeometry(50, 50);
        const courtyardMat = new THREE.MeshStandardMaterial({ color: 0x999999, roughness: 0.8 });
        const courtyard = new THREE.Mesh(courtyardGeo, courtyardMat);
        courtyard.rotation.x = -Math.PI / 2;
        courtyard.receiveShadow = true;
        scene.add(courtyard);

        // Chân đế & Khung màn hình 3D ở giữa sân
        const screenGroup = new THREE.Group();
        screenGroup.position.set(0, 4, 0); // Đặt ở khu vực trung tâm rộng nhất

        const frameGeo = new THREE.BoxGeometry(9.2, 5.3, 0.3);
        const frameMat = new THREE.MeshStandardMaterial({ color: 0x111111, metalness: 0.8, roughness: 0.2 });
        const screenFrame = new THREE.Mesh(frameGeo, frameMat);
        screenFrame.castShadow = true;
        screenGroup.add(screenFrame);

        // Chân cột đỡ màn hình
        const poleGeo = new THREE.CylinderGeometry(0.2, 0.2, 4, 16);
        const poleMat = new THREE.MeshStandardMaterial({ color: 0x222222, metalness: 0.9 });
        const pole1 = new THREE.Mesh(poleGeo, poleMat);
        pole1.position.set(-3.5, -3.5, 0);
        const pole2 = pole1.clone();
        pole2.position.set(3.5, -3.5, 0);
        screenGroup.add(pole1);
        screenGroup.add(pole2);

        scene.add(screenGroup);

        // 4. Nhúng Màn hình DuckDuckGo CSS3D (Chạy trực tiếp TRONG mô hình 3D)
        const screenDiv = document.createElement('div');
        screenDiv.className = 'css3d-screen-container';
        screenDiv.innerHTML = `<iframe src="https://html5test.com/" allow="fullscreen"></iframe>`;
        screenDiv.style.pointerEvents = 'auto';

        const css3dObject = new THREE.CSS3DObject(screenDiv);
        // Tỉ lệ scale phù hợp chính xác với khung 3D (16:9)
        css3dObject.scale.set(0.0046, 0.0046, 0.0046);
        css3dObject.position.set(0, 4, 0.16); // Khớp vào bên trong mặt trước khung 3D
        scene.add(css3dObject);

        // 5. Cập nhật kích thước màn hình
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            webglRenderer.setSize(window.innerWidth, window.innerHeight);
            css3dRenderer.setSize(window.innerWidth, window.innerHeight);
        });

        // 6. Vòng lặp Render
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            webglRenderer.render(scene, camera);
            css3dRenderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
