<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Mô Phỏng Trường Học 3D - Cẩm Thượng</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #87CEEB;
            font-family: Arial, sans-serif;
            touch-action: none;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
        }
        #ui-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        .joystick-zone {
            position: absolute;
            bottom: 30px;
            left: 30px;
            width: 120px;
            height: 120px;
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            pointer-events: auto;
        }
        .joystick-knob {
            position: absolute;
            top: 35px;
            left: 35px;
            width: 50px;
            height: 50px;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 50%;
        }
        .action-btn {
            position: absolute;
            bottom: 40px;
            right: 40px;
            width: 65px;
            height: 65px;
            background: rgba(255, 255, 255, 0.3);
            border: 2px solid rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            color: white;
            font-size: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: auto;
            user-select: none;
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    <div id="ui-container">
        <div class="joystick-zone" id="joystick">
            <div class="joystick-knob" id="knob"></div>
        </div>
        <div class="action-btn" id="fly-btn">↑</div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // --- THIẾT LẬP CƠ BẢN ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB);
        scene.fog = new THREE.FogExp2(0x87CEEB, 0.005);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        // --- ÁNH SÁNG ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(50, 80, 50);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 2048;
        dirLight.shadow.mapSize.height = 2048;
        dirLight.shadow.camera.near = 0.5;
        dirLight.shadow.camera.far = 250;
        const d = 100;
        dirLight.shadow.camera.left = -d;
        dirLight.shadow.camera.right = d;
        dirLight.shadow.camera.top = d;
        dirLight.shadow.camera.bottom = -d;
        scene.add(dirLight);

        // --- MATERIAL ---
        const wallMat = new THREE.MeshStandardMaterial({ color: 0xeeeeee, roughness: 0.5 });
        const blueWallMat = new THREE.MeshStandardMaterial({ color: 0x5b9bd5, roughness: 0.4 });
        const floorTileMat = new THREE.MeshStandardMaterial({ color: 0xc85a32, roughness: 0.6 });
        const roofMat = new THREE.MeshStandardMaterial({ color: 0x34495e, roughness: 0.3 });
        const stainlessSteelMat = new THREE.MeshStandardMaterial({ color: 0xdcdcdc, metalness: 0.85, roughness: 0.15 });

        // --- MẶT ĐẤT & SÂN TRƯỜNG ---
        const groundGeo = new THREE.PlaneGeometry(300, 300);
        const ground = new THREE.Mesh(groundGeo, floorTileMat);
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);

        // --- HÀM TẠO CÂY KHÔI PHỤC ---
        function createTree(x, z) {
            const treeGroup = new THREE.Group();
            treeGroup.position.set(x, 0, z);

            const trunkGeo = new THREE.CylinderGeometry(0.4, 0.5, 3);
            const trunkMat = new THREE.MeshStandardMaterial({ color: 0x5a3d28, roughness: 0.9 });
            const trunk = new THREE.Mesh(trunkGeo, trunkMat);
            trunk.position.y = 1.5;
            trunk.castShadow = true;
            treeGroup.add(trunk);

            const leavesGeo = new THREE.SphereGeometry(2.2, 8, 8);
            const leavesMat = new THREE.MeshStandardMaterial({ color: 0x2e7d32, roughness: 0.6 });
            const leaves = new THREE.Mesh(leavesGeo, leavesMat);
            leaves.position.y = 3.8;
            leaves.castShadow = true;
            treeGroup.add(leaves);

            // Bồn cây tròn
            const potGeo = new THREE.CylinderGeometry(2, 2, 0.4, 16, 1, true);
            const potMat = new THREE.MeshStandardMaterial({ color: 0xdddddd });
            const pot = new THREE.Mesh(potGeo, potMat);
            pot.position.y = 0.2;
            treeGroup.add(pot);

            scene.add(treeGroup);
        }

        // Tạo lại toàn bộ các cây xanh trên sân trường
        createTree(-15, 10);
        createTree(15, 10);
        createTree(-25, 20);
        createTree(25, 20);
        createTree(-10, 30);
        createTree(10, 30);

        // --- KHÔI PHỤC TÒA NHÀ LỚN KHU VỰC BÊN CẠNH & CẦU THANG ---
        function createSideBuilding() {
            const sideGroup = new THREE.Group();
            sideGroup.position.set(35, 0, 5);

            const bGeo = new THREE.BoxGeometry(15, 11.5, 30);
            const bMesh = new THREE.Mesh(bGeo, blueWallMat);
            bMesh.position.y = 5.75;
            bMesh.castShadow = true;
            bMesh.receiveShadow = true;
            sideGroup.add(bMesh);

            // Cầu thang ngoài trời khôi phục
            const stairGroup = new THREE.Group();
            stairGroup.position.set(-8, 0, 0);

            for (let i = 0; i < 15; i++) {
                const stepGeo = new THREE.BoxGeometry(3, 0.2, 0.6);
                const step = new THREE.Mesh(stepGeo, wallMat);
                step.position.set(0, i * 0.4 + 0.1, -i * 0.5);
                step.castShadow = true;
                stairGroup.add(step);
            }

            // Lan can cầu thang
            const handrailGeo = new THREE.CylinderGeometry(0.04, 0.04, 10);
            const handrail = new THREE.Mesh(handrailGeo, stainlessSteelMat);
            handrail.rotation.x = Math.PI / 4;
            handrail.position.set(1.4, 3.5, -3.5);
            stairGroup.add(handrail);

            sideGroup.add(stairGroup);
            scene.add(sideGroup);
        }
        createSideBuilding();

        // --- TÒA NHÀ CHÍNH ---
        function createSchoolBuilding() {
            const buildingGroup = new THREE.Group();
            
            const bWidth = 60, bHeight = 11.5, bDepth = 12;
            const mainBuildingGeo = new THREE.BoxGeometry(bWidth, bHeight, bDepth);
            const mainBuilding = new THREE.Mesh(mainBuildingGeo, blueWallMat);
            mainBuilding.position.set(0, bHeight / 2, -20);
            mainBuilding.castShadow = true;
            mainBuilding.receiveShadow = true;
            buildingGroup.add(mainBuilding);

            for (let floor = 0; floor < 3; floor++) {
                const yPos = floor * 3.8 + 1.2;
                
                const corridorGeo = new THREE.BoxGeometry(bWidth + 2, 0.3, 3);
                const corridor = new THREE.Mesh(corridorGeo, wallMat);
                corridor.position.set(0, yPos, -13.5);
                corridor.castShadow = true;
                corridor.receiveShadow = true;
                buildingGroup.add(corridor);

                const railGeo = new THREE.CylinderGeometry(0.04, 0.04, bWidth + 2);
                const rail = new THREE.Mesh(railGeo, stainlessSteelMat);
                rail.rotation.z = Math.PI / 2;
                rail.position.set(0, yPos + 0.9, -12.1);
                buildingGroup.add(rail);

                for (let x = -(bWidth / 2); x <= (bWidth / 2); x += 2.5) {
                    const postGeo = new THREE.CylinderGeometry(0.03, 0.03, 0.9);
                    const post = new THREE.Mesh(postGeo, stainlessSteelMat);
                    post.position.set(x, yPos + 0.45, -12.1);
                    buildingGroup.add(post);
                }
            }

            const roofGeo = new THREE.ConeGeometry(45, 3.5, 4);
            const roof = new THREE.Mesh(roofGeo, roofMat);
            roof.position.set(0, bHeight + 1.75, -20);
            roof.rotation.y = Math.PI / 4;
            buildingGroup.add(roof);

            scene.add(buildingGroup);
        }
        createSchoolBuilding();

        // --- DÃY NHÀ XE ---
        function createParkingShed() {
            const shedGroup = new THREE.Group();
            shedGroup.position.set(0, 0, 0);

            const roofGeo = new THREE.BoxGeometry(35, 0.2, 6);
            const roofMatShed = new THREE.MeshStandardMaterial({ color: 0x444444 });
            const roof = new THREE.Mesh(roofGeo, roofMatShed);
            roof.position.set(0, 3, 0);
            shedGroup.add(roof);

            for (let x = -16; x <= 16; x += 8) {
                const poleGeo = new THREE.CylinderGeometry(0.1, 0.1, 3);
                const poleMat = new THREE.MeshStandardMaterial({ color: 0x777777 });
                const p1 = new THREE.Mesh(poleGeo, poleMat);
                p1.position.set(x, 1.5, -2.5);
                const p2 = new THREE.Mesh(poleGeo, poleMat);
                p2.position.set(x, 1.5, 2.5);
                shedGroup.add(p1);
                shedGroup.add(p2);
            }
            scene.add(shedGroup);
        }
        createParkingShed();

        // --- CỔNG TRƯỜNG ---
        function createSchoolGate() {
            const gateGroup = new THREE.Group();
            gateGroup.position.set(0, 0, 45);

            const pillarGeo = new THREE.BoxGeometry(1.4, 6, 1.4);
            const pillarMat = new THREE.MeshStandardMaterial({ color: 0xe0e0e0, roughness: 0.3 });
            
            const leftPillar = new THREE.Mesh(pillarGeo, pillarMat);
            leftPillar.position.set(-7, 3, 0);
            leftPillar.castShadow = true;
            gateGroup.add(leftPillar);

            const rightPillar = new THREE.Mesh(pillarGeo, pillarMat);
            rightPillar.position.set(7, 3, 0);
            rightPillar.castShadow = true;
            gateGroup.add(rightPillar);

            const signCanvas = document.createElement('canvas');
            signCanvas.width = 1024;
            signCanvas.height = 256;
            const ctx = signCanvas.getContext('2d');
            ctx.fillStyle = '#003399';
            ctx.fillRect(0, 0, 1024, 256);
            ctx.fillStyle = '#FFFFFF';
            ctx.font = 'Bold 44px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('TRƯỜNG THCS CẨM THƯỢNG', 512, 145);

            const signTex = new THREE.CanvasTexture(signCanvas);
            const signGeo = new THREE.BoxGeometry(12.8, 1.4, 0.2);
            const signMat = new THREE.MeshStandardMaterial({ map: signTex });
            const sign = new THREE.Mesh(signGeo, signMat);
            sign.position.set(0, 5.3, 0);
            gateGroup.add(sign);

            const bannerCanvas = document.createElement('canvas');
            bannerCanvas.width = 1024;
            bannerCanvas.height = 128;
            const bCtx = bannerCanvas.getContext('2d');
            bCtx.fillStyle = '#CC0000';
            bCtx.fillRect(0, 0, 1024, 128);
            bCtx.fillStyle = '#FFFF00';
            bCtx.font = 'Bold 30px Arial';
            bCtx.textAlign = 'center';
            bCtx.fillText('NHIỆT LIỆT CHÀO MỪNG NĂM HỌC MỚI 2026 - 2027', 512, 75);

            const bannerTex = new THREE.CanvasTexture(bannerCanvas);
            const bannerGeo = new THREE.PlaneGeometry(12.2, 0.8);
            const bannerMat = new THREE.MeshBasicMaterial({ map: bannerTex, side: THREE.DoubleSide });
            const banner = new THREE.Mesh(bannerGeo, bannerMat);
            banner.position.set(0, 4.1, 0.12);
            gateGroup.add(banner);

            const poleGeo = new THREE.CylinderGeometry(0.05, 0.05, 7.5);
            const poleMat = new THREE.MeshStandardMaterial({ color: 0xaaaaaa, metalness: 0.8 });
            
            const leftPole = new THREE.Mesh(poleGeo, poleMat);
            leftPole.position.set(-7, 3.75, 0);
            gateGroup.add(leftPole);

            const flagCanvas = document.createElement('canvas');
            flagCanvas.width = 256;
            flagCanvas.height = 170;
            const fCtx = flagCanvas.getContext('2d');
            fCtx.fillStyle = '#DA251D';
            fCtx.fillRect(0, 0, 256, 170);
            fCtx.fillStyle = '#FFFF00';
            fCtx.beginPath();
            const cx = 128, cy = 85, outerR = 35, innerR = 14;
            for (let i = 0; i < 5; i++) {
                fCtx.lineTo(cx + Math.cos((18 + i * 72) * Math.PI / 180) * outerR, cy - Math.sin((18 + i * 72) * Math.PI / 180) * outerR);
                fCtx.lineTo(cx + Math.cos((54 + i * 72) * Math.PI / 180) * innerR, cy - Math.sin((54 + i * 72) * Math.PI / 180) * innerR);
            }
            fCtx.closePath();
            fCtx.fill();

            const flagTex = new THREE.CanvasTexture(flagCanvas);
            const flagGeo = new THREE.PlaneGeometry(2, 1.3);
            const flagMat = new THREE.MeshBasicMaterial({ map: flagTex, side: THREE.DoubleSide });
            const flag = new THREE.Mesh(flagGeo, flagMat);
            flag.position.set(-6, 6.8, 0);
            gateGroup.add(flag);

            scene.add(gateGroup);
        }
        createSchoolGate();

        // --- NHÂN VẬT & ĐIỀU KHIỂN ---
        const playerGroup = new THREE.Group();
        playerGroup.position.set(22, 1, 5);
        scene.add(playerGroup);

        const bodyGeo = new THREE.CylinderGeometry(0.3, 0.3, 1.4);
        const bodyMat = new THREE.MeshStandardMaterial({ color: 0x222222 });
        const body = new THREE.Mesh(bodyGeo, bodyMat);
        body.position.y = 0.7;
        playerGroup.add(body);

        const headGeo = new THREE.SphereGeometry(0.25);
        const headMat = new THREE.MeshStandardMaterial({ color: 0xffcc99 });
        const head = new THREE.Mesh(headGeo, headMat);
        head.position.y = 1.6;
        playerGroup.add(head);

        const hairGeo = new THREE.SphereGeometry(0.28, 8, 8);
        const hairMat = new THREE.MeshStandardMaterial({ color: 0x111111 });
        const hair = new THREE.Mesh(hairGeo, hairMat);
        hair.position.set(0, 1.65, -0.05);
        playerGroup.add(hair);

        let moveForward = 0, moveSide = 0;
        let isFlying = false;
        let cameraPitch = 0, cameraYaw = 0;

        const joystick = document.getElementById('joystick');
        const knob = document.getElementById('knob');
        let touchId = null, startX = 0, startY = 0;

        joystick.addEventListener('touchstart', (e) => {
            const touch = e.changedTouches[0];
            touchId = touch.identifier;
            startX = touch.clientX;
            startY = touch.clientY;
        });

        window.addEventListener('touchmove', (e) => {
            if (touchId === null) return;
            for (let touch of e.changedTouches) {
                if (touch.identifier === touchId) {
                    const dx = touch.clientX - startX;
                    const dy = touch.clientY - startY;
                    const dist = Math.min(Math.hypot(dx, dy), 40);
                    const angle = Math.atan2(dy, dx);
                    
                    knob.style.transform = `translate(${Math.cos(angle) * dist}px, ${Math.sin(angle) * dist}px)`;
                    moveSide = (Math.cos(angle) * dist) / 40;
                    moveForward = -(Math.sin(angle) * dist) / 40;
                }
            }
        });

        const resetJoystick = () => {
            touchId = null;
            knob.style.transform = 'translate(0px, 0px)';
            moveForward = 0;
            moveSide = 0;
        };
        window.addEventListener('touchend', resetJoystick);
        window.addEventListener('touchcancel', resetJoystick);

        let isLook = false, lookStartX = 0, lookStartY = 0;
        window.addEventListener('touchstart', (e) => {
            if (e.target.closest('#joystick') || e.target.closest('#fly-btn')) return;
            isLook = true;
            lookStartX = e.touches[0].clientX;
            lookStartY = e.touches[0].clientY;
        });

        window.addEventListener('touchmove', (e) => {
            if (!isLook) return;
            const dx = e.touches[0].clientX - lookStartX;
            const dy = e.touches[0].clientY - lookStartY;
            lookStartX = e.touches[0].clientX;
            lookStartY = e.touches[0].clientY;

            cameraYaw -= dx * 0.005;
            cameraPitch -= dy * 0.005;
            
            cameraPitch = Math.max(-Math.PI / 4, Math.min(Math.PI / 3, cameraPitch));
        });

        window.addEventListener('touchend', () => isLook = false);

        const flyBtn = document.getElementById('fly-btn');
        flyBtn.addEventListener('click', () => {
            isFlying = !isFlying;
            flyBtn.style.background = isFlying ? 'rgba(255, 215, 0, 0.6)' : 'rgba(255, 255, 255, 0.3)';
        });

        const keys = {};
        window.addEventListener('keydown', (e) => keys[e.code] = true);
        window.addEventListener('keyup', (e) => keys[e.code] = false);

        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            const speed = isFlying ? 18.0 : 6.0;

            let fDrive = moveForward, sDrive = moveSide;
            if (keys['KeyW'] || keys['ArrowUp']) fDrive = 1;
            if (keys['KeyS'] || keys['ArrowDown']) fDrive = -1;
            if (keys['KeyA'] || keys['ArrowLeft']) sDrive = -1;
            if (keys['KeyD'] || keys['ArrowRight']) sDrive = 1;

            if (fDrive !== 0 || sDrive !== 0) {
                const moveVector = new THREE.Vector3(sDrive, 0, -fDrive);
                moveVector.applyAxisAngle(new THREE.Vector3(0, 1, 0), cameraYaw);
                moveVector.normalize().multiplyScalar(speed * delta);
                
                playerGroup.position.add(moveVector);
                playerGroup.rotation.y = Math.atan2(moveVector.x, moveVector.z);
            }

            if (isFlying) {
                if (keys['Space']) playerGroup.position.y += speed * delta;
                if (keys['ShiftLeft']) playerGroup.position.y = Math.max(1, playerGroup.position.y - speed * delta);
            } else {
                playerGroup.position.y = 1;
            }

            const camOffset = new THREE.Vector3(0, 2.5, 5);
            camOffset.applyAxisAngle(new THREE.Vector3(1, 0, 0), cameraPitch);
            camOffset.applyAxisAngle(new THREE.Vector3(0, 1, 0), cameraYaw);

            camera.position.copy(playerGroup.position).add(camOffset);
            camera.lookAt(playerGroup.position.clone().add(new THREE.Vector3(0, 1.5, 0)));

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
