<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khuôn viên 3D THCS Cam Thượng - Tối Giản</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            user-select: none;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div id="canvas-container"></div>

    <script>
        // ==========================================
        // LỚP ĐIỀU KHIỂN NHÂN VẬT
        // ==========================================
        class PlayerController {
            constructor(camera) {
                this.camera = camera;
                this.position = new THREE.Vector3(0, 1.7, 80);
                this.velocity = new THREE.Vector3();
                this.height = 1.7;
                this.isFlying = false;
                this.isGrounded = true;

                this.walkSpeed = 5.0;
                this.flySpeed = 35.0 / 3.6; // 35 km/h
                this.gravity = -9.81;
                this.jumpForce = 5.0;

                this.pitch = 0;
                this.yaw = 0;
                this.isMouseDown = false;
                this.mouseX = 0;
                this.mouseY = 0;

                this.keys = {};
                this.spaceClickCount = 0;
                this.lastSpaceTime = 0;
                this.multiTapDelay = 350;

                this.initEventListeners();
            }

            initEventListeners() {
                window.addEventListener('keydown', (e) => {
                    this.keys[e.code] = true;
                    if (e.code === 'Space') {
                        const now = performance.now();
                        if (now - this.lastSpaceTime < this.multiTapDelay) {
                            this.spaceClickCount++;
                        } else {
                            this.spaceClickCount = 1;
                        }
                        this.lastSpaceTime = now;
                        this.handleSpaceMultiTap();
                    }
                });

                window.addEventListener('keyup', (e) => {
                    this.keys[e.code] = false;
                });

                document.addEventListener('mousedown', (e) => {
                    if (e.button === 0) {
                        this.isMouseDown = true;
                        this.mouseX = e.clientX;
                        this.mouseY = e.clientY;
                    }
                });

                document.addEventListener('mouseup', () => {
                    this.isMouseDown = false;
                });

                document.addEventListener('mousemove', (e) => {
                    if (!this.isMouseDown) return;

                    const deltaX = e.clientX - this.mouseX;
                    const deltaY = e.clientY - this.mouseY;

                    this.mouseX = e.clientX;
                    this.mouseY = e.clientY;

                    this.yaw -= deltaX * 0.003;
                    this.pitch -= deltaY * 0.003;

                    const maxPitch = Math.PI / 2 - 0.05;
                    const minPitch = 0.0; // Giới hạn không cho nhìn âm xuống dưới đất
                    this.pitch = Math.max(minPitch, Math.min(maxPitch, this.pitch));
                });
            }

            handleSpaceMultiTap() {
                setTimeout(() => {
                    if (this.spaceClickCount === 1) {
                        if (this.isGrounded && !this.isFlying) {
                            this.velocity.y = this.jumpForce;
                            this.isGrounded = false;
                        }
                    } else if (this.spaceClickCount === 2) {
                        this.isFlying = true;
                        this.velocity.set(0, 0, 0);
                    } else if (this.spaceClickCount >= 3) {
                        this.isFlying = false;
                    }
                    this.spaceClickCount = 0;
                }, this.multiTapDelay);
            }

            update(delta) {
                const euler = new THREE.Euler(this.pitch, this.yaw, 0, 'YXZ');
                const lookDirection = new THREE.Vector3(0, 0, -1).applyEuler(euler);

                const forwardVector = new THREE.Vector3(Math.sin(this.yaw), 0, Math.cos(this.yaw)).negate();
                const sideVector = new THREE.Vector3().crossVectors(new THREE.Vector3(0, 1, 0), forwardVector).negate();

                const moveDir = new THREE.Vector3();

                if (this.keys['KeyW']) moveDir.add(forwardVector);
                if (this.keys['KeyS']) moveDir.sub(forwardVector);
                if (this.keys['KeyA']) moveDir.sub(sideVector);
                if (this.keys['KeyD']) moveDir.add(sideVector);

                moveDir.normalize();

                if (this.isFlying) {
                    const flyVector = moveDir.clone().multiplyScalar(this.flySpeed * delta);
                    if (this.keys['KeyW']) flyVector.y += lookDirection.y * this.flySpeed * delta;

                    this.position.add(flyVector);

                    if (this.position.y < this.height) {
                        this.position.y = this.height;
                    }
                } else {
                    this.position.addScaledVector(moveDir, this.walkSpeed * delta);

                    this.velocity.y += this.gravity * delta;
                    this.position.y += this.velocity.y * delta;

                    if (this.position.y <= this.height) {
                        this.position.y = this.height;
                        this.velocity.y = 0;
                        this.isGrounded = true;
                    }
                }

                this.camera.position.copy(this.position);
                this.camera.lookAt(this.position.clone().add(lookDirection));
            }
        }

        // ==========================================
        // KHỞI TẠO KHÔNG GIAN 3D
        // ==========================================
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1500);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.shadowMap.enabled = true;
        container.appendChild(renderer.domElement);

        const playerController = new PlayerController(camera);

        // Ánh sáng
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambientLight);

        const sunLight = new THREE.DirectionalLight(0xffffff, 0.8);
        sunLight.position.set(150, 250, 100);
        sunLight.castShadow = true;
        scene.add(sunLight);

        // TEXTURE SÂN TRƯỜNG (NÂU HỒNG)
        function generateTileTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 256;
            canvas.height = 256;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = '#b5655b';
            ctx.fillRect(0, 0, 256, 256);

            ctx.strokeStyle = '#e0a899';
            ctx.lineWidth = 6;

            const cols = 4, rows = 8;
            const w = 256 / cols, h = 256 / rows;

            for (let i = 0; i < cols; i++) {
                for (let j = 0; j < rows; j++) {
                    ctx.strokeRect(i * w, j * h, w, h);
                }
            }

            const texture = new THREE.CanvasTexture(canvas);
            texture.wrapS = THREE.RepeatWrapping;
            texture.wrapT = THREE.RepeatWrapping;
            return texture;
        }

        const courtyardTexture = generateTileTexture();
        courtyardTexture.repeat.set(65, 52.5);

        // ĐẤT VÀ SÂN
        const outerGround = new THREE.Mesh(
            new THREE.PlaneGeometry(900, 900),
            new THREE.MeshStandardMaterial({ color: 0x557a46 })
        );
        outerGround.rotation.x = -Math.PI / 2;
        outerGround.position.y = -0.1;
        scene.add(outerGround);

        const mainCourtyard = new THREE.Mesh(
            new THREE.PlaneGeometry(260, 210),
            new THREE.MeshStandardMaterial({ map: courtyardTexture })
        );
        mainCourtyard.rotation.x = -Math.PI / 2;
        scene.add(mainCourtyard);

        // ==========================================
        // DÃY NHÀ A (HÌNH CHỮ L - 4 TẦNG)
        // ==========================================
        const buildingAGroup = new THREE.Group();

        const wallMat = new THREE.MeshStandardMaterial({ color: 0xa0c4ff });
        const baseMat = new THREE.MeshStandardMaterial({ color: 0xf8f9fa });
        const roofMat = new THREE.MeshStandardMaterial({ color: 0x343a40 });
        const stairMat = new THREE.MeshStandardMaterial({ color: 0xd3d3d3 });

        function createSimpleBlock(length, depth) {
            const group = new THREE.Group();
            const height = 16; // 4 tầng

            // Khối nhà chính
            const mainMesh = new THREE.Mesh(new THREE.BoxGeometry(length, height, depth), wallMat);
            mainMesh.position.y = height / 2;
            group.add(mainMesh);

            // Chân tường trắng
            const baseMesh = new THREE.Mesh(new THREE.BoxGeometry(length + 0.2, 1.5, depth + 0.2), baseMat);
            baseMesh.position.y = 0.75;
            group.add(baseMesh);

            // Mái
            const roofMesh = new THREE.Mesh(new THREE.BoxGeometry(length + 0.5, 0.5, depth + 0.5), roofMat);
            roofMesh.position.y = height + 0.25;
            group.add(roofMesh);

            return group;
        }

        // Nhánh A & Nhánh B
        const wingA = createSimpleBlock(80, 15);
        wingA.position.set(40, 0, 0);
        buildingAGroup.add(wingA);

        const wingB = createSimpleBlock(60, 15);
        wingB.rotation.y = Math.PI / 2;
        wingB.position.set(7.5, 0, 37.5);
        buildingAGroup.add(wingB);

        // Cầu thang
        const stairGroup = new THREE.Group();
        for (let f = 0; f < 3; f++) {
            for (let s = 0; s < 10; s++) {
                const step = new THREE.Mesh(new THREE.BoxGeometry(4, 0.4, 0.4), stairMat);
                step.position.set(17, f * 4 + s * 0.4 + 0.2, 15 + s * 0.4);
                stairGroup.add(step);
            }
        }
        buildingAGroup.add(stairGroup);

        buildingAGroup.position.set(-80, 0, -60);
        scene.add(buildingAGroup);

        // SÂN KHẤU/BỆ LỄ ĐƯỜNG
        const stage = new THREE.Mesh(new THREE.BoxGeometry(30, 1, 15), baseMat);
        stage.position.set(0, 0.5, 10);
        scene.add(stage);

        // ==========================================
        // VÒNG LẶP RENDER
        // ==========================================
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            playerController.update(clock.getDelta());
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
