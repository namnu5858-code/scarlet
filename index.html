<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang Tối Ưu</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
        }

        #zalo-chat-wrapper {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 9999;
        }

        #zalo-chat-toggle-btn {
            background-color: #0068ff;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .rainbow-name {
            font-size: 24px;
            font-weight: bold;
            animation: rainbowGlow 5s linear infinite;
        }

        @keyframes rainbowGlow {
            0% { color: #ff0000; }
            20% { color: #ff8000; }
            40% { color: #ffff00; }
            60% { color: #00ff00; }
            80% { color: #0000ff; }
            100% { color: #ff00ff; }
        }

        #music-player {
            margin: 20px;
            padding: 15px;
            background: #222;
            border-radius: 8px;
            display: block;
        }
    </style>
</head>
<body>

    <div class="rainbow-name">Nam</div>
    <div class="rainbow-name">Nam</div>

    <div id="music-player">
        <p>Trình phát nhạc (Phím T: Nghe | Phím A: Tiếp tục | Phím S: Dừng)</p>
        <audio id="bg-music" src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" preload="auto"></audio>
    </div>

    <div id="zalo-chat-wrapper">
        <button id="zalo-chat-toggle-btn">Chat Zalo</button>
    </div>

    <script>
        const music = document.getElementById('bg-music');

        window.addEventListener('keydown', (e) => {
            const key = e.key.toUpperCase();
            if (key === 'T') {
                music.currentTime = 0;
                music.play().catch(err => console.log("Cần tương tác trước để phát nhạc"));
            } else if (key === 'A') {
                music.play().catch(err => console.log("Cần tương tác trước để phát nhạc"));
            } else if (key === 'S') {
                music.pause();
            }
        });

        function syncRainbowAnimation() {
            const timeOffset = (Date.now() % 5000) / 5000 * 100;
            const elements = document.querySelectorAll('.rainbow-name');
            elements.forEach(el => {
                el.style.animationDelay = `-${timeOffset}s`;
            });
        }
        syncRainbowAnimation();
    </script>
</body>
</html>
