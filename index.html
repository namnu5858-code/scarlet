<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>Cam Thung Middle School - 3D Campus</title>

<style>
*{
  box-sizing:border-box;
  -webkit-user-select:none;
  user-select:none;
  -webkit-touch-callout:none;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#8fd4f5;
  touch-action:none;
  font-family:Arial,sans-serif;
}

#game-container{
  position:fixed;
  top:0;
  left:0;
  width:100vw;
  height:100vh;
  z-index:1;
}

canvas{
  display:block;
  width:100vw !important;
  height:100vh !important;
}

.glass-ui{
  background:rgba(255,255,255,.18);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  border:1px solid rgba(255,255,255,.4);
  box-shadow:0 8px 32px rgba(0,0,0,.18);
}

#joystick-wrapper{
  position:absolute;
  left:32px;
  bottom:32px;
  width:120px;
  height:120px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:20;
  touch-action:none;
}

#joystick-stick{
  position:absolute;
  width:52px;
  height:52px;
  border-radius:50%;
  background:rgba(255,255,255,.58);
  border:1px solid rgba(255,255,255,.85);
  box-shadow:0 4px 14px rgba(0,0,0,.18);
  pointer-events:none;
}

#jump-btn{
  position:absolute;
  right:32px;
  bottom:38px;
  width:72px;
  height:72px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:20;
  touch-action:none;
  transition:background .3s ease,transform .1s ease;
}

#jump-btn.flying{
  background:rgba(255,215,0,.55);
  border-color:rgba(255,255,255,.9);
  box-shadow:0 0 15px rgba(255,215,0,.6);
}

#jump-btn:active{
  transform:scale(.94);
}

#jump-btn svg{
  width:34px;
  height:34px;
  fill:none;
  stroke:white;
  stroke-width:2.5;
  stroke-linecap:round;
  stroke-linejoin:round;
}

#loading{
  position:absolute;
  top:14px;
  right:16px;
  padding:8px 14px;
  border-radius:10px;
  background:rgba(0,0,0,.42);
  color:white;
  font-size:12px;
  z-index:30;
  pointer-events:none;
}

/* ============================================================
   MÀN HÌNH KÍNH & BROWSER
   ============================================================ */

#screen-hint{
  position:absolute;
  left:50%;
  top:18px;
  transform:translateX(-50%);
  padding:9px 15px;
  border-radius:12px;
  background:rgba(0,0,0,.55);
  color:white;
  font-size:13px;
  z-index:25;
  pointer-events:none;
  opacity:0;
  transition:opacity .25s ease;
}

#screen-hint.show{
  opacity:1;
}

#browser-overlay{
  position:fixed;
  inset:0;
  z-index:100;
  display:none;
  background:rgba(0,0,0,.88);
  padding:
    max(10px,env(safe-area-inset-top))
    max(8px,env(safe-area-inset-right))
    max(10px,env(safe-area-inset-bottom))
    max(8px,env(safe-area-inset-left));
}

#browser-overlay.open{
  display:flex;
  flex-direction:column;
}

#browser-bar{
  width:100%;
  min-height:52px;
  display:flex;
  align-items:center;
  gap:7px;
  padding:6px;
  border-radius:14px;
  background:rgba(35,35,35,.96);
}

.browser-btn{
  width:38px;
  height:38px;
  flex:0 0 38px;
  border:0;
  border-radius:10px;
  background:#444;
  color:white;
  font-size:18px;
  touch-action:manipulation;
}

#browser-url{
  flex:1;
  min-width:0;
  height:38px;
  border:0;
  outline:none;
  border-radius:10px;
  padding:0 12px;
  background:#fff;
  color:#111;
  font-size:15px;
  -webkit-user-select:text;
  user-select:text;
}

#browser-frame-wrap{
  position:relative;
  flex:1;
  min-height:0;
  margin-top:7px;
  overflow:hidden;
  border-radius:14px;
  background:white;
}

#browser-frame{
  width:100%;
  height:100%;
  border:0;
  background:white;
}

#browser-warning{
  position:absolute;
  left:12px;
  right:12px;
  bottom:12px;
  padding:10px 12px;
  border-radius:10px;
  background:rgba(0,0,0,.75);
  color:white;
  font-size:12px;
  line-height:1.4;
  pointer-events:none;
  opacity:.85;
}
</style>

<script type="importmap">
{
  "imports":{
    "three":"https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}

</head>

<body>

<div id="game-container"></div>

<div id="loading">
Đang dựng khuôn viên trường 3D...
</div>

<div id="screen-hint">
Chạm chính xác vào màn hình kính để mở
</div>

<div id="joystick-wrapper" class="glass-ui">
  <div id="joystick-stick"></div>
</div>

<div id="jump-btn" class="glass-ui">
  <svg viewBox="0 0 24 24">
    <path d="M12 19V5"></path>
    <path d="M5 12l7-7 7 7"></path>
  </svg>
</div>

<!-- ==========================================================
     BROWSER OVERLAY
     ========================================================== -->

<div id="browser-overlay">

  <div id="browser-bar">

    <button class="browser-btn" id="browser-back">‹</button>
    <button class="browser-btn" id="browser-forward">›</button>

    <input
      id="browser-url"
      type="url"
      inputmode="url"
      autocomplete="off"
      autocapitalize="none"
      spellcheck="false"
      placeholder="Tìm kiếm với DuckDuckGo hoặc nhập địa chỉ web"
      value="https://duckduckgo.com"
    >

    <button class="browser-btn" id="browser-go">↵</button>
    <button class="browser-btn" id="browser-close">×</button>

  </div>

  <div id="browser-frame-wrap">

    <iframe
      id="browser-frame"
      title="Trình duyệt DuckDuckGo"
      src="https://duckduckgo.com"
      allow="autoplay; fullscreen; picture-in-picture; encrypted-media"
      allowfullscreen>
    </iframe>

    <div id="browser-warning">

</div>

<script type="module">

import * as THREE from "three";
import {GLTFLoader} from "three/addons/loaders/GLTFLoader.js";

// ============================================================
// SCENE & RENDERER
// ============================================================

const container=document.getElementById("game-container");
const loading=document.getElementById("loading");

const scene=new THREE.Scene();

scene.background=new THREE.Color(0x8fd4f5);

scene.fog=new THREE.FogExp2(
  0xbfeafa,
  0.0012
);

const cameraPivot=new THREE.Object3D();
scene.add(cameraPivot);

const camera=new THREE.PerspectiveCamera(
  60,
  window.innerWidth/window.innerHeight,
  0.1,
  3000
);
cameraPivot.add(camera);

let cameraDistance=10;
let targetCameraDistance=10;

let cameraAngleX=0.1;
let cameraAngleY=0;

let targetCameraAngleX=0.1;
let targetCameraAngleY=0;

const renderer=new THREE.WebGLRenderer({
  antialias:true,
  powerPreference:"high-performance"
});

renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.12;

container.appendChild(renderer.domElement);

// ============================================================
// CAMERA COLLISION
// ============================================================

const raycaster=new THREE.Raycaster();
const cameraCollisionObjects=[];

function updateCamera(){

  cameraAngleY=THREE.MathUtils.lerp(
    cameraAngleY,
    targetCameraAngleY,
    0.18
  );

  cameraAngleX=THREE.MathUtils.lerp(
    cameraAngleX,
    targetCameraAngleX,
    0.18
  );

  cameraDistance=THREE.MathUtils.lerp(
    cameraDistance,
    targetCameraDistance,
    0.12
  );

  cameraPivot.rotation.y=cameraAngleY;
  cameraPivot.rotation.x=cameraAngleX;

  const origin=cameraPivot.position.clone();

  const dir=new THREE.Vector3(0,0,1)
    .applyQuaternion(cameraPivot.quaternion);

  raycaster.set(origin,dir);

  let actualDistance=cameraDistance;

  if(cameraCollisionObjects.length>0){

    const hits=raycaster.intersectObjects(
      cameraCollisionObjects,
      true
    );

    if(
      hits.length>0 &&
      hits[0].distance<cameraDistance
    ){

      actualDistance=Math.max(
        hits[0].distance-0.3,
        0.5
      );
    }
  }

  camera.position.set(
    0,
    0,
    actualDistance
  );

  camera.lookAt(cameraPivot.position);
}

// ============================================================
// LIGHTING
// ============================================================

const hemisphere=new THREE.HemisphereLight(
  0xe8f8ff,
  0x516b3b,
  1.5
);

scene.add(hemisphere);

const sunlight=new THREE.DirectionalLight(
  0xfff3d2,
  2.2
);

sunlight.position.set(100,130,80);
sunlight.castShadow=true;

sunlight.shadow.mapSize.width=2048;
sunlight.shadow.mapSize.height=2048;

sunlight.shadow.camera.near=1;
sunlight.shadow.camera.far=400;

sunlight.shadow.camera.left=-250;
sunlight.shadow.camera.right=250;
sunlight.shadow.camera.top=250;
sunlight.shadow.camera.bottom=-250;

sunlight.shadow.bias=-0.0003;

scene.add(sunlight);

// ============================================================
// MATERIALS
// ============================================================

const MAT={};

MAT.redTile=new THREE.MeshStandardMaterial({
  color:0xa94c3d,
  roughness:.78
});

MAT.lightBlue=new THREE.MeshStandardMaterial({
  color:0x9ed9ec,
  roughness:.7
});

MAT.white=new THREE.MeshStandardMaterial({
  color:0xf4f5f0,
  roughness:.72
});

MAT.yellow=new THREE.MeshStandardMaterial({
  color:0xe7d16a,
  roughness:.8
});

MAT.darkMetal=new THREE.MeshStandardMaterial({
  color:0x30383b,
  roughness:.55,
  metalness:.65
});

MAT.steel=new THREE.MeshStandardMaterial({
  color:0xadb7ba,
  roughness:.35,
  metalness:.8
});

MAT.roofMetal=new THREE.MeshStandardMaterial({
  color:0x68777b,
  roughness:.65,
  metalness:.45
});

MAT.glass=new THREE.MeshPhysicalMaterial({
  color:0x76b9d2,
  roughness:.08,
  metalness:.05,
  transparent:true,
  opacity:.68
});

MAT.concrete=new THREE.MeshStandardMaterial({
  color:0xb8b9b3,
  roughness:.9
});

// ============================================================
// HELPER
// ============================================================

function box(
  w,
  h,
  d,
  x,
  y,
  z,
  material,
  parent=scene
){

  const mesh=new THREE.Mesh(
    new THREE.BoxGeometry(w,h,d),
    material
  );

  mesh.position.set(x,y,z);
  mesh.castShadow=true;
  mesh.receiveShadow=true;

  parent.add(mesh);

  return mesh;
}

// ============================================================
// CAMPUS & GROUND
// ============================================================

const campus=new THREE.Group();
scene.add(campus);

const CAMPUS_W=260;
const CAMPUS_D=210;

const baseGround=box(
  2500,
  1,
  2500,
  0,
  -0.7,
  0,
  new THREE.MeshStandardMaterial({
    color:0x73b951,
    roughness:1
  }),
  campus
);

cameraCollisionObjects.push(baseGround);

const courtyard=box(
  240,
  .45,
  190,
  0,
  0,
  0,
  MAT.redTile,
  campus
);

cameraCollisionObjects.push(courtyard);

const tileLineMaterial=new THREE.MeshStandardMaterial({
  color:0x5e2b26,
  roughness:.9
});

for(let x=-120;x<=120;x+=6){

  box(
    .12,
    .03,
    190,
    x,
    .235,
    0,
    tileLineMaterial,
    campus
  );
}

for(let z=-95;z<=95;z+=6){

  box(
    240,
    .03,
    .12,
    0,
    .235,
    z,
    tileLineMaterial,
    campus
  );
}

// ============================================================
// FENCE
// ============================================================

function createFenceX(z){

  box(
    CAMPUS_W,
    2,
    1,
    0,
    1,
    z,
    MAT.yellow,
    campus
  );

  for(let x=-130;x<=130;x+=4){

    box(
      .16,
      2.5,
      .16,
      x,
      2.25,
      z,
      MAT.darkMetal,
      campus
    );
  }

  box(
    CAMPUS_W,
    .16,
    .16,
    0,
    3.4,
    z,
    MAT.darkMetal,
    campus
  );

  box(
    CAMPUS_W,
    .16,
    .16,
    0,
    2.35,
    z,
    MAT.darkMetal,
    campus
  );
}

function createFenceZ(x){

  box(
    1,
    2,
    CAMPUS_D,
    x,
    1,
    0,
    MAT.yellow,
    campus
  );

  for(let z=-105;z<=105;z+=4){

    box(
      .16,
      2.5,
      .16,
      x,
      2.25,
      z,
      MAT.darkMetal,
      campus
    );
  }

  box(
    .16,
    .16,
    CAMPUS_D,
    x,
    3.4,
    0,
    MAT.darkMetal,
    campus
  );
}

createFenceX(-105);
createFenceX(105);
createFenceZ(-130);
createFenceZ(130);

// ============================================================
// BUILDING A
// ============================================================

const buildingA=new THREE.Group();
campus.add(buildingA);

const A_HEIGHT=16;

const bA=box(
  145,
  A_HEIGHT,
  17,
  -45,
  A_HEIGHT/2,
  -55,
  MAT.lightBlue,
  buildingA
);

cameraCollisionObjects.push(bA);

box(
  145,
  1.2,
  17.5,
  -45,
  .6,
  -55,
  MAT.white,
  buildingA
);

for(let y=4;y<16;y+=4){

  box(
    145,
    .22,
    17.5,
    -45,
    y,
    -55,
    MAT.white,
    buildingA
  );
}

for(let floor=0;floor<4;floor++){

  const y=2+floor*4;

  for(let x=-112;x<=22;x+=13){

    box(
      8.2,
      2.25,
      .20,
      x,
      y,
      -63.65,
      MAT.glass,
      buildingA
    );

    box(
      8.7,
      .15,
      .15,
      x,
      y-1.15,
      -63.82,
      MAT.darkMetal,
      buildingA
    );

    box(
      8.7,
      .15,
      .15,
      x,
      y+1.15,
      -63.82,
      MAT.darkMetal,
      buildingA
    );

    box(
      .15,
      2.4,
      .15,
      x-4.25,
      y,
      -63.82,
      MAT.darkMetal,
      buildingA
    );

    box(
      .15,
      2.4,
      .15,
      x+4.25,
      y,
      -63.82,
      MAT.darkMetal,
      buildingA
    );
  }
}

for(let floor=1;floor<=3;floor++){

  const y=floor*4;

  box(
    145,
    .28,
    5,
    -45,
    y,
    -45,
    MAT.concrete,
    buildingA
  );

  for(let x=-112;x<=22;x+=5){

    box(
      .12,
      2,
      .12,
      x,
      y+1,
      -42.6,
      MAT.steel,
      buildingA
    );
  }

  box(
    145,
    .12,
    .12,
    -45,
    y+2,
    -42.6,
    MAT.steel,
    buildingA
  );

  box(
    145,
    .12,
    .12,
    -45,
    y+.8,
    -42.6,
    MAT.steel,
    buildingA
  );
}

// ============================================================
// BUILDING B
// ============================================================

const buildingB=new THREE.Group();
campus.add(buildingB);

const BX=75;
const BZ=-10;

const bB=box(
  70,
  16,
  30,
  BX,
  8,
  BZ,
  MAT.lightBlue,
  buildingB
);

cameraCollisionObjects.push(bB);

box(
  70,
  1.2,
  31,
  BX,
  .6,
  BZ,
  MAT.white,
  buildingB
);

for(let y=4;y<16;y+=4){

    70,
    .22,

    y,
    BZ,
    MAT.white,
    buildingB
  );
}

for(let floor=0;floor<4;floor++){

  const y=2+floor*4;

  for(let x=47;x<=103;x+=14){

    box(
      8,
      2.3,
      .18,
      x,
      y,
      BZ-15.15,
      MAT.glass,
      buildingB
    );

    box(

      .15,
      .15,

    );

      .15,

    );

    );

    box(

      2.4,
      .15,

      y,
      BZ-15.3,

    );

}

for(let floor=1;floor<=3;floor++){

  const y=floor*4;

  box(
    70,
    .3,
    5.5,
    BX,
    y,
    BZ-17.8,
    MAT.concrete,
    buildingB
  );

  for(let x=41;x<=109;x+=4){

    box(
      .12,
      2.2,
      .12,
      x,
      y+1.1,
      BZ-20.2,

      buildingB
    );
  }

  box(
    70,
    .12,
    .12,

  );

    .12,
    .12,
    BX,

    BZ-20.2,
    MAT.steel,
    buildingB
  );
}

// ============================================================
// PARKING
// ============================================================

const parking=new THREE.Group();
campus.add(parking);

const parkingZ=72;

box(
  150,
  .5,
  30,
  -5,
  .25,
  parkingZ,
  MAT.concrete,
  parking
);

for(let x=-75;x<=65;x+=10){

  box(
    .45,
    7,
    .45,
    x,
    3.5,
    parkingZ-12,
    MAT.darkMetal,

  );

  box(
    .45,
    7,
    .45,

    3.5,

    MAT.darkMetal,
    parking
  );
}

box(
  155,
  .7,
  34,
  -5,
  7.5,
  parkingZ,
  MAT.roofMetal,

);

function createMotorbike(x,z){

  const bike=new THREE.Group();

  const wheelMat=new THREE.MeshStandardMaterial({
    color:0x181b1d,
    roughness:.7
  });

  const bodyMat=new THREE.MeshStandardMaterial({
    color:0x303d46,
    metalness:.3,
    roughness:.55
  });

  const wheel1=new THREE.Mesh(
    new THREE.CylinderGeometry(1.25,1.25,.45,18),
    wheelMat
  );

  wheel1.rotation.z=Math.PI/2;
  wheel1.position.set(0,1.25,-2.4);
  bike.add(wheel1);

  const wheel2=wheel1.clone();
  wheel2.position.z=2.4;
  bike.add(wheel2);

  const body=new THREE.Mesh(
    new THREE.BoxGeometry(1.5,.8,4),
    bodyMat
  );

  body.position.y=2;
  bike.add(body);

  bike.position.set(x,0,z);
  bike.rotation.y=Math.PI/2;

  parking.add(bike);
}

for(let x=-65;x<=55;x+=10){
  createMotorbike(x,parkingZ-5);
}

// ============================================================
// WALKWAYS
// ============================================================

const walkwayMat=new THREE.MeshStandardMaterial({
  color:0xb76653,
  roughness:.85
});

box(
  110,
  .12,
  8,
  0,
  .29,
  45,
  walkwayMat,
  campus
);

box(
  8,
  .12,
  120,
  -5,
  .29,
  -20,
  walkwayMat,
  campus
);

// ============================================================
// MÀN HÌNH WIDESCREEN 16:9 DUCKDUCKGO ĐỘ PHÂN GIẢI CAO (2048x1152)
// ============================================================

const screenGroup=new THREE.Group();
screenGroup.name="InteractiveGlassScreen";
campus.add(screenGroup);

const SCREEN_X=-10;
const SCREEN_Z=10;

const SCREEN_W=16.0;
const SCREEN_H=9.0;
const SCREEN_D=0.3;

const screenCanvas=document.createElement('canvas');
screenCanvas.width=2048;
screenCanvas.height=1152;
const ctx=screenCanvas.getContext('2d');

function drawDuckDuckGoUI(){
  ctx.fillStyle='#1c1d21';
  ctx.fillRect(0,0,2048,1152);

  ctx.beginPath();
  ctx.arc(1024,380,85,0,Math.PI*2);
  ctx.fillStyle='#de5833';

function checkScreenTouch(clientX,clientY){
  const rect=renderer.domElement.getBoundingClientRect();
  screenPointer.x=((clientX-rect.left)/rect.width)*2-1;
  screenPointer.y=-((clientY-rect.top)/rect.height)*2+1;

const PARTICLE_COUNT = 80000;
let fwParticles, fwGeometry, fwMaterial;
let fwAnimTime = 0;
let fwIsActive = false;
let holdTimer = null;
let holdTargetPoint = new THREE.Vector3(0, 5, 0);

const DURATION_GATHER = 3.5;
const DURATION_SPIN = 2.0;
const DURATION_LAUNCH = 1.2;
const DURATION_EXPLODE = 4.0;
const FW_TOTAL_DURATION = DURATION_GATHER + DURATION_SPIN + DURATION_LAUNCH + DURATION_EXPLODE;

// Web Audio API
let audioCtx = null;
function initAudio() {
  if (!audioCtx) {
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    if (AudioContext) audioCtx = new AudioContext();
  }
}

function playLaunchSound() {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(120, audioCtx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(850, audioCtx.currentTime + DURATION_LAUNCH);
  gain.gain.setValueAtTime(0.01, audioCtx.currentTime);
  gain.gain.linearRampToValueAtTime(0.35, audioCtx.currentTime + DURATION_LAUNCH * 0.8);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + DURATION_LAUNCH);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + DURATION_LAUNCH);
}

function playExplosionSound() {
  if (!audioCtx) return;
  const bufferSize = audioCtx.sampleRate * 2.5;
  const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i = 0; i < bufferSize; i++) {
    data[i] = Math.random() * 2 - 1;
  }
  const noise = audioCtx.createBufferSource();
  noise.buffer = buffer;
  const filter = audioCtx.createBiquadFilter();
  filter.type = 'lowpass';
  filter.frequency.setValueAtTime(900, audioCtx.currentTime);
  filter.frequency.exponentialRampToValueAtTime(25, audioCtx.currentTime + 2.0);
  const gain = audioCtx.createGain();
  gain.gain.setValueAtTime(1.0, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 2.5);
  noise.connect(filter);
  filter.connect(gain);
  gain.connect(audioCtx.destination);
  noise.start();
}

function createFireworksSystem() {
  fwGeometry = new THREE.BufferGeometry();

  const startPositions = new Float32Array(PARTICLE_COUNT * 3);
  const gatherOffsets = new Float32Array(PARTICLE_COUNT * 3);
  const explodeVelocities = new Float32Array(PARTICLE_COUNT * 3);
  const colors = new Float32Array(PARTICLE_COUNT * 3);
  const sizes = new Float32Array(PARTICLE_COUNT);
  const randoms = new Float32Array(PARTICLE_COUNT * 3);

  const colorObj = new THREE.Color();

  for (let i = 0; i < PARTICLE_COUNT; i++) {
    const i3 = i * 3;

    // 1. Phủ rải rác khắp không gian khuôn viên trường
    startPositions[i3]     = (Math.random() - 0.5) * 220;
    startPositions[i3 + 1] = Math.random() * 60;
    startPositions[i3 + 2] = (Math.random() - 0.5) * 220;

    // 2. Độ lệch xung quanh vị trí tâm tích tụ
    const u = Math.random();
    const v = Math.random();
    const theta = u * 2.0 * Math.PI;
    const phi = Math.acos(2.0 * v - 1.0);
    const r = Math.cbrt(Math.random()) * 2.2;

    gatherOffsets[i3]     = r * Math.sin(phi) * Math.cos(theta);
    gatherOffsets[i3 + 1] = r * Math.sin(phi) * Math.sin(theta);
    gatherOffsets[i3 + 2] = r * Math.cos(phi);

    // 3. Vận tốc bung nổ pháo hoa
    const expTheta = Math.random() * Math.PI * 2;
    const expPhi = Math.acos((Math.random() * 2) - 1);
    const expSpeed = 18.0 + Math.random() * 38.0;

    explodeVelocities[i3]     = expSpeed * Math.sin(expPhi) * Math.cos(expTheta);
    explodeVelocities[i3 + 1] = expSpeed * Math.sin(expPhi) * Math.sin(expTheta);
    explodeVelocities[i3 + 2] = expSpeed * Math.cos(expPhi);

    // 4. Bảng màu sắc đầy đủ
    const hue = Math.random(); 
    colorObj.setHSL(hue, 1.0, 0.6);
    colors[i3]     = colorObj.r;
    colors[i3 + 1] = colorObj.g;
    colors[i3 + 2] = colorObj.b;

    sizes[i] = 1.2 + Math.random() * 2.2;
    randoms[i3]     = Math.random();
    randoms[i3 + 1] = Math.random();
    randoms[i3 + 2] = Math.random();
  }

  fwGeometry.setAttribute('position', new THREE.BufferAttribute(startPositions, 3));
  fwGeometry.setAttribute('aGatherOffset', new THREE.BufferAttribute(gatherOffsets, 3));
  fwGeometry.setAttribute('aExplodeVel', new THREE.BufferAttribute(explodeVelocities, 3));
  fwGeometry.setAttribute('aColor', new THREE.BufferAttribute(colors, 3));
  fwGeometry.setAttribute('aSize', new THREE.BufferAttribute(sizes, 1));
  fwGeometry.setAttribute('aRandom', new THREE.BufferAttribute(randoms, 3));

  const vertexShader = `
    uniform float uTime;
    uniform vec3 uTargetPos;
    attribute vec3 aGatherOffset;
    attribute vec3 aExplodeVel;
    attribute vec3 aColor;
    attribute float aSize;
    attribute vec3 aRandom;

    varying vec3 vColor;
    varying float vAlpha;

    const float T_GATHER = ${DURATION_GATHER.toFixed(1)};
    const float T_SPIN = ${DURATION_SPIN.toFixed(1)};
    const float T_LAUNCH = ${DURATION_LAUNCH.toFixed(1)};
    const float T_EXPLODE = ${DURATION_EXPLODE.toFixed(1)};

    mat3 rotateY(float angle) {
        float c = cos(angle);
        float s = sin(angle);
        return mat3(c, 0, s, 0, 1, 0, -s, 0, c);
    }

    void main() {
        vColor = aColor;
        vAlpha = 1.0;
        vec3 pos = position;

        float t1 = T_GATHER;
        float t2 = t1 + T_SPIN;
        float t3 = t2 + T_LAUNCH;
        float t4 = t3 + T_EXPLODE;

        vec3 gatherCenter = uTargetPos;

        if (uTime < t1) {
            // 1. Gom hạt từ khắp nơi về điểm ấn giữ
            float progress = uTime / t1;
            float ease = progress * progress * (3.0 - 2.0 * progress);
            vec3 target = gatherCenter + aGatherOffset;
            pos = mix(position, target, ease);
        } 
        else if (uTime < t2) {
            // 2. Tích tụ xoáy tròn tại điểm nhấn
            float spinTime = uTime - t1;
            float angle = spinTime * 14.0 + aRandom.x * 6.28;
            pos = gatherCenter + rotateY(angle) * aGatherOffset;
            vColor += vec3(sin(spinTime * 10.0), cos(spinTime * 8.0), sin(spinTime * 12.0)) * 0.35;
        } 
        else if (uTime < t3) {
            // 3. Phóng vút lên trời
            float launchTime = uTime - t2;
            float progress = launchTime / T_LAUNCH;
            float height = progress * 45.0;
            float spin = launchTime * 22.0;
            
            pos = gatherCenter + rotateY(spin) * (aGatherOffset * (1.0 - progress * 0.6));
            pos.y += height;
        } 
        else if (uTime < t4) {
            // 4. Bùng nổ sắc màu
            float expTime = uTime - t3;
            vec3 launchEndPos = gatherCenter + vec3(0.0, 45.0, 0.0);
            
            float drag = exp(-expTime * 0.75);
            vec3 vel = aExplodeVel * drag;
            vec3 gravity = vec3(0.0, -9.8 * expTime * expTime * 0.5, 0.0);
            
            pos = launchEndPos + vel * expTime + gravity;
            vAlpha = smoothstep(T_EXPLODE, T_EXPLODE * 0.25, expTime);
        } else {
            vAlpha = 0.0;
        }

        vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
        gl_PointSize = aSize * (220.0 / -mvPosition.z);
        gl_Position = projectionMatrix * mvPosition;
    }
  `;

  const fragmentShader = `
    varying vec3 vColor;
    varying float vAlpha;

    void main() {
        float dist = length(gl_PointCoord - vec2(0.5));
        if (dist > 0.5 || vAlpha <= 0.0) discard;
        
        float intensity = pow(1.0 - dist * 2.0, 1.4);
        gl_FragColor = vec4(vColor, intensity * vAlpha);
    }
  `;

  fwMaterial = new THREE.ShaderMaterial({
    vertexShader: vertexShader,
    fragmentShader: fragmentShader,
    uniforms: {
      uTime: { value: 0 },
      uTargetPos: { value: new THREE.Vector3(0, 0, 0) }
    },
    transparent: true,
    depthWrite: false,
    blending: THREE.AdditiveBlending
  });

  fwParticles = new THREE.Points(fwGeometry, fwMaterial);
  fwParticles.visible = false;
  scene.add(fwParticles);
}

function triggerFireworksAtPoint(worldPoint) {
  initAudio();
  if (audioCtx && audioCtx.state === 'suspended') {
    audioCtx.resume();
  }

  fwMaterial.uniforms.uTargetPos.value.copy(worldPoint);
  fwAnimTime = 0;
  fwIsActive = true;
  fwParticles.visible = true;

  setTimeout(() => {
    playLaunchSound();
  }, (DURATION_GATHER + DURATION_SPIN) * 1000);

  setTimeout(() => {
    playExplosionSound();
  }, (DURATION_GATHER + DURATION_SPIN + DURATION_LAUNCH) * 1000);
}

// Xử lý sự kiện Ấn giữ (Hold) để kích hoạt tích tụ
function setupHoldToAccumulate() {
  const pointerRay = new THREE.Raycaster();
  const pointerVec = new THREE.Vector2();

  function get3DWorldPoint(clientX, clientY) {
    const rect = renderer.domElement.getBoundingClientRect();
    pointerVec.x = ((clientX - rect.left) / rect.width) * 2 - 1;
    pointerVec.y = -((clientY - rect.top) / rect.height) * 2 + 1;

    pointerRay.setFromCamera(pointerVec, camera);

    // Tìm điểm va chạm với mặt đất hoặc vật thể 3D
    const hits = pointerRay.intersectObjects(campus.children, true);
    if (hits.length > 0) {
      return hits[0].point;
    }

    // Nếu không trúng vật thể nào, chiếu xuống mặt phẳng Y = 0
    const planeY = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
    const target = new THREE.Vector3();
    pointerRay.ray.intersectPlane(planeY, target);
    return target;
  }

  function handleStart(clientX, clientY) {
    if (checkScreenTouch(clientX, clientY)) return; // Nếu chạm vào TV kính thì mở web

    const worldPoint = get3DWorldPoint(clientX, clientY);

    // Đặt bộ đếm thời gian ấn giữ (Hold) 300ms
    clearTimeout(holdTimer);
    holdTimer = setTimeout(() => {
      triggerFireworksAtPoint(worldPoint);
    }, 300);
  }

  function handleEnd() {
    clearTimeout(holdTimer);
  }

  renderer.domElement.addEventListener("pointerdown", (e) => {
    if (e.pointerType === "mouse") handleStart(e.clientX, e.clientY);
  });

  renderer.domElement.addEventListener("pointerup", handleEnd);

  renderer.domElement.addEventListener("touchstart", (e) => {
    if (e.touches.length === 1) {
      const t = e.touches[0];
      
      // Bỏ qua nếu chạm vào Joystick hoặc nút Nhảy
      const joyRect = joystick.getBoundingClientRect();
      const jumpRect = jump.getBoundingClientRect();

      if (
        (t.clientX >= joyRect.left && t.clientX <= joyRect.right && t.clientY >= joyRect.top && t.clientY <= joyRect.bottom) ||
        (t.clientX >= jumpRect.left && t.clientX <= jumpRect.right && t.clientY >= jumpRect.top && t.clientY <= jumpRect.bottom)
      ) {
        return;
      }

      handleStart(t.clientX, t.clientY);
    }
  }, { passive: true });

  renderer.domElement.addEventListener("touchend", handleEnd);
  renderer.domElement.addEventListener("touchcancel", handleEnd);
}

const joystick=document.getElementById(
  "joystick-wrapper"

const stick=document.getElementById(
  "joystick-stick"
);

let joystickTouch=null;

let centerX=0;
let centerY=0;

const radius=40;

joystick.addEventListener(
  "touchstart",
  function(event){

    event.preventDefault();

    const touch=event.changedTouches[0];

    joystickTouch=touch.identifier;

    const rect=joystick.getBoundingClientRect();

    centerX=rect.left+rect.width/2;
    centerY=rect.top+rect.height/2;

    updateJoystick(touch);

  },
  {passive:false}
);

function updateJoystick(touch){

  const dx=touch.clientX-centerX;
  const dy=touch.clientY-centerY;

  const distance=Math.hypot(dx,dy);
  const angle=Math.atan2(dy,dx);

  const limited=Math.min(
    distance,
    radius
  );

  const x=Math.cos(angle)*limited;
  const y=Math.sin(angle)*limited;

  stick.style.transform=
    `translate(${x}px,${y}px)`;

  input.x=x/radius;
  input.y=-y/radius;
}

function resetJoystick(){

  joystickTouch=null;

  input.set(0,0);

  velocity.x=0;
  velocity.z=0;

  stick.style.transform=
    "translate(0px,0px)";
}

        joystickTouch
      ){

        updateJoystick(
          event.changedTouches[i]
        );
      }
    }
  },
  {passive:false}
);

      i++

      if(

        joystickTouch

);

let cameraTouch=null;

let initialPinchDistance=null;

  targetCameraDistance;

window.addEventListener(
  "wheel",
  function(event){

    event.preventDefault();

    const zoomSensitivity=.015;

    targetCameraDistance+=
      event.deltaY*zoomSensitivity;

    targetCameraDistance=
      THREE.MathUtils.clamp(
        targetCameraDistance,
        1.5,
        60
      );

  },
  {passive:false}
);

window.addEventListener(
  "touchstart",
  function(event){

    if(event.touches.length===2){

      initialPinchDistance=
        Math.hypot(
          event.touches[0].clientX-
          event.touches[1].clientX,

          event.touches[0].clientY-
          event.touches[1].clientY
        );

      initialCameraDistance=
        targetCameraDistance;

      return;
    }

    const touch=
      event.changedTouches[0];

    if(
      touch.identifier!==joystickTouch &&
      cameraTouch===null
    ){

      cameraTouch=
        touch.identifier;

      lastX=touch.clientX;
      lastY=touch.clientY;
    }

  }
);

window.addEventListener(
  "touchmove",
  function(event){

    if(
      event.touches.length===2 &&
      initialPinchDistance!==null
    ){

      const currentDistance=
        Math.hypot(
          event.touches[0].clientX-
          event.touches[1].clientX,

          event.touches[0].clientY-
          event.touches[1].clientY
        );

      if(currentDistance>0){

        const factor=
          initialPinchDistance/
          currentDistance;

        targetCameraDistance=
          THREE.MathUtils.clamp(
            initialCameraDistance*factor,
            1.5,
            60
          );
      }

      return;
    }

    for(
      let i=0;
      i<event.changedTouches.length;
      i++
    ){

      const touch=
        event.changedTouches[i];

      if(
        touch.identifier===
        cameraTouch
      ){

        const dx=
          touch.clientX-lastX;

        const dy=
          touch.clientY-lastY;

        targetCameraAngleY-=
          dx*.005;

        targetCameraAngleX=
          THREE.MathUtils.clamp(
            targetCameraAngleX+
            dy*.005,

            -Math.PI/2+.01,
            Math.PI/2-.05
          );

        lastX=touch.clientX;
        lastY=touch.clientY;
      }
    }

  },
  {passive:false}
);

window.addEventListener(
  "touchend",
  function(event){

    if(event.touches.length<2){
      initialPinchDistance=null;
    }

    for(
      let i=0;
      i<event.changedTouches.length;
      i++
    ){

      if(
        event.changedTouches[i].identifier===
        cameraTouch
      ){

        cameraTouch=null;
      }
    }

  }
);

  function(){

);

const browserURL=
  document.getElementById(
    "browser-url"
  );

const browserFrame=
  document.getElementById(
    "browser-frame"
  );

const browserBack=
  document.getElementById(
    "browser-back"
  );

const browserForward=
  document.getElementById(
    "browser-forward"
  );

const browserGo=
  document.getElementById(
    "browser-go"
  );

const browserClose=
  document.getElementById(
    "browser-close"
  );

function navigateBrowser(){

  let value=
    browserURL.value.trim();

  if(!value) return;

  if(
    !/^https?:\/\//i.test(value)
  ){

    value=
      "https://duckduckgo.com/?q="+
      encodeURIComponent(value);
  }

  browserURL.value=value;

  browserFrame.src=value;
}

browserGo.addEventListener(
  "click",
  navigateBrowser
);

browserURL.addEventListener(
  "keydown",
  function(event){

    if(event.key==="Enter"){
      navigateBrowser();
    }
  }
);

browserBack.addEventListener(
  "click",
  function(){

    try{
      browserFrame.contentWindow.history.back();
    }catch(e){}

  }
);

browserForward.addEventListener(
  "click",
  function(){

    try{
      browserFrame.contentWindow.history.forward();
    }catch(e){}

  }
);

browserClose.addEventListener(
  "click",
  function(){

    browserOverlay.classList.remove(
      "open"
    );

    browserFrame.src="about:blank";
  }
);

// ============================================================
// ANIMATIONS
// ============================================================

let animationTime=0;
let animationBlend=0;

function animateLeaves(delta,moving){

  if(!model) return;

  leafMeshes.forEach(
    (mesh,index)=>{

      const original=
        initialData.get(mesh);

      if(!original) return;

      const speed=
        .72+(index%7)*.085;

      const phase=index*.67;

      const t=
        animationTime*speed+phase;

      const wave1=Math.sin(t);
      const wave2=
        Math.sin(t*1.73+index);

      const wave3=
        Math.cos(t*.57+index*.4);

      const movement=
        (
          wave1*.62+
          wave2*.23+
          wave3*.15
        )*animationBlend;

      const side=
        index%2===0?1:-1;

      mesh.rotation.z=
        original.rotation.z+
        movement*.30*side;

      mesh.rotation.x=
        original.rotation.x+
        wave3*.15*animationBlend;

      mesh.rotation.y=
        original.rotation.y+
        wave2*.10*animationBlend;
    }
  );
}

function animateSunflower(
  delta,
  moving
){

  if(!model) return;

  const target=
    moving?1:0;

  animationBlend=
    THREE.MathUtils.lerp(
      animationBlend,
      target,
      Math.min(delta*7,1)
    );

  if(moving){
    animationTime+=delta*9.5;
  }

  const wave=
    Math.sin(animationTime);

  const bounce=
    Math.abs(wave)*.10*animationBlend;

  model.position.y=
    THREE.MathUtils.lerp(
      model.position.y,
      .22+bounce,
      Math.min(delta*13,1)
    );

  model.rotation.z=
    THREE.MathUtils.lerp(
      model.rotation.z,
      wave*.035*animationBlend,
      Math.min(delta*8,1)
    );

  animateLeaves(
    delta,
    moving
  );

  armMeshes.forEach(
    (mesh,index)=>{

      const original=
        initialData.get(mesh);

      if(!original) return;

      const side=
        index%2===0?1:-1;

      mesh.rotation.z=
        original.rotation.z+
        wave*.32*
        side*
        animationBlend;
    }
  );

  rootMeshes.forEach(
    (mesh,index)=>{

      const original=
        initialData.get(mesh);

      if(!original) return;

      const side=
        index%2===0?1:-1;

      mesh.rotation.z=
        original.rotation.z+
        Math.sin(
          animationTime+Math.PI
        )*.20*
        side*
        animationBlend;
    }
  );
}

// ============================================================
// GAME LOOP
// ============================================================

const clock=new THREE.Clock();

function animate(){

  requestAnimationFrame(animate);

  const delta=
    Math.min(
      clock.getDelta(),
      .05
    );

  // Cập nhật hoạt ảnh Pháo hoa
  if(fwIsActive){
    fwAnimTime += delta;
    fwMaterial.uniforms.uTime.value = fwAnimTime;
    if(fwAnimTime > FW_TOTAL_DURATION + 1.0){
      fwIsActive = false;
      fwParticles.visible = false;
    }
  }

  const moving=
    input.lengthSq()>.01;

  if(moving){

    const forward=
      new THREE.Vector3(
        0,
        0,
        -1
      );

    const right=
      new THREE.Vector3(
        1,
        0,
        0
      );

    forward.applyAxisAngle(
      new THREE.Vector3(0,1,0),
      cameraAngleY
    );

    right.applyAxisAngle(
      new THREE.Vector3(0,1,0),
      cameraAngleY
    );

    const movement=
      new THREE.Vector3();

    movement.addScaledVector(
      right,
      input.x
    );

    movement.addScaledVector(
      forward,
      input.y
    );

    if(movement.lengthSq()>0){

      movement.normalize();

      velocity.x=
        movement.x*moveSpeed;

      velocity.z=
        movement.z*moveSpeed;

      if(model){

        const targetRotation=
          Math.atan2(
            movement.x,
            movement.z
          );

        let difference=
          targetRotation-
          model.rotation.y;

        difference=
          Math.atan2(
            Math.sin(difference),
            Math.cos(difference)
          );

        model.rotation.y+=
          difference*
          Math.min(delta*10,1);
      }
    }

  }else{

    velocity.x=0;
    velocity.z=0;
  }

  animateSunflower(
    delta,
    moving
  );

  // ==========================================================
  // FLYING
  // ==========================================================

  if(isFlying){

    if(isJumpHolding){

      velocity.y=
        THREE.MathUtils.lerp(
          velocity.y,
          50,
          delta*5
        );

    }else{

      velocity.y=
        THREE.MathUtils.lerp(
          velocity.y,
          0,
          delta*3
        );
    }

  }else{

    velocity.y+=
      gravity*delta;
  }

  player.position.y+=
    velocity.y*delta;

  if(player.position.y<=0){

    player.position.y=0;

    velocity.y=0;

    grounded=true;

    if(isFlying){

      isFlying=false;

      jump.classList.remove(
        "flying"
      );

      moveSpeed=walkSpeed;
    }
  }

  player.position.x+=
    velocity.x*delta;

  player.position.z+=
    velocity.z*delta;

  cameraPivot.position.copy(
    player.position
  );

  cameraPivot.position.y+=1.6;

  updateCamera();

  renderer.render(
    scene,
    camera
  );
}

animate();

// ============================================================
// RESIZE
// ============================================================

function onResize(){

  const width=
    window.innerWidth;

  const height=
    window.innerHeight;

  camera.aspect=
    width/height;

  camera.updateProjectionMatrix();

  renderer.setSize(
    width,
    height
  );

  renderer.setPixelRatio(
    Math.min(
      window.devicePixelRatio,
      2
    )
  );
}

window.addEventListener(
  "resize",
  onResize
);

window.addEventListener(
  "orientationchange",
  function(){

    setTimeout(
      onResize,
      100
    );

  }
);

onResize();

// ============================================================
// SERVICE WORKER
// ============================================================

if("serviceWorker" in navigator){

  window.addEventListener(
    "load",
    ()=>{
      navigator.serviceWorker
        .register(
          "./service-worker.js"
        )
        .then(
          reg=>{
            console.log(
              "Service Worker đã đăng ký thành công!",
              reg
            );
          }
        )
        .catch(
          err=>{
            console.error(
              "Lỗi đăng ký Service Worker:",
              err
            );
          }
        );
    }
  );
}
