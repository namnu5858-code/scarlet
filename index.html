<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Realtime</title>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addfDoc, getDocs, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyD...",
          authDomain: "...",
          projectId: "...",
          storageBucket: "...",
          messagingSenderId: "...",
          appId: "..."
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.db = db;
        window.collection = collection;
        window.addDoc = addDoc;
        window.onSnapshot = onSnapshot;
        window.query = query;
        window.orderBy = orderBy;
    </script>
    <style>
        body { font-family: sans-serif; background: #121212; color: #fff; margin: 0; padding: 10px; display: flex; flex-direction: column; height: 95vh; box-sizing: border-box; }
        #chat-container { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding-bottom: 10px; }
        .message { background: #1f1f1f; padding: 8px 12px; border-radius: 12px; max-width: 80%; word-break: break-word; }
        .input-box { display: flex; gap: 8px; }
        input { flex: 1; background: #2a2a2a; border: none; padding: 10px; color: #fff; border-radius: 8px; outline: none; }
        button { background: #4e9f3d; color: #fff; border: none; padding: 10px 16px; border-radius: 8px; cursor: pointer; }
    </style>
</head>
<body>
    <div id="chat-container"></div>
    <div class="input-box">
        <input type="text" id="messageInput" placeholder="Nhập tin nhắn...">
        <button onclick="sendMessage()">Gửi</button>
    </div>

    <script>
        setTimeout(async () => {
            const q = window.query(window.collection(window.db, "messages"));
            window.onSnapshot(q, (snapshot) => {
                const container = document.getElementById("chat-container");
                container.innerHTML = "";
                snapshot.forEach((doc) => {
                    const data = doc.data();
                    const div = document.createElement("div");
                    div.className = "message";
                    div.innerText = data.text || "";
                    container.appendChild(div);
                });
                container.scrollTop = container.scrollHeight;
            });
        }, 1000);

        async function sendMessage() {
            const input = document.getElementById("messageInput");
            if (!input.value.trim()) return;
            try {
                await window.addDoc(window.collection(window.db, "messages"), {
                    text: input.value,
                    createdAt: new Date()
                });
                input.value = "";
            } catch (e) {
                console.error(e);
            }
        }
        window.sendMessage = sendMessage;
    </script>
</body>
</html>
