<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Widget Studio</title>
  <style>
    :root {
      --bg-app: #09090b;
      --bg-card: #141418;
      --bg-pill: rgba(58, 58, 62, 0.88);
      --bg-pill-hover: rgba(74, 74, 80, 0.95);
      --bg-sheet: #1b1b20;
      --text-main: #ffffff;
      --text-muted: rgba(255, 255, 255, 0.72);
      --accent-gold: #f5b400;
      --accent-blue: #3b82f6;
      --border-subtle: rgba(255, 255, 255, 0.12);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      min-height: 100vh;
      background: radial-gradient(circle at top, #1b1b24 0%, var(--bg-app) 65%);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
      overflow-x: hidden;
    }

    .phone-frame {
      width: 100%;
      max-width: 410px;
      background: #0e0e12;
      border: 1px solid var(--border-subtle);
      border-radius: 34px;
      padding: 18px 16px 22px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.65);
      position: relative;
      overflow: hidden;
    }

    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      padding: 0 4px;
    }

    .top-title {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -0.2px;
    }

    .top-btn {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 1px solid var(--border-subtle);
      background: rgba(255, 255, 255, 0.06);
      color: var(--text-main);
      display: grid;
      place-items: center;
      cursor: pointer;
      font-size: 14px;
    }

    .preview-stage {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 26px;
      background: linear-gradient(145deg, #24242c 0%, #17171d 55%, #111115 100%);
      border: 1px solid var(--border-subtle);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      user-select: none;
      touch-action: pan-y;
    }

    .preview-bg-image {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      transition: opacity 0.25s ease;
      pointer-events: none;
    }

    .preview-bg-image.active {
      opacity: 0.78;
    }

    .preview-scrim {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle, rgba(0,0,0,0.12) 0%, rgba(0,0,0,0.48) 100%);
      pointer-events: none;
    }

    .widget-slot {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 92px;
      transition: transform 0.2s ease, opacity 0.2s ease;
    }

    .caption-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--bg-pill);
      color: var(--text-main);
      border-radius: 999px;
      padding: 6px 14px;
      height: 30px;
      max-width: 280px;
      font-size: 13px;
      line-height: 1.2;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(12px);
      cursor: pointer;
    }

    .caption-input {
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-main);
      font-size: 13px;
      font-family: inherit;
      text-align: center;
      width: 135px;
      min-width: 72px;
    }

    .caption-input::placeholder {
      color: rgba(255, 255, 255, 0.78);
    }

    .rating-widget {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 7px;
    }

    .stars-row {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: var(--bg-pill);
      padding: 6px 12px;
      border-radius: 999px;
      backdrop-filter: blur(12px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
    }

    .star-btn {
      background: none;
      border: none;
      color: rgba(255, 255, 255, 0.35);
      font-size: 16px;
      line-height: 1;
      cursor: pointer;
      transition: transform 0.12s ease, color 0.12s ease;
    }

    .star-btn.active {
      color: var(--accent-gold);
    }

    .star-btn:hover {
      transform: scale(1.15);
    }

    .quote-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      background: var(--bg-pill);
      color: var(--text-main);
      border-radius: 999px;
      padding: 6px 14px;
      height: 30px;
      max-width: 285px;
      font-size: 13px;
      backdrop-filter: blur(12px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
    }

    .quote-mark {
      color: rgba(255, 255, 255, 0.72);
      font-weight: 700;
      font-size: 14px;
      user-select: none;
    }

    .quote-text-wrap {
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .quote-text-wrap::before,
    .quote-text-wrap::after {
      display: none;
    }

    .widget-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      background: var(--bg-pill);
      color: var(--text-main);
      border-radius: 999px;
      padding: 7px 15px;
      height: 32px;
      max-width: 290px;
      font-size: 13px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(12px);
      cursor: pointer;
      transition: background 0.15s ease, transform 0.15s ease;
    }

    .widget-pill:hover {
      background: var(--bg-pill-hover);
    }

    .widget-pill:active {
      transform: scale(0.97);
    }

    .widget-pill.streak {
      background: linear-gradient(135deg, #f59e0b 0%, #ea580c 100%);
      color: #fff;
      font-weight: 600;
    }

    .widget-pill.zodiac {
      background: linear-gradient(135deg, #9333ea 0%, #6d28d9 100%);
      color: #fff;
      font-weight: 600;
    }

    .dots {
      display: flex;
      justify-content: center;
      gap: 6px;
      margin: 14px 0 18px;
    }

    .dot {
      width: 6px;
      height: 6px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.25);
      border: none;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .dot.active {
      width: 18px;
      background: var(--text-main);
    }

    .controls-row {
      display: flex;
      align-items: center;
      justify-content: space-around;
      gap: 12px;
      margin-bottom: 14px;
    }

    .round-btn {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      border: 1px solid var(--border-subtle);
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-main);
      font-size: 20px;
      display: grid;
      place-items: center;
      cursor: pointer;
      transition: transform 0.15s ease, background 0.15s ease;
    }

    .round-btn:hover {
      background: rgba(255, 255, 255, 0.14);
    }

    .round-btn:active {
      transform: scale(0.94);
    }

    .round-btn.primary {
      width: 66px;
      height: 66px;
      background: var(--text-main);
      color: #09090b;
      font-size: 24px;
      font-weight: 700;
      box-shadow: 0 10px 28px rgba(255, 255, 255, 0.18);
    }

    .hint-text {
      text-align: center;
      font-size: 12px;
      color: var(--text-muted);
    }

    .sheet-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(6px);
      display: none;
      justify-content: center;
      align-items: flex-end;
      z-index: 50;
    }

    .sheet-backdrop.open {
      display: flex;
    }

    .sheet {
      width: 100%;
      max-width: 410px;
      max-height: 78vh;
      background: var(--bg-sheet);
      border-top-left-radius: 26px;
      border-top-right-radius: 26px;
      border: 1px solid var(--border-subtle);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .sheet-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .sheet-title {
      font-size: 15px;
      font-weight: 700;
    }

    .close-btn {
      background: rgba(255, 255, 255, 0.1);
      color: var(--text-main);
      border: none;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      cursor: pointer;
    }

    .search-input {
      width: 100%;
      padding: 11px 14px;
      border-radius: 14px;
      border: 1px solid var(--border-subtle);
      background: rgba(255, 255, 255, 0.06);
      color: var(--text-main);
      font-size: 14px;
      outline: none;
    }

    .place-list {
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding-bottom: 8px;
    }

    .place-item {
      text-align: left;
      padding: 11px 13px;
      border-radius: 12px;
      border: none;
      background: rgba(255, 255, 255, 0.04);
      color: var(--text-main);
      font-size: 14px;
      cursor: pointer;
    }

    .place-item:hover {
      background: rgba(255, 255, 255, 0.12);
    }

    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: rgba(34, 34, 42, 0.95);
      color: #fff;
      border: 1px solid var(--border-subtle);
      padding: 10px 16px;
      border-radius: 999px;
      font-size: 13px;
      opacity: 0;
      pointer-events: none;
      transition: all 0.22s ease;
      z-index: 100;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    input[type="file"] {
      display: none;
    }
  </style>
</head>
<body>
  <div class="phone-frame">
    <div class="top-bar">
      <button class="top-btn" id="btnUploadPhoto" title="Chọn ảnh nền">🖼️</button>
      <div class="top-title">Gửi đến...</div>
      <button class="top-btn" id="btnResetPhoto" title="Xoá ảnh nền">↺</button>
    </div>

    <input type="file" id="photoInput" accept="image/*" />

    <div class="preview-stage" id="previewStage">
      <img id="bgImage" class="preview-bg-image" alt="Ảnh nền xem trước" />
      <div class="preview-scrim"></div>
      <div class="widget-slot" id="widgetSlot"></div>
    </div>

    <div class="dots" id="dots"></div>

    <div class="controls-row">
      <button class="round-btn" id="btnPrev" title="Widget trước">✕</button>
      <button class="round-btn primary" id="btnAction" title="Áp dụng / Gửi">➤</button>
      <button class="round-btn" id="btnNext" title="Widget tiếp theo">Aa</button>
    </div>

    <p class="hint-text" id="hintText">Vuốt ngang hoặc bấm Aa / ✕ để đổi widget</p>
  </div>

  <div class="sheet-backdrop" id="locationSheet">
    <div class="sheet">
      <div class="sheet-header">
        <div class="sheet-title">Chọn vị trí</div>
        <button class="close-btn" id="closeSheet">✕</button>
      </div>
      <input type="text" class="search-input" id="locationSearch" placeholder="Tìm kiếm địa điểm..." />
      <div class="place-list" id="placeList"></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const PLACES = [
      "X. Quảng Oai, Thành Phố Hà Nội",
      "Nhà Hàng Quý Thơm",
      "Văn Vương Động Viên Quán",
      "Nhà hàng Sơn Lộc",
      "Dê Núi Sơn Lộc CS1",
      "Tạp hoá Phương Danh",
      "Đại Lý Sữa Việt Anh",
      "Sữa Minh Long",
      "Thịt Chó Kiểu Phú",
      "Cua Hang Minh Giang",
      "Quán sữa Phương Nghiên",
      "Tấn Oanh phở bún",
      "Huy Hoàng Quán: Bia - Lẩu - Nướng",
      "Quán Cơm Bình Dân Phúc Béo",
      "Tương ngon Bà Nguyệt",
      "Quán Bia Hải Xóm"
    ];

    const state = {
      index: 0,
      captionText: "",
      rating: 5,
      reviewText: "",
      location: "X. Quảng Oai",
      streakDays: 1,
      zodiac: "♐ Mùa Nhân Mã",
      weatherText: "🌤️ Bấm để lấy thời tiết",
      timeText: ""
    };

    const WIDGET_COUNT = 6;
    const widgetSlot = document.getElementById("widgetSlot");
    const dotsEl = document.getElementById("dots");
    const hintText = document.getElementById("hintText");
    const previewStage = document.getElementById("previewStage");
    const bgImage = document.getElementById("bgImage");
    const photoInput = document.getElementById("photoInput");
    const locationSheet = document.getElementById("locationSheet");
    const locationSearch = document.getElementById("locationSearch");
    const placeList = document.getElementById("placeList");
    const toastEl = document.getElementById("toast");

    function showToast(msg) {
      toastEl.textContent = msg;
      toastEl.classList.add("show");
      clearTimeout(showToast._t);
      showToast._t = setTimeout(() => toastEl.classList.remove("show"), 2000);
    }

    function formatCurrentTime() {
      const now = new Date();
      const hh = String(now.getHours()).padStart(2, "0");
      const mm = String(now.getMinutes()).padStart(2, "0");
      return `${hh}:${mm}`;
    }

    function updateClockWidget() {
      state.timeText = formatCurrentTime();
      const timeSpan = document.getElementById("liveClockText");
      if (timeSpan) {
        timeSpan.textContent = state.timeText;
      }
    }

    function renderDots() {
      dotsEl.innerHTML = "";
      for (let i = 0; i < WIDGET_COUNT; i++) {
        const dot = document.createElement("button");
        dot.className = "dot" + (i === state.index ? " active" : "");
        dot.setAttribute("aria-label", `Widget ${i + 1}`);
        dot.addEventListener("click", () => {
          state.index = i;
          renderWidget();
        });
        dotsEl.appendChild(dot);
      }
    }

    function renderWidget() {
      renderDots();
      widgetSlot.innerHTML = "";

      if (state.index === 0) {
        hintText.textContent = "Chạm vào khung để nhập tin nhắn ngắn gọn";
        const pill = document.createElement("div");
        pill.className = "caption-pill";

        const input = document.createElement("input");
        input.type = "text";
        input.className = "caption-input";
        input.placeholder = "Thêm một tin nhắn";
        input.value = state.captionText;
        input.maxLength = 32;
        input.addEventListener("input", (e) => {
          state.captionText = e.target.value;
        });

        pill.appendChild(input);
        widgetSlot.appendChild(pill);
      } else if (state.index === 1) {
        hintText.textContent = "Chọn số sao và nhập đánh giá trong khung ngoặc kép";
        const wrap = document.createElement("div");
        wrap.className = "rating-widget";

        const starsRow = document.createElement("div");
        starsRow.className = "stars-row";
        for (let s = 1; s <= 5; s++) {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "star-btn" + (s <= state.rating ? " active" : "");
          btn.textContent = "★";
          btn.addEventListener("click", () => {
            state.rating = s;
            renderWidget();
          });
          starsRow.appendChild(btn);
        }

        const quotePill = document.createElement("div");
        quotePill.className = "quote-pill";

        const openQ = document.createElement("span");
        openQ.className = "quote-mark";
        openQ.textContent = "“";

        const textWrap = document.createElement("span");
        textWrap.className = "quote-text-wrap";

        const input = document.createElement("input");
        input.type = "text";
        input.className = "caption-input";
        input.placeholder = "Viết đánh giá...";
        input.value = state.reviewText;
        input.maxLength = 28;
        input.addEventListener("input", (e) => {
          state.reviewText = e.target.value;
        });

        const closeQ = document.createElement("span");
        closeQ.className = "quote-mark";
        closeQ.textContent = "”";

        textWrap.appendChild(input);
        quotePill.appendChild(openQ);
        quotePill.appendChild(textWrap);
        quotePill.appendChild(closeQ);

        wrap.appendChild(starsRow);
        wrap.appendChild(quotePill);
        widgetSlot.appendChild(wrap);
      } else if (state.index === 2) {
        hintText.textContent = "Bấm vào khung vị trí để tìm kiếm và chọn địa điểm";
        const pill = document.createElement("div");
        pill.className = "widget-pill";
        pill.innerHTML = `<span>📍</span><span id="locationLabel">${state.location}</span>`;
        pill.addEventListener("click", openLocationSheet);
        widgetSlot.appendChild(pill);
      } else if (state.index === 3) {
        hintText.textContent = "Bấm vào huy hiệu chuỗi để tăng ngày";
        const pill = document.createElement("div");
        pill.className = "widget-pill streak";
        pill.innerHTML = `<span>🔥</span><span id="streakLabel">${state.streakDays}</span>`;
        pill.addEventListener("click", () => {
          state.streakDays += 1;
          renderWidget();
        });
        widgetSlot.appendChild(pill);
      } else if (state.index === 4) {
        hintText.textContent = "Widget cung hoàng đạo hiện tại";
        const pill = document.createElement("div");
        pill.className = "widget-pill zodiac";
        pill.textContent = state.zodiac;
        widgetSlot.appendChild(pill);
      } else if (state.index === 5) {
        hintText.textContent = "Giờ thực tế tự cập nhật & bấm để lấy thời tiết vị trí";
        const clockPill = document.createElement("div");
        clockPill.className = "widget-pill";
        clockPill.innerHTML = `<span>🕒</span><span id="liveClockText">${formatCurrentTime()}</span>`;

        const weatherPill = document.createElement("div");
        weatherPill.className = "widget-pill";
        weatherPill.innerHTML = `<span id="weatherLabel">${state.weatherText}</span>`;
        weatherPill.addEventListener("click", fetchWeatherByGeolocation);

        widgetSlot.appendChild(clockPill);
        widgetSlot.appendChild(weatherPill);
      }
    }

    function weatherCodeToText(code) {
      if (code === 0) return "☀️ Trời quang";
      if ([1, 2].includes(code)) return "🌤️ Ít mây";
      if (code === 3) return "☁️ Nhiều mây";
      if ([45, 48].includes(code)) return "🌫️ Có sương mù";
      if ([51, 53, 55, 61, 63, 80].includes(code)) return "🌧️ Có mưa";
      if ([95, 96, 99].includes(code)) return "⛈️ Có dông";
      return "🌡️ Thời tiết ổn định";
    }

    async function fetchWeatherByGeolocation() {
      if (!navigator.geolocation) {
        state.weatherText = "🌤️ 26°C · Hà Nội";
        renderWidget();
        showToast("Thiết bị không hỗ trợ định vị, dùng mặc định");
        return;
      }

      state.weatherText = "⏳ Đang xin quyền vị trí...";
      renderWidget();

      navigator.geolocation.getCurrentPosition(
        async (pos) => {
          try {
            const { latitude, longitude } = pos.coords;
            const url = `https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&current=temperature_2m,weather_code`;
            const res = await fetch(url);
            const data = await res.json();
            const temp = Math.round(data.current.temperature_2m);
            const desc = weatherCodeToText(data.current.weather_code);
            state.weatherText = `${desc} · ${temp}°C`;
            renderWidget();
          } catch {
            state.weatherText = "🌤️ 26°C · Địa phương";
            renderWidget();
            showToast("Không tải được dữ liệu thời tiết");
          }
        },
        () => {
          state.weatherText = "🌤️ 26°C · Chưa cấp quyền";
          renderWidget();
          showToast("Bạn đã từ chối hoặc chưa cấp quyền vị trí");
        },
        { enableHighAccuracy: true, timeout: 8000 }
      );
    }

    function renderPlaces(filter = "") {
      const q = filter.trim().toLowerCase();
      const filtered = PLACES.filter((p) => p.toLowerCase().includes(q));
      placeList.innerHTML = "";
      filtered.forEach((place) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "place-item";
        btn.textContent = place;
        btn.addEventListener("click", () => {
          state.location = place;
          closeLocationSheet();
          renderWidget();
          showToast("Đã chọn vị trí");
        });
        placeList.appendChild(btn);
      });
    }

    function openLocationSheet() {
      locationSearch.value = "";
      renderPlaces("");
      locationSheet.classList.add("open");
      setTimeout(() => locationSearch.focus(), 50);
    }

    function closeLocationSheet() {
      locationSheet.classList.remove("open");
    }

    locationSearch.addEventListener("input", (e) => {
      renderPlaces(e.target.value);
    });

    document.getElementById("closeSheet").addEventListener("click", closeLocationSheet);
    locationSheet.addEventListener("click", (e) => {
      if (e.target === locationSheet) closeLocationSheet();
    });

    document.getElementById("btnNext").addEventListener("click", () => {
      state.index = (state.index + 1) % WIDGET_COUNT;
      renderWidget();
    });

    document.getElementById("btnPrev").addEventListener("click", () => {
      state.index = (state.index - 1 + WIDGET_COUNT) % WIDGET_COUNT;
      renderWidget();
    });

    document.getElementById("btnAction").addEventListener("click", () => {
      showToast("Đã lưu cấu hình widget hiện tại");
    });

    document.getElementById("btnUploadPhoto").addEventListener("click", () => {
      photoInput.click();
    });

    photoInput.addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        bgImage.src = reader.result;
        bgImage.classList.add("active");
      };
      reader.readAsDataURL(file);
    });

    document.getElementById("btnResetPhoto").addEventListener("click", () => {
      bgImage.removeAttribute("src");
      bgImage.classList.remove("active");
      photoInput.value = "";
      showToast("Đã xoá ảnh nền");
    });

    let touchStartX = 0;
    previewStage.addEventListener("touchstart", (e) => {
      touchStartX = e.changedTouches[0].screenX;
    }, { passive: true });

    previewStage.addEventListener("touchend", (e) => {
      const deltaX = e.changedTouches[0].screenX - touchStartX;
      if (Math.abs(deltaX) > 45) {
        if (deltaX < 0) {
          state.index = (state.index + 1) % WIDGET_COUNT;
        } else {
          state.index = (state.index - 1 + WIDGET_COUNT) % WIDGET_COUNT;
        }
        renderWidget();
      }
    }, { passive: true });

    updateClockWidget();
    setInterval(updateClockWidget, 1000);
    renderWidget();
  </script>
</body>
</html>
