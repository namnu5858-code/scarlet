
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Modern User Note</title>
  <style>
    :root {
      --bg: #09090b;
      --card-bg: rgba(255, 255, 255, 0.05);
      --glass-border: rgba(255, 255, 255, 0.12);
      --accent-gradient: linear-gradient(135deg, #6366f1, #a855f7, #ec4899);
      --text-main: #f4f4f5;
      --text-sub: #a1a1aa;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text-main); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }

    /* Container Ghi chú cá nhân */
    .user-note-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      cursor: pointer;
      user-select: none;
    }

    /* Bong bóng suy nghĩ Glassmorphism */
    .note-bubble {
      position: relative;
      margin-bottom: 12px;
      padding: 10px 16px;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-main);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      animation: float 4s ease-in-out infinite;
      max-width: 180px;
      text-align: center;
      word-break: break-word;
      transition: all 0.3s ease;
    }

    .note-bubble:hover {
      transform: scale(1.05);
      background: rgba(255, 255, 255, 0.12);
    }

    /* Đuôi bong bóng */
    .note-bubble::after {
      content: '';
      position: absolute;
      bottom: -6px;
      left: 50%;
      transform: translateX(-50%);
      width: 10px;
      height: 10px;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(16px);
      border-right: 1px solid var(--glass-border);
      border-bottom: 1px solid var(--glass-border);
      rotate: 45deg;
    }

    /* Khung Avatar có viền Gradient */
    .avatar-container {
      position: relative;
      width: 76px;
      height: 76px;
      padding: 3px;
      border-radius: 50%;
      background: var(--accent-gradient);
      box-shadow: 0 0 20px rgba(168, 85, 247, 0.3);
      transition: transform 0.3s ease;
    }

    .user-note-wrapper:hover .avatar-container {
      transform: scale(1.03);
    }

    .avatar-img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--bg);
    }

    /* Badge biểu tượng trạng thái */
    .status-badge {
      position: absolute;
      bottom: 2px;
      right: 2px;
      width: 22px;
      height: 22px;
      background: #18181b;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid var(--bg);
      color: var(--text-main);
      font-size: 12px;
      font-weight: bold;
    }

    .user-title {
      margin-top: 8px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-sub);
    }

    /* Modal Chỉnh Sửa */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      z-index: 100;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-box {
      width: 90%;
      max-width: 340px;
      background: #18181b;
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      padding: 24px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
      transform: translateY(20px);
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .modal-overlay.active .modal-box {
      transform: translateY(0);
    }

    .modal-title {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 14px;
      text-align: center;
    }

    .modal-input {
      width: 100%;
      padding: 12px 16px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--glass-border);
      border-radius: 14px;
      color: var(--text-main);
      font-size: 14px;
      outline: none;
      margin-bottom: 16px;
      transition: border-color 0.2s;
    }

    .modal-input:focus {
      border-color: #a855f7;
    }

    .modal-actions {
      display: flex;
      gap: 10px;
    }

    .btn {
      flex: 1;
      padding: 10px;
      border-radius: 12px;
      border: none;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .btn-save { background: var(--accent-gradient); color: #fff; }
    .btn-delete { background: rgba(239, 68, 68, 0.2); color: #ef4444; border: 1px solid rgba(239, 68, 68, 0.3); }
    .btn-cancel { background: transparent; color: var(--text-sub); }
    .btn:hover { opacity: 0.85; }

    /* Hiệu ứng bay bổng nhẹ */
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }
  </style>
</head>
<body>

  <!-- Khung Ghi chú của chính bạn -->
  <div class="user-note-wrapper" onclick="openModal()">
    <div class="note-bubble" id="noteBubble">
      <span id="noteTextDisplay">Tạo ghi chú...</span>
    </div>

    <div class="avatar-container">
      <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=200&q=80" alt="Avatar" class="avatar-img" />
      <div class="status-badge" id="statusIcon">+</div>
    </div>

    <span class="user-title">Ghi chú của bạn</span>
  </div>

  <!-- Modal nhập liệu -->
  <div class="modal-overlay" id="noteModal" onclick="closeModalOnOverlay(event)">
    <div class="modal-box">
      <div class="modal-title">Suy nghĩ của bạn</div>
      <input type="text" id="noteInput" class="modal-input" placeholder="Chia sẻ điều gì đó..." maxlength="60" autocomplete="off" />
      
      <div class="modal-actions">
        <button class="btn btn-cancel" onclick="closeModal()">Hủy</button>
        <button class="btn btn-delete" id="btnDelete" onclick="deleteNote()" style="display:none;">Xóa</button>
        <button class="btn btn-save" onclick="saveNote()">Đăng</button>
      </div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'scarlet_single_user_note';

    // Khởi tạo & Tải dữ liệu thật từ bộ nhớ trình duyệt
    document.addEventListener('DOMContentLoaded', loadNote);

    function loadNote() {
      const savedNote = localStorage.getItem(STORAGE_KEY);
      const textDisplay = document.getElementById('noteTextDisplay');
      const statusIcon = document.getElementById('statusIcon');
      const btnDelete = document.getElementById('btnDelete');

      if (savedNote && savedNote.trim() !== '') {
        textDisplay.innerText = savedNote;
        statusIcon.innerText = '✨';
        btnDelete.style.display = 'block';
      } else {
        textDisplay.innerText = 'Tạo ghi chú...';
        statusIcon.innerText = '+';
        btnDelete.style.display = 'none';
      }
    }

    function openModal() {
      const savedNote = localStorage.getItem(STORAGE_KEY) || '';
      document.getElementById('noteInput').value = savedNote;
      document.getElementById('noteModal').classList.add('active');
      setTimeout(() => document.getElementById('noteInput').focus(), 100);
    }

    function closeModal() {
      document.getElementById('noteModal').classList.remove('active');
    }

    function closeModalOnOverlay(e) {
      if (e.target.id === 'noteModal') closeModal();
    }

    function saveNote() {
      const text = document.getElementById('noteInput').value.trim();
      if (text) {
        localStorage.setItem(STORAGE_KEY, text);
      } else {
        localStorage.removeItem(STORAGE_KEY);
      }
      loadNote();
      closeModal();
    }

    function deleteNote() {
      localStorage.removeItem(STORAGE_KEY);
      document.getElementById('noteInput').value = '';
      loadNote();
      closeModal();
    }
  </script>
</body>
</html>
