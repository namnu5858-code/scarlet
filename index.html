<style>
*{
  box-sizing:border-box;
  -webkit-user-select:none;
  user-select:none;
  -webkit-touch-callout:none;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#050814;
  touch-action:none;
  font-family:Arial,sans-serif;
}

#game-container{
  position:fixed;
  top:0;
  left:0;
  width:100vw;
  height:100vh;
  z-index:1;
}

canvas{
  display:block;
  width:100vw !important;
  height:100vh !important;
}

.glass-ui{
  background:rgba(255,255,255,.18);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  border:1px solid rgba(255,255,255,.4);
  box-shadow:0 8px 32px rgba(0,0,0,.18);
}

#joystick-wrapper{
  position:absolute;
  left:32px;
  bottom:32px;
  width:120px;
  height:120px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:20;
  touch-action:none;
}

#joystick-stick{
  position:absolute;
  width:52px;
  height:52px;
  border-radius:50%;
  background:rgba(255,255,255,.58);
  border:1px solid rgba(255,255,255,.85);
  box-shadow:0 4px 14px rgba(0,0,0,.18);
  pointer-events:none;
}

#jump-btn{
  position:absolute;
  right:32px;
  bottom:38px;
  width:72px;
  height:72px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:20;
  touch-action:none;
  transition:background .3s ease,transform .1s ease;
}

#jump-btn.flying{
  background:rgba(255,215,0,.55);
  border-color:rgba(255,255,255,.9);
  box-shadow:0 0 15px rgba(255,215,0,.6);
}

#jump-btn:active{
  transform:scale(.94);
}

#jump-btn svg{
  width:34px;
  height:34px;
  fill:none;
  stroke:white;
  stroke-width:2.5;
  stroke-linecap:round;
  stroke-linejoin:round;
}

#loading{
  position:absolute;
  top:14px;
  right:16px;
  padding:8px 14px;
  border-radius:10px;
  background:rgba(0,0,0,.6);
  color:white;
  font-size:12px;
  z-index:30;
  pointer-events:none;
}

#audio-hint{
  position:absolute;
  top:14px;
  left:16px;
  padding:8px 14px;
  border-radius:10px;
  background:rgba(255,165,0,.8);
  color:black;
  font-weight:bold;
  font-size:12px;
  z-index:30;
  pointer-events:none;
  animation: pulse 1.5s infinite;
}

@keyframes pulse {
  0% { opacity: 0.6; }
  50% { opacity: 1; }
  100% { opacity: 0.6; }
}

#screen-hint{
  position:absolute;
  left:50%;
  top:18px;
  transform:translateX(-50%);
  padding:9px 15px;
  border-radius:12px;
  background:rgba(0,0,0,.7);
  color:white;
  font-size:13px;
  z-index:25;
  pointer-events:none;
  opacity:0;
  transition:opacity .25s ease;
}

#screen-hint.show{
  opacity:1;
}

#browser-overlay{
  position:fixed;
  inset:0;
  z-index:100;
  display:none;
  background:rgba(0,0,0,.88);
  padding:
    max(10px,env(safe-area-inset-top))
    max(8px,env(safe-area-inset-right))
    max(10px,env(safe-area-inset-bottom))
    max(8px,env(safe-area-inset-left));
}

#browser-overlay.open{
  display:flex;
  flex-direction:column;
}

#browser-bar{
  width:100%;
  min-height:52px;
  display:flex;
  align-items:center;
  gap:7px;
  padding:6px;
  border-radius:14px;
  background:rgba(35,35,35,.96);
}

.browser-btn{
  width:38px;
  height:38px;
  flex:0 0 38px;
  border:0;
  border-radius:10px;
  background:#444;
  color:white;
  font-size:18px;
  touch-action:manipulation;
}

#browser-url{
  flex:1;
  min-width:0;
  height:38px;
  border:0;
  outline:none;
  border-radius:10px;
  padding:0 12px;
  background:#fff;
  color:#111;
  font-size:15px;
  -webkit-user-select:text;
  user-select:text;
}

#browser-frame-wrap{
  position:relative;
  flex:1;
  min-height:0;
  margin-top:7px;
  overflow:hidden;
  border-radius:14px;
  background:white;
}

#browser-frame{
  width:100%;
  height:100%;
  border:0;
  background:white;
}

#browser-warning{
  position:absolute;
  left:12px;
  right:12px;
  bottom:12px;
  padding:10px 12px;
  border-radius:10px;
  background:rgba(0,0,0,.75);
  color:white;
  font-size:12px;
  line-height:1.4;
  pointer-events:none;
  opacity:.85;
}
</style>

<script type="module">

import * as THREE from "three";
import {GLTFLoader} from "three/addons/loaders/GLTFLoader.js";

// ============================================================
// AUDIO SYNTHESIZER (PHÁO HOA ÂM THANH)
// ============================================================
let audioCtx = null;

function initAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const hint = document.getElementById("audio-hint");
    if(hint) hint.style.display = "none";
  }
}

window.addEventListener("pointerdown", initAudio, { once: true });
window.addEventListener("touchstart", initAudio, { once: true });

function playExplosionSound() {
  if (!audioCtx) return;
  
  // tiếng nổ trầm (low boom)
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  
  osc.type = 'triangle';
  osc.frequency.setValueAtTime(120, audioCtx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.8);
  
  gain.gain.setValueAtTime(1, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.8);
  
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  
  osc.start();
  osc.stop(audioCtx.currentTime + 0.8);

  // Tiếng nổ giòn (noise crackle)
  const bufferSize = audioCtx.sampleRate * 0.5;
  const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i = 0; i < bufferSize; i++) {
    data[i] = Math.random() * 2 - 1;
  }

  const noise = audioCtx.createBufferSource();
  noise.buffer = buffer;

  const noiseFilter = audioCtx.createBiquadFilter();
  noiseFilter.type = 'bandpass';
  noiseFilter.frequency.value = 1000;

  const noiseGain = audioCtx.createGain();
  noiseGain.gain.setValueAtTime(0.6, audioCtx.currentTime);
  noiseGain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);

  noise.connect(noiseFilter);
  noiseFilter.connect(noiseGain);
  noiseGain.connect(audioCtx.destination);

  noise.start();
  noise.stop(audioCtx.currentTime + 0.5);
}

// ============================================================
// SCENE & RENDERER (ĐÊM LUNG LINH SẮC NÉarray)
// ============================================================

const container=document.getElementById("game-container");
const loading=document.getElementById("loading");

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x060919);
scene.fog=new THREE.FogExp2(0x0a0f24, 0.0015);

const cameraPivot=new THREE.Object3D();
scene.add(cameraPivot);

const camera=new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 3000);
cameraPivot.add(camera);

let cameraDistance=12;
let targetCameraDistance=12;
let cameraAngleX=0.2;
let cameraAngleY=0;
let targetCameraAngleX=0.2;
let targetCameraAngleY=0;

const renderer=new THREE.WebGLRenderer({
  antialias:true,
  powerPreference:"high-performance"
});

renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.2;

container.appendChild(renderer.domElement);

// Tạo bầu trời sao
const starsGeo = new THREE.BufferGeometry();
const starsCount = 1500;
const starPos = new Float32Array(starsCount * 3);
for(let i=0; i<starsCount*3; i+=3){
  starPos[i] = (Math.random() - 0.5) * 1000;
  starPos[i+1] = Math.random() * 400 + 50;
  starPos[i+2] = (Math.random() - 0.5) * 1000;
}
starsGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
const starsMat = new THREE.PointsMaterial({color: 0xffffff, size: 1.2, transparent: true, opacity: 0.8});
const starField = new THREE.Points(starsGeo, starsMat);
scene.add(starField);

// ============================================================
// CAMERA COLLISION
// ============================================================

const raycaster=new THREE.Raycaster();
const cameraCollisionObjects=[];

function updateCamera(){
  cameraAngleY=THREE.MathUtils.lerp(cameraAngleY, targetCameraAngleY, 0.18);
  cameraAngleX=THREE.MathUtils.lerp(cameraAngleX, targetCameraAngleX, 0.18);
  cameraDistance=THREE.MathUtils.lerp(cameraDistance, targetCameraDistance, 0.12);

  cameraPivot.rotation.y=cameraAngleY;
  cameraPivot.rotation.x=cameraAngleX;

  const origin=cameraPivot.position.clone();
  const dir=new THREE.Vector3(0,0,1).applyQuaternion(cameraPivot.quaternion);
  raycaster.set(origin,dir);

  let actualDistance=cameraDistance;
  if(cameraCollisionObjects.length>0){
    const hits=raycaster.intersectObjects(cameraCollisionObjects, true);
    if(hits.length>0 && hits[0].distance<cameraDistance){
      actualDistance=Math.max(hits[0].distance-0.3, 0.5);
    }
  }
  camera.position.set(0, 0, actualDistance);
  camera.lookAt(cameraPivot.position);
}

// ============================================================
// LIGHTING
// ============================================================

const hemisphere=new THREE.HemisphereLight(0x3a4b6e, 0x111622, 1.2);
scene.add(hemisphere);

const moonLight=new THREE.DirectionalLight(0x9bb5ff, 1.5);
moonLight.position.set(100,150,80);
moonLight.castShadow=true;
moonLight.shadow.mapSize.width=2048;
moonLight.shadow.mapSize.height=2048;
moonLight.shadow.camera.near=1;
moonLight.shadow.camera.far=400;
moonLight.shadow.camera.left=-250;
moonLight.shadow.camera.right=250;
moonLight.shadow.camera.top=250;
moonLight.shadow.camera.bottom=-250;
moonLight.shadow.bias=-0.0003;
scene.add(moonLight);

// ============================================================
// MATERIALS
// ============================================================

const MAT={};
MAT.redTile=new THREE.MeshStandardMaterial({color:0x853b30, roughness:.7});
MAT.lightBlue=new THREE.MeshStandardMaterial({color:0x5e8b9b, roughness:.6});
MAT.white=new THREE.MeshStandardMaterial({color:0xd0d5db, roughness:.7});
MAT.yellow=new THREE.MeshStandardMaterial({color:0xc4ad45, roughness:.8});
MAT.darkMetal=new THREE.MeshStandardMaterial({color:0x222729, roughness:.5, metalness:.7});
MAT.steel=new THREE.MeshStandardMaterial({color:0x889296, roughness:.3, metalness:.8});
MAT.roofMetal=new THREE.MeshStandardMaterial({color:0x495558, roughness:.6, metalness:.5});
MAT.glass=new THREE.MeshPhysicalMaterial({color:0x88d5ec, roughness:.1, metalness:.2, transparent:true, opacity:.75});
MAT.concrete=new THREE.MeshStandardMaterial({color:0x8a8c88, roughness:.9});

// ============================================================
// HELPER & CAMPUS
// ============================================================

function box(w, h, d, x, y, z, material, parent=scene){
  const mesh=new THREE.Mesh(new THREE.BoxGeometry(w,h,d), material);
  mesh.position.set(x,y,z);
  mesh.castShadow=true;
  mesh.receiveShadow=true;
  parent.add(mesh);
  return mesh;
}

const campus=new THREE.Group();
scene.add(campus);

const CAMPUS_W=260;
const CAMPUS_D=210;

const baseGround=box(2500, 1, 2500, 0, -0.7, 0, new THREE.MeshStandardMaterial({color:0x2a4e23, roughness:1}), campus);
cameraCollisionObjects.push(baseGround);

const courtyard=box(240, .45, 190, 0, 0, 0, MAT.redTile, campus);
cameraCollisionObjects.push(courtyard);

const tileLineMaterial=new THREE.MeshStandardMaterial({color:0x4a201c, roughness:.9});
for(let x=-120;x<=120;x+=6){ box(.12, .03, 190, x, .235, 0, tileLineMaterial, campus); }
for(let z=-95;z<=95;z+=6){ box(240, .03, .12, 0, .235, z, tileLineMaterial, campus); }

// ============================================================
// FENCE & BUILDINGS
// ============================================================

function createFenceX(z){
  box(CAMPUS_W, 2, 1, 0, 1, z, MAT.yellow, campus);
  for(let x=-130;x<=130;x+=4){ box(.16, 2.5, .16, x, 2.25, z, MAT.darkMetal, campus); }
  box(CAMPUS_W, .16, .16, 0, 3.4, z, MAT.darkMetal, campus);
  box(CAMPUS_W, .16, .16, 0, 2.35, z, MAT.darkMetal, campus);
}

function createFenceZ(x){
  box(1, 2, CAMPUS_D, x, 1, 0, MAT.yellow, campus);
  for(let z=-105;z<=105;z+=4){ box(.16, 2.5, .16, x, 2.25, z, MAT.darkMetal, campus); }
  box(.16, .16, CAMPUS_D, x, 3.4, 0, MAT.darkMetal, campus);
}

createFenceX(-105); createFenceX(105);
createFenceZ(-130); createFenceZ(130);

// Building A
const buildingA=new THREE.Group(); campus.add(buildingA);
const bA=box(145, 16, 17, -45, 8, -55, MAT.lightBlue, buildingA);
cameraCollisionObjects.push(bA);
box(145, 1.2, 17.5, -45, .6, -55, MAT.white, buildingA);
for(let y=4;y<16;y+=4){ box(145, .22, 17.5, -45, y, -55, MAT.white, buildingA); }

// Building B
const buildingB=new THREE.Group(); campus.add(buildingB);
const bB=box(70, 16, 30, 75, 8, -10, MAT.lightBlue, buildingB);
cameraCollisionObjects.push(bB);

// Parking
const parking=new THREE.Group(); campus.add(parking);
box(150, .5, 30, -5, .25, 72, MAT.concrete, parking);
box(155, .7, 34, -5, 7.5, 72, MAT.roofMetal, parking);

// ============================================================
// HỆ THỐNG PHÁO HOA XUNG QUANH NGOÀI KHUÔN VIÊN (FIREWORKS OUTSIDE)
// ============================================================

const fireworks = [];
const fwColors = [0xff2255, 0x00ffcc, 0xffdd22, 0xff00ff, 0x3388ff, 0xff7700, 0xffffff];

class FireworkRocket {
  constructor() {
    this.reset();
  }

  reset() {
    // Vị trí xuất phát BÊN NGOÀI tường rào (X ngoài [-130, 130], Z ngoài [-105, 105])
    const side = Math.floor(Math.random() * 4);
    let x = 0, z = 0;
    if (side === 0) { x = (Math.random() - 0.5) * 360; z = 135 + Math.random() * 50; }       // Nam
    else if (side === 1) { x = (Math.random() - 0.5) * 360; z = -135 - Math.random() * 50; }     // Bắc
    else if (side === 2) { x = 150 + Math.random() * 50; z = (Math.random() - 0.5) * 300; }     // Đông
    else { x = -150 - Math.random() * 50; z = (Math.random() - 0.5) * 300; }                // Tây

    this.position = new THREE.Vector3(x, 0, z);
    this.targetY = 40 + Math.random() * 40;
    this.velocity = new THREE.Vector3((Math.random() - 0.5) * 4, 35 + Math.random() * 15, (Math.random() - 0.5) * 4);
    this.color = fwColors[Math.floor(Math.random() * fwColors.length)];
    this.exploded = false;
    this.dead = false;

    // Vệt sáng quả tên lửa
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute([0, 0, 0], 3));
    const mat = new THREE.PointsMaterial({ color: 0xffffff, size: 3, transparent: true });
    this.rocketPoints = new THREE.Points(geo, mat);
    this.rocketPoints.position.copy(this.position);
    scene.add(this.rocketPoints);
  }

  update(delta) {
    if (!this.exploded) {
      this.position.addScaledVector(this.velocity, delta);
      this.rocketPoints.position.copy(this.position);

      if (this.position.y >= this.targetY || this.velocity.y <= 0) {
        this.explode();
      }
    } else if (this.particles) {
      const pos = this.particles.geometry.attributes.position.array;
      for (let i = 0; i < this.particleCount; i++) {
        const idx = i * 3;
        pos[idx] += this.particleVelocities[idx] * delta;
        pos[idx+1] += this.particleVelocities[idx+1] * delta - 9.8 * delta; // Trọng lực nhẹ
        pos[idx+2] += this.particleVelocities[idx+2] * delta;
      }
      this.particles.geometry.attributes.position.needsUpdate = true;

      this.particleMat.opacity -= delta * 0.5;
      if (this.particleMat.opacity <= 0) {
        this.destroy();
      }
    }
  }

  explode() {
    this.exploded = true;
    scene.remove(this.rocketPoints);
    playExplosionSound();

    this.particleCount = 120;
    const pos = new Float32Array(this.particleCount * 3);
    this.particleVelocities = [];

    for (let i = 0; i < this.particleCount; i++) {
      pos[i*3] = this.position.x;
      pos[i*3+1] = this.position.y;
      pos[i*3+2] = this.position.z;

      // Nổ hình cầu rộng tỏa khắp xung quanh
      const theta = Math.random() * Math.PI * 2;
      const phi = Math.random() * Math.PI;
      const speed = 15 + Math.random() * 25;

      this.particleVelocities.push(
        speed * Math.sin(phi) * Math.cos(theta),
        speed * Math.cos(phi),
        speed * Math.sin(phi) * Math.sin(theta)
      );
    }

    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));

    this.particleMat = new THREE.PointsMaterial({
      color: this.color,
      size: 2.8,
      transparent: true,
      opacity: 1.0,
      blending: THREE.AdditiveBlending
    });

    this.particles = new THREE.Points(geo, this.particleMat);
    scene.add(this.particles);

    // Đèn chớp ánh sáng nhấp nháy khi nổ
    const light = new THREE.PointLight(this.color, 10, 100);
    light.position.copy(this.position);
    scene.add(light);
    setTimeout(() => scene.remove(light), 300);
  }

  destroy() {
    this.dead = true;
    if (this.particles) scene.remove(this.particles);
  }
}

function updateFireworksSystem(delta) {
  // Tạo pháo hoa mới theo định kỳ
  if (Math.random() < 0.05 && fireworks.length < 15) {
    fireworks.push(new FireworkRocket());
  }

  for (let i = fireworks.length - 1; i >= 0; i--) {
    fireworks[i].update(delta);
    if (fireworks[i].dead) {
      fireworks.splice(i, 1);
    }
  }
}

// ============================================================
// INTERACTIVE SCREEN (MÀN HÌNH KÍNH 3D)
// ============================================================

const screenGroup=new THREE.Group();
campus.add(screenGroup);
const SCREEN_X=-10, SCREEN_Z=10, SCREEN_W=16.0, SCREEN_H=9.0, SCREEN_D=0.3;

const screenCanvas=document.createElement('canvas');
screenCanvas.width=2048; screenCanvas.height=1152;
const ctx=screenCanvas.getContext('2d');

function drawDuckDuckGoUI(){
  ctx.fillStyle='#10121a'; ctx.fillRect(0,0,2048,1152);
  ctx.beginPath(); ctx.arc(1024,380,85,0,Math.PI*2);
  ctx.fillStyle='#de5833'; ctx.fill();
  ctx.fillStyle='#ffffff'; ctx.font='bold 72px Arial'; ctx.textAlign='center';
  ctx.fillText('DuckDuckGo Night',1024,530);
  ctx.font='32px Arial'; ctx.fillStyle='#a0a5b5';
  ctx.fillText('Quyền riêng tư, được đơn giản hóa.',1024,590);
  ctx.fillStyle='#222530'; ctx.beginPath(); ctx.roundRect(424,650,1200,90,45); ctx.fill();
  ctx.strokeStyle='#3f424d'; ctx.lineWidth=4; ctx.stroke();
  ctx.font='34px Arial'; ctx.fillStyle='#757b8e'; ctx.textAlign='left';
  ctx.fillText('Tìm kiếm trên Web không bị theo dõi...',480,707);
}
drawDuckDuckGoUI();

const screenTexture=new THREE.CanvasTexture(screenCanvas);
screenTexture.colorSpace=THREE.SRGBColorSpace;

const screenFrameMaterial=new THREE.MeshStandardMaterial({color:0x111315, roughness:.2, metalness:.85});
const screenDisplayMaterial=new THREE.MeshBasicMaterial({map:screenTexture});

box(SCREEN_W+.6, SCREEN_H+.6, SCREEN_D, SCREEN_X, (SCREEN_H+.6)/2+1.2, SCREEN_Z, screenFrameMaterial, screenGroup);
const interactiveScreen=box(SCREEN_W, SCREEN_H, SCREEN_D+.02, SCREEN_X, SCREEN_H/2+1.5, SCREEN_Z-.02, screenDisplayMaterial, screenGroup);

box(.6, 3.0, .6, SCREEN_X-5.5, 0, SCREEN_Z, screenFrameMaterial, screenGroup);
box(.6, 3.0, .6, SCREEN_X+5.5, 0, SCREEN_Z, screenFrameMaterial, screenGroup);

// Screen click interaction
const screenRaycaster=new THREE.Raycaster();
const screenPointer=new THREE.Vector2();

function checkScreenTouch(clientX, clientY){
  const rect=renderer.domElement.getBoundingClientRect();
  screenPointer.x=((clientX-rect.left)/rect.width)*2-1;
  screenPointer.y=-((clientY-rect.top)/rect.height)*2+1;
  screenRaycaster.setFromCamera(screenPointer, camera);
  const hits=screenRaycaster.intersectObject(interactiveScreen, true);
  if(hits.length>0){
    document.getElementById("browser-overlay").classList.add("open");
    return true;
  }
  return false;
}

renderer.domElement.addEventListener("pointerdown", (e)=>{ if(e.pointerType==="mouse") checkScreenTouch(e.clientX, e.clientY); });

// ============================================================
// PLAYER & CONTROLS
// ============================================================

const player=new THREE.Group();
scene.add(player);
let model=null;

const loader=new GLTFLoader();
loader.load("scene.gltf", (gltf)=>{
  model=gltf.scene;
  model.position.y=.22;
  model.traverse(o=>{ if(o.isMesh){ o.castShadow=true; o.receiveShadow=true; } });
  player.add(model);
  loading.style.display="none";
}, undefined, ()=>{ loading.textContent="Đã tải xong môi trường 3D!"; });

const input=new THREE.Vector2(0,0);
const velocity=new THREE.Vector3(0,0,0);
let moveSpeed=80.556;
const FLY_SPEED=97.222;
let isFlying=false;

// Joystick setup
const joystick=document.getElementById("joystick-wrapper");
const stick=document.getElementById("joystick-stick");
let joystickTouch=null, centerX=0, centerY=0, radius=40;

joystick.addEventListener("touchstart", (e)=>{
  e.preventDefault();
  const touch=e.changedTouches[0];
  joystickTouch=touch.identifier;
  const rect=joystick.getBoundingClientRect();
  centerX=rect.left+rect.width/2; centerY=rect.top+rect.height/2;
  updateJoystick(touch);
}, {passive:false});

function updateJoystick(touch){
  const dx=touch.clientX-centerX, dy=touch.clientY-centerY;
  const dist=Math.hypot(dx,dy), angle=Math.atan2(dy,dx);
  const lim=Math.min(dist, radius);
  const x=Math.cos(angle)*lim, y=Math.sin(angle)*lim;
  stick.style.transform=`translate(${x}px,${y}px)`;
  input.x=x/radius; input.y=-y/radius;
}

window.addEventListener("touchmove", (e)=>{
  for(let i=0; i<e.changedTouches.length; i++){
    if(e.changedTouches[i].identifier===joystickTouch) updateJoystick(e.changedTouches[i]);
  }
}, {passive:false});

window.addEventListener("touchend", ()=>{
  joystickTouch=null; input.set(0,0); velocity.set(0,0,0); stick.style.transform="translate(0px,0px)";
});

// Jump / Fly Button
const jump=document.getElementById("jump-btn");
let isJumpHolding=false;

jump.addEventListener("touchstart", (e)=>{
  e.preventDefault(); isJumpHolding=true;
  if(!isFlying){ isFlying=true; jump.classList.add("flying"); moveSpeed=FLY_SPEED; }
}, {passive:false});

jump.addEventListener("touchend", (e)=>{ e.preventDefault(); isJumpHolding=false; });

// Browser controls
document.getElementById("browser-close").addEventListener("click", ()=>{
  document.getElementById("browser-overlay").classList.remove("open");
});

// ============================================================
// GAME LOOP
// ============================================================

const clock=new THREE.Clock();

function animate(){
  requestAnimationFrame(animate);
  const delta=Math.min(clock.getDelta(), .05);

  // Update Pháo hoa xung quanh trường
  updateFireworksSystem(delta);

  // Xử lý di chuyển
  if(input.lengthSq()>.01){
    const forward=new THREE.Vector3(0,0,-1).applyAxisAngle(new THREE.Vector3(0,1,0), cameraAngleY);
    const right=new THREE.Vector3(1,0,0).applyAxisAngle(new THREE.Vector3(0,1,0), cameraAngleY);
    const movement=new THREE.Vector3().addScaledVector(right, input.x).addScaledVector(forward, input.y);

    if(movement.lengthSq()>0){
      movement.normalize();
      velocity.x=movement.x*moveSpeed;
      velocity.z=movement.z*moveSpeed;
      if(model){
        const targetRot=Math.atan2(movement.x, movement.z);
        let diff=targetRot-model.rotation.y;
        diff=Math.atan2(Math.sin(diff), Math.cos(diff));
        model.rotation.y+=diff*Math.min(delta*10,1);
      }
    }
  } else {
    velocity.x=0; velocity.z=0;
  }

  // Bay & Trọng lực
  if(isFlying){
    velocity.y = isJumpHolding ? THREE.MathUtils.lerp(velocity.y, 50, delta*5) : THREE.MathUtils.lerp(velocity.y, 0, delta*3);
  } else {
    velocity.y -= 20*delta;
  }

  player.position.addScaledVector(velocity, delta);

  if(player.position.y<=0){
    player.position.y=0; velocity.y=0;
    if(isFlying){ isFlying=false; jump.classList.remove("flying"); moveSpeed=80.556; }
  }

  cameraPivot.position.copy(player.position);
  cameraPivot.position.y+=1.6;

  updateCamera();
  renderer.render(scene, camera);
}

animate();

// Resize Handler
window.addEventListener("resize", ()=>{
  camera.aspect=window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

</script>
