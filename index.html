<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scarlet</title>
  <style>
    :root {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --accent-color: #ff3b30;
      --text-color: #ffffff;
      --text-sub: #aaa;
      --bubble-bg: #2a2a2a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-color); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
    
    header { padding: 16px; text-align: center; background: var(--card-bg); font-weight: bold; font-size: 1.2rem; border-bottom: 1px solid #333; }
    .content { flex: 1; overflow-y: auto; padding: 16px; position: relative; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    nav { display: flex; background: var(--card-bg); border-top: 1px solid #333; }
    nav button { flex: 1; padding: 12px; background: none; border: none; color: var(--text-sub); font-size: 0.9rem; cursor: pointer; }
    nav button.active { color: var(--accent-color); font-weight: bold; }

    .card { background: var(--card-bg); padding: 16px; border-radius: 12px; margin-bottom: 16px; }
    input, button.btn { width: 100%; padding: 10px; margin-top: 8px; border-radius: 8px; border: 1px solid #333; background: #2a2a2a; color: #fff; }
    button.btn-primary { background: var(--accent-color); border: none; font-weight: bold; cursor: pointer; }

    /* Radar UI */
    .radar-box { width: 180px; height: 180px; border-radius: 50%; border: 2px solid var(--accent-color); margin: 15px auto; position: relative; overflow: hidden; background: radial-gradient(circle, #2a0000 0%, #121212 70%); }
    .radar-sweep { width: 100%; height: 100%; background: conic-gradient(from 0deg, transparent 0deg, transparent 300deg, rgba(255, 59, 48, 0.4) 360deg); animation: spin 3s linear infinite; border-radius: 50%; }
    @keyframes spin { 100% { transform: rotate(360deg); } }

    /* Scanner UI */
    video { width: 100%; height: 200px; background: #000; border-radius: 8px; object-fit: cover; }

    /* KHUNG CHAT & GHI CHÚ BÊN TRONG CHAT */
    .chat-container { display: flex; flex-direction: column; height: 100%; }
    
    /* Thanh trạng thái ghi chú ĐẶT TRONG CHAT */
    .chat-notes-header {
      display: flex;
      align-items: center;
      padding: 10px 12px;
      background: #181818;
      border-radius: 12px;
      margin-bottom: 12px;
      border: 1px solid #2a2a2a;
    }
    .note-avatar-wrapper {
      position: relative;
      width: 52px;
      height: 52px;
      margin-right: 12px;
      flex-shrink: 0;
      cursor: pointer;
    }
    .note-avatar-img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--accent-color);
    }
    .note-badge {
      position: absolute;
      bottom: -2px;
      right: -2px;
      background: var(--accent-color);
      width: 18px;
      height: 18px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: bold;
      border: 2px solid var(--bg-color);
    }
    .note-chat-bubble {
      position: relative;
      background: var(--bubble-bg);
      border: 1px solid #3d3d3d;
      padding: 8px 12px;
      border-radius: 12px;
      font-size: 13px;
      color: #fff;
      cursor: pointer;
      flex: 1;
      word-break: break-word;
    }
    .note-chat-bubble::before {
      content: '';
      position: absolute;
      left: -6px;
      top: 50%;
      transform: translateY(-50%);
      border-width: 6px 6px 6px 0;
      border-style: solid;
      border-color: transparent var(--bubble-bg) transparent transparent;
    }

    /* Khung tin nhắn chat */
    .chat-messages { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px; }
    .message { max-width: 75%; padding: 8px 12px; border-radius: 12px; font-size: 14px; word-break: break-word; }
    .message.user { align-self: flex-end; background: var(--accent-color); color: #fff; }
    .message.system { align-self: flex-start; background: var(--card-bg); color: #fff; border: 1px solid #333; }

    /* Modal Nhập Ghi Chú */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
      z-index: 999;
    }
    .modal-overlay.active { opacity: 1; pointer-events: auto; }
    .modal-box { background: var(--card-bg); padding: 18px; border-radius: 14px; width: 85%; max-width: 300px; text-align: center; }
  </style>
</head>
<body>

  <header>Scarlet</header>

  <main class="content">
    <!-- TAB 1: MỤC CHAT (Ghi chú nằm bên trong này) -->
    <section id="tab-chat" class="tab-content active">
      <div class="chat-container">
        
        <!-- Thanh Ghi Chú đặt bên trong khung Chat -->
        <div class="chat-notes-header">
          <div class="note-avatar-wrapper" onclick="openNoteModal()">
            <img src="https://i.pravatar.cc/150?img=68" alt="Avatar" class="note-avatar-img" />
            <div class="note-badge" id="badgeStatus">+</div>
          </div>
          <div class="note-chat-bubble" id="userNoteDisplay" onclick="openNoteModal()">
            Thêm ghi chú suy nghĩ...
          </div>
        </div>

        <!-- Nội dung Chat -->
        <div class="chat-messages">
          <div class="message system">Chào mừng bạn đến với Scarlet!</div>
        </div>

        <div style="display: flex; gap: 6px;">
          <input type="text" id="chatInput" placeholder="Nhập tin nhắn..." style="margin-top:0;" />
          <button class="btn btn-primary" style="width: 70px; margin-top:0;" onclick="sendMessage()">Gửi</button>
        </div>

      </div>
    </section>

    <!-- TAB 2: RADAR -->
    <section id="tab-radar" class="tab-content">
      <div class="card" style="text-align: center;">
        <h3>Radar Quét Bán Kính</h3>
        <div class="radar-box"><div class="radar-sweep"></div></div>
        <p id="radarStatus">Đang tìm kiếm thiết bị xung quanh...</p>
        <button class="btn btn-primary" onclick="toggleRadar()">Bật/Tắt Quét</button>
      </div>
    </section>

    <!-- TAB 3: QUÉT QR -->
    <section id="tab-qr" class="tab-content">
      <div class="card">
        <h3>Quét Mã QR Camera</h3>
        <video id="webcam" autoplay playsinline></video>
        <button class="btn btn-primary" onclick="startCamera()">Mở Camera</button>
        <button class="btn" style="margin-top:4px;" onclick="stopCamera()">Tắt Camera</button>
        <p id="qrResult" style="margin-top: 8px; color: var(--accent-color);"></p>
      </div>
    </section>
  </main>

  <!-- Modal Nhập Ghi Chú -->
  <div class="modal-overlay" id="noteModal">
    <div class="modal-box">
      <h4>Ghi chú trạng thái</h4>
      <input type="text" id="noteInput" placeholder="Chia sẻ suy nghĩ..." maxlength="60" />
      <div style="display: flex; gap: 8px; margin-top: 10px;">
        <button class="btn" onclick="closeNoteModal()">Hủy</button>
        <button class="btn btn-primary" onclick="saveNote()">Chia sẻ</button>
      </div>
    </div>
  </div>

  <!-- Navigation Bar -->
  <nav>
    <button class="nav-btn active" onclick="switchTab('tab-chat', this)">Trò chuyện</button>
    <button class="nav-btn" onclick="switchTab('tab-radar', this)">Radar</button>
    <button class="nav-btn" onclick="switchTab('tab-qr', this)">Quét QR</button>
  </nav>

  <script>
    function switchTab(tabId, element) {
      document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
      document.getElementById(tabId).classList.add('active');
      element.classList.add('active');
    }

    const NOTE_KEY = 'scarlet_chat_note';
    document.addEventListener('DOMContentLoaded', loadNote);

    function loadNote() {
      const savedNote = localStorage.getItem(NOTE_KEY);
      const display = document.getElementById('userNoteDisplay');
      const badge = document.getElementById('badgeStatus');

      if (savedNote) {
        display.innerText = savedNote;
        badge.innerText = '✓';
      } else {
        display.innerText = 'Thêm ghi chú suy nghĩ...';
        badge.innerText = '+';
      }
    }

    function openNoteModal() {
      document.getElementById('noteInput').value = localStorage.getItem(NOTE_KEY) || '';
      document.getElementById('noteModal').classList.add('active');
    }

    function closeNoteModal() {
      document.getElementById('noteModal').classList.remove('active');
    }

    function saveNote() {
      const text = document.getElementById('noteInput').value.trim();
      if (text) {
        localStorage.setItem(NOTE_KEY, text);
      } else {
        localStorage.removeItem(NOTE_KEY);
      }
      loadNote();
      closeNoteModal();
    }

    function sendMessage() {
      const input = document.getElementById('chatInput');
      const text = input.value.trim();
      if (!text) return;

      const container = document.querySelector('.chat-messages');
      const msgDiv = document.createElement('div');
      msgDiv.className = 'message user';
      msgDiv.innerText = text;
      container.appendChild(msgDiv);
      input.value = '';
      container.scrollTop = container.scrollHeight;
    }

    let isScanning = true;
    function toggleRadar() {
      const sweep = document.querySelector('.radar-sweep');
      const status = document.getElementById('radarStatus');
      isScanning = !isScanning;
      sweep.style.animationPlayState = isScanning ? 'running' : 'paused';
      status.innerText = isScanning ? 'Đang tìm kiếm thiết bị xung quanh...' : 'Đã dừng quét.';
    }

    let streamRef = null;
    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
        streamRef = stream;
        document.getElementById('webcam').srcObject = stream;
        document.getElementById('qrResult').innerText = 'Camera sẵn sàng...';
      } catch (err) {
        document.getElementById('qrResult').innerText = 'Không thể truy cập camera.';
      }
    }

    function stopCamera() {
      if (streamRef) {
        streamRef.getTracks().forEach(track => track.stop());
        document.getElementById('webcam').srcObject = null;
        document.getElementById('qrResult').innerText = 'Đã tắt camera.';
      }
    }
  </script>
</body>
</html>
