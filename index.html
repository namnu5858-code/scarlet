<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>Cam Thung Middle School - 3D Campus</title>

<style>
*{
  box-sizing:border-box;
  -webkit-user-select:none;
  user-select:none;
  -webkit-touch-callout:none;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#8fd4f5;
  touch-action:none;
  font-family:Arial,sans-serif;
}

#game-container{
  position:fixed;
  top:0;
  left:0;
  width:100vw;
  height:100vh;
  z-index:1;
}

canvas{
  display:block;
  width:100vw !important;
  height:100vh !important;
}

.glass-ui{
  background:rgba(255,255,255,.18);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  border:1px solid rgba(255,255,255,.4);
  box-shadow:0 8px 32px rgba(0,0,0,.18);
}

#joystick-wrapper{
  position:absolute;
  left:32px;
  bottom:32px;
  width:120px;
  height:120px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:20;
  touch-action:none;
}

#joystick-stick{
  position:absolute;
  width:52px;
  height:52px;
  border-radius:50%;
  background:rgba(255,255,255,.58);
  border:1px solid rgba(255,255,255,.85);
  box-shadow:0 4px 14px rgba(0,0,0,.18);
  pointer-events:none;
}

#jump-btn{
  position:absolute;
  right:32px;
  bottom:38px;
  width:72px;
  height:72px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:20;
  touch-action:none;
  transition:background .3s ease,transform .1s ease;
}

#jump-btn.flying{
  background:rgba(255,215,0,.55);
  border-color:rgba(255,255,255,.9);
  box-shadow:0 0 15px rgba(255,215,0,.6);
}

#jump-btn:active{
  transform:scale(.94);
}

#jump-btn svg{
  width:34px;
  height:34px;
  fill:none;
  stroke:white;
  stroke-width:2.5;
  stroke-linecap:round;
  stroke-linejoin:round;
}

#loading{
  position:absolute;
  top:14px;
  right:16px;
  padding:8px 14px;
  border-radius:10px;
  background:rgba(0,0,0,.42);
  color:white;
  font-size:12px;
  z-index:30;
  pointer-events:none;
}

/* ============================================================
   ROBLOX STYLE CHAT UI
   ============================================================ */

#chat-toggle-btn{
  position:absolute;
  top:12px;
  left:12px;
  width:36px;
  height:36px;
  background:rgba(0,0,0,.6);
  border:1px solid rgba(255,255,255,.3);
  border-radius:6px;
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:50;
  cursor:pointer;
  touch-action:manipulation;
}

#chat-toggle-btn svg{
  width:20px;
  height:20px;
  fill:white;
}

#roblox-chat-container{
  position:absolute;
  top:54px;
  left:12px;
  width:320px;
  max-width:calc(100vw - 24px);
  background:rgba(0,0,0,.75);
  border-radius:8px;
  padding:8px;
  box-shadow:0 4px 12px rgba(0,0,0,.5);
  z-index:50;
  display:flex;
  flex-direction:column;
  gap:6px;
  font-family:Arial,sans-serif;
  color:white;
  transition:opacity .2s ease,transform .2s ease;
}

#roblox-chat-container.hidden{
  display:none;
}

#chat-info-banner{
  font-size:11px;
  color:#bbb;
  border-bottom:1px solid rgba(255,255,255,.15);
  padding-bottom:4px;
  margin-bottom:2px;
}

#chat-messages-list{
  height:120px;
  overflow-y:auto;
  display:flex;
  flex-direction:column;
  gap:4px;
  font-size:13px;
  line-height:1.3;
}

#chat-messages-list::-webkit-scrollbar{
  width:4px;
}

#chat-messages-list::-webkit-scrollbar-thumb{
  background:rgba(255,255,255,.3);
  border-radius:2px;
}

.chat-entry{
  word-break:break-word;
}

.chat-user{
  color:#e261ff;
  font-weight:bold;
  margin-right:4px;
}

.chat-text{
  color:#ffffff;
}

.chat-system{
  color:#00ffcc;
  font-style:italic;
}

#chat-input-row{
  display:flex;
  align-items:center;
  background:rgba(0,0,0,.8);
  border:1px solid rgba(255,255,255,.2);
  border-radius:4px;
  padding:4px 8px;
}

#chat-input{
  flex:1;
  background:transparent;
  border:none;
  outline:none;
  color:white;
  font-size:12px;
  user-select:text;
  -webkit-user-select:text;
}

#chat-input::placeholder{
  color:#888;
}

#chat-send-btn{
  background:transparent;
  border:none;
  outline:none;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:2px;
}

#chat-send-btn svg{
  width:16px;
  height:16px;
  fill:white;
}

#music-player-iframe{
  position:absolute;
  top:-9999px;
  left:-9999px;
  width:1px;
  height:1px;
  opacity:0;
  pointer-events:none;
  z-index:-1;
}
</style>

<script type="importmap">
{
  "imports":{
    "three":"https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>

<body>

<div id="game-container"></div>

<div id="loading">
Đang dựng khuôn viên trường 3D...
</div>

<!-- CHỈ DÙNG ĐỂ PHÁT NHẠC NỀN KHI NHẬP "st" -->
<iframe
  id="music-player-iframe"
  src=""
  allow="autoplay; encrypted-media">
</iframe>

<!-- ROBLOX CHAT UI -->
<div id="chat-toggle-btn">
  <svg viewBox="0 0 24 24">
    <path d="M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zM6 9h12v2H6V9zm8 5H6v-2h8v2zm4-6H6V6h12v2z"/>
  </svg>
</div>

<div id="roblox-chat-container">
  <div id="chat-info-banner">
    Nhập <b>st</b> rồi gửi để phát nhạc nền
  </div>

  <div id="chat-messages-list">
    <div class="chat-entry">
      <span class="chat-user">[Caelestene]</span>
      <span class="chat-text">Hi, nice to meet you!</span>
    </div>

    <div class="chat-entry">
      <span class="chat-user">[Caelestene]</span>
      <span class="chat-text">初めてプレイするので、とても興奮しています！</span>
    </div>
  </div>

  <div id="chat-input-row">
    <input
      type="text"
      id="chat-input"
      placeholder='To chat click here or press "/" key'
      autocomplete="off"
      spellcheck="false"
    />

    <button id="chat-send-btn">
      <svg viewBox="0 0 24 24">
        <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
      </svg>
    </button>
  </div>
</div>

<div id="joystick-wrapper" class="glass-ui">
  <div id="joystick-stick"></div>
</div>

<div id="jump-btn" class="glass-ui">
  <svg viewBox="0 0 24 24">
    <path d="M12 19V5"></path>
    <path d="M5 12l7-7 7 7"></path>
  </svg>
</div>

<script type="module">

import * as THREE from "three";
import {GLTFLoader} from "three/addons/loaders/GLTFLoader.js";

/* ============================================================
   CHỈ PHẦN CHAT + NHẠC
   Không thay đổi scene, campus, model, camera hay gameplay.
   Nhập đúng "st" trong chat rồi gửi => phát nhạc nền.
   ============================================================ */

function playLoNguoiUotAo(){

  const playerIframe=
    document.getElementById("music-player-iframe");

  playerIframe.src=
    "https://www.youtube.com/embed/3gbjz23Sa1s?autoplay=1&enablejsapi=1";

}

const chatToggleBtn=
  document.getElementById("chat-toggle-btn");

const chatContainer=
  document.getElementById("roblox-chat-container");

const chatInput=
  document.getElementById("chat-input");

const chatSendBtn=
  document.getElementById("chat-send-btn");

const chatMessagesList=
  document.getElementById("chat-messages-list");

chatToggleBtn.addEventListener(
  "click",
  function(){

    chatContainer.classList.toggle("hidden");

  }
);

function addSystemMessage(text){

  const entry=
    document.createElement("div");

  entry.className="chat-entry";

  const sysSpan=
    document.createElement("span");

  sysSpan.className="chat-system";

  sysSpan.textContent=
    "[System] "+text;

  entry.appendChild(sysSpan);

  chatMessagesList.appendChild(entry);

  chatMessagesList.scrollTop=
    chatMessagesList.scrollHeight;
}

function sendChatMessage(){

  const text=
    chatInput.value.trim();

  if(text==="") return;

  const entry=
    document.createElement("div");

  entry.className="chat-entry";

  const userSpan=
    document.createElement("span");

  userSpan.className="chat-user";

  userSpan.textContent="[Player]";

  const textSpan=
    document.createElement("span");

  textSpan.className="chat-text";

  textSpan.textContent=
    " "+text;

  entry.appendChild(userSpan);
  entry.appendChild(textSpan);

  chatMessagesList.appendChild(entry);

  chatMessagesList.scrollTop=
    chatMessagesList.scrollHeight;

  /*
     CHỈ KIỂM TRA "st".
     Không thay đổi bất kỳ phần nào của khuôn viên.
  */

  if(text.toLowerCase()==="st"){

    addSystemMessage(
      "Đang phát nhạc nền..."
    );

    playLoNguoiUotAo();

  }

  chatInput.value="";

}

chatSendBtn.addEventListener(
  "click",
  sendChatMessage
);

chatInput.addEventListener(
  "keydown",
  function(e){

    if(e.key==="Enter"){

      e.preventDefault();

      sendChatMessage();

    }

    e.stopPropagation();

  }
);

window.addEventListener(
  "keydown",
  function(e){

    if(
      e.key==="/" &&
      document.activeElement!==chatInput
    ){

      e.preventDefault();

      chatContainer.classList.remove(
        "hidden"
      );

      chatInput.focus();

    }

  }
);


/* ============================================================
   SCENE & RENDERER
   ============================================================ */

const container=
  document.getElementById("game-container");

const loading=
  document.getElementById("loading");

const scene=
  new THREE.Scene();

scene.background=
  new THREE.Color(0x8fd4f5);

scene.fog=
  new THREE.FogExp2(
    0xbfeafa,
    0.0012
  );

const cameraPivot=
  new THREE.Object3D();

scene.add(cameraPivot);

const camera=
  new THREE.PerspectiveCamera(
    60,
    window.innerWidth/window.innerHeight,
    0.1,
    3000
  );

cameraPivot.add(camera);

let cameraDistance=10;
let targetCameraDistance=10;

let cameraAngleX=0.1;
let cameraAngleY=0;

let targetCameraAngleX=0.1;
let targetCameraAngleY=0;

const renderer=
  new THREE.WebGLRenderer({
    antialias:true,
    powerPreference:"high-performance"
  });

renderer.setSize(
  window.innerWidth,
  window.innerHeight
);

renderer.setPixelRatio(
  Math.min(
    window.devicePixelRatio,
    2
  )
);

renderer.shadowMap.enabled=true;
renderer.shadowMap.type=
  THREE.PCFSoftShadowMap;

renderer.outputColorSpace=
  THREE.SRGBColorSpace;

renderer.toneMapping=
  THREE.ACESFilmicToneMapping;

renderer.toneMappingExposure=1.12;

container.appendChild(
  renderer.domElement
);


/* ============================================================
   CAMERA COLLISION
   ============================================================ */

const raycaster=
  new THREE.Raycaster();

const cameraCollisionObjects=[];

function updateCamera(){

  cameraAngleY=
    THREE.MathUtils.lerp(
      cameraAngleY,
      targetCameraAngleY,
      0.18
    );

  cameraAngleX=
    THREE.MathUtils.lerp(
      cameraAngleX,
      targetCameraAngleX,
      0.18
    );

  cameraDistance=
    THREE.MathUtils.lerp(
      cameraDistance,
      targetCameraDistance,
      0.12
    );

  cameraPivot.rotation.y=
    cameraAngleY;

  cameraPivot.rotation.x=
    cameraAngleX;

  const origin=
    cameraPivot.position.clone();

  const dir=
    new THREE.Vector3(0,0,1)
      .applyQuaternion(
        cameraPivot.quaternion
      );

  raycaster.set(origin,dir);

  let actualDistance=
    cameraDistance;

  if(
    cameraCollisionObjects.length>0
  ){

    const hits=
      raycaster.intersectObjects(
        cameraCollisionObjects,
        true
      );

    if(
      hits.length>0 &&
      hits[0].distance<cameraDistance
    ){

      actualDistance=
        Math.max(
          hits[0].distance-0.3,
          0.5
        );

    }

  }

  camera.position.set(
    0,
    0,
    actualDistance
  );

  camera.lookAt(
    cameraPivot.position
  );

}


/* ============================================================
   LIGHTING
   ============================================================ */

const hemisphere=
  new THREE.HemisphereLight(
    0xe8f8ff,
    0x516b3b,
    1.5
  );

scene.add(hemisphere);

const sunlight=
  new THREE.DirectionalLight(
    0xfff3d2,
    2.2
  );

sunlight.position.set(
  100,
  130,
  80
);

sunlight.castShadow=true;

sunlight.shadow.mapSize.width=2048;
sunlight.shadow.mapSize.height=2048;

sunlight.shadow.camera.near=1;
sunlight.shadow.camera.far=400;

sunlight.shadow.camera.left=-250;
sunlight.shadow.camera.right=250;
sunlight.shadow.camera.top=250;
sunlight.shadow.camera.bottom=-250;

sunlight.shadow.bias=-0.0003;

scene.add(sunlight);


/* ============================================================
   MATERIALS
   ============================================================ */

const MAT={};

MAT.redTile=
  new THREE.MeshStandardMaterial({
    color:0xa94c3d,
    roughness:.78
  });

MAT.lightBlue=
  new THREE.MeshStandardMaterial({
    color:0x9ed9ec,
    roughness:.7
  });

MAT.white=
  new THREE.MeshStandardMaterial({
    color:0xf4f5f0,
    roughness:.72
  });

MAT.yellow=
  new THREE.MeshStandardMaterial({
    color:0xe7d16a,
    roughness:.8
  });

MAT.darkMetal=
  new THREE.MeshStandardMaterial({
    color:0x30383b,
    roughness:.55,
    metalness:.65
  });

MAT.steel=
  new THREE.MeshStandardMaterial({
    color:0xadb7ba,
    roughness:.35,
    metalness:.8
  });

MAT.roofMetal=
  new THREE.MeshStandardMaterial({
    color:0x68777b,
    roughness:.65,
    metalness:.45
  });

MAT.glass=
  new THREE.MeshPhysicalMaterial({
    color:0x76b9d2,
    roughness:.08,
    metalness:.05,
    transparent:true,
    opacity:.68
  });

MAT.concrete=
  new THREE.MeshStandardMaterial({
    color:0xb8b9b3,
    roughness:.9
  });


/* ============================================================
   HELPER
   ============================================================ */

function box(
  w,
  h,
  d,
  x,
  y,
  z,
  material,
  parent=scene
){

  const mesh=
    new THREE.Mesh(
      new THREE.BoxGeometry(
        w,
        h,
        d
      ),
      material
    );

  mesh.position.set(
    x,
    y,
    z
  );

  mesh.castShadow=true;
  mesh.receiveShadow=true;

  parent.add(mesh);

  return mesh;
}


/* ============================================================
   CAMPUS & GROUND
   ============================================================ */

const campus=
  new THREE.Group();

scene.add(campus);

const CAMPUS_W=260;
const CAMPUS_D=210;

const baseGround=
  box(
    2500,
    1,
    2500,
    0,
    -0.7,
    0,
    new THREE.MeshStandardMaterial({
      color:0x73b951,
      roughness:1
    }),
    campus
  );

cameraCollisionObjects.push(
  baseGround
);

const courtyard=
  box(
    240,
    .45,
    190,
    0,
    0,
    0,
    MAT.redTile,
    campus
  );

cameraCollisionObjects.push(
  courtyard
);

const tileLineMaterial=
  new THREE.MeshStandardMaterial({
    color:0x5e2b26,
    roughness:.9
  });

for(
  let x=-120;
  x<=120;
  x+=6
){

  box(
    .12,
    .03,
    190,
    x,
    .235,
    0,
    tileLineMaterial,
    campus
  );

}

for(
  let z=-95;
  z<=95;
  z+=6
){

  box(
    240,
    .03,
    .12,
    0,
    .235,
    z,
    tileLineMaterial,
    campus
  );

}


/* ============================================================
   FENCE
   ============================================================ */

function createFenceX(z){

  box(
    CAMPUS_W,
    2,
    1,
    0,
    1,
    z,
    MAT.yellow,
    campus
  );

  for(
    let x=-130;
    x<=130;
    x+=4
  ){

    box(
      .16,
      2.5,
      .16,
      x,
      2.25,
      z,
      MAT.darkMetal,
      campus
    );

  }

  box(
    CAMPUS_W,
    .16,
    .16,
    0,
    3.4,
    z,
    MAT.darkMetal,
    campus
  );

  box(
    CAMPUS_W,
    .16,
    .16,
    0,
    2.35,
    z,
    MAT.darkMetal,
    campus
  );

}

function createFenceZ(x){

  box(
    1,
    2,
    CAMPUS_D,
    x,
    1,
    0,
    MAT.yellow,
    campus
  );

  for(
    let z=-105;
    z<=105;
    z+=4
  ){

    box(
      .16,
      2.5,
      .16,
      x,
      2.25,
      z,
      MAT.darkMetal,
      campus
    );

  }

  box(
    .16,
    .16,
    CAMPUS_D,
    x,
    3.4,
    0,
    MAT.darkMetal,
    campus
  );

}

createFenceX(-105);
createFenceX(105);
createFenceZ(-130);
createFenceZ(130);


/* ============================================================
   BUILDING A
   ============================================================ */

const buildingA=
  new THREE.Group();

campus.add(buildingA);

const A_HEIGHT=16;

const bA=
  box(
    145,
    A_HEIGHT,
    17,
    -45,
    A_HEIGHT/2,
    -55,
    MAT.lightBlue,
    buildingA
  );

cameraCollisionObjects.push(bA);

box(
  145,
  1.2,
  17.5,
  -45,
  .6,
  -55,
  MAT.white,
  buildingA
);

for(
  let y=4;
  y<16;
  y+=4
){

  box(
    145,
    .22,
    17.5,
    -45,
    y,
    -55,
    MAT.white,
    buildingA
  );

}

for(
  let floor=0;
  floor<4;
  floor++
){

  const y=
    2+floor*4;

  for(
    let x=-112;
    x<=22;
    x+=13
  ){

    box(
      8.2,
      2.25,
      .20,
      x,
      y,
      -63.65,
      MAT.glass,
      buildingA
    );

    box(
      8.7,
      .15,
      .15,
      x,
      y-1.15,
      -63.82,
      MAT.darkMetal,
      buildingA
    );

    box(
      8.7,
      .15,
      .15,
      x,
      y+1.15,
      -63.82,
      MAT.darkMetal,
      buildingA
    );

    box(
      .15,
      2.4,
      .15,
      x-4.25,
      y,
      -63.82,
      MAT.darkMetal,
      buildingA
    );

    box(
      .15,
      2.4,
      .15,
      x+4.25,
      y,
      -63.82,
      MAT.darkMetal,
      buildingA
    );

  }

}

for(
  let floor=1;
  floor<=3;
  floor++
){

  const y=
    floor*4;

  box(
    145,
    .28,
    5,
    -45,
    y,
    -45,
    MAT.concrete,
    buildingA
  );

  for(
    let x=-112;
    x<=22;
    x+=5
  ){

    box(
      .12,
      2,
      .12,
      x,
      y+1,
      -42.6,
      MAT.steel,
      buildingA
    );

  }

  box(
    145,
    .12,
    .12,
    -45,
    y+2,
    -42.6,
    MAT.steel,
    buildingA
  );

  box(
    145,
    .12,
    .12,
    -45,
    y+.8,
    -42.6,
    MAT.steel,
    buildingA
  );

}


/* ============================================================
   BUILDING B
   ============================================================ */

const buildingB=
  new THREE.Group();

campus.add(buildingB);

const BX=75;
const BZ=-10;

const bB=
  box(
    70,
    16,
    30,
    BX,
    8,
    BZ,
    MAT.lightBlue,
    buildingB
  );

cameraCollisionObjects.push(bB);

box(
  70,
  1.2,
  31,
  BX,
  .6,
  BZ,
  MAT.white,
  buildingB
);

for(
  let y=4;
  y<16;
  y+=4
){

  box(
    70,
    .22,
    31,
    BX,
    y,
    BZ,
    MAT.white,
    buildingB
  );

}

for(
  let floor=0;
  floor<4;
  floor++
){

  const y=
    2+floor*4;

  for(
    let x=47;
    x<=103;
    x+=14
  ){

    box(
      8,
      2.3,
      .18,
      x,
      y,
      BZ-15.15,
      MAT.glass,
      buildingB

/* ============================================================
   AUDIO SYNTHESIZER FOR FIREWORKS
   ============================================================ */

let audioCtx=null;

function initAudio(){

  if(!audioCtx){

    audioCtx=
      new (
        window.AudioContext ||
        window.webkitAudioContext
      )();

  }

  if(audioCtx.state==="suspended"){

    audioCtx.resume();

  }

}

function playLaunchSound(){

  if(!audioCtx) return;

  const osc=
    audioCtx.createOscillator();

  const gain=
    audioCtx.createGain();

  osc.type="sine";

  osc.frequency.setValueAtTime(
    120,
    audioCtx.currentTime
  );

  osc.frequency.exponentialRampToValueAtTime(
    500,
    audioCtx.currentTime+.35
  );

  gain.gain.setValueAtTime(
    .12,
    audioCtx.currentTime
  );

  gain.gain.exponentialRampToValueAtTime(
    .01,
    audioCtx.currentTime+.35
  );

  osc.connect(gain);
  gain.connect(audioCtx.destination);

  osc.start();

  osc.stop(
    audioCtx.currentTime+.35
  );

}

function playExplosionSound(){

  if(!audioCtx) return;

  const bufferSize=
    audioCtx.sampleRate*.45;

  const buffer=
    audioCtx.createBuffer(
      1,
      bufferSize,
      audioCtx.sampleRate
    );

  const data=
    buffer.getChannelData(0);

  for(
    let i=0;
    i<bufferSize;
    i++
  ){

    data[i]=
      Math.random()*2-1;

  }

  const noise=
    audioCtx.createBufferSource();

  noise.buffer=buffer;

  const filter=
    audioCtx.createBiquadFilter();

  filter.type="lowpass";

  filter.frequency.setValueAtTime(
    700,
    audioCtx.currentTime
  );

  filter.frequency.exponentialRampToValueAtTime(
    25,
    audioCtx.currentTime+.45
  );

  const gain=
    audioCtx.createGain();

  gain.gain.setValueAtTime(
    .35,
    audioCtx.currentTime
  );

  gain.gain.exponentialRampToValueAtTime(
    .01,
    audioCtx.currentTime+.45
  );

  noise.connect(filter);
  filter.connect(gain);
  gain.connect(audioCtx.destination);

  noise.start();

}

window.addEventListener(
  "pointerdown",
  initAudio
);

window.addEventListener(
  "touchstart",
  initAudio
);


/* ============================================================
   FIREWORKS SYSTEM
   ============================================================ */

const PARTICLE_COUNT=70;

const FIREWORK_COLORS=[
  0xff3355,
  0x33ff66,
  0x3399ff,
  0xffff33,
  0xff33ff,
  0x00ffff,
  0xff9900
];

function createCircleTexture(){

  const canvas=
    document.createElement("canvas");

  canvas.width=32;
  canvas.height=32;

  const ctx=
    canvas.getContext("2d");

  const gradient=
    ctx.createRadialGradient(
      16,
      16,
      0,
      16,
      16,
      16
    );

  gradient.addColorStop(
    0,
    "rgba(255,255,255,1)"
  );

  gradient.addColorStop(
    .4,
    "rgba(255,255,255,.8)"
  );

  gradient.addColorStop(
    1,
    "rgba(255,255,255,0)"
  );

  ctx.fillStyle=gradient;

  ctx.beginPath();

  ctx.arc(
    16,
    16,
    16,
    0,
    Math.PI*2
  );

  ctx.fill();

  return new THREE.CanvasTexture(
    canvas
  );

}

const particleTexture=
  createCircleTexture();

const fireworks=[];

class CenterFirework{

  constructor(){

    this.startX=
      (Math.random()-.5)*10;

    this.startZ=
      (Math.random()-.5)*10;

    this.startY=0;

    const launchAngle=
      Math.random()*Math.PI*2;

    const spreadDistance=
      25+Math.random()*45;

    this.targetX=
      this.startX+
      Math.cos(launchAngle)*
      spreadDistance;

    this.targetZ=
      this.startZ+
      Math.sin(launchAngle)*
      spreadDistance;

    this.targetY=
      35+Math.random()*25;

    this.currentX=
      this.startX;

    this.currentY=
      this.startY;

    this.currentZ=
      this.startZ;

    this.progress=0;

    this.speed=
      .02+Math.random()*.01;

    this.state="launching";

    const rocketGeo=
      new THREE.BufferGeometry();

    rocketGeo.setAttribute(
      "position",
      new THREE.Float32BufferAttribute(
        [
          this.currentX,
          this.currentY,
          this.currentZ
        ],
        3
      )
    );

    const rocketMat=
      new THREE.PointsMaterial({
        color:0xffffff,
        size:1.5,
        map:particleTexture,
        transparent:true,
        blending:THREE.AdditiveBlending,
        depthWrite:false
      });

    this.rocket=
      new THREE.Points(
        rocketGeo,
        rocketMat
      );

    scene.add(this.rocket);

    playLaunchSound();

  }

  explode(){

    scene.remove(
      this.rocket
    );

    this.rocket.geometry.dispose();
    this.rocket.material.dispose();

    this.state="exploded";

    this.color=
      FIREWORK_COLORS[
        Math.floor(
          Math.random()*
          FIREWORK_COLORS.length
        )
      ];

    const positions=
      new Float32Array(
        PARTICLE_COUNT*3
      );

    this.velocities=[];

    for(
      let i=0;
      i<PARTICLE_COUNT;
      i++
    ){

      positions[i*3]=
        this.currentX;

      positions[i*3+1]=
        this.currentY;

      positions[i*3+2]=
        this.currentZ;

      const theta=
        Math.random()*
        Math.PI*2;

      const phi=
        Math.acos(
          Math.random()*2-1
        );

      const spd=
        .35+Math.random()*.45;

      this.velocities.push(
        new THREE.Vector3(
          Math.sin(phi)*
          Math.cos(theta)*
          spd,

          Math.sin(phi)*
          Math.sin(theta)*
          spd,

          Math.cos(phi)*
          spd
        )
      );

    }

    const geo=
      new THREE.BufferGeometry();

    geo.setAttribute(
      "position",
      new THREE.BufferAttribute(
        positions,
        3
      )
    );

    const mat=
      new THREE.PointsMaterial({
        color:this.color,
        size:2.0,
        map:particleTexture,
        transparent:true,
        opacity:1.0,
        blending:THREE.AdditiveBlending,
        depthWrite:false
      });

    this.particles=
      new THREE.Points(
        geo,
        mat
      );

    scene.add(
      this.particles
    );

    playExplosionSound();

  }

  update(){

    if(
      this.state==="launching"
    ){

      this.progress+=
        this.speed;

      this.currentX=
        THREE.MathUtils.lerp(
          this.startX,
          this.targetX,
          this.progress
        );

      this.currentY=
        THREE.MathUtils.lerp(
          this.startY,
          this.targetY,
          this.progress
        );

      this.currentZ=
        THREE.MathUtils.lerp(
          this.startZ,
          this.targetZ,
          this.progress
        );

      const pos=
        this.rocket
          .geometry
          .attributes
          .position
          .array;

      pos[0]=this.currentX;
      pos[1]=this.currentY;
      pos[2]=this.currentZ;

      this.rocket
        .geometry
        .attributes
        .position
        .needsUpdate=true;

      if(this.progress>=1){

        this.explode();

      }

    }else if(
      this.state==="exploded"
    ){

      const pos=
        this.particles
          .geometry
          .attributes
          .position
          .array;

      for(
        let i=0;
        i<PARTICLE_COUNT;
        i++
      ){

        pos[i*3]+=
          this.velocities[i].x;

        pos[i*3+1]+=
          this.velocities[i].y;

        pos[i*3+2]+=
          this.velocities[i].z;

        this.velocities[i].y-=.007;

        this.velocities[i]
          .multiplyScalar(.98);

      }

      this.particles
        .geometry
        .attributes
        .position
        .needsUpdate=true;

      this.particles.material.opacity-=.014;

      if(
        this.particles.material.opacity<=0
      ){

        this.state="dead";

        scene.remove(
          this.particles
        );

        this.particles.geometry.dispose();
        this.particles.material.dispose();

      }

    }

  }

}

const joystick=
  document.getElementById(
    "joystick-wrapper"
  );

const stick=
  document.getElementById(
    "joystick-stick"
  );

let joystickTouch=null;

let centerX=0;
let centerY=0;

const radius=40;

joystick.addEventListener(
  "touchstart",
  function(event){

    event.preventDefault();

    const touch=
      event.changedTouches[0];

    joystickTouch=
      touch.identifier;

    const rect=
      joystick.getBoundingClientRect();

    centerX=
      rect.left+
      rect.width/2;

    centerY=
      rect.top+
      rect.height/2;

    updateJoystick(touch);

  },
  {passive:false}
);

function updateJoystick(touch){

  const dx=
    touch.clientX-centerX;

  const dy=
    touch.clientY-centerY;

  const distance=
    Math.hypot(dx,dy);

  const angle=
    Math.atan2(dy,dx);

  const limited=
    Math.min(
      distance,
      radius
    );

  const x=
    Math.cos(angle)*
    limited;

  const y=
    Math.sin(angle)*
    limited;

  stick.style.transform=
    `translate(${x}px,${y}px)`;

  input.x=
    x/radius;

  input.y=
    -y/radius;

}

function resetJoystick(){

  joystickTouch=null;

  input.set(0,0);

  velocity.x=0;
  velocity.z=0;

  stick.style.transform=
    "translate(0px,0px)";

}

let animationTime=0;
let animationBlend=0;

function animateLeaves(
  delta,
  moving
){

  if(!model) return;

  leafMeshes.forEach(
    (mesh,index)=>{

      const original=
        initialData.get(mesh);

      if(!original) return;

      const speed=
        .72+(index%7)*.085;

      const phase=
        index*.67;

      const t=
        animationTime*
        speed+
        phase;

      const wave1=
        Math.sin(t);

      const wave2=
        Math.sin(
          t*1.73+index
        );

      const wave3=
        Math.cos(
          t*.57+
          index*.4
        );

      const movement=
        (
          wave1*.62+
          wave2*.23+
          wave3*.15
        )*
        animationBlend;

      const side=
        index%2===0?1:-1;

      mesh.rotation.z=
        original.rotation.z+
        movement*.30*
        side;

      mesh.rotation.x=
        original.rotation.x+
        wave3*.15*
        animationBlend;

      mesh.rotation.y=
        original.rotation.y+
        wave2*.10*
        animationBlend;

    }
  );

}

function animateSunflower(
  delta,
  moving
){

  if(!model) return;

  const target=
    moving?1:0;

  animationBlend=
    THREE.MathUtils.lerp(
      animationBlend,
      target,
      Math.min(delta*7,1)
    );

  if(moving){

    animationTime+=
      delta*9.5;

  }

  const wave=
    Math.sin(animationTime);

  const bounce=
    Math.abs(wave)*
    .10*
    animationBlend;

  model.position.y=
    THREE.MathUtils.lerp(
      model.position.y,
      .22+bounce,
      Math.min(delta*13,1)
    );

  model.rotation.z=
    THREE.MathUtils.lerp(
      model.rotation.z,
      wave*.035*
      animationBlend,
      Math.min(delta*8,1)
    );

  animateLeaves(
    delta,
    moving
  );

  armMeshes.forEach(
    (mesh,index)=>{

      const original=
        initialData.get(mesh);

      if(!original) return;

      const side=
        index%2===0?1:-1;

      mesh.rotation.z=
        original.rotation.z+
        wave*.32*
        side*
        animationBlend;

    }
  );

  rootMeshes.forEach(
    (mesh,index)=>{

      const original=
        initialData.get(mesh);

      if(!original) return;

      const side=
        index%2===0?1:-1;

      mesh.rotation.z=
        original.rotation.z+
        Math.sin(
          animationTime+
          Math.PI
        )*.20*
        side*
        animationBlend;

    }
  );

}


/* ============================================================
   GAME LOOP
   ============================================================ */

const clock=
  new THREE.Clock();

let lastFireworkTime=0;

function animate(time){

  requestAnimationFrame(
    animate
  );

  const delta=
    Math.min(
      clock.getDelta(),
      .05
    );

  const moving=
    input.lengthSq()>.01;

  if(moving){

    const forward=
      new THREE.Vector3(
        0,
        0,
        -1
      );

    const right=
      new THREE.Vector3(
        1,
        0,
        0
      );

    forward.applyAxisAngle(
      new THREE.Vector3(0,1,0),
      cameraAngleY
    );

    right.applyAxisAngle(
      new THREE.Vector3(0,1,0),
      cameraAngleY
    );

    const movement=
      new THREE.Vector3();

    movement.addScaledVector(
      right,
      input.x
    );

    movement.addScaledVector(
      forward,
      input.y
    );

    if(movement.lengthSq()>0){

      movement.normalize();

      velocity.x=
        movement.x*
        moveSpeed;

      velocity.z=
        movement.z*
        moveSpeed;

      if(model){

        const targetRotation=
          Math.atan2(
            movement.x,
            movement.z
          );

        let difference=
          targetRotation-
          model.rotation.y;

        difference=
          Math.atan2(
            Math.sin(difference),
            Math.cos(difference)
          );

        model.rotation.y+=
          difference*
          Math.min(
            delta*10,
            1
          );

      }

    }

  }else{

    velocity.x=0;
    velocity.z=0;

  }

  animateSunflower(
    delta,
    moving
  );


  /* ==========================================================
     FLYING
     ========================================================== */

  if(isFlying){

    if(isJumpHolding){

      velocity.y=
        THREE.MathUtils.lerp(
          velocity.y,
          50,
          delta*5
        );

    }else{

      velocity.y=
        THREE.MathUtils.lerp(
          velocity.y,
          0,
          delta*3
        );

    }

  }else{

    velocity.y+=
      gravity*
      delta;

  }

  player.position.y+=
    velocity.y*
    delta;

  if(player.position.y<=0){

    player.position.y=0;

    velocity.y=0;

    grounded=true;

    if(isFlying){

      isFlying=false;

      jump.classList.remove(
        "flying"
      );

      moveSpeed=
        walkSpeed;

    }

  }

  player.position.x+=
    velocity.x*
    delta;

  player.position.z+=
    velocity.z*
    delta;

  cameraPivot.position.copy(
    player.position
  );

  cameraPivot.position.y+=1.6;


  /* ==========================================================
     FIREWORKS UPDATE
     ========================================================== */

  if(
    time-lastFireworkTime>
    600+Math.random()*400
  ){

    fireworks.push(
      new CenterFirework()
    );

    lastFireworkTime=time;

  }

  for(
    let i=fireworks.length-1;
    i>=0;
    i--
  ){

    fireworks[i].update();

    if(
      fireworks[i].state==="dead"
    ){

      fireworks.splice(i,1);

    }

  }

  updateCamera();

  renderer.render(
    scene,
    camera
  );

}

animate(0);


/* ============================================================
   RESIZE
   ============================================================ */

function onResize(){

  const width=
    window.innerWidth;

  const height=
    window.innerHeight;

  camera.aspect=
    width/height;

  camera.updateProjectionMatrix();

  renderer.setSize(
    width,
    height
  );

  renderer.setPixelRatio(
    Math.min(
      window.devicePixelRatio,
      2
    )
  );

}

window.addEventListener(
  "resize",
  onResize
);

window.addEventListener(
  "orientationchange",
  function(){

    setTimeout(
      onResize,
      100
    );

  }
);

onResize();


/* ============================================================
   SERVICE WORKER
   ============================================================ */

if("serviceWorker" in navigator){

  window.addEventListener(
    "load",
    ()=>{
      navigator.serviceWorker
        .register(
          "./service-worker.js"
        )
        .then(
          reg=>{
            console.log(
              "Service Worker đã đăng ký thành công!",
              reg
            );
          }
        )
        .catch(
          err=>{
            console.error(
              "Lỗi đăng ký Service Worker:",
              err
            );
          }
        );
    }
  );

}
