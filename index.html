<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quét mã QR kết nối</title>
    <!-- Thư viện đọc mã QR -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <style>
        body {
            background-color: #000;
            color: #fff;
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        #reader {
            width: 100%;
            max-width: 400px;
            margin: 20px auto;
            border-radius: 10px;
            overflow: hidden;
        }
    </style>
</head>
<body>

    <h2>Quét mã QR để kết nối</h2>
    <div id="reader"></div>
    <p id="result">Đang khởi động camera...</p>

    <script>
        function onScanSuccess(decodedText, decodedResult) {
            // Hiển thị kết quả và tự động chuyển hướng ngay lập tức
            document.getElementById('result').innerText = "Đang chuyển hướng đến: " + decodedText;
            
            // Dừng camera trước khi chuyển hướng
            html5QrCode.stop().then((ignore) => {
                window.location.href = decodedText;
            }).catch((err) => {
                // Nếu dừng lỗi vẫn chuyển hướng
                window.location.href = decodedText;
            });
        }

        function onScanFailure(error) {
            // Lỗi quét liên tục trong quá trình tìm mã (có thể bỏ qua để không log rác)
        }

        const html5QrCode = new Html5Qrcode("reader");
        html5QrCode.start(
            { facingMode: "environment" }, 
            {
                fps: 10,
                qrbox: { width: 250, height: 250 }
            },
            onScanSuccess,
            onScanFailure
        ).catch((err) => {
            document.getElementById('result').innerText = "Không thể mở camera. Vui lòng cấp quyền camera.";
        });
    </script>

</body>
</html>
