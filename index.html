<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Scarlet</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --surface-color: #131b2e;
            --accent-color: #6366f1;
            --accent-glow: rgba(99, 102, 241, 0.4);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --transition-smooth: cubic-bezier(0.16, 1, 0.3, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: var(--bg-color);
            color: var(--text-primary);
            overflow: hidden;
        }

        /* --- MÀN HÌNH KHỞI ĐỘNG (SPLASH SCREEN) --- */
        #splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            opacity: 1;
            visibility: visible;
            transition: opacity 0.8s var(--transition-smooth), visibility 0.8s;
        }

        #splash-screen.fade-out {
            opacity: 0;
            visibility: hidden;
        }

        .splash-logo {
            font-size: 2.5rem;
            font-weight: 700;
            letter-spacing: -0.05em;
            background: linear-gradient(135deg, #fff 0%, var(--text-secondary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
            transform: translateY(10px);
            animation: fadeInUp 1s var(--transition-smooth) forwards;
        }

        .splash-author {
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--accent-color);
            letter-spacing: 0.2em;
            text-transform: uppercase;
            opacity: 0;
            animation: fadeInUp 1s var(--transition-smooth) 0.3s forwards;
        }

        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* --- KHUNG ỨNG DỤNG CHÍNH --- */
        #app-container {
            width: 100%;
            height: 100%;
            position: relative;
            display: flex;
            background: var(--bg-color);
        }

        /* Giao diện Chat (Messenger style hiện đại) */
        .chat-view {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            background: var(--bg-color);
            transition: opacity 0.6s var(--transition-smooth), transform 0.6s var(--transition-smooth);
            z-index: 2;
        }

        .chat-header {
            padding: 16px 24px;
            background: rgba(19, 27, 46, 0.7);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chat-title {
            font-size: 1.1rem;
            font-weight: 600;
        }

        /* Nút chuyển sang khuôn viên 3D hiện đại */
        .switch-3d-btn {
            background: linear-gradient(135deg, var(--accent-color), #4f46e5);
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 99px;
            font-weight: 500;
            font-size: 0.875rem;
            cursor: pointer;
            box-shadow: 0 4px 20px var(--accent-glow);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .switch-3d-btn:hover {
            transform: scale(1.02);
            box-shadow: 0 6px 25px var(--accent-glow);
        }

        .chat-body {
            flex: 1;
            padding: 24px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .message {
            max-width: 60%;
            padding: 12px 16px;
            border-radius: 16px;
            font-size: 0.95rem;
            line-height: 1.4;
        }

        .message.incoming {
            background: var(--surface-color);
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }

        .message.outgoing {
            background: var(--accent-color);
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        /* Giao diện Khuôn viên 3D */
        .campus-view {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #020408;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.8s var(--transition-smooth), transform 0.8s var(--transition-smooth);
            transform: scale(1.05);
            z-index: 1;
        }

        /* Trạng thái khi kích hoạt 3D */
        #app-container.mode-3d .chat-view {
            opacity: 0;
            visibility: hidden;
            transform: scale(0.95);
        }

        #app-container.mode-3d .campus-view {
            opacity: 1;
            visibility: visible;
            transform: scale(1);
            z-index: 3;
        }

        .campus-placeholder {
            text-align: center;
            color: var(--text-secondary);
            font-weight: 400;
        }

        /* --- LỚP PHỦ YÊU CẦU XOAY MÀN HÌNH (Cinematic Landscape Prompt) --- */
        #orientation-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(11, 15, 25, 0.85);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10000;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.4s ease, visibility 0.4s ease;
        }

        /* Chỉ hiển thị khi đang ở chế độ 3D VÀ thiết bị đang ở màn hình dọc (Portrait) */
        #app-container.mode-3d.is-portrait #orientation-overlay {
            opacity: 1;
            visibility: visible;
        }

        .device-rotate-animation {
            width: 50px;
            height: 80px;
            border: 2px solid rgba(255, 255, 255, 0.8);
            border-radius: 8px;
            position: relative;
            animation: rotateDevice 2s infinite ease-in-out;
            margin-bottom: 24px;
        }

        .device-rotate-animation::after {
            content: '';
            position: absolute;
            top: 8px;
            left: 50%;
            transform: translateX(-50%);
            width: 6px;
            height: 6px;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 50%;
        }

        @keyframes rotateDevice {
            0% { transform: rotate(0deg); }
            50% { transform: rotate(90deg); }
            100% { transform: rotate(90deg); }
        }

        .orientation-text {
            font-size: 1rem;
            font-weight: 500;
            letter-spacing: -0.01em;
            color: var(--text-primary);
        }
    </style>
</head>
<body>

    <!-- Màn hình khởi động -->
    <div id="splash-screen">
        <div class="splash-logo">Scarlet</div>
        <div class="splash-author">by tien</div>
    </div>

    <!-- Container ứng dụng -->
    <div id="app-container">
        
        <!-- Phần giao diện Chat -->
        <div class="chat-view">
            <div class="chat-header">
                <div class="chat-title">Trò chuyện</div>
                <button class="switch-3d-btn" id="enter-campus-btn">Khuôn viên 3D</button>
            </div>
            <div class="chat-body">
                <div class="message incoming">Chào bạn, hệ thống khuôn viên trường đã sẵn sàng tích hợp.</div>
                <div class="message outgoing">Tuyệt vời, chuyển sang không gian 3D ngay thôi!</div>
            </div>
        </div>

        <!-- Phần giao diện Khuôn viên trường 3D -->
        <div class="campus-view">
            <div class="campus-placeholder">
                <h2>Không gian Khuôn viên 3D</h2>
                <p style="margin-top: 8px; font-size: 0.9rem;">(Môi trường 3D tương tác cao cấp)</p>
            </div>
        </div>

    </div>

    <!-- Lớp phủ yêu cầu xoay màn hình tự động -->
    <div id="orientation-overlay">
        <div class="device-rotate-animation"></div>
        <div class="orientation-text">Vui lòng xoay ngang thiết bị để trải nghiệm tốt nhất</div>
    </div>

    <script>
        // 1. Xử lý màn hình khởi động (Splash Screen) tự động ẩn sau 1.5 giây
        window.addEventListener('load', () => {
            setTimeout(() => {
                const splash = document.getElementById('splash-screen');
                splash.classList.add('fade-out');
            }, 1500);
        });

        const appContainer = document.getElementById('app-container');
        const enterCampusBtn = document.getElementById('enter-campus-btn');

        // 2. Kiểm tra hướng màn hình thiết bị động
        function checkOrientation() {
            if (window.innerHeight > window.innerWidth) {
                appContainer.classList.add('is-portrait');
            } else {
                appContainer.classList.remove('is-portrait');
            }
        }

        window.addEventListener('resize', checkOrientation);
        window.addEventListener('orientationchange', checkOrientation);

        // 3. Hiệu ứng chuyển cảnh điện ảnh từ Chat sang Khuôn viên 3D
        enterCampusBtn.addEventListener('click', () => {
            appContainer.classList.add('mode-3d');
            checkOrientation();
        });
    </script>
</body>
</html>
