<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vì bạn bè - Vampire Sunflower</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #111;
            touch-action: none;
        }
        #joystick-container {
            position: absolute;
            bottom: 30px;
            left: 30px;
            width: 120px;
            height: 120px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.3);
            touch-action: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #joystick-knob {
            width: 50px;
            height: 50px;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            position: absolute;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="joystick-container">
        <div id="joystick-knob"></div>
    </div>

    <!-- Three.js từ CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

    <script>
        let scene, camera, renderer, model;
        let mixer;
        const clock = new THREE.Clock();

        // Biến điều khiển di chuyển
        let moveX = 0;
        let moveZ = 0;
        const speed = 0.05;

        init();
        animate();

        function init() {
            // Scene
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x222222);

            // Camera (Góc nhìn thứ ba)
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 2, 4);

            // Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            document.body.appendChild(renderer.domElement);

            // Light
            const ambientLight = new THREE.AmbientLight(0xffffff, 1.5);
            scene.add(ambientLight);

            const directionalLight = new THREE.DirectionalLight(0xffffff, 2);
            directionalLight.position.set(5, 10, 7);
            scene.add(directionalLight);

            // Load Model GLTF
            const loader = new THREE.GLTFLoader();
            loader.load('scene.gltf', (gltf) => {
                model = gltf.scene;
                model.scale.set(1, 1, 1);
                scene.add(model);

                // Xử lý animation nếu có
                if (gltf.animations && gltf.animations.length > 0) {
                    mixer = new THREE.AnimationMixer(model);
                    const action = mixer.clipAction(gltf.animations[0]);
                    action.play();
                }
            }, undefined, (error) => {
                console.error('Lỗi load model:', error);
            });

            // Xử lý Joystick cảm ứng trên di động
            initJoystick();

            window.addEventListener('resize', onWindowResize);
        }

        function initJoystick() {
            const container = document.getElementById('joystick-container');
            const knob = document.getElementById('joystick-knob');
            const maxDist = 35;

            let active = false;
            let centerX = 0;
            let centerY = 0;

            container.addEventListener('pointerdown', (e) => {
                active = true;
                const rect = container.getBoundingClientRect();
                centerX = rect.left + rect.width / 2;
                centerY = rect.top + rect.height / 2;
            });

            window.addEventListener('pointermove', (e) => {
                if (!active) return;
                const dx = e.clientX - centerX;
                const dy = e.clientY - centerY;
                const dist = Math.min(Math.sqrt(dx * dx + dy * dy), maxDist);
                const angle = Math.atan2(dy, dx);

                const kx = Math.cos(angle) * dist;
                const ky = Math.sin(angle) * dist;

                knob.style.transform = `translate(${kx}px, ${ky}px)`;

                // Tính toán hướng di chuyển cho nhân vật
                moveX = (kx / maxDist);
                moveZ = (ky / maxDist);
            });

            window.addEventListener('pointerup', () => {
                if (!active) return;
                active = false;
                knob.style.transform = `translate(0px, 0px)`;
                moveX = 0;
                moveZ = 0;
            });
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            const delta = clock.getDelta();
            if (mixer) mixer.update(delta);

            // Cập nhật vị trí và góc quay của nhân vật theo joystick
            if (model && (moveX !== 0 || moveZ !== 0)) {
                model.position.x += moveX * speed;
                model.position.z += moveZ * speed;

                // Xoay nhân vật hướng về phía di chuyển
                const angle = Math.atan2(moveX, moveZ);
                model.rotation.y = angle;

                // Cập nhật camera đi theo nhân vật mượt mà
                camera.position.x = model.position.x;
                camera.position.z = model.position.z + 4;
            }

            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
