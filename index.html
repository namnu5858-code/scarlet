<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Web Game</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; color: #fff; font-family: sans-serif; }
        #chat { position: absolute; bottom: 20px; left: 20px; z-index: 999; background: rgba(0,0,0,0.7); padding: 8px; border-radius: 5px; }
        #commandInput { padding: 6px 10px; font-size: 16px; border-radius: 4px; border: 1px solid #777; background: #222; color: #fff; outline: none; }
    </style>
</head>
<body>
    <div id="chat">
        <input type="text" id="commandInput" placeholder="Gõ st hoặc t...">
    </div>

    <!-- Âm thanh bài Lo Người Ướt Áo Remix -->
    <audio id="audioSt" src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" preload="auto"></audio>
    <!-- Âm thanh bài Karaoke Long Nhật -->
    <audio id="audioT" src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3" preload="auto"></audio>

    <script>
        const input = document.getElementById('commandInput');
        const audioSt = document.getElementById('audioSt');
        const audioT = document.getElementById('audioT');

        input.addEventListener('keydown', function(event) {
            if (event.key === 'Enter') {
                const cmd = input.value.trim().toLowerCase();
                if (cmd === 'st') {
                    audioT.pause();
                    audioT.currentTime = 0;
                    audioSt.play().catch(e => console.log(e));
                } else if (cmd === 't') {
                    audioSt.pause();
                    audioSt.currentTime = 0;
                    audioT.play().catch(e => console.log(e));
                }
                input.value = '';
            }
        });
    </script>
</body>
</html>
