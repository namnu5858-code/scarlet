<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sprout Ranger vs Grave Walker</title>
    <link rel="stylesheet" href="style.css">
    <!-- Tải Three.js từ CDN ổn định -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <!-- Container chứa Canvas 3D -->
    <div id="game-container"></div>

    <!-- Giao diện HUD trong game -->
    <div id="hud" class="ui-layer">
        <div class="top-bar">
            <div class="hud-box" id="hp-display">HP: 100/100</div>
            <div class="hud-box" id="wave-display">WAVE: 1</div>
            <div class="hud-box" id="zombies-display">ZOMBIES: 3</div>
        </div>

        <div class="top-right-buttons">
            <button id="pause-btn" class="hud-btn-small">⏸ TẠM DỪNG</button>
        </div>

        <!-- Khu vực điều khiển cảm ứng bên trái (Joystick) -->
        <div class="control-left" id="joystick-zone">
            <div id="joystick-base">
                <div id="joystick-stick"></div>
            </div>
        </div>

        <!-- Khu vực điều khiển bên phải (Bắn & Kỹ năng) -->
        <div class="control-right">
            <div class="skills-row">
                <button class="skill-btn" id="skill-1">Thorn<br>Burst</button>
                <button class="skill-btn" id="skill-2">Root<br>Shield</button>
                <button class="skill-btn" id="skill-3">Growth<br>Pulse</button>
            </div>
            <button id="shoot-btn">BẮN</button>
        </div>
    </div>

    <!-- Màn hình Menu Bắt Đầu -->
    <div id="start-screen" class="screen-overlay">
        <div class="menu-card">
            <h1>SPROUT RANGER</h1>
            <p>Bảo vệ khu vườn khỏi sự xâm chiếm của Grave Walker!</p>
            <button id="start-game-btn" class="main-btn">START GAME</button>
        </div>
    </div>

    <!-- Màn hình Tạm Dừng (Pause) -->
    <div id="pause-screen" class="screen-overlay hidden">
        <div class="menu-card">
            <h2>TRÒ CHƠI TẠM DỪNG</h2>
            <button id="resume-btn" class="main-btn">TIẾP TỤC</button>
            <button id="restart-from-pause-btn" class="main-btn secondary">CHƠI LẠI</button>
        </div>
    </div>

    <!-- Màn hình Game Over -->
    <div id="gameover-screen" class="screen-overlay hidden">
        <div class="menu-card">
            <h1 class="danger-text">GAME OVER</h1>
            <p>Sprout Ranger đã gục ngã...</p>
            <button id="restart-btn" class="main-btn">RESTART</button>
        </div>
    </div>

    <script src="main.js"></script>
</body>
</html>
