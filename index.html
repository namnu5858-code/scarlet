<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-9">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Siêu Trợ Lý AI Toàn Diện</title>
    <style>
        :root {
            --Primary: #6366f1;
            --PrimaryHover: #4f46e5;
            --BgDark: #0f172a;
            --ChatBg: #1e293b;
            --TextLight: #f8fafc;
            --TextMuted: #94a3b8;
            --UserBubble: #3b82f6;
            --BotBubble: #334155;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: var(--BgDark); color: var(--TextLight); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

        header {
            padding: 1rem 1.5rem;
            background-color: var(--ChatBg);
            border-bottom: 1px solid #334155;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 { font-size: 1.25rem; font-weight: 700; background: linear-gradient(90deg, #818cf8, #c084fc); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .message {
            max-width: 80%;
            padding: 1rem 1.2rem;
            border-radius: 1rem;
            line-height: 1.5;
            font-size: 0.95rem;
            position: relative;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .user-message {
            align-self: flex-end;
            background-color: var(--UserBubble);
            color: white;
            border-bottom-right-radius: 2px;
        }

        .bot-message {
            align-self: flex-start;
            background-color: var(--BotBubble);
            color: var(--TextLight);
            border-bottom-left-radius: 2px;
            border: 1px solid #475569;
        }

        .typing-indicator {
            display: flex;
            gap: 0.3rem;
            padding: 0.8rem 1rem;
            background: var(--BotBubble);
            width: fit-content;
            border-radius: 1rem;
            border-bottom-left-radius: 2px;
        }

        .typing-dot {
            width: 8px;
            height: 8px;
            background-color: var(--TextMuted);
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }

        .typing-dot:nth-child(1) { animation-delay: -0.32s; }
        .typing-dot:nth-child(2) { animation-delay: -0.16s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }

        .input-area {
            padding: 1rem 1.5rem;
            background-color: var(--ChatBg);
            border-top: 1px solid #334155;
            display: flex;
            gap: 0.75rem;
            align-items: center;
        }

        textarea {
            flex: 1;
            background-color: #0f172a;
            border: 1px solid #475569;
            color: var(--TextLight);
            padding: 0.75rem 1rem;
            border-radius: 0.75rem;
            resize: none;
            height: 50px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        textarea:focus { border-color: var(--Primary); }

        .btn {
            background-color: var(--Primary);
            color: white;
            border: none;
            padding: 0.75rem 1.25rem;
            border-radius: 0.75rem;
            cursor: pointer;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.2s, transform 0.1s;
        }

        .btn:hover { background-color: var(--PrimaryHover); }
        .btn:active { transform: scale(0.98); }
        .btn-icon { font-size: 1.25rem; }

        .mic-btn.recording {
            background-color: #ef4444;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }

        .error { color: #fca5a5; font-size: 0.85rem; margin-top: 0.25rem; }
    </style>
</head>
<body>

    <header>
        <h1>Nexus AI Pro</h1>
        <div id="status-indicator" style="font-size: 0.8rem; color: var(--TextMuted);">🌿 Sẵn sàng</div>
    </header>

    <div id="chat-container">
        <div class="message bot-message">Xin chào! Tôi là hệ thống trợ lý ảo toàn diện tích hợp đa tài nguyên. Bạn có thể gõ hoặc ra lệnh bằng giọng nói để cùng tôi phân tích dữ liệu, tra cứu thông tin hoặc sáng tạo nội dung.</div>
    </div>

    <div class="input-area">
        <button class="btn mic-btn" id="mic-btn" title="Nói chuyện">
            <span class="btn-icon">🎤</span>
        </button>
        <textarea id="user-input" placeholder="Nhập câu lệnh hoặc câu hỏi của bạn... (Enter để gửi)"></textarea>
        <button class="btn send-btn" id="send-btn">
            <span class="btn-icon">➤</span>
        </button>
    </div>

    <script>
        const chatContainer = document.getElementById('chat-container');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const micBtn = document.getElementById('mic-btn');
        const statusIndicator = document.getElementById('status-indicator');

        let recognition = null;
        let isRecording = false;

        // Khởi tạo Nhận diện giọng nói Web Speech API
        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.continuous = false;
            recognition.lang = 'vi-VN';
            recognition.interimResults = false;

            recognition.onstart = () => {
                isRecording = true;
                micBtn.classList.add('recording');
                statusIndicator.textContent = "🎙️ Đang nghe...";
            };

            recognition.onend = () => {
                isRecording = false;
                micBtn.classList.remove('recording');
                statusIndicator.textContent = "🌿 Sẵn sàng";
            };

            recognition.onresult = (event) => {
                const transcript = event.results[0][0].transcript;
                userInput.value = transcript;
                processUserMessage(transcript);
            };

            recognition.onerror = (event) => {
                console.error("Speech recognition error", event.error);
                statusIndicator.textContent = "⚠️ Lỗi thu âm";
            };
        } else {
            micBtn.style.display = 'none';
        }

        micBtn.addEventListener('click', () => {
            if (!recognition) return;
            if (isRecording) {
                recognition.stop();
            } else {
                recognition.start();
            }
        });

        sendBtn.addEventListener('click', () => {
            const text = userInput.value.trim();
            if (text) {
                processUserMessage(text);
                userInput.value = '';
            }
        });

        userInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendBtn.click();
            }
        });

        function appendMessage(text, sender) {
            const msgDiv = document.createElement('div');
            msgDiv.classList.add('message', `${sender}-message`);
            msgDiv.textContent = text;
            chatContainer.appendChild(msgDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function showTypingIndicator() {
            const indicator = document.createElement('div');
            indicator.classList.add('typing-indicator', 'bot-message');
            indicator.id = 'typing-div';
            indicator.innerHTML = '<div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div>';
            chatContainer.appendChild(indicator);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function removeTypingIndicator() {
            const indicator = document.getElementById('typing-div');
            if (indicator) indicator.remove();
        }

        async function processUserMessage(query) {
            appendMessage(query, 'user');
            showTypingIndicator();

            try {
                const reply = await generateAIResponse(query);
                removeTypingIndicator();
                appendMessage(reply, 'bot');
                speakText(reply);
            } catch (error) {
                removeTypingIndicator();
                appendMessage("Hệ thống hiện đang gián đoạn kết nối tài nguyên. Vui lòng thử lại.", 'bot');
            }
        }

        function speakText(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'vi-VN';
                utterance.rate = 1.0;
                utterance.pitch = 1.0;
                window.speechSynthesis.speak(utterance);
            }
        }

        async function generateAIResponse(query) {
            const lowerQuery = query.toLowerCase();
            
            // Giả lập xử lý logic thông minh và tích hợp API thời gian thực
            await new Promise(resolve => setTimeout(resolve, 1200));

            if (lowerQuery.includes('mấy giờ') || lowerQuery.includes('giờ')) {
                return `Hiện tại là ${new Date().toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' })} ngày ${new Date().toLocaleDateString('vi-VN')}.`;
            }

            if (lowerQuery.includes('thời tiết') || lowerQuery.includes('nhiệt độ')) {
                return "Dựa trên dữ liệu mạng, thời tiết khu vực của bạn hiện tại mát mẻ, thích hợp cho các hoạt động ngoài trời.";
            }

            if (lowerQuery.includes('tìm kiếm') || lowerQuery.includes('tra cứu') || lowerQuery.includes('là gì')) {
                return `Tôi đã quét tài nguyên mạng cho từ khóa "${query}". Kết quả cho thấy đây là một chủ đề chuyên sâu yêu cầu phân tích đa chiều. Bạn có muốn tôi tóm tắt các luận điểm chính không?`;
            }

            if (lowerQuery.includes('code') || lowerQuery.includes('lập trình') || lowerQuery.includes('tạo')) {
                return "Cấu trúc mã nguồn đã sẵn sàng. Hệ thống có thể module hóa thuật toán theo yêu cầu của bạn bằng JavaScript, Python hoặc C++.";
            }

            // Phản hồi tổng hợp thông minh
            const responses = [
                `Tôi đã ghi nhận và phân tích dữ liệu từ câu lệnh: "${query}". Dưới góc độ hệ thống, chúng ta cần tối ưu hóa quy trình này.`,
                `Đây là một góc nhìn thú vị! Việc tận dụng tối đa tài nguyên hiện có sẽ giúp giải quyết vấn đề này nhanh chóng hơn.`,
                `Hệ thống đã phản hồi. Dữ liệu đầu vào của bạn hoàn toàn khớp với các thuật toán xử lý logic hiện tại.`,
                `Tôi đang xử lý thông tin này. Bạn có muốn kết nối thêm với cơ sở dữ liệu bên ngoài để mở rộng phạm vi phân tích không?`
            ];
            
            return responses[Math.floor(Math.random() * responses.length)];
        }
    </script>
</body>
</html>
