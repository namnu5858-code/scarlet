<!DOCTYPE html>
<html lang="vi">
<head>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>scarlet</title>

    <script>
        if (location.protocol !== 'https:' && location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') {
            location.href = 'https:' + window.location.href.substring(window.location.protocol.length);
        }
    </script>

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="scarlet">
    <link rel="apple-touch-icon" href="https://sf-static.upanhlaylink.com/img/image_20260809b47476b2a5ac532de2516ba96d639ab7.jpg">
    <link rel="manifest" href="manifest.json">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsQR@1.4.0/dist/jsQR.js"></script>
    
    <style>
        :root {
            --bg-body: #0a0a0a;
            --bg-app: #000000;
            --bg-card: #18191a;
            --bg-hover: #242526;
            --bg-search: #242526;
            --bg-header: #121212;
            --bg-bubble-left: #242526;
            --bg-bubble-right: #3a3b3c;
            --text-main: #ffffff;
            --text-sub: #b0b3b8;
            --icon-stroke: #ffffff;
            --border-color: #2f3031;
            --qr-card-bg: rgba(255, 255, 255, 0.06);
            --qr-card-border: rgba(255, 255, 255, 0.12);
            --qr-box-bg: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            transition: background-color 0.2s ease, color 0.2s ease, border-color 0.2s ease;
        }

        body, html {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background-color: var(--bg-body);
        }

        .app-container {
            width: 100%;
            max-width: 420px;
            height: 100%;
            max-height: 850px;
            background: var(--bg-app);
            box-shadow: 0 4px 25px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            position: relative;
            border-radius: 12px;
            overflow: hidden;
        }

        .svg-icon {
            width: 22px;
            height: 22px;
            fill: none;
            stroke: var(--icon-stroke);
            stroke-width: 2.2;
            stroke-linecap: round;
            stroke-linejoin: round;
            display: inline-block;
            vertical-align: middle;
        }

        /* Splash */
        .splash-screen {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-color: var(--bg-app);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 99;
            transition: opacity 0.6s cubic-bezier(0.4, 0, 0.2, 1), filter 0.6s ease;
        }

        .splash-screen.fade-out {
            opacity: 0;
            filter: blur(8px);
            pointer-events: none;
        }

        .splash-logo {
            width: 130px; height: 130px;
            object-fit: contain;
            opacity: 0;
            transform: scale(0.85);
            animation: scarletSplash 0.8s cubic-bezier(0.215, 0.61, 0.355, 1) forwards;
        }

        .footer-text {
            position: absolute;
            bottom: 24px;
            font-weight: 900;
            color: var(--text-main);
            font-size: 14px;
            text-transform: lowercase;
        }

        @keyframes scarletSplash {
            0% { opacity: 0; transform: scale(0.85); }
            100% { opacity: 1; transform: scale(1); }
        }

        /* Main Content & Tabs */
        .main-content {
            flex: 1;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .tab-view {
            display: none;
            flex-direction: column;
            height: 100%;
            width: 100%;
            position: absolute;
            top: 0;
            left: 0;
            background-color: var(--bg-app);
        }

        .tab-view.active {
            display: flex;
        }

        /* Nearby Friends Tab (Map / Bản đồ) */
        .nearby-container {
            display: flex;
            flex-direction: column;
            height: 100%;
            width: 100%;
            background-color: var(--bg-app);
            color: var(--text-main);
        }

        .nearby-header {
            padding: 16px;
            background: var(--bg-app);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
        }

        .nearby-title { font-size: 20px; font-weight: bold; color: var(--text-main); }

        .scan-radar-btn {
            background: #2374e1;
            color: #ffffff;
            border: none;
            padding: 8px 14px;
            border-radius: 16px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        }

        .nearby-list {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .nearby-user-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .nearby-user-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .nearby-avatar {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: #3a3b3c;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 16px;
            color: white;
        }

        .nearby-details {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .nearby-name { font-size: 15px; font-weight: 600; color: var(--text-main); }
        .nearby-distance { font-size: 12px; color: var(--text-sub); }

        .connect-friend-btn {
            background: var(--bg-hover);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            border-radius: 14px;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
        }
        .connect-friend-btn:hover { background: #3a3b3c; }

        /* Chat list */
        .chat-list-container {
            display: flex;
            flex-direction: column;
            height: 100%; width: 100%;
            background-color: var(--bg-app);
            color: var(--text-main);
        }

        .chat-list-header {
            padding: 15px 16px 10px 16px;
            background: var(--bg-app);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-title { font-size: 24px; font-weight: bold; color: var(--text-main); }
        .header-actions { display: flex; gap: 15px; align-items: center; }

        .settings-icon-btn {
            background: var(--bg-search);
            color: var(--text-main);
            border: none;
            width: 36px; height: 36px;
            border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            cursor: pointer;
        }

        .search-container { padding: 0 16px 12px 16px; background: var(--bg-app); }

        .search-box {
            display: flex; align-items: center;
            background: var(--bg-search);
            border-radius: 20px;
            padding: 8px 14px; gap: 10px;
        }

        .search-box input {
            flex: 1; background: transparent; border: none; outline: none;
            color: var(--text-main); font-size: 14px;
        }

        .chat-list {
            flex: 1; overflow-y: auto; padding: 0 16px;
            display: flex; flex-direction: column; gap: 4px;
        }

        .chat-item {
            display: flex; align-items: center; gap: 12px;
            padding: 10px; border-radius: 12px; cursor: pointer;
        }

        .chat-item:hover { background: var(--bg-hover); }

        .chat-avatar {
            width: 48px; height: 48px; border-radius: 50%;
            background: #3a3b3c; border: 1px solid var(--border-color);
            display: flex; align-items: center; justify-content: center;
            font-weight: bold; font-size: 18px; color: white; flex-shrink: 0;
        }

        .chat-info { flex: 1; overflow: hidden; }
        .chat-name { font-size: 15px; font-weight: 600; color: var(--text-main); margin-bottom: 2px; }
        .chat-last-msg {
            font-size: 13px; color: var(--text-sub);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }

        .empty-chat-state {
            text-align: center; color: var(--text-sub);
            margin-top: 50px; font-size: 14px; line-height: 1.5;
        }

        .generic-tab-content {
            padding: 24px;
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            text-align: center;
            gap: 12px;
        }

        /* Bottom Navigation Bar */
        .bottom-nav-wrapper {
            padding: 10px 16px 16px 16px;
            background: transparent;
            display: flex;
            justify-content: center;
            z-index: 50;
        }

        .bottom-nav {
            width: 100%;
            max-width: 380px;
            height: 60px;
            background: #141414;
            border: 1px solid var(--border-color);
            border-radius: 30px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            box-shadow: 0 8px 20px rgba(0,0,0,0.6);
        }

        .nav-item {
            background: transparent;
            border: none;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
            height: 100%;
            position: relative;
            opacity: 0.5;
            transition: opacity 0.2s ease, transform 0.2s ease;
        }

        .nav-item.active { opacity: 1; }
        .nav-item.active .svg-icon { stroke: #ffffff; transform: scale(1.1); }

        /* Settings */
        .settings-screen {
            display: none; flex-direction: column;
            height: 100%; width: 100%;
            background-color: var(--bg-app);
            color: var(--text-main);
            position: absolute; top: 0; left: 0; z-index: 60;
        }

        .settings-header {
            padding: 12px 16px; background: var(--bg-header);
            border-bottom: 1px solid var(--border-color);
            display: flex; align-items: center; gap: 15px;
        }

        .back-btn {
            background: transparent; border: none; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            padding: 4px; border-radius: 50%;
        }

        .settings-content {
            flex: 1; padding: 16px; overflow-y: auto;
            display: flex; flex-direction: column; align-items: center; gap: 16px;
        }

        .settings-item {
            width: 100%; background: var(--bg-card); padding: 16px;
            border-radius: 12px; display: flex; justify-content: space-between;
            align-items: center; cursor: pointer;
        }

        .settings-item-title { font-size: 16px; font-weight: bold; color: var(--text-main); }

        /* Image search box */
        .image-search-box {
            width: 100%; background: var(--bg-card); padding: 16px;
            border-radius: 12px; display: flex; flex-direction: column; gap: 12px;
        }

        .image-search-actions { display: flex; flex-direction: column; gap: 10px; }

        .url-input-box {
            width: 100%; background: var(--bg-search); border: 1px solid var(--border-color);
            outline: none; color: var(--text-main); padding: 10px 14px; border-radius: 8px; font-size: 13px;
        }

        .library-btn {
            width: 100%; background: var(--bg-hover);
            border: 1px solid var(--border-color); color: var(--text-main);
            padding: 10px 14px; border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            gap: 8px; cursor: pointer; font-size: 14px; font-weight: 500;
        }

        .preview-img {
            width: 100%; max-height: 180px; object-fit: contain;
            border-radius: 8px; border: 1px solid var(--border-color);
            display: none; background: #000000;
        }

        .search-submit-btn {
            background: #2374e1; color: #ffffff; border: none;
            padding: 12px; border-radius: 8px; cursor: pointer;
            font-size: 14px; font-weight: 600; display: none; width: 100%;
        }

        .search-submit-btn:disabled { background: #555555; cursor: not-allowed; }

        .search-results-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            width: 100%;
            max-height: 380px;
            overflow-y: auto;
            background: #050505;
            padding: 10px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
        }

        .result-card {
            background: #141414;
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            border: 1px solid var(--border-color);
            width: 100%;
        }

        .media-wrapper {
            width: 100%;
            height: 110px;
            background: #000000;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        .result-card-media {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            background-color: #0d0d0d;
        }

        .result-card-title {
            padding: 6px 8px 4px 8px;
            font-size: 11px;
            font-weight: 500;
            color: var(--text-main);
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-overflow: ellipsis;
            line-height: 1.3;
            min-height: 32px;
        }

        .result-card-source {
            padding: 0 8px 6px 8px;
            font-size: 10px;
            color: var(--text-sub);
        }

        /* Sub screens */
        .qr-scanner-screen, .my-qr-screen, .chat-view {
            display: none; position: absolute; top: 0; left: 0;
            width: 100%; height: 100%; background: #000000;
            z-index: 100; flex-direction: column;
        }

        .qr-scanner-screen {
            justify-content: space-between; align-items: center;
            padding: 20px 16px 30px 16px;
        }

        .scanner-header, .my-qr-header {
            width: 100%; display: flex; align-items: center; justify-content: space-between;
        }

        .scanner-title { font-size: 17px; font-weight: 600; color: #ffffff; }

        .scanner-body {
            width: 100%; flex: 1; display: flex;
            flex-direction: column; justify-content: center; align-items: center;
        }

        .scanner-frame-box {
            width: 240px; height: 240px; position: relative;
            display: flex; justify-content: center; align-items: center;
            border: 2px dashed rgba(255, 255, 255, 0.3); border-radius: 24px;
        }

        #camera-preview-full {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%; object-fit: cover;
            z-index: -1; display: none;
        }

        .scanner-footer-actions {
            width: 100%; display: flex; justify-content: space-around; align-items: center;
        }

        .scanner-action-btn {
            background: transparent; border: none; display: flex;
            flex-direction: column; align-items: center; gap: 8px;
            cursor: pointer; color: white; font-size: 13px;
        }

        .scanner-icon-circle {
            width: 50px; height: 50px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px); border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
        }

        .my-qr-screen {
            background: var(--bg-app); z-index: 110;
            justify-content: space-between; align-items: center;
            padding: 20px 16px 35px 16px;
        }

        .modern-qr-card {
            width: 100%; max-width: 300px;
            background: var(--qr-card-bg); backdrop-filter: blur(20px);
            border: 1px solid var(--qr-card-border); border-radius: 32px;
            padding: 30px 20px; display: flex; justify-content: center; align-items: center;
        }

        .my-qr-code-box { padding: 16px; background: var(--qr-box-bg); border-radius: 24px; }

        .my-qr-bottom-actions { width: 100%; max-width: 300px; display: flex; gap: 12px; }

        .my-qr-btn {
            flex: 1; background: var(--bg-card); border: 1px solid var(--border-color);
            border-radius: 20px; padding: 14px 10px; display: flex; flex-direction: column;
            align-items: center; gap: 6px; cursor: pointer; color: var(--text-main); font-size: 13px;
        }

        .chat-view { z-index: 120; background: var(--bg-app); }

        .chat-view-header {
            padding: 12px 16px; background: var(--bg-header);
            border-bottom: 1px solid var(--border-color); display: flex; align-items: center; gap: 12px;
        }

        .chat-view-body {
            flex: 1; padding: 16px; overflow-y: auto;
            display: flex; flex-direction: column; gap: 8px; background: #000000;
        }

        .msg-bubble {
            max-width: 72%; padding: 10px 14px; border-radius: 18px;
            font-size: 14px; line-height: 1.4; word-wrap: break-word;
        }

        .msg-left { background: var(--bg-bubble-left); color: var(--text-main); border-bottom-left-radius: 4px; align-self: flex-start; }
        .msg-right { background: var(--bg-bubble-right); color: #ffffff; border-bottom-right-radius: 4px; align-self: flex-end; }

        .chat-view-footer {
            padding: 10px 16px; background: var(--bg-header);
            border-top: 1px solid var(--border-color); display: flex; align-items: center; gap: 10px;
        }

        .chat-input {
            flex: 1; background: var(--bg-search); border: 1px solid var(--border-color);
            outline: none; color: var(--text-main); padding: 10px 16px; border-radius: 20px; font-size: 14px;
        }

        .send-btn { background: transparent; border: none; cursor: pointer; }
    </style>
</head>
<body>

    <div class="app-container">

        <!-- Splash Logo -->
        <div class="splash-screen" id="splashScreen">
            <img src="https://i.ibb.co/qF7z5b41/image.png" alt="Logo" class="splash-logo">
            <div class="footer-text">by tien</div>
        </div>

        <!-- Màn hình chính chứa các tab chuyển đổi -->
        <div class="main-content">
            
            <!-- Tab 1: Trang chủ (Home) -->
            <div class="tab-view" id="tabHome">
                <div class="generic-tab-content">
                    <h2 style="font-size: 20px;">Trang Chủ</h2>
                    <p style="color: var(--text-sub); font-size: 14px;">Nội dung trang chủ ứng dụng scarlet.</p>
                </div>
            </div>

            <!-- Tab 2: Bản đồ / Tìm bạn bè xung quanh (Map) -->
            <div class="tab-view" id="tabMap">
                <div class="nearby-container">
                    <div class="nearby-header">
                        <div class="nearby-title">Bạn bè quanh đây</div>
                        <button class="scan-radar-btn" onclick="scanNearbyFriends()">Quét lại</button>
                    </div>
                    <div class="nearby-list" id="nearbyList">
                        <!-- Danh sách bạn bè gần đây sẽ được render bằng JS -->
                    </div>
                </div>
            </div>

            <!-- Tab 3: Tìm kiếm (Search) -->
            <div class="tab-view" id="tabSearch">
                <div class="generic-tab-content">
                    <h2 style="font-size: 20px;">Khám Phá & Tìm Kiếm</h2>
                    <p style="color: var(--text-sub); font-size: 14px;">Sử dụng cài đặt hoặc tìm kiếm hình ảnh nâng cao tại đây.</p>
                </div>
            </div>

            <!-- Tab 4: Trò chuyện / Chat List (Mặc định mở) -->
            <div class="tab-view active" id="tabChat">
                <div class="chat-list-container">
                    <div class="chat-list-header">
                        <div class="header-title">Đoạn chat</div>
                        <div class="header-actions">
                            <button class="settings-icon-btn" onclick="openSettings()" title="Cài đặt">
                                <svg class="svg-icon" viewBox="0 0 24 24">
                                    <circle cx="12" cy="12" r="3"></circle>
                                    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                                </svg>
                            </button>
                        </div>
                    </div>

                    <div class="search-container">
                        <div class="search-box">
                            <svg class="svg-icon" viewBox="0 0 24 24">
                                <circle cx="11" cy="11" r="8"></circle>
                                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                            </svg>
                            <input type="text" id="searchInput" oninput="renderChatList()" placeholder="Tìm kiếm bạn bè...">
                        </div>
                    </div>

                    <div class="chat-list" id="chatList"></div>
                </div>
            </div>

        </div>

        <!-- THANH ĐIỀU HƯỚNG DƯỚI CÙNG -->
        <div class="bottom-nav-wrapper" id="bottomNavWrapper">
            <nav class="bottom-nav">
                <!-- Nút 1: Trang chủ -->
                <button class="nav-item" onclick="switchTab('tabHome', this)">
                    <svg class="svg-icon" viewBox="0 0 24 24">
                        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                        <polyline points="9 22 9 12 15 12 15 22"></polyline>
                    </svg>
                </button>
                <!-- Nút 2: Bản đồ (Tìm bạn quanh đây) -->
                <button class="nav-item" onclick="switchTab('tabMap', this)">
                    <svg class="svg-icon" viewBox="0 0 24 24">
                        <polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"></polygon>
                        <line x1="8" y1="2" x2="8" y2="18"></line>
                        <line x1="16" y1="6" x2="16" y2="22"></line>
                    </svg>
                </button>
                <!-- Nút 3: Tìm kiếm -->
                <button class="nav-item" onclick="switchTab('tabSearch', this)">
                    <svg class="svg-icon" viewBox="0 0 24 24">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                </button>
                <!-- Nút 4: Tin nhắn -->
                <button class="nav-item active" onclick="switchTab('tabChat', this)">
                    <svg class="svg-icon" viewBox="0 0 24 24">
                        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                    </svg>
                </button>
            </nav>
        </div>

        <!-- Màn hình Cài đặt -->
        <div class="settings-screen" id="settingsScreen">
            <div class="settings-header">
                <button class="back-btn" onclick="closeSettings()" title="Quay lại">
                    <svg class="svg-icon" viewBox="0 0 24 24">
                        <line x1="19" y1="12" x2="5" y2="12"></line>
                        <polyline points="12 19 5 12 12 5"></polyline>
                    </svg>
                </button>
                <div style="font-size: 16px; font-weight: bold;">Cài đặt</div>
            </div>
            <div class="settings-content">
                <div class="settings-item" onclick="openQRScannerScreen()">
                    <div class="settings-item-title">Mã QR của bạn</div>
                    <svg class="svg-icon" viewBox="0 0 24 24">
                        <rect x="3" y="3" width="7" height="7"></rect>
                        <rect x="14" y="3" width="7" height="7"></rect>
                        <rect x="3" y="14" width="7" height="7"></rect>
                        <path d="M14 14h3v3h-3z"></path>
                    </svg>
                </div>

                <div class="image-search-box">
                    <div class="settings-item-title">Tìm kiếm hình ảnh tương tự</div>
                    <div class="image-search-actions">
                        <input type="text" id="direct-url-input" class="url-input-box" placeholder="Dán URL hình ảnh..." oninput="handleUrlInputChange(event)">
                        <button class="library-btn" onclick="document.getElementById('similar-img-input').click()">
                            <svg class="svg-icon" viewBox="0 0 24 24">
                                <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                                <circle cx="8.5" cy="8.5" r="1.5"></circle>
                                <polyline points="21 15 16 10 5 21"></polyline>
                            </svg>
                            <span>Hoặc chọn từ thư viện</span>
                        </button>
                        <input type="file" id="similar-img-input" accept="image/*" style="display: none;" onchange="handleSimilarImageSelect(event)">
                    </div>
                    <img id="similar-img-preview" class="preview-img" alt="Xem trước ảnh">
                    <button id="similar-img-search-btn" class="search-submit-btn" onclick="executeDirectImageSearch()">Tìm kiếm hình ảnh</button>
                    
                    <div id="search-results-container" class="search-results-container" style="display: none;"></div>
                </div>
            </div>
        </div>

        <!-- QR Scanner -->
        <div class="qr-scanner-screen" id="qrScannerScreen">
            <video id="camera-preview-full" playsinline></video>
            
            <div class="scanner-header">
                <button class="back-btn" onclick="closeQRScannerScreen()">
                    <svg class="svg-icon" viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
                </button>
                <div class="scanner-title">Quét</div>
                <div style="width: 24px;"></div>
            </div>

            <div class="scanner-body">
                <div class="scanner-frame-box"></div>
                <div class="scanner-instruction" style="margin-top:20px; color:#fff;">Quét mã QR để kết nối</div>
            </div>

            <div class="scanner-footer-actions">
                <button class="scanner-action-btn" onclick="openMyQRScreen()">
                    <div class="scanner-icon-circle">
                        <svg class="svg-icon" viewBox="0 0 24 24" style="stroke: #fff;"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect><path d="M14 14h3v3h-3z"></path></svg>
                    </div>
                    <span>Mã QR của tôi</span>
                </button>
                <button class="scanner-action-btn" onclick="document.getElementById('gallery-input').click()">
                    <div class="scanner-icon-circle">
                        <svg class="svg-icon" viewBox="0 0 24 24" style="stroke: #fff;"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
                    </div>
                    <span>Thư viện</span>
                </button>
                <input type="file" id="gallery-input" accept="image/*" style="display:none;" onchange="scanQRCodeFromGallery(event)">
            </div>
        </div>

        <!-- Mã QR Cá Nhân -->
        <div class="my-qr-screen" id="myQRScreen">
            <div class="my-qr-header">
                <button class="back-btn" onclick="closeMyQRScreen()">
                    <svg class="svg-icon" viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
                </button>
            </div>

            <div class="modern-qr-card">
                <div class="my-qr-code-box" id="myQRCodeBox"></div>
            </div>

            <div class="my-qr-bottom-actions">
                <button class="my-qr-btn" onclick="copyMyLink()">
                    <span>Sao chép Liên kết</span>
                </button>
            </div>
        </div>

        <!-- Chat View -->
        <div class="chat-view" id="chatView">
            <div class="chat-view-header">
                <button class="back-btn" onclick="closeChatView()">
                    <svg class="svg-icon" viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
                </button>
                <div class="chat-avatar" id="chatViewAvatar" style="width: 36px; height: 36px; font-size: 14px;">?</div>
                <div style="font-size: 16px; font-weight: bold; color: var(--text-main);" id="chatViewTitle">Người dùng</div>
            </div>
            <div class="chat-view-body" id="chatViewBody"></div>
            <div class="chat-view-footer">
                <input type="text" class="chat-input" id="chatInput" placeholder="Nhắn tin..." onkeypress="handleKeyPress(event)">
                <button class="send-btn" onclick="sendMessage()">
                    <svg class="svg-icon" viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                </button>
            </div>
        </div>

    </div>

    <script>
        if ('serviceWorker' in navigator && location.protocol === 'https:') {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').catch((err) => {
                    console.log('ServiceWorker chưa sẵn sàng:', err);
                });
            });
        }

        let chatData = JSON.parse(localStorage.getItem('scarlet_chats')) || [];
        let activeChatId = null;
        let videoStream = null;
        let qrInstance = null;
        let selectedBase64Image = null;
        let activeImageUrl = null;

        // Dữ liệu mẫu tìm bạn bè gần đây trên bản đồ
        let nearbyUsers = [
            { id: "nearby_01", name: "Hoàng Minh", distance: "Cách đây 120m" },
            { id: "nearby_02", name: "Ngọc Anh", distance: "Cách đây 350m" },
            { id: "nearby_03", name: "Thanh Tùng", distance: "Cách đây 600m" },
            { id: "nearby_04", name: "Khánh Linh", distance: "Cách đây 1.2km" }
        ];

        function generateQRCode() {
            const qrBox = document.getElementById("myQRCodeBox");
            qrBox.innerHTML = ''; 

            qrInstance = new QRCode(qrBox, {
                text: "USER_CONNECT_CODE_8888",
                width: 175,
                height: 175,
                colorDark: "#000000",
                colorLight: "#ffffff",
                correctLevel: QRCode.CorrectLevel.H
            });
        }

        window.addEventListener('DOMContentLoaded', () => {
            generateQRCode();
            renderNearbyFriends();

            setTimeout(() => {
                const splash = document.getElementById('splashScreen');
                if (splash) {
                    splash.classList.add('fade-out');
                    renderChatList();
                    setTimeout(() => {
                        splash.style.display = 'none';
                    }, 600);
                }
            }, 1850);
        });

        /* Hàm chuyển đổi qua lại giữa các tab */
        function switchTab(tabId, element) {
            document.querySelectorAll('.tab-view').forEach(view => {
                view.classList.remove('active');
            });
            document.getElementById(tabId).classList.add('active');

            document.querySelectorAll('.bottom-nav .nav-item').forEach(btn => {
                btn.classList.remove('active');
            });
            element.classList.add('active');
        }

        /* Render danh sách bạn bè gần đây vào tab Bản đồ */
        function renderNearbyFriends() {
            const listEl = document.getElementById('nearbyList');
            if (!listEl) return;
            listEl.innerHTML = '';

            nearbyUsers.forEach(user => {
                const card = document.createElement('div');
                card.className = 'nearby-user-card';
                card.innerHTML = `
                    <div class="nearby-user-info">
                        <div class="nearby-avatar">${user.name.charAt(0)}</div>
                        <div class="nearby-details">
                            <div class="nearby-name">${user.name}</div>
                            <div class="nearby-distance">${user.distance}</div>
                        </div>
                    </div>
                    <button class="connect-friend-btn" onclick="connectNearbyUser('${user.id}', '${user.name}')">Nhắn tin</button>
                `;
                listEl.appendChild(card);
            });
        }

        function scanNearbyFriends() {
            const btn = document.querySelector('.scan-radar-btn');
            btn.innerText = "Đang quét...";
            setTimeout(() => {
                btn.innerText = "Quét lại";
                renderNearbyFriends();
            }, 800);
        }

        function connectNearbyUser(id, name) {
            let existing = chatData.find(c => c.id === id);
            if (!existing) {
                existing = { id: id, name: name, messages: [] };
                chatData.unshift(existing);
                localStorage.setItem('scarlet_chats', JSON.stringify(chatData));
            }
            // Chuyển thẳng sang tab Tin nhắn và mở khung chat
            document.querySelectorAll('.tab-view').forEach(v => v.classList.remove('active'));
            document.getElementById('tabChat').classList.add('active');
            
            document.querySelectorAll('.bottom-nav .nav-item').forEach(b => b.classList.remove('active'));
            // Nút thứ 4 là tab chat
            document.querySelectorAll('.bottom-nav .nav-item')[3].classList.add('active');

            renderChatList();
            openChatView(id);
        }

        function openSettings() { document.getElementById('settingsScreen').style.display = 'flex'; }
        function closeSettings() { document.getElementById('settingsScreen').style.display = 'none'; }

        function handleUrlInputChange(e) {
            const url = e.target.value.trim();
            const previewImg = document.getElementById('similar-img-preview');
            const searchBtn = document.getElementById('similar-img-search-btn');
            const resultsContainer = document.getElementById('search-results-container');

            if (url) {
                activeImageUrl = url;
                selectedBase64Image = null;
                previewImg.src = url;
                previewImg.style.display = 'block';
                searchBtn.style.display = 'block';
                resultsContainer.style.display = 'none';
            } else {
                activeImageUrl = null;
                previewImg.style.display = 'none';
                searchBtn.style.display = 'none';
            }
        }

        function handleSimilarImageSelect(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const previewImg = document.getElementById('similar-img-preview');
                const searchBtn = document.getElementById('similar-img-search-btn');
                const resultsContainer = document.getElementById('search-results-container');

                selectedBase64Image = e.target.result;
                activeImageUrl = null;
                document.getElementById('direct-url-input').value = '';
                previewImg.src = selectedBase64Image;
                previewImg.style.display = 'block';
                searchBtn.style.display = 'block';
                
                resultsContainer.style.display = 'none';
                resultsContainer.innerHTML = '';
            };
            reader.readAsDataURL(file);
        }

        async function executeDirectImageSearch() {
            if (!selectedBase64Image && !activeImageUrl) return;

            const searchBtn = document.getElementById('similar-img-search-btn');
            const resultsContainer = document.getElementById('search-results-container');
            
            searchBtn.disabled = true;
            searchBtn.innerText = "Đang quét hình ảnh...";
            resultsContainer.style.display = 'grid';
            resultsContainer.innerHTML = "<div style='color:var(--text-sub); font-size:12px; grid-column:span 2; padding:20px; text-align:center;'>Đang tải dữ liệu trực tiếp...</div>";

            try {
                const queryKeyword = "wallpaper"; 
                const response = await fetch(`https://commons.wikimedia.org/w/api.php?action=query&generator=search&prop=pageimages|info&piprop=thumbnail&pithumbsize=300&inprop=url&gsrsearch=${queryKeyword}&gsrlimit=10&format=json&origin=*`);
                const data = await response.json();

                resultsContainer.innerHTML = "";

                if (data.query && data.query.pages) {
                    const pages = Object.values(data.query.pages);
                    pages.forEach(page => {
                        if (page.thumbnail && page.thumbnail.source) {
                            renderResultCard(resultsContainer, {
                                imgUrl: page.thumbnail.source,
                                title: page.title.replace('File:', ''),
                                source: 'Wikimedia'
                            });
                        }
                    });
                } else {
                    resultsContainer.innerHTML = "<div style='color:var(--text-sub); font-size:12px; grid-column:span 2; padding:20px; text-align:center;'>Không tìm thấy ảnh tương tự.</div>";
                }

            } catch (error) {
                console.error("Lỗi:", error);
                resultsContainer.innerHTML = `<div style='color:#ff4d4d; font-size:12px; grid-column:span 2; padding:15px; text-align:center;'>Không thể tải kết quả. Vui lòng kiểm tra lại kết nối.</div>`;
            } finally {
                searchBtn.disabled = false;
                searchBtn.innerText = "Tìm kiếm hình ảnh";
            }
        }

        function renderResultCard(container, data) {
            const card = document.createElement("div");
            card.className = "result-card";

            const mediaWrapper = document.createElement("div");
            mediaWrapper.className = "media-wrapper";

            const imgEl = document.createElement("img");
            imgEl.className = "result-card-media";
            imgEl.src = data.imgUrl;
            imgEl.alt = data.title || "Hình ảnh";
            imgEl.loading = "lazy";
            
            imgEl.onerror = function() {
                this.onerror = null;
                this.src = "data:image/svg+xml;charset=UTF-8,%3Csvg%20width%3D%22150%22%20height%3D%22120%22%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%3E%3Crect%20width%3D%22100%25%22%20height%3D%22100%25%22%20fill%3D%22%23222%22%2F%3E%3Ctext%20x%3D%2250%25%22%20y%3D%2250%25%22%20fill%3D%22%23777%22%20text-anchor%3D%22middle%22%20font-size%3D%2212%22%3ELỗi%20ảnh%3C%2Ftext%3E%3C%2Fsvg%3E";
            };

            mediaWrapper.appendChild(imgEl);
            card.appendChild(mediaWrapper);

            const titleEl = document.createElement("div");
            titleEl.className = "result-card-title";
            titleEl.innerText = data.title || "Hình ảnh tương tự";
            card.appendChild(titleEl);

            const sourceEl = document.createElement("div");
            sourceEl.className = "result-card-source";
            sourceEl.innerText = data.source || "Thư viện ảnh";
            card.appendChild(sourceEl);

            container.appendChild(card);
        }

        async function openQRScannerScreen() {
            closeSettings();
            document.getElementById('qrScannerScreen').style.display = 'flex';
            try {
                videoStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
                const video = document.getElementById('camera-preview-full');
                video.style.display = 'block';
                video.srcObject = videoStream;
                video.play();
                requestAnimationFrame(tickCameraScan);
            } catch (err) {
                alert("Hãy cấp quyền Camera trên HTTPS.");
            }
        }

        function closeQRScannerScreen() {
            stopCamera();
            document.getElementById('qrScannerScreen').style.display = 'none';
        }

        function stopCamera() {
            if (videoStream) {
                videoStream.getTracks().forEach(track => track.stop());
                videoStream = null;
            }
        }

        function tickCameraScan() {
            const scannerScreen = document.getElementById('qrScannerScreen');
            if (scannerScreen.style.display !== 'flex') return;

            const video = document.getElementById('camera-preview-full');
            if (video.readyState === video.HAVE_ENOUGH_DATA) {
                const canvas = document.createElement('canvas');
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                
                const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                const code = jsQR(imageData.data, imageData.width, imageData.height);

                if (code) {
                    stopCamera();
                    addFriendFromQRData(code.data);
                    return;
                }
            }
            requestAnimationFrame(tickCameraScan);
        }

        function scanQRCodeFromGallery(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const context = canvas.getContext('2d');
                    canvas.width = img.width;
                    canvas.height = img.height;
                    context.drawImage(img, 0, 0, img.width, img.height);
                    
                    const imageData = context.getImageData(0, 0, canvas.width, canvas.height);
                    const code = jsQR(imageData.data, imageData.width, imageData.height);

                    if (code) {
                        closeQRScannerScreen();
                        addFriendFromQRData(code.data);
                    } else {
                        alert("Không tìm thấy mã QR.");
                    }
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function openMyQRScreen() {
            stopCamera();
            document.getElementById('qrScannerScreen').style.display = 'none';
            document.getElementById('myQRScreen').style.display = 'flex';
        }

        function closeMyQRScreen() { document.getElementById('myQRScreen').style.display = 'none'; }

        function copyMyLink() { alert("Đã sao chép liên kết!"); }

        function addFriendFromQRData(qrContent) {
            let friendName = "Người dùng (" + qrContent.substring(0, 6) + ")";
            let existing = chatData.find(c => c.id === qrContent);
            if (!existing) {
                existing = { id: qrContent, name: friendName, messages: [] };
                chatData.unshift(existing);
                localStorage.setItem('scarlet_chats', JSON.stringify(chatData));
            }
            renderChatList();
            openChatView(existing.id);
        }

        function renderChatList() {
            const chatListEl = document.getElementById('chatList');
            const searchInputEl = document.getElementById('searchInput');
            if (!chatListEl || !searchInputEl) return;

            const searchVal = searchInputEl.value.toLowerCase();
            chatListEl.innerHTML = '';

            const filteredChats = chatData.filter(c => c.name.toLowerCase().includes(searchVal));

            if (filteredChats.length === 0) {
                chatListEl.innerHTML = `<div class="empty-chat-state">Chưa có cuộc trò chuyện nào.<br>Vào Cài đặt để mở Mã QR kết nối.</div>`;
                return;
            }

            filteredChats.forEach(chat => {
                const lastMsg = chat.messages.length > 0 ? chat.messages[chat.messages.length - 1].text : 'Hãy bắt đầu trò chuyện!';
                const item = document.createElement('div');
                item.className = 'chat-item';
                item.onclick = () => openChatView(chat.id);
                item.innerHTML = `
                    <div class="chat-avatar">${chat.name.charAt(0).toUpperCase()}</div>
                    <div class="chat-info">
                        <div class="chat-name">${chat.name}</div>
                        <div class="chat-last-msg">${lastMsg}</div>
                    </div>
                `;
                chatListEl.appendChild(item);
            });
        }

        function openChatView(chatId) {
            activeChatId = chatId;
            const chat = chatData.find(c => c.id === chatId);
            if (!chat) return;

            document.getElementById('chatViewTitle').innerText = chat.name;
            document.getElementById('chatViewAvatar').innerText = chat.name.charAt(0).toUpperCase();
            document.getElementById('chatView').style.display = 'flex';
            renderMessages();
        }

        function closeChatView() {
            activeChatId = null;
            document.getElementById('chatView').style.display = 'none';
            renderChatList();
        }

        function renderMessages() {
            const chat = chatData.find(c => c.id === activeChatId);
            const body = document.getElementById('chatViewBody');
            body.innerHTML = '';
            if (!chat) return;

            chat.messages.forEach(msg => {
                const bubble = document.createElement('div');
                bubble.className = `msg-bubble ${msg.sender === 'me' ? 'msg-right' : 'msg-left'}`;
                bubble.innerText = msg.text;
                body.appendChild(bubble);
            });
            body.scrollTop = body.scrollHeight;
        }

        function sendMessage() {
            const input = document.getElementById('chatInput');
            const text = input.value.trim();
            if (!text || !activeChatId) return;

            const chat = chatData.find(c => c.id === activeChatId);
            if (!chat) return;

            chat.messages.push({ sender: 'me', text: text });
            input.value = '';
            renderMessages();
            localStorage.setItem('scarlet_chats', JSON.stringify(chatData));
        }

        function handleKeyPress(e) { if (e.key === 'Enter') sendMessage(); }
    </script>
</body>
</html>
