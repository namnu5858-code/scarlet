<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Gửi đến...</title>
<style>
  :root {
    --bg: #0f0f11;
    --card-bg: #1c1c1e;
    --pill-bg: rgba(24, 24, 27, 0.78);
    --pill-border: rgba(255, 255, 255, 0.14);
    --text: #ffffff;
    --muted: #a1a1aa;
    --accent: #facc15;
    --send-bg: #2c2c2e;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    overflow: hidden;
    user-select: none;
  }

  .app {
    height: 100dvh;
    max-width: 430px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 14px 16px 20px;
    position: relative;
  }

  /* Header */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 44px;
    padding: 0 4px;
  }

  .header-spacer {
    width: 36px;
    height: 36px;
  }

  .header-title {
    font-size: 18px;
    font-weight: 700;
    letter-spacing: -0.01em;
  }

  .download-btn {
    width: 36px;
    height: 36px;
    border: none;
    background: transparent;
    color: #fff;
    display: grid;
    place-items: center;
    cursor: pointer;
    border-radius: 50%;
    transition: transform 0.15s ease, background 0.15s ease;
  }

  .download-btn:active {
    transform: scale(0.92);
    background: rgba(255, 255, 255, 0.08);
  }

  /* Preview Card */
  .stage {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 0;
    padding: 8px 0;
  }

  .photo-card {
    position: relative;
    width: 100%;
    aspect-ratio: 1 / 1;
    max-height: 54dvh;
    border-radius: 34px;
    overflow: hidden;
    background: #27272a;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.55);
  }

  .photo-card img,
  .photo-card video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  /* Overlay Widget Area */
  .overlay-zone {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 18px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    z-index: 5;
    padding: 0 16px;
  }

  .widget-pill {
    min-height: 40px;
    padding: 8px 16px;
    border-radius: 999px;
    background: var(--pill-bg);
    border: 1px solid var(--pill-border);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    color: #fff;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
    transition: transform 0.16s ease, opacity 0.2s ease, background 0.2s ease;
    max-width: 100%;
  }

  .widget-pill:active {
    transform: scale(0.96);
  }

  /* Stars */
  .stars-row {
    display: inline-flex;
    align-items: center;
    gap: 5px;
  }

  .star-btn {
    border: none;
    background: transparent;
    cursor: pointer;
    padding: 2px;
    display: grid;
    place-items: center;
    transition: transform 0.14s ease;
  }

  .star-btn:hover {
    transform: scale(1.12);
  }

  .star-btn svg {
    width: 22px;
    height: 22px;
    fill: #52525b;
    transition: fill 0.15s ease;
  }

  .star-btn.active svg {
    fill: var(--accent);
  }

  .review-caption {
    font-size: 13px;
    color: #e4e4e7;
    font-weight: 500;
    animation: fadeSlideUp 0.22s ease;
  }

  @keyframes fadeSlideUp {
    from {
      opacity: 0;
      transform: translateY(5px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  /* Message / Rating Input Box */
  .input-pill {
    width: 100%;
    max-width: 320px;
    background: var(--pill-bg);
    border: 1px solid var(--pill-border);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    border-radius: 20px;
    padding: 8px 12px;
    display: none;
    align-items: center;
    gap: 8px;
    animation: fadeSlideUp 0.2s ease;
  }

  .input-pill.open {
    display: flex;
  }

  .input-pill input {
    flex: 1;
    border: none;
    outline: none;
    background: transparent;
    color: #fff;
    font-size: 14px;
    min-width: 0;
  }

  .input-pill input::placeholder {
    color: var(--muted);
  }

  .input-pill button {
    border: none;
    background: rgba(255, 255, 255, 0.14);
    color: #fff;
    border-radius: 12px;
    padding: 5px 10px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
  }

  /* Pagination Dots */
  .dots {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    margin-top: 14px;
  }

  .dot {
    width: 7px;
    height: 7px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.28);
    border: none;
    cursor: pointer;
    transition: width 0.2s ease, background 0.2s ease;
  }

  .dot.active {
    width: 18px;
    background: #ffffff;
  }

  /* Action Row: X | Send | Aa */
  .actions {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 18px 8px;
  }

  .btn-x {
    width: 58px;
    height: 58px;
    border-radius: 50%;
    border: none;
    background: transparent;
    color: #ffffff;
    display: grid;
    place-items: center;
    cursor: pointer;
    transition: transform 0.15s ease, background 0.15s ease;
  }

  .btn-x:active {
    transform: scale(0.9);
    background: rgba(255, 255, 255, 0.08);
  }

  .btn-send {
    width: 78px;
    height: 78px;
    border-radius: 50%;
    border: none;
    background: var(--send-bg);
    color: #ffffff;
    display: grid;
    place-items: center;
    cursor: pointer;
    box-shadow: 0 10px 28px rgba(0, 0, 0, 0.45);
    transition: transform 0.15s ease, background 0.15s ease;
  }

  .btn-send:active {
    transform: scale(0.93);
    background: #3a3a3c;
  }

  .btn-aa {
    width: 54px;
    height: 54px;
    border-radius: 50%;
    border: 1px solid rgba(255, 255, 255, 0.16);
    background: rgba(255, 255, 255, 0.08);
    color: #ffffff;
    font-size: 17px;
    font-weight: 700;
    display: grid;
    place-items: center;
    cursor: pointer;
    transition: transform 0.15s ease, background 0.15s ease;
  }

  .btn-aa:active {
    transform: scale(0.92);
    background: rgba(255, 255, 255, 0.16);
  }

  /* Recipients Row */
  .recipients {
    display: flex;
    align-items: flex-start;
    justify-content: center;
    gap: 20px;
    padding-top: 6px;
  }

  .recipient-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    cursor: pointer;
    min-width: 58px;
  }

  .avatar-ring {
    width: 52px;
    height: 52px;
    border-radius: 50%;
    padding: 2px;
    border: 2px solid transparent;
    display: grid;
    place-items: center;
    transition: border-color 0.15s ease, transform 0.15s ease;
  }

  .recipient-item.selected .avatar-ring {
    border-color: var(--accent);
    transform: scale(1.04);
  }

  .avatar-inner {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    background: #27272a;
    display: grid;
    place-items: center;
    overflow: hidden;
    font-size: 16px;
    font-weight: 700;
    color: #fff;
  }

  .recipient-name {
    font-size: 12px;
    color: #e4e4e7;
    max-width: 72px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* Bottom Sheet Modal */
  .sheet-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.65);
    display: none;
    align-items: flex-end;
    justify-content: center;
    z-index: 40;
  }

  .sheet-backdrop.open {
    display: flex;
  }

  .sheet {
    width: 100%;
    max-width: 430px;
    max-height: 76dvh;
    background: #18181b;
    border-top-left-radius: 24px;
    border-top-right-radius: 24px;
    padding: 12px 16px 28px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    animation: sheetUp 0.22s ease;
  }

  @keyframes sheetUp {
    from {
      transform: translateY(100%);
    }
    to {
      transform: translateY(0);
    }
  }

  .sheet-handle {
    width: 40px;
    height: 4px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.25);
    margin: 0 auto 4px;
  }

  .search-box {
    width: 100%;
    padding: 11px 14px;
    border-radius: 14px;
    border: 1px solid rgba(255, 255, 255, 0.12);
    background: #27272a;
    color: #fff;
    font-size: 14px;
    outline: none;
  }

  .search-box::placeholder {
    color: var(--muted);
  }

  .sheet-list {
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .sheet-option {
    padding: 12px 14px;
    border-radius: 14px;
    background: rgba(255, 255, 255, 0.04);
    border: none;
    color: #fff;
    font-size: 14px;
    text-align: left;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .sheet-option:hover {
    background: rgba(255, 255, 255, 0.1);
  }

  .status-msg {
    font-size: 13px;
    color: var(--muted);
    text-align: center;
    padding: 8px 4px;
  }

  .toast {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%) translateY(-20px);
    background: rgba(39, 39, 42, 0.95);
    color: #fff;
    border: 1px solid rgba(255, 255, 255, 0.14);
    padding: 10px 16px;
    border-radius: 999px;
    font-size: 13px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease, transform 0.2s ease;
    z-index: 60;
  }

  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
</style>
</head>
<body>
<div class="app" id="app">
  <!-- Header -->
  <header class="header">
    <div class="header-spacer"></div>
    <div class="header-title">Gửi đến...</div>
    <button class="download-btn" id="downloadBtn" title="Tải ảnh" aria-label="Tải ảnh">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 3v12"></path>
        <path d="m7 10 5 5 5-5"></path>
        <path d="M5 20h14"></path>
      </svg>
    </button>
  </header>

  <!-- Main Card Stage -->
  <main class="stage">
    <div class="photo-card" id="photoCard">
      <img id="previewImage" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='800' height='800'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0%' stop-color='%23d4d4d8'/><stop offset='100%' stop-color='%2371717a'/></linearGradient></defs><rect width='800' height='800' fill='url(%23g)'/></svg>" alt="Ảnh xem trước" />

      <div class="overlay-zone">
        <!-- Dynamic Widget (Mặc định: Thêm vị trí) -->
        <div id="widgetContainer"></div>

        <!-- Ô nhập tin nhắn / ghi chú (hiện khi bấm Aa hoặc sau khi chọn sao) -->
        <div class="input-pill" id="messageBox">
          <input type="text" id="messageInput" placeholder="Thêm một tin nhắn..." />
          <button id="saveMessageBtn" type="button">Xong</button>
        </div>
      </div>
    </div>

    <!-- Dots -->
    <div class="dots" id="dots">
      <button class="dot active" data-mode="location" aria-label="Vị trí"></button>
      <button class="dot" data-mode="rating" aria-label="Đánh giá"></button>
      <button class="dot" data-mode="music" aria-label="Bài hát"></button>
      <button class="dot" data-mode="message" aria-label="Tin nhắn"></button>
      <button class="dot" data-mode="weather" aria-label="Thời tiết"></button>
    </div>
  </main>

  <!-- Action Buttons: X | Send | Aa -->
  <section class="actions">
    <button class="btn-x" id="closeBtn" title="Đóng / Đặt lại" aria-label="Đóng">
      <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    </button>

    <button class="btn-send" id="sendBtn" title="Gửi" aria-label="Gửi">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M22 2 11 13"></path>
        <path d="M22 2 15 22 11 13 2 9 22 2z"></path>
      </svg>
    </button>

    <button class="btn-aa" id="aaBtn" title="Viết tin nhắn" aria-label="Viết tin nhắn">Aa</button>
  </section>

  <!-- Recipients -->
  <section class="recipients" id="recipients">
    <div class="recipient-item selected" data-recipient="Tất cả">
      <div class="avatar-ring">
        <div class="avatar-inner">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
            <circle cx="9" cy="7" r="4"></circle>
            <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
            <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
          </svg>
        </div>
      </div>
      <span class="recipient-name">Tất cả</span>
    </div>

    <div class="recipient-item" data-recipient="w">
      <div class="avatar-ring">
        <div class="avatar-inner">w</div>
      </div>
      <span class="recipient-name">w</span>
    </div>

    <div class="recipient-item" data-recipient="callme...">
      <div class="avatar-ring">
        <div class="avatar-inner">C</div>
      </div>
      <span class="recipient-name">callme...</span>
    </div>
  </section>
</div>

<!-- Sheet chọn Vị trí / Bài hát -->
<div class="sheet-backdrop" id="sheetBackdrop">
  <div class="sheet" role="dialog" aria-modal="true">
    <div class="sheet-handle"></div>
    <input type="text" class="search-box" id="sheetSearch" placeholder="Tìm kiếm..." />
    <div class="status-msg" id="sheetStatus"></div>
    <div class="sheet-list" id="sheetList"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  const state = {
    mode: "location", // Ban đầu luôn hiển thị "Thêm vị trí"
    locationText: "",
    stars: 0,
    reviewText: "",
    songText: "",
    messageText: "",
    weatherText: "",
    recipient: "Tất cả",
    sheetType: null
  };

  const sampleSongs = [
    "Lạc Trôi - Sơn Tùng M-TP",
    "Bầu Trời Mới - Minh Tốc & Lam",
    "Nàng Thơ - Hoàng Dũng",
    "Một Đêm Say - Thịnh Suy",
    "Chạy Về Khóc Với Anh - ERik",
    "Có Hẹn Với Thanh Xuân - MONSTAR"
  ];

  const fallbackPlaces = [
    "Ba Vì, Hà Nội",
    "Sơn Tây, Hà Nội",
    "Quảng Oai, Hà Nội",
    "Cầu Giấy, Hà Nội",
    "Hoàn Kiếm, Hà Nội"
  ];

  const widgetContainer = document.getElementById("widgetContainer");
  const messageBox = document.getElementById("messageBox");
  const messageInput = document.getElementById("messageInput");
  const saveMessageBtn = document.getElementById("saveMessageBtn");
  const sheetBackdrop = document.getElementById("sheetBackdrop");
  const sheetSearch = document.getElementById("sheetSearch");
  const sheetStatus = document.getElementById("sheetStatus");
  const sheetList = document.getElementById("sheetList");
  const toastEl = document.getElementById("toast");

  function showToast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    clearTimeout(showToast._t);
    showToast._t = setTimeout(() => toastEl.classList.remove("show"), 2400);
  }

  function setMode(newMode) {
    state.mode = newMode;
    document.querySelectorAll(".dot").forEach((dot) => {
      dot.classList.toggle("active", dot.dataset.mode === newMode);
    });
    renderWidget();
  }

  function renderWidget() {
    widgetContainer.innerHTML = "";

    if (state.mode === "location") {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "widget-pill";
      btn.innerHTML = `
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"></path>
          <circle cx="12" cy="10" r="3"></circle>
        </svg>
        <span>${state.locationText || "Thêm vị trí"}</span>
      `;
      btn.addEventListener("click", handleLocationClick);
      widgetContainer.appendChild(btn);
      return;
    }

    if (state.mode === "rating") {
      const wrap = document.createElement("div");
      wrap.className = "widget-pill";

      const starsRow = document.createElement("div");
      starsRow.className = "stars-row";

      for (let i = 1; i <= 5; i++) {
        const sBtn = document.createElement("button");
        sBtn.type = "button";
        sBtn.className = "star-btn" + (i <= state.stars ? " active" : "");
        sBtn.setAttribute("aria-label", `${i} sao`);
        sBtn.innerHTML = `
          <svg viewBox="0 0 24 24">
            <path d="M12 2.25l2.98 6.04 6.67.97-4.82 4.7 1.14 6.64L12 17.73l-5.97 3.13 1.14-6.64-4.82-4.7 6.67-.97L12 2.25z"/>
          </svg>
        `;
        sBtn.addEventListener("click", () => {
          state.stars = i;
          renderWidget();
          messageBox.classList.add("open");
          messageInput.placeholder = `Viết đánh giá ${i} sao...`;
          messageInput.value = state.reviewText;
          messageInput.focus();
        });
        starsRow.appendChild(sBtn);
      }

      wrap.appendChild(starsRow);

      if (state.stars > 0) {
        const cap = document.createElement("span");
        cap.className = "review-caption";
        cap.textContent = state.reviewText ? `"${state.reviewText}"` : "Viết đánh giá...";
        wrap.appendChild(cap);
      }

      widgetContainer.appendChild(wrap);
      return;
    }

    if (state.mode === "music") {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "widget-pill";
      btn.innerHTML = `
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 18V5l12-2v13"></path>
          <circle cx="6" cy="18" r="3"></circle>
          <circle cx="18" cy="16" r="3"></circle>
        </svg>
        <span>${state.songText || "Phát một bài hát"}</span>
      `;
      btn.addEventListener("click", () => openSheet("music"));
      widgetContainer.appendChild(btn);
      return;
    }

    if (state.mode === "message") {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "widget-pill";
      btn.textContent = state.messageText || "Thêm một tin nhắn";
      btn.addEventListener("click", () => {
        messageBox.classList.add("open");
        messageInput.placeholder = "Thêm một tin nhắn...";
        messageInput.value = state.messageText;
        messageInput.focus();
      });
      widgetContainer.appendChild(btn);
      return;
    }

    if (state.mode === "weather") {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "widget-pill";
      btn.textContent = state.weatherText || "21°C · Đang tải...";
      btn.addEventListener("click", fetchWeather);
      widgetContainer.appendChild(btn);
      if (!state.weatherText) fetchWeather();
    }
  }

  async function handleLocationClick() {
    openSheet("location");
    sheetStatus.textContent = "Đang kiểm tra quyền truy cập vị trí chính xác...";
    sheetList.innerHTML = "";

    if (!navigator.geolocation) {
      sheetStatus.textContent = "Thiết bị không hỗ trợ định vị. Chọn địa điểm bên dưới:";
      renderLocationOptions(fallbackPlaces);
      return;
    }

    navigator.geolocation.getCurrentPosition(
      async (pos) => {
        const { latitude, longitude } = pos.coords;
        let label = `${latitude.toFixed(3)}, ${longitude.toFixed(3)}`;
        try {
          const res = await fetch(
            `https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${latitude}&lon=${longitude}`
          );
          if (res.ok) {
            const data = await res.json();
            const addr = data.address || {};
            const town = addr.suburb || addr.town || addr.village || addr.city_district || "";
            const city = addr.city || addr.state || "";
            label = [town, city].filter(Boolean).join(", ") || data.display_name || label;
          }
        } catch (_) {}

        sheetStatus.textContent = "Đã lấy vị trí chính xác:";
        renderLocationOptions([label, ...fallbackPlaces]);
      },
      () => {
        sheetStatus.textContent = "Yêu cầu bật truy cập vị trí chính xác để lấy vị trí hiện tại.";
        renderLocationOptions(fallbackPlaces);
      },
      { enableHighAccuracy: true, timeout: 8000, maximumAge: 0 }
    );
  }

  function renderLocationOptions(items) {
    const query = sheetSearch.value.trim().toLowerCase();
    const filtered = items.filter((item) => item.toLowerCase().includes(query));
    sheetList.innerHTML = "";
    filtered.forEach((place) => {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "sheet-option";
      btn.textContent = place;
      btn.addEventListener("click", () => {
        state.locationText = place;
        closeSheet();
        renderWidget();
      });
      sheetList.appendChild(btn);
    });
  }

  function renderMusicOptions() {
    const query = sheetSearch.value.trim().toLowerCase();
    const filtered = sampleSongs.filter((s) => s.toLowerCase().includes(query));
    sheetList.innerHTML = "";
    filtered.forEach((song) => {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "sheet-option";
      btn.textContent = song;
      btn.addEventListener("click", () => {
        state.songText = song;
        closeSheet();
        renderWidget();
      });
      sheetList.appendChild(btn);
    });
  }

  function openSheet(type) {
    state.sheetType = type;
    sheetSearch.value = "";
    sheetBackdrop.classList.add("open");
    if (type === "music") {
      sheetStatus.textContent = "Chọn bài hát:";
      renderMusicOptions();
    }
  }

  function closeSheet() {
    state.sheetType = null;
    sheetBackdrop.classList.remove("open");
  }

  async function fetchWeather() {
    state.weatherText = "Đang lấy nhiệt độ...";
    renderWidget();
    try {
      const res = await fetch(
        "https://api.open-meteo.com/v1/forecast?latitude=21.0285&longitude=105.8542&current=temperature_2m"
      );
      const data = await res.json();
      const temp = Math.round(data?.current?.temperature_2m ?? 21);
      state.weatherText = `⛅ ${temp}°C`;
    } catch (_) {
      state.weatherText = "⛅ 21°C";
    }
    renderWidget();
  }

  sheetSearch.addEventListener("input", () => {
    if (state.sheetType === "music") renderMusicOptions();
    if (state.sheetType === "location") renderLocationOptions(fallbackPlaces);
  });

  sheetBackdrop.addEventListener("click", (e) => {
    if (e.target === sheetBackdrop) closeSheet();
  });

  document.querySelectorAll(".dot").forEach((dot) => {
    dot.addEventListener("click", () => setMode(dot.dataset.mode));
  });

  document.getElementById("aaBtn").addEventListener("click", () => {
    setMode("message");
    messageBox.classList.add("open");
    messageInput.placeholder = "Thêm một tin nhắn...";
    messageInput.value = state.messageText;
    messageInput.focus();
  });

  saveMessageBtn.addEventListener("click", () => {
    const val = messageInput.value.trim();
    if (state.mode === "rating") {
      state.reviewText = val;
    } else {
      state.messageText = val;
    }
    messageBox.classList.remove("open");
    renderWidget();
  });

  messageInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") saveMessageBtn.click();
  });

  document.getElementById("closeBtn").addEventListener("click", () => {
    state.locationText = "";
    state.stars = 0;
    state.reviewText = "";
    state.songText = "";
    state.messageText = "";
    messageBox.classList.remove("open");
    setMode("location");
    showToast("Đã đặt lại về trạng thái ban đầu");
  });

  document.getElementById("sendBtn").addEventListener("click", () => {
    const parts = [];
    if (state.locationText) parts.push(`Vị trí: ${state.locationText}`);
    if (state.stars > 0) parts.push(`${state.stars} sao`);
    if (state.reviewText) parts.push(`Đánh giá: ${state.reviewText}`);
    if (state.songText) parts.push(`Nhạc: ${state.songText}`);
    if (state.messageText) parts.push(`Tin nhắn: ${state.messageText}`);
    const summary = parts.length ? parts.join(" • ") : "Mặc định";
    showToast(`Đã gửi tới "${state.recipient}" (${summary})`);
  });

  document.getElementById("downloadBtn").addEventListener("click", () => {
    const img = document.getElementById("previewImage");
    const a = document.createElement("a");
    a.href = img.src;
    a.download = "anh-gui.png";
    a.click();
    showToast("Đang tải ảnh...");
  });

  document.querySelectorAll(".recipient-item").forEach((item) => {
    item.addEventListener("click", () => {
      document.querySelectorAll(".recipient-item").forEach((el) => el.classList.remove("selected"));
      item.classList.add("selected");
      state.recipient = item.dataset.recipient;
    });
  });

  renderWidget();
</script>
</body>
</html>
