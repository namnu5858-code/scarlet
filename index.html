<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mô phỏng 3D Trường THCS Cam Thượng</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #87ceeb; font-family: sans-serif; }
        #canvas-container { width: 100vw; height: 100vh; }
        #ui-layer {
            position: absolute; top: 10px; left: 10px; pointer-events: none;
            display: flex; align-items: center; gap: 5px; font-size: 24px; color: red;
        }
        #joystick-zone {
            position: absolute; bottom: 30px; left: 30px; width: 120px; height: 120px;
            background: rgba(255, 255, 255, 0.2); border: 2px solid rgba(255, 255, 255, 0.5);
            border-radius: 50%; touch-action: none; display: flex; align-items: center; justify-content: center;
        }
        #joystick-knob {
            width: 50px; height: 50px; background: rgba(255, 255, 255, 0.8);
            border-radius: 50%; position: absolute; pointer-events: none;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div id="ui-layer">❤️ ❤️ ❤️ ❤️ ❤️</div>
    <div id="joystick-zone"><div id="joystick-knob"></div></div>
    <div id="canvas-container"></div>

    <script>
        // === KHỞI TẠO CẢNH & CAMERA ===
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb);
        scene.fog = new THREE.FogExp2(0x87ceeb, 0.003);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        // === ÁNH SÁNG ===
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(100, 150, 50);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 2048;
        dirLight.shadow.mapSize.height = 2048;
        dirLight.shadow.camera.near = 0.5;
        dirLight.shadow.camera.far = 500;
        const d = 100;
        dirLight.shadow.camera.left = -d;
        dirLight.shadow.camera.right = d;
        dirLight.shadow.camera.top = d;
        dirLight.shadow.camera.bottom = -d;
        scene.add(dirLight);

        // === VẬT LIỆU XÂY DỰNG ===
        const matRedTile = new THREE.MeshStandardMaterial({ color: 0xcc4422, roughness: 0.8 });
        const matGreenField = new THREE.MeshStandardMaterial({ color: 0x44aa33, roughness: 0.9 });
        const matYellowWall = new THREE.MeshStandardMaterial({ color: 0xf0e68c });
        const matBlueWall = new THREE.MeshStandardMaterial({ color: 0x4682b4 });
        const matWhiteWall = new THREE.MeshStandardMaterial({ color: 0xf5f5f5 });
        const matDarkMetal = new THREE.MeshStandardMaterial({ color: 0x333333, metalness: 0.8 });
        const matGreenRoof = new THREE.MeshStandardMaterial({ color: 0x2e8b57 });
        const matGlass = new THREE.MeshStandardMaterial({ color: 0x88ccff, transparent: true, opacity: 0.6 });
        const matSteel = new THREE.MeshStandardMaterial({ color: 0xdddddd, metalness: 0.9, roughness: 0.1 });

        // === MẶT ĐẤT & CÁNH ĐỒNG ===
        const groundGroup = new THREE.Group();
        // Cánh đồng xung quanh
        const fieldGeo = new THREE.PlaneGeometry(300, 300);
        const fieldMesh = new THREE.Mesh(fieldGeo, matGreenField);
        fieldMesh.rotation.x = -Math.PI / 2;
        fieldMesh.receiveShadow = true;
        groundGroup.add(fieldMesh);

        // Sân gạch đỏ trường
        const courtGeo = new THREE.PlaneGeometry(80, 80);
        const courtMesh = new THREE.Mesh(courtGeo, matRedTile);
        courtMesh.rotation.x = -Math.PI / 2;
        courtMesh.position.set(0, 0.05, 0);
        courtMesh.receiveShadow = true;
        groundGroup.add(courtMesh);
        scene.add(groundGroup);

        // === TÒA NHÀ A (CHỮ L - 4 TẦNG QUY MÔ THỰC TẾ) ===
        function createBuildingA() {
            const bldGroup = new THREE.Group();
            const floorHeight = 4;
            const totalHeight = floorHeight * 4; // 16m + mái

            // Khối chính (mặt tiền nhìn ra cánh đồng/sân)
            const mainGeo = new THREE.BoxGeometry(50, totalHeight, 12);
            const mainMesh = new THREE.Mesh(mainGeo, matWhiteWall);
            mainMesh.position.set(0, totalHeight / 2, -30);
            mainMesh.castShadow = true;
            mainMesh.receiveShadow = true;
            bldGroup.add(mainMesh);

            // Mái thái màu xanh/ xám
            const roofGeo = new THREE.ConeGeometry(38, 4, 4);
            const roofMesh = new THREE.Mesh(roofGeo, matBlueWall);
            roofMesh.position.set(0, totalHeight + 2, -30);
            roofMesh.rotation.y = Math.PI / 4;
            bldGroup.add(roofMesh);

            // Cánh chữ L
            const wingGeo = new THREE.BoxGeometry(12, totalHeight, 25);
            const wingMesh = new THREE.Mesh(wingGeo, matWhiteWall);
            wingMesh.position.set(-19, totalHeight / 2, -11.5);
            wingMesh.castShadow = true;
            wingMesh.receiveShadow = true;
            bldGroup.add(wingMesh);

            // Lan can inox các tầng
            for (let f = 1; f < 4; f++) {
                const railGeo = new THREE.BoxGeometry(50, 0.8, 0.1);
                const railMesh = new THREE.Mesh(railGeo, matSteel);
                railMesh.position.set(0, f * floorHeight + 0.4, -23.9);
                bldGroup.add(railMesh);
            }

            return bldGroup;
        }
        scene.add(createBuildingA());

        // === TÒA NHÀ B & CẦU THANG THOÁT HIỂM MÁI XANH RÊU ===
        function createBuildingB() {
            const bldGroup = new THREE.Group();
            const totalHeight = 12; // 3 tầng

            const mainGeo = new THREE.BoxGeometry(12, totalHeight, 35);
            const mainMesh = new THREE.Mesh(mainGeo, matBlueWall);
            mainMesh.position.set(30, totalHeight / 2, 0);
            mainMesh.castShadow = true;
            bldGroup.add(mainMesh);

            // Cầu thang sắt thoát hiểm ở ĐẦU HÀNH LANG (phía trước)
            const stairGroup = new THREE.Group();
            const stairFrameGeo = new THREE.BoxGeometry(3, totalHeight, 4);
            const stairFrame = new THREE.Mesh(stairFrameGeo, matDarkMetal);
            stairFrame.position.set(23, totalHeight / 2, -15.5);
            stairGroup.add(stairFrame);

            // Mái che cầu thang xanh rêu
            const stairRoofGeo = new THREE.BoxGeometry(3.6, 0.2, 4.6);
            const stairRoof = new THREE.Mesh(stairRoofGeo, matGreenRoof);
            stairRoof.position.set(23, totalHeight + 0.1, -15.5);
            stairGroup.add(stairRoof);

            bldGroup.add(stairGroup);
            return bldGroup;
        }
        scene.add(createBuildingB());

        // === CỔNG TRƯỜNG & NHÀ BẢO VỆ & CỔNG PHÍA PHẢI ===
        function createEntrance() {
            const entGroup = new THREE.Group();

            // Cột cổng
            const pillarGeo = new THREE.BoxGeometry(1.5, 6, 1.5);
            const p1 = new THREE.Mesh(pillarGeo, matYellowWall);
            p1.position.set(25, 3, 38);
            const p2 = new THREE.Mesh(pillarGeo, matYellowWall);
            p2.position.set(33, 3, 38);
            entGroup.add(p1, p2);

            // Biển tên trường
            const signGeo = new THREE.BoxGeometry(9.5, 1.2, 0.4);
            const sign = new THREE.Mesh(signGeo, matBlueWall);
            sign.position.set(29, 5.8, 38);
            entGroup.add(sign);

            // Bãi xe đối diện cổng
            const shedGeo = new THREE.BoxGeometry(25, 3.5, 6);
            const shed = new THREE.Mesh(shedGeo, matDarkMetal);
            shed.position.set(-10, 1.75, 35);
            entGroup.add(shed);

            return entGroup;
        }
        scene.add(createEntrance());

        // === NHÂN VẬT NGƯỜI QUE (ANIME STYLE STICKMAN) ===
        function createStickman() {
            const playerGroup = new THREE.Group();
            const matBlack = new THREE.MeshBasicMaterial({ color: 0x111111 });

            // Đầu
            const headGeo = new THREE.SphereGeometry(0.35, 16, 16);
            const head = new THREE.Mesh(headGeo, matBlack);
            head.position.y = 1.6;
            playerGroup.add(head);

            // Thân
            const bodyGeo = new THREE.CylinderGeometry(0.08, 0.08, 0.8);
            const body = new THREE.Mesh(bodyGeo, matBlack);
            body.position.y = 1.0;
            playerGroup.add(body);

            // Chân trái & phải
            const legGeo = new THREE.CylinderGeometry(0.05, 0.05, 0.7);
            
            const leftLeg = new THREE.Mesh(legGeo, matBlack);
            leftLeg.position.set(-0.12, 0.35, 0);
            playerGroup.add(leftLeg);

            const rightLeg = new THREE.Mesh(legGeo, matBlack);
            rightLeg.position.set(0.12, 0.35, 0);
            playerGroup.add(rightLeg);

            playerGroup.userData = { leftLeg, rightLeg, head };
            return playerGroup;
        }

        const player = createStickman();
        player.position.set(29, 0, 30); // Đứng gần cổng
        scene.add(player);

        // === ĐIỀU KHIỂN JOYSTICK & CHUYỂN ĐỘNG ===
        let moveData = { x: 0, y: 0 };
        const joystickZone = document.getElementById('joystick-zone');
        const joystickKnob = document.getElementById('joystick-knob');
        let activeTouchId = null;

        function handleJoystickMove(clientX, clientY) {
            const rect = joystickZone.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            
            let dx = clientX - centerX;
            let dy = clientY - centerY;
            const dist = Math.hypot(dx, dy);
            const maxRadius = rect.width / 2;

            if (dist > maxRadius) {
                dx = (dx / dist) * maxRadius;
                dy = (dy / dist) * maxRadius;
            }

            joystickKnob.style.transform = `translate(${dx}px, ${dy}px)`;
            moveData.x = dx / maxRadius;
            moveData.y = dy / maxRadius;
        }

        joystickZone.addEventListener('pointerdown', e => {
            activeTouchId = e.pointerId;
            handleJoystickMove(e.clientX, e.clientY);
        });

        window.addEventListener('pointermove', e => {
            if (e.pointerId === activeTouchId) {
                handleJoystickMove(e.clientX, e.clientY);
            }
        });

        const resetJoystick = e => {
            if (e.pointerId === activeTouchId) {
                activeTouchId = null;
                joystickKnob.style.transform = `translate(0px, 0px)`;
                moveData = { x: 0, y: 0 };
            }
        };
        window.addEventListener('pointerup', resetJoystick);
        window.addEventListener('pointercancel', resetJoystick);

        // === HOẠT HỌA DI CHUYỂN (ANIME WALK ANIMATION) ===
        let animClock = 0;
        function animate() {
            requestAnimationFrame(animate);

            const speed = 0.25;
            if (Math.abs(moveData.x) > 0.1 || Math.abs(moveData.y) > 0.1) {
                // Di chuyển vị trí
                player.position.x += moveData.x * speed;
                player.position.z += moveData.y * speed;

                // Xoay hướng nhân vật
                const angle = Math.atan2(moveData.x, moveData.y);
                player.rotation.y = angle;

                // Dáng đi phong cách Anime (Đung đung chân tay nhịp nhàng)
                animClock += 0.2;
                player.userData.leftLeg.rotation.x = Math.sin(animClock) * 0.6;
                player.userData.rightLeg.rotation.x = -Math.sin(animClock) * 0.6;
                player.userData.head.position.y = 1.6 + Math.abs(Math.sin(animClock * 2)) * 0.05;
            } else {
                // Reset tư thế đứng
                player.userData.leftLeg.rotation.x = 0;
                player.userData.rightLeg.rotation.x = 0;
                player.userData.head.position.y = 1.6;
            }

            // Camera đi theo nhân vật phía sau (Third-person View)
            camera.position.x = player.position.x;
            camera.position.y = player.position.y + 8;
            camera.position.z = player.position.z + 16;
            camera.lookAt(player.position.x, player.position.y + 1.5, player.position.z);

            renderer.render(scene, camera);
        }

        // Tự động tối ưu khung hình khi đổi kích thước màn hình
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
