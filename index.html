<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Campus</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #87CEEB;
        }
        #youtube-player-container {
            visibility: hidden;
            position: absolute;
            width: 0;
            height: 0;
            overflow: hidden;
            pointer-events: none;
        }
        #ui-container {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }
        #chat-box {
            width: 320px;
            background: rgba(20, 30, 48, 0.85);
            border-radius: 12px;
            color: white;
            font-family: sans-serif;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        #chat-header {
            background: rgba(0,0,0,0.3);
            padding: 8px 12px;
            font-size: 14px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        #chat-messages {
            padding: 10px;
            height: 80px;
            overflow-y: auto;
            font-size: 13px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        #chat-input-container {
            padding: 8px;
            background: rgba(0,0,0,0.2);
        }
        #chat-input {
            width: 100%;
            padding: 6px 10px;
            border-radius: 6px;
            border: none;
            outline: none;
            background: rgba(255,255,255,0.9);
            font-size: 13px;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

    <!-- Khung phát YouTube đã được sửa style thành visibility: hidden -->
    <div id="youtube-player-container">
        <div id="player"></div>
    </div>

    <!-- Giao diện Chat & Điều khiển -->
    <div id="ui-container">
        <div id="chat-box">
            <div id="chat-header">
                <span>Trò chuyện / Lệnh Nhạc</span>
                <span>×</span>
            </div>
            <div id="chat-messages">
                <div><strong>Hệ thống:</strong> Bấm T (bật nhạc), F (dừng), A (tiếp tục) hoặc nhập lệnh chat.</div>
            </div>
            <div id="chat-input-container">
                <input type="text" id="chat-input" placeholder="Nhập lệnh hoặc chat...">
            </div>
        </div>
    </div>

    <!-- YouTube IFrame API Script -->
    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
        let player;
        let isPlayerReady = false;

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('player', {
                height: '0',
                width: '0',
                videoId: 'jfKfPfyJRdk', // Video nhạc nền mẫu (Lofi Girl hoặc tùy chỉnh)
                playerVars: {
                    'playsinline': 1,
                    'controls': 0
                },
                events: {
                    'onReady': onPlayerReady,
                    'onError': onPlayerError
                }
            });
        }

        function onPlayerReady(event) {
            isPlayerReady = true;
            appendSystemMessage("Trình phát YouTube đã sẵn sàng!");
        }

        function onPlayerError(event) {
            appendSystemMessage("Lỗi trình phát YouTube: " + event.data);
        }

        function appendSystemMessage(msg) {
            const messagesContainer = document.getElementById('chat-messages');
            if (messagesContainer) {
                const div = document.createElement('div');
                div.innerHTML = `<strong>Hệ thống:</strong> ${msg}`;
                messagesContainer.appendChild(div);
                messagesContainer.scrollTop = messagesContainer.scrollHeight;
            }
        }

        function handleCommand(cmd) {
            const command = cmd.trim().toLowerCase();
            
            if (!isPlayerReady) {
                appendSystemMessage("Trình phát YouTube đang tải, vui lòng thử lại sau giây lát!");
                return;
            }

            if (command === 't') {
                player.playVideo();
                appendSystemMessage("Đã bật nhạc!");
            } else if (command === 'f') {
                player.pauseVideo();
                appendSystemMessage("Đã tạm dừng nhạc!");
            } else if (command === 'a') {
                player.playVideo();
                appendSystemMessage("Đã tiếp tục phát nhạc!");
            }
        }

        // Lắng nghe sự kiện bàn phím
        window.addEventListener('keydown', (e) => {
            // Tránh kích hoạt nếu đang gõ trong ô input
            if (document.activeElement.id === 'chat-input') return;

            const key = e.key.toLowerCase();
            if (['t', 'f', 'a'].includes(key)) {
                handleCommand(key);
            }
        });

        // Lắng nghe sự kiện khung chat
        const chatInput = document.getElementById('chat-input');
        if (chatInput) {
            chatInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    const val = chatInput.value;
                    if (val.trim() !== '') {
                        const messagesContainer = document.getElementById('chat-messages');
                        const div = document.createElement('div');
                        div.innerHTML = `<strong>Bạn:</strong> ${val}`;
                        messagesContainer.appendChild(div);
                        
                        // Kiểm tra nếu nhập trực tiếp lệnh t, f, a
                        if (['t', 'f', 'a'].includes(val.trim().toLowerCase())) {
                            handleCommand(val);
                        }

                        chatInput.value = '';
                        messagesContainer.scrollTop = messagesContainer.scrollHeight;
                    }
                }
            });
        }
    </script>
</body>
</html>
