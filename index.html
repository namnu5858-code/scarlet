<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Sunflower Game - Fixed Movement</title>
  <style>
    * {
      box-sizing: border-box;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #87cfff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      touch-action: none;
    }
    #game-container {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
    }
    .glass-ui {
      background: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.35);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.15);
    }
    #joystick-wrapper {
      position: absolute;
      bottom: 40px;
      left: 40px;
      width: 120px;
      height: 120px;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      touch-action: none;
      z-index: 10;
    }
    #joystick-stick {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.6);
      position: absolute;
      transition: transform 0.05s ease-out;
      pointer-events: none;
    }
    #jump-btn {
      position: absolute;
      bottom: 45px;
      right: 40px;
      width: 70px;
      height: 70px;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      touch-action: none;
      z-index: 10;
      cursor: pointer;
    }
    #jump-btn:active {
      background: rgba(255, 255, 255, 0.4);
      transform: scale(0.95);
    }
    #jump-btn svg {
      width: 32px;
      height: 32px;
      fill: none;
      stroke: #ffffff;
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    #info {
      position: fixed;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      padding: 8px 14px;
      border-radius: 12px;
      background: rgba(0,0,0,.45);
      color: white;
      font-family: Arial, sans-serif;
      font-size: 14px;
      z-index: 10;
      pointer-events: none;
    }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
      }
    }
  </script>
</head>
<body>
  <div id="game-container"></div>
  <div id="info">🌻 SUNFLOWER GAME CONTROLLER</div>

  <div id="joystick-wrapper" class="glass-ui">
    <div id="joystick-stick"></div>
  </div>

  <div id="jump-btn" class="glass-ui">
    <svg viewBox="0 0 24 24">
      <path d="M12 19V5M5 12l7-7 7 7"/>
    </svg>
  </div>

  <script type="module">
    import * as THREE from 'three';

    const container = document.getElementById('game-container');
    const scene = new THREE.Scene();

    scene.background = new THREE.Color(0x87cfff);
    scene.fog = new THREE.FogExp2(0x87cfff, 0.015);

    const playerGroup = new THREE.Group();
    scene.add(playerGroup);

    const cameraPivot = new THREE.Object3D();
    scene.add(cameraPivot);

    const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 100);
    cameraPivot.add(camera);

    let cameraDistance = 8;
    let cameraAngleX = 0.3;
    let cameraAngleY = 0;

    function updateCameraTransform() {
      cameraPivot.position.copy(playerGroup.position);
      cameraPivot.position.y += 1.5;
      cameraPivot.rotation.y = cameraAngleY;
      cameraPivot.rotation.x = cameraAngleX;
      camera.position.set(0, 0, cameraDistance);
      camera.lookAt(cameraPivot.position);
    }

    const sunLight = new THREE.DirectionalLight(0xffffff, 2.5);
    sunLight.position.set(-5, 15, 10);
    sunLight.castShadow = true;
    sunLight.shadow.mapSize.width = 2048;
    sunLight.shadow.mapSize.height = 2048;
    scene.add(sunLight);

    scene.add(new THREE.HemisphereLight(0xbfeaff, 0x46752e, 1.2));

    const ground = new THREE.Mesh(
      new THREE.PlaneGeometry(200, 200),
      new THREE.MeshStandardMaterial({ color: 0x4e9b3c })
    );
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    const gridHelper = new THREE.GridHelper(200, 50, 0x3f822e, 0x3f822e);
    gridHelper.position.y = 0.01;
    scene.add(gridHelper);

    for (let i = 0; i < 40; i++) {
      const boxGeo = new THREE.BoxGeometry(1.5, 3, 1.5);
      const boxMat = new THREE.MeshStandardMaterial({ color: Math.random() * 0xffffff });
      const box = new THREE.Mesh(boxGeo, boxMat);
      box.position.set(
        (Math.random() - 0.5) * 80,
        1.5,
        (Math.random() - 0.5) * 80
      );
      if (box.position.distanceTo(playerGroup.position) > 5) {
        box.castShadow = true;
        box.receiveShadow = true;
        scene.add(box);
      }
    }

    const sunflower = new THREE.Group();
    playerGroup.add(sunflower);

    const body = new THREE.Group();
    body.position.y = 2.1;
    sunflower.add(body);

    const stem = new THREE.Mesh(
      new THREE.CylinderGeometry(0.18, 0.24, 2.7, 16),
      new THREE.MeshStandardMaterial({ color: 0x3f9d38, roughness: .8 })
    );
    stem.position.y = 0.8;
    body.add(stem);

    const head = new THREE.Group();
    head.position.set(0, 2.35, 0);
    body.add(head);

    const face = new THREE.Mesh(
      new THREE.SphereGeometry(1.05, 32, 24),
      new THREE.MeshStandardMaterial({ color: 0x8b542c, roughness: .7 })
    );
    face.scale.set(1.15, 1.05, 0.48);
    head.add(face);

    const petals = [];
    const petalMaterial = new THREE.MeshStandardMaterial({ color: 0xffd83d, roughness: .65 });
    const PETAL_COUNT = 16;

    for (let i = 0; i < PETAL_COUNT; i++) {
      const angle = (i / PETAL_COUNT) * Math.PI * 2;
      const petal = new THREE.Mesh(
        new THREE.SphereGeometry(0.48, 16, 12),
        petalMaterial
      );
      petal.scale.set(0.65, 1.25, 0.28);
      const radius = 1.0;
      petal.position.set(Math.cos(angle) * radius, Math.sin(angle) * radius, 0);
      petal.rotation.z = angle - Math.PI / 2;
      head.add(petal);

      petals.push({ object: petal, baseAngle: angle, index: i });
    }

    const eyeMaterial = new THREE.MeshStandardMaterial({ color: 0x111111 });
    const eyeL = new THREE.Mesh(new THREE.SphereGeometry(.16, 16, 12), eyeMaterial);
    const eyeR = eyeL.clone();
    eyeL.position.set(-.35, .22, -.48);
    eyeR.position.set(.35, .22, -.48);
    head.add(eyeL);
    head.add(eyeR);

    const mouth = new THREE.Mesh(
      new THREE.TorusGeometry(.22, .055, 8, 24, Math.PI),
      new THREE.MeshStandardMaterial({ color: 0x20130d })
    );
    mouth.rotation.x = Math.PI;
    mouth.position.set(0, -.27, -.49);
    head.add(mouth);

    const leafMaterial = new THREE.MeshStandardMaterial({
      color: 0x3fae43, roughness: .75, side: THREE.DoubleSide
    });

    function createLeaf(x, y, z, rotation) {
      const leaf = new THREE.Mesh(new THREE.SphereGeometry(.65, 16, 10), leafMaterial);
      leaf.scale.set(1.4, .55, .18);
      leaf.position.set(x, y, z);
      leaf.rotation.z = rotation;
      body.add(leaf);
      return leaf;
    }

    const leafL = createLeaf(-.5, 1.0, 0, .45);
    const leafR = createLeaf(.5, .65, 0, -.55);

    function createArm(side) {
      const group = new THREE.Group();
      const arm = new THREE.Mesh(new THREE.CylinderGeometry(.11, .13, 1.0, 12), leafMaterial);
      arm.position.y = -.45;
      group.add(arm);
      group.rotation.z = side * .65;
      return group;
    }

    const armL = createArm(-1);
    const armR = createArm(1);
    armL.position.set(-.65, 1.35, 0);
    armR.position.set(.65, 1.35, 0);
    body.add(armL);
    body.add(armR);

    const legMaterial = new THREE.MeshStandardMaterial({ color: 0x347f35 });

    function createLeg() {
      const legGroup = new THREE.Group();
      const leg = new THREE.Mesh(new THREE.CylinderGeometry(.13, .16, 1.15, 12), legMaterial);
      leg.position.y = -.55;
      legGroup.add(leg);
      return legGroup;
    }

    const legL = createLeg();
    const legR = createLeg();
    legL.position.set(-.35, -.05, 0);
    legR.position.set(.35, -.05, 0);
    body.add(legL);
    body.add(legR);

    const footMaterial = new THREE.MeshStandardMaterial({ color: 0x276b2c });
    const footL = new THREE.Mesh(new THREE.SphereGeometry(.3, 16, 10), footMaterial);
    const footR = footL.clone();
    footL.scale.set(1.3, .55, 1.7);
    footR.scale.copy(footL.scale);
    footL.position.set(-.35, -.65, .12);
    footR.position.set(.35, -.65, .12);
    legL.add(footL);
    legR.add(footR);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    container.appendChild(renderer.domElement);

    const inputVector = new THREE.Vector2(0, 0);
    const velocity = new THREE.Vector3();
    const speed = 7;
    const gravity = -20;
    let isGrounded = true;
    let runTime = 0;

    const joyWrapper = document.getElementById('joystick-wrapper');
    const joyStick = document.getElementById('joystick-stick');
    let joyTouchId = null;
    let joyCenter = { x: 0, y: 0 };
    const joyRadius = 40;

    joyWrapper.addEventListener('touchstart', (e) => {
      e.preventDefault();
      const touch = e.changedTouches[0];
      joyTouchId = touch.identifier;
      const rect = joyWrapper.getBoundingClientRect();
      joyCenter = { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 };
      updateJoystick(touch);
    }, { passive: false });

    window.addEventListener('touchmove', (e) => {
      for (let i = 0; i < e.changedTouches.length; i++) {
        if (e.changedTouches[i].identifier === joyTouchId) {
          updateJoystick(e.changedTouches[i]);
        }
      }
    }, { passive: false });

    function endJoyTouch(e) {
      for (let i = 0; i < e.changedTouches.length; i++) {
        if (e.changedTouches[i].identifier === joyTouchId) {
          joyTouchId = null;
          inputVector.set(0, 0);
          joyStick.style.transform = `translate(0px, 0px)`;
        }
      }
    }
    window.addEventListener('touchend', endJoyTouch);
    window.addEventListener('touchcancel', endJoyTouch);

    function updateJoystick(touch) {
      const dx = touch.clientX - joyCenter.x;
      const dy = touch.clientY - joyCenter.y;
      const dist = Math.hypot(dx, dy);
      const angle = Math.atan2(dy, dx);
      const clampedDist = Math.min(dist, joyRadius);

      const moveX = Math.cos(angle) * clampedDist;
      const moveY = Math.sin(angle) * clampedDist;

      joyStick.style.transform = `translate(${moveX}px, ${moveY}px)`;
      
      inputVector.set(moveX / joyRadius, moveY / joyRadius);
    }

    const jumpBtn = document.getElementById('jump-btn');
    jumpBtn.addEventListener('touchstart', (e) => {
      e.preventDefault();
      if (isGrounded) {
        velocity.y = 8;
        isGrounded = false;
      }
    }, { passive: false });

    let orbitTouchId = null;
    let lastTouchPos = { x: 0, y: 0 };

    window.addEventListener('touchstart', (e) => {
      const touch = e.changedTouches[0];
      if (touch.clientX > window.innerWidth / 3 && joyTouchId === null) {
        orbitTouchId = touch.identifier;
        lastTouchPos = { x: touch.clientX, y: touch.clientY };
      }
    });

    window.addEventListener('touchmove', (e) => {
      for (let i = 0; i < e.changedTouches.length; i++) {
        if (e.changedTouches[i].identifier === orbitTouchId) {
          const touch = e.changedTouches[i];
          const dx = touch.clientX - lastTouchPos.x;
          const dy = touch.clientY - lastTouchPos.y;

          cameraAngleY -= dx * 0.008;
          cameraAngleX = Math.max(-0.1, Math.min(Math.PI / 2.3, cameraAngleX + dy * 0.008));

          lastTouchPos = { x: touch.clientX, y: touch.clientY };
        }
      }
    });

    function endOrbitTouch(e) {
      for (let i = 0; i < e.changedTouches.length; i++) {
        if (e.changedTouches[i].identifier === orbitTouchId) {
          orbitTouchId = null;
        }
      }
    }
    window.addEventListener('touchend', endOrbitTouch);
    window.addEventListener('touchcancel', endOrbitTouch);

    const keyState = {};
    window.addEventListener('keydown', (e) => { keyState[e.code] = true; });
    window.addEventListener('keyup', (e) => { keyState[e.code] = false; });

    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta();

      let keyboardX = 0;
      let keyboardY = 0;
      if (keyState['KeyW'] || keyState['ArrowUp']) keyboardY -= 1;
      if (keyState['KeyS'] || keyState['ArrowDown']) keyboardY += 1;
      if (keyState['KeyA'] || keyState['ArrowLeft']) keyboardX -= 1;
      if (keyState['KeyD'] || keyState['ArrowRight']) keyboardX += 1;

      if (keyState['Space'] && isGrounded) {
        velocity.y = 8;
        isGrounded = false;
      }

      let moveVector = new THREE.Vector2(inputVector.x, inputVector.y);
      if (keyboardX !== 0 || keyboardY !== 0) {
        moveVector.set(keyboardX, keyboardY).normalize();
      }

      const isMoving = moveVector.lengthSq() > 0.01;

      if (isMoving) {
        const moveAngle = Math.atan2(moveVector.x, moveVector.y) + cameraAngleY;

        velocity.x = Math.sin(moveAngle) * speed;
        velocity.z = Math.cos(moveAngle) * speed;

        let diff = moveAngle - sunflower.rotation.y;
        diff = Math.atan2(Math.sin(diff), Math.cos(diff));
        sunflower.rotation.y += diff * 0.25;

        runTime += delta * 10;
      } else {
        velocity.x = 0;
        velocity.z = 0;
      }

      const run = isMoving ? Math.sin(runTime) : 0;
      const runOpposite = isMoving ? Math.sin(runTime + Math.PI) : 0;

      body.position.y = 2.1 + Math.abs(run) * .10;
      body.rotation.z = run * .035;
      body.rotation.x = Math.abs(run) * .025;

      head.position.y = 2.35 + Math.abs(run) * .045;
      head.rotation.z = run * .025;

      petals.forEach((p) => {
        const wave = isMoving ? Math.sin(runTime + p.index * .55) : 0;
        p.object.rotation.z = p.baseAngle - Math.PI / 2 + wave * .035;
        p.object.scale.y = 1.25 + wave * .035;
      });

      armL.rotation.z = -.65 + run * .35;
      armR.rotation.z = .65 - run * .35;

      legL.rotation.x = run * .5;
      legR.rotation.x = runOpposite * .5;

      footL.rotation.x = run * .25;
      footR.rotation.x = runOpposite * .25;

      leafL.rotation.z = .45 + run * .12;
      leafR.rotation.z = -.55 - run * .12;

      velocity.y += gravity * delta;
      playerGroup.position.y += velocity.y * delta;

      if (playerGroup.position.y <= 0) {
        playerGroup.position.y = 0;
        velocity.y = 0;
        isGrounded = true;
      }

      playerGroup.position.x += velocity.x * delta;
      playerGroup.position.z += velocity.z * delta;

      updateCameraTransform();

      renderer.render(scene, camera);
    }

    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
