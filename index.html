<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>3D School Campus</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
            background-color: #000;
            user-select: none;
            -webkit-user-select: none;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }
        /* UI Overlay */
        .ui-element {
            position: absolute;
            z-index: 10;
        }
        /* Joystick Styles */
        #joystick-zone {
            position: absolute;
            bottom: 30px;
            left: 30px;
            width: 120px;
            height: 120px;
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            touch-action: none;
        }
        #joystick-knob {
            position: absolute;
            top: 35px;
            left: 35px;
            width: 50px;
            height: 50px;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(0,0,0,0.3);
            pointer-events: none;
        }
        /* Fly Up Button */
        #btn-fly {
            position: absolute;
            bottom: 30px;
            right: 30px;
            width: 65px;
            height: 65px;
            background: rgba(255, 255, 255, 0.3);
            border: 2px solid rgba(255, 255, 255, 0.6);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 28px;
            touch-action: none;
            cursor: pointer;
        }
        #btn-fly:active {
            background: rgba(255, 255, 255, 0.6);
        }
    </style>
    <!-- Three.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="canvas-container"></div>

    <!-- Controls UI -->
    <div id="joystick-zone">
        <div id="joystick-knob"></div>
    </div>
    <div id="btn-fly">↑</div>

    <script>
        // --- CONSTANTS & CONFIGS ---
        const FLY_SPEED = 250 * (1000 / 3600); // 250 km/h in meters per second (~69.44 m/s)
        
        // --- SCENE, CAMERA, RENDERER ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb); // Sky blue
        scene.fog = new THREE.FogExp2(0x87ceeb, 0.005);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        // --- LIGHTS ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const sunLight = new THREE.DirectionalLight(0xffffff, 0.8);
        sunLight.position.set(50, 100, 50);
        sunLight.castShadow = true;
        sunLight.shadow.mapSize.width = 2048;
        sunLight.shadow.mapSize.height = 2048;
        sunLight.shadow.camera.near = 0.5;
        sunLight.shadow.camera.far = 500;
        const d = 100;
        sunLight.shadow.camera.left = -d;
        sunLight.shadow.camera.right = d;
        sunLight.shadow.camera.top = d;
        sunLight.shadow.camera.bottom = -d;
        scene.add(sunLight);

        // --- ENVIRONMENT & PROCEDURAL TEXTURES ---
        // Red Tile Texture for Yard
        function createTileTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 256;
            canvas.height = 256;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#b23b23';
            ctx.fillRect(0, 0, 256, 256);
            ctx.strokeStyle = '#8b2500';
            ctx.lineWidth = 4;
            for(let i=0; i<=256; i+=32) {
                ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, 256); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(256, i); ctx.stroke();
            }
            const texture = new THREE.CanvasTexture(canvas);
            texture.wrapS = THREE.RepeatWrapping;
            texture.wrapT = THREE.RepeatWrapping;
            return texture;
        }

        const tileTexture = createTileTexture();
        tileTexture.repeat.set(40, 40);

        // Ground Grass
        const grassGeo = new THREE.PlaneGeometry(500, 500);
        const grassMat = new THREE.MeshLambertMaterial({ color: 0x55aa44 });
        const grass = new THREE.Mesh(grassGeo, grassMat);
        grass.rotation.x = -Math.PI / 2;
        grass.position.y = -0.1;
        grass.receiveShadow = true;
        scene.add(grass);

        // School Courtyard (Red Tile)
        const yardGeo = new THREE.PlaneGeometry(120, 120);
        const yardMat = new THREE.MeshStandardMaterial({ map: tileTexture, roughness: 0.8 });
        const yard = new THREE.Mesh(yardGeo, yardMat);
        yard.rotation.x = -Math.PI / 2;
        yard.position.set(0, 0, 0);
        yard.receiveShadow = true;
        scene.add(yard);

        // --- BUILDING GENERATION (Symmetrical L-Shape Wings) ---
        function createBuildingWing(width, height, depth) {
            const group = new THREE.Group();
            
            // Main Wall
            const wallGeo = new THREE.BoxGeometry(width, height, depth);
            const wallMat = new THREE.MeshStandardMaterial({ color: 0xe8e3c7, roughness: 0.6 });
            const wall = new THREE.Mesh(wallGeo, wallMat);
            wall.position.y = height / 2;
            wall.castShadow = true;
            wall.receiveShadow = true;
            group.add(wall);

            // Roof Rim
            const roofGeo = new THREE.BoxGeometry(width + 0.6, 0.4, depth + 0.6);
            const roofMat = new THREE.MeshStandardMaterial({ color: 0x2c3e50 });
            const roof = new THREE.Mesh(roofGeo, roofMat);
            roof.position.y = height + 0.2;
            roof.castShadow = true;
            group.add(roof);

            // Windows Strip
            const windowMat = new THREE.MeshStandardMaterial({ color: 0x1a252f, metalness: 0.8, roughness: 0.2 });
            const floors = 3;
            const floorHeight = height / floors;

            for (let f = 0; f < floors; f++) {
                const winGeo = new THREE.BoxGeometry(width * 0.8, floorHeight * 0.4, depth + 0.1);
                const win = new THREE.Mesh(winGeo, windowMat);
                win.position.y = f * floorHeight + floorHeight * 0.5 + 0.5;
                group.add(win);
            }

            return group;
        }

        function createLSapedBuilding() {
            const buildingGroup = new THREE.Group();
            const wingLength = 50;
            const wingWidth = 12;
            const wingHeight = 12;

            // Wing A (Along X axis)
            const wingA = createBuildingWing(wingLength, wingHeight, wingWidth);
            wingA.position.set(wingLength / 2 - wingWidth / 2, 0, 0);
            buildingGroup.add(wingA);

            // Wing B (Along Z axis - Perfectly seamlessly joined at origin point)
            const wingB = createBuildingWing(wingWidth, wingHeight, wingLength - wingWidth);
            wingB.position.set(0, 0, (wingLength - wingWidth) / 2 + wingWidth / 2);
            buildingGroup.add(wingB);

            return buildingGroup;
        }

        // Place Two Symmetrical L-Shaped Buildings facing each other
        const building1 = createLSapedBuilding();
        building1.position.set(-20, 0, -20);
        scene.add(building1);

        const building2 = createLSapedBuilding();
        building2.rotation.y = Math.PI;
        building2.position.set(20, 0, 20);
        scene.add(building2);

        // --- STAIRS & COVERED WALKWAY (MÁI CHE) ---
        function createStairsAndCanopy() {
            const group = new THREE.Group();

            // Outdoor Metal Staircase
            const stairMat = new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.5 });
            const steps = 15;
            const stepWidth = 4;
            const stepDepth = 0.4;
            const stepHeight = 0.35;

            for (let i = 0; i < steps; i++) {
                const stepGeo = new THREE.BoxGeometry(stepWidth, 0.1, stepDepth);
                const step = new THREE.Mesh(stepGeo, stairMat);
                step.position.set(0, i * stepHeight + 0.05, i * stepDepth);
                step.castShadow = true;
                step.receiveShadow = true;
                group.add(step);
            }

            // Canopy Roof (Mái Che) perfectly adjusted at intersection
            const canopyGeo = new THREE.BoxGeometry(5, 0.15, steps * stepDepth + 2);
            const canopyMat = new THREE.MeshStandardMaterial({ color: 0x1b4f72, transparent: true, opacity: 0.85 });
            const canopy = new THREE.Mesh(canopyGeo, canopyMat);
            canopy.position.set(0, steps * stepHeight + 0.2, (steps * stepDepth) / 2 - 0.5);
            canopy.rotation.x = Math.atan2(steps * stepHeight, steps * stepDepth);
            canopy.castShadow = true;
            group.add(canopy);

            // Canopy Support Poles
            const poleGeo = new THREE.CylinderGeometry(0.08, 0.08, steps * stepHeight + 1);
            const poleMat = new THREE.MeshStandardMaterial({ color: 0x555555 });
            
            const pole1 = new THREE.Mesh(poleGeo, poleMat);
            pole1.position.set(-2.3, (steps * stepHeight) / 2, 0);
            group.add(pole1);

            const pole2 = new THREE.Mesh(poleGeo, poleMat);
            pole2.position.set(2.3, (steps * stepHeight) / 2, 0);
            group.add(pole2);

            return group;
        }

        const stairs = createStairsAndCanopy();
        stairs.position.set(0, 0, -10);
        scene.add(stairs);

        // --- PLAYER / CAMERA SETUP ---
        const player = new THREE.Object3D();
        player.position.set(0, 1.7, 25); // Initial eye level
        scene.add(player);
        player.add(camera);

        // Camera Rotation Angles
        let yaw = 0;   // Horizontal rotation (Look Left/Right)
        let pitch = 0; // Vertical rotation (Look Up/Down - Fully Allowed to +90 / -90 deg)

        // --- CONTROLS IMPLEMENTATION ---
        // 1. Touch Camera Rotation (Look around / Swipe to look up to the sky)
        let isTouching = false;
        let previousTouchX = 0;
        let previousTouchY = 0;

        window.addEventListener('touchstart', (e) => {
            for (let i = 0; i < e.touches.length; i++) {
                const touch = e.touches[i];
                // Ignore touches on UI controls
                if (touch.clientX < 180 && touch.clientY > window.innerHeight - 180) continue;
                if (touch.clientX > window.innerWidth - 100 && touch.clientY > window.innerHeight - 100) continue;

                isTouching = true;
                previousTouchX = touch.clientX;
                previousTouchY = touch.clientY;
                break;
            }
        });

        window.addEventListener('touchmove', (e) => {
            if (!isTouching) return;

            for (let i = 0; i < e.touches.length; i++) {
                const touch = e.touches[i];
                if (touch.clientX < 180 && touch.clientY > window.innerHeight - 180) continue;
                if (touch.clientX > window.innerWidth - 100 && touch.clientY > window.innerHeight - 100) continue;

                const deltaX = touch.clientX - previousTouchX;
                const deltaY = touch.clientY - previousTouchY;

                yaw -= deltaX * 0.004;
                pitch -= deltaY * 0.004;

                // Allow looking fully UP to the sky (+89 deg) and fully DOWN (-89 deg)
                pitch = Math.max(-Math.PI / 2 + 0.01, Math.min(Math.PI / 2 - 0.01, pitch));

                previousTouchX = touch.clientX;
                previousTouchY = touch.clientY;
                break;
            }
        });

        window.addEventListener('touchend', () => { isTouching = false; });

        // Mouse Drag Fallback for PC Testing
        let isMouseDown = false;
        window.addEventListener('mousedown', (e) => {
            if (e.clientX < 180 && e.clientY > window.innerHeight - 180) return;
            isMouseDown = true;
            previousTouchX = e.clientX;
            previousTouchY = e.clientY;
        });
        window.addEventListener('mousemove', (e) => {
            if (!isMouseDown) return;
            const deltaX = e.clientX - previousTouchX;
            const deltaY = e.clientY - previousTouchY;
            yaw -= deltaX * 0.003;
            pitch -= deltaY * 0.003;
            pitch = Math.max(-Math.PI / 2 + 0.01, Math.min(Math.PI / 2 - 0.01, pitch));
            previousTouchX = e.clientX;
            previousTouchY = e.clientY;
        });
        window.addEventListener('mouseup', () => { isMouseDown = false; });

        // 2. Joystick Movement Logic
        const joystickZone = document.getElementById('joystick-zone');
        const joystickKnob = document.getElementById('joystick-knob');
        let joystickActive = false;
        let moveVector = { x: 0, y: 0 };
        const maxRadius = 35;

        function handleJoystickMove(clientX, clientY) {
            const rect = joystickZone.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;

            let dx = clientX - centerX;
            let dy = clientY - centerY;
            const distance = Math.hypot(dx, dy);

            if (distance > maxRadius) {
                dx = (dx / distance) * maxRadius;
                dy = (dy / distance) * maxRadius;
            }

            joystickKnob.style.transform = `translate(${dx}px, ${dy}px)`;
            moveVector.x = dx / maxRadius;  // [-1, 1]
            moveVector.y = dy / maxRadius;  // [-1, 1]
        }

        joystickZone.addEventListener('touchstart', (e) => {
            joystickActive = true;
            handleJoystickMove(e.touches[0].clientX, e.touches[0].clientY);
        });

        window.addEventListener('touchmove', (e) => {
            if (!joystickActive) return;
            for (let i = 0; i < e.touches.length; i++) {
                const touch = e.touches[i];
                const rect = joystickZone.getBoundingClientRect();
                if (Math.hypot(touch.clientX - (rect.left + 60), touch.clientY - (rect.top + 60)) < 100) {
                    handleJoystickMove(touch.clientX, touch.clientY);
                    break;
                }
            }
        });

        window.addEventListener('touchend', () => {
            if (joystickActive) {
                joystickActive = false;
                joystickKnob.style.transform = `translate(0px, 0px)`;
                moveVector = { x: 0, y: 0 };
            }
        });

        // 3. Fly Up Button Control
        const btnFly = document.getElementById('btn-fly');
        let isFlyingUp = false;

        btnFly.addEventListener('touchstart', (e) => { e.preventDefault(); isFlyingUp = true; });
        btnFly.addEventListener('touchend', () => { isFlyingUp = false; });
        btnFly.addEventListener('mousedown', () => { isFlyingUp = true; });
        btnFly.addEventListener('mouseup', () => { isFlyingUp = false; });

        // --- ANIMATION LOOP & PHYSICS ---
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const delta = clock.getDelta();

            // Apply Camera Rotations
            player.rotation.y = yaw;
            camera.rotation.x = pitch;

            // Handle Flying / Walking Movement
            const moveSpeed = FLY_SPEED * delta;

            if (moveVector.x !== 0 || moveVector.y !== 0) {
                // Forward/Backward and Strafe
                const forward = new THREE.Vector3(0, 0, -1).applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);
                const side = new THREE.Vector3(1, 0, 0).applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);

                player.position.addScaledVector(forward, -moveVector.y * moveSpeed);
                player.position.addScaledVector(side, moveVector.x * moveSpeed);
            }

            // Fly Up Movement
            if (isFlyingUp) {
                player.position.y += moveSpeed;
            }

            // Keep Player Above Ground
            if (player.position.y < 1.7) {
                player.position.y = 1.7;
            }

            renderer.render(scene, camera);
        }

        animate();

        // --- RESIZE HANDLE ---
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
