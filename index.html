<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>3D Campus Model</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: sans-serif;
            background-color: #87ceeb;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
        }
    </style>
    <!-- Three.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.min.js"></script>
</head>
<body>
    <div id="canvas-container"></div>

    <script>
        // 1. Khởi tạo Scene, Camera, Renderer
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb); // Màu nền trời

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 15, 60);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        // 2. Ánh sáng
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(50, 100, 50);
        dirLight.castShadow = true;
        scene.add(dirLight);

        // 3. Mở rộng Bãi cỏ & Sân gạch
        // Bãi cỏ rộng bao quanh
        const grassGeo = new THREE.PlaneGeometry(400, 400);
        const grassMat = new THREE.MeshLambertMaterial({ color: 0x55aa33 });
        const grassMesh = new THREE.Mesh(grassGeo, grassMat);
        grassMesh.rotation.x = -Math.PI / 2;
        grassMesh.position.y = -0.1;
        scene.add(grassMesh);

        // Sân gạch lớn
        const courtyardGeo = new THREE.PlaneGeometry(160, 160);
        const courtyardMat = new THREE.MeshLambertMaterial({ color: 0xc8553d }); // Màu gạch đỏ
        const courtyardMesh = new THREE.Mesh(courtyardGeo, courtyardMat);
        courtyardMesh.rotation.x = -Math.PI / 2;
        scene.add(courtyardMesh);

        // Grid trang trí mô phỏng các ô gạch
        const gridHelper = new THREE.GridHelper(160, 40, 0x000000, 0x888888);
        gridHelper.position.y = 0.01;
        scene.add(gridHelper);

        // 4. Tạo các Tòa nhà & Sắp xếp hình chữ L
        function createBuilding(width, height, depth, color) {
            const group = new THREE.Group();
            const geo = new THREE.BoxGeometry(width, height, depth);
            const mat = new THREE.MeshLambertMaterial({ color: color });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.y = height / 2;
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            group.add(mesh);
            return group;
        }

        // Tòa nhà A (Dãy chính)
        const buildingA = createBuilding(70, 12, 15, 0xeeeeee);
        buildingA.position.set(-10, 0, 20);
        scene.add(buildingA);

        // Tòa nhà B (Xếp vuông góc tạo hình chữ L, giao nhau bên phải)
        const buildingB = createBuilding(60, 12, 15, 0xdddddd);
        const BX = 30;
        const BZ = -15;
        buildingB.position.set(BX, 0, BZ);
        buildingB.rotation.y = Math.PI / 2; // Xoay 90 độ
        scene.add(buildingB);

        // 5. Hệ thống di chuyển & Tối ưu quán tính bay (Mượt mà, không giật khựng)
        const velocity = new THREE.Vector3();
        const moveState = { forward: 0, right: 0, up: 0 };
        const DAMPING_FACTOR = 0.82; // Lực cản ma sát giúp dừng mượt, giảm quán tính thừa

        // Điều khiển phím bấm cơ bản
        window.addEventListener('keydown', (e) => {
            switch(e.key.toLowerCase()) {
                case 'w': moveState.forward = 1; break;
                case 's': moveState.forward = -1; break;
                case 'a': moveState.right = -1; break;
                case 'd': moveState.right = 1; break;
                case 'q': moveState.up = 1; break;
                case 'e': moveState.up = -1; break;
            }
        });

        window.addEventListener('keyup', (e) => {
            switch(e.key.toLowerCase()) {
                case 'w': case 's': moveState.forward = 0; break;
                case 'a': case 'd': moveState.right = 0; break;
                case 'q': case 'e': moveState.up = 0; break;
            }
        });

        // 6. Loop Render & Cập nhật vị trí
        function animate() {
            requestAnimationFrame(animate);

            // Tăng vận tốc theo thao tác
            const accel = 0.08;
            if (moveState.forward !== 0) velocity.z -= moveState.forward * accel;
            if (moveState.right !== 0) velocity.x += moveState.right * accel;
            if (moveState.up !== 0) velocity.y += moveState.up * accel;

            // Áp dụng Ma sát / Triệt tiêu quán tính dư thừa
            velocity.x *= DAMPING_FACTOR;
            velocity.y *= DAMPING_FACTOR;
            velocity.z *= DAMPING_FACTOR;

            // Cập nhật vị trí Camera
            camera.translateX(velocity.x);
            camera.translateY(velocity.y);
            camera.translateZ(velocity.z);

            renderer.render(scene, camera);
        }

        // Tự động điều chỉnh kích thước khi thay đổi màn hình
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
