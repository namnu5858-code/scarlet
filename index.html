<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Locket Web</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Inter', sans-serif;
            background-color: #000000;
            color: #ffffff;
            margin: 0;
            padding: 0;
            overflow: hidden;
            height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Khung điện thoại chuẩn Locket */
        .app-container {
            width: 100%;
            max-width: 430px;
            height: 100dvh;
            background-color: #000000;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 16px 16px 24px 16px;
            position: relative;
        }

        /* Khung ngắm Camera vuông bo góc lớn */
        .viewfinder-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 1 / 1;
            border-radius: 44px;
            overflow: hidden;
            background-color: #1c1c1e;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        #camera-video, #captured-canvas {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .mirror {
            transform: scaleX(-1);
        }

        /* Các nút điều khiển cố định trên khung ngắm */
        .cam-overlay-btn {
            background: rgba(28, 28, 30, 0.65);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.12);
            transition: all 0.2s ease;
        }

        .cam-overlay-btn:active {
            transform: scale(0.92);
        }

        .flash-active {
            background: #FFB800 !important;
            color: #000000 !important;
            border-color: #FFB800 !important;
        }

        /* Nút chụp viền vàng đặc trưng */
        .shutter-outer {
            width: 84px;
            height: 84px;
            border-radius: 50%;
            border: 4.5px solid #FFB800;
            padding: 5px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: transform 0.15s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .shutter-outer:active {
            transform: scale(0.92);
        }

        .shutter-inner {
            width: 100%;
            height: 100%;
            background-color: #ffffff;
            border-radius: 50%;
            transition: background-color 0.15s ease;
        }

        .shutter-outer:active .shutter-inner {
            background-color: #e5e5ea;
        }

        /* Nút gửi hình máy bay giấy màu xám chuẩn Locket */
        .send-btn-locket {
            width: 84px;
            height: 84px;
            border-radius: 50%;
            background-color: #2C2C2E;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 30px;
            cursor: pointer;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
        }

        .send-btn-locket:active {
            transform: scale(0.92);
            background-color: #3A3A3C;
        }

        /* Ô nhập Caption trên ảnh */
        .caption-pill {
            background: rgba(20, 20, 22, 0.72);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 999px;
            padding: 8px 16px;
            display: flex;
            align-items: center;
            gap: 8px;
            max-width: 88%;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
        }

        .caption-input {
            background: transparent;
            border: none;
            outline: none;
            color: #ffffff;
            font-size: 15px;
            font-weight: 500;
            text-align: center;
            width: 100%;
        }

        .caption-input::placeholder {
            color: rgba(255, 255, 255, 0.65);
        }

        /* Ngăn kéo tiện ích Aa+ */
        .drawer-backdrop {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(6px);
            z-index: 40;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
        }

        .drawer-backdrop.open {
            opacity: 1;
            pointer-events: auto;
        }

        .widget-drawer {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: #1C1C1E;
            border-top-left-radius: 32px;
            border-top-right-radius: 32px;
            padding: 20px 20px 34px 20px;
            z-index: 50;
            transform: translateY(100%);
            transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .widget-drawer.open {
            transform: translateY(0);
        }

        /* Hiệu ứng chớp đèn Flash */
        .flash-screen {
            position: fixed;
            inset: 0;
            background: #ffffff;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.15s ease-out;
        }

        /* Màn hình lịch sử */
        .history-modal {
            position: absolute;
            inset: 0;
            background: #000000;
            z-index: 60;
            display: flex;
            flex-direction: column;
            padding: 16px;
            transform: translateY(100%);
            transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .history-modal.open {
            transform: translateY(0);
        }
    </style>
</head>
<body>

    <div class="flash-screen" id="flash-overlay"></div>

    <div class="app-container">
        <!-- Header Top Bar -->
        <div class="flex items-center justify-between px-1 pt-1">
            <!-- Nút Avatar cá nhân -->
            <button class="w-10 h-10 rounded-full bg-[#1C1C1E] flex items-center justify-center border border-white/10 text-white/90 hover:bg-[#2C2C2E] transition">
                <i class="fa-solid fa-user text-sm"></i>
            </button>

            <!-- Pill Bạn bè -->
            <div class="bg-[#1C1C1E] px-4 py-2 rounded-full flex items-center gap-2 border border-white/10">
                <i class="fa-solid fa-user-group text-xs text-white/80"></i>
                <span class="text-sm font-semibold tracking-tight">Bạn bè</span>
            </div>

            <!-- Nút Tin nhắn -->
            <button onclick="showToast('Chưa có tin nhắn mới')" class="w-10 h-10 rounded-full bg-[#1C1C1E] flex items-center justify-center border border-white/10 text-white/90 hover:bg-[#2C2C2E] transition relative">
                <i class="fa-regular fa-comment text-base"></i>
            </button>
        </div>

        <!-- Khung ngắm Camera chính -->
        <div class="my-auto flex flex-col items-center w-full">
            <div class="viewfinder-wrapper" id="viewfinder">
                <!-- Video trực tiếp -->
                <video id="camera-video" class="mirror" autoplay playsinline muted></video>
                <!-- Canvas hiển thị ảnh sau khi chụp -->
                <canvas id="captured-canvas" class="hidden"></canvas>

                <!-- Các nút điều khiển cố định trên khung ngắm (Chế độ Camera) -->
                <div id="camera-hud" class="absolute inset-0 pointer-events-none flex flex-col justify-between p-4">
                    <!-- Hàng trên: Flash (Trái) & Zoom (Phải) -->
                    <div class="flex justify-between items-center w-full">
                        <button id="btn-flash" onclick="toggleFlash()" class="pointer-events-auto cam-overlay-btn w-10 h-10 rounded-full flex items-center justify-center" title="Đèn Flash">
                            <i class="fa-solid fa-bolt text-sm"></i>
                        </button>

                        <button id="btn-zoom" onclick="toggleZoom()" class="pointer-events-auto cam-overlay-btn px-3.5 h-9 rounded-full flex items-center justify-center font-bold text-xs tracking-wide" title="Thu phóng">
                            1x
                        </button>
                    </div>
                </div>

                <!-- Thanh nhập Caption & Widget hiển thị (Chế độ Xem trước sau khi chụp) -->
                <div id="preview-hud" class="hidden absolute inset-0 flex flex-col justify-between items-center p-4 pointer-events-none">
                    <!-- Hiển thị Widget đã chọn (Spotify / Thời tiết / Vị trí) -->
                    <div id="active-widget-badge" class="hidden pointer-events-auto mt-1 bg-black/75 backdrop-blur-md border border-white/15 px-3.5 py-1.5 rounded-full flex items-center gap-2 text-xs font-semibold shadow-lg">
                        <span id="widget-icon"></span>
                        <span id="widget-text"></span>
                        <button onclick="clearWidget()" class="ml-1 text-white/50 hover:text-white">
                            <i class="fa-solid fa-xmark"></i>
                        </button>
                    </div>

                    <!-- Ô nhập tin nhắn + Nút mở Aa+ -->
                    <div class="w-full flex justify-center items-center gap-2 mb-1 pointer-events-auto">
                        <div class="caption-pill flex-1">
                            <input type="text" id="caption-input" class="caption-input" placeholder="Thêm một tin nhắn..." maxlength="60">
                        </div>
                        <button onclick="openWidgetDrawer()" class="cam-overlay-btn w-10 h-10 rounded-full flex items-center justify-center font-bold text-xs shrink-0" title="Tiện ích Aa+">
                            Aa+
                        </button>
                    </div>
                </div>
            </div>

            <!-- Danh sách chọn người nhận (Chỉ hiện khi đang xem trước ảnh) -->
            <div id="recipient-selector" class="hidden flex items-center justify-center gap-4 mt-5">
                <button onclick="selectRecipient(this, 'Tất cả')" class="recipient-item flex flex-col items-center gap-1.5 opacity-100 transition">
                    <div class="w-11 h-11 rounded-full bg-[#FFB800] text-black flex items-center justify-center font-bold text-xs ring-2 ring-[#FFB800] ring-offset-2 ring-offset-black">
                        <i class="fa-solid fa-users"></i>
                    </div>
                    <span class="text-[11px] font-semibold text-[#FFB800]">Tất cả</span>
                </button>
                <button onclick="selectRecipient(this, 'Minh Anh')" class="recipient-item flex flex-col items-center gap-1.5 opacity-50 hover:opacity-80 transition">
                    <div class="w-11 h-11 rounded-full bg-[#2C2C2E] text-white flex items-center justify-center font-bold text-sm border border-white/15">
                        MA
                    </div>
                    <span class="text-[11px] font-medium text-white/80">Minh Anh</span>
                </button>
                <button onclick="selectRecipient(this, 'Hoàng Nam')" class="recipient-item flex flex-col items-center gap-1.5 opacity-50 hover:opacity-80 transition">
                    <div class="w-11 h-11 rounded-full bg-[#2C2C2E] text-white flex items-center justify-center font-bold text-sm border border-white/15">
                        HN
                    </div>
                    <span class="text-[11px] font-medium text-white/80">Hoàng Nam</span>
                </button>
            </div>
        </div>

        <!-- Khu vực điều khiển phía dưới -->
        <div class="flex flex-col items-center gap-5 pb-1">
            <!-- Bộ nút khi đang chụp -->
            <div id="capture-controls" class="w-full flex items-center justify-around px-4">
                <!-- Nút Thư viện ảnh -->
                <label class="w-12 h-12 rounded-full flex items-center justify-center text-white/80 hover:text-white hover:bg-white/10 transition cursor-pointer" title="Tải ảnh lên">
                    <i class="fa-regular fa-images text-xl"></i>
                    <input type="file" accept="image/*" class="hidden" onchange="handleImageUpload(event)">
                </label>

                <!-- Nút Chụp Viền Vàng Lớn -->
                <div class="shutter-outer" onclick="takePhoto()" title="Chụp ảnh">
                    <div class="shutter-inner"></div>
                </div>

                <!-- Nút Đổi Camera -->
                <button onclick="switchCamera()" class="w-12 h-12 rounded-full flex items-center justify-center text-white/80 hover:text-white hover:bg-white/10 transition" title="Đổi camera">
                    <i class="fa-solid fa-arrows-rotate text-xl"></i>
                </button>
            </div>

            <!-- Bộ nút khi đang xem trước ảnh (Hủy - Gửi - Lưu) -->
            <div id="preview-controls" class="hidden w-full flex items-center justify-around px-4">
                <!-- Nút Hủy / Chụp lại -->
                <button onclick="retakePhoto()" class="w-12 h-12 rounded-full bg-[#1C1C1E] flex items-center justify-center text-white/90 hover:bg-[#2C2C2E] transition" title="Chụp lại">
                    <i class="fa-solid fa-xmark text-xl"></i>
                </button>

                <!-- Nút Gửi Hình Tròn Xám với Máy Bay Giấy -->
                <button onclick="sendLocket()" class="send-btn-locket" title="Gửi Locket">
                    <i class="fa-regular fa-paper-plane -ml-1 mt-0.5"></i>
                </button>

                <!-- Nút Lưu về máy -->
                <button onclick="downloadPhoto()" class="w-12 h-12 rounded-full bg-[#1C1C1E] flex items-center justify-center text-white/90 hover:bg-[#2C2C2E] transition" title="Lưu ảnh">
                    <i class="fa-solid fa-download text-lg"></i>
                </button>
            </div>

            <!-- Nút Lịch sử phía dưới cùng -->
            <button id="history-trigger" onclick="openHistory()" class="flex flex-col items-center gap-1 text-white/80 hover:text-white transition pt-1">
                <div class="flex items-center gap-2">
                    <span class="w-6 h-6 rounded-md bg-[#2C2C2E] border border-white/15 flex items-center justify-center text-xs font-bold text-[#FFB800]" id="history-count">0</span>
                    <span class="text-sm font-bold tracking-tight">Lịch sử</span>
                </div>
                <i class="fa-solid fa-chevron-down text-xs text-white/50"></i>
            </button>
        </div>

        <!-- Ngăn kéo tiện ích Aa+ -->
        <div class="drawer-backdrop" id="drawer-backdrop" onclick="closeWidgetDrawer()"></div>
        <div class="widget-drawer" id="widget-drawer">
            <div class="w-10 h-1 bg-white/20 rounded-full mx-auto mb-5"></div>
            <h3 class="text-base font-bold text-center mb-4">Tiện ích & Nhãn dán</h3>
            
            <div class="grid grid-cols-2 gap-3">
                <!-- Tiện ích Spotify -->
                <button onclick="promptSpotify()" class="bg-[#2C2C2E] hover:bg-[#3A3A3C] p-3.5 rounded-2xl flex items-center gap-3 text-left transition border border-white/5">
                    <div class="w-10 h-10 rounded-full bg-[#1DB954]/20 text-[#1DB954] flex items-center justify-center text-lg shrink-0">
                        <i class="fa-brands fa-spotify"></i>
                    </div>
                    <div>
                        <div class="text-sm font-bold text-white">Spotify</div>
                        <div class="text-[11px] text-white/60">Gắn bài hát</div>
                    </div>
                </button>

                <!-- Tiện ích Thời tiết -->
                <button onclick="applyWidget('weather')" class="bg-[#2C2C2E] hover:bg-[#3A3A3C] p-3.5 rounded-2xl flex items-center gap-3 text-left transition border border-white/5">
                    <div class="w-10 h-10 rounded-full bg-[#FFB800]/20 text-[#FFB800] flex items-center justify-center text-lg shrink-0">
                        <i class="fa-solid fa-cloud-sun"></i>
                    </div>
                    <div>
                        <div class="text-sm font-bold text-white">Thời tiết</div>
                        <div class="text-[11px] text-white/60">24°C Hà Nội</div>
                    </div>
                </button>

                <!-- Tiện ích Giờ hiện tại -->
                <button onclick="applyWidget('time')" class="bg-[#2C2C2E] hover:bg-[#3A3A3C] p-3.5 rounded-2xl flex items-center gap-3 text-left transition border border-white/5">
                    <div class="w-10 h-10 rounded-full bg-blue-500/20 text-blue-400 flex items-center justify-center text-lg shrink-0">
                        <i class="fa-regular fa-clock"></i>
                    </div>
                    <div>
                        <div class="text-sm font-bold text-white">Thời gian</div>
                        <div class="text-[11px] text-white/60">Giờ chụp thực</div>
                    </div>
                </button>

                <!-- Tiện ích Vị trí -->
                <button onclick="applyWidget('location')" class="bg-[#2C2C2E] hover:bg-[#3A3A3C] p-3.5 rounded-2xl flex items-center gap-3 text-left transition border border-white/5">
                    <div class="w-10 h-10 rounded-full bg-rose-500/20 text-rose-400 flex items-center justify-center text-lg shrink-0">
                        <i class="fa-solid fa-location-dot"></i>
                    </div>
                    <div>
                        <div class="text-sm font-bold text-white">Vị trí</div>
                        <div class="text-[11px] text-white/60">Hà Nội, VN</div>
                    </div>
                </button>
            </div>
        </div>

        <!-- Màn hình Lịch sử Locket -->
        <div class="history-modal" id="history-modal">
            <div class="flex items-center justify-between pb-4 border-b border-white/10">
                <button onclick="closeHistory()" class="w-10 h-10 rounded-full bg-[#1C1C1E] flex items-center justify-center">
                    <i class="fa-solid fa-chevron-up"></i>
                </button>
                <span class="font-bold text-base">Lịch sử Locket</span>
                <div class="w-10"></div>
            </div>

            <div id="history-grid" class="flex-1 overflow-y-auto py-4 grid grid-cols-2 gap-3 content-start">
                <!-- Các ảnh đã gửi sẽ hiển thị tại đây -->
            </div>
        </div>

        <!-- Thông báo Toast -->
        <div id="toast" class="fixed top-16 left-1/2 -translate-x-1/2 bg-[#2C2C2E] text-white text-xs font-semibold px-4 py-2.5 rounded-full shadow-xl border border-white/10 opacity-0 pointer-events-none transition-opacity duration-200 z-50">
            Thông báo
        </div>
    </div>

    <script>
        const video = document.getElementById('camera-video');
        const canvas = document.getElementById('captured-canvas');
        const ctx = canvas.getContext('2d');
        
        let currentStream = null;
        let facingMode = 'user'; // 'user' hoặc 'environment'
        let isFlashOn = false;
        let zoomLevel = 1; // 1 hoặc 2
        let activeWidget = null;
        let selectedRecipient = 'Tất cả';
        let locketHistory = [];

        // Khởi động Camera
        async function initCamera() {
            if (currentStream) {
                currentStream.getTracks().forEach(track => track.stop());
            }
            try {
                const constraints = {
                    video: {
                        facingMode: facingMode,
                        width: { ideal: 1080 },
                        height: { ideal: 1080 }
                    },
                    audio: false
                };
                currentStream = await navigator.mediaDevices.getUserMedia(constraints);
                video.srcObject = currentStream;
                
                // Lật gương nếu là camera trước
                if (facingMode === 'user') {
                    video.classList.add('mirror');
                } else {
                    video.classList.remove('mirror');
                }
                applyZoomTransform();
            } catch (err) {
                console.warn('Không truy cập được camera, chuyển sang chế độ giả lập:', err);
                showToast('Không tìm thấy camera, bạn có thể tải ảnh lên từ thư viện');
            }
        }

        // Bật/Tắt Flash
        function toggleFlash() {
            isFlashOn = !isFlashOn;
            const btn = document.getElementById('btn-flash');
            if (isFlashOn) {
                btn.classList.add('flash-active');
                showToast('Đã bật đèn Flash');
            } else {
                btn.classList.remove('flash-active');
                showToast('Đã tắt đèn Flash');
            }
        }

        // Chuyển đổi Zoom 1x / 2x
        function toggleZoom() {
            zoomLevel = zoomLevel === 1 ? 2 : 1;
            document.getElementById('btn-zoom').innerText = zoomLevel + 'x';
            applyZoomTransform();
        }

        function applyZoomTransform() {
            const mirrorPrefix = facingMode === 'user' ? 'scaleX(-1) ' : '';
            video.style.transform = `${mirrorPrefix}scale(${zoomLevel})`;
        }

        // Đổi camera trước / sau
        function switchCamera() {
            facingMode = facingMode === 'user' ? 'environment' : 'user';
            zoomLevel = 1;
            document.getElementById('btn-zoom').innerText = '1x';
            initCamera();
        }

        // Chụp ảnh
        function takePhoto() {
            // Hiệu ứng chớp màn hình nếu bật Flash
            if (isFlashOn) {
                const flashOverlay = document.getElementById('flash-overlay');
                flashOverlay.style.opacity = '0.95';
                setTimeout(() => { flashOverlay.style.opacity = '0'; }, 180);
            }

            const size = 1080;
            canvas.width = size;
            canvas.height = size;

            ctx.save();
            if (facingMode === 'user') {
                ctx.translate(size, 0);
                ctx.scale(-1, 1);
            }

            if (video.readyState === video.HAVE_ENOUGH_DATA) {
                const vw = video.videoWidth;
                const vh = video.videoHeight;
                const minSide = Math.min(vw, vh) / zoomLevel;
                const sx = (vw - minSide) / 2;
                const sy = (vh - minSide) / 2;
                ctx.drawImage(video, sx, sy, minSide, minSide, 0, 0, size, size);
            } else {
                // Hình nền mẫu nếu máy không có webcam
                const grad = ctx.createLinearGradient(0, 0, size, size);
                grad.addColorStop(0, '#2c3e50');
                grad.addColorStop(1, '#000000');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, size, size);
            }
            ctx.restore();

            enterPreviewMode();
        }

        // Tải ảnh từ thư viện máy
        function handleImageUpload(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const size = 1080;
                    canvas.width = size;
                    canvas.height = size;
                    const minSide = Math.min(img.width, img.height);
                    const sx = (img.width - minSide) / 2;
                    const sy = (img.height - minSide) / 2;
                    ctx.drawImage(img, sx, sy, minSide, minSide, 0, 0, size, size);
                    enterPreviewMode();
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        // Chuyển sang giao diện Xem trước
        function enterPreviewMode() {
            video.classList.add('hidden');
            canvas.classList.remove('hidden');
            
            document.getElementById('camera-hud').classList.add('hidden');
            document.getElementById('preview-hud').classList.remove('hidden');
            
            document.getElementById('capture-controls').classList.add('hidden');
            document.getElementById('preview-controls').classList.remove('hidden');
            
            document.getElementById('recipient-selector').classList.remove('hidden');
            document.getElementById('history-trigger').classList.add('hidden');
        }

        // Quay lại giao diện Chụp
        function retakePhoto() {
            canvas.classList.add('hidden');
            video.classList.remove('hidden');
            
            document.getElementById('preview-hud').classList.add('hidden');
            document.getElementById('camera-hud').classList.remove('hidden');
            
            document.getElementById('preview-controls').classList.add('hidden');
            document.getElementById('capture-controls').classList.remove('hidden');
            
            document.getElementById('recipient-selector').classList.add('hidden');
            document.getElementById('history-trigger').classList.remove('hidden');
            
            document.getElementById('caption-input').value = '';
            clearWidget();
        }

        // Quản lý Ngăn kéo Tiện ích Aa+
        function openWidgetDrawer() {
            document.getElementById('drawer-backdrop').classList.add('open');
            document.getElementById('widget-drawer').classList.add('open');
        }

        function closeWidgetDrawer() {
            document.getElementById('drawer-backdrop').classList.remove('open');
            document.getElementById('widget-drawer').classList.remove('open');
        }

        function promptSpotify() {
            closeWidgetDrawer();
            const song = prompt('Nhập tên bài hát & nghệ sĩ (VD: Chúng Ta Của Tương Lai - Sơn Tùng M-TP):', 'Đừng Làm Trái Tim Anh Đau - Sơn Tùng M-TP');
            if (song && song.trim() !== '') {
                setWidget('<i class="fa-brands fa-spotify text-[#1DB954]"></i>', song.trim());
            }
        }

        function applyWidget(type) {
            closeWidgetDrawer();
            if (type === 'weather') {
                setWidget('<i class="fa-solid fa-cloud-sun text-[#FFB800]"></i>', '24°C • Hà Nội');
            } else if (type === 'time') {
                const now = new Date();
                const timeStr = now.toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' });
                setWidget('<i class="fa-regular fa-clock text-blue-400"></i>', timeStr);
            } else if (type === 'location') {
                setWidget('<i class="fa-solid fa-location-dot text-rose-400"></i>', 'Hà Nội, Việt Nam');
            }
        }

        function setWidget(iconHtml, text) {
            activeWidget = { iconHtml, text };
            const badge = document.getElementById('active-widget-badge');
            document.getElementById('widget-icon').innerHTML = iconHtml;
            document.getElementById('widget-text').innerText = text;
            badge.classList.remove('hidden');
        }

        function clearWidget() {
            activeWidget = null;
            document.getElementById('active-widget-badge').classList.add('hidden');
        }

        // Chọn người nhận
        function selectRecipient(el, name) {
            selectedRecipient = name;
            document.querySelectorAll('.recipient-item').forEach(item => {
                item.classList.remove('opacity-100');
                item.classList.add('opacity-50');
            });
            el.classList.remove('opacity-50');
            el.classList.add('opacity-100');
        }

        // Gửi Locket & Lưu vào Lịch sử
        function sendLocket() {
            const caption = document.getElementById('caption-input').value.trim();
            const imageData = canvas.toDataURL('image/jpeg', 0.9);
            const now = new Date();
            const timeString = now.toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' });

            locketHistory.unshift({
                image: imageData,
                caption: caption,
                widget: activeWidget ? activeWidget.text : null,
                recipient: selectedRecipient,
                time: timeString
            });

            document.getElementById('history-count').innerText = locketHistory.length;
            renderHistory();
            showToast(`Đã gửi tới ${selectedRecipient}!`);
            retakePhoto();
        }

        // Tải ảnh về máy
        function downloadPhoto() {
            const link = document.createElement('a');
            link.download = `Locket_${Date.now()}.jpg`;
            link.href = canvas.toDataURL('image/jpeg', 0.95);
            link.click();
            showToast('Đã lưu ảnh vào thiết bị');
        }

        // Quản lý Lịch sử
        function openHistory() {
            renderHistory();
            document.getElementById('history-modal').classList.add('open');
        }

        function closeHistory() {
            document.getElementById('history-modal').classList.remove('open');
        }

        function renderHistory() {
            const grid = document.getElementById('history-grid');
            if (locketHistory.length === 0) {
                grid.innerHTML = `<div class="col-span-2 text-center text-white/40 text-sm py-20">Chưa có ảnh nào được gửi</div>`;
                return;
            }
            grid.innerHTML = locketHistory.map(item => `
                <div class="relative aspect-square rounded-3xl overflow-hidden bg-[#1C1C1E] border border-white/10">
                    <img src="${item.image}" class="w-full h-full object-cover">
                    <div class="absolute top-2 left-2 bg-black/60 backdrop-blur-md px-2 py-0.5 rounded-full text-[10px] font-semibold">
                        ${item.time} • ${item.recipient}
                    </div>
                    ${item.widget ? `<div class="absolute top-8 left-2 bg-black/70 px-2 py-0.5 rounded-full text-[10px] text-[#1DB954] font-semibold truncate max-w-[85%]">${item.widget}</div>` : ''}
                    ${item.caption ? `<div class="absolute bottom-2 left-2 right-2 bg-black/75 backdrop-blur-md px-2.5 py-1 rounded-full text-xs text-center truncate">${item.caption}</div>` : ''}
                </div>
            `).join('');
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.style.opacity = '1';
            setTimeout(() => { toast.style.opacity = '0'; }, 2200);
        }

        // Khởi chạy ứng dụng
        window.addEventListener('DOMContentLoaded', initCamera);
    </script>
</body>
</html>
