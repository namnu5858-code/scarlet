/* =========================================================
   HELPERS
   ========================================================= */

function box(
  w,
  h,
  d,
  x,
  y,
  z,
  material,
  parent=scene,
  rx=0,
  ry=0,
  rz=0
){
  const mesh = new THREE.Mesh(
    new THREE.BoxGeometry(w,h,d),
    material
  );

  mesh.position.set(x,y,z);
  mesh.rotation.set(rx,ry,rz);

  mesh.castShadow=true;
  mesh.receiveShadow=true;

  parent.add(mesh);

  return mesh;
}


function cylinder(
  radius,
  height,
  x,
  y,
  z,
  material,
  parent=scene
){
  const mesh = new THREE.Mesh(
    new THREE.CylinderGeometry(
      radius,
      radius,
      height,
      16
    ),
    material
  );

  mesh.position.set(x,y,z);

  mesh.castShadow=true;
  mesh.receiveShadow=true;

  parent.add(mesh);

  return mesh;
}


/*
  Text trên biển hiệu:
  - Không thay đổi hình dạng biển.
  - Chỉ đặt mặt chữ sát đúng mặt trước biển.
  - DoubleSide để luôn nhìn thấy chữ từ phía sân trường.
  - depthWrite=false + polygonOffset để tránh z-fighting.
*/
function textPlane(
  text,
  width,
  height,
  x,
  y,
  z,
  rotationY=0,
  parent=scene
){

  const c = document.createElement("canvas");

  c.width=2048;
  c.height=320;

  const ctx=c.getContext("2d");

  ctx.clearRect(0,0,c.width,c.height);

  ctx.fillStyle="#ffffff";
  ctx.font="bold 145px Arial";
  ctx.textAlign="center";
  ctx.textBaseline="middle";

  ctx.fillText(
    text,
    c.width/2,
    c.height/2
  );

  const texture=new THREE.CanvasTexture(c);

  texture.colorSpace=THREE.SRGBColorSpace;
  texture.needsUpdate=true;

  const material=new THREE.MeshBasicMaterial({
    map:texture,
    transparent:true,
    side:THREE.DoubleSide,
    depthTest:true,
    depthWrite:false,
    polygonOffset:true,
    polygonOffsetFactor:-4,
    polygonOffsetUnits:-4
  });

  const mesh=new THREE.Mesh(
    new THREE.PlaneGeometry(width,height),
    material
  );

  mesh.position.set(x,y,z);
  mesh.rotation.y=rotationY;
  mesh.renderOrder=20;

  parent.add(mesh);

  return mesh;
}

*/

campus.add(stairGroup);


/*
  Building B có mặt trước ở:

*/

const stairStartZ=BZ-31.0;

const stepCount=16;
const stepRun=1.0;
const stepRise=.65;
const stepDepth=1.02;


/* chân đế dưới cầu thang */

  7,
  .8,
  4,
  stairX,
  .4,

);


/* các bậc */

for(let i=0;i<stepCount;i++){

    new THREE.BoxGeometry(

    ),

}


/* tay vịn */

const stairRailLength=(stepCount-1)*stepRun+1.2;

const stairRailY=
  .8+
  ((stepCount-1)*stepRise)/2+
  1.0;

const stairRailZ=
  stairStartZ+
  ((stepCount-1)*stepRun)/2;


for(let side=-1;side<=1;side+=2){

  const rail=new THREE.Mesh(
    new THREE.BoxGeometry(
      .15,
      1.15,
      stairRailLength
    ),
    MAT.steel
  );

  rail.position.set(
    stairX+side*3.4,
    stairRailY,
    stairRailZ
  );

  /*
    Độ dốc theo đúng hướng lên của cầu thang.
  */
  rail.rotation.x=
    -Math.atan2(
      (stepCount-1)*stepRise,
      (stepCount-1)*stepRun
    );

  rail.castShadow=true;
  rail.receiveShadow=true;

  stairGroup.add(rail);
}

/* =========================================================
   MOTORBIKE
   ========================================================= */

function createMotorbike(
  x,
  z,
  rotationY=0,
  parent=parking
){

  const bike=new THREE.Group();

  bike.position.set(x,0,z);
  bike.rotation.y=rotationY;

  parent.add(bike);


  /* wheels */

  const wheelMat=new THREE.MeshStandardMaterial({
    color:0x171717,
    roughness:.8
  });

  const wheel1=new THREE.Mesh(
    new THREE.CylinderGeometry(
      .55,
      .55,
      .22,
      18
    ),
    wheelMat
  );

  wheel1.rotation.z=Math.PI/2;
  wheel1.position.set(0,.65,-1.05);

  wheel1.castShadow=true;

  bike.add(wheel1);


  const wheel2=wheel1.clone();

  wheel2.position.z=1.05;

  bike.add(wheel2);


  /* thân xe */

  box(
    .8,
    .55,
    1.9,
    0,
    1.05,
    0,
    MAT.darkMetal,
    bike
  );


  /* yên */

  box(
    .72,
    .18,
    .85,
    0,
    1.5,
    .15,
    MAT.black || MAT.darkMetal,
    bike
  );


  /* đầu xe */

  box(
    .7,
    .7,
    .45,

/* =========================================================
   GLTF MODEL
   ========================================================= */

const loader=new GLTFLoader();

let gltfRoot=null;
let mixer=null;

const animatedLeaves=[];
const animatedArms=[];
const animatedRoots=[];

loader.load(
  "scene.gltf",

  function(gltf){

    gltfRoot=gltf.scene;

    gltfRoot.position.set(
      0,
      0,
      0
    );

    gltfRoot.rotation.set(
      0,
      0,
      0
    );

    gltfRoot.scale.set(
      1,
      1,
      1
    );

    gltfRoot.traverse(function(obj){

      if(obj.isMesh){

        obj.castShadow=true;
        obj.receiveShadow=true;

      }

      const name=(obj.name||"").toLowerCase();

      if(
        name.includes("leaf") ||
        name.includes("la") ||
        name.includes("leaves")
      ){

        animatedLeaves.push(obj);

      }

      if(
        name.includes("arm") ||
        name.includes("tay")
      ){

        animatedArms.push(obj);

      }

      if(
        name.includes("root") ||
        name.includes("rễ") ||
        name.includes("re")
      ){

        animatedRoots.push(obj);

      }

    });

    playerVisual.add(gltfRoot);

    if(gltf.animations && gltf.animations.length){

      mixer=new THREE.AnimationMixer(gltfRoot);

      gltf.animations.forEach(function(clip){

        const action=mixer.clipAction(clip);

        action.play();

      });

    }

    document.getElementById("loading").style.display="none";

  },

  function(xhr){

    if(xhr.total){

      const percent=
        Math.round(
          xhr.loaded/xhr.total*100
        );

      document.getElementById("loading").textContent=
        "Đang tải mô hình... "+percent+"%";

    }

  },

  function(error){

    console.error(
      "Không thể tải scene.gltf:",
      error
    );

    document.getElementById("loading").textContent=
      "Không tải được scene.gltf";

  }
);


/* =========================================================
   MOVEMENT
   ========================================================= */

const walkSpeed=6.0;


/*
  80 km/h = 22.222... m/s
  Giữ cơ chế bay cũ, chỉ đặt đúng tốc độ yêu cầu.
*/
const FLY_SPEED=22.22;

let moveSpeed=walkSpeed;

const gravity=-20;

const velocity=new THREE.Vector3();

let grounded=true;
let isFlying=false;


/* =========================================================
   JOYSTICK
   ========================================================= */

const joystick=document.getElementById("joystick");
const stick=document.getElementById("stick");

let joyX=0;
let joyY=0;
let joystickActive=false;

const JOY_RADIUS=43;


function updateJoystick(clientX,clientY){

  const rect=joystick.getBoundingClientRect();

  const cx=rect.left+rect.width/2;
  const cy=rect.top+rect.height/2;

  let dx=clientX-cx;
  let dy=clientY-cy;

  const length=Math.sqrt(
    dx*dx+dy*dy
  );

  if(length>JOY_RADIUS){

    dx=dx/length*JOY_RADIUS;
    dy=dy/length*JOY_RADIUS;

  }

  joyX=dx/JOY_RADIUS;
  joyY=dy/JOY_RADIUS;

  stick.style.transform=
    `translate(${dx}px,${dy}px)`;
}


function resetJoystick(){

  joystickActive=false;

  joyX=0;
  joyY=0;

  stick.style.transform=
    "translate(0,0)";
}


joystick.addEventListener(
  "pointerdown",
  function(e){

    joystickActive=true;

    joystick.setPointerCapture(e.pointerId);

    updateJoystick(
      e.clientX,
      e.clientY
    );

  }
);


joystick.addEventListener(
  "pointermove",
  function(e){

    if(!joystickActive)return;

    updateJoystick(
      e.clientX,
      e.clientY
    );

  }
);


joystick.addEventListener(
  "pointerup",
  resetJoystick
);

joystick.addEventListener(
  "pointercancel",
  resetJoystick
);


/* =========================================================
   JUMP / FLY
   ========================================================= */

const jumpButton=document.getElementById("jump");

let tapCount=0;
let tapTimer=null;

jumpButton.addEventListener(
  "pointerdown",
  function(e){

    e.preventDefault();

    tapCount++;

    clearTimeout(tapTimer);

    tapTimer=setTimeout(
      function(){

        if(tapCount===1){

          /*
            Nhảy bình thường.
          */

          if(grounded){

            velocity.y=8.5;
            grounded=false;

          }else if(isFlying){

            velocity.y=4.5;

          }

        }

        else if(tapCount===2){

          /*
            Double tap:
            bật Fly Mode ở 80 km/h.
          */

          isFlying=true;
          grounded=false;

          moveSpeed=FLY_SPEED;

          velocity.y=3.0;

          jumpButton.classList.add(
            "flying"
          );

        }

        else{

          /*
            3 tap trở lên:
            hạ cánh.
          */

          isFlying=false;

          moveSpeed=walkSpeed;

          velocity.y=-10;

          jumpButton.classList.remove(
            "flying"
          );

        }

        tapCount=0;

      },
      300
    );

  }
);


/* =========================================================
   CAMERA SWIPE
   ========================================================= */

let cameraDragging=false;

let lastPointerX=0;
let lastPointerY=0;

let pinchStartDistance=null;
let pinchStartCameraDistance=null;


function clampCamera(){

  cameraPitch=
    THREE.MathUtils.clamp(
      cameraPitch,
      MIN_PITCH,
      MAX_PITCH
    );

  cameraDistance=
    THREE.MathUtils.clamp(
      cameraDistance,
      3,
      30
    );

}


canvas.addEventListener(
  "pointerdown",
  function(e){

    cameraDragging=true;

    lastPointerX=e.clientX;
    lastPointerY=e.clientY;

    canvas.setPointerCapture(
      e.pointerId
    );

  }
);


canvas.addEventListener(
  "pointermove",
  function(e){

    if(!cameraDragging)return;

    const dx=e.clientX-lastPointerX;
    const dy=e.clientY-lastPointerY;

    lastPointerX=e.clientX;
    lastPointerY=e.clientY;

    cameraYaw-=dx*.005;
    cameraPitch-=dy*.005;

    clampCamera();

  }
);


canvas.addEventListener(
  "pointerup",
  function(){

    cameraDragging=false;

  }
);


canvas.addEventListener(
  "pointercancel",
  function(){

    cameraDragging=false;

  }
);


/* =========================================================
   TOUCH PINCH ZOOM
   ========================================================= */

function touchDistance(a,b){

  const dx=a.clientX-b.clientX;
  const dy=a.clientY-b.clientY;

  return Math.sqrt(
    dx*dx+dy*dy
  );

}


canvas.addEventListener(
  "touchstart",
  function(e){

    if(e.touches.length===2){

      pinchStartDistance=
        touchDistance(
          e.touches[0],
          e.touches[1]
        );

      pinchStartCameraDistance=
        cameraDistance;

    }

  },
  {passive:false}
);


canvas.addEventListener(
  "touchmove",
  function(e){

    if(e.touches.length===2){

      e.preventDefault();

      const distance=
        touchDistance(
          e.touches[0],
          e.touches[1]
        );

      if(
        pinchStartDistance &&
        pinchStartCameraDistance
      ){

        const delta=
          distance-pin­chStartDistance;

      }

    }

  },
  {passive:false}
);


/*
  Wheel zoom trên máy tính.
*/

window.addEventListener(
  "wheel",
  function(e){

    cameraDistance+=e.deltaY*.01;

    clampCamera();

  },
  {passive:true}
);


/* =========================================================
   CAMERA UPDATE
   ========================================================= */

function updateCamera(){

  cameraPivot.position.copy(
    player.position
  );

  camera.position.set(
    0,
    0,
    cameraDistance
  );

  camera.rotation.order="YXZ";

  camera.rotation.x=
    cameraPitch;

  camera.rotation.y=
    cameraYaw+Math.PI;

}


/* =========================================================
   PLAYER MOVEMENT
   ========================================================= */

const clock=new THREE.Clock();

function updateMovement(dt){

  /*
    Joystick:
      joyY < 0 = tiến
      joyY > 0 = lùi
  */

  const inputX=joyX;
  const inputZ=joyY;

  let magnitude=Math.sqrt(
    inputX*inputX+
    inputZ*inputZ
  );

  if(magnitude>1)magnitude=1;

  if(magnitude>0.01){

    const forward=new THREE.Vector3(
      Math.sin(cameraYaw),
      0,
      Math.cos(cameraYaw)
    );

    const right=new THREE.Vector3(
      Math.cos(cameraYaw),
      0,
      -Math.sin(cameraYaw)
    );

    const movement=new THREE.Vector3();

    movement.addScaledVector(
      right,
      inputX
    );

    movement.addScaledVector(
      forward,
      inputZ
    );

    movement.normalize();

    movement.multiplyScalar(
      moveSpeed*magnitude*dt
    );

    player.position.add(
      movement
    );

  }


  /* vật lý */

  if(isFlying){

    /*
      Fly mode:
      không rơi xuống mặt đất.
    */

    velocity.y*=0.92;

    player.position.y+=
      velocity.y*dt;

  }else{

    velocity.y+=
      gravity*dt;

    player.position.y+=
      velocity.y*dt;

    if(player.position.y<=0){

      player.position.y=0;

      velocity.y=0;

      grounded=true;

    }

  }


  /*
    Giới hạn không cho nhân vật đi quá xa
    khỏi khu vực campus.
  */

  player.position.x=
    THREE.MathUtils.clamp(
      player.position.x,
      -190,
      190
    );

  player.position.z=
    THREE.MathUtils.clamp(
      player.position.z,
      -190,
      190
    );

}


/* =========================================================
   SUNFLOWER / LEAF ANIMATION
   ========================================================= */

let animationTime=0;

function updateSceneAnimations(dt){

  animationTime+=dt;

  if(mixer){

    mixer.update(dt);

  }


  /*
    Giữ animation lá cây hiện có ở mức rất nhẹ,
    không thay đổi model.
  */

  for(let i=0;i<animatedLeaves.length;i++){

    const obj=animatedLeaves[i];

    obj.rotation.z+=
      Math.sin(
        animationTime*1.2+i
      )*.0005;

  }


  for(let i=0;i<animatedArms.length;i++){

    const obj=animatedArms[i];

    obj.rotation.z+=
      Math.sin(
        animationTime*1.1+i
      )*.0003;

  }


  for(let i=0;i<animatedRoots.length;i++){

    const obj=animatedRoots[i];

    obj.rotation.y+=
      Math.sin(
        animationTime*.8+i
      )*.0002;

  }

}


/* =========================================================
   RESIZE
   ========================================================= */

window.addEventListener(
  "resize",
  function(){

    camera.aspect=
      window.innerWidth/
      window.innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
      window.innerWidth,
      window.innerHeight
    );

    renderer.setPixelRatio(
      Math.min(
        window.devicePixelRatio,
        2
      )
    );

  }
);


/* =========================================================
   MAIN LOOP
   ========================================================= */

function animate(){

  requestAnimationFrame(
    animate
  );

  const dt=Math.min(
    clock.getDelta(),
    .05
  );

  updateMovement(dt);

  updateSceneAnimations(dt);

  updateCamera();

  renderer.render(
    scene,
    camera
  );

}


updateCamera();
animate();
