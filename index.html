<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Mo Hinh Truong Hoc 3D - Sunflower Game</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #87CEEB;
            font-family: Arial, sans-serif;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }
        /* UI Overlay */
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            padding: env(safe-area-inset-top, 20px) env(safe-area-inset-right, 20px) env(safe-area-inset-bottom, 20px) env(safe-area-inset-left, 20px);
            box-sizing: border-box;
        }
        .hud-element {
            pointer-events: auto;
        }
        /* HP Heart UI (Right Top/Corner area) */
        #health-container {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            align-items: center;
            background: rgba(0, 0, 0, 0.4);
            padding: 8px 15px;
            border-radius: 20px;
            pointer-events: auto;
        }
        .heart-icon {
            width: 28px;
            height: 28px;
            background-color: #ff3366;
            position: relative;
            transform: rotate(-45deg);
            margin-right: 12px;
            box-shadow: 0 0 5px rgba(0,0,0,0.5);
            border: 2px solid #000;
        }
        .heart-icon::before,
        .heart-icon::after {
            content: "";
            width: 28px;
            height: 28px;
            background-color: #ff3366;
            border-radius: 50%;
            position: absolute;
            border: 2px solid #000;
        }
        .heart-icon::before {
            top: -14px;
            left: 0;
        }
        .heart-icon::after {
            left: 14px;
            top: 0;
        }
        #hp-text {
            color: #ffffff;
            font-size: 22px;
            font-weight: bold;
            text-shadow: -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000, 2px 2px 0 #000;
        }

        /* Zoom Controls Top Right (below HP) */
        #zoom-controls {
            position: absolute;
            top: 75px;
            right: 20px;
            display: flex;
            gap: 10px;
            pointer-events: auto;
        }
        .zoom-btn {
            width: 45px;
            height: 45px;
            background: rgba(255, 255, 255, 0.8);
            border: 2px solid #333;
            border-radius: 50%;
            font-size: 20px;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            cursor: pointer;
            outline: none;
        }
        .zoom-btn:active {
            background: rgba(200, 200, 200, 0.9);
            transform: scale(0.95);
        }

        /* Bottom Left D-Pad Controls */
        #left-controls {
            position: absolute;
            bottom: 30px;
            left: 30px;
            display: grid;
            grid-template-columns: repeat(3, 55px);
            grid-template-rows: repeat(3, 55px);
            gap: 5px;
            pointer-events: auto;
        }
        .d-btn {
            background: rgba(255, 255, 255, 0.8);
            border: 2px solid #333;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            cursor: pointer;
            user-select: none;
        }
        .d-btn:active, .d-btn.active {
            background: rgba(200, 200, 200, 0.95);
            transform: scale(0.95);
        }
        #btn-up { grid-column: 2; grid-row: 1; }
        #btn-left { grid-column: 1; grid-row: 2; }
        #btn-right { grid-column: 3; grid-row: 2; }
        #btn-down { grid-column: 2; grid-row: 3; }

        /* Bottom Right Action Controls */
        #right-controls {
            position: absolute;
            bottom: 30px;
            right: 30px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            align-items: flex-end;
            pointer-events: auto;
        }
        .action-row {
            display: flex;
            gap: 15px;
        }
        .control-btn {
            width: 65px;
            height: 65px;
            background: rgba(255, 255, 255, 0.8);
            border: 3px solid #333;
            border-radius: 50%;
            font-size: 15px;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 6px 12px rgba(0,0,0,0.3);
            cursor: pointer;
            outline: none;
            transition: transform 0.1s, background 0.1s;
        }
        .control-btn:active, .control-btn.active {
            transform: scale(0.92);
            background: rgba(200, 200, 200, 0.9);
        }
        #btn-shoot {
            background-color: #ffcc00;
            width: 80px;
            height: 80px;
            font-size: 16px;
        }

        /* Crosshair for Aiming */
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 20px;
            height: 20px;
            transform: translate(-50%, -50%);
            pointer-events: none;
            display: none;
        }
        #crosshair::before, #crosshair::after {
            content: '';
            position: absolute;
            background-color: rgba(255, 255, 255, 0.9);
            box-shadow: 0 0 3px rgba(0,0,0,0.8);
        }
        #crosshair::before {
            top: 8px; left: 0; width: 20px; height: 4px;
        }
        #crosshair::after {
            top: 0; left: 8px; width: 4px; height: 20px;
        }
    </style>
    <!-- Three.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="canvas-container"></div>

    <div id="ui-layer">
        <!-- Health Display -->
        <div id="health-container" class="hud-element">
            <div class="heart-icon"></div>
            <div id="hp-text">125</div>
        </div>

        <!-- Zoom Controls -->
        <div id="zoom-controls" class="hud-element">
            <button class="zoom-btn" id="btn-zoom-in">+</button>
            <button class="zoom-btn" id="btn-zoom-out">-</button>
        </div>

        <!-- D-Pad Movement Controls (Bottom Left) -->
        <div id="left-controls" class="hud-element">
            <div class="d-btn" id="btn-up">▲</div>
            <div class="d-btn" id="btn-left">◀</div>
            <div class="d-btn" id="btn-right">▶</div>
            <div class="d-btn" id="btn-down">▼</div>
        </div>

        <!-- Right Side Action Controls (Bottom Right) -->
        <div id="right-controls" class="hud-element">
            <div class="action-row">
                <button class="control-btn" id="btn-aim">Ngắm</button>
            </div>
            <div class="action-row">
                <button class="control-btn" id="btn-jump">Nhảy</button>
                <button class="control-btn" id="btn-shoot">Bắn</button>
            </div>
        </div>
    </div>

    <div id="crosshair"></div>

    <script>
        // --- SCENE, CAMERA, RENDERER ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xcce0ff);
        scene.fog = new THREE.FogExp2(0xcce0ff, 0.015);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        // --- LIGHTING ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(50, 80, 50);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 2048;
        dirLight.shadow.mapSize.height = 2048;
        dirLight.shadow.camera.near = 0.5;
        dirLight.shadow.camera.far = 300;
        const d = 60;
        dirLight.shadow.camera.left = -d;
        dirLight.shadow.camera.right = d;
        dirLight.shadow.camera.top = d;
        dirLight.shadow.camera.bottom = -d;
        scene.add(dirLight);

        // --- ENVIRONMENT (GROUND & SCHOOL) ---
        const groundGeo = new THREE.PlaneGeometry(300, 300);
        const groundMat = new THREE.MeshStandardMaterial({ color: 0x55aa55, roughness: 0.8 });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);

        // School Building Structure
        const buildingGroup = new THREE.Group();
        
        // Main Hall
        const hallGeo = new THREE.BoxGeometry(40, 16, 20);
        const hallMat = new THREE.MeshStandardMaterial({ color: 0xf5f5f5, roughness: 0.4 });
        const hall = new THREE.Mesh(hallGeo, hallMat);
        hall.position.set(0, 8, 0);
        hall.castShadow = true;
        hall.receiveShadow = true;
        buildingGroup.add(hall);

        // Roof
        const roofGeo = new THREE.ConeGeometry(30, 8, 4);
        const roofMat = new THREE.MeshStandardMaterial({ color: 0xcc3333 });
        const roof = new THREE.Mesh(roofGeo, roofMat);
        roof.position.set(0, 20, 0);
        roof.rotation.y = Math.PI / 4;
        roof.castShadow = true;
        buildingGroup.add(roof);

        // Staircase & Platform
        const stairGeo = new THREE.BoxGeometry(12, 2, 6);
        const stairMat = new THREE.MeshStandardMaterial({ color: 0x888888 });
        const stair = new THREE.Mesh(stairGeo, stairMat);
        stair.position.set(0, 1, 13);
        buildingGroup.add(stair);

        scene.add(buildingGroup);

        // --- SUNFLOWER CHARACTER (ROUND HEAD & BOUNCY ANIMATION) ---
        const playerGroup = new THREE.Group();

        // Round Head with Face Details
        const headGeo = new THREE.SphereGeometry(2.5, 32, 32);
        const headMat = new THREE.MeshStandardMaterial({ color: 0xffcc00, roughness: 0.3 });
        const head = new THREE.Mesh(headGeo, headMat);
        head.position.set(0, 6.5, 0);
        head.castShadow = true;
        playerGroup.add(head);

        // Petals around head
        for (let i = 0; i < 8; i++) {
            const petalGeo = new THREE.ConeGeometry(0.8, 2, 16);
            const petalMat = new THREE.MeshStandardMaterial({ color: 0xffaa00 });
            const petal = new THREE.Mesh(petalGeo, petalMat);
            const angle = (i / 8) * Math.PI * 2;
            petal.position.set(Math.cos(angle) * 2.8, 6.5 + Math.sin(angle) * 2.8, 0);
            petal.rotation.z = angle - Math.PI / 2;
            playerGroup.add(petal);
        }

        // Body / Stem
        const bodyGeo = new THREE.CylinderGeometry(0.6, 0.8, 4, 16);
        const bodyMat = new THREE.MeshStandardMaterial({ color: 0x228b22 });
        const body = new THREE.Mesh(bodyGeo, bodyMat);
        body.position.set(0, 3, 0);
        body.castShadow = true;
        playerGroup.add(body);

        // Dynamic Limbs for Sunflower Walk Animation
        const limbMat = new THREE.MeshStandardMaterial({ color: 0x1e6b1e });
        
        const leftLegGeo = new THREE.CylinderGeometry(0.25, 0.2, 2.5);
        const leftLeg = new THREE.Mesh(leftLegGeo, limbMat);
        leftLeg.position.set(-0.5, 1.25, 0);
        playerGroup.add(leftLeg);

        const rightLegGeo = new THREE.CylinderGeometry(0.25, 0.2, 2.5);
        const rightLeg = new THREE.Mesh(rightLegGeo, limbMat);
        rightLeg.position.set(0.5, 1.25, 0);
        playerGroup.add(rightLeg);

        scene.add(playerGroup);
        playerGroup.position.set(0, 0, 20);

        // --- GAMEPLAY STATE & VARIABLES ---
        let cameraRadius = 18;
        const MIN_CAMERA_RADIUS = 5;
        const MAX_CAMERA_RADIUS = 60;
        let cameraHeight = 8;
        let cameraAngle = 0;

        let isAiming = false;
        let verticalVelocity = 0;
        const gravity = -25;
        const jumpPower = 10;
        let isGrounded = true;

        const projectiles = [];

        // Input tracking
        const inputState = {
            up: false,
            down: false,
            left: false,
            right: false
        };

        const keys = { w: false, a: false, s: false, d: false };

        // --- CONTROLS SETUP ---
        // Keyboard movement
        window.addEventListener('keydown', (e) => {
            if (e.key === 'w' || e.key === 'W') keys.w = true;
            if (e.key === 'a' || e.key === 'A') keys.a = true;
            if (e.key === 's' || e.key === 'S') keys.s = true;
            if (e.key === 'd' || e.key === 'D') keys.d = true;
        });
        window.addEventListener('keyup', (e) => {
            if (e.key === 'w' || e.key === 'W') keys.w = false;
            if (e.key === 'a' || e.key === 'A') keys.a = false;
            if (e.key === 's' || e.key === 'S') keys.s = false;
            if (e.key === 'd' || e.key === 'D') keys.d = false;
        });

        // D-Pad Touch/Pointer Bindings
        function bindButton(id, stateKey) {
            const btn = document.getElementById(id);
            if (!btn) return;
            
            const activate = (e) => {
                e.preventDefault();
                e.stopPropagation();
                inputState[stateKey] = true;
                btn.classList.add('active');
            };
            const deactivate = (e) => {
                e.preventDefault();
                e.stopPropagation();
                inputState[stateKey] = false;
                btn.classList.remove('active');
            };

            btn.addEventListener('pointerdown', activate);
            btn.addEventListener('pointerup', deactivate);
            btn.addEventListener('pointerleave', deactivate);
            btn.addEventListener('touchstart', activate, {passive: false});
            btn.addEventListener('touchend', deactivate, {passive: false});
        }

        bindButton('btn-up', 'up');
        bindButton('btn-down', 'down');
        bindButton('btn-left', 'left');
        bindButton('btn-right', 'right');

        // Action Buttons Setup
        const btnJump = document.getElementById('btn-jump');
        const btnAim = document.getElementById('btn-aim');
        const btnShoot = document.getElementById('btn-shoot');
        const btnZoomIn = document.getElementById('btn-zoom-in');
        const btnZoomOut = document.getElementById('btn-zoom-out');
        const crosshair = document.getElementById('crosshair');

        btnJump.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            e.stopPropagation();
            if (isGrounded) {
                verticalVelocity = jumpPower;
                isGrounded = false;
            }
        });

        btnAim.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            e.stopPropagation();
            isAiming = !isAiming;
            if (isAiming) {
                btnAim.classList.add('active');
                crosshair.style.display = 'block';
                cameraRadius = Math.max(MIN_CAMERA_RADIUS, cameraRadius * 0.6); // Zoom in slightly when aiming
            } else {
                btnAim.classList.remove('active');
                crosshair.style.display = 'none';
            }
        });

        // SHOOT FUNCTION (No cooldown, infinite rate)
        function shootProjectile() {
            const projGeo = new THREE.SphereGeometry(0.4, 16, 16);
            const projMat = new THREE.MeshBasicMaterial({ color: 0x00ffff });
            const projectile = new THREE.Mesh(projGeo, projMat);

            // Spawn near player's upper body / head
            projectile.position.copy(playerGroup.position);
            projectile.position.y += 6.5;

            // Calculate direction based on camera angle
            const speed = 40;
            const dir = new THREE.Vector3(
                -Math.sin(cameraAngle),
                isAiming ? 0.2 : 0.1, // slight upward projection
                -Math.cos(cameraAngle)
            ).normalize();

            projectile.userData = {
                velocity: dir.multiplyScalar(speed),
                life: 3.0 // alive for 3 seconds
            };

            scene.add(projectile);
            projectiles.push(projectile);
        }

        btnShoot.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            e.stopPropagation();
            shootProjectile();
        });

        // Zoom Buttons
        btnZoomIn.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            e.stopPropagation();
            cameraRadius = Math.max(MIN_CAMERA_RADIUS, cameraRadius - 3);
        });

        btnZoomOut.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            e.stopPropagation();
            cameraRadius = Math.min(MAX_CAMERA_RADIUS, cameraRadius + 3);
        });

        // --- CAMERA ROTATION & PINCH ZOOM HANDLING ---
        let isDragging = false;
        let previousTouchPosition = { x: 0, y: 0 };
        let initialPinchDistance = null;

        container.addEventListener('pointerdown', (e) => {
            // Only drag camera if clicking directly on canvas/background, not HUD
            if (e.target === renderer.domElement) {
                isDragging = true;
                previousTouchPosition = { x: e.clientX, y: e.clientY };
            }
        });

        window.addEventListener('pointermove', (e) => {
            if (!isDragging) return;
            const deltaX = e.clientX - previousTouchPosition.x;
            cameraAngle -= deltaX * 0.005;
            previousTouchPosition = { x: e.clientX, y: e.clientY };
        });

        window.addEventListener('pointerup', () => {
            isDragging = false;
        });

        // Pinch to Zoom Handling (Two fingers touch on canvas)
        container.addEventListener('touchstart', (e) => {
            if (e.touches.length === 2) {
                initialPinchDistance = Math.hypot(
                    e.touches[0].clientX - e.touches[1].clientX,
                    e.touches[0].clientY - e.touches[1].clientY
                );
            }
        }, {passive: false});

        container.addEventListener('touchmove', (e) => {
            if (e.touches.length === 2 && initialPinchDistance !== null) {
                e.preventDefault();
                const currentPinchDistance = Math.hypot(
                    e.touches[0].clientX - e.touches[1].clientX,
                    e.touches[0].clientY - e.touches[1].clientY
                );
                const pinchDelta = currentPinchDistance - initialPinchDistance;
                cameraRadius -= pinchDelta * 0.05;
                cameraRadius = Math.max(MIN_CAMERA_RADIUS, Math.min(MAX_CAMERA_RADIUS, cameraRadius));
                initialPinchDistance = currentPinchDistance;
            }
        }, {passive: false});

        window.addEventListener('touchend', (e) => {
            if (e.touches.length < 2) {
                initialPinchDistance = null;
            }
        });

        // --- ANIMATION LOOP ---
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const delta = clock.getDelta();
            const moveSpeed = 10 * delta;
            let moving = false;

            // Combine D-Pad and Keyboard inputs
            let moveX = 0;
            let moveZ = 0;

            if (inputState.up || keys.w) { moveZ -= 1; moving = true; }
            if (inputState.down || keys.s) { moveZ += 1; moving = true; }
            if (inputState.left || keys.a) { moveX -= 1; moving = true; }
            if (inputState.right || keys.d) { moveX += 1; moving = true; }

            // Normalize vector to prevent faster diagonal movement
            if (moveX !== 0 && moveZ !== 0) {
                const length = Math.hypot(moveX, moveZ);
                moveX /= length;
                moveZ /= length;
            }

            if (moving) {
                const angle = Math.atan2(moveX, moveZ) + cameraAngle;
                playerGroup.position.x += Math.sin(angle) * moveSpeed;
                playerGroup.position.z += Math.cos(angle) * moveSpeed;
                
                // Sunflower Bouncy Walking Animation (Sine wave rotation)
                const walkCycle = clock.getElapsedTime() * 12;
                leftLeg.rotation.x = Math.sin(walkCycle) * 0.8;
                rightLeg.rotation.x = -Math.sin(walkCycle) * 0.8;
                head.position.y = 6.5 + Math.abs(Math.sin(walkCycle)) * 0.3;
            } else {
                leftLeg.rotation.x = 0;
                rightLeg.rotation.x = 0;
                head.position.y = 6.5;
            }

            // Gravity & Jumping Physics
            verticalVelocity += gravity * delta;
            playerGroup.position.y += verticalVelocity * delta;

            if (playerGroup.position.y <= 0) {
                playerGroup.position.y = 0;
                verticalVelocity = 0;
                isGrounded = true;
            }

            // Update Projectiles
            for (let i = projectiles.length - 1; i >= 0; i--) {
                const p = projectiles[i];
                p.position.addScaledVector(p.userData.velocity, delta);
                p.userData.life -= delta;

                if (p.userData.life <= 0) {
                    scene.remove(p);
                    projectiles.splice(i, 1);
                }
            }

            // Third Person Camera Follow Mechanics
            const targetX = playerGroup.position.x + Math.sin(cameraAngle) * cameraRadius;
            const targetZ = playerGroup.position.z + Math.cos(cameraAngle) * cameraRadius;
            
            camera.position.x += (targetX - camera.position.x) * 0.1;
            camera.position.y += (playerGroup.position.y + cameraHeight - camera.position.y) * 0.1;
            camera.position.z += (targetZ - camera.position.z) * 0.1;

            camera.lookAt(playerGroup.position.x, playerGroup.position.y + 3, playerGroup.position.z);

            renderer.render(scene, camera);
        }

        animate();

        // Window resizing
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
