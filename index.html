<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Scene with Curved Display</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <!-- Thêm thư viện aframe-curve và aframe-modifier-component nếu cần cho màn hình cong phức tạp -->
</head>
<body>
    <a-scene>
        <!-- Môi trường và ánh sáng -->
        <a-sky color="#ECECEC"></a-sky>
        <a-light type="ambient" color="#ffffff"></a-light>

        <!-- Màn hình cong lớn được đặt ở vị trí bạn chỉ định, hướng nhìn vào bên trong -->
        <a-entity position="0 5 -15" rotation="0 0 0">
            <!-- Bạn có thể điều chỉnh mesh/geometry hoặc dùng curve-modifier tại đây -->
            <a-plane width="16" height="9" color="#111111" material="side: double"></a-plane>
            <!-- Nội dung hoặc chữ hiển thị trên màn hình -->
            <a-text value="18:53:29\nThứ Ba | 06/10/2026" align="center" position="0 0 0.1" scale="3 3 3" color="#ffffff"></a-text>
        </a-entity>

        <!-- Camera và nhân vật/điều khiển -->
        <a-camera position="0 1.6 0"></a-camera>
    </a-scene>
</body>
</html>
