<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Mo Hinh Truong Hoc 3D - Sunflower</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #87CEEB;
            font-family: Arial, sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }
        /* UI Overlay */
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            padding: 20px;
            box-sizing: border-box;
        }
        .hud-element {
            pointer-events: auto;
        }
        /* HP Heart UI (Right Top/Corner area) */
        #health-container {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            align-items: center;
            background: rgba(0, 0, 0, 0.4);
            padding: 8px 15px;
            border-radius: 20px;
            pointer-events: auto;
        }
        .heart-icon {
            width: 28px;
            height: 28px;
            background-color: #ff3366;
            position: relative;
            transform: rotate(-45deg);
            margin-right: 12px;
            box-shadow: 0 0 5px rgba(0,0,0,0.5);
            border: 2px solid #000;
        }
        .heart-icon::before,
        .heart-icon::after {
            content: "";
            width: 28px;
            height: 28px;
            background-color: #ff3366;
            border-radius: 50%;
            position: absolute;
            border: 2px solid #000;
        }
        .heart-icon::before {
            top: -14px;
            left: 0;
        }
        .heart-icon::after {
            left: 14px;
            top: 0;
        }
        #hp-text {
            color: #ffffff;
            font-size: 22px;
            font-weight: bold;
            text-shadow: -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000, 2px 2px 0 #000;
        }

        /* Controls on Right Side */
        #right-controls {
            position: absolute;
            bottom: 30px;
            right: 30px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            align-items: center;
            pointer-events: auto;
        }
        .action-row {
            display: flex;
            gap: 15px;
        }
        .control-btn {
            width: 65px;
            height: 65px;
            background: rgba(255, 255, 255, 0.8);
            border: 3px solid #333;
            border-radius: 50%;
            font-size: 16px;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 6px 12px rgba(0,0,0,0.3);
            cursor: pointer;
            outline: none;
            transition: transform 0.1s, background 0.1s;
        }
        .control-btn:active {
            transform: scale(0.92);
            background: rgba(200, 200, 200, 0.9);
        }
        #btn-shoot {
            background-color: #ffcc00;
            width: 75px;
            height: 75px;
            font-size: 14px;
        }
    </style>
    <!-- Three.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="canvas-container"></div>

    <div id="ui-layer">
        <!-- Health Display -->
        <div id="health-container" class="hud-element">
            <div class="heart-icon"></div>
            <div id="hp-text">125</div>
        </div>

        <!-- Right Side Action Controls -->
        <div id="right-controls" class="hud-element">
            <div class="action-row">
                <button class="control-btn" id="btn-aim">Ngắm</button>
            </div>
            <div class="action-row">
                <button class="control-btn" id="btn-jump">Nhảy</button>
                <button class="control-btn" id="btn-shoot">Bắn</button>
            </div>
        </div>
    </div>

    <script>
        // --- SCENE, CAMERA, RENDERER ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xcce0ff);
        scene.fog = new THREE.FogExp2(0xcce0ff, 0.015);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        // --- LIGHTING ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(50, 80, 50);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 2048;
        dirLight.shadow.mapSize.height = 2048;
        dirLight.shadow.camera.near = 0.5;
        dirLight.shadow.camera.far = 300;
        const d = 60;
        dirLight.shadow.camera.left = -d;
        dirLight.shadow.camera.right = d;
        dirLight.shadow.camera.top = d;
        dirLight.shadow.camera.bottom = -d;
        scene.add(dirLight);

        // --- ENVIRONMENT (GROUND & SCHOOL) ---
        const groundGeo = new THREE.PlaneGeometry(300, 300);
        const groundMat = new THREE.MeshStandardMaterial({ color: 0x55aa55, roughness: 0.8 });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);

        // School Building Structure
        const buildingGroup = new THREE.Group();
        
        // Main Hall
        const hallGeo = new THREE.BoxGeometry(40, 16, 20);
        const hallMat = new THREE.MeshStandardMaterial({ color: 0xf5f5f5, roughness: 0.4 });
        const hall = new THREE.Mesh(hallGeo, hallMat);
        hall.position.set(0, 8, 0);
        hall.castShadow = true;
        hall.receiveShadow = true;
        buildingGroup.add(hall);

        // Roof
        const roofGeo = new THREE.ConeGeometry(30, 8, 4);
        const roofMat = new THREE.MeshStandardMaterial({ color: 0xcc3333 });
        const roof = new THREE.Mesh(roofGeo, roofMat);
        roof.position.set(0, 20, 0);
        roof.rotation.y = Math.PI / 4;
        roof.castShadow = true;
        buildingGroup.add(roof);

        // Staircase & Platform
        const stairGeo = new THREE.BoxGeometry(12, 2, 6);
        const stairMat = new THREE.MeshStandardMaterial({ color: 0x888888 });
        const stair = new THREE.Mesh(stairGeo, stairMat);
        stair.position.set(0, 1, 13);
        buildingGroup.add(stair);

        scene.add(buildingGroup);

        // --- SUNFLOWER CHARACTER (ROUND HEAD & BOUNCY ANIMATION) ---
        const playerGroup = new THREE.Group();

        // Round Head with Face Details
        const headGeo = new THREE.SphereGeometry(2.5, 32, 32);
        const headMat = new THREE.MeshStandardMaterial({ color: 0xffcc00, roughness: 0.3 });
        const head = new THREE.Mesh(headGeo, headMat);
        head.position.set(0, 6.5, 0);
        head.castShadow = true;
        playerGroup.add(head);

        // Petals around head
        for (let i = 0; i < 8; i++) {
            const petalGeo = new THREE.ConeGeometry(0.8, 2, 16);
            const petalMat = new THREE.MeshStandardMaterial({ color: 0xffaa00 });
            const petal = new THREE.Mesh(petalGeo, petalMat);
            const angle = (i / 8) * Math.PI * 2;
            petal.position.set(Math.cos(angle) * 2.8, 6.5 + Math.sin(angle) * 2.8, 0);
            petal.rotation.z = angle - Math.PI / 2;
            playerGroup.add(petal);
        }

        // Body / Stem
        const bodyGeo = new THREE.CylinderGeometry(0.6, 0.8, 4, 16);
        const bodyMat = new THREE.MeshStandardMaterial({ color: 0x228b22 });
        const body = new THREE.Mesh(bodyGeo, bodyMat);
        body.position.set(0, 3, 0);
        body.castShadow = true;
        playerGroup.add(body);

        // Dynamic Limbs for Sunflower Walk Animation
        const limbMat = new THREE.MeshStandardMaterial({ color: 0x1e6b1e });
        
        const leftLegGeo = new THREE.CylinderGeometry(0.25, 0.2, 2.5);
        const leftLeg = new THREE.Mesh(leftLegGeo, limbMat);
        leftLeg.position.set(-0.5, 1.25, 0);
        playerGroup.add(leftLeg);

        const rightLegGeo = new THREE.CylinderGeometry(0.25, 0.2, 2.5);
        const rightLeg = new THREE.Mesh(rightLegGeo, limbMat);
        rightLeg.position.set(0.5, 1.25, 0);
        playerGroup.add(rightLeg);

        scene.add(playerGroup);
        playerGroup.position.set(0, 0, 20);

        // --- CONTROLS & CAMERA CONFIG ---
        let cameraRadius = 18;
        let cameraHeight = 8;
        let cameraAngle = 0;

        let isDragging = false;
        let previousTouchPosition = { x: 0, y: 0 };
        let initialPinchDistance = null;

        window.addEventListener('pointerdown', (e) => {
            isDragging = true;
            previousTouchPosition = { x: e.clientX, y: e.clientY };
        });

        window.addEventListener('pointermove', (e) => {
            if (!isDragging) return;
            const deltaX = e.clientX - previousTouchPosition.x;
            cameraAngle -= deltaX * 0.005;
            previousTouchPosition = { x: e.clientX, y: e.clientY };
        });

        window.addEventListener('pointerup', () => {
            isDragging = false;
        });

        // Pinch to Zoom Handling
        window.addEventListener('touchstart', (e) => {
            if (e.touches.length === 2) {
                initialPinchDistance = Math.hypot(
                    e.touches[0].clientX - e.touches[1].clientX,
                    e.touches[0].clientY - e.touches[1].clientY
                );
            }
        });

        window.addEventListener('touchmove', (e) => {
            if (e.touches.length === 2 && initialPinchDistance !== null) {
                const currentPinchDistance = Math.hypot(
                    e.touches[0].clientX - e.touches[1].clientX,
                    e.touches[0].clientY - e.touches[1].clientY
                );
                const pinchDelta = currentPinchDistance - initialPinchDistance;
                cameraRadius -= pinchDelta * 0.05;
                cameraRadius = Math.max(5, Math.min(40, cameraRadius));
                initialPinchDistance = currentPinchDistance;
            }
        });

        window.addEventListener('touchend', (e) => {
            if (e.touches.length < 2) {
                initialPinchDistance = null;
            }
        });

        // Keyboard Controls for Movement
        const keys = { w: false, a: false, s: false, d: false };
        window.addEventListener('keydown', (e) => {
            if (e.key === 'w' || e.key === 'W') keys.w = true;
            if (e.key === 'a' || e.key === 'A') keys.a = true;
            if (e.key === 's' || e.key === 'S') keys.s = true;
            if (e.key === 'd' || e.key === 'D') keys.d = true;
        });
        window.addEventListener('keyup', (e) => {
            if (e.key === 'w' || e.key === 'W') keys.w = false;
            if (e.key === 'a' || e.key === 'A') keys.a = false;
            if (e.key === 's' || e.key === 'S') keys.s = false;
            if (e.key === 'd' || e.key === 'D') keys.d = false;
        });

        // --- ANIMATION LOOP ---
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const delta = clock.getDelta();
            const moveSpeed = 10 * delta;
            let moving = false;

            let moveX = 0;
            let moveZ = 0;
            if (keys.w) { moveZ -= 1; moving = true; }
            if (keys.s) { moveZ += 1; moving = true; }
            if (keys.a) { moveX -= 1; moving = true; }
            if (keys.d) { moveX += 1; moving = true; }

            if (moving) {
                const angle = Math.atan2(moveX, moveZ) + cameraAngle;
                playerGroup.position.x += Math.sin(angle) * moveSpeed;
                playerGroup.position.z += Math.cos(angle) * moveSpeed;
                
                // Sunflower Bouncy Walking Animation
                const walkCycle = clock.getElapsedTime() * 12;
                leftLeg.rotation.x = Math.sin(walkCycle) * 0.8;
                rightLeg.rotation.x = -Math.sin(walkCycle) * 0.8;
                head.position.y = 6.5 + Math.abs(Math.sin(walkCycle)) * 0.3;
            } else {
                leftLeg.rotation.x = 0;
                rightLeg.rotation.x = 0;
                head.position.y = 6.5;
            }

            // Camera Follow Mechanics
            const targetX = playerGroup.position.x + Math.sin(cameraAngle) * cameraRadius;
            const targetZ = playerGroup.position.z + Math.cos(cameraAngle) * cameraRadius;
            
            camera.position.x += (targetX - camera.position.x) * 0.1;
            camera.position.y += (playerGroup.position.y + cameraHeight - camera.position.y) * 0.1;
            camera.position.z += (targetZ - camera.position.z) * 0.1;

            camera.lookAt(playerGroup.position.x, playerGroup.position.y + 3, playerGroup.position.z);

            renderer.render(scene, camera);
        }

        animate();

        // Window resizing
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
