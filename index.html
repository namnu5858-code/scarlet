<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>Cam Thung Middle School - 3D Campus</title>

<style>
*{
  box-sizing:border-box;
  -webkit-user-select:none;
  user-select:none;
  -webkit-touch-callout:none;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#8fd4f5;
  touch-action:none;
  font-family:Arial,sans-serif;
}

#game-container{
  position:fixed;
  top:0;
  left:0;
  width:100vw;
  height:100vh;
  z-index:1;
}

canvas{
  display:block;
  width:100vw !important;
  height:100vh !important;
}

.glass-ui{
  background:rgba(255,255,255,.18);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  border:1px solid rgba(255,255,255,.4);
  box-shadow:0 8px 32px rgba(0,0,0,.18);
}

#joystick-wrapper{
  position:absolute;
  left:32px;
  bottom:32px;
  width:120px;
  height:120px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:20;
  touch-action:none;
}

#joystick-stick{
  position:absolute;
  width:52px;
  height:52px;
  border-radius:50%;
  background:rgba(255,255,255,.58);
  border:1px solid rgba(255,255,255,.85);
  box-shadow:0 4px 14px rgba(0,0,0,.18);
  pointer-events:none;
}

#jump-btn{
  position:absolute;
  right:32px;
  bottom:38px;
  width:72px;
  height:72px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:20;
  touch-action:none;
  transition:background .3s ease,transform .1s ease;
}

#jump-btn.flying{
  background:rgba(255,215,0,.55);
  border-color:rgba(255,255,255,.9);
  box-shadow:0 0 15px rgba(255,215,0,.6);
}

#jump-btn:active{
  transform:scale(.94);
}

#jump-btn svg{
  width:34px;
  height:34px;
  fill:none;
  stroke:white;
  stroke-width:2.5;
  stroke-linecap:round;
  stroke-linejoin:round;
}

#loading{
  position:absolute;
  top:14px;
  right:16px;
  padding:8px 14px;
  border-radius:10px;
  background:rgba(0,0,0,.42);
  color:white;
  font-size:12px;
  z-index:30;
  pointer-events:none;
}

/* ============================================================
   MÀN HÌNH KÍNH & YOUTUBE PLAYER OVERLAY
   ============================================================ */

#screen-hint{
  position:absolute;
  left:50%;
  top:18px;
  transform:translateX(-50%);
  padding:9px 15px;
  border-radius:12px;
  background:rgba(0,0,0,.55);
  color:white;
  font-size:14px;
  font-weight:bold;
  z-index:25;
  pointer-events:none;
  opacity:0;
  transition:opacity .25s ease;
}

#screen-hint.show{
  opacity:1;
}

#browser-overlay{
  position:fixed;
  inset:0;
  z-index:100;
  display:none;
  background:rgba(0,0,0,.92);
  padding:
    max(12px,env(safe-area-inset-top))
    max(12px,env(safe-area-inset-right))
    max(12px,env(safe-area-inset-bottom))
    max(12px,env(safe-area-inset-left));
}

#browser-overlay.open{
  display:flex;
  flex-direction:column;
}

#browser-bar{
  width:100%;
  min-height:60px;
  display:flex;
  align-items:center;
  gap:10px;
  padding:8px;
  border-radius:14px;
  background:rgba(28,28,30,.98);
  border:1px solid rgba(255,255,255,.15);
}

.browser-btn{
  width:44px;
  height:44px;
  flex:0 0 44px;
  border:0;
  border-radius:10px;
  background:#3a3a3c;
  color:white;
  font-size:22px;
  font-weight:bold;
  touch-action:manipulation;
  cursor:pointer;
}

.browser-btn:active{
  background:#545458;
}

#browser-url{
  flex:1;
  min-width:0;
  height:44px;
  border:2px solid #545458;
  outline:none;
  border-radius:10px;
  padding:0 16px;
  background:#ffffff;
  color:#000000;
  font-size:18px;
  font-weight:bold;
  -webkit-user-select:text;
  user-select:text;
}

#browser-url:focus{
  border-color:#0a84ff;
}

#browser-frame-wrap{
  position:relative;
  flex:1;
  min-height:0;
  margin-top:10px;
  overflow:hidden;
  border-radius:14px;
  background:#000;
}

#youtube-player{
  width:100%;
  height:100%;
  border:0;
}
</style>

<script type="importmap">
{
  "imports":{
    "three":"https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
<script src="https://www.youtube.com/iframe_api"></script>
</head>

<body>

<div id="game-container"></div>

<div id="loading">
Đang dựng khuôn viên trường 3D...
</div>

<div id="screen-hint">
Chạm vào thanh tìm kiếm trên màn hình để nhập
</div>

<div id="joystick-wrapper" class="glass-ui">
  <div id="joystick-stick"></div>
</div>

<div id="jump-btn" class="glass-ui">
  <svg viewBox="0 0 24 24">
    <path d="M12 19V5"></path>
    <path d="M5 12l7-7 7 7"></path>
  </svg>
</div>

<!-- ==========================================================
     BROWSER & YOUTUBE OVERLAY
     ========================================================== -->

<div id="browser-overlay">

  <div id="browser-bar">

    <input
      id="browser-url"
      type="text"
      autocomplete="off"
      autocapitalize="none"
      spellcheck="false"
      placeholder="Nhập ID Video YouTube hoặc Từ khóa..."
      value="M7lc1UVf-VE"
    >

    <button class="browser-btn" id="browser-go">🔍</button>
    <button class="browser-btn" id="browser-close">×</button>

  </div>

  <div id="browser-frame-wrap">
    <div id="youtube-player"></div>
  </div>

</div>

<script type="module">

import * as THREE from "three";
import {GLTFLoader} from "three/addons/loaders/GLTFLoader.js";

// ============================================================
// SCENE & RENDERER
// ============================================================

const container=document.getElementById("game-container");
const loading=document.getElementById("loading");

const scene=new THREE.Scene();

scene.background=new THREE.Color(0x8fd4f5);

scene.fog=new THREE.FogExp2(
  0xbfeafa,
  0.0012
);

const cameraPivot=new THREE.Object3D();
scene.add(cameraPivot);

const camera=new THREE.PerspectiveCamera(
  60,
  window.innerWidth/window.innerHeight,
  0.1,
  3000
);
cameraPivot.add(camera);

let cameraDistance=10;
let targetCameraDistance=10;

let cameraAngleX=0.1;
let cameraAngleY=0;

let targetCameraAngleX=0.1;
let targetCameraAngleY=0;

const renderer=new THREE.WebGLRenderer({
  antialias:true,
  powerPreference:"high-performance"
});

renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.12;

container.appendChild(renderer.domElement);

// ============================================================
// CAMERA COLLISION
// ============================================================

const raycaster=new THREE.Raycaster();
const cameraCollisionObjects=[];

function updateCamera(){

  cameraAngleY=THREE.MathUtils.lerp(
    cameraAngleY,
    targetCameraAngleY,
    0.18
  );

  cameraAngleX=THREE.MathUtils.lerp(
    cameraAngleX,
    targetCameraAngleX,
    0.18
  );

  cameraDistance=THREE.MathUtils.lerp(
    cameraDistance,
    targetCameraDistance,
    0.12
  );

  cameraPivot.rotation.y=cameraAngleY;
  cameraPivot.rotation.x=cameraAngleX;

  const origin=cameraPivot.position.clone();

  const dir=new THREE.Vector3(0,0,1)
    .applyQuaternion(cameraPivot.quaternion);

  raycaster.set(origin,dir);

  let actualDistance=cameraDistance;

  if(cameraCollisionObjects.length>0){

    const hits=raycaster.intersectObjects(
      cameraCollisionObjects,
      true
    );

    if(
      hits.length>0 &&
      hits[0].distance<cameraDistance
    ){

      actualDistance=Math.max(
        hits[0].distance-0.3,
        0.5
      );
    }
  }

  camera.position.set(
    0,
    0,
    actualDistance
  );

  camera.lookAt(cameraPivot.position);
}

// ============================================================
// LIGHTING
// ============================================================

const hemisphere=new THREE.HemisphereLight(
  0xe8f8ff,
  0x516b3b,
  1.5
);

scene.add(hemisphere);

const sunlight=new THREE.DirectionalLight(
  0xfff3d2,
  2.2
);

sunlight.position.set(100,130,80);
sunlight.castShadow=true;

sunlight.shadow.mapSize.width=2048;
sunlight.shadow.mapSize.height=2048;

sunlight.shadow.camera.near=1;
sunlight.shadow.camera.far=400;

sunlight.shadow.camera.left=-250;
sunlight.shadow.camera.right=250;
sunlight.shadow.camera.top=250;
sunlight.shadow.camera.bottom=-250;

sunlight.shadow.bias=-0.0003;

scene.add(sunlight);

// ============================================================
// MATERIALS
// ============================================================

const MAT={};

MAT.redTile=new THREE.MeshStandardMaterial({
  color:0xa94c3d,
  roughness:.78
});

MAT.lightBlue=new THREE.MeshStandardMaterial({
  color:0x9ed9ec,
  roughness:.7
});

MAT.white=new THREE.MeshStandardMaterial({
  color:0xf4f5f0,
  roughness:.72
});

MAT.yellow=new THREE.MeshStandardMaterial({
  color:0xe7d16a,
  roughness:.8
});

MAT.darkMetal=new THREE.MeshStandardMaterial({
  color:0x30383b,
  roughness:.55,
  metalness:.65
});

MAT.steel=new THREE.MeshStandardMaterial({
  color:0xadb7ba,
  roughness:.35,
  metalness:.8
});

MAT.roofMetal=new THREE.MeshStandardMaterial({
  color:0x68777b,
  roughness:.65,
  metalness:.45
});

MAT.glass=new THREE.MeshPhysicalMaterial({
  color:0x76b9d2,
  roughness:.08,
  metalness:.05,
  transparent:true,
  opacity:.68
});

MAT.concrete=new THREE.MeshStandardMaterial({
  color:0xb8b9b3,
  roughness:.9
});

// ============================================================
// HELPER
// ============================================================

function box(
  w,
  h,
  d,
  x,
  y,
  z,
  material,
  parent=scene
){

  const mesh=new THREE.Mesh(
    new THREE.BoxGeometry(w,h,d),
    material
  );

  mesh.position.set(x,y,z);
  mesh.castShadow=true;
  mesh.receiveShadow=true;

  parent.add(mesh);

  return mesh;
}

// ============================================================
// CAMPUS & GROUND
// ============================================================

const campus=new THREE.Group();
scene.add(campus);

const CAMPUS_W=260;
const CAMPUS_D=210;

const baseGround=box(
  2500,
  1,
  2500,
  0,
  -0.7,
  0,
  new THREE.MeshStandardMaterial({
    color:0x73b951,
    roughness:1
  }),
  campus
);

cameraCollisionObjects.push(baseGround);

const courtyard=box(
  240,
  .45,
  190,
  0,
  0,
  0,
  MAT.redTile,
  campus
);

cameraCollisionObjects.push(courtyard);

// ============================================================
// MÀN HÌNH WIDESCREEN 16:9 ĐỘ PHÂN GIẢI CAO (2048x1152)
// ============================================================

const screenGroup=new THREE.Group();
screenGroup.name="InteractiveGlassScreen";
campus.add(screenGroup);

const SCREEN_X=-10;
const SCREEN_Z=10;

const SCREEN_W=16.0;
const SCREEN_H=9.0;
const SCREEN_D=0.3;

const screenCanvas=document.createElement('canvas');
screenCanvas.width=2048;
screenCanvas.height=1152;
const ctx=screenCanvas.getContext('2d');

function drawYouTubeUI(){
  ctx.fillStyle='#0f0f0f';
  ctx.fillRect(0,0,2048,1152);

  // YouTube Logo
  ctx.fillStyle='#ff0000';
  ctx.beginPath();
  ctx.roundRect(924,280,200,140,30);
  ctx.fill();

  ctx.fillStyle='#ffffff';
  ctx.beginPath();
  ctx.moveTo(1004,320);
  ctx.lineTo(1064,350);
  ctx.lineTo(1004,380);
  ctx.closePath();
  ctx.fill();

  ctx.fillStyle='#ffffff';
  ctx.font='bold 76px Arial';
  ctx.textAlign='center';
  ctx.fillText('YouTube 4K HD Player',1024,510);

  // Thanh tìm kiếm
  ctx.fillStyle='#222222';
  ctx.beginPath();
  ctx.roundRect(324,620,1400,100,50);
  ctx.fill();
  ctx.strokeStyle='#383838';
  ctx.lineWidth=6;
  ctx.stroke();

  ctx.font='bold 38px Arial';
  ctx.fillStyle='#aaaaaa';
  ctx.textAlign='left';
  ctx.fillText('Chạm vào đây để nhập từ khóa / ID video...',380,682);

  ctx.fillStyle='#ff0000';
  ctx.beginPath();
  ctx.roundRect(1584,630,120,80,40);
  ctx.fill();

  ctx.fillStyle='#ffffff';
  ctx.font='bold 42px Arial';
  ctx.textAlign='center';
  ctx.fillText('🔍',1644,685);

  ctx.font='bold 30px Arial';
  ctx.fillStyle='#606060';
  ctx.fillText('Nhấn chính xác vào thanh tìm kiếm để bật bàn phím',1024,1000);
}

drawYouTubeUI();

const screenTexture=new THREE.CanvasTexture(screenCanvas);
screenTexture.colorSpace=THREE.SRGBColorSpace;
screenTexture.minFilter=THREE.LinearFilter;
screenTexture.magFilter=THREE.LinearFilter;

const screenFrameMaterial=new THREE.MeshStandardMaterial({
  color:0x111315,
  roughness:.2,
  metalness:.85
});

const screenDisplayMaterial=new THREE.MeshBasicMaterial({
  map:screenTexture
});

box(
  SCREEN_W+.6,
  SCREEN_H+.6,
  SCREEN_D,
  SCREEN_X,
  (SCREEN_H+.6)/2+1.2,
  SCREEN_Z,
  screenFrameMaterial,
  screenGroup
);

const interactiveScreen=box(
  SCREEN_W,
  SCREEN_H,
  SCREEN_D+.02,
  SCREEN_X,
  SCREEN_H/2+1.5,
  SCREEN_Z-.02,
  screenDisplayMaterial,
  screenGroup
);

interactiveScreen.name="InteractiveGlassScreenSurface";

box(.6,3.0,.6,SCREEN_X-5.5,0,SCREEN_Z,screenFrameMaterial,screenGroup);
box(.6,3.0,.6,SCREEN_X+5.5,0,SCREEN_Z,screenFrameMaterial,screenGroup);
box(SCREEN_W+.8,.4,1.2,SCREEN_X,.2,SCREEN_Z,screenFrameMaterial,screenGroup);

// ============================================================
// YOUTUBE IFRAME API INTEGRATION & RAYCASTING
// ============================================================

let ytPlayer = null;

window.onYouTubeIframeAPIReady = function() {
  ytPlayer = new YT.Player('youtube-player', {
    videoId: 'M7lc1UVf-VE',
    playerVars: {
      'playsinline': 1,
      'autoplay': 1,
      'rel': 0
    }
  });
};

const screenRaycaster=new THREE.Raycaster();
const screenPointer=new THREE.Vector2();

const browserOverlay=document.getElementById("browser-overlay");
const browserURL=document.getElementById("browser-url");

function openBrowserAndFocus(){
  if(browserOverlay.classList.contains("open")) return;

  browserOverlay.classList.add("open");

  setTimeout(() => {
    browserURL.focus();
    browserURL.select();
  }, 100);
}

function checkSearchBarTouch(clientX, clientY){
  const rect=renderer.domElement.getBoundingClientRect();

  screenPointer.x=((clientX-rect.left)/rect.width)*2-1;
  screenPointer.y=-((clientY-rect.top)/rect.height)*2+1;

  screenRaycaster.setFromCamera(screenPointer, camera);

  const hits=screenRaycaster.intersectObject(interactiveScreen, true);

  if(hits.length>0){
    const hit = hits[0];
    if(hit.uv){
      const u = hit.uv.x;
      const v = hit.uv.y;

      // Kiểm tra xem vị trí chạm có nằm trong khung thanh tìm kiếm (324, 620, 1400, 100) trên Canvas 2048x1152 không
      const searchBarMinX = 324 / 2048;
      const searchBarMaxX = 1724 / 2048;
      const searchBarMinY = 1 - (720 / 1152);
      const searchBarMaxY = 1 - (620 / 1152);

      if(u >= searchBarMinX && u <= searchBarMaxX && v >= searchBarMinY && v <= searchBarMaxY){
        openBrowserAndFocus();
        return true;
      }
    }
  }

  return false;
}

renderer.domElement.addEventListener("pointerdown", function(event){
  if(event.pointerType==="mouse" || event.pointerType==="touch"){
    checkSearchBarTouch(event.clientX, event.clientY);
  }
}, {passive:true});

// ============================================================
// OVERLAY CONTROLS
// ============================================================

document.getElementById("browser-go").addEventListener("click", function(){
  const query = browserURL.value.trim();
  if(query && ytPlayer && ytPlayer.loadVideoById){
    ytPlayer.loadVideoById(query);
  }
});

browserURL.addEventListener("keydown", function(event){
  if(event.key==="Enter"){
    const query = browserURL.value.trim();
    if(query && ytPlayer && ytPlayer.loadVideoById){
      ytPlayer.loadVideoById(query);
    }
  }
});

document.getElementById("browser-close").addEventListener("click", function(){
  browserOverlay.classList.remove("open");
  if(ytPlayer && ytPlayer.stopVideo){
    ytPlayer.stopVideo();
  }
});

// ============================================================
// PLAYER & MODEL LOADER
// ============================================================

const player=new THREE.Group();
scene.add(player);

let model=null;
const loader=new GLTFLoader();

loader.load(
  "scene.gltf",
  function(gltf){
    model=gltf.scene;
    model.position.y=.22;
    player.add(model);
    loading.style.display="none";
  },
  undefined,
  function(){
    loading.textContent="Không tìm thấy scene.gltf";
  }
);

// ============================================================
// CONTROLS & MOVEMENT
// ============================================================

const input=new THREE.Vector2(0,0);
const velocity=new THREE.Vector3(0,0,0);
const walkSpeed=80.556;
const FLY_SPEED=97.222;
let moveSpeed=walkSpeed;
const gravity=-20;
let grounded=true;
let isFlying=false;

// ============================================================
// JOYSTICK
// ============================================================

const joystick=document.getElementById("joystick-wrapper");
const stick=document.getElementById("joystick-stick");
let joystickTouch=null;
let centerX=0;
let centerY=0;
const radius=40;

joystick.addEventListener("touchstart", function(event){
  event.preventDefault();
  const touch=event.changedTouches[0];
  joystickTouch=touch.identifier;
  const rect=joystick.getBoundingClientRect();
  centerX=rect.left+rect.width/2;
  centerY=rect.top+rect.height/2;
  updateJoystick(touch);
}, {passive:false});

function updateJoystick(touch){
  const dx=touch.clientX-centerX;
  const dy=touch.clientY-centerY;
  const distance=Math.hypot(dx,dy);
  const angle=Math.atan2(dy,dx);
  const limited=Math.min(distance,radius);
  const x=Math.cos(angle)*limited;
  const y=Math.sin(angle)*limited;
  stick.style.transform=`translate(${x}px,${y}px)`;
  input.x=x/radius;
  input.y=-y/radius;
}

function resetJoystick(){
  joystickTouch=null;
  input.set(0,0);
  velocity.x=0;
  velocity.z=0;
  stick.style.transform="translate(0px,0px)";
}

window.addEventListener("touchmove", function(event){
  for(let i=0; i<event.changedTouches.length; i++){
    if(event.changedTouches[i].identifier===joystickTouch){
      updateJoystick(event.changedTouches[i]);
    }
  }
}, {passive:false});

window.addEventListener("touchend", function(event){
  for(let i=0; i<event.changedTouches.length; i++){
    if(event.changedTouches[i].identifier===joystickTouch){
      resetJoystick();
    }
  }
});

// ============================================================
// JUMP / FLY
// ============================================================

const jump=document.getElementById("jump-btn");
let isJumpHolding=false;

jump.addEventListener("touchstart", function(event){
  event.preventDefault();
  isJumpHolding=true;
  if(!isFlying){
    isFlying=true;
    grounded=false;
    jump.classList.add("flying");
    moveSpeed=FLY_SPEED;
  }
}, {passive:false});

jump.addEventListener("touchend", function(event){
  event.preventDefault();
  isJumpHolding=false;
});

// ============================================================
// GAME LOOP
// ============================================================

const clock=new THREE.Clock();

function animate(){
  requestAnimationFrame(animate);
  const delta=Math.min(clock.getDelta(), .05);
  const moving=input.lengthSq()>.01;

  if(moving){
    const forward=new THREE.Vector3(0,0,-1).applyAxisAngle(new THREE.Vector3(0,1,0), cameraAngleY);
    const right=new THREE.Vector3(1,0,0).applyAxisAngle(new THREE.Vector3(0,1,0), cameraAngleY);
    const movement=new THREE.Vector3();
    movement.addScaledVector(right, input.x);
    movement.addScaledVector(forward, input.y);

    if(movement.lengthSq()>0){
      movement.normalize();
      velocity.x=movement.x*moveSpeed;
      velocity.z=movement.z*moveSpeed;

      if(model){
        const targetRotation=Math.atan2(movement.x, movement.z);
        let difference=targetRotation-model.rotation.y;
        difference=Math.atan2(Math.sin(difference), Math.cos(difference));
        model.rotation.y+=difference*Math.min(delta*10,1);
      }
    }
  }else{
    velocity.x=0;
    velocity.z=0;
  }

  if(isFlying){
    velocity.y=isJumpHolding ? THREE.MathUtils.lerp(velocity.y, 50, delta*5) : THREE.MathUtils.lerp(velocity.y, 0, delta*3);
  }else{
    velocity.y+=gravity*delta;
  }

  player.position.y+=velocity.y*delta;

  if(player.position.y<=0){
    player.position.y=0;
    velocity.y=0;
    grounded=true;
    if(isFlying){
      isFlying=false;
      jump.classList.remove("flying");
      moveSpeed=walkSpeed;
    }
  }

  player.position.x+=velocity.x*delta;
  player.position.z+=velocity.z*delta;

  cameraPivot.position.copy(player.position);
  cameraPivot.position.y+=1.6;

  updateCamera();
  renderer.render(scene, camera);
}

animate();

function onResize(){
  camera.aspect=window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}

window.addEventListener("resize", onResize);
</script>
</body>
</html>
