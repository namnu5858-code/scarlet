<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Vì bạn bè - Vampire Sunflower</title>
    <style>
        body { margin: 0; overflow: hidden; background: #87CEEB; touch-action: none; }
        #ui { position: absolute; bottom: 30px; left: 30px; right: 30px; display: flex; justify-content: space-between; pointer-events: none; }
        .control-base { pointer-events: auto; width: 100px; height: 100px; background: rgba(255,255,255,0.2); border-radius: 50%; border: 2px solid rgba(255,255,255,0.4); display: flex; align-items: center; justify-content: center; position: relative; }
        .knob { width: 40px; height: 40px; background: rgba(255,255,255,0.8); border-radius: 50%; position: absolute; }
        #jumpBtn { width: 80px; height: 80px; background: rgba(255,255,255,0.3); border-radius: 50%; border: 2px solid rgba(255,255,255,0.5); display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; font-size: 16px; pointer-events: auto; }
    </style>
</head>
<body>
    <div id="ui">
        <div id="joystick" class="control-base"><div id="knob" class="knob"></div></div>
        <div id="jumpBtn">▲</div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script>
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB);
        scene.fog = new THREE.FogExp2(0x87CEEB, 0.015);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 1000);
        camera.position.set(0, 5, 10);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0xffffff, 0.8));
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.6);
        dirLight.position.set(10, 20, 10);
        scene.add(dirLight);

        // Ground
        const ground = new THREE.Mesh(
            new THREE.PlaneGeometry(1000, 1000),
            new THREE.MeshStandardMaterial({ color: 0x3b7a12 })
        );
        ground.rotation.x = -Math.PI / 2;
        scene.add(ground);

        // Model
        let player;
        const loader = new THREE.GLTFLoader();
        loader.load('scene.gltf', (gltf) => {
            player = gltf.scene;
            player.scale.set(1, 1, 1);
            scene.add(player);
        }, undefined, (err) => console.error(err));

        // Controls State
        let moveX = 0, moveZ = 0, velocityY = 0, isJumping = false;

        // Joystick Logic
        const joystick = document.getElementById('joystick');
        const knob = document.getElementById('knob');
        let joyId = null, joyCenter = { x: 0, y: 0 };

        joystick.addEventListener('pointerdown', (e) => {
            joyId = e.pointerId;
            const rect = joystick.getBoundingClientRect();
            joyCenter = { x: rect.left + rect.width/2, y: rect.top + rect.height/2 };
        });

        window.addEventListener('pointermove', (e) => {
            if (e.pointerId !== joyId) return;
            const dx = e.clientX - joyCenter.x;
            const dy = e.clientY - joyCenter.y;
            const dist = Math.min(40, Math.hypot(dx, dy));
            const angle = Math.atan2(dy, dx);
            
            knob.style.transform = `translate(${Math.cos(angle)*dist}px, ${Math.sin(angle)*dist}px)`;
            moveX = Math.cos(angle) * (dist / 40);
            moveZ = Math.sin(angle) * (dist / 40);
        });

        window.addEventListener('pointerup', (e) => {
            if (e.pointerId !== joyId) return;
            joyId = null;
            knob.style.transform = `translate(0px, 0px)`;
            moveX = 0; moveZ = 0;
        });

        // Jump Logic
        document.getElementById('jumpBtn').addEventListener('pointerdown', () => {
            if (!isJumping && player) {
                velocityY = 0.2;
                isJumping = true;
            }
        });

        // Loop
        function animate() {
            requestAnimationFrame(animate);
            if (player) {
                player.position.x += moveX * 0.1;
                player.position.z += moveZ * 0.1;

                if (isJumping) {
                    player.position.y += velocityY;
                    velocityY -= 0.01;
                    if (player.position.y <= 0) {
                        player.position.y = 0;
                        isJumping = false;
                    }
                }
                camera.position.x = player.position.x;
                camera.position.z = player.position.z + 10;
                camera.lookAt(player.position.x, player.position.y + 1, player.position.z);
            }
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
