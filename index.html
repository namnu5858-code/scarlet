<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chatbot</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 20px auto; padding: 10px; }
        #chat-box { border: 1px solid #ccc; height: 350px; overflow-y: auto; padding: 10px; margin-bottom: 10px; border-radius: 8px; }
        .msg { margin: 8px 0; padding: 10px 14px; border-radius: 12px; max-width: 80%; word-wrap: break-word; }
        .user { background: #007aff; color: white; margin-left: auto; text-align: right; }
        .bot { background: #f1f0f0; color: #000; margin-right: auto; }
        .controls { display: flex; gap: 8px; }
        input { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 8px; font-size: 16px; }
        button { padding: 10px 16px; background: #007aff; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; }
        button:active { opacity: 0.8; }
    </style>
</head>
<body>
    <h3>Trợ Lý Trò Chuyện</h3>
    <div id="chat-box">
        <div class="msg bot">Xin chào! Bạn hãy bấm Nói hoặc Gõ tin nhắn để trò chuyện với mình nhé.</div>
    </div>
    <div class="controls">
        <button onclick="startListening()">🎤 Nói</button>
        <input type="text" id="userInput" placeholder="Nhập tin nhắn..." onkeypress="if(event.key==='Enter') sendMessage()">
        <button onclick="sendMessage()">Gửi</button>
    </div>

    <script>
        const chatBox = document.getElementById('chat-box');
        const userInput = document.getElementById('userInput');

        function appendMessage(text, sender) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `msg ${sender}`;
            msgDiv.textContent = text;
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function speak(text) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'vi-VN';
            window.speechSynthesis.speak(utterance);
        }

        function getBotReply(userText) {
            const text = userText.toLowerCase();
            if (text.includes('chào') || text.includes('hi') || text.includes('hello')) {
                return "Chào bạn! Mình đã sẵn sàng lắng nghe và phân tích cùng bạn.";
            }
            if (text.includes('tên')) {
                return "Mình là trợ lý ảo chạy trực tiếp trên trình duyệt của bạn.";
            }
            if (text.includes('mấy giờ')) {
                return "Bây giờ là " + new Date().toLocaleTimeString('vi-VN');
            }
            if (text.includes('ngày mấy') || text.includes('hôm nay')) {
                return "Hôm nay là " + new Date().toLocaleDateString('vi-VN');
            }
            return "Mình đã ghi nhận ý của bạn: \"" + userText + "\". Bạn muốn chia sẻ hay phân tích thêm gì về điều này không?";
        }

        function sendMessage() {
            const text = userInput.value;
            if (!text.trim()) return;
            appendMessage(text, 'user');
            userInput.value = '';
            
            setTimeout(() => {
                const reply = getBotReply(text);
                appendMessage(reply, 'bot');
                speak(reply);
            }, 400);
        }

        function startListening() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                alert("Trình duyệt của bạn không hỗ trợ nhận diện giọng nói.");
                return;
            }
            const recognition = new SpeechRecognition();
            recognition.lang = 'vi-VN';
            recognition.start();

            recognition.onresult = function(event) {
                const transcript = event.results[0][0].transcript;
                userInput.value = transcript;
                sendMessage();
            };
        }
    </script>
</body>
</html>
