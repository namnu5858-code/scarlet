<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Quản Lý Thư Viện</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f7f6;
            color: #333;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
            color: #2c3e50;
        }

        /* Form nhập thông tin */
        .form-section {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
            background: #eef2f5;
            padding: 20px;
            border-radius: 6px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            margin-bottom: 5px;
            font-weight: bold;
            font-size: 14px;
        }

        .form-group input, .form-group select {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
        }

        button.btn-add {
            grid-column: 1 / -1;
            padding: 12px;
            background-color: #27ae60;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s;
        }

        button.btn-add:hover {
            background-color: #219150;
        }

        /* Thanh tìm kiếm */
        .search-box {
            margin-bottom: 20px;
        }

        .search-box input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 15px;
        }

        /* Bảng danh sách sách */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        th {
            background-color: #34495e;
            color: white;
        }

        tr:hover {
            background-color: #f1f1f1;
        }

        /* Đánh dấu trạng thái */
        .status {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
        }

        .status.available {
            background-color: #d4edda;
            color: #155724;
        }

        .status.borrowed {
            background-color: #f8d7da;
            color: #721c24;
        }

        /* Nút hành động */
        .action-btn {
            padding: 6px 12px;
            margin-right: 5px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            color: white;
        }

        .btn-toggle {
            background-color: #2980b9;
        }

        .btn-toggle:hover {
            background-color: #1f6391;
        }

        .btn-delete {
            background-color: #e74c3c;
        }

        .btn-delete:hover {
            background-color: #c0392b;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Quản Lý Thư Viện</h1>

    <!-- Form thêm sách mới -->
    <div class="form-section">
        <div class="form-group">
            <label for="title">Tên sách</label>
            <input type="text" id="title" placeholder="Nhập tên sách...">
        </div>
        <div class="form-group">
            <label for="author">Tác giả</label>
            <input type="text" id="author" placeholder="Nhập tên tác giả...">
        </div>
        <div class="form-group">
            <label for="category">Thể loại</label>
            <input type="text" id="category" placeholder="Nhập thể loại...">
        </div>
        <button class="btn-add" onclick="addBook()">Thêm Sách Mới</button>
    </div>

    <!-- Thanh tìm kiếm -->
    <div class="search-box">
        <input type="text" id="searchInput" onkeyup="searchBooks()" placeholder="Tìm kiếm sách theo tên hoặc tác giả...">
    </div>

    <!-- Bảng hiển thị danh sách sách -->
    <table>
        <thead>
            <tr>
                <th>STT</th>
                <th>Tên Sách</th>
                <th>Tác Giả</th>
                <th>Thể Loại</th>
                <th>Trạng Thái</th>
                <th>Hành Động</th>
            </tr>
        </thead>
        <tbody id="bookTableBody">
            <!-- Dữ liệu sách sẽ được render ở đây -->
        </tbody>
    </table>
</div>

<script>
    // Khởi tạo danh sách sách ban đầu (lấy từ localStorage nếu có)
    let books = JSON.parse(localStorage.getItem('library_books')) || [
        { id: 1, title: "Lập Trình JavaScript", author: "Nguyễn Văn A", category: "Công nghệ", isBorrowed: false },
        { id: 2, title: "Đắc Nhân Tâm", author: "Dale Carnegie", category: "Kỹ năng sống", isBorrowed: true }
    ];

    // Lưu dữ liệu vào localStorage
    function saveToLocalStorage() {
        localStorage.setItem('library_books', JSON.stringify(books));
    }

    // Hiển thị danh sách sách ra bảng
    function renderBooks(data = books) {
        const tableBody = document.getElementById('bookTableBody');
        tableBody.innerHTML = '';

        if (data.length === 0) {
            tableBody.innerHTML = `<tr><td colspan="6" style="text-align: center;">Không tìm thấy sách nào.</td></tr>`;
            return;
        }

        data.forEach((book, index) => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${index + 1}</td>
                <td><strong>${escapeHtml(book.title)}</strong></td>
                <td>${escapeHtml(book.author)}</td>
                <td>${escapeHtml(book.category)}</td>
                <td>
                    <span class="status ${book.isBorrowed ? 'borrowed' : 'available'}">
                        ${book.isBorrowed ? 'Đã mượn' : 'Sẵn có'}
                    </span>
                </td>
                <td>
                    <button class="action-btn btn-toggle" onclick="toggleStatus(${book.id})">
                        ${book.isBorrowed ? 'Trả sách' : 'Mượn sách'}
                    </button>
                    <button class="action-btn btn-delete" onclick="deleteBook(${book.id})">Xóa</button>
                </td>
            `;
            tableBody.appendChild(tr);
        });
    }

    // Thêm sách mới
    function addBook() {
        const titleInput = document.getElementById('title');
        const authorInput = document.getElementById('author');
        const categoryInput = document.getElementById('category');

        const title = titleInput.value.trim();
        const author = authorInput.value.trim();
        const category = categoryInput.value.trim();

        if (!title || !author || !category) {
            alert('Vui lòng điền đầy đủ thông tin sách!');
            return;
        }

        const newBook = {
            id: Date.now(),
            title: title,
            author: author,
            category: category,
            isBorrowed: false
        };

        books.push(newBook);
        saveToLocalStorage();
        renderBooks();

        // Xóa sạch ô nhập sau khi thêm thành công
        titleInput.value = '';
        authorInput.value = '';
        categoryInput.value = '';
    }

    // Đổi trạng thái mượn / trả
    function toggleStatus(id) {
        const book = books.find(b => b.id === id);
        if (book) {
            book.isBorrowed = !book.isBorrowed;
            saveToLocalStorage();
            renderBooks();
        }
    }

    // Xóa sách
    function deleteBook(id) {
        if (confirm('Bạn có chắc chắn muốn xóa cuốn sách này không?')) {
            books = books.filter(b => b.id !== id);
            saveToLocalStorage();
            renderBooks();
        }
    }

    // Tìm kiếm sách theo tên hoặc tác giả
    function searchBooks() {
        const keyword = document.getElementById('searchInput').value.toLowerCase().trim();
        const filteredBooks = books.filter(book => 
            book.title.toLowerCase().includes(keyword) || 
            book.author.toLowerCase().includes(keyword) ||
            book.category.toLowerCase().includes(keyword)
        );
        renderBooks(filteredBooks);
    }

    // Hàm chống lỗi XSS khi hiển thị dữ liệu do người dùng nhập
    function escapeHtml(str) {
        return str.replace(/&/g, "&amp;")
                  .replace(/</g, "&lt;")
                  .replace(/>/g, "&gt;")
                  .replace(/"/g, "&quot;")
                  .replace(/'/g, "&#039;");
    }

    // Khởi chạy hiển thị lần đầu
    renderBooks();
</script>

</body>
</html>
