<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>Cam Thung Middle School - 3D Campus</title>

<style>
*{
  box-sizing:border-box;
  -webkit-user-select:none;
  user-select:none;
  -webkit-touch-callout:none;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#8fd4f5;
  touch-action:none;
  font-family:Arial,sans-serif;
}

#game-container{
  position:fixed;
  top:0;
  left:0;
  width:100vw;
  height:100vh;
  z-index:1;
}

canvas{
  display:block;
  width:100vw !important;
  height:100vh !important;
}

.glass-ui{
  background:rgba(255,255,255,.18);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  border:1px solid rgba(255,255,255,.4);
  box-shadow:0 8px 32px rgba(0,0,0,.18);
}

#joystick-wrapper{
  position:absolute;
  left:32px;
  bottom:32px;
  width:120px;
  height:120px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:20;
  touch-action:none;
}

#joystick-stick{
  position:absolute;
  width:52px;
  height:52px;
  border-radius:50%;
  background:rgba(255,255,255,.58);
  border:1px solid rgba(255,255,255,.85);
  box-shadow:0 4px 14px rgba(0,0,0,.18);
  pointer-events:none;
}

#jump-btn{
  position:absolute;
  right:32px;
  bottom:38px;
  width:72px;
  height:72px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:20;
  touch-action:none;
  transition:background .3s ease,transform .1s ease;
}

#jump-btn.flying{
  background:rgba(255,215,0,.55);
  border-color:rgba(255,255,255,.9);
  box-shadow:0 0 15px rgba(255,215,0,.6);
}

#jump-btn:active{
  transform:scale(.94);
}

#jump-btn svg{
  width:34px;
  height:34px;
  fill:none;
  stroke:white;
  stroke-width:2.5;
  stroke-linecap:round;
  stroke-linejoin:round;
}

#loading{
  position:absolute;
  top:14px;
  right:16px;
  padding:8px 14px;
  border-radius:10px;
  background:rgba(0,0,0,.42);
  color:white;
  font-size:12px;
  z-index:30;
  pointer-events:none;
}

#zalo-chat-wrapper{
  position:absolute;
  left:20px;
  top:20px;
  z-index:40;
  display:flex;
  flex-direction:column;
  align-items:flex-start;
}

#zalo-chat-toggle-btn{
  width:42px;
  height:42px;
  border-radius:12px;
  background:rgba(0,0,0,.55);
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
  border:1.5px solid rgba(255,255,255,.3);
  color:white;
  font-size:18px;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  box-shadow:0 4px 15px rgba(0,0,0,.3);
  transition:transform .2s ease,background .2s ease;
  outline:none;
}

#zalo-chat-toggle-btn:active{
  transform:scale(.92);
}

#roblox-chat-container{
  width:320px;
  height:180px;
  background:rgba(18,18,18,.82);
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
  border-radius:12px;
  border:1px solid rgba(255,255,255,.15);
  display:flex;
  flex-direction:column;
  overflow:hidden;
  box-shadow:0 8px 30px rgba(0,0,0,.55);
  margin-top:8px;
  transition:all .25s cubic-bezier(.4,0,.2,1);
  transform-origin:top left;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}

#roblox-chat-container.minimized{
  opacity:0;
  transform:scale(.85);
  pointer-events:none;
  height:0;
  margin-top:0;
  border:none;
}

#roblox-chat-messages{
  flex:1;
  padding:8px 12px;
  overflow-y:auto;
  font-size:12.5px;
  color:#fff;
  display:flex;
  flex-direction:column;
  gap:5px;
  scroll-behavior:smooth;
}

.chat-msg{
  background:rgba(0,0,0,.38);
  padding:5px 8px;
  border-radius:5px;
  word-break:break-word;
  line-height:1.35;
}

.chat-msg span.system{
  color:#ffcc00;
  font-weight:bold;
}

.chat-msg span.username{
  color:#8ac2ff;
  font-weight:bold;
}

#roblox-chat-input-wrap{
  padding:8px;
  background:rgba(12,12,12,.75);
  border-top:1px solid rgba(255,255,255,.08);
  display:flex;
  align-items:center;
  gap:6px;
}

#roblox-chat-input{
  flex:1;
  height:32px;
  background:rgba(0,0,0,.5);
  border:1px solid rgba(255,255,255,.18);
  border-radius:6px;
  padding:0 10px;
  color:#fff;
  font-size:12.5px;
  outline:none;
  -webkit-user-select:text;
  user-select:text;
  transition:border-color .2s;
}

#roblox-chat-input:focus{
  border-color:rgba(255,255,255,.45);
}

#roblox-chat-input::placeholder{
  color:rgba(255,255,255,.4);
}

#roblox-send-btn{
  width:32px;
  height:32px;
  background:rgba(0,0,0,.5);
  border:1px solid rgba(255,255,255,.18);
  border-radius:6px;
  color:#fff;
  font-size:14px;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  transition:background .2s,transform .1s;
  outline:none;
}

#roblox-send-btn:active{
  transform:scale(.92);
  background:rgba(255,255,255,.2);
}

#screen-hint{
  position:absolute;
  left:50%;
  top:18px;
  transform:translateX(-50%);
  padding:9px 15px;
  border-radius:12px;
  background:rgba(0,0,0,.55);
  color:white;
  font-size:13px;
  z-index:25;
  pointer-events:none;
  opacity:0;
  transition:opacity .25s ease;
}

#screen-hint.show{
  opacity:1;
}

#browser-overlay{
  position:fixed;
  inset:0;
  z-index:100;
  display:none;
  background:rgba(0,0,0,.88);
  padding:
    max(10px,env(safe-area-inset-top))
    max(8px,env(safe-area-inset-right))
    max(10px,env(safe-area-inset-bottom))
    max(8px,env(safe-area-inset-left));
}

#browser-overlay.open{
  display:flex;
  flex-direction:column;
}

#browser-bar{
  width:100%;
  min-height:52px;
  display:flex;
  align-items:center;
  gap:7px;
  padding:6px;
  border-radius:14px;
  background:rgba(35,35,35,.96);
}

.browser-btn{
  width:38px;
  height:38px;
  flex:0 0 38px;
  border:0;
  border-radius:10px;
  background:#444;
  color:white;
  font-size:18px;
  touch-action:manipulation;
}

#browser-url{
  flex:1;
  min-width:0;
  height:38px;
  border:0;
  outline:none;
  border-radius:10px;
  padding:0 12px;
  background:#fff;
  color:#111;
  font-size:15px;
  -webkit-user-select:text;
  user-select:text;
}

#browser-frame-wrap{
  position:relative;
  flex:1;
  min-height:0;
  margin-top:7px;
  overflow:hidden;
  border-radius:14px;
  background:white;
}

#browser-frame{
  width:100%;
  height:100%;
  border:0;
  background:white;
}

#browser-warning{
  position:absolute;
  left:12px;
  right:12px;
  bottom:12px;
  padding:10px 12px;
  border-radius:10px;
  background:rgba(0,0,0,.75);
  color:white;
  font-size:12px;
  line-height:1.4;
  pointer-events:none;
  opacity:.85;
}

<script type="module">

import * as THREE from "three";
import {GLTFLoader} from "three/addons/loaders/GLTFLoader.js";

/* ============================================================
   YOUTUBE + CHAT
   ============================================================ */

let ytPlayer=null;

window.onYouTubeIframeAPIReady=function(){

  ytPlayer=new YT.Player(
    "yt-player",
    {
      height:"0",
      width:"0",
      videoId:"6dEKnnPzxSc",

      playerVars:{
        autoplay:0,
        loop:1,
        playlist:"6dEKnnPzxSc"
      },

      events:{
        onReady:(event)=>{}
      }
    }
  );
};

const chatContainer=
  document.getElementById("roblox-chat-container");

const chatToggleBtn=
  document.getElementById("zalo-chat-toggle-btn");

const chatInput=
  document.getElementById("roblox-chat-input");

const chatMessages=
  document.getElementById("roblox-chat-messages");

const sendBtn=
  document.getElementById("roblox-send-btn");

chatToggleBtn.addEventListener(
  "click",
  ()=>{
    chatContainer.classList.toggle("minimized");

    if(!chatContainer.classList.contains("minimized")){
      chatInput.focus();
    }
  }
);

function pushChatMessage(sender,text,isSystem=false){

  const div=document.createElement("div");

  div.className="chat-msg";

  if(isSystem){

    div.innerHTML=
      `<span class="system">${sender}:</span> ${text}`;

  }else{

    div.innerHTML=
      `<span class="username">[${sender}]</span> ${text}`;

  }

  chatMessages.appendChild(div);

  chatMessages.scrollTop=
    chatMessages.scrollHeight;
}

function handleMusicCommand(cmd){

  const lower=cmd.toLowerCase();

  if(
    !ytPlayer ||
    typeof ytPlayer.playVideo!=="function"
  ){

    pushChatMessage(
      "Hệ thống",
      "Trình phát YouTube đang tải, vui lòng thử lại sau giây lát!",
      true
    );

    return;
  }

  if(lower==="t"){

    ytPlayer.playVideo();

    pushChatMessage(
      "Hệ thống",
      "Đã bật nhạc nền YouTube!",
      true
    );

  }else if(lower==="a"){

    ytPlayer.playVideo();

    pushChatMessage(
      "Hệ thống",
      "Đã tiếp tục phát nhạc nền!",
      true
    );

  }else if(lower==="s"){

    ytPlayer.pauseVideo();

    pushChatMessage(
      "Hệ thống",
      "Đã dừng nhạc nền!",
      true
    );
  }
}

function processChatAction(){

  const val=chatInput.value.trim();

  if(val){

    pushChatMessage("Bạn",val);

    handleMusicCommand(val);

    chatInput.value="";
  }
}

chatInput.addEventListener(
  "keydown",
  e=>{
    if(e.key==="Enter"){
      processChatAction();
    }
  }
);

sendBtn.addEventListener(
  "click",
  ()=>{
    processChatAction();
  }
);

window.addEventListener(
  "keydown",
  e=>{

    if(e.key==="/"){

      if(document.activeElement!==chatInput){

        e.preventDefault();

        chatContainer.classList.remove("minimized");

        chatInput.focus();
      }

      return;
    }

    if(document.activeElement===chatInput) return;

    const key=e.key.toUpperCase();

    if(key==="T"){
      handleMusicCommand("t");
    }else if(key==="A"){
      handleMusicCommand("a");
    }else if(key==="S"){
      handleMusicCommand("s");
    }
  }
);

/* ============================================================
   SCENE
   ============================================================ */

const container=
  document.getElementById("game-container");

const loading=
  document.getElementById("loading");

const scene=
  new THREE.Scene();

scene.background=
  new THREE.Color(0x8fd4f5);

scene.fog=
  new THREE.FogExp2(
    0xbfeafa,
    .0012
  );

const cameraPivot=
  new THREE.Object3D();

scene.add(cameraPivot);

const camera=
  new THREE.PerspectiveCamera(
    60,
    window.innerWidth/window.innerHeight,
    .1,
    3000
  );

cameraPivot.add(camera);

let cameraDistance=10;
let targetCameraDistance=10;

let cameraAngleX=.1;
let cameraAngleY=0;

let targetCameraAngleX=.1;
let targetCameraAngleY=0;

const renderer=
  new THREE.WebGLRenderer({
    antialias:true,
    powerPreference:"high-performance"
  });

renderer.setSize(
  window.innerWidth,
  window.innerHeight
);

renderer.setPixelRatio(
  Math.min(window.devicePixelRatio,2)
);

renderer.shadowMap.enabled=true;
renderer.shadowMap.type=
  THREE.PCFSoftShadowMap;

renderer.outputColorSpace=
  THREE.SRGBColorSpace;

renderer.toneMapping=
  THREE.ACESFilmicToneMapping;

renderer.toneMappingExposure=1.12;

container.appendChild(
  renderer.domElement
);

/* ============================================================
   CAMERA COLLISION
   ============================================================ */

const raycaster=
  new THREE.Raycaster();

const cameraCollisionObjects=[];

function updateCamera(){

  cameraAngleY=
    THREE.MathUtils.lerp(
      cameraAngleY,
      targetCameraAngleY,
      .18
    );

  cameraAngleX=
    THREE.MathUtils.lerp(
      cameraAngleX,
      targetCameraAngleX,
      .18
    );

  cameraDistance=
    THREE.MathUtils.lerp(
      cameraDistance,
      targetCameraDistance,
      .12
    );

  cameraPivot.rotation.y=
    cameraAngleY;

  cameraPivot.rotation.x=
    cameraAngleX;

  const origin=
    cameraPivot.position.clone();

  const dir=
    new THREE.Vector3(0,0,1)
      .applyQuaternion(
        cameraPivot.quaternion
      );

  raycaster.set(origin,dir);

  let actualDistance=
    cameraDistance;

  if(cameraCollisionObjects.length>0){

    const hits=
      raycaster.intersectObjects(
        cameraCollisionObjects,
        true
      );

    if(
      hits.length>0 &&
      hits[0].distance<cameraDistance
    ){

      actualDistance=
        Math.max(
          hits[0].distance-.3,
          .5
        );
    }
  }

  camera.position.set(
    0,
    0,
    actualDistance
  );

  camera.lookAt(
    cameraPivot.position
  );
}

/* ============================================================
   LIGHT
   ============================================================ */

const hemisphere=
  new THREE.HemisphereLight(
    0xe8f8ff,
    0x516b3b,
    1.5
  );

scene.add(hemisphere);

const sunlight=
  new THREE.DirectionalLight(
    0xfff3d2,
    2.2
  );

sunlight.position.set(
  100,
  130,
  80
);

sunlight.castShadow=true;

sunlight.shadow.mapSize.width=2048;
sunlight.shadow.mapSize.height=2048;

sunlight.shadow.camera.near=1;
sunlight.shadow.camera.far=400;

sunlight.shadow.camera.left=-250;
sunlight.shadow.camera.right=250;
sunlight.shadow.camera.top=250;
sunlight.shadow.camera.bottom=-250;

sunlight.shadow.bias=-.0003;

scene.add(sunlight);

/* ============================================================
   MATERIALS
   ============================================================ */

const MAT={};

/* MÀU XANH NHẠT LÀ MÀU TƯỜNG CHỦ ĐẠO.
   KHÔNG DÙNG XANH LÁ CHO BẤT KỲ BỀ MẶT TƯỜNG NÀO. */

MAT.redTile=
  new THREE.MeshStandardMaterial({
    color:0xa94c3d,
    roughness:.78
  });

MAT.lightBlue=
  new THREE.MeshStandardMaterial({
    color:0x9ed9ec,
    roughness:.7
  });

MAT.white=
  new THREE.MeshStandardMaterial({
    color:0xf4f5f0,
    roughness:.72
  });

MAT.yellow=
  new THREE.MeshStandardMaterial({
    color:0xe7d16a,
    roughness:.8
  });

MAT.darkMetal=
  new THREE.MeshStandardMaterial({
    color:0x30383b,
    roughness:.55,
    metalness:.65
  });

MAT.steel=
  new THREE.MeshStandardMaterial({
    color:0xadb7ba,
    roughness:.35,
    metalness:.8
  });

MAT.roofMetal=
  new THREE.MeshStandardMaterial({
    color:0x68777b,
    roughness:.65,
    metalness:.45
  });

MAT.glass=
  new THREE.MeshPhysicalMaterial({
    color:0x76b9d2,
    roughness:.08,
    metalness:.05,
    transparent:true,
    opacity:.68
  });

MAT.concrete=
  new THREE.MeshStandardMaterial({
    color:0xb8b9b3,
    roughness:.9
  });

/* MÀU MẠCH GẠCH NHỎ, NHẸ, ĐỒNG BỘ */
MAT.wallTileJoint=
  new THREE.MeshStandardMaterial({
    color:0x78b7c9,
    roughness:.8
  });

MAT.walkTile=
  new THREE.MeshStandardMaterial({
    color:0xc6b5a6,
    roughness:.86
  });

MAT.walkJoint=
  new THREE.MeshStandardMaterial({
    color:0x9d8c7d,
    roughness:.9
  });

/* ============================================================
   HELPER
   ============================================================ */

function box(
  w,h,d,
  x,y,z,
  material,
  parent=scene
){

  const mesh=
    new THREE.Mesh(
      new THREE.BoxGeometry(w,h,d),
      material
    );

  mesh.position.set(x,y,z);

  mesh.castShadow=true;
  mesh.receiveShadow=true;

  parent.add(mesh);

  return mesh;
}

/* ============================================================
   ỐP GẠCH TƯỜNG NHỎ - ĐỀU - ĐỐI XỨNG
   ============================================================ */

function createWallTilesFront(
  parent,
  width,
  height,
  x,
  y,
  z,
  depth,
  rows,
  columns
){

  const tileGap=.055;

  const tileWidth=
    (width-(columns+1)*tileGap)/
    columns;

  const tileHeight=
    (height-(rows+1)*tileGap)/
    rows;

  for(let r=0;r<rows;r++){

    for(let c=0;c<columns;c++){

      const tx=
        x-width/2+
        tileGap+
        tileWidth/2+
        c*(tileWidth+tileGap);

      const ty=
        y-height/2+
        tileGap+
        tileHeight/2+
        r*(tileHeight+tileGap);

      box(
        tileWidth,
        tileHeight,
        .055,
        tx,
        ty,
        z,
        MAT.lightBlue,
        parent
      );
    }
  }
}

function createWallTilesSide(
  parent,
  width,
  height,
  x,
  y,
  z,
  depth,
  rows,
  columns,
  side
){

  const tileGap=.055;

  const tileWidth=
    (width-(columns+1)*tileGap)/
    columns;

  const tileHeight=
    (height-(rows+1)*tileGap)/
    rows;

  for(let r=0;r<rows;r++){

    for(let c=0;c<columns;c++){

      const tz=
        z-width/2+
        tileGap+
        tileWidth/2+
        c*(tileWidth+tileGap);

      const ty=
        y-height/2+
        tileGap+
        tileHeight/2+
        r*(tileHeight+tileGap);

      box(
        .055,
        tileHeight,
        tileWidth,
        x,
        ty,
        tz,
        MAT.lightBlue,
        parent
      );
    }
  }
}

/* ============================================================
   CAMPUS
   ============================================================ */

const campus=
  new THREE.Group();

scene.add(campus);

const CAMPUS_W=260;
const CAMPUS_D=210;

const baseGround=
  box(
    2500,
    1,
    2500,
    0,
    -.7,
    0,
    new THREE.MeshStandardMaterial({
      color:0x73b951,
      roughness:1
    }),
    campus
  );

cameraCollisionObjects.push(
  baseGround
);

const courtyard=
  box(
    240,
    .45,
    190,
    0,
    0,
    0,
    MAT.redTile,
    campus
  );

cameraCollisionObjects.push(
  courtyard

function createTiledWalkway(
  width,
  depth,
  x,
  y,
  z,
  tileSizeX,
  tileSizeZ
){

  const walkway=
    new THREE.Group();

  campus.add(walkway);

  const rows=
    Math.floor(depth/tileSizeZ);

  const columns=
    Math.floor(width/tileSizeX);

  const actualWidth=
    columns*tileSizeX;

  const actualDepth=
    rows*tileSizeZ;

  const startX=
    x-actualWidth/2+
    tileSizeX/2;

  const startZ=
    z-actualDepth/2+
    tileSizeZ/2;

  for(let r=0;r<rows;r++){

    for(let c=0;c<columns;c++){

      const tx=
        startX+
        c*tileSizeX;

      const tz=
        startZ+
        r*tileSizeZ;

      box(
        tileSizeX-.08,
        .12,
        tileSizeZ-.08,
        tx,
        y,
        tz,
        MAT.walkTile,
        walkway
      );
    }
  }

  return walkway;
}

const screenRaycaster=
  new THREE.Raycaster();

const screenPointer=
  new THREE.Vector2();

const screenHint=
  document.getElementById(
    "screen-hint"
  );

function openBrowser(){

  const overlay=
    document.getElementById(
      "browser-overlay"
    );

  if(overlay.classList.contains("open")){
    return;
  }

  overlay.classList.add("open");

  screenHint.classList.remove(
    "show"
  );
}

function checkScreenTouch(
  clientX,
  clientY
){

  const rect=
    renderer.domElement.getBoundingClientRect();

  screenPointer.x=
    ((clientX-rect.left)/rect.width)*2-1;

  screenPointer.y=
    -((clientY-rect.top)/rect.height)*2+1;

  screenRaycaster.setFromCamera(
    screenPointer,
    camera
  );

  const hits=
    screenRaycaster.intersectObject(
      interactiveScreen,
      true
    );

  if(hits.length>0){

    openBrowser();

    return true;
  }

  return false;
}

renderer.domElement.addEventListener(
  "pointerdown",
  event=>{

    if(event.pointerType==="mouse"){

      checkScreenTouch(
        event.clientX,
        event.clientY
      );
    }
  },
  {passive:true}
);

renderer.domElement.addEventListener(
  "touchstart",
  event=>{

    if(event.touches.length!==1) return;

    const touch=
      event.touches[0];

    const joyRect=
      joystick.getBoundingClientRect();

    if(
      touch.clientX>=joyRect.left &&
      touch.clientX<=joyRect.right &&
      touch.clientY>=joyRect.top &&
      touch.clientY<=joyRect.bottom
    ){
      return;
    }

    const jumpRect=
      jump.getBoundingClientRect();

    if(
      touch.clientX>=jumpRect.left &&
      touch.clientX<=jumpRect.right &&
      touch.clientY>=jumpRect.top &&
      touch.clientY<=jumpRect.bottom
    ){
      return;
    }

    checkScreenTouch(
      touch.clientX,
      touch.clientY
    );
  },
  {passive:true}
);

const player=

scene.add(player);

let model=null;

const leafMeshes=[];
const armMeshes=[];
const rootMeshes=[];
const initialData=
  new Map();

const loader=
  new GLTFLoader();

loader.load(
  "scene.gltf",

  gltf=>{

    model=gltf.scene;

    model.position.y=.22;

    model.traverse(
      object=>{

        if(!object.isMesh) return;

        object.castShadow=true;
        object.receiveShadow=true;

        initialData.set(
          object,
          {
            position:
              object.position.clone(),

            rotation:
              object.rotation.clone(),

            scale:
              object.scale.clone()
          }
        );

        const name=
          object.name.toLowerCase();

        if(
          name.includes("leaf")||
          name.includes("leaves")||
          name.includes("foliage")||
          name.includes("la")
        ){
          leafMeshes.push(object);
        }

        if(
          name.includes("arm")||
          name.includes("hand")||
          name.includes("tay")
        ){
          armMeshes.push(object);
        }

        if(
          name.includes("root")||
          name.includes("re")
        ){
          rootMeshes.push(object);
        }
      }
    );

    player.add(model);

    loading.style.display="none";
  },

  undefined,

  ()=>{
    loading.textContent=
      "Không tìm thấy scene.gltf";
  }
);

/* ============================================================
   MOVEMENT
   ============================================================ */

const input=
  new THREE.Vector2(0,0);

const velocity=
  new THREE.Vector3(0,0,0);

const walkSpeed=80.556;
const FLY_SPEED=97.222;

let moveSpeed=walkSpeed;

const gravity=-20;

let grounded=true;
let isFlying=false;

/* ============================================================
   JOYSTICK
   ============================================================ */

const joystick=
  document.getElementById(
    "joystick-wrapper"
  );

const stick=
  document.getElementById(
    "joystick-stick"
  );

let joystickTouch=null;

let centerX=0;
let centerY=0;

const radius=40;

joystick.addEventListener(
  "touchstart",
  event=>{

    event.preventDefault();

    const touch=
      event.changedTouches[0];

    joystickTouch=
      touch.identifier;

    const rect=
      joystick.getBoundingClientRect();

    centerX=
      rect.left+
      rect.width/2;

    centerY=
      rect.top+
      rect.height/2;

    updateJoystick(touch);
  },
  {passive:false}
);

function updateJoystick(touch){

  const dx=
    touch.clientX-centerX;

  const dy=
    touch.clientY-centerY;

  const distance=
    Math.hypot(dx,dy);

  const angle=
    Math.atan2(dy,dx);

  const limited=
    Math.min(
      distance,
      radius
    );

  const x=
    Math.cos(angle)*limited;

  const y=
    Math.sin(angle)*limited;

  stick.style.transform=
    `translate(${x}px,${y}px)`;

  input.x=
    x/radius;

  input.y=
    -y/radius;
}

function resetJoystick(){

  joystickTouch=null;

  input.set(0,0);

  velocity.x=0;
  velocity.z=0;

  stick.style.transform=
    "translate(0px,0px)";
}

window.addEventListener(
  "touchmove",
  event=>{

    for(
      let i=0;
      i<event.changedTouches.length;
      i++
    ){

      if(
        event.changedTouches[i].identifier===
        joystickTouch
      ){

        updateJoystick(
          event.changedTouches[i]
        );
      }
    }
  },
  {passive:false}
);

window.addEventListener(
  "touchend",
  event=>{

    for(
      let i=0;
      i<event.changedTouches.length;
      i++
    ){

      if(
        event.changedTouches[i].identifier===
        joystickTouch
      ){

        resetJoystick();
      }
    }
  }
);

window.addEventListener(
  "touchcancel",
  resetJoystick
);

/* ============================================================
   JUMP / FLY
   ============================================================ */

const jump=
  document.getElementById(
    "jump-btn"
  );

let isJumpHolding=false;

jump.addEventListener(
  "touchstart",
  event=>{

    event.preventDefault();

    isJumpHolding=true;

    if(!isFlying){

      isFlying=true;

      grounded=false;

      jump.classList.add(
        "flying"
      );

      moveSpeed=FLY_SPEED;
    }
  },
  {passive:false}
);

jump.addEventListener(
  "touchend",
  event=>{

    event.preventDefault();

    isJumpHolding=false;
  }
);

jump.addEventListener(
  "touchcancel",
  ()=>{
    isJumpHolding=false;
  }
);

/* ============================================================
   CAMERA
   ============================================================ */

let cameraTouch=null;

let lastX=0;
let lastY=0;

let initialPinchDistance=null;

let initialCameraDistance=
  targetCameraDistance;

window.addEventListener(
  "wheel",
  event=>{

    event.preventDefault();

    const zoomSensitivity=.015;

    targetCameraDistance+=
      event.deltaY*
      zoomSensitivity;

    targetCameraDistance=
      THREE.MathUtils.clamp(
        targetCameraDistance,
        1.5,
        60
      );
  },
  {passive:false}
);

window.addEventListener(
  "touchstart",
  event=>{

    if(event.touches.length===2){

      initialPinchDistance=
        Math.hypot(
          event.touches[0].clientX-
          event.touches[1].clientX,

          event.touches[0].clientY-
          event.touches[1].clientY
        );

      initialCameraDistance=
        targetCameraDistance;

      return;
    }

    const touch=
      event.changedTouches[0];

    if(
      touch.identifier!==joystickTouch &&
      cameraTouch===null
    ){

      cameraTouch=
        touch.identifier;

      lastX=
        touch.clientX;

      lastY=
        touch.clientY;
    }
  }
);

window.addEventListener(
  "touchmove",
  event=>{

    if(
      event.touches.length===2 &&
      initialPinchDistance!==null
    ){

      const currentDistance=
        Math.hypot(
          event.touches[0].clientX-
          event.touches[1].clientX,

          event.touches[0].clientY-
          event.touches[1].clientY
        );

      if(currentDistance>0){

        const factor=
          initialPinchDistance/
          currentDistance;

        targetCameraDistance=
          THREE.MathUtils.clamp(
            initialCameraDistance*
            factor,
            1.5,
            60
          );
      }

      return;
    }

    for(
      let i=0;
      i<event.changedTouches.length;
      i++
    ){

      const touch=
        event.changedTouches[i];

      if(
        touch.identifier===
        cameraTouch
      ){

        const dx=
          touch.clientX-lastX;

        const dy=
          touch.clientY-lastY;

        targetCameraAngleY-=
          dx*.005;

        targetCameraAngleX=
          THREE.MathUtils.clamp(
            targetCameraAngleX+
            dy*.005,
            -Math.PI/2+.01,
            Math.PI/2-.05
          );

        lastX=
          touch.clientX;

        lastY=
          touch.clientY;
      }
    }
  },
  {passive:false}
);

window.addEventListener(
  "touchend",
  event=>{

    if(event.touches.length<2){
      initialPinchDistance=null;
    }

    for(
      let i=0;
      i<event.changedTouches.length;
      i++
    ){

      if(
        event.changedTouches[i].identifier===
        cameraTouch
      ){

        cameraTouch=null;
      }
    }
  }
);

window.addEventListener(
  "touchcancel",
  ()=>{
    cameraTouch=null;
    initialPinchDistance=null;
  }
);

/* ============================================================
   BROWSER
   ============================================================ */

const browserOverlay=
  document.getElementById(
    "browser-overlay"
  );

const browserURL=
  document.getElementById(
    "browser-url"
  );

const browserFrame=
  document.getElementById(
    "browser-frame"
  );

const browserBack=
  document.getElementById(
    "browser-back"
  );

const browserForward=
  document.getElementById(
    "browser-forward"
  );

const browserGo=
  document.getElementById(
    "browser-go"
  );

const browserClose=
  document.getElementById(
    "browser-close"
  );

function navigateBrowser(){

  let value=
    browserURL.value.trim();

  if(!value) return;

  if(!/^https?:\/\//i.test(value)){

    value=
      "https://duckduckgo.com/?q="+
      encodeURIComponent(value);
  }

  browserURL.value=value;

  browserFrame.src=value;
}

browserGo.addEventListener(
  "click",
  navigateBrowser
);

browserURL.addEventListener(
  "keydown",
  event=>{

    if(event.key==="Enter"){
      navigateBrowser();
    }
  }
);

browserBack.addEventListener(
  "click",
  ()=>{
    try{
      browserFrame.contentWindow.history.back();
    }catch(e){}
  }
);

browserForward.addEventListener(
  "click",
  ()=>{
    try{
      browserFrame.contentWindow.history.forward();
    }catch(e){}
  }
);

browserClose.addEventListener(
  "click",
  ()=>{

    browserOverlay.classList.remove(
      "open"
    );

    browserFrame.src=
      "about:blank";
  }
);

/* ============================================================
   ANIMATION
   ============================================================ */

let animationTime=0;
let animationBlend=0;

function animateLeaves(
  delta,
  moving
){

  if(!model) return;

  leafMeshes.forEach(
    (mesh,index)=>{

      const original=
        initialData.get(mesh);

      if(!original) return;

      const speed=
        .72+(index%7)*.085;

      const phase=
        index*.67;

      const t=
        animationTime*
        speed+
        phase;

      const wave1=
        Math.sin(t);

      const wave2=
        Math.sin(
          t*1.73+index
        );

      const wave3=
        Math.cos(
          t*.57+
          index*.4
        );

      const movement=
        (
          wave1*.62+
          wave2*.23+
          wave3*.15
        )*
        animationBlend;

      const side=
        index%2===0?1:-1;

      mesh.rotation.z=
        original.rotation.z+
        movement*.30*side;

      mesh.rotation.x=
        original.rotation.x+
        wave3*.15*
        animationBlend;

      mesh.rotation.y=
        original.rotation.y+
        wave2*.10*
        animationBlend;
    }
  );
}

function animateSunflower(
  delta,
  moving
){

  if(!model) return;

  const target=
    moving?1:0;

  animationBlend=
    THREE.MathUtils.lerp(
      animationBlend,
      target,
      Math.min(delta*7,1)
    );

  if(moving){
    animationTime+=
      delta*9.5;
  }

  const wave=
    Math.sin(animationTime);

  const bounce=
    Math.abs(wave)*
    .10*
    animationBlend;

  model.position.y=
    THREE.MathUtils.lerp(
      model.position.y,
      .22+bounce,
      Math.min(delta*13,1)
    );

  model.rotation.z=
    THREE.MathUtils.lerp(
      model.rotation.z,
      wave*.035*
      animationBlend,
      Math.min(delta*8,1)
    );

  animateLeaves(
    delta,
    moving
  );

  armMeshes.forEach(
    (mesh,index)=>{

      const original=
        initialData.get(mesh);

      if(!original) return;

      const side=
        index%2===0?1:-1;

      mesh.rotation.z=
        original.rotation.z+
        wave*.32*
        side*
        animationBlend;
    }
  );

  rootMeshes.forEach(
    (mesh,index)=>{

      const original=
        initialData.get(mesh);

      if(!original) return;

      const side=
        index%2===0?1:-1;

      mesh.rotation.z=
        original.rotation.z+
        Math.sin(
          animationTime+
          Math.PI
        )*.20*
        side*
        animationBlend;
    }
  );
}

/* ============================================================
   GAME LOOP
   ============================================================ */

const clock=
  new THREE.Clock();

function animate(){

  requestAnimationFrame(
    animate
  );

  const delta=
    Math.min(
      clock.getDelta(),
      .05
    );

  const moving=
    input.lengthSq()>.01;

  if(moving){

    const forward=
      new THREE.Vector3(
        0,
        0,
        -1
      );

    const right=
      new THREE.Vector3(
        1,
        0,
        0
      );

    forward.applyAxisAngle(
      new THREE.Vector3(0,1,0),
      cameraAngleY
    );

    right.applyAxisAngle(
      new THREE.Vector3(0,1,0),
      cameraAngleY
    );

    const movement=
      new THREE.Vector3();

    movement.addScaledVector(
      right,
      input.x
    );

    movement.addScaledVector(
      forward,
      input.y
    );

    if(movement.lengthSq()>0){

      movement.normalize();

      velocity.x=
        movement.x*
        moveSpeed;

      velocity.z=
        movement.z*
        moveSpeed;

      if(model){

        const targetRotation=
          Math.atan2(
            movement.x,
            movement.z
          );

        let difference=
          targetRotation-
          model.rotation.y;

        difference=
          Math.atan2(
            Math.sin(difference),
            Math.cos(difference)
          );

        model.rotation.y+=
          difference*
          Math.min(delta*10,1);
      }
    }

  }else{

    velocity.x=0;
    velocity.z=0;
  }

  animateSunflower(
    delta,
    moving
  );

  if(isFlying){

    if(isJumpHolding){

      velocity.y=
        THREE.MathUtils.lerp(
          velocity.y,
          50,
          delta*5
        );

    }else{

      velocity.y=
        THREE.MathUtils.lerp(
          velocity.y,
          0,
          delta*3
        );
    }

  }else{

    velocity.y+=
      gravity*
      delta;
  }

  player.position.y+=
    velocity.y*
    delta;

  if(player.position.y<=0){

    player.position.y=0;

    velocity.y=0;

    grounded=true;

    if(isFlying){

      isFlying=false;

      jump.classList.remove(
        "flying"
      );

      moveSpeed=
        walkSpeed;
    }
  }

  player.position.x+=
    velocity.x*
    delta;

  player.position.z+=
    velocity.z*
    delta;

  cameraPivot.position.copy(
    player.position
  );

  cameraPivot.position.y+=1.6;

  updateCamera();

  renderer.render(
    scene,
    camera
  );
}

animate();

/* ============================================================
   RESIZE
   ============================================================ */

function onResize(){

  const width=
    window.innerWidth;

  const height=
    window.innerHeight;

  camera.aspect=
    width/height;

  camera.updateProjectionMatrix();

  renderer.setSize(
    width,
    height
  );

  renderer.setPixelRatio(
    Math.min(
      window.devicePixelRatio,
      2
    )
  );
}

window.addEventListener(
  "resize",
  onResize
);

window.addEventListener(
  "orientationchange",
  ()=>{
    setTimeout(
      onResize,
      100
    );
  }
);

onResize();

  );
