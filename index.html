<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Locket Camera</title>
  <style>
    :root {
      --bg-color: #000000;
      --surface-color: #1c1c1e;
      --surface-hover: #2c2c2e;
      --accent-yellow: #ffb800;
      --text-primary: #ffffff;
      --text-secondary: #8e8e93;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: var(--bg-color);
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
    }

    .app-container {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      width: 100%;
      max-width: 480px;
      height: 100dvh;
      margin: 0 auto;
      padding: calc(env(safe-area-inset-top, 12px) + 8px) 16px calc(env(safe-area-inset-bottom, 16px) + 12px);
    }

    /* Top Navigation */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 44px;
      z-index: 10;
    }

    .icon-circle-btn {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background-color: var(--surface-color);
      border: none;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.15s ease, background-color 0.15s ease;
    }

    .icon-circle-btn:active {
      transform: scale(0.92);
      background-color: var(--surface-hover);
    }

    .friends-pill {
      height: 40px;
      padding: 0 18px;
      border-radius: 999px;
      background-color: var(--surface-color);
      border: none;
      color: var(--text-primary);
      font-size: 15px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      transition: transform 0.15s ease, background-color 0.15s ease;
    }

    .friends-pill:active {
      transform: scale(0.95);
      background-color: var(--surface-hover);
    }

    /* Viewfinder */
    .viewfinder-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 42px;
      overflow: hidden;
      background-color: #141416;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.6);
      margin: auto 0;
    }

    video, #preview-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    video.mirrored {
      transform: scaleX(-1);
    }

    #preview-image {
      display: none;
    }

    .overlay-btn {
      position: absolute;
      top: 16px;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: rgba(28, 28, 30, 0.65);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: var(--text-primary);
      font-size: 13px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 5;
      transition: transform 0.15s ease, background-color 0.15s ease;
    }

    .overlay-btn:active {
      transform: scale(0.9);
    }

    .overlay-btn.flash-btn {
      left: 16px;
    }

    .overlay-btn.flash-btn.active {
      color: var(--accent-yellow);
      background: rgba(255, 184, 0, 0.2);
      border-color: rgba(255, 184, 0, 0.4);
    }

    .overlay-btn.zoom-btn {
      right: 16px;
    }

    .caption-input-wrap {
      position: absolute;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 48px);
      display: none;
      justify-content: center;
      z-index: 6;
    }

    .caption-input {
      width: 100%;
      max-width: 260px;
      padding: 8px 16px;
      border-radius: 999px;
      border: none;
      background: rgba(28, 28, 30, 0.78);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: #ffffff;
      font-size: 14px;
      font-weight: 500;
      text-align: center;
      outline: none;
    }

    .caption-input::placeholder {
      color: rgba(255, 255, 255, 0.65);
    }

    .flash-effect {
      position: absolute;
      inset: 0;
      background: #ffffff;
      opacity: 0;
      pointer-events: none;
      z-index: 10;
      transition: opacity 0.25s ease-out;
    }

    /* Controls Section */
    .controls-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      padding-bottom: 4px;
    }

    .shutter-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 0 24px;
    }

    .side-action-btn {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: transparent;
      border: none;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.15s ease, opacity 0.15s ease;
    }

    .side-action-btn:active {
      transform: scale(0.88);
      opacity: 0.7;
    }

    /* Locket Accurate Shutter Button */
    .shutter-outer {
      width: 88px;
      height: 88px;
      border-radius: 50%;
      border: 3.5px solid var(--accent-yellow);
      padding: 3.5px;
      background-color: #000000;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.15s ease;
    }

    .shutter-outer:active {
      transform: scale(0.93);
    }

    .shutter-inner {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background-color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.12s ease, background-color 0.15s ease;
    }

    .shutter-outer:active .shutter-inner {
      transform: scale(0.94);
    }

    .shutter-inner.send-mode {
      background-color: var(--accent-yellow);
      color: #000000;
    }

    /* History Trigger */
    .history-trigger {
      display: flex;
      align-items: center;
      gap: 8px;
      background: transparent;
      border: none;
      color: var(--text-primary);
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      padding: 6px 12px;
      border-radius: 14px;
      transition: background-color 0.15s ease;
    }

    .history-trigger:active {
      background-color: var(--surface-color);
    }

    .history-badge {
      min-width: 24px;
      height: 24px;
      padding: 0 6px;
      border-radius: 7px;
      background-color: var(--accent-yellow);
      color: #000000;
      font-size: 13px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* History Modal Drawer */
    .history-modal {
      position: fixed;
      inset: 0;
      background-color: #000000;
      z-index: 50;
      display: flex;
      flex-direction: column;
      transform: translateY(100%);
      transition: transform 0.32s cubic-bezier(0.22, 1, 0.36, 1);
      padding: calc(env(safe-area-inset-top, 12px) + 8px) 16px calc(env(safe-area-inset-bottom, 16px) + 12px);
    }

    .history-modal.open {
      transform: translateY(0);
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 44px;
      margin-bottom: 16px;
    }

    .modal-title {
      font-size: 17px;
      font-weight: 700;
    }

    .history-grid {
      flex: 1;
      overflow-y: auto;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      align-content: start;
    }

    .history-item {
      position: relative;
      aspect-ratio: 1 / 1;
      border-radius: 16px;
      overflow: hidden;
      background-color: var(--surface-color);
      cursor: pointer;
    }

    .history-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .empty-history {
      grid-column: 1 / -1;
      text-align: center;
      color: var(--text-secondary);
      margin-top: 80px;
      font-size: 15px;
    }

    /* Detail Viewer Overlay */
    .detail-viewer {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.96);
      z-index: 60;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: calc(env(safe-area-inset-top, 12px) + 8px) 16px calc(env(safe-area-inset-bottom, 16px) + 16px);
    }

    .detail-viewer.active {
      display: flex;
    }

    .detail-card {
      position: relative;
      width: 100%;
      max-width: 440px;
      aspect-ratio: 1 / 1;
      border-radius: 40px;
      overflow: hidden;
      background: #141416;
    }

    .detail-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .detail-caption {
      position: absolute;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      padding: 6px 16px;
      border-radius: 999px;
      background: rgba(28, 28, 30, 0.8);
      backdrop-filter: blur(10px);
      color: #fff;
      font-size: 14px;
      font-weight: 500;
      max-width: 85%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .detail-actions {
      display: flex;
      gap: 16px;
    }

    .action-pill {
      padding: 12px 22px;
      border-radius: 999px;
      border: none;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-download {
      background-color: var(--accent-yellow);
      color: #000000;
    }

    .btn-delete {
      background-color: var(--surface-color);
      color: #ff453a;
    }

    #file-input, #capture-canvas {
      display: none;
    }
  </style>
</head>
<body>
  <div class="app-container">
    <!-- Top Bar -->
    <header class="top-bar">
      <button class="icon-circle-btn" id="profile-btn" aria-label="Hồ sơ">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
          <circle cx="12" cy="7" r="4"></circle>
        </svg>
      </button>

      <button class="friends-pill" id="friends-btn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
          <path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/>
        </svg>
        <span>Bạn bè</span>
      </button>

      <button class="icon-circle-btn" id="chat-btn" aria-label="Tin nhắn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path>
        </svg>
      </button>
    </header>

    <!-- Camera Viewfinder -->
    <main class="viewfinder-wrapper" id="viewfinder">
      <video id="camera-stream" autoplay playsinline muted></video>
      <img id="preview-image" alt="Ảnh xem trước" />
      <div class="flash-effect" id="flash-effect"></div>

      <button class="overlay-btn flash-btn" id="flash-btn" aria-label="Đèn flash">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
          <path d="M7 2v11h3v9l7-12h-4l4-8z"/>
        </svg>
      </button>

      <button class="overlay-btn zoom-btn" id="zoom-btn">1x</button>

      <div class="caption-input-wrap" id="caption-wrap">
        <input type="text" class="caption-input" id="caption-input" placeholder="Thêm tin nhắn..." maxlength="60" />
      </div>
    </main>

    <!-- Bottom Controls -->
    <footer class="controls-section">
      <div class="shutter-row">
        <!-- Left Button: Gallery or Cancel -->
        <button class="side-action-btn" id="left-btn" aria-label="Thư viện ảnh">
          <svg id="gallery-icon" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="4" ry="4"></rect>
            <circle cx="8.5" cy="8.5" r="1.5"></circle>
            <polyline points="21 15 16 10 5 21"></polyline>
          </svg>
          <svg id="cancel-icon" style="display: none;" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>

        <!-- Center Button: Shutter / Send -->
        <button class="shutter-outer" id="shutter-btn" aria-label="Chụp ảnh">
          <div class="shutter-inner" id="shutter-inner">
            <svg id="send-icon" style="display: none;" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="22" y1="2" x2="11" y2="13"></line>
              <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
            </svg>
          </div>
        </button>

        <!-- Right Button: Flip Camera or Download -->
        <button class="side-action-btn" id="right-btn" aria-label="Đổi camera">
          <svg id="flip-icon" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
            <path d="M3 3v5h5"></path>
            <path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"></path>
            <path d="M16 16h5v5"></path>
          </svg>
          <svg id="save-preview-icon" style="display: none;" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="7 10 12 15 17 10"></polyline>
            <line x1="12" y1="15" x2="12" y2="3"></line>
          </svg>
        </button>
      </div>

      <button class="history-trigger" id="history-btn">
        <span class="history-badge" id="history-count">0</span>
        <span>Lịch sử</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="6 9 12 15 18 9"></polyline>
        </svg>
      </button>
    </footer>
  </div>

  <!-- History Drawer -->
  <div class="history-modal" id="history-modal">
    <div class="modal-header">
      <button class="icon-circle-btn" id="close-history-btn" aria-label="Đóng">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="18 15 12 9 6 15"></polyline>
        </svg>
      </button>
      <span class="modal-title">Lịch sử ảnh</span>
      <div style="width: 42px;"></div>
    </div>
    <div class="history-grid" id="history-grid"></div>
  </div>

  <!-- Detail Image Viewer -->
  <div class="detail-viewer" id="detail-viewer">
    <div class="modal-header" style="width: 100%; max-width: 440px;">
      <button class="icon-circle-btn" id="close-detail-btn" aria-label="Đóng">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
      <span class="modal-title" id="detail-time">Chi tiết</span>
      <div style="width: 42px;"></div>
    </div>

    <div class="detail-card">
      <img id="detail-img" src="" alt="Chi tiết ảnh" />
      <div class="detail-caption" id="detail-caption" style="display: none;"></div>
    </div>

    <div class="detail-actions">
      <button class="action-pill btn-download" id="detail-download-btn">Tải xuống</button>
      <button class="action-pill btn-delete" id="detail-delete-btn">Xóa ảnh</button>
    </div>
  </div>

  <input type="file" id="file-input" accept="image/*" />
  <canvas id="capture-canvas"></canvas>

  <script>
    const video = document.getElementById('camera-stream');
    const previewImg = document.getElementById('preview-image');
    const canvas = document.getElementById('capture-canvas');
    const flashEffect = document.getElementById('flash-effect');

    const flashBtn = document.getElementById('flash-btn');
    const zoomBtn = document.getElementById('zoom-btn');
    const shutterBtn = document.getElementById('shutter-btn');
    const shutterInner = document.getElementById('shutter-inner');
    const leftBtn = document.getElementById('left-btn');
    const rightBtn = document.getElementById('right-btn');
    const fileInput = document.getElementById('file-input');

    const galleryIcon = document.getElementById('gallery-icon');
    const cancelIcon = document.getElementById('cancel-icon');
    const sendIcon = document.getElementById('send-icon');
    const flipIcon = document.getElementById('flip-icon');
    const savePreviewIcon = document.getElementById('save-preview-icon');

    const captionWrap = document.getElementById('caption-wrap');
    const captionInput = document.getElementById('caption-input');

    const historyBtn = document.getElementById('history-btn');
    const historyCount = document.getElementById('history-count');
    const historyModal = document.getElementById('history-modal');
    const closeHistoryBtn = document.getElementById('close-history-btn');
    const historyGrid = document.getElementById('history-grid');

    const detailViewer = document.getElementById('detail-viewer');
    const closeDetailBtn = document.getElementById('close-detail-btn');
    const detailImg = document.getElementById('detail-img');
    const detailCaption = document.getElementById('detail-caption');
    const detailTime = document.getElementById('detail-time');
    const detailDownloadBtn = document.getElementById('detail-download-btn');
    const detailDeleteBtn = document.getElementById('detail-delete-btn');

    let currentStream = null;
    let facingMode = 'environment';
    let flashEnabled = false;
    let zoomLevel = 1;
    let isPreviewMode = false;
    let capturedDataUrl = null;
    let selectedPhotoId = null;

    const STORAGE_KEY = 'locket_clone_history_v1';

    function getHistory() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
      } catch {
        return [];
      }
    }

    function saveHistory(items) {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
      } catch (e) {
        if (items.length > 1) {
          items.pop();
          saveHistory(items);
        }
      }
      updateHistoryUI();
    }

    function updateHistoryUI() {
      const items = getHistory();
      historyCount.textContent = items.length;
      historyGrid.innerHTML = '';

      if (items.length === 0) {
        historyGrid.innerHTML = '<div class="empty-history">Chưa có ảnh nào trong lịch sử</div>';
        return;
      }

      items.forEach((item) => {
        const div = document.createElement('div');
        div.className = 'history-item';
        const img = document.createElement('img');
        img.src = item.image;
        img.loading = 'lazy';
        div.appendChild(img);
        div.addEventListener('click', () => openDetail(item));
        historyGrid.appendChild(div);
      });
    }

    async function startCamera() {
      if (currentStream) {
        currentStream.getTracks().forEach((track) => track.stop());
      }

      try {
        const constraints = {
          audio: false,
          video: {
            facingMode: facingMode,
            width: { ideal: 1080 },
            height: { ideal: 1080 }
          }
        };

        currentStream = await navigator.mediaDevices.getUserMedia(constraints);
        video.srcObject = currentStream;

        if (facingMode === 'user') {
          video.classList.add('mirrored');
        } else {
          video.classList.remove('mirrored');
        }

        applyZoom();
        applyTorch();
      } catch (err) {
        console.warn('Không thể mở camera:', err);
      }
    }

    function applyZoom() {
      video.style.transform = `${facingMode === 'user' ? 'scaleX(-1)' : ''} scale(${zoomLevel})`;
    }

    async function applyTorch() {
      if (!currentStream) return;
      const track = currentStream.getVideoTracks()[0];
      if (!track || !track.getCapabilities) return;
      const caps = track.getCapabilities();
      if (caps.torch) {
        try {
          await track.applyConstraints({ advanced: [{ torch: flashEnabled }] });
        } catch (e) {
          console.warn('Torch không hỗ trợ:', e);
        }
      }
    }

    flashBtn.addEventListener('click', () => {
      flashEnabled = !flashEnabled;
      flashBtn.classList.toggle('active', flashEnabled);
      applyTorch();
    });

    zoomBtn.addEventListener('click', () => {
      zoomLevel = zoomLevel === 1 ? 2 : 1;
      zoomBtn.textContent = `${zoomLevel}x`;
      applyZoom();
    });

    function enterPreviewMode(dataUrl) {
      isPreviewMode = true;
      capturedDataUrl = dataUrl;

      video.style.display = 'none';
      previewImg.src = dataUrl;
      previewImg.style.display = 'block';

      flashBtn.style.display = 'none';
      zoomBtn.style.display = 'none';
      captionWrap.style.display = 'flex';
      captionInput.value = '';

      galleryIcon.style.display = 'none';
      cancelIcon.style.display = 'block';

      flipIcon.style.display = 'none';
      savePreviewIcon.style.display = 'block';

      shutterInner.classList.add('send-mode');
      sendIcon.style.display = 'block';
    }

    function exitPreviewMode() {
      isPreviewMode = false;
      capturedDataUrl = null;

      previewImg.style.display = 'none';
      previewImg.src = '';
      video.style.display = 'block';

      flashBtn.style.display = 'flex';
      zoomBtn.style.display = 'flex';
      captionWrap.style.display = 'none';

      cancelIcon.style.display = 'none';
      galleryIcon.style.display = 'block';

      savePreviewIcon.style.display = 'none';
      flipIcon.style.display = 'block';

      shutterInner.classList.remove('send-mode');
      sendIcon.style.display = 'none';
    }

    function capturePhoto() {
      if (flashEnabled) {
        flashEffect.style.opacity = '0.9';
        setTimeout(() => {
          flashEffect.style.opacity = '0';
        }, 180);
      }

      const size = 1080;
      canvas.width = size;
      canvas.height = size;
      const ctx = canvas.getContext('2d');

      const vw = video.videoWidth || size;
      const vh = video.videoHeight || size;
      const minDim = Math.min(vw, vh) / zoomLevel;
      const sx = (vw - minDim) / 2;
      const sy = (vh - minDim) / 2;

      ctx.save();
      if (facingMode === 'user') {
        ctx.translate(size, 0);
        ctx.scale(-1, 1);
      }
      ctx.drawImage(video, sx, sy, minDim, minDim, 0, 0, size, size);
      ctx.restore();

      const dataUrl = canvas.toDataURL('image/jpeg', 0.88);
      enterPreviewMode(dataUrl);
    }

    function saveCurrentPhoto() {
      if (!capturedDataUrl) return;
      const items = getHistory();
      const newItem = {
        id: Date.now(),
        image: capturedDataUrl,
        caption: captionInput.value.trim(),
        timestamp: new Date().toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' })
      };
      items.unshift(newItem);
      saveHistory(items);
      exitPreviewMode();
    }

    function downloadDataUrl(dataUrl, filename) {
      const a = document.createElement('a');
      a.href = dataUrl;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }

    shutterBtn.addEventListener('click', () => {
      if (!isPreviewMode) {
        capturePhoto();
      } else {
        saveCurrentPhoto();
      }
    });

    leftBtn.addEventListener('click', () => {
      if (!isPreviewMode) {
        fileInput.click();
      } else {
        exitPreviewMode();
      }
    });

    rightBtn.addEventListener('click', () => {
      if (!isPreviewMode) {
        facingMode = facingMode === 'environment' ? 'user' : 'environment';
        zoomLevel = 1;
        zoomBtn.textContent = '1x';
        startCamera();
      } else if (capturedDataUrl) {
        downloadDataUrl(capturedDataUrl, `locket_${Date.now()}.jpg`);
      }
    });

    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (event) => {
        const img = new Image();
        img.onload = () => {
          const size = 1080;
          canvas.width = size;
          canvas.height = size;
          const ctx = canvas.getContext('2d');
          const minDim = Math.min(img.width, img.height);
          const sx = (img.width - minDim) / 2;
          const sy = (img.height - minDim) / 2;
          ctx.drawImage(img, sx, sy, minDim, minDim, 0, 0, size, size);
          enterPreviewMode(canvas.toDataURL('image/jpeg', 0.88));
        };
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
      fileInput.value = '';
    });

    historyBtn.addEventListener('click', () => {
      updateHistoryUI();
      historyModal.classList.add('open');
    });

    closeHistoryBtn.addEventListener('click', () => {
      historyModal.classList.remove('open');
    });

    function openDetail(item) {
      selectedPhotoId = item.id;
      detailImg.src = item.image;
      detailTime.textContent = item.timestamp || 'Ảnh đã lưu';
      if (item.caption) {
        detailCaption.textContent = item.caption;
        detailCaption.style.display = 'block';
      } else {
        detailCaption.style.display = 'none';
      }
      detailViewer.classList.add('active');
    }

    closeDetailBtn.addEventListener('click', () => {
      detailViewer.classList.remove('active');
      selectedPhotoId = null;
    });

    detailDownloadBtn.addEventListener('click', () => {
      if (detailImg.src) {
        downloadDataUrl(detailImg.src, `locket_${selectedPhotoId || Date.now()}.jpg`);
      }
    });

    detailDeleteBtn.addEventListener('click', () => {
      if (!selectedPhotoId) return;
      const items = getHistory().filter((item) => item.id !== selectedPhotoId);
      saveHistory(items);
      detailViewer.classList.remove('active');
      selectedPhotoId = null;
    });

    updateHistoryUI();
    startCamera();
  </script>
</body>
</html>
