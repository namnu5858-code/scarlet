<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messenger App</title>
    <!-- Thư viện tạo mã QR -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <!-- Thư viện đọc mã QR từ ảnh (jsQR) -->
    <script src="https://cdn.jsdelivr.net/npm/jsQR@1.4.0/dist/jsQR.js"></script>
    
    <style>
        :root {
            --bg-body: #000000;
            --bg-app: #000000;
            --bg-card: #1c1d1e;
            --bg-hover: #1a1a1a;
            --bg-search: #262626;
            --bg-header: #121212;
            --bg-bubble-left: #262626;
            --text-main: #ffffff;
            --text-sub: #8c939d;
            --icon-stroke: #ffffff;
            --border-color: #262626;
            --qr-card-bg: rgba(255, 255, 255, 0.06);
            --qr-card-border: rgba(255, 255, 255, 0.12);
            --qr-box-bg: #ffffff;
            --qr-dark-color: #000000;
            --qr-light-color: #ffffff;
        }

        @media (prefers-color-scheme: light) {
            :root {
                --bg-body: #ffffff;
                --bg-app: #ffffff;
                --bg-card: #f0f2f5;
                --bg-hover: #f5f5f5;
                --bg-search: #f0f2f5;
                --bg-header: #ffffff;
                --bg-bubble-left: #f0f2f5;
                --text-main: #050505;
                --text-sub: #65676b;
                --icon-stroke: #050505;
                --border-color: #e4e6eb;
                --qr-card-bg: rgba(0, 0, 0, 0.04);
                --qr-card-border: rgba(0, 0, 0, 0.08);
                --qr-box-bg: #ffffff;
                --qr-dark-color: #000000;
                --qr-light-color: #ffffff;
            }
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
        }

        body, html {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background-color: var(--bg-body);
        }

        .app-container {
            width: 100%;
            height: 100%;
            max-width: 480px;
            max-height: 900px;
            background: var(--bg-app);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        @media (max-width: 480px) {
            .app-container {
                width: 100vw;
                height: 100vh;
                max-width: none;
                max-height: none;
                border-radius: 0;
            }
        }

        .svg-icon {
            width: 24px;
            height: 24px;
            fill: none;
            stroke: var(--icon-stroke);
            stroke-width: 2.2;
            stroke-linecap: round;
            stroke-linejoin: round;
            display: inline-block;
            vertical-align: middle;
        }

        /* 1. Splash */
        .splash-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: var(--bg-app);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 99;
            transition: opacity 0.6s cubic-bezier(0.4, 0, 0.2, 1), filter 0.6s ease;
        }

        .splash-screen.fade-out {
            opacity: 0;
            filter: blur(8px);
            pointer-events: none;
        }

        .splash-logo {
            width: 140px;
            height: 140px;
            object-fit: contain;
            opacity: 0;
            transform: scale(0.85);
            animation: messengerSplash 0.8s cubic-bezier(0.215, 0.61, 0.355, 1) forwards;
        }

        .footer-text {
            position: absolute;
            bottom: 40px;
            font-weight: 900;
            color: var(--text-main);
            font-size: 16px;
            text-transform: lowercase;
            letter-spacing: 0.5px;
        }

        @keyframes messengerSplash {
            0% { opacity: 0; transform: scale(0.85); }
            100% { opacity: 1; transform: scale(1); }
        }

        /* 2. Chat List */
        .messenger-container {
            display: none;
            flex-direction: column;
            height: 100%; width: 100%;
            background-color: var(--bg-app);
            color: var(--text-main);
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        .messenger-container.visible { opacity: 1; }
