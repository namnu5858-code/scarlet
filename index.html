<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>WebRTC Call</title>
</head>
<body>
    <h1>Cuộc gọi WebRTC</h1>
    <video id="localVideo" autoplay playsinline muted style="width: 45%;"></video>
    <video id="remoteVideo" autoplay playsinline style="width: 45%;"></video>

    <script>
        const configuration = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };
        const peerConnection = new RTCPeerConnection(configuration);

        let localStream;

        async function startCall() {
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                document.getElementById('localVideo').srcObject = localStream;
                localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));
            } catch (error) {
                console.error('Không thể truy cập camera hoặc microphone.', error);
            }
        }

        peerConnection.ontrack = event => {
            document.getElementById('remoteVideo').srcObject = event.streams[0];
        };

        startCall();
    </script>
</body>
</html>
