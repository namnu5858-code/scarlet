<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Interface</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .chat-container {
            width: 360px;
            background-color: #1e1e1e;
            border-radius: 12px;
            padding: 16px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
        }

        .chat-box {
            height: 300px;
            overflow-y: auto;
            border-bottom: 1px solid #333;
            margin-bottom: 12px;
            padding-right: 8px;
        }

        .message {
            margin-bottom: 10px;
            font-size: 14px;
            line-height: 1.4;
            color: #ffffff;
        }

        /* Chữ Nam 7 màu */
        .nam-rainbow {
            background: linear-gradient(45deg, #ff0000, #ff7f00, #ffff00, #00ff00, #0000ff, #4b0082, #9400d3);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: bold;
        }

        /* Dấu hai chấm không nhảy, cố định màu trắng */
        .colon-static {
            color: #ffffff;
            font-weight: normal;
            margin-right: 6px;
        }

        .input-container {
            display: flex;
            gap: 8px;
        }

        input[type="text"] {
            flex: 1;
            padding: 10px;
            border-radius: 20px;
            border: 1px solid #444;
            background-color: #2a2a2a;
            color: #fff;
            outline: none;
        }

        button {
            padding: 10px 16px;
            border: none;
            border-radius: 20px;
            background-color: #0084ff;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background-color: #006bce;
        }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="chat-box" id="chatBox">
        <div class="message">
            <span class="nam-rainbow">[Nam]</span><span class="colon-static">:</span>Chào bạn!
        </div>
    </div>
    
    <div class="input-container">
        <input type="text" id="chatInput" placeholder="Nhập tin nhắn (T: Bật, A: Tiếp tục, S: Tắt)...">
        <button id="sendBtn">Gửi</button>
    </div>
</div>

<audio id="bgAudio" loop preload="auto">
    <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
</audio>

<script>
    const chatInput = document.getElementById('chatInput');
    const sendBtn = document.getElementById('sendBtn');
    const chatBox = document.getElementById('chatBox');
    const bgAudio = document.getElementById('bgAudio');

    chatInput.addEventListener('keydown', (e) => {
        const key = e.key.toLowerCase();

        if (key === 't') {
            bgAudio.play().catch(err => console.log('Chờ tương tác để phát nhạc: ', err));
        } else if (key === 'a') {
            bgAudio.play().catch(err => console.log('Chờ tương tác để phát nhạc: ', err));
        } else if (key === 's') {
            bgAudio.pause();
        }

        if (e.key === 'Enter') {
            sendMessage();
        }
    });

    sendBtn.addEventListener('click', sendMessage);

    function sendMessage() {
        const text = chatInput.value.trim();
        if (text !== '') {
            const msgDiv = document.createElement('div');
            msgDiv.className = 'message';
            msgDiv.innerHTML = `<span class="nam-rainbow">[Nam]</span><span class="colon-static">:</span>${text}`;
            chatBox.appendChild(msgDiv);
            chatInput.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    }
</script>

</body>
</html>
