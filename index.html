<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DuckDuckGo Virtual Display</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }
        body {
            background-color: #1c1d21;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        /* Khung màn hình 16:9 */
        .screen-container {
            width: 90vw;
            max-width: 1280px;
            aspect-ratio: 16 / 9;
            background-color: #25262c;
            border-radius: 12px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            border: 1px solid #383942;
        }
        .ddg-logo {
            width: 120px;
            height: 120px;
            margin-bottom: 24px;
        }
        .search-box {
            position: relative;
            width: 60%;
            max-width: 600px;
        }
        .search-input {
            width: 100%;
            padding: 16px 20px 16px 52px;
            font-size: 18px;
            color: #ffffff;
            background-color: #383942;
            border: 2px solid transparent;
            border-radius: 30px;
            outline: none;
            transition: all 0.2s ease;
            user-select: text;
        }
        .search-input:focus {
            border-color: #de5833;
            background-color: #41424d;
        }
        .search-icon {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            width: 20px;
            height: 20px;
            fill: #9e9ea7;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div class="screen-container" id="virtualScreen">
        <!-- DuckDuckGo Logo SVG -->
        <svg class="ddg-logo" viewBox="0 0 112 112" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="56" cy="56" r="56" fill="#DE5833"/>
            <path d="M56 16C33.9 16 16 33.9 16 56s17.9 40 40 40 40-17.9 40-40S78.1 16 56 16zm18 58c-3 3-9 5-18 5-14 0-22-8-22-20 0-11 8-19 20-19 8 0 14 3 17 6l-5 6c-3-2-7-4-12-4-8 0-13 5-13 12s5 13 14 13c5 0 8-1 11-3l3 4z" fill="#FFF"/>
        </svg>

        <!-- Search Bar -->
        <div class="search-box">
            <svg class="search-icon" viewBox="0 0 24 24">
                <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
            </svg>
            <input type="text" class="search-input" id="searchInput" placeholder="Tìm kiếm trên web không bị theo dõi..." readonly />
        </div>
    </div>

    <script>
        const searchInput = document.getElementById('searchInput');
        const virtualScreen = document.getElementById('virtualScreen');

        let isDragging = false;
        let startX = 0, startY = 0;

        // Chống kích hoạt bàn phím khi vuốt, cuộn, zoom
        virtualScreen.addEventListener('touchstart', (e) => {
            if (e.touches.length > 1) return; // Bỏ qua nếu dùng nhiều ngón tay (zoom/pinch)
            isDragging = false;
            startX = e.touches[0].clientX;
            startY = e.touches[0].clientY;
        }, { passive: true });

        virtualScreen.addEventListener('touchmove', (e) => {
            const moveX = Math.abs(e.touches[0].clientX - startX);
            const moveY = Math.abs(e.touches[0].clientY - startY);
            if (moveX > 8 || moveY > 8) {
                isDragging = true; // Xác định là hành động vuốt/kéo
            }
        }, { passive: true });

        // Chỉ bật bàn phím khi chạm đúng vào khung tìm kiếm và không phải là vuốt màn hình
        searchInput.addEventListener('touchend', (e) => {
            if (!isDragging) {
                searchInput.removeAttribute('readonly');
                searchInput.focus();
            }
            e.stopPropagation();
        });

        // Bỏ focus & vô hiệu bàn phím khi chạm ra ngoài khung tìm kiếm
        document.addEventListener('touchend', (e) => {
            if (e.target !== searchInput) {
                searchInput.setAttribute('readonly', 'readonly');
                searchInput.blur();
            }
        });
    </script>
</body>
</html>
