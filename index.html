<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TikTok Note Concept</title>
  <style>
    :root {
      --bg-color: #000000;
      --card-bg: #1c1c1e;
      --bubble-bg: #ffffff;
      --bubble-text: #000000;
      --sub-text: #8e8e93;
      --accent: #25f4ee;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: #fff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Container mô phỏng màn hình ứng dụng */
    .app-screen {
      width: 100%;
      max-width: 390px;
      height: 100vh;
      max-height: 844px;
      background: var(--bg-color);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    /* Thẻ ghi chú người dùng */
    .note-profile-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      position: relative;
    }

    /* Bong bóng suy nghĩ bo tròn TikTok */
    .thought-bubble {
      position: relative;
      background: var(--bubble-bg);
      color: var(--bubble-text);
      padding: 10px 18px;
      border-radius: 24px;
      font-size: 14px;
      font-weight: 500;
      max-width: 160px;
      text-align: center;
      margin-bottom: 14px;
      box-shadow: 0 8px 20px rgba(255, 255, 255, 0.12);
      word-break: break-word;
      animation: float 3s ease-in-out infinite;
    }

    /* Chân bong bóng dạng hai chấm bo tròn */
    .thought-bubble::before,
    .thought-bubble::after {
      content: '';
      position: absolute;
      background: var(--bubble-bg);
      border-radius: 50%;
    }

    .thought-bubble::before {
      width: 10px;
      height: 10px;
      bottom: -6px;
      left: 50%;
      transform: translateX(-50%);
    }

    .thought-bubble::after {
      width: 5px;
      height: 5px;
      bottom: -13px;
      left: 50%;
      transform: translateX(-50%);
    }

    /* Khung Avatar */
    .avatar-container {
      position: relative;
      width: 86px;
      height: 86px;
    }

    .avatar-img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      background: #333;
    }

    .add-icon-badge {
      position: absolute;
      bottom: 2px;
      right: 2px;
      width: 26px;
      height: 26px;
      background: #ffffff;
      color: #000;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: bold;
      border: 3px solid var(--bg-color);
      box-shadow: 0 2px 5px rgba(0,0,0,0.5);
    }

    /* Bảng nhập tin nhắn (Bottom Sheet Bo Tròn) */
    .bottom-sheet-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: flex-end;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
      z-index: 10;
    }

    .bottom-sheet-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .bottom-sheet-content {
      width: 100%;
      background: var(--card-bg);
      border-top-left-radius: 28px;
      border-top-right-radius: 28px;
      padding: 24px 20px 34px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      transform: translateY(100%);
      transition: transform 0.3s cubic-bezier(0.1, 1, 0.1, 1);
    }

    .bottom-sheet-overlay.active .bottom-sheet-content {
      transform: translateY(0);
    }

    .sheet-handle {
      width: 36px;
      height: 4px;
      background: #48484a;
      border-radius: 2px;
      margin-bottom: 20px;
    }

    .sheet-title {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 16px;
      color: #fff;
    }

    .input-box {
      width: 100%;
      background: #2c2c2e;
      border: none;
      border-radius: 20px;
      padding: 14px 18px;
      color: #fff;
      font-size: 15px;
      outline: none;
      margin-bottom: 20px;
      text-align: center;
    }

    .input-box::placeholder {
      color: var(--sub-text);
    }

    .btn-submit {
      width: 100%;
      background: #ffffff;
      color: #000000;
      border: none;
      border-radius: 22px;
      padding: 14px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }
  </style>
</head>
<body>

  <div class="app-screen">
    <div class="note-profile-card" onclick="openSheet()">
      <div class="thought-bubble" id="bubbleDisplay">
        Bạn có chuyện gì?
      </div>
      <div class="avatar-container">
        <img src="https://i.pravatar.cc/150?img=68" alt="Avatar" class="avatar-img">
        <div class="add-icon-badge" id="badgeStatus">+</div>
      </div>
    </div>

    <!-- Bottom Sheet Nhập Liệu -->
    <div class="bottom-sheet-overlay" id="sheetOverlay" onclick="closeSheet(event)">
      <div class="bottom-sheet-content">
        <div class="sheet-handle"></div>
        <div class="sheet-title">Tạo ghi chú trạng thái</div>
        <input type="text" id="noteInputField" class="input-box" placeholder="Bạn có chuyện gì?" maxlength="60" autocomplete="off" />
        <button class="btn-submit" onclick="saveNoteData()">Chia sẻ</button>
      </div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'tiktok_style_note';

    document.addEventListener('DOMContentLoaded', updateUI);

    function updateUI() {
      const savedText = localStorage.getItem(STORAGE_KEY);
      const bubble = document.getElementById('bubbleDisplay');
      const badge = document.getElementById('badgeStatus');

      if (savedText && savedText.trim() !== '') {
        bubble.innerText = savedText;
        badge.innerText = '✓';
      } else {
        bubble.innerText = 'Bạn có chuyện gì?';
        badge.innerText = '+';
      }
    }

    function openSheet() {
      const currentText = localStorage.getItem(STORAGE_KEY) || '';
      document.getElementById('noteInputField').value = currentText;
      document.getElementById('sheetOverlay').classList.add('active');
    }

    function closeSheet(event) {
      if (!event || event.target.classList.contains('bottom-sheet-overlay')) {
        document.getElementById('sheetOverlay').classList.remove('active');
      }
    }

    function saveNoteData() {
      const inputVal = document.getElementById('noteInputField').value.trim();
      if (inputVal) {
        localStorage.setItem(STORAGE_KEY, inputVal);
      } else {
        localStorage.removeItem(STORAGE_KEY);
      }
      updateUI();
      closeSheet();
    }
  </script>
</body>
</html>
