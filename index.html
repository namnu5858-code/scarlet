<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Garden World 3D</title>

<style>
*{
    box-sizing:border-box;
    user-select:none;
    -webkit-user-select:none;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#111;
    touch-action:none;
    font-family:Arial,Helvetica,sans-serif;
}

canvas{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
}

#portrait{
    position:fixed;
    inset:0;
    z-index:9999;
    display:none;
    align-items:center;
    justify-content:center;
    text-align:center;
    color:white;
    background:#10151b;
    padding:30px;
}

#portrait div{
    max-width:330px;
}

#portrait .phone{
    font-size:55px;
    margin-bottom:15px;
}

#hud{
    position:fixed;
    inset:0;
    z-index:20;
    pointer-events:none;
    color:white;
}

#top{
    position:absolute;
    top:14px;
    left:16px;
    right:16px;
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
}

.panel{
    background:rgba(12,18,23,.72);
    border:1px solid rgba(255,255,255,.16);
    border-radius:15px;
    box-shadow:0 8px 25px rgba(0,0,0,.25);
    backdrop-filter:blur(10px);
}

#hp{
    width:225px;
    padding:10px 12px;
}

#hpTitle{
    display:flex;
    justify-content:space-between;
    font-size:12px;
    font-weight:bold;
    margin-bottom:7px;
}

#hpNumber{
    font-size:12px;
}

#hpBar{
    width:100%;
    height:13px;
    overflow:hidden;
    border-radius:20px;
    background:#252525;
}

#hpFill{
    width:100%;
    height:100%;
    background:#e33232;
    border-radius:20px;
    transition:width .15s;
}

#wave{
    padding:9px 20px;
    text-align:center;
}

#wave small{
    display:block;
    font-size:9px;
    letter-spacing:2px;
    opacity:.7;
}

#waveNumber{
    font-size:18px;
    font-weight:900;
}

#zombies{
    padding:9px 16px;
    text-align:center;
}

#zombies small{
    display:block;
    font-size:9px;
    letter-spacing:1px;
    opacity:.7;
}

#zombieNumber{
    font-size:18px;
    font-weight:900;
}

#crosshair{
    position:absolute;
    left:50%;
    top:50%;
    width:22px;
    height:22px;
    transform:translate(-50%,-50%);
    opacity:.6;
}

#crosshair:before,
#crosshair:after{
    content:"";
    position:absolute;
    background:white;
}

#crosshair:before{
    width:22px;
    height:2px;
    top:10px;
}

#crosshair:after{
    height:22px;
    width:2px;
    left:10px;
}

#joystick{
    position:absolute;
    left:22px;
    bottom:22px;
    width:145px;
    height:145px;
    pointer-events:auto;
}

#joyBase{
    position:absolute;
    left:50%;
    top:50%;
    width:125px;
    height:125px;
    transform:translate(-50%,-50%);
    border-radius:50%;
    background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.2);
    box-shadow:inset 0 0 25px rgba(0,0,0,.3);
}

#joyRing{
    position:absolute;
    inset:18px;
    border-radius:50%;
    border:1px solid rgba(255,255,255,.12);
}

#joyStick{
    position:absolute;
    width:58px;
    height:58px;
    left:50%;
    top:50%;
    margin:-29px;
    border-radius:50%;
    background:linear-gradient(145deg,rgba(255,255,255,.45),rgba(255,255,255,.12));
    border:1px solid rgba(255,255,255,.3);
    box-shadow:0 8px 20px rgba(0,0,0,.35);
}

#actions{
    position:absolute;
    right:20px;
    bottom:18px;
    width:320px;
    height:205px;
    pointer-events:none;
}

.button{
    position:absolute;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:50%;
    color:white;
    background:rgba(15,22,28,.72);
    border:1px solid rgba(255,255,255,.22);
    box-shadow:0 8px 22px rgba(0,0,0,.3),inset 0 1px rgba(255,255,255,.15);
    backdrop-filter:blur(9px);
    pointer-events:auto;
    transition:transform .08s;
}

.button:active{
    transform:scale(.9);
}

#fire{
    width:92px;
    height:92px;
    right:0;
    bottom:12px;
    background:radial-gradient(circle at 35% 30%,#ff7962,#cf3030);
}

#fireIcon{
    font-size:32px;
}

#jump{
    width:68px;
    height:68px;
    right:105px;
    bottom:10px;
    font-size:31px;
}

.skill{
    width:62px;
    height:62px;
    font-size:25px;
}

#skill1{
    right:177px;
    bottom:112px;
}

#skill2{
    right:108px;
    bottom:117px;
}

#skill3{
    right:40px;
    bottom:112px;
}

.cooldown{
    position:absolute;
    inset:0;
    border-radius:50%;
    background:rgba(0,0,0,.55);
    display:none;
    align-items:center;
    justify-content:center;
    font-size:16px;
    font-weight:bold;
}

.cooling .cooldown{
    display:flex;
}

#start,
#gameover{
    position:fixed;
    inset:0;
    z-index:500;
    display:flex;
    align-items:center;
    justify-content:center;
    background:radial-gradient(circle,rgba(40,80,65,.25),rgba(5,10,14,.94));
}

#gameover{
    display:none;
}

.modal{
    width:min(470px,82vw);
    padding:34px;
    text-align:center;
    color:white;
    border-radius:25px;
    background:rgba(14,21,27,.83);
    border:1px solid rgba(255,255,255,.16);
    box-shadow:0 25px 70px rgba(0,0,0,.5);
    backdrop-filter:blur(18px);
}

.modal h1{
    margin:0;
    font-size:clamp(28px,5vw,46px);
}

.modal p{
    color:rgba(255,255,255,.65);
}

.startButton{
    width:100%;
    height:58px;
    margin-top:22px;
    border:0;
    border-radius:16px;
    background:linear-gradient(135deg,#48d575,#239d58);
    color:white;
    font-size:16px;
    font-weight:900;
}

@media(orientation:portrait){
    #portrait{
        display:flex;
    }

    #hud,
    #start,
    #gameover{
        display:none;
    }
}

@media(max-height:430px){
    #top{
        top:7px;
    }

    #hp{
        width:185px;
        padding:7px 9px;
    }

    #joystick{
        transform:scale(.82);
        transform-origin:left bottom;
    }

    #actions{
        transform:scale(.82);
        transform-origin:right bottom;
    }
}
</style>
</head>

<body>

<div id="portrait">
    <div>
        <div class="phone">📱↔️</div>
        <h2>Hãy xoay ngang điện thoại</h2>
        <p>Game được thiết kế để chơi ở màn hình ngang.</p>
    </div>
</div>

<div id="start">
    <div class="modal">
        <h1>GARDEN WORLD</h1>
        <p>3D • KHU VƯỜN • THỜI TIẾT • NGÀY & ĐÊM</p>
        <button class="startButton" id="startButton">▶ BẮT ĐẦU</button>
    </div>
</div>

<div id="gameover">
    <div class="modal">
        <h1>GAME OVER</h1>
        <p>Khu vực đã bị chiếm.</p>
        <button class="startButton" id="restart">CHƠI LẠI</button>
    </div>
</div>

<div id="hud">

    <div id="top">

        <div class="panel" id="hp">
            <div id="hpTitle">
                <span>HP</span>
                <span id="hpNumber">100 / 100</span>
            </div>
            <div id="hpBar">
                <div id="hpFill"></div>
            </div>
        </div>

        <div class="panel" id="wave">
            <small>WAVE</small>
            <div id="waveNumber">1</div>
        </div>

        <div class="panel" id="zombies">
            <small>ZOMBIES</small>
            <div id="zombieNumber">0</div>
        </div>

    </div>

    <div id="crosshair"></div>

    <div id="joystick">
        <div id="joyBase">
            <div id="joyRing"></div>
            <div id="joyStick"></div>
        </div>
    </div>

    <div id="actions">

        <div class="button skill" id="skill1">
            ✦
            <div class="cooldown">0</div>
        </div>

        <div class="button skill" id="skill2">
            ◇
            <div class="cooldown">0</div>
        </div>

        <div class="button skill" id="skill3">
            ✺
            <div class="cooldown">0</div>
        </div>

        <div class="button" id="jump">↥</div>

        <div class="button" id="fire">
            <span id="fireIcon">●</span>
        </div>

    </div>

</div>

<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";

/* =========================================================
   SCENE
========================================================= */

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x79b9e5);

scene.fog = new THREE.Fog(
    0x79b9e5,
    45,
    125
);

const camera = new THREE.PerspectiveCamera(
    65,
    innerWidth/innerHeight,
    .1,
    180
);

const renderer = new THREE.WebGLRenderer({
    antialias:true,
    powerPreference:"high-performance"
});

renderer.setPixelRatio(
    Math.min(devicePixelRatio,1.5)
);

renderer.setSize(
    innerWidth,
    innerHeight
);

renderer.shadowMap.enabled=true;

document.body.appendChild(renderer.domElement);

/* =========================================================
   LIGHTING
========================================================= */

const hemi = new THREE.HemisphereLight(
    0xffffff,
    0x52654b,
    1.8
);

scene.add(hemi);

const sunLight = new THREE.DirectionalLight(
    0xffffff,
    2.2
);

sunLight.position.set(
    35,55,20
);

sunLight.castShadow=true;

scene.add(sunLight);

/* =========================================================
   MATERIAL HELPERS
========================================================= */

function mat(color,extra={}){
    return new THREE.MeshStandardMaterial({
        color,
        roughness:.82,
        metalness:.05,
        ...extra
    });
}

/* =========================================================
   TERRAIN
========================================================= */

const terrain = new THREE.Mesh(
    new THREE.PlaneGeometry(
        150,
        150,
        30,
        30
    ),
    mat(0x5da84c)
);

terrain.rotation.x=-Math.PI/2;
terrain.receiveShadow=true;

scene.add(terrain);

/* =========================================================
   ROAD SYSTEM
========================================================= */

function road(
    x,z,
    width,length,
    rotation=0
){

    const r = new THREE.Mesh(
        new THREE.PlaneGeometry(
            width,
            length
        ),
        mat(0x565656)
    );

    r.rotation.x=-Math.PI/2;
    r.rotation.z=rotation;
    r.position.set(x,.012,z);
    r.receiveShadow=true;

    scene.add(r);

    return r;
}

/* đường chính */

road(
    0,
    0,
    9,
    145,
    0
);

/* đường phía trên */

road(
    24,
    0,
    6,
    100,
    Math.PI/2
);

/* đường dưới */

road(
    -25,
    0,
    5,
    95,
    Math.PI/2
);

/* đường nhỏ */

road(
    12,
    22,
    4,
    55,
    .15
);

road(
    -12,
    -24,
    4,
    50,
    -.12
);

/* =========================================================
   ROAD MARKINGS
========================================================= */

function roadLine(x,z,w,l,rot=0){

    const line = new THREE.Mesh(
        new THREE.PlaneGeometry(w,l),
        mat(0xc7c7a0)
    );

    line.rotation.x=-Math.PI/2;
    line.rotation.z=rot;
    line.position.set(x,.025,z);

    scene.add(line);
}

for(let z=-65;z<65;z+=8){
    roadLine(
        0,
        z,
        .22,
        4
    );
}

/* =========================================================
   TREES
========================================================= */

function tree(x,z,scale=1){

    const group=new THREE.Group();

    const trunk=new THREE.Mesh(
        new THREE.CylinderGeometry(
            .18*scale,
            .25*scale,
            2*scale,
            8
        ),
        mat(0x704b2c)
    );

    trunk.position.y=scale;

    group.add(trunk);

    const crown=new THREE.Mesh(
        new THREE.SphereGeometry(
            1.2*scale,
            10,
            8
        ),
        mat(0x2f8f43)
    );

    crown.position.y=2.25*scale;

    group.add(crown);

    group.position.set(x,0,z);

    group.traverse(o=>{
        if(o.isMesh)o.castShadow=true;
    });

    scene.add(group);
}

for(let i=0;i<35;i++){

    const x=(Math.random()-.5)*130;
    const z=(Math.random()-.5)*130;

    if(
        Math.abs(x)<18 &&
        Math.abs(z)<18
    ) continue;

    tree(
        x,z,
        .8+Math.random()*.8
    );
}

/* =========================================================
   SCHOOL COMPLEX
========================================================= */

function building(
    x,z,
    width,
    depth,
    floors,
    color
){

    const group=new THREE.Group();

    const floorHeight=2.7;

    for(
        let i=0;
        i<floors;
        i++
    ){

        const b=new THREE.Mesh(
            new THREE.BoxGeometry(
                width,
                floorHeight,
                depth
            ),
            mat(color)
        );

        b.position.y=
            floorHeight/2+
            i*floorHeight;

        b.castShadow=true;
        b.receiveShadow=true;

        group.add(b);

        /* cửa sổ */

        const windowColor=0x75b8d8;

        for(
            let wx=-width/2+1;
            wx<width/2;
            wx+=2.2
        ){

            const win=new THREE.Mesh(
                new THREE.BoxGeometry(
                    .9,
                    1.25,
                    .08
                ),
                mat(windowColor,{
                    roughness:.3,
                    metalness:.1
                })
            );

            win.position.set(
                wx,
                b.position.y,
                depth/2+.05
            );

            group.add(win);
        }
    }

    group.position.set(x,0,z);

    scene.add(group);

    return group;
}

/* tòa nhà trường 5 tầng */

const schoolA=building(
    -8,
    11,
    18,
    9,
    5,
    0xe8f2f4
);

/* tòa B */

const schoolB=building(
    11,
    13,
    13,
    8,
    5,
    0xdfeff3
);

/* =========================================================
   GREEN STAIRCASE OF BUILDING B
========================================================= */

function staircase(
    x,z,
    width,
    steps,
    height
){

    const group=new THREE.Group();

    for(
        let i=0;
        i<steps;
        i++
    ){

        const step=new THREE.Mesh(
            new THREE.BoxGeometry(
                width,
                .22,
                .65
            ),
            mat(0x2d984b)
        );

        step.position.set(
            0,
            .11+i*(height/steps),
            i*.65
        );

        group.add(step);
    }

    const railMat=mat(0x21813f);

    const railL=new THREE.Mesh(
        new THREE.CylinderGeometry(
            .06,.06,
            2.8,
            8
        ),
        railMat
    );

    railL.position.set(
        -width/2,
        1.4,
        1.7
    );

    railL.rotation.z=.1;

    group.add(railL);

    const railR=railL.clone();

    railR.position.x=
        width/2;

    group.add(railR);

    group.position.set(
        x,0,z
    );

    scene.add(group);
}

staircase(
    4,
    17,
    3.2,
    14,
    3
);

/* =========================================================
   SCHOOL COURTYARD
========================================================= */

const courtyard=new THREE.Mesh(
    new THREE.PlaneGeometry(
        32,
        23
    ),
    mat(0x8cba72)
);

courtyard.rotation.x=-Math.PI/2;
courtyard.position.set(
    0,.02,8
);

scene.add(courtyard);

/* =========================================================
   SCHOOL GATE
========================================================= */

function gate(){

    const group=new THREE.Group();

    const blue=mat(0x55a7d4);

    const pillar1=new THREE.Mesh(
        new THREE.BoxGeometry(
            1.2,
            4.5,
            1.2
        ),
        blue
    );

    pillar1.position.set(
        -4,2.25,0
    );

    group.add(pillar1);

    const pillar2=pillar1.clone();

    pillar2.position.x=4;

    group.add(pillar2);

    const top=new THREE.Mesh(
        new THREE.BoxGeometry(
            9,
            .8,
            1
        ),
        blue
    );

    top.position.y=4.1;

    group.add(top);

    const doorL=new THREE.Mesh(
        new THREE.BoxGeometry(
            3.8,
            2.5,
            .18
        ),
        mat(0x3b8d4b)
    );

    doorL.position.set(
        -1.9,
        1.25,
        0
    );

    group.add(doorL);

    const doorR=doorL.clone();

    doorR.position.x=1.9;

    group.add(doorR);

    group.position.set(
        0,0,-4
    );

    scene.add(group);
}

gate();

/* =========================================================
   SIMPLE VIETNAMESE-STYLE HOUSES
========================================================= */

function house(x,z){

    const group=new THREE.Group();

    const body=new THREE.Mesh(
        new THREE.BoxGeometry(
            6,
            3,
            5
        ),
        mat(0xd9d0bd)
    );

    body.position.y=1.5;

    group.add(body);

    const roof=new THREE.Mesh(
        new THREE.ConeGeometry(
            4.4,
            2.2,
            4
        ),
        mat(0x9b5140)
    );

    roof.rotation.y=Math.PI/4;
    roof.position.y=4;

    group.add(roof);

    group.position.set(
        x,0,z
    );

    group.traverse(o=>{
        if(o.isMesh)o.castShadow=true;
    });

    scene.add(group);
}

house(-24,10);
house(-25,20);
house(27,13);
house(29,25);
house(-28,-18);
house(25,-20);

/* =========================================================
   WEATHER PARTICLES
========================================================= */

const weatherGroup=new THREE.Group();

scene.add(weatherGroup);

let weather="clear";

function createWeather(type){

    while(weatherGroup.children.length)
        weatherGroup.remove(
            weatherGroup.children[0]
        );

    weather=type;

    if(type==="clear")return;

    let color=0xffffff;

    let size=.06;

    if(type==="rain"){
        color=0x9ddcff;
        size=.035;
    }

    if(type==="snow"){
        color=0xffffff;
        size=.08;
    }

    const count=
        type==="rain" ? 700 : 450;

    const geo=new THREE.BufferGeometry();

    const positions=new Float32Array(
        count*3
    );

    for(let i=0;i<count;i++){

        positions[i*3]=
            (Math.random()-.5)*100;

        positions[i*3+1]=
            Math.random()*40;

        positions[i*3+2]=
            (Math.random()-.5)*100;
    }

    geo.setAttribute(
        "position",
        new THREE.BufferAttribute(
            positions,
            3
        )
    );

    const points=new THREE.Points(
        geo,
        new THREE.PointsMaterial({
            color,
            size,
            transparent:true,
            opacity:.8
        })
    );

    points.userData.weather=type;

    weatherGroup.add(points);
}

/* =========================================================
   SUN + MOON
========================================================= */

const celestial=new THREE.Group();

scene.add(celestial);

const sunMesh=new THREE.Mesh(
    new THREE.SphereGeometry(
        3,
        24,
        16
    ),
    new THREE.MeshBasicMaterial({
        color:0xffe48b
    })
);

celestial.add(sunMesh);

const moonMesh=new THREE.Mesh(
    new THREE.SphereGeometry(
        2,
        20,
        14
    ),
    new THREE.MeshBasicMaterial({
        color:0xf1f0d0
    })
);

celestial.add(moonMesh);

/* =========================================================
   MOON PHASES
========================================================= */

let moonPhase=0;

function updateMoonPhase(){

    /*
      0 = trăng non
      1 = trăng lưỡi liềm
      2 = bán nguyệt
      3 = khuyết lớn
      4 = trăng tròn
      5 = khuyết lớn
      6 = bán nguyệt
      7 = lưỡi liềm
    */

    const phase=moonPhase%8;

    moonMesh.scale.x=
        phase===4 ? 1 :
        phase===0 ? .05 :
        .65;

    moonMesh.scale.z=
        phase===0 ? .15 : 1;
}

/* =========================================================
   NIGHT / DAY
========================================================= */

let dayTime=0;

function updateSky(dt){

    dayTime+=dt*.018;

    const cycle=
        dayTime%(Math.PI*2);

    const sunHeight=
        Math.sin(cycle);

    sunMesh.position.set(
        Math.cos(cycle)*55,
        25+sunHeight*40,
        -45
    );

    moonMesh.position.set(
        -Math.cos(cycle)*50,
        25-sunHeight*35,
        25
    );

    const night=
        Math.max(
            0,
            -sunHeight
        );

    const skyDay=
        new THREE.Color(
            0x79b9e5
        );

    const skyNight=
        new THREE.Color(
            0x10182f
        );

    scene.background.lerpColors(
        skyNight,
        skyDay,
        1-night
    );

    scene.fog.color.copy(
        scene.background
    );

    sunLight.intensity=
        .35+1.9*(1-night);

    hemi.intensity=
        .65+1.2*(1-night);

    if(
        Math.floor(dayTime)%20===0
    ){
        moonPhase=
            Math.floor(dayTime/20)%8;

        updateMoonPhase();
    }
}

/* =========================================================

/* =========================================================
   ENERGY PROJECTILE
========================================================= */

const bullets=[];

function shoot(){

    const direction=new THREE.Vector3(
        -Math.sin(cameraYaw),
        0,
        -Math.cos(cameraYaw)
    ).normalize();

    const group=new THREE.Group();

    const core=new THREE.Mesh(
        new THREE.SphereGeometry(
            .2,
            12,
            8
        ),
        new THREE.MeshBasicMaterial({
            color:0xffff80
        })
    );

    group.add(core);

    const glow=new THREE.Mesh(
        new THREE.SphereGeometry(
            .48,
            10,
            8
        ),
        new THREE.MeshBasicMaterial({
            color:0x63eaff,
            transparent:true,
            opacity:.22
        })
    );

    group.add(glow);

    const tail=new THREE.Mesh(
        new THREE.CylinderGeometry(
            .06,
            .14,
            2.4,
            8
        ),
        new THREE.MeshBasicMaterial({
            color:0x67eaff,
            transparent:true,
            opacity:.65
        })
    );

    tail.rotation.x=Math.PI/2;
    tail.position.z=.95;

    group.add(tail);

    group.position.copy(
        player.position
    );

    group.position.y+=3.15;

    group.userData={
        velocity:
            direction.multiplyScalar(28),
        life:2.5,
        damage:30
    };

    scene.add(group);

    bullets.push(group);
}

/* =========================================================
   ZOMBIES
========================================================= */

const zombies=[];

function createZombie(){

    const z=new THREE.Group();

    const body=new THREE.Mesh(
        new THREE.BoxGeometry(
            1.05,
            1.75,
            .8
        ),
        mat(0x66756d)
    );

    body.position.y=1.05;
    z.add(body);

    const head=new THREE.Mesh(
        new THREE.SphereGeometry(
            .65,
            14,
            10
        ),
        mat(0x899a83)
    );

    head.position.y=2.35;
    z.add(head);

    const eyeMat=mat(
        0xffff55,
        {
            emissive:0x555500
        }
    );

    for(
        const x of [-.2,.2]
    ){

        const e=new THREE.Mesh(
            new THREE.SphereGeometry(
                .1,
                8,
                6
            ),
            eyeMat
        );

        e.position.set(
            x,
            2.43,
            .59
        );

        z.add(e);
    }

    const angle=
        Math.random()*Math.PI*2;

    const distance=
        28+Math.random()*20;

    z.position.set(
        player.position.x+
        Math.cos(angle)*distance,
        0,
        player.position.z+
        Math.sin(angle)*distance
    );

    z.userData={
        hp:100,
        speed:1+Math.random()*.6,
        attack:0
    };

    z.traverse(o=>{
        if(o.isMesh)o.castShadow=true;
    });

    scene.add(z);

    zombies.push(z);
}

/* =========================================================
   GAME STATE
========================================================= */

let running=false;
let playerHP=100;
let wave=1;
let waveWaiting=false;

let cameraYaw=0;
let cameraPitch=.35;

let joyX=0;
let joyY=0;

let jumping=false;
let verticalVelocity=0;

const cooldown=[
    0,0,0
];

const hpFill=
    document.getElementById("hpFill");

const hpNumber=
    document.getElementById("hpNumber");

const waveNumber=
    document.getElementById("waveNumber");

const zombieNumber=
    document.getElementById("zombieNumber");

/* =========================================================
   HEALTH
========================================================= */

function damagePlayer(amount){

    playerHP=Math.max(
        0,
        playerHP-amount
    );

    hpFill.style.width=
        playerHP+"%";

    hpNumber.textContent=
        playerHP+" / 100";

    if(playerHP<=0){
        running=false;
        document.getElementById(
            "gameover"
        ).style.display="flex";
    }
}

/* =========================================================
   WAVE
========================================================= */

function startWave(){

    waveWaiting=false;

    waveNumber.textContent=wave;

    const amount=
        Math.min(
            2+wave*2,
            25
        );

    for(
        let i=0;
        i<amount;
        i++
    ){

        setTimeout(
            ()=>{
                if(running)
                    createZombie();
            },
            i*450
        );
    }
}

/* =========================================================
   SKILLS
========================================================= */

function skill(id){

    if(!running)return;

    if(cooldown[id]>0)return;

    if(id===0){

        for(
            let i=-2;
            i<=2;
            i++
        ){

            const old=cameraYaw;

            cameraYaw+=i*.09;

            shoot();

            cameraYaw=old;
        }

        cooldown[0]=5;
    }

    if(id===1){

        player.userData.shield=true;

        const shield=new THREE.Mesh(
            new THREE.SphereGeometry(
                2.3,
                20,
                12
            ),
            new THREE.MeshBasicMaterial({
                color:0x55ff9b,
                transparent:true,
                opacity:.22,
                wireframe:true
            })
        );

        shield.position.copy(
            player.position
        );

        shield.position.y=1.6;

        scene.add(shield);

        const timer=setInterval(
            ()=>{
                shield.position.copy(
                    player.position
                );
                shield.position.y+=1.6;
            },
            30
        );

        setTimeout(
            ()=>{
                clearInterval(timer);
                scene.remove(shield);
                player.userData.shield=false;
            },
            3000
        );

        cooldown[1]=8;
    }

    if(id===2){

        for(
            const z of zombies
        ){

            const d=z.position.distanceTo(
                player.position
            );

            if(d<8){

                const push=z.position.clone()
                    .sub(player.position)
                    .normalize();

                z.position.addScaledVector(
                    push,
                    5
                );

                z.userData.hp-=70;
            }
        }

        cooldown[2]=10;
    }
}

/* =========================================================
   JUMP
========================================================= */

function jump(){

    if(
        !running ||
        jumping
    )return;

    jumping=true;
    verticalVelocity=7;
}

/* =========================================================
   JOYSTICK
========================================================= */

const joystick=
    document.getElementById(
        "joystick"
    );

const joyStick=
    document.getElementById(
        "joyStick"
    );

let joyFinger=null;

function updateJoystick(t){

    const rect=
        joystick.getBoundingClientRect();

    let x=
        t.clientX-
        (rect.left+rect.width/2);

    let y=
        t.clientY-
        (rect.top+rect.height/2);

    const max=43;

    const len=Math.hypot(x,y);

    if(len>max){

        x=x/len*max;
        y=y/len*max;
    }

    joyX=x/max;
    joyY=y/max;

    joyStick.style.transform=
        `translate(${x}px,${y}px)`;
}

joystick.addEventListener(
    "touchstart",
    e=>{

        e.preventDefault();

        const t=e.changedTouches[0];

        joyFinger=t.identifier;

        updateJoystick(t);
    },
    {passive:false}
);

joystick.addEventListener(
    "touchmove",
    e=>{

        e.preventDefault();

        for(
            const t of e.changedTouches
        ){

            if(
                t.identifier===
                joyFinger
            )
                updateJoystick(t);
        }
    },
    {passive:false}
);

joystick.addEventListener(
    "touchend",
    e=>{

        e.preventDefault();

        joyFinger=null;
        joyX=0;
        joyY=0;

        joyStick.style.transform=
            "translate(0,0)";
    },
    {passive:false}
);

/* =========================================================
   CAMERA
========================================================= */

let cameraFinger=null;
let lastX=0;
let lastY=0;

renderer.domElement.addEventListener(
    "touchstart",
    e=>{

        if(!running)return;

        for(
            const t of e.changedTouches
        ){

            if(cameraFinger!==null)
                continue;

            cameraFinger=t.identifier;

            lastX=t.clientX;
            lastY=t.clientY;
        }
    },
    {passive:false}
);

renderer.domElement.addEventListener(
    "touchmove",
    e=>{

        if(cameraFinger===null)return;

        for(
            const t of e.changedTouches
        ){

            if(
                t.identifier!==
                cameraFinger
            )continue;

            const dx=
                t.clientX-lastX;

            const dy=
                t.clientY-lastY;

            cameraYaw-=dx*.006;
            cameraPitch-=dy*.004;

            cameraPitch=
                THREE.MathUtils.clamp(
                    cameraPitch,
                    -.1,
                    .8
                );

            lastX=t.clientX;
            lastY=t.clientY;
        }
    },
    {passive:false}
);

renderer.domElement.addEventListener(
    "touchend",
    e=>{

        for(
            const t of e.changedTouches
        ){

            if(
                t.identifier===
                cameraFinger
            )
                cameraFinger=null;
        }
    },
    {passive:false}
);

/* =========================================================
   BUTTONS
========================================================= */

function tap(id,fn){

    document
        .getElementById(id)
        .addEventListener(
            "touchstart",
            e=>{
                e.preventDefault();
                fn();
            },
            {passive:false}
        );
}

tap("fire",shoot);
tap("jump",jump);
tap("skill1",()=>skill(0));
tap("skill2",()=>skill(1));
tap("skill3",()=>skill(2));

/* =========================================================
   START
========================================================= */

document
    .getElementById("startButton")
    .onclick=()=>{

        document.getElementById(
            "start"
        ).style.display="none";

        running=true;

        playerHP=100;

        hpFill.style.width="100%";
        hpNumber.textContent="100 / 100";

        createWeather("clear");

        startWave();
    };

/* =========================================================
   RESTART
========================================================= */

document
    .getElementById("restart")
    .onclick=()=>{
        location.reload();
    };

/* =========================================================
   UPDATE PLAYER
========================================================= */

function updatePlayer(dt){

    const forward=new THREE.Vector3(
        -Math.sin(cameraYaw),
        0,
        -Math.cos(cameraYaw)
    );

    const right=new THREE.Vector3(
        Math.cos(cameraYaw),
        0,
        -Math.sin(cameraYaw)
    );

    const movement=new THREE.Vector3();

    movement.add(
        forward.clone()
            .multiplyScalar(-joyY)
    );

    movement.add(
        right.clone()
            .multiplyScalar(joyX)
    );

    if(movement.lengthSq()>0){

        movement.normalize();

        player.position.addScaledVector(
            movement,
            5.5*dt
        );

        player.rotation.y=
            Math.atan2(
                movement.x,
                movement.z
            );
    }

    /* jump */

    if(jumping){

        verticalVelocity-=18*dt;

        player.position.y+=
            verticalVelocity*dt;

        if(
            player.position.y<=0
        ){

            player.position.y=0;
            jumping=false;
            verticalVelocity=0;
        }
    }

    /* plant movement animation */

    const t=performance.now()*.004;

    flower.rotation.z=
        Math.sin(t)*.035;

    flower.rotation.x=
        Math.cos(t*.8)*.025;

    stem.rotation.z=
        Math.sin(t*.7)*.015;
}

/* =========================================================
   UPDATE BULLETS
========================================================= */

function updateBullets(dt){

    for(
        let i=bullets.length-1;
        i>=0;
        i--
    ){

        const b=bullets[i];

        b.position.addScaledVector(
            b.userData.velocity,
            dt
        );

        b.userData.life-=dt;

        let remove=
            b.userData.life<=0;

        for(
            let j=zombies.length-1;
            j>=0;
            j--
        ){

            const z=zombies[j];

            if(
                b.position.distanceTo(
                    z.position
                )<1.4
            ){

                z.userData.hp-=
                    b.userData.damage;

                remove=true;

                if(
                    z.userData.hp<=0
                ){

                    scene.remove(z);

                    zombies.splice(
                        j,
                        1
                    );
                }

                break;
            }
        }

        if(remove){

            scene.remove(b);

            bullets.splice(i,1);
        }
    }
}

/* =========================================================
   UPDATE ZOMBIES
========================================================= */

function updateZombies(dt){

    for(
        const z of zombies
    ){

        const direction=
            player.position.clone()
                .sub(z.position);

        direction.y=0;

        const distance=
            direction.length();

        if(distance>1.7){

            direction.normalize();

            z.position.addScaledVector(
                direction,
                z.userData.speed*dt
            );

            z.rotation.y=
                Math.atan2(
                    direction.x,
                    direction.z
                );

        }else{

            z.userData.attack-=dt;

            if(
                z.userData.attack<=0
            ){

                if(
                    !player.userData.shield
                )
                    damagePlayer(7);

                z.userData.attack=1;
            }
        }
    }

    if(
        zombies.length===0 &&
        !waveWaiting
    ){

        waveWaiting=true;

        setTimeout(
            ()=>{
                if(!running)return;

                wave++;

                startWave();
            },
            2500
        );
    }

    zombieNumber.textContent=
        zombies.length;
}

/* =========================================================
   UPDATE WEATHER
========================================================= */

function updateWeather(dt){

    for(
        const p of weatherGroup.children
    ){

        const positions=
            p.geometry.attributes.position.array;

        for(
            let i=1;
            i<positions.length;
            i+=3
        ){

            if(
                p.userData.weather===
                "rain"
            )
                positions[i]-=25*dt;
            else
                positions[i]-=4*dt;

            if(
                positions[i]<0
            )
                positions[i]=40;
        }

        p.geometry.attributes.position.needsUpdate=true;
    }
}

/* =========================================================
   CAMERA FOLLOW
========================================================= */

function updateCamera(){

    const target=
        player.position.clone();

    target.y+=2.1;

    const distance=8;

    const desired=
        target.clone();

    desired.x+=
        Math.sin(cameraYaw)*
        distance;

    desired.z+=
        Math.cos(cameraYaw)*
        distance;

    desired.y+=
        2.8+
        cameraPitch*3;

    camera.position.lerp(
        desired,
        .12
    );

    camera.lookAt(target);
}

/* =========================================================
   COOLDOWN UI
========================================================= */

function updateCooldowns(dt){

    for(
        let i=0;
        i<3;
        i++
    ){

        if(
            cooldown[i]>0
        )
            cooldown[i]=
                Math.max(
                    0,
                    cooldown[i]-dt
                );

        const button=
            document.getElementById(
                "skill"+(i+1)
            );

        const cd=
            button.querySelector(
                ".cooldown"
            );

        if(
            cooldown[i]>0
        ){

            button.classList.add(
                "cooling"
            );

            cd.textContent=
                Math.ceil(
                    cooldown[i]
                );

        }else{

            button.classList.remove(
                "cooling"
            );
        }
    }
}

/* =========================================================
   MAIN LOOP
========================================================= */

let last=performance.now();

function animate(now){

    requestAnimationFrame(animate);

    const dt=
        Math.min(
            (now-last)/1000,
            .05
        );

    last=now;

    updateSky(dt);
    updateWeather(dt);

    if(running){

        updatePlayer(dt);
        updateBullets(dt);
        updateZombies(dt);
        updateCooldowns(dt);
    }

    updateCamera();

    renderer.render(
        scene,
        camera
    );
}

animate(performance.now());

   RESIZE
========================================================= */

        camera.aspect=
            innerWidth/
            innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            innerWidth,
            innerHeight
        );

);

createWeather("clear");
updateMoonPhase();
