<div id="spotify-widget"></div>

<script>
(() => {
  const SPOTIFY_CLIENT_ID = "92f555fb82984b21b267adbf368c3415";
  const SPOTIFY_REDIRECT_URI = "https://namnu5858-code.github.io/scarlet/?";

  function generateRandomString(length) {
    const possible = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";
    const values = crypto.getRandomValues(new Uint8Array(length));
    return values.reduce((acc, x) => acc + possible[x % possible.length], "");
  }

  async function sha256(plain) {
    const encoder = new TextEncoder();
    const data = encoder.encode(plain);
    return window.crypto.subtle.digest("SHA-256", data);
  }

  function base64encode(input) {
    return btoa(String.fromCharCode(...new Uint8Array(input)))
      .replace(/=/g, "")
      .replace(/\+/g, "-")
      .replace(/\//g, "_");
  }

  async function loginWithSpotify() {
    const codeVerifier = generateRandomString(64);
    const hashed = await sha256(codeVerifier);
    const codeChallenge = base64encode(hashed);

    window.localStorage.setItem("spotify_code_verifier", codeVerifier);

    const scope = "user-read-currently-playing user-read-playback-state";
    const authUrl = new URL("https://accounts.spotify.com/authorize");

    authUrl.search = new URLSearchParams({
      response_type: "code",
      client_id: SPOTIFY_CLIENT_ID,
      scope,
      code_challenge_method: "S256",
      code_challenge: codeChallenge,
      redirect_uri: SPOTIFY_REDIRECT_URI,
    }).toString();

    window.location.href = authUrl.toString();
  }

  async function exchangeCodeForToken(code) {
    const codeVerifier = window.localStorage.getItem("spotify_code_verifier");
    if (!codeVerifier) return null;

    const response = await fetch("https://accounts.spotify.com/api/token", {
      method: "POST",
      headers: {
        "Content-Type": "application/x-www-form-urlencoded",
      },
      body: new URLSearchParams({
        client_id: SPOTIFY_CLIENT_ID,
        grant_type: "authorization_code",
        code,
        redirect_uri: SPOTIFY_REDIRECT_URI,
        code_verifier: codeVerifier,
      }),
    });

    if (!response.ok) return null;
    const data = await response.json();
    if (data.access_token) {
      window.localStorage.setItem("spotify_access_token", data.access_token);
      if (data.refresh_token) {
        window.localStorage.setItem("spotify_refresh_token", data.refresh_token);
      }
      window.history.replaceState({}, document.title, SPOTIFY_REDIRECT_URI);
    }
    return data.access_token;
  }

  async function getCurrentlyPlayingTrack() {
    const urlParams = new URLSearchParams(window.location.search);
    const code = urlParams.get("code");

    let token = window.localStorage.getItem("spotify_access_token");
    if (code) {
      token = await exchangeCodeForToken(code);
    }
    if (!token) return null;

    const res = await fetch("https://api.spotify.com/v1/me/player/currently-playing", {
      headers: {
        Authorization: `Bearer ${token}`,
      },
    });

    if (res.status === 204 || !res.ok) return null;
    const data = await res.json();
    if (!data || !data.item) return null;

    return {
      isPlaying: data.is_playing,
      title: data.item.name,
      artist: data.item.artists.map((a) => a.name).join(", "),
      album: data.item.album.name,
      coverUrl: data.item.album.images?.[0]?.url || "",
      spotifyUrl: data.item.external_urls?.spotify || "",
    };
  }

  async function renderSpotifyWidget(containerSelector = "#spotify-widget") {
    const el = document.querySelector(containerSelector);
    if (!el) return;

    const track = await getCurrentlyPlayingTrack();

    if (!track) {
      el.innerHTML = `<button id="spotify-login-btn" type="button" style="padding:8px 14px;border-radius:999px;border:1px solid rgba(255,255,255,0.2);background:#18181b;color:#fff;font-size:13px;cursor:pointer;">Kết nối Spotify</button>`;
      const btn = el.querySelector("#spotify-login-btn");
      if (btn) btn.addEventListener("click", loginWithSpotify);
      return;
    }

    el.innerHTML = `
      <a href="${track.spotifyUrl}" target="_blank" rel="noopener noreferrer" style="display:inline-flex;align-items:center;gap:10px;padding:8px 12px;border-radius:14px;background:rgba(24,24,27,0.85);color:#fff;text-decoration:none;border:1px solid rgba(255,255,255,0.12);">
        ${track.coverUrl ? `<img src="${track.coverUrl}" alt="${track.title}" width="40" height="40" style="border-radius:8px;object-fit:cover;" />` : ""}
        <div style="text-align:left;line-height:1.25;">
          <div style="font-size:13px;font-weight:600;">${track.title}</div>
          <div style="font-size:11px;opacity:0.75;">${track.artist}</div>
        </div>
      </a>
    `;
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", () => renderSpotifyWidget());
  } else {
    renderSpotifyWidget();
  }
})();
</script>
