<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>Cam Thuong Middle School - 3D Campus</title>

<style>
*{
  box-sizing:border-box;
  -webkit-user-select:none;
  user-select:none;
  -webkit-touch-callout:none;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#9bdcff;
  touch-action:none;
  font-family:Arial,sans-serif;
}

#game-container{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
}

canvas{
  display:block;
}

.glass-ui{
  background:rgba(255,255,255,.18);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  border:1px solid rgba(255,255,255,.4);
  box-shadow:0 8px 32px rgba(0,0,0,.18);
}

#joystick-wrapper{
  position:absolute;
  left:32px;
  bottom:32px;
  width:120px;
  height:120px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:20;
  touch-action:none;
}

#joystick-stick{
  position:absolute;
  width:52px;
  height:52px;
  border-radius:50%;
  background:rgba(255,255,255,.58);
  border:1px solid rgba(255,255,255,.85);
  box-shadow:0 4px 14px rgba(0,0,0,.18);

}

#jump-btn{
  position:absolute;
  right:32px;
  bottom:38px;
  width:72px;
  height:72px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:20;
  touch-action:none;
  transition: background 0.3s ease, transform 0.1s ease;
}

#jump-btn.flying{
  background:rgba(255, 215, 0, 0.55);
  border-color:rgba(255, 255, 255, 0.9);
  box-shadow: 0 0 15px rgba(255, 215, 0, 0.6);
}

#jump-btn:active{
  transform:scale(.94);
}

#jump-btn svg{
  width:34px;
  height:34px;
  fill:none;
  stroke:white;
  stroke-width:2.5;
  stroke-linecap:round;
  stroke-linejoin:round;
}

#loading{
  position:absolute;
  top:14px;
  right:16px;
  padding:8px 14px;
  border-radius:10px;
  background:rgba(0,0,0,.42);
  color:white;
  font-size:12px;
  z-index:30;
  pointer-events:none;
}
</style>

<script type="importmap">
{
  "imports":{
    "three":"https://unpkg.com/three@0.160.0/build/three.module.js",

</script>
</head>

<script type="module">

import * as THREE from "three";
import {GLTFLoader} from "three/addons/loaders/GLTFLoader.js";

// ============================================================
// SCENE & CAMERA
// ============================================================

const container=document.getElementById("game-container");
const loading=document.getElementById("loading");

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x8fd4f5);
scene.fog=new THREE.FogExp2(0xbfeafa, 0.0018);

const cameraPivot=new THREE.Object3D();
scene.add(cameraPivot);

const camera=new THREE.PerspectiveCamera(
  60,
  window.innerWidth/window.innerHeight,
  0.1,
  2000
);
cameraPivot.add(camera);

let cameraDistance=10;
let targetCameraDistance=10;
let cameraAngleX=0.05; 
let cameraAngleY=0;
let targetCameraAngleX=0.05;
let targetCameraAngleY=0;

function updateCamera(){
  cameraAngleY = THREE.MathUtils.lerp(cameraAngleY, targetCameraAngleY, 0.15);
  cameraAngleX = THREE.MathUtils.lerp(cameraAngleX, targetCameraAngleX, 0.15);
  cameraDistance = THREE.MathUtils.lerp(cameraDistance, targetCameraDistance, 0.15);

  cameraPivot.rotation.y=cameraAngleY;
  cameraPivot.rotation.x=cameraAngleX;

  camera.position.set(0, 0, cameraDistance);
  camera.lookAt(cameraPivot.position);
}

// ============================================================
// RENDERER & LIGHTS
// ============================================================

const renderer=new THREE.WebGLRenderer({
  antialias:true,
  powerPreference:"high-performance"
});

renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.12;

container.appendChild(renderer.domElement);

const hemisphere=new THREE.HemisphereLight(0xe8f8ff, 0x516b3b, 1.5);
scene.add(hemisphere);

const sunlight=new THREE.DirectionalLight(0xfff3d2, 2.2);
sunlight.position.set(100, 130, 80);
sunlight.castShadow=true;
sunlight.shadow.mapSize.width=2048;
sunlight.shadow.mapSize.height=2048;
sunlight.shadow.camera.near=1;
sunlight.shadow.camera.far=300;
sunlight.shadow.camera.left=-180;
sunlight.shadow.camera.right=180;
sunlight.shadow.camera.top=180;
sunlight.shadow.camera.bottom=-180;
sunlight.shadow.bias=-0.0003;
scene.add(sunlight);

// ============================================================
// MATERIALS
// ============================================================

const MAT={};

MAT.redTile=new THREE.MeshStandardMaterial({

});

MAT.lightBlue=new THREE.MeshStandardMaterial({

});

MAT.roofMetal=new THREE.MeshStandardMaterial({
  color:0x68777b,
  roughness:.65,
  metalness:.45
});

MAT.glass=new THREE.MeshPhysicalMaterial({
  color:0x76b9d2,
  roughness:.08,
  metalness:.05,
  transparent:true,
  opacity:.68
});

MAT.blackboard=new THREE.MeshStandardMaterial({
  color:0x17231f,
  roughness:.9
});

MAT.treeTrunk=new THREE.MeshStandardMaterial({
  color:0x68452d,
  roughness:1
});

MAT.treeLeaf=new THREE.MeshStandardMaterial({
  color:0x2f8137,
  roughness:.92
});

MAT.treeLeafDark=new THREE.MeshStandardMaterial({

});

});

// ============================================================
// HELPER FUNCTIONS
// ============================================================

function box(w,h,d,x,y,z,material,parent=scene){
  const mesh=new THREE.Mesh(new THREE.BoxGeometry(w,h,d), material);
  mesh.position.set(x,y,z);
  mesh.castShadow=true;
  mesh.receiveShadow=true;
  parent.add(mesh);
  return mesh;
}

function cylinder(radius,height,x,y,z,material,segments=20,parent=scene){
  const mesh=new THREE.Mesh(
    new THREE.CylinderGeometry(radius,radius,height,segments),
    material
  );
  mesh.position.set(x,y,z);
  mesh.castShadow=true;
  mesh.receiveShadow=true;
  parent.add(mesh);
  return mesh;
}

function textPlane(text,width,height,x,y,z,rotationY=0){
  const canvas=document.createElement("canvas");
  canvas.width=1024;
  canvas.height=256;
  const ctx=canvas.getContext("2d");
  ctx.clearRect(0,0,1024,256);
  ctx.fillStyle="#ffffff";
  ctx.font="bold 72px Arial";
  ctx.textAlign="center";
  ctx.textBaseline="middle";
  ctx.fillText(text,512,128);

  const texture=new THREE.CanvasTexture(canvas);
  texture.colorSpace=THREE.SRGBColorSpace;

  const material=new THREE.MeshBasicMaterial({
    map:texture,
    transparent:true
  });

  const mesh=new THREE.Mesh(new THREE.PlaneGeometry(width,height), material);
  mesh.position.set(x,y,z);
  mesh.rotation.y=rotationY;
  scene.add(mesh);
  return mesh;
}

// ============================================================
// CAMPUS & GROUND FIX
// ============================================================

const campus=new THREE.Group();
scene.add(campus);

const CAMPUS_W=260;
const CAMPUS_D=210;

// Đất nền cỏ xung quanh
box(900, 1, 900, 0, -0.5, 0, new THREE.MeshStandardMaterial({
  color:0x73b951,
  roughness:1
}), campus);

// SÂN TRƯỜNG: ĐẶT BÁM SÁT MẶT ĐẤT (Y=0.01)
box(240, 0.02, 190, 0, 0.01, 0, MAT.redTile, campus);

// TẠO LƯỚI KẺ GẠCH NHỎ, SẮC NÉT
const tileLineMaterial=new THREE.MeshStandardMaterial({
  color:0x4d211b,
  roughness:.9
});

for(let x=-120; x<=120; x+=2){
  box(.04, .005, 190, x, .021, 0, tileLineMaterial, campus);
}

for(let z=-95; z<=95; z+=2){
  box(240, .005, .04, 0, .021, z, tileLineMaterial, campus);
}

// ============================================================
// FENCE & GATE
// ============================================================

function createFenceX(z){
  box(CAMPUS_W, 2.0, 1.0, 0, 1, z, MAT.yellow, campus);
  for(let x=-130; x<=130; x+=4){
    box(.16, 2.5, .16, x, 2.25, z, MAT.darkMetal, campus);
  }
  box(CAMPUS_W, .16, .16, 0, 3.4, z, MAT.darkMetal, campus);
  box(CAMPUS_W, .16, .16, 0, 2.35, z, MAT.darkMetal, campus);
}

function createFenceZ(x){
  box(1, 2, CAMPUS_D, x, 1, 0, MAT.yellow, campus);
  for(let z=-105; z<=105; z+=4){
    box(.16, 2.5, .16, x, 2.25, z, MAT.darkMetal, campus);
  }
  box(.16, .16, CAMPUS_D, x, 3.4, 0, MAT.darkMetal, campus);
}

createFenceX(-105);
createFenceX(105);
createFenceZ(-130);
createFenceZ(130);

const gateZ=105;
const gateX=65;

box(7, 11, 5, gateX-14, 5.5, gateZ, MAT.yellowBright, campus);
box(7, 11, 5, gateX+14, 5.5, gateZ, MAT.yellowBright, campus);
box(8, .7, 6, gateX-14, .35, gateZ, MAT.concrete, campus);
box(8, .7, 6, gateX+14, .35, gateZ, MAT.concrete, campus);

box(39, 5.3, .65, gateX, 10.1, gateZ, MAT.blueSign, campus);
textPlane("TRƯỜNG THCS CAM THƯỢNG", 35, 4.2, gateX, 10.1, gateZ-0.38, 0);

for(let i=0; i<9; i++){
  box(.18, 7, .18, gateX-10+i*2.4, 3.5, gateZ-3, MAT.darkMetal, campus);
}
for(let y=1; y<=6; y+=1.3){
  box(22, .14, .14, gateX, y, gateZ-3, MAT.darkMetal, campus);
}

// ============================================================
// BUILDINGS (A, B, C)
// ============================================================

const buildingA=new THREE.Group();
campus.add(buildingA);
const A_HEIGHT=16;

box(145, A_HEIGHT, 17, -45, A_HEIGHT/2, -55, MAT.lightBlue, buildingA);
box(17, A_HEIGHT, 70, -109, A_HEIGHT/2, -20, MAT.lightBlue, buildingA);
box(145, 1.2, 17.5, -45, .6, -55, MAT.white, buildingA);
box(17.5, 1.2, 70, -109, .6, -20, MAT.white, buildingA);

for(let y=4; y<16; y+=4){
  box(145, .22, 17.5, -45, y, -55, MAT.white, buildingA);
  box(17.5, .22, 70, -109, y, -20, MAT.white, buildingA);
}

for(let floor=0; floor<4; floor++){
  const y=2.0+floor*4;
  for(let x=-112; x<=22; x+=13){
    box(8.2, 2.25, .20, x, y, -63.65, MAT.glass, buildingA);
    box(8.7, .15, .15, x, y-1.15, -63.82, MAT.darkMetal, buildingA);
    box(8.7, .15, .15, x, y+1.15, -63.82, MAT.darkMetal, buildingA);
  }
}

// DÃY B - BÊN PHẢI VÀ SÂU TRONG KHUÔN VIÊN
const buildingB=new THREE.Group();
campus.add(buildingB);
const BX=75, BZ=-10;

box(70, 16, 30, BX, 8, BZ, MAT.lightBlue, buildingB);
box(70, 1.2, 31, BX, .6, BZ, MAT.white, buildingB);

for(let y=4; y<16; y+=4){
  box(70, .22, 31, BX, y, BZ, MAT.white, buildingB);
}

for(let floor=0; floor<4; floor++){
  const y=2+floor*4;
  for(let x=47; x<=103; x+=14){
    box(8, 2.3, .18, x, y, BZ-15.15, MAT.glass, buildingB);
    box(8.5, .15, .15, x, y-1.2, BZ-15.3, MAT.darkMetal, buildingB);
    box(8.5, .15, .15, x, y+1.2, BZ-15.3, MAT.darkMetal, buildingB);
  }
}

// ============================================================
// CẦU THANG XANH ĐẦU DÃY B (TÍCH HỢP CHUẨN 4 TẦNG & CHIẾU NGHỈ)
// ============================================================

const stairGroup=new THREE.Group();
campus.add(stairGroup);

// Đặt tại phía trước/đầu lối đi Dãy B
const greenStairX = BX - 35 - 3.5; // Ngay đầu hồi hành lang Dãy B
const greenStairZ = BZ - 15;        // MẶT TRƯỚC HÀNH LANG

function buildGreenStairs(){
  const floorHeight = 4.0; 
  const totalFloors = 4;
  const stairWidth = 3.2; 
  const stepsPerFlight = 10;
  const flightRun = 4.5;  

  // Cột trụ chịu lực chính cho 4 tầng cầu thang
  cylinder(0.25, 16.5, greenStairX - 2.2, 8.25, greenStairZ - 1.0, MAT.stairGreenDark, 16, stairGroup);
  cylinder(0.25, 16.5, greenStairX - 2.2, 8.25, greenStairZ - 5.5, MAT.stairGreenDark, 16, stairGroup);
  cylinder(0.25, 16.5, greenStairX + 2.2, 8.25, greenStairZ - 5.5, MAT.stairGreenDark, 16, stairGroup);

  for(let f = 0; f < totalFloors; f++){
    const baseY = f * floorHeight;

    // --- ĐOẠN 1: Từ tầng f lên chiếu nghỉ giữa tầng ---
    for(let i = 0; i < stepsPerFlight; i++){
      const progress = (i + 1) / stepsPerFlight;
      const stepY = baseY + progress * (floorHeight / 2);
      const stepZ = (greenStairZ - 0.5) - progress * flightRun;

      // Bậc thang
      box(stairWidth, 0.2, 0.55, greenStairX + 1.6, stepY - 0.1, stepZ, MAT.stairGreen, stairGroup);
    }

    // Lan can Đoạn 1
    const rail1Start = new THREE.Vector3(greenStairX + 3.1, baseY + 1.0, greenStairZ - 0.5);
    const rail1End = new THREE.Vector3(greenStairX + 3.1, baseY + 2.0 + 1.0, greenStairZ - 0.5 - flightRun);
    box(0.1, 0.1, flightRun * 1.12, greenStairX + 3.1, baseY + 2.0, greenStairZ - 0.5 - flightRun/2, MAT.stairGreenDark, stairGroup)
      .rotation.x = -Math.atan2(2.0, flightRun);

    // --- CHIẾU NGHĨ GIỮA TẦNG ---
    const midLandingY = baseY + floorHeight / 2;
    const midLandingZ = greenStairZ - 0.5 - flightRun - 1.5;
    box(stairWidth * 2.2, 0.3, 3.0, greenStairX, midLandingY, midLandingZ, MAT.stairGreen, stairGroup);

    // Lan can chiếu nghỉ ngoài
    box(stairWidth * 2.2, 1.0, 0.1, greenStairX, midLandingY + 0.6, midLandingZ - 1.45, MAT.stairGreenDark, stairGroup);

    // --- ĐOẠN 2: Từ chiếu nghỉ lên tầng tiếp theo (f+1) ---
    for(let i = 0; i < stepsPerFlight; i++){
      const progress = (i + 1) / stepsPerFlight;
      const stepY = midLandingY + progress * (floorHeight / 2);
      const stepZ = midLandingZ + 1.5 + progress * flightRun;

      box(stairWidth, 0.2, 0.55, greenStairX - 1.6, stepY - 0.1, stepZ, MAT.stairGreen, stairGroup);
    }

    // Lan can Đoạn 2
    box(0.1, 0.1, flightRun * 1.12, greenStairX - 3.1, midLandingY + 2.0, greenStairZ - 0.5 - flightRun/2, MAT.stairGreenDark, stairGroup)
      .rotation.x = Math.atan2(2.0, flightRun);

    // --- CHIẾU NGHĨ TẦNG (SÀN HÀNH LANG) ---
    const topLandingY = baseY + floorHeight;
    box(stairWidth * 2.2, 0.3, 2.5, greenStairX, topLandingY, greenStairZ + 0.75, MAT.stairGreen, stairGroup);
    
    // Cầu nối khớp hoàn toàn vào hành lang Dãy B
    box(2.0, 0.3, 2.0, greenStairX - 1.6, topLandingY, greenStairZ + 2.5, MAT.stairGreen, stairGroup);
  }
}

buildGreenStairs();

// BUILDING C
const buildingC=new THREE.Group();
campus.add(buildingC);
const CX=-15, CZ=-91;

box(120, 12, 18, CX, 6, CZ, MAT.lightBlue, buildingC);

// ============================================================
// PLAYER & MODEL (SUNFLOWER GLTF MODEL WITH ANIMATION)
// ============================================================

const player=new THREE.Group();
scene.add(player);

let model=null;
const leafMeshes=[];
const armMeshes=[];
const rootMeshes=[];
const initialData=new Map();

const loader=new GLTFLoader();
loader.load("scene.gltf", function(gltf){
  model=gltf.scene;
  model.traverse(function(object){
    if(!object.isMesh)return;
    object.castShadow=true;
    object.receiveShadow=true;
    initialData.set(object, {
      position:object.position.clone(),
      rotation:object.rotation.clone(),
      scale:object.scale.clone()
    });
    const name=object.name.toLowerCase();
    if(name.includes("leaf")||name.includes("leaves")||name.includes("foliage")||name.includes("la")) leafMeshes.push(object);
    if(name.includes("arm")||name.includes("hand")||name.includes("tay")) armMeshes.push(object);
    if(name.includes("root")||name.includes("re")) rootMeshes.push(object);
  });
  player.add(model);
  loading.style.display="none";
}, undefined, function(error){
  loading.textContent="Đang tải môi trường...";
});

// ============================================================
// MOVEMENT & SPEED (TỐC ĐỘ BAY 80 KM/H = 22.2222 M/S)
// ============================================================

const input=new THREE.Vector2(0,0);
const velocity=new THREE.Vector3(0,0,0);
const walkSpeed=6.0;

// 80 km/h = 22.2222 m/s
const FLY_SPEED = 22.2222; 

let moveSpeed=walkSpeed;
const gravity=-20;
let grounded=true;
let isFlying=false;

// JOYSTICK
const joystick=document.getElementById("joystick-wrapper");
const stick=document.getElementById("joystick-stick");
let joystickTouch=null;
let centerX=0, centerY=0;
const radius=40;

joystick.addEventListener("touchstart", function(event){
  event.preventDefault();
  const touch=event.changedTouches[0];
  joystickTouch=touch.identifier;
  const rect=joystick.getBoundingClientRect();
  centerX=rect.left+rect.width/2;
  centerY=rect.top+rect.height/2;
  updateJoystick(touch);
}, {passive:false});

function updateJoystick(touch){
  const dx=touch.clientX-centerX;
  const dy=touch.clientY-centerY;
  const distance=Math.hypot(dx,dy);
  const angle=Math.atan2(dy,dx);
  const limited=Math.min(distance,radius);
  const x=Math.cos(angle)*limited;
  const y=Math.sin(angle)*limited;
  stick.style.transform=`translate(${x}px,${y}px)`;
  input.x=x/radius;
  input.y=-y/radius;
}

function resetJoystick(){
  joystickTouch=null;
  input.set(0,0);
  stick.style.transform="translate(0px,0px)";
}

window.addEventListener("touchmove", function(event){
  for(let i=0; i<event.changedTouches.length; i++){
    if(event.changedTouches[i].identifier===joystickTouch){
      updateJoystick(event.changedTouches[i]);
    }
  }
}, {passive:false});

window.addEventListener("touchend", function(event){
  for(let i=0; i<event.changedTouches.length; i++){
    if(event.changedTouches[i].identifier===joystickTouch) resetJoystick();
  }
});

// JUMP & FLY CONTROL (1 Tap: Nhảy, 2 Taps: Bay 80 km/h, 3 Taps: Hạ cánh)
const jump=document.getElementById("jump-btn");
let tapCount = 0;
let tapTimer = null;

jump.addEventListener("touchstart", function(event){
  event.preventDefault();
  tapCount++;

  clearTimeout(tapTimer);
  tapTimer = setTimeout(() => {
    if (tapCount === 1) {
      if (isFlying) {
        velocity.y = 8.0;
      } else if (grounded) {
        velocity.y = 8;
        grounded = false;
      }
    } 
    else if (tapCount === 2) {
      isFlying = true;
      jump.classList.add("flying");
      velocity.y = 4.0; 
      moveSpeed = FLY_SPEED;
    } 
    else if (tapCount >= 3) {
      isFlying = false;
      jump.classList.remove("flying");
      moveSpeed = walkSpeed;
      velocity.y = -12;
    }
    tapCount = 0;
  }, 300);

}, {passive:false});

// ============================================================
// CAMERA & SWIPE / ZOOM CONTROL (KHÓA GÓC DƯỚI ĐẤT)
// ============================================================

let cameraTouch=null;
let lastX=0, lastY=0;
let pinchDistance=0;

window.addEventListener("touchstart", function(event){
  if(event.touches.length===2){
    pinchDistance=Math.hypot(
      event.touches[0].clientX - event.touches[1].clientX,
      event.touches[0].clientY - event.touches[1].clientY
    );
    return;
  }

  const touch=event.changedTouches[0];
  if (touch.identifier !== joystickTouch && cameraTouch === null) {
    cameraTouch = touch.identifier;
    lastX = touch.clientX;
    lastY = touch.clientY;
  }
});

window.addEventListener("touchmove", function(event){
  if(event.touches.length===2){
    const current=Math.hypot(
      event.touches[0].clientX - event.touches[1].clientX,
      event.touches[0].clientY - event.touches[1].clientY
    );
    const difference = pinchDistance - current;
    targetCameraDistance += difference * 0.03;
    targetCameraDistance = THREE.MathUtils.clamp(targetCameraDistance, 3.0, 30.0);
    pinchDistance = current;
    return;
  }

  for(let i=0; i<event.changedTouches.length; i++){
    const touch=event.changedTouches[i];
    if(touch.identifier===cameraTouch){
      const dx=touch.clientX-lastX;
      const dy=touch.clientY-lastY;

      targetCameraAngleY -= dx * 0.005;

      // KHÓA GÓC NHÌN: Tuyệt đối không cho camera nhìn xuyên xuống đất
      targetCameraAngleX = THREE.MathUtils.clamp(
        targetCameraAngleX + dy * 0.005,
        -Math.PI / 4,
        Math.PI / 2.25
      );

      lastX=touch.clientX;
      lastY=touch.clientY;
    }
  }
}, {passive:false});

window.addEventListener("touchend", function(event){
  for(let i=0; i<event.changedTouches.length; i++){
    if(event.changedTouches[i].identifier===cameraTouch) cameraTouch=null;
  }
});

// ============================================================
// ANIMATION HOẠT ẢNH NHÂN VẬT
// ============================================================

let animationTime=0;
let animationBlend=0;

function animateLeaves(delta,moving){
  if(!model)return;
  leafMeshes.forEach((mesh,index)=>{
    const original=initialData.get(mesh);
    if(!original)return;
    const speed=.72+(index%7)*.085;
    const phase=index*.67;
    const t=animationTime*speed+phase;
    const wave1=Math.sin(t);
    const wave2=Math.sin(t*1.73+index);
    const wave3=Math.cos(t*.57+index*.4);

    const movement=(wave1*.62 + wave2*.23 + wave3*.15) * animationBlend;
    const side=index%2===0?1:-1;

    mesh.rotation.z=original.rotation.z + movement*.30*side;
    mesh.rotation.x=original.rotation.x + wave3*.15*animationBlend;
    mesh.rotation.y=original.rotation.y + wave2*.10*animationBlend;
  });
}

function animateSunflower(delta,moving){
  if(!model)return;
  const target=moving?1:0;
  animationBlend=THREE.MathUtils.lerp(animationBlend, target, Math.min(delta*7,1));

  if(moving){ animationTime+=delta*9.5; }

  const wave=Math.sin(animationTime);
  const bounce=Math.abs(wave)*.10*animationBlend;

  model.position.y=THREE.MathUtils.lerp(model.position.y, bounce, Math.min(delta*13,1));
  model.rotation.z=THREE.MathUtils.lerp(model.rotation.z, wave*.035*animationBlend, Math.min(delta*8,1));

  animateLeaves(delta,moving);

  armMeshes.forEach((mesh,index)=>{
    const original=initialData.get(mesh);
    if(!original)return;
    const side=index%2===0?1:-1;
    mesh.rotation.z=original.rotation.z + wave*.32*side*animationBlend;
  });

  rootMeshes.forEach((mesh,index)=>{
    const original=initialData.get(mesh);
    if(!original)return;
    const side=index%2===0?1:-1;
    mesh.rotation.z=original.rotation.z + Math.sin(animationTime+Math.PI)*.20*side*animationBlend;
  });
}

// ============================================================
// GAME LOOP
// ============================================================

const clock=new THREE.Clock();

function animate(){
  requestAnimationFrame(animate);
  const delta=Math.min(clock.getDelta(),.05);
  const moving=input.lengthSq()>.01;

  if(moving){
    const forward=new THREE.Vector3(0,0,-1);
    const right=new THREE.Vector3(1,0,0);

    forward.applyAxisAngle(new THREE.Vector3(0,1,0),cameraAngleY);
    right.applyAxisAngle(new THREE.Vector3(0,1,0),cameraAngleY);

    const movement=new THREE.Vector3();
    movement.addScaledVector(right,input.x);
    movement.addScaledVector(forward,input.y);

    if(movement.lengthSq()>0){
      movement.normalize();
      velocity.x=movement.x*moveSpeed;
      velocity.z=movement.z*moveSpeed;

      if(model){
        const targetRotation=Math.atan2(movement.x,movement.z);
        let difference=targetRotation-model.rotation.y;
        difference=Math.atan2(Math.sin(difference),Math.cos(difference));
        model.rotation.y+=difference*Math.min(delta*10,1);
      }
    }
  } else {
    velocity.x=0;
    velocity.z=0;
  }

  animateSunflower(delta,moving);

  if (isFlying) {
    velocity.y = THREE.MathUtils.lerp(velocity.y, 0, delta * 3);
  } else {
    velocity.y += gravity * delta;
  }

  player.position.y += velocity.y * delta;

  // GIỚI HẠN MẶT ĐẤT
  if(player.position.y <= 0){
    player.position.y = 0;
    velocity.y = 0;
    grounded = true;
    if (isFlying) {
      isFlying = false;
      jump.classList.remove("flying");
      moveSpeed = walkSpeed;
    }
  }

  player.position.x += velocity.x * delta;
  player.position.z += velocity.z * delta;

  cameraPivot.position.copy(player.position);
  cameraPivot.position.y += 1.6;

  updateCamera();
  renderer.render(scene,camera);
}

animate();

window.addEventListener("resize", function(){
  camera.aspect=window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

</script>
