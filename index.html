<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>Cam Thung Middle School - 3D Campus with Fireworks</title>

<style>
*{
  box-sizing:border-box;
  -webkit-user-select:none;
  user-select:none;
  -webkit-touch-callout:none;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#8fd4f5;
  touch-action:none;
  font-family:Arial,sans-serif;
}

#game-container{
  position:fixed;
  top:0;
  left:0;
  width:100vw;
  height:100vh;
  z-index:1;
}

canvas{
  display:block;
  width:100vw !important;
  height:100vh !important;
}

.glass-ui{
  background:rgba(255,255,255,.18);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  border:1px solid rgba(255,255,255,.4);
  box-shadow:0 8px 32px rgba(0,0,0,.18);
}

#joystick-wrapper{
  position:absolute;
  left:32px;
  bottom:32px;
  width:120px;
  height:120px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:20;
  touch-action:none;
}

#joystick-stick{
  position:absolute;
  width:52px;
  height:52px;
  border-radius:50%;
  background:rgba(255,255,255,.58);
  border:1px solid rgba(255,255,255,.85);
  box-shadow:0 4px 14px rgba(0,0,0,.18);
  pointer-events:none;
}

#jump-btn{
  position:absolute;
  right:32px;
  bottom:38px;
  width:72px;
  height:72px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:20;
  touch-action:none;
  transition:background .3s ease,transform .1s ease;
}

#jump-btn.flying{
  background:rgba(255,215,0,.55);
  border-color:rgba(255,255,255,.9);
  box-shadow:0 0 15px rgba(255,215,0,.6);
}

#jump-btn:active{
  transform:scale(.94);
}

#jump-btn svg{
  width:34px;
  height:34px;
  fill:none;
  stroke:white;
  stroke-width:2.5;
  stroke-linecap:round;
  stroke-linejoin:round;
}

#loading{
  position:absolute;
  top:14px;
  right:16px;
  padding:8px 14px;
  border-radius:10px;
  background:rgba(0,0,0,.42);
  color:white;
  font-size:12px;
  z-index:30;
  pointer-events:none;
}

#screen-hint{
  position:absolute;
  left:50%;
  top:18px;
  transform:translateX(-50%);
  padding:9px 15px;
  border-radius:12px;
  background:rgba(0,0,0,.55);
  color:white;
  font-size:13px;
  z-index:25;
  pointer-events:none;
  opacity:0;
  transition:opacity .25s ease;
}

#screen-hint.show{
  opacity:1;
}

#browser-overlay{
  position:fixed;
  inset:0;
  z-index:100;
  display:none;
  background:rgba(0,0,0,.88);
  padding:
    max(10px,env(safe-area-inset-top))
    max(8px,env(safe-area-inset-right))
    max(10px,env(safe-area-inset-bottom))
    max(8px,env(safe-area-inset-left));
}

#browser-overlay.open{
  display:flex;
  flex-direction:column;
}

#browser-bar{
  width:100%;
  min-height:52px;
  display:flex;
  align-items:center;
  gap:7px;
  padding:6px;
  border-radius:14px;
  background:rgba(35,35,35,.96);
}

.browser-btn{
  width:38px;
  height:38px;
  flex:0 0 38px;
  border:0;
  border-radius:10px;
  background:#444;
  color:white;
  font-size:18px;
  touch-action:manipulation;
  cursor:pointer;
}

#browser-url{
  flex:1;
  min-width:0;
  height:38px;
  border:0;
  outline:none;
  border-radius:10px;
  padding:0 12px;
  background:#fff;
  color:#111;
  font-size:15px;
  -webkit-user-select:text;
  user-select:text;
}

#browser-frame-wrap{
  position:relative;
  flex:1;
  min-height:0;
  margin-top:7px;
  overflow:hidden;
  border-radius:14px;
  background:white;
}

#browser-frame{
  width:100%;
  height:100%;
  border:0;
  background:white;
}

#browser-warning{
  position:absolute;
  left:12px;
  right:12px;
  bottom:12px;
  padding:10px 12px;
  border-radius:10px;
  background:rgba(0,0,0,.75);
  color:white;
  font-size:12px;
  line-height:1.4;
  pointer-events:none;
  opacity:.85;
}
</style>

<script type="importmap">
{
  "imports":{
    "three":"https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>

<body>

<div id="game-container"></div>

<div id="loading">Đang dựng khuôn viên trường 3D...</div>

<div id="screen-hint">Chạm chính xác vào màn hình kính để mở</div>

<div id="joystick-wrapper" class="glass-ui">
  <div id="joystick-stick"></div>
</div>

<div id="jump-btn" class="glass-ui">
  <svg viewBox="0 0 24 24">
    <path d="M12 19V5"></path>
    <path d="M5 12l7-7 7 7"></path>
  </svg>
</div>

<div id="browser-overlay">
  <div id="browser-bar">
    <button class="browser-btn" id="browser-back">‹</button>
    <button class="browser-btn" id="browser-forward">›</button>

    <input
      id="browser-url"
      type="url"
      inputmode="url"
      autocomplete="off"
      autocapitalize="none"
      spellcheck="false"
      placeholder="Tìm kiếm với DuckDuckGo hoặc nhập địa chỉ web"
      value="https://duckduckgo.com"
    >

    <button class="browser-btn" id="browser-go">↵</button>
    <button class="browser-btn" id="browser-close">×</button>
  </div>

  <div id="browser-frame-wrap">
    <iframe
      id="browser-frame"
      title="Trình duyệt DuckDuckGo"
      src="https://duckduckgo.com"
      allow="autoplay; fullscreen; picture-in-picture; encrypted-media"
      allowfullscreen>
    </iframe>

    <div id="browser-warning">
      Một số website không cho phép hiển thị bên trong iframe do chính sách bảo mật X-Frame-Options.
    </div>
  </div>
</div>

<script type="module">
import * as THREE from "three";

// ============================================================
// SCENE & RENDERER
// ============================================================

const container = document.getElementById("game-container");
const loading = document.getElementById("loading");

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x8fd4f5);
scene.fog = new THREE.FogExp2(0xbfeafa, 0.0012);

const cameraPivot = new THREE.Object3D();
scene.add(cameraPivot);

const camera = new THREE.PerspectiveCamera(
  60,
  window.innerWidth / window.innerHeight,
  0.1,
  3000
);
camera.position.set(0, 15, 45);
camera.lookAt(0, 10, 0);
cameraPivot.add(camera);

const renderer = new THREE.WebGLRenderer({
  antialias: true,
  powerPreference: "high-performance"
});

renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;

container.appendChild(renderer.domElement);

// ============================================================
// LIGHTING & MATERIALS
// ============================================================

const hemisphere = new THREE.HemisphereLight(0xe8f8ff, 0x516b3b, 1.5);
scene.add(hemisphere);

const sunlight = new THREE.DirectionalLight(0xfff3d2, 2.2);
sunlight.position.set(100, 130, 80);
sunlight.castShadow = true;
scene.add(sunlight);

const MAT = {
  redTile: new THREE.MeshStandardMaterial({ color: 0xa94c3d, roughness: .78 }),
  yellow: new THREE.MeshStandardMaterial({ color: 0xe7d16a, roughness: .8 }),
  darkMetal: new THREE.MeshStandardMaterial({ color: 0x30383b, roughness: .55, metalness: .65 }),
  glass: new THREE.MeshPhysicalMaterial({ color: 0x76b9d2, roughness: .08, transparent: true, opacity: .68 })
};

const sharedBoxGeo = new THREE.BoxGeometry(1, 1, 1);

function box(w, h, d, x, y, z, material, parent = scene) {
  const mesh = new THREE.Mesh(sharedBoxGeo, material);
  mesh.scale.set(w, h, d);
  mesh.position.set(x, y, z);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  parent.add(mesh);
  return mesh;
}

// ============================================================
// CAMPUS & INTERACTIVE SCREEN
// ============================================================

const campus = new THREE.Group();
scene.add(campus);

box(2500, 1, 2500, 0, -0.7, 0, new THREE.MeshStandardMaterial({ color: 0x73b951 }), campus);
box(240, .45, 190, 0, 0, 0, MAT.redTile, campus);

const interactiveScreen = box(12, 7, 0.5, 0, 5, -20, MAT.glass, campus);

// ============================================================
// AUDIO (AUDIO CONTEXT SYNTHESIZER FOR FIREWORKS)
// ============================================================

let audioCtx = null;

function initAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (audioCtx.state === 'suspended') {
    audioCtx.resume();
  }
}

function playLaunchSound() {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(150, audioCtx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(600, audioCtx.currentTime + 0.3);
  gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + 0.3);
}

function playExplosionSound() {
  if (!audioCtx) return;
  const bufferSize = audioCtx.sampleRate * 0.4;
  const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i = 0; i < bufferSize; i++) {
    data[i] = Math.random() * 2 - 1;
  }
  const noise = audioCtx.createBufferSource();
  noise.buffer = buffer;

  const filter = audioCtx.createBiquadFilter();
  filter.type = 'lowpass';
  filter.frequency.setValueAtTime(800, audioCtx.currentTime);
  filter.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + 0.4);

  const gain = audioCtx.createGain();
  gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);

  noise.connect(filter);
  filter.connect(gain);
  gain.connect(audioCtx.destination);
  noise.start();
}

// ============================================================
// OPTIMIZED HIGH-PERFORMANCE FIREWORKS SYSTEM
// ============================================================

const PARTICLE_COUNT = 60;
const FIREWORK_COLORS = [0xff2244, 0x33ff55, 0x3388ff, 0xffff33, 0xff33ff, 0x00ffff, 0xffaa00];

function createCircleTexture() {
  const canvas = document.createElement('canvas');
  canvas.width = 32;
  canvas.height = 32;
  const ctx = canvas.getContext('2d');
  const gradient = ctx.createRadialGradient(16, 16, 0, 16, 16, 16);
  gradient.addColorStop(0, 'rgba(255,255,255,1)');
  gradient.addColorStop(0.4, 'rgba(255,255,255,0.8)');
  gradient.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = gradient;
  ctx.beginPath();
  ctx.arc(16, 16, 16, 0, Math.PI * 2);
  ctx.fill();
  return new THREE.CanvasTexture(canvas);
}

const particleTexture = createCircleTexture();
const fireworks = [];

class Firework {
  constructor() {
    // Vị trí bắn ngẫu nhiên xung quanh sân trường (bán kính 40 - 90)
    const angle = Math.random() * Math.PI * 2;
    const radius = 40 + Math.random() * 50;
    this.startX = Math.cos(angle) * radius;
    this.startZ = Math.sin(angle) * radius;
    this.startY = 0;
    
    // Độ cao nổ vừa tầm nhìn (25 - 40)
    this.targetY = 25 + Math.random() * 15;
    this.currentY = this.startY;
    this.speed = 0.5 + Math.random() * 0.3;
    
    this.state = 'launching'; // 'launching', 'exploded', 'dead'
    
    // Tạo Rocket Vệt Bay
    const rocketGeo = new THREE.BufferGeometry();
    rocketGeo.setAttribute('position', new THREE.Float32BufferAttribute([this.startX, this.startY, this.startZ], 3));
    const rocketMat = new THREE.PointsMaterial({
      color: 0xffffff,
      size: 1.2,
      map: particleTexture,
      transparent: true,
      blending: THREE.AdditiveBlending,
      depthWrite: false
    });
    this.rocket = new THREE.Points(rocketGeo, rocketMat);
    scene.add(this.rocket);

    playLaunchSound();
  }

  explode() {
    scene.remove(this.rocket);
    this.rocket.geometry.dispose();
    this.rocket.material.dispose();

    this.state = 'exploded';
    this.color = FIREWORK_COLORS[Math.floor(Math.random() * FIREWORK_COLORS.length)];
    
    const positions = new Float32Array(PARTICLE_COUNT * 3);
    this.velocities = [];

    for (let i = 0; i < PARTICLE_COUNT; i++) {
      positions[i * 3] = this.startX;
      positions[i * 3 + 1] = this.currentY;
      positions[i * 3 + 2] = this.startZ;

      // Hướng tỏa ra hình cầu đẹp mắt
      const theta = Math.random() * Math.PI * 2;
      const phi = Math.acos((Math.random() * 2) - 1);
      const spd = 0.3 + Math.random() * 0.4;

      this.velocities.push(new THREE.Vector3(
        Math.sin(phi) * Math.cos(theta) * spd,
        Math.sin(phi) * Math.sin(theta) * spd,
        Math.cos(phi) * spd
      ));
    }

    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));

    const mat = new THREE.PointsMaterial({
      color: this.color,
      size: 1.8,
      map: particleTexture,
      transparent: true,
      opacity: 1.0,
      blending: THREE.AdditiveBlending,
      depthWrite: false
    });

    this.particles = new THREE.Points(geo, mat);
    scene.add(this.particles);

    playExplosionSound();
  }

  update() {
    if (this.state === 'launching') {
      this.currentY += this.speed;
      const pos = this.rocket.geometry.attributes.position.array;
      pos[1] = this.currentY;
      this.rocket.geometry.attributes.position.needsUpdate = true;

      if (this.currentY >= this.targetY) {
        this.explode();
      }
    } else if (this.state === 'exploded') {
      const pos = this.particles.geometry.attributes.position.array;
      
      for (let i = 0; i < PARTICLE_COUNT; i++) {
        pos[i * 3] += this.velocities[i].x;
        pos[i * 3 + 1] += this.velocities[i].y;
        pos[i * 3 + 2] += this.velocities[i].z;

        // Trọng lực kéo nhẹ hạt xuống
        this.velocities[i].y -= 0.008;
        this.velocities[i].multiplyScalar(0.98); // Lực cản không khí
      }

      this.particles.geometry.attributes.position.needsUpdate = true;
      this.particles.material.opacity -= 0.015;

      if (this.particles.material.opacity <= 0) {
        this.state = 'dead';
        scene.remove(this.particles);
        this.particles.geometry.dispose();
        this.particles.material.dispose();
      }
    }
  }
}

// ============================================================
// OVERLAY & UI LOGIC
// ============================================================

const browserOverlay = document.getElementById("browser-overlay");
const browserClose = document.getElementById("browser-close");
const browserUrl = document.getElementById("browser-url");
const browserFrame = document.getElementById("browser-frame");
const browserGo = document.getElementById("browser-go");
const screenHint = document.getElementById("screen-hint");

function openBrowser() {
  browserOverlay.classList.add("open");
}

function closeBrowser() {
  browserOverlay.classList.remove("open");
}

browserClose.addEventListener("click", closeBrowser);

browserGo.addEventListener("click", () => {
  let url = browserUrl.value.trim();
  if (!url.startsWith("http://") && !url.startsWith("https://")) {
    url = "https://" + url;
  }
  browserFrame.src = url;
});

// Xử lý chạm mở âm thanh và tương tác
let pointerStartX = 0;
let pointerStartY = 0;

window.addEventListener("pointerdown", (e) => {
  initAudio();
  pointerStartX = e.clientX;
  pointerStartY = e.clientY;
});

const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();

window.addEventListener("pointerup", (e) => {
  const diffX = Math.abs(e.clientX - pointerStartX);
  const diffY = Math.abs(e.clientY - pointerStartY);

  if (diffX < 5 && diffY < 5) {
    mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
    mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

    raycaster.setFromCamera(mouse, camera);
    const intersects = raycaster.intersectObject(interactiveScreen);

    if (intersects.length > 0) {
      openBrowser();
    }
  }
});

// Hide loading screen
setTimeout(() => {
  loading.style.display = "none";
  screenHint.classList.add("show");
  setTimeout(() => screenHint.classList.remove("show"), 4000);
}, 1000);

// ============================================================
// RENDER LOOP
// ============================================================

let lastFireworkTime = 0;

function animate(time) {
  requestAnimationFrame(animate);

  // Xoay nhẹ góc nhìn
  cameraPivot.rotation.y += 0.0015;

  // Bắn pháo hoa liên tục mỗi 0.8 - 1.2 giây
  if (time - lastFireworkTime > 800 + Math.random() * 400) {
    fireworks.push(new Firework());
    lastFireworkTime = time;
  }

  // Cập nhật pháo hoa
  for (let i = fireworks.length - 1; i >= 0; i--) {
    fireworks[i].update();
    if (fireworks[i].state === 'dead') {
      fireworks.splice(i, 1);
    }
  }

  renderer.render(scene, camera);
}

window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

animate(0);
</script>

</body>
</html>
