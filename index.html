<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D School - YouTube Screen Simulation</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            font-family: Arial, sans-serif;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
        }
        /* Phông nền đen chứa iframe YouTube ẩn dùng để phát âm thanh */
        #youtube-player-container {
            position: absolute;
            top: -9999px;
            left: -9999px;
            width: 1px;
            height: 1px;
            opacity: 0;
            pointer-events: none;
        }
        /* Giao diện điều khiển UI đè lên Canvas */
        #ui-container {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.75);
            padding: 12px 24px;
            border-radius: 30px;
            display: flex;
            align-items: center;
            gap: 15px;
            color: white;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            backdrop-filter: blur(5px);
            z-index: 10;
        }
        button {
            background: #ff0000;
            border: none;
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }
        button:hover {
            background: #cc0000;
        }
        .status-text {
            font-size: 14px;
        }
    </style>
    <!-- Three.js & OrbitControls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <!-- YouTube Iframe Player API -->
    <script src="https://www.youtube.com/iframe_api"></script>
</head>
<body>

    <div id="canvas-container"></div>

    <!-- Container chứa YouTube Iframe (Âm thanh thực tế) -->
    <div id="youtube-player-container">
        <div id="yt-player"></div>
    </div>

    <!-- Thanh điều khiển trên màn hình -->
    <div id="ui-container">
        <button id="btn-play-pause">Phát / Tạm dừng</button>
        <span class="status-text" id="status">Trạng thái: Đang tải...</span>
    </div>

    <script>
        // --- 1. CẤU HÌNH THREE.JS SCENE ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a24);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 5, 12);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.shadowMap.enabled = true;
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxPolarAngle = Math.PI / 2 - 0.01;

        // --- 2. ÁNH SÁNG (LIGHTS) ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(10, 20, 10);
        dirLight.castShadow = true;
        scene.add(dirLight);

        // Sàn trường học
        const floorGeo = new THREE.PlaneGeometry(30, 30);
        const floorMat = new THREE.MeshStandardMaterial({ color: 0x333344, roughness: 0.8 });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        floor.receiveShadow = true;
        scene.add(floor);

        // Khung trường học đơn giản làm ngữ cảnh
        const wallMat = new THREE.MeshStandardMaterial({ color: 0xdddddd });
        const backWall = new THREE.Mesh(new THREE.BoxGeometry(20, 8, 0.5), wallMat);
        backWall.position.set(0, 4, -5);
        scene.add(backWall);

        // --- 3. MÀN HÌNH 3D & CANVAS MÔ PHỎNG YOUTUBE ---
        // Tạo Canvas 2D để vẽ giao diện Video + Hiệu ứng đồ họa phát nhạc
        const videoCanvas = document.createElement('canvas');
        videoCanvas.width = 1024;
        videoCanvas.height = 576;
        const ctx = videoCanvas.getContext('2d');

        // Tạo Texture từ Canvas 2D
        const screenTexture = new THREE.CanvasTexture(videoCanvas);

        // Tạo Mesh Màn hình TV 3D
        const screenGeo = new THREE.PlaneGeometry(8, 4.5);
        const screenMat = new THREE.MeshBasicMaterial({ map: screenTexture });
        const screenMesh = new THREE.Mesh(screenGeo, screenMat);
        screenMesh.position.set(0, 4.5, -4.7);
        scene.add(screenMesh);

        // Khung TV màu đen xung quanh
        const frameGeo = new THREE.BoxGeometry(8.4, 4.9, 0.2);
        const frameMat = new THREE.MeshStandardMaterial({ color: 0x111111, metalness: 0.8, roughness: 0.2 });
        const frameMesh = new THREE.Mesh(frameGeo, frameMat);
        frameMesh.position.set(0, 4.5, -4.8);
        scene.add(frameMesh);

        // --- 4. TÍCH HỢP YOUTUBE PLAYER & VẼ LÊN CANVAS ---
        let player = null;
        let isPlaying = false;
        let animationFrameId = null;

        // Khởi tạo YouTube Iframe API
        function onYouTubeIframeAPIReady() {
            player = new YT.Player('yt-player', {
                videoId: 'uS3T634gV7U', // ID Video Lo Người Ướt Áo (Ness x QKhanh Remix)
                playerVars: {
                    'autoplay': 0,
                    'controls': 0,
                    'rel': 0
                },
                events: {
                    'onReady': onPlayerReady,
                    'onStateChange': onPlayerStateChange
                }
            });
        }

        function onPlayerReady(event) {
            document.getElementById('status').innerText = "Trạng thái: Sẵn sàng phát";
            drawScreen();
        }

        function onPlayerStateChange(event) {
            if (event.data === YT.PlayerState.PLAYING) {
                isPlaying = true;
                document.getElementById('status').innerText = "Trạng thái: Đang phát nhạc";
                renderScreenLoop();
            } else {
                isPlaying = false;
                if (event.data === YT.PlayerState.PAUSED) {
                    document.getElementById('status').innerText = "Trạng thái: Tạm dừng";
                } else if (event.data === YT.PlayerState.ENDED) {
                    document.getElementById('status').innerText = "Trạng thái: Kết thúc";
                }
                cancelAnimationFrame(animationFrameId);
                drawScreen(); // Vẽ trạng thái dừng
            }
        }

        // Vẽ nội dung mô phỏng giao diện YouTube Video lên Màn hình 3D
        function drawScreen() {
            // Nền màn hình đen
            ctx.fillStyle = "#05050a";
            ctx.fillRect(0, 0, videoCanvas.width, videoCanvas.height);

            // Tiêu đề & Thông tin bài hát
            ctx.fillStyle = "#ffffff";
            ctx.font = "bold 36px Arial";
            ctx.textAlign = "center";
            ctx.fillText("Lo Người Ướt Áo", videoCanvas.width / 2, 120);

            ctx.fillStyle = "#ff0055";
            ctx.font = "bold 28px Arial";
            ctx.fillText("(Ness x QKhanh Remix)", videoCanvas.width / 2, 170);

            // Giả lập sóng nhạc Visualizer sống động khi đang phát
            const time = Date.now() * 0.005;
            const bars = 32;
            const barWidth = 16;
            const startX = (videoCanvas.width - (bars * (barWidth + 8))) / 2;

            for (let i = 0; i < bars; i++) {
                let barHeight = 20;
                if (isPlaying) {
                    barHeight = Math.sin(time + i * 0.3) * 80 + Math.cos(time * 0.5 + i * 0.2) * 50 + 100;
                }
                const x = startX + i * (barWidth + 8);
                const y = 380 - barHeight / 2;

                const gradient = ctx.createLinearGradient(0, y, 0, y + barHeight);
                gradient.addColorStop(0, "#ff0055");
                gradient.addColorStop(1, "#7a00ff");

                ctx.fillStyle = gradient;
                ctx.fillRect(x, y, barWidth, barHeight);
            }

            // Thanh tiến trình giả lập / Trạng thái
            ctx.fillStyle = "#333333";
            ctx.fillRect(100, 480, 824, 10);

            if (player && player.getDuration) {
                const duration = player.getDuration() || 1;
                const currentTime = player.getCurrentTime() || 0;
                const progress = currentTime / duration;
                ctx.fillStyle = "#ff0000";
                ctx.fillRect(100, 480, 824 * progress, 10);
            }

            // Thông báo trạng thái trên màn hình
            ctx.fillStyle = "#aaaaaa";
            ctx.font = "20px Arial";
            ctx.fillText(isPlaying ? "● LIVE AUDIO PLAYING" : "❚❚ PAUSED", videoCanvas.width / 2, 530);

            // Cập nhật Texture cho Three.js
            screenTexture.needsUpdate = true;
        }

        // Vòng lặp cập nhật texture liên tục khi video đang chạy
        function renderScreenLoop() {
            if (isPlaying) {
                drawScreen();
                animationFrameId = requestAnimationFrame(renderScreenLoop);
            }
        }

        // Nút bấm tương tác UI
        document.getElementById('btn-play-pause').addEventListener('click', () => {
            if (!player) return;
            if (isPlaying) {
                player.pauseVideo();
            } else {
                player.playVideo();
            }
        });

        // --- 5. RENDER LOOP THREE.JS ---
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        // Xử lý Resize cửa sổ
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
