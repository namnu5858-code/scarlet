<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini AI Assistant</title>
    <style>
        :root {
            --bg-color: #212121;
            --sidebar-color: #171717;
            --user-msg-bg: #303030;
            --text-color: #ececec;
            --border-color: #383838;
            --input-bg: #2f2f2f;
            --accent-green: #27ae60;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        .app-container {
            display: flex;
            width: 100%;
            height: 100%;
        }

        .main-chat {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100%;
            position: relative;
        }

        /* Header & Bar API Key */
        .header {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--sidebar-color);
            flex-wrap: wrap;
            gap: 10px;
        }

        .header h1 {
            font-size: 15px;
            font-weight: 600;
        }

        .api-key-container {
            display: flex;
            gap: 6px;
            align-items: center;
            width: 100%;
            max-width: 450px;
        }

        .api-key-input {
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 8px 10px;
            border-radius: 6px;
            font-size: 13px;
            flex: 1;
            outline: none;
        }

        .btn-action {
            background-color: #383838;
            color: #fff;
            border: 1px solid var(--border-color);
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            white-space: nowrap;
        }

        .btn-save {
            background-color: #10a37f;
            border-color: #10a37f;
        }

        .status-badge {
            font-size: 11px;
            padding: 4px 6px;
            border-radius: 4px;
            display: none;
            white-space: nowrap;
        }

        .status-badge.active {
            display: inline-block;
            background-color: rgba(39, 174, 96, 0.2);
            color: var(--accent-green);
            border: 1px solid var(--accent-green);
        }

        /* Messages Stream */
        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 15px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .chat-wrapper {
            width: 100%;
            max-width: 768px;
            padding: 0 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .message {
            display: flex;
            gap: 12px;
            line-height: 1.5;
            font-size: 14px;
        }

        .message.user {
            justify-content: flex-end;
        }

        .message-content {
            max-width: 85%;
            border-radius: 16px;
            padding: 10px 14px;
            word-break: break-word;
        }

        .message.user .message-content {
            background-color: var(--user-msg-bg);
            color: var(--text-color);
        }

        .message.assistant .message-content {
            background-color: transparent;
            color: var(--text-color);
            padding-left: 0;
        }

        .avatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: bold;
            flex-shrink: 0;
            background-color: #ab68ff;
            color: #fff;
        }

        /* Input Area */
        .input-container {
            padding: 12px 16px;
            display: flex;
            justify-content: center;
            background-color: var(--bg-color);
        }

        .input-box {
            width: 100%;
            max-width: 768px;
            position: relative;
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 8px 14px;
            display: flex;
            align-items: center;
        }

        textarea {
            width: 100%;
            background: transparent;
            border: none;
            color: var(--text-color);
            font-size: 14px;
            resize: none;
            outline: none;
            max-height: 120px;
            height: 24px;
            line-height: 24px;
        }

        .send-btn {
            background-color: var(--text-color);
            color: #000;
            border: none;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-left: 8px;
            font-weight: bold;
        }

        .loading-dots span {
            animation: blink 1.4s infinite continuous;
            animation-fill-mode: both;
        }
        .loading-dots span:nth-child(2) { animation-delay: .2s; }
        .loading-dots span:nth-child(3) { animation-delay: .4s; }

        @keyframes blink {
            0% { opacity: .2; }
            20% { opacity: 1; }
            100% { opacity: .2; }
        }
    </style>
</head>
<body>

<div class="app-container">
    <div class="main-chat">
        <!-- Header -->
        <div class="header">
            <h1>Gemini ChatGPT</h1>
            <div class="api-key-container">
                <span id="statusBadge" class="status-badge">✓ Đã lưu Key</span>
                <input type="password" id="apiKey" class="api-key-input" placeholder="Dán Gemini API Key..." />
                <button class="btn-action btn-save" onclick="saveApiKey()">Xác nhận</button>
                <button class="btn-action" onclick="clearApiKey()">Xóa</button>
            </div>
        </div>

        <!-- Dynamic Chat Stream -->
        <div class="messages-container" id="messagesContainer">
            <div class="chat-wrapper" id="chatWrapper">
                <div class="message assistant">
                    <div class="avatar">G</div>
                    <div class="message-content" id="welcomeMsg">
                        Xin chào! Hãy dán API Key vào ô phía trên rồi nhấn <b>"Xác nhận"</b> để bắt đầu trò chuyện.
                    </div>
                </div>
            </div>
        </div>

        <!-- Input Bar -->
        <div class="input-container">
            <div class="input-box">
                <textarea id="userInput" placeholder="Gửi tin nhắn cho Gemini..." rows="1" onkeydown="handleKeyDown(event)"></textarea>
                <button id="sendBtn" class="send-btn" onclick="sendMessage()">↑</button>
            </div>
        </div>
    </div>
</div>

<script>
    // Kiểm tra API Key đã lưu trong bộ nhớ trình duyệt chưa
    window.onload = function() {
        const savedKey = localStorage.getItem('GEMINI_API_KEY');
        if (savedKey) {
            document.getElementById('apiKey').value = savedKey;
            showActiveStatus(true);
            document.getElementById('welcomeMsg').innerHTML = 'Hệ thống đã sẵn sàng! Nhập tin nhắn bên dưới để trò chuyện.';
        }
    };

    function saveApiKey() {
        const apiKey = document.getElementById('apiKey').value.trim();
        if (!apiKey) {
            alert('Vui lòng dán API Key trước khi nhấn Xác nhận!');
            return;
        }
        localStorage.setItem('GEMINI_API_KEY', apiKey);
        showActiveStatus(true);
        alert('Đã lưu API Key thành công!');
    }

    function clearApiKey() {
        localStorage.removeItem('GEMINI_API_KEY');
        document.getElementById('apiKey').value = '';
        showActiveStatus(false);
        alert('Đã xóa API Key!');
    }

    function showActiveStatus(isActive) {
        const badge = document.getElementById('statusBadge');
        if (isActive) {
            badge.classList.add('active');
        } else {
            badge.classList.remove('active');
        }
    }

    const textarea = document.getElementById('userInput');
    textarea.addEventListener('input', function() {
        this.style.height = 'auto';
        this.style.height = Math.min(this.scrollHeight, 120) + 'px';
    });

    function handleKeyDown(event) {
        if (event.key === 'Enter' && !event.shiftKey) {
            event.preventDefault();
            sendMessage();
        }
    }

    async function sendMessage() {
        const apiKey = localStorage.getItem('GEMINI_API_KEY') || document.getElementById('apiKey').value.trim();
        const inputField = document.getElementById('userInput');
        const messageText = inputField.value.trim();

        if (!messageText) return;
        if (!apiKey) {
            alert('Bạn chưa lưu API Key! Dán Key vào ô phía trên rồi bấm "Xác nhận".');
            return;
        }

        // 1. Hiển thị tin nhắn người dùng
        appendMessage('user', messageText);
        inputField.value = '';
        inputField.style.height = '24px';

        // 2. Tạo trạng thái Đang phản hồi...
        const loadingId = 'loading-' + Date.now();
        appendLoadingMessage(loadingId);

        try {
            // 3. Gọi Gemini API với URL đã được sửa chính xác (chứa models/gemini-1.5-flash)
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: messageText }] }]
                })
            });

            const data = await response.json();
            const loadingElem = document.getElementById(loadingId);
            if (loadingElem) loadingElem.remove();

            if (data.candidates && data.candidates[0].content.parts[0].text) {
                appendMessage('assistant', data.candidates[0].content.parts[0].text);
            } else if (data.error) {
                appendMessage('assistant', `[Lỗi API]: ${data.error.message}`);
            } else {
                appendMessage('assistant', 'Không nhận được dữ liệu phản hồi từ hệ thống.');
            }

        } catch (error) {
            const loadingElem = document.getElementById(loadingId);
            if (loadingElem) loadingElem.remove();
            appendMessage('assistant', `[Lỗi kết nối]: ${error.message}`);
        }
    }

    function appendMessage(role, content) {
        const chatWrapper = document.getElementById('chatWrapper');
        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${role}`;

        if (role === 'user') {
            msgDiv.innerHTML = `<div class="message-content">${escapeHtml(content)}</div>`;
        } else {
            msgDiv.innerHTML = `
                <div class="avatar">G</div>
                <div class="message-content">${formatText(content)}</div>
            `;
        }

        chatWrapper.appendChild(msgDiv);
        scrollToBottom();
    }

    function appendLoadingMessage(id) {
        const chatWrapper = document.getElementById('chatWrapper');
        const msgDiv = document.createElement('div');
        msgDiv.className = 'message assistant';
        msgDiv.id = id;
        msgDiv.innerHTML = `
            <div class="avatar">G</div>
            <div class="message-content loading-dots">
                Đang xử lý<span>.</span><span>.</span><span>.</span>
            </div>
        `;
        chatWrapper.appendChild(msgDiv);
        scrollToBottom();
    }

    function scrollToBottom() {
        const container = document.getElementById('messagesContainer');
        container.scrollTop = container.scrollHeight;
    }

    function escapeHtml(text) {
        return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    function formatText(text) {
        return escapeHtml(text).replace(/\n/g, '<br>');
    }
</script>

</body>
</html>
