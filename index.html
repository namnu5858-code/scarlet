<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plant Shooter - Web Prototype</title>
    <style>
        body {
            margin: 0;
            background: #1a1a1a;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        #game-container {
            width: 800px;
            height: 450px;
            background: #2e7d32;
            border: 4px solid #4caf50;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: flex-end;
            justify-content: center;
        }
        .ui-panel {
            margin-top: 15px;
            padding: 10px;
            background: #333;
            border-radius: 5px;
            width: 800px;
            box-sizing: border-box;
            display: flex;
            justify-content: space-between;
        }
        button {
            background: #ff9800;
            border: none;
            color: white;
            padding: 8px 15px;
            cursor: pointer;
            font-weight: bold;
            border-radius: 3px;
        }
        button:hover { background: #f57c00; }
        #player {
            width: 50px;
            height: 80px;
            background: #8bc34a;
            position: absolute;
            bottom: 20px;
            left: 100px;
            border-radius: 25px 25px 0 0;
            transition: opacity 0.3s;
        }
        .hidden-effect { opacity: 0.3; }
    </style>
</head>
<body>

    <h1>Plant vs Zombies Style - Web Prototype</h1>
    
    <div id="game-container">
        <div id="player"></div>
    </div>

    <div class="ui-panel">
        <div>
            <strong>Máu (HP):</strong> <span id="hp-val">100</span> | 
            <strong>Trạng thái:</strong> <span id="status-val">Bình thường</span>
        </div>
        <div>
            <button onclick="useSkill(1)">Kỹ năng 1: Bắn Độc</button>
            <button onclick="useSkill(2)">Kỹ năng 2: Hồi Máu</button>
            <button onclick="useSkill(3)">Kỹ năng 3: Tàng Hình</button>
        </div>
    </div>

    <script>
        // Khởi tạo thông tin nhân vật độc quyền
        const player = {
            name: "Peashooter Cơ Khí",
            maxHealth: 100,
            currentHealth: 100,
            isHidden: false
        };

        function updateUI() {
            document.getElementById('hp-val').innerText = player.currentHealth;
            document.getElementById('status-val').innerText = player.isHidden ? "Đang ẩn (Tàng hình)" : "Bình thường";
            
            const playerEl = document.getElementById('player');
            if (player.isHidden) {
                playerEl.classList.add('hidden-effect');
            } else {
                playerEl.classList.remove('hidden-effect');
            }
        }

        // Hệ thống 3 kỹ năng độc quyền khác biệt
        function useSkill(skillId) {
            switch(skillId) {
                case 1:
                    alert(player.name + " sử dụng Kỹ năng 1: Bắn đạn độc lan tỏa!");
                    break;
                case 2:
                    player.currentHealth = Math.min(player.maxHealth, player.currentHealth + 20);
                    alert(player.name + " sử dụng Kỹ năng 2: Hồi phục 20 HP!");
                    break;
                case 3:
                    player.isHidden = !player.isHidden;
                    alert(player.name + " kích hoạt hiệu ứng ẩn: Tàng hình trạng thái!");
                    break;
            }
            updateUI();
        }
    </script>
</body>
</html>
