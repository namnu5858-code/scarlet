<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mô Hình 3D Trường THCS Quảng Oai - Phân Hiệu Cẩm Thượng</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            font-family: Arial, sans-serif;
        }
        #webgl-container {
            width: 100vw;
            height: 100vh;
        }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 20px;
            pointer-events: none;
            background: rgba(0,0,0,0.7);
            padding: 15px 25px;
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <div id="loading">Đang khởi tạo không gian 3D...</div>
    <div id="webgl-container"></div>

    <!-- Import Three.js và OrbitControls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        // -------------------------------------------------------------
        // 1. TẠO TẠO TEXTURE NỀN GẠCH ĐỎ BẰNG CANVAS (CHI TIẾT, SẮC NÉT)
        // -------------------------------------------------------------
        function generateRedTileTexture() {
            const canvas = document.createElement('canvas');
            const size = 1024; // Độ phân giải cao cho độ sắc nét
            canvas.width = size;
            canvas.height = size;
            const ctx = canvas.getContext('2d');

            // Màu nền đất gạch đỏ
            ctx.fillStyle = '#b91c1c';
            ctx.fillRect(0, 0, size, size);

            const gridCount = 16; // Số ô gạch trên mỗi chiều
            const tileSize = size / gridCount;
            const grooveSize = 3; // Độ rộng đường mạch gạch

            for (let i = 0; i < gridCount; i++) {
                for (let j = 0; j < gridCount; j++) {
                    const x = i * tileSize;
                    const y = j * tileSize;

                    // Vẽ viền mạch gạch màu xám ximăng
                    ctx.fillStyle = '#6b7280';
                    ctx.fillRect(x, y, tileSize, tileSize);

                    // Vẽ viên gạch đỏ có tông màu biến thiên nhẹ
                    const colorVariation = Math.floor(Math.random() * 15);
                    const r = 185 + colorVariation;
                    const g = 28 + Math.floor(colorVariation / 2);
                    const b = 28;
                    ctx.fillStyle = `rgb(${r}, ${g}, ${b})`;
                    ctx.fillRect(x + grooveSize, y + grooveSize, tileSize - grooveSize * 2, tileSize - grooveSize * 2);

                    // Họa tiết hoa văn vuông chìm nhẹ trên mặt gạch
                    ctx.strokeStyle = `rgba(0, 0, 0, 0.15)`;
                    ctx.lineWidth = 1.5;
                    const inset = tileSize * 0.2;
                    ctx.strokeRect(x + inset, y + inset, tileSize - inset * 2, tileSize - inset * 2);
                }
            }

            const texture = new THREE.CanvasTexture(canvas);
            texture.wrapS = THREE.RepeatWrapping;
            texture.wrapT = THREE.RepeatWrapping;
            // Chia nhỏ họa tiết và lặp lại đối xứng trên toàn bề mặt sân
            texture.repeat.set(12, 12);
            texture.anisotropy = 16; // Giúp gạch rõ nét khi nhìn ở góc nghiêng
            return texture;
        }

        // -------------------------------------------------------------
        // 2. KHOANH VÙNG VÀ KHỞI TẠO SCENE THREE.JS
        // -------------------------------------------------------------
        const container = document.getElementById('webgl-container');
        const loadingEl = document.getElementById('loading');

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb); // Bầu trời xanh nhạt
        scene.fog = new THREE.FogExp2(0x87ceeb, 0.008);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 35, 65);

        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxPolarAngle = Math.PI / 2 - 0.02; // Không cho camera đi xuống dưới mặt đất

        // -------------------------------------------------------------
        // 3. ÁNH SÁNG (LIGHTING)
        // -------------------------------------------------------------
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xfffbeb, 0.9);
        dirLight.position.set(40, 60, 20);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 2048;
        dirLight.shadow.mapSize.height = 2048;
        dirLight.shadow.camera.near = 0.5;
        dirLight.shadow.camera.far = 150;
        const d = 50;
        dirLight.shadow.camera.left = -d;
        dirLight.shadow.camera.right = d;
        dirLight.shadow.camera.top = d;
        dirLight.shadow.camera.bottom = -d;
        scene.add(dirLight);

        // -------------------------------------------------------------
        // 4. PHỦ TOÀN BỘ NỀN SÂN BẰNG GẠCH ĐỎ (XÓA BỎ VẠCH XANH & HOÀN TOÀN ĐỐI XỨNG)
        // -------------------------------------------------------------
        const tileTexture = generateRedTileTexture();
        const groundGeo = new THREE.PlaneGeometry(100, 80);
        const groundMat = new THREE.MeshStandardMaterial({
            map: tileTexture,
            roughness: 0.6,
            metalness: 0.1
        });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);

        // Cánh đồng lúa xung quanh ngoài khuôn viên sân
        const fieldGeo = new THREE.PlaneGeometry(300, 300);
        const fieldMat = new THREE.MeshLambertMaterial({ color: 0x65a30d });
        const field = new THREE.Mesh(fieldGeo, fieldMat);
        field.rotation.x = -Math.PI / 2;
        field.position.y = -0.1;
        scene.add(field);

        // -------------------------------------------------------------
        // 5. CÁC HẠNG MỤC KIẾN TRÚC TRƯỜNG HỌC
        // -------------------------------------------------------------

        // --- CỔNG TRƯỜNG & HÀNG RÀO ---
        const gateGroup = new THREE.Group();
        
        // Cột cổng sơn vàng kem
        const pillarMat = new THREE.MeshStandardMaterial({ color: 0xfef08a, roughness: 0.5 });
        const pillarGeo = new THREE.BoxGeometry(2, 6, 2);
        
        const pillarLeft = new THREE.Mesh(pillarGeo, pillarMat);
        pillarLeft.position.set(-8, 3, 38);
        pillarLeft.castShadow = true;
        gateGroup.add(pillarLeft);

        const pillarRight = new THREE.Mesh(pillarGeo, pillarMat);
        pillarRight.position.set(8, 3, 38);
        pillarRight.castShadow = true;
        gateGroup.add(pillarRight);

        // Biển tên trường xanh dương
        const signGeo = new THREE.BoxGeometry(14, 1.8, 0.4);
        const signMat = new THREE.MeshStandardMaterial({ color: 0x1d4ed8, roughness: 0.3 });
        const sign = new THREE.Mesh(signGeo, signMat);
        sign.position.set(0, 5.5, 38);
        gateGroup.add(sign);

        // Hàng rào vàng nhạt hai bên
        const wallMat = new THREE.MeshStandardMaterial({ color: 0xfef08a });
        const fenceLeft = new THREE.Mesh(new THREE.BoxGeometry(32, 2.5, 0.6), wallMat);
        fenceLeft.position.set(-25, 1.25, 38);
        gateGroup.add(fenceLeft);

        const fenceRight = new THREE.Mesh(new THREE.BoxGeometry(32, 2.5, 0.6), wallMat);
        fenceRight.position.set(25, 1.25, 38);
        gateGroup.add(fenceRight);

        scene.add(gateGroup);

        // --- TÒA NHÀ A (KHỐI CHÍNH 4 TẦNG: XANH DƯƠNG - TRẮNG) ---
        function createBuildingA() {
            const building = new THREE.Group();

            // Thân nhà chính
            const bodyGeo = new THREE.BoxGeometry(45, 16, 12);
            const bodyMat = new THREE.MeshStandardMaterial({ color: 0x3b82f6, roughness: 0.4 });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.position.set(0, 8, 0);
            body.castShadow = true;
            body.receiveShadow = true;
            building.add(body);

            // Cột và lan can trắng
            const whiteMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.3 });
            const windowFrameMat = new THREE.MeshStandardMaterial({ color: 0x1f2937, roughness: 0.2 });

            // Chia 4 tầng với ban công hành lang & cửa sổ
            for (let floor = 0; floor < 4; floor++) {
                const y = floor * 4 + 0.2;
                
                // Lan can hành lang
                const balconyGeo = new THREE.BoxGeometry(43, 1, 0.3);
                const balcony = new THREE.Mesh(balconyGeo, whiteMat);
                balcony.position.set(0, y + 1, 6.1);
                building.add(balcony);

                // Cửa sổ các phòng
                for (let x = -18; x <= 18; x += 6) {
                    const winGeo = new THREE.BoxGeometry(2.5, 2, 0.2);
                    const win = new THREE.Mesh(winGeo, windowFrameMat);
                    win.position.set(x, y + 2.5, 6.05);
                    building.add(win);
                }
            }

            building.position.set(0, 0, -10);
            return building;
        }
        scene.add(createBuildingA());

        // --- TÒA NHÀ B & CẦU THANG THOÁT HIỂM ---
        function createBuildingB() {
            const buildingB = new THREE.Group();

            // Thân nhà B
            const bodyGeo = new THREE.BoxGeometry(14, 16, 25);
            const bodyMat = new THREE.MeshStandardMaterial({ color: 0x60a5fa });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.position.set(0, 8, 0);
            body.castShadow = true;
            buildingB.add(body);

            // Cầu thang thoát hiểm ngoài trời bằng thép
            const stairMat = new THREE.MeshStandardMaterial({ color: 0x374151, metalness: 0.8, roughness: 0.2 });
            const stairGroup = new THREE.Group();

            for (let f = 0; f < 4; f++) {
                const stepGeo = new THREE.BoxGeometry(3, 0.2, 4);
                const step = new THREE.Mesh(stepGeo, stairMat);
                step.position.set(0, f * 4 + 2, 13 + f * 0.5);
                stairGroup.add(step);
            }

            // Mái che cầu thang xanh lá cây
            const roofGeo = new THREE.BoxGeometry(4, 0.3, 6);
            const roofMat = new THREE.MeshStandardMaterial({ color: 0x15803d, roughness: 0.3 });
            const roof = new THREE.Mesh(roofGeo, roofMat);
            roof.position.set(0, 17, 14);
            stairGroup.add(roof);

            buildingB.add(stairGroup);
            buildingB.position.set(32, 0, 5);
            return buildingB;
        }
        scene.add(createBuildingB());

        // --- BỒN CÂY VÀ CÂY BÓNG MÁT TRÊN SÂN ---
        function createTrees() {
            const treePositions = [
                { x: -18, z: 12 },
                { x: 18, z: 12 },
                { x: -18, z: 26 },
                { x: 18, z: 26 }
            ];

            const potMat = new THREE.MeshStandardMaterial({ color: 0xfef08a });
            const trunkMat = new THREE.MeshStandardMaterial({ color: 0x78350f, roughness: 0.9 });
            const leavesMat = new THREE.MeshStandardMaterial({ color: 0x16a34a, roughness: 0.6 });

            treePositions.forEach(pos => {
                const treeGroup = new THREE.Group();

                // Bồn cây tròn sơn vàng
                const potGeo = new THREE.CylinderGeometry(2.2, 2.2, 0.8, 24);
                const pot = new THREE.Mesh(potGeo, potMat);
                pot.position.y = 0.4;
                pot.castShadow = true;
                treeGroup.add(pot);

                // Thân cây
                const trunkGeo = new THREE.CylinderGeometry(0.4, 0.6, 6, 12);
                const trunk = new THREE.Mesh(trunkGeo, trunkMat);
                trunk.position.y = 3.4;
                trunk.castShadow = true;
                treeGroup.add(trunk);

                // Tán lá
                const leavesGeo = new THREE.DodecahedronGeometry(3, 1);
                const leaves = new THREE.Mesh(leavesGeo, leavesMat);
                leaves.position.y = 6.5;
                leaves.castShadow = true;
                treeGroup.add(leaves);

                treeGroup.position.set(pos.x, 0, pos.z);
                scene.add(treeGroup);
            });
        }
        createTrees();

        // --- LÁN XE KHUNG THÉP MÁI TÔN XANH LÁ ---
        function createParkingShed() {
            const shed = new THREE.Group();
            
            // Mái tôn xanh lá đậm
            const roofGeo = new THREE.BoxGeometry(6, 0.2, 30);
            const roofMat = new THREE.MeshStandardMaterial({ color: 0x166534, metalness: 0.4, roughness: 0.3 });
            const roof = new THREE.Mesh(roofGeo, roofMat);
            roof.position.set(0, 3.5, 0);
            roof.rotation.z = 0.1; // Độ dốc mái nhẹ
            roof.castShadow = true;
            shed.add(roof);

            // Khung thép chống
            const steelMat = new THREE.MeshStandardMaterial({ color: 0x9ca3af, metalness: 0.8 });
            for (let z = -12; z <= 12; z += 8) {
                const poleGeo = new THREE.CylinderGeometry(0.1, 0.1, 3.5);
                const pole = new THREE.Mesh(poleGeo, steelMat);
                pole.position.set(2, 1.75, z);
                shed.add(pole);
            }

            shed.position.set(-38, 0, 10);
            return shed;
        }
        scene.add(createParkingShed());

        // Ẩn văn bản Loading sau khi hoàn tất
        loadingEl.style.display = 'none';

        // -------------------------------------------------------------
        // 6. RENDER LOOP & RESPONSIVE
        // -------------------------------------------------------------
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
