<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Canvas with High-Res Interactive Web Screen</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            font-family: Arial, sans-serif;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
        }
        /* Iframe overlay mô phỏng màn hình duyệt web độ phân giải cao */
        #web-screen-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80vw;
            height: 45vw; /* Tỉ lệ 16:9 */
            max-width: 1280px;
            max-height: 720px;
            border: 4px solid #333;
            border-radius: 12px;
            box-shadow: 0 0 30px rgba(0, 255, 200, 0.3);
            background: #111;
            overflow: hidden;
            z-index: 10;
        }
        #web-iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
    <!-- Import Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <div id="canvas-container"></div>

    <!-- Màn hình duyệt web lớn, độ phân giải cao đặt ở trung tâm -->
    <div id="web-screen-container">
        <iframe id="web-iframe" src="https://html5test.com/" title="DuckDuckGo Search Browser"></iframe>
    </div>

    <script>
        // 1. Khởi tạo Scene, Camera, Renderer
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a1a);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 2, 8);

        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); // Tối ưu chất lượng hiển thị cao
        container.appendChild(renderer.domElement);

        // Controls
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        // 2. Ánh sáng
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(5, 10, 7);
        scene.add(dirLight);

        // 3. Tạo khung viền màn hình 3D phía sau làm chân đế/khung nhôm
        const screenWidth = 7.1;
        const screenHeight = 4.0;
        const frameGeometry = new THREE.BoxGeometry(screenWidth + 0.2, screenHeight + 0.2, 0.1);
        const frameMaterial = new THREE.MeshStandardMaterial({ color: 0x222222, metalness: 0.8, roughness: 0.2 });
        const screenFrame = new THREE.Mesh(frameGeometry, frameMaterial);
        screenFrame.position.set(0, 0, -0.05);
        scene.add(screenFrame);

        // Tạo sàn lưới trang trí 3D
        const gridHelper = new THREE.GridHelper(20, 20, 0x00ffcc, 0x444444);
        gridHelper.position.y = -2.5;
        scene.add(gridHelper);

        // 4. Resize event
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // 5. Animation Loop
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
