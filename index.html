<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>Vampire Sunflower 3D Game</title>

<style>
*{
  box-sizing:border-box;
  -webkit-user-select:none;
  user-select:none;
  -webkit-touch-callout:none;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#72c9f5;
  touch-action:none;
}

#game-container{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
}

canvas{
  display:block;
}

.glass-ui{
  background:rgba(255,255,255,.18);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  border:1px solid rgba(255,255,255,.38);
  box-shadow:0 8px 32px rgba(0,0,0,.15);
}

#joystick-wrapper{
  position:absolute;
  left:32px;
  bottom:32px;
  width:120px;
  height:120px;
  border-radius:50%;
  display:flex;
  justify-content:center;
  align-items:center;
  z-index:20;
  touch-action:none;
}

#joystick-stick{
  position:absolute;
  width:52px;
  height:52px;
  border-radius:50%;
  background:rgba(255,255,255,.55);
  border:1px solid rgba(255,255,255,.8);
  pointer-events:none;
}

#jump-btn{
  position:absolute;
  right:32px;
  bottom:38px;
  width:72px;
  height:72px;
  border-radius:50%;
  display:flex;
  justify-content:center;
  align-items:center;
  z-index:20;
  touch-action:none;
}

#jump-btn:active{
  transform:scale(.94);
}

#jump-btn svg{
  width:34px;
  height:34px;
  fill:none;
  stroke:white;
  stroke-width:2.5;
  stroke-linecap:round;
  stroke-linejoin:round;
}

#loading{
  position:absolute;
  top:14px;
  left:50%;
  transform:translateX(-50%);
  padding:8px 14px;
  border-radius:12px;
  background:rgba(0,0,0,.4);
  color:white;
  font-size:13px;
  z-index:30;
  pointer-events:none;
}
</style>

<script type="importmap">
{
  "imports":{
    "three":"https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>

<body>

<div id="game-container"></div>

<div id="loading">
Đang tải mô hình 3D...
</div>

<div id="joystick-wrapper" class="glass-ui">
  <div id="joystick-stick"></div>
</div>

<div id="jump-btn" class="glass-ui">
  <svg viewBox="0 0 24 24">
    <path d="M12 19V5"></path>
    <path d="M5 12l7-7 7 7"></path>
  </svg>
</div>

<script type="module">

import * as THREE from "three";
import {GLTFLoader} from "three/addons/loaders/GLTFLoader.js";


// ============================================================
// SCENE
// ============================================================

const container=document.getElementById("game-container");
const loading=document.getElementById("loading");

const scene=new THREE.Scene();


// ============================================================
// BẦU TRỜI 3D
// ============================================================

scene.background=new THREE.Color(0x79c9f5);

scene.fog=new THREE.FogExp2(
  0xb9e7fa,
  0.0045
);


// ============================================================
// CAMERA
// ============================================================

const cameraPivot=new THREE.Object3D();

scene.add(cameraPivot);

const camera=new THREE.PerspectiveCamera(
  60,
  window.innerWidth/window.innerHeight,
  0.1,
  1500
);

cameraPivot.add(camera);

let cameraDistance=6;
let cameraAngleX=0.18;
let cameraAngleY=0;

function updateCamera(){

  cameraPivot.rotation.y=cameraAngleY;
  cameraPivot.rotation.x=cameraAngleX;

  camera.position.set(
    0,
    0,
    cameraDistance
  );

  camera.lookAt(
    cameraPivot.position
  );
}


// ============================================================
// RENDERER
// ============================================================

const renderer=new THREE.WebGLRenderer({
  antialias:true,
  powerPreference:"high-performance"
});

renderer.setSize(
  window.innerWidth,
  window.innerHeight
);

renderer.setPixelRatio(
  Math.min(window.devicePixelRatio,2)
);

renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;

renderer.outputColorSpace=THREE.SRGBColorSpace;

renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.15;

container.appendChild(renderer.domElement);


// ============================================================
// ÁNH SÁNG BẦU TRỜI
// ============================================================

const ambient=new THREE.HemisphereLight(
  0xdff5ff,
  0x426b35,
  1.35
);

scene.add(ambient);


const sunlight=new THREE.DirectionalLight(
  0xfff4d0,
  2.0
);

sunlight.position.set(
  80,
  100,
  50
);

sunlight.castShadow=true;

sunlight.shadow.mapSize.width=2048;
sunlight.shadow.mapSize.height=2048;

sunlight.shadow.camera.near=0.5;
sunlight.shadow.camera.far=250;

sunlight.shadow.camera.left=-80;
sunlight.shadow.camera.right=80;
sunlight.shadow.camera.top=80;
sunlight.shadow.camera.bottom=-80;

sunlight.shadow.bias=-0.0002;

scene.add(sunlight);


// ============================================================
// MẶT TRỜI
// ============================================================

const sunMesh=new THREE.Mesh(
  new THREE.SphereGeometry(14,32,32),
  new THREE.MeshBasicMaterial({
    color:0xfff3a1
  })
);

sunMesh.position.set(
  -100,
  85,
  -180
);

scene.add(sunMesh);


// ============================================================
// VÒNG HÀO QUANG MẶT TRỜI
// ============================================================

const sunGlow=new THREE.Mesh(
  new THREE.SphereGeometry(21,32,32),
  new THREE.MeshBasicMaterial({
    color:0xffe9a0,
    transparent:true,
    opacity:0.16,
    depthWrite:false
  })
);

sunGlow.position.copy(
  sunMesh.position
);

scene.add(sunGlow);


// ============================================================
// MÂY 3D
// ============================================================

const clouds=[];

function createCloud(x,y,z,scale){

  const cloud=new THREE.Group();

  const material=new THREE.MeshStandardMaterial({
    color:0xffffff,
    roughness:1,
    transparent:true,
    opacity:0.82
  });

  const pieces=[
    [-3,0,0,2.4],
    [0,0.5,0,3.2],
    [3,0,0,2.2],
    [1.2,1.1,0,2.1],
    [-1.4,1,0,1.9]
  ];

  pieces.forEach(function(p){

    const part=new THREE.Mesh(
      new THREE.SphereGeometry(
        p[3],
        20,
        16
      ),
      material
    );

    part.position.set(
      p[0],
      p[1],
      p[2]
    );

    cloud.add(part);

  });

  cloud.position.set(x,y,z);
  cloud.scale.setScalar(scale);

  scene.add(cloud);

  clouds.push({
    object:cloud,
    speed:0.7+Math.random()*0.7
  });
}


createCloud(-80,55,-100,1.5);
createCloud(20,65,-160,1.9);
createCloud(100,48,-90,1.3);
createCloud(-140,42,20,1.2);
createCloud(130,70,70,1.5);


// ============================================================
// MẶT ĐẤT PHẲNG
// ============================================================

const ground=new THREE.Mesh(
  new THREE.PlaneGeometry(
    1000,
    1000
  ),
  new THREE.MeshStandardMaterial({
    color:0x4e9f3d,
    roughness:0.85,
    metalness:0
  })
);

ground.rotation.x=-Math.PI/2;

ground.receiveShadow=true;

scene.add(ground);


// ============================================================
// PLAYER
// ============================================================

const player=new THREE.Group();

scene.add(player);


// ============================================================
// MODEL
// ============================================================

let model=null;

const leafMeshes=[];
const armMeshes=[];
const rootMeshes=[];
const bodyMeshes=[];

const initialData=new Map();

const loader=new GLTFLoader();

loader.load(
  "scene.gltf",

  function(gltf){

    model=gltf.scene;

    model.traverse(function(object){

      if(!object.isMesh)return;

      object.castShadow=true;
      object.receiveShadow=true;

      object.frustumCulled=true;

      initialData.set(
        object,
        {
          position:object.position.clone(),
          rotation:object.rotation.clone(),
          scale:object.scale.clone()
        }
      );

      const name=
        object.name.toLowerCase();


      // ------------------------------------------------------
      // NHẬN DIỆN LÁ
      // ------------------------------------------------------

      if(
        name.includes("leaf") ||
        name.includes("leaves") ||
        name.includes("leaf_") ||
        name.includes("la") ||
        name.includes("foliage") ||
        name.includes("green") ||
        name.includes("leaflet")
      ){

        leafMeshes.push(object);

      }


      // ------------------------------------------------------
      // TAY
      // ------------------------------------------------------

      if(
        name.includes("arm") ||
        name.includes("hand") ||
        name.includes("tay")
      ){

        armMeshes.push(object);

      }


      // ------------------------------------------------------
      // RỄ
      // ------------------------------------------------------

      if(
        name.includes("root") ||
        name.includes("rễ") ||
        name.includes("re")
      ){

        rootMeshes.push(object);

      }


      // ------------------------------------------------------
      // THÂN
      // ------------------------------------------------------

      if(
        !name.includes("leaf") &&
        !name.includes("arm") &&
        !name.includes("hand") &&
        !name.includes("root")
      ){

        bodyMeshes.push(object);

      }

    });


    player.add(model);

    loading.style.display="none";

  },

  undefined,

  function(error){

    console.error(error);

    loading.textContent=
      "Không tìm thấy scene.gltf";

  }
);


// ============================================================
// DI CHUYỂN
// ============================================================

const input=new THREE.Vector2(0,0);

const velocity=new THREE.Vector3(0,0,0);

const moveSpeed=6;

const gravity=-20;

let grounded=true;


// ============================================================
// ANIMATION
// ============================================================

let animationTime=0;

let animationBlend=0;


// ============================================================
// JOYSTICK
// ============================================================

const joystick=document.getElementById(
  "joystick-wrapper"
);

const stick=document.getElementById(
  "joystick-stick"
);

let joystickTouch=null;

let centerX=0;
let centerY=0;

const radius=40;


joystick.addEventListener(
  "touchstart",
  function(event){

    event.preventDefault();

    const touch=event.changedTouches[0];

    joystickTouch=touch.identifier;

    const rect=
      joystick.getBoundingClientRect();

    centerX=
      rect.left+
      rect.width/2;

    centerY=
      rect.top+
      rect.height/2;

    updateJoystick(touch);

  },
  {passive:false}
);


function updateJoystick(touch){

  const dx=
    touch.clientX-centerX;

  const dy=
    touch.clientY-centerY;

  const distance=
    Math.hypot(dx,dy);

  const angle=
    Math.atan2(dy,dx);

  const limited=
    Math.min(distance,radius);

  const x=
    Math.cos(angle)*limited;

  const y=
    Math.sin(angle)*limited;

  stick.style.transform=
    `translate(${x}px,${y}px)`;

  input.x=x/radius;

  input.y=-y/radius;

}


function resetJoystick(){

  joystickTouch=null;

  input.set(0,0);

  stick.style.transform=
    "translate(0px,0px)";
}


window.addEventListener(
  "touchmove",
  function(event){

    for(
      let i=0;
      i<event.changedTouches.length;
      i++
    ){

      const touch=
        event.changedTouches[i];

      if(
        touch.identifier===
        joystickTouch
      ){

        updateJoystick(touch);

      }

    }

  },
  {passive:false}
);


window.addEventListener(
  "touchend",
  function(event){

    for(
      let i=0;
      i<event.changedTouches.length;
      i++
    ){

      if(
        event.changedTouches[i].identifier===
        joystickTouch
      ){

        resetJoystick();

      }

    }

  }
);


window.addEventListener(
  "touchcancel",
  resetJoystick
);


// ============================================================
// JUMP
// ============================================================

const jump=document.getElementById(
  "jump-btn"
);

jump.addEventListener(
  "touchstart",
  function(event){

    event.preventDefault();

    if(grounded){

      velocity.y=8;

      grounded=false;

    }

  },
  {passive:false}
);


// ============================================================
// CAMERA TOUCH
// ============================================================

let cameraTouch=null;

let lastX=0;
let lastY=0;

let pinchDistance=0;


window.addEventListener(
  "touchstart",
  function(event){

    if(event.touches.length===2){

      pinchDistance=
        Math.hypot(
          event.touches[0].clientX-
          event.touches[1].clientX,

          event.touches[0].clientY-
          event.touches[1].clientY
        );

      return;

    }

    const touch=
      event.changedTouches[0];

    if(
      touch.clientX>
      window.innerWidth/3 &&
      joystickTouch===null
    ){

      cameraTouch=
        touch.identifier;

      lastX=touch.clientX;
      lastY=touch.clientY;

    }

  }
);


window.addEventListener(
  "touchmove",
  function(event){

    if(event.touches.length===2){

      const current=
        Math.hypot(
          event.touches[0].clientX-
          event.touches[1].clientX,

          event.touches[0].clientY-
          event.touches[1].clientY
        );

      const difference=
        pinchDistance-current;

      cameraDistance+=
        difference*0.02;

      cameraDistance=
        THREE.MathUtils.clamp(
          cameraDistance,
          1.5,
          12
        );

      pinchDistance=current;

      return;

    }


    for(
      let i=0;
      i<event.changedTouches.length;
      i++
    ){

      const touch=
        event.changedTouches[i];

      if(
        touch.identifier===
        cameraTouch
      ){

        const dx=
          touch.clientX-lastX;

        const dy=
          touch.clientY-lastY;

        cameraAngleY-=
          dx*0.008;

        cameraAngleX=
          THREE.MathUtils.clamp(
            cameraAngleX+
            dy*0.008,
            -0.25,
            Math.PI/2.3
          );

        lastX=touch.clientX;
        lastY=touch.clientY;

      }

    }

  },
  {passive:false}
);


window.addEventListener(
  "touchend",
  function(event){

    for(
      let i=0;
      i<event.changedTouches.length;
      i++
    ){

      if(
        event.changedTouches[i].identifier===
        cameraTouch
      ){

        cameraTouch=null;

      }

    }

  }
);


window.addEventListener(
  "touchcancel",
  function(){

    cameraTouch=null;

  }
);


// ============================================================
// ANIMATION LÁ CÂY SIÊU MƯỢT
// ============================================================

function animateLeaves(delta,moving){

  if(!model)return;

  const runAmount=
    animationBlend;

  /*
    Nhịp lá không chạy cứng theo một nhịp duy nhất.
    Mỗi lá có tốc độ, pha và biên độ hơi khác nhau.
  */

  leafMeshes.forEach(
    function(mesh,index){

      const original=
        initialData.get(mesh);

      if(!original)return;


      const side=
        index%2===0?1:-1;


      const individualSpeed=
        0.82+
        (index%5)*0.07;


      const phase=
        index*0.73;


      const t=
        animationTime*
        individualSpeed+
        phase;


      // ------------------------------------------------------
      // SÓNG LỚN
      // ------------------------------------------------------

      const bigWave=
        Math.sin(t);


      // ------------------------------------------------------
      // SÓNG NHỎ
      // ------------------------------------------------------

      const smallWave=
        Math.sin(
          t*1.87+
          index*1.31
        );


      // ------------------------------------------------------
      // CHUYỂN ĐỘNG HỖN HỢP
      // ------------------------------------------------------

      const movement=
        (
          bigWave*0.72+
          smallWave*0.28
        )*
        runAmount;


      // ------------------------------------------------------
      // LÁ ĐUNG ĐƯA THEO Z
      // ------------------------------------------------------

      mesh.rotation.z=
        original.rotation.z+
        movement*
        0.34*
        side;


      // ------------------------------------------------------
      // LÁ NGHIÊNG TRƯỚC / SAU
      // ------------------------------------------------------

      mesh.rotation.x=
        original.rotation.x+
        Math.cos(t*0.91)*
        0.16*
        runAmount;


      // ------------------------------------------------------
      // LÁ XOAY NHẸ
      // ------------------------------------------------------

      mesh.rotation.y=
        original.rotation.y+
        Math.sin(t*0.67)*
        0.10*
        runAmount;


      // ------------------------------------------------------
      // LÁ "TUÔN RA" / NỞ RA NHẸ
      // ------------------------------------------------------

      const outward=
        1+
        Math.max(
          0,
          Math.sin(t)
        )*
        0.045*
        runAmount;

      mesh.scale.x=
        original.scale.x*
        outward;

      mesh.scale.z=
        original.scale.z*
        outward;


      // ------------------------------------------------------
      // CHUYỂN ĐỘNG THEO VỊ TRÍ
      // ------------------------------------------------------

      mesh.position.x=
        original.position.x+
        Math.sin(t*0.8)*
        0.025*
        runAmount;

      mesh.position.y=
        original.position.y+
        Math.cos(t*1.13)*
        0.018*
        runAmount;

    }
  );

}


// ============================================================
// ANIMATION TOÀN THÂN
// ============================================================

function animateSunflower(delta,moving){

  if(!model)return;


  const target=
    moving?1:0;


  animationBlend=
    THREE.MathUtils.lerp(
      animationBlend,
      target,
      Math.min(delta*7,1)
    );


  /*
    Khi bắt đầu chạy:
    tăng tốc từ từ.

    Khi dừng:
    giảm tốc từ từ.

    Không bị giật.
  */

  if(moving){

    animationTime+=
      delta*9.5;

  }


  const wave=
    Math.sin(animationTime);

  const opposite=
    Math.sin(
      animationTime+
      Math.PI
    );


  // ==========================================================
  // THÂN NHÚN
  // ==========================================================

  const bounce=
    Math.abs(wave)*
    0.10*
    animationBlend;

  model.position.y=
    THREE.MathUtils.lerp(
      model.position.y,
      bounce,
      Math.min(delta*13,1)
    );


  // ==========================================================
  // NGHIÊNG NHẸ
  // ==========================================================

  model.rotation.z=
    THREE.MathUtils.lerp(
      model.rotation.z,
      wave*
      0.035*
      animationBlend,
      Math.min(delta*8,1)
    );


  model.rotation.x=
    THREE.MathUtils.lerp(
      model.rotation.x,
      -0.035*
      animationBlend,
      Math.min(delta*8,1)
    );


  // ==========================================================
  // LÁ
  // ==========================================================

  animateLeaves(
    delta,
    moving
  );


  // ==========================================================
  // TAY
  // ==========================================================

  armMeshes.forEach(
    function(mesh,index){

      const original=
        initialData.get(mesh);

      if(!original)return;

      const side=
        index%2===0?1:-1;

      const armWave=
        Math.sin(
          animationTime+
          index*0.25
        );

      mesh.rotation.z=
        original.rotation.z+
        armWave*
        0.32*
        side*
        animationBlend;

      mesh.rotation.x=
        original.rotation.x+
        Math.cos(
          animationTime*0.8+
          index
        )*
        0.08*
        animationBlend;

    }
  );


  // ==========================================================
  // RỄ
  // ==========================================================

  rootMeshes.forEach(
    function(mesh,index){

      const original=
        initialData.get(mesh);

      if(!original)return;

      const side=
        index%2===0?1:-1;

      mesh.rotation.z=
        original.rotation.z+
        opposite*
        0.20*
        side*
        animationBlend;

      mesh.rotation.x=
        original.rotation.x+
        wave*
        0.10*
        animationBlend;

    }
  );


  // ==========================================================
  // NẾU MODEL KHÔNG ĐẶT TÊN LÁ
  // ==========================================================

  if(leafMeshes.length===0){

    const squash=
      Math.abs(wave)*
      0.025*
      animationBlend;

    model.scale.y=
      1+squash;

    model.scale.x=
      1-squash*0.25;

    model.scale.z=
      1-squash*0.25;

  }

}


// ============================================================
// CHUYỂN ĐỘNG MÂY
// ============================================================

function animateClouds(delta){

  clouds.forEach(function(cloud){

    cloud.object.position.x+=
      cloud.speed*
      delta;

    if(
      cloud.object.position.x>300
    ){

      cloud.object.position.x=-300;

    }

  });

}


// ============================================================
// GAME LOOP
// ============================================================

const clock=new THREE.Clock();


function animate(){

  requestAnimationFrame(animate);

  const delta=
    Math.min(
      clock.getDelta(),
      0.05
    );


  // ==========================================================
  // INPUT
  // ==========================================================

  const moving=
    input.lengthSq()>0.01;


  // ==========================================================
  // DI CHUYỂN
  // ==========================================================

  if(moving){

    const forward=
      new THREE.Vector3(
        0,
        0,
        -1
      );

    const right=
      new THREE.Vector3(
        1,
        0,
        0
      );


    forward.applyAxisAngle(
      new THREE.Vector3(0,1,0),
      cameraAngleY
    );

    right.applyAxisAngle(
      new THREE.Vector3(0,1,0),
      cameraAngleY
    );


    const movement=
      new THREE.Vector3();


    movement.addScaledVector(
      right,
      input.x
    );

    movement.addScaledVector(
      forward,
      input.y
    );


    if(movement.lengthSq()>0){

      movement.normalize();


      velocity.x=
        movement.x*
        moveSpeed;

      velocity.z=
        movement.z*
        moveSpeed;


      if(model){

        const targetRotation=
          Math.atan2(
            movement.x,
            movement.z
          );


        let difference=
          targetRotation-
          model.rotation.y;


        difference=
          Math.atan2(
            Math.sin(difference),
            Math.cos(difference)
          );


        model.rotation.y+=
          difference*
          Math.min(
            delta*10,
            1
          );

      }

    }

  }
  else{

    velocity.x=0;
    velocity.z=0;

  }


  // ==========================================================
  // SUNFLOWER ANIMATION
  // ==========================================================

  animateSunflower(
    delta,
    moving
  );


  // ==========================================================
  // MÂY
  // ==========================================================

  animateClouds(delta);


  // ==========================================================
  // GRAVITY
  // ==========================================================

  velocity.y+=
    gravity*
    delta;

  player.position.y+=
    velocity.y*
    delta;


  if(player.position.y<=0){

    player.position.y=0;

    velocity.y=0;

    grounded=true;

  }


  // ==========================================================
  // PLAYER DI CHUYỂN
  // ==========================================================

  player.position.x+=
    velocity.x*
    delta;

  player.position.z+=
    velocity.z*
    delta;


  // ==========================================================
  // CAMERA
  // ==========================================================

  cameraPivot.position.copy(
    player.position
  );

  cameraPivot.position.y+=1.2;

  updateCamera();


  // ==========================================================
  // RENDER
  // ==========================================================

  renderer.render(
    scene,
    camera
  );

}


animate();


// ============================================================
// RESIZE
// ============================================================

window.addEventListener(
  "resize",
  function(){

    camera.aspect=
      window.innerWidth/
      window.innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
      window.innerWidth,
      window.innerHeight
    );

  }
);

</script>

</body>
</html>
