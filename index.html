<!DOCTYPE html>
<html lang="vi">
<head>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>scarlet</title>

    <!-- Tự động chuyển hướng sang HTTPS để đảm bảo quyền truy cập Camera & Service Worker trên Android -->
    <script>
        if (location.protocol !== 'https:' && location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') {
            location.href = 'https:' + window.location.href.substring(window.location.protocol.length);
        }
    </script>

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="scarlet">
    <link rel="apple-touch-icon" href="https://sf-static.upanhlaylink.com/img/image_20260809b47476b2a5ac532de2516ba96d639ab7.jpg">
    <!-- Đổi đường dẫn tuyệt đối sang tương đối để tránh lỗi 404/Cross-Origin trên Android -->
    <link rel="manifest" href="manifest.json">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsQR@1.4.0/dist/jsQR.js"></script>
    
    <style>
        :root {
            /* Cấu hình Tông Màu Đen - Xám chuẩn Messenger Dark Theme */
            --bg-body: #0a0a0a;
            --bg-app: #000000;
            --bg-card: #18191a;
            --bg-hover: #242526;
            --bg-search: #242526;
            --bg-header: #121212;
            --bg-bubble-left: #242526;  /* Tin nhắn nhận: xám vừa */
            --bg-bubble-right: #3a3b3c; /* Tin nhắn gửi: xám đậm */
            --text-main: #ffffff;
            --text-sub: #b0b3b8;
            --icon-stroke: #ffffff;
            --border-color: #2f3031;
            --qr-card-bg: rgba(255, 255, 255, 0.06);
            --qr-card-border: rgba(255, 255, 255, 0.12);
            --qr-box-bg: #ffffff;
            --qr-dark-color: #000000;
            --qr-light-color: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            transition: background-color 0.2s ease, color 0.2s ease, border-color 0.2s ease;
        }

        body, html {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background-color: var(--bg-body);
        }

        .app-container {
            width: 100%;
            max-width: 420px;
            height: 100%;
            max-height: 850px;
            background: var(--bg-app);
            box-shadow: 0 4px 25px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            position: relative;
            border-radius: 12px;
            overflow: hidden;
        }

        .svg-icon {
            width: 20px;
            height: 20px;
            fill: none;
            stroke: var(--icon-stroke);
            stroke-width: 2.2;
            stroke-linecap: round;
            stroke-linejoin: round;
            display: inline-block;
            vertical-align: middle;
        }

        /* 1. Splash */
        .splash-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-app);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 99;
            transition: opacity 0.6s cubic-bezier(0.4, 0, 0.2, 1), filter 0.6s ease;
        }

        .splash-screen.fade-out {
            opacity: 0;
            filter: blur(8px);
            pointer-events: none;
        }

        .splash-logo {
            width: 130px;
            height: 130px;
            object-fit: contain;
            opacity: 0;
            transform: scale(0.85);
            animation: scarletSplash 0.8s cubic-bezier(0.215, 0.61, 0.355, 1) forwards;
        }

        .footer-text {
            position: absolute;
            bottom: 24px;
            font-weight: 900;
            color: var(--text-main);
            font-size: 14px;
            text-transform: lowercase;
        }

        @keyframes scarletSplash {
            0% { opacity: 0; transform: scale(0.85); }
            100% { opacity: 1; transform: scale(1); }
        }

        /* 2. Danh sách chat */
        .chat-list-container {
            display: none;
            flex-direction: column;
            height: 100%;
            width: 100%;
            background-color: var(--bg-app);
            color: var(--text-main);
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        .chat-list-container.visible {
            opacity: 1;
        }

        .chat-list-header {
            padding: 15px 16px 10px 16px;
            background: var(--bg-app);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-title {
            font-size: 24px;
            font-weight: bold;
            color: var(--text-main);
        }

        .header-actions {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .settings-icon-btn {
            background: var(--bg-search);
            color: var(--text-main);
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }

        .settings-icon-btn .svg-icon {
            width: 18px;
            height: 18px;
        }

        .search-container {
            padding: 0 16px 12px 16px;
            background: var(--bg-app);
        }

        .search-box {
            display: flex;
            align-items: center;
            background: var(--bg-search);
            border-radius: 20px;
            padding: 8px 14px;
            gap: 10px;
        }

        .search-box .svg-icon {
            width: 16px;
            height: 16px;
            stroke: var(--text-sub);
        }

        .search-box input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-main);
            font-size: 14px;
        }

        .search-box input::placeholder {
            color: var(--text-sub);
        }

        .chat-list {
            flex: 1;
            overflow-y: auto;
            padding: 0 16px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .chat-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px;
            border-radius: 12px;
            cursor: pointer;
        }

        .chat-item:hover {
            background: var(--bg-hover);
        }

        .chat-avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: #3a3b3c;
            border: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 18px;
            color: white;
            flex-shrink: 0;
        }

        .chat-info {
            flex: 1;
            overflow: hidden;
        }

        .chat-name {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 2px;
        }

        .chat-last-msg {
            font-size: 13px;
            color: var(--text-sub);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .empty-chat-state {
            text-align: center;
            color: var(--text-sub);
            margin-top: 50px;
            font-size: 14px;
            line-height: 1.5;
        }

        /* 3. Cài đặt */
        .settings-screen {
            display: none;
            flex-direction: column;
            height: 100%;
            width: 100%;
            background-color: var(--bg-app);
            color: var(--text-main);
            position: absolute;
            top: 0;
            left: 0;
            z-index: 60;
        }

        .settings-header {
            padding: 12px 16px;
            background: var(--bg-header);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .back-btn {
            background: transparent;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 4px;
            border-radius: 50%;
        }

        .back-btn .svg-icon {
            width: 22px;
            height: 22px;
            stroke: #ffffff;
        }

        .settings-content {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        .settings-item {
            width: 100%;
            background: var(--bg-card);
            padding: 16px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
        }

        .settings-item:hover {
            background: var(--bg-hover);
        }

        .settings-item-title {
            font-size: 16px;
            font-weight: bold;
            color: var(--text-main);
        }

        /* Giao diện tìm kiếm hình ảnh tương tự trong Cài đặt */
        .image-search-box {
            width: 100%;
            background: var(--bg-card);
            padding: 16px;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .image-search-actions {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .library-btn {
            flex: 1;
            background: var(--bg-hover);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 10px 14px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
        }

        .library-btn:hover {
            background: #2a2b2c;
        }

        .preview-img {
            max-width: 100%;
            max-height: 180px;
            object-fit: contain;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            display: none;
        }

        .search-submit-btn {
            background: #2374e1;
            color: #ffffff;
            border: none;
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            display: none;
        }

        .search-submit-btn:hover {
            background: #1a62c6;
        }

        /* 4. Quét QR */
        .qr-scanner-screen {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000000;
            z-index: 100;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 20px 16px 30px 16px;
        }

        .scanner-header {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: relative;
        }

        .scanner-header .back-btn .svg-icon {
            stroke: #ffffff;
        }

        .scanner-title {
            font-size: 17px;
            font-weight: 600;
            color: #ffffff;
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
        }

        .scanner-body {
            width: 100%;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .scanner-frame-box {
            width: 240px;
            height: 240px;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 2px dashed rgba(255, 255, 255, 0.3);
            border-radius: 24px;
        }

        .corner-tl { top: -2px; left: -2px; border-width: 4px 0 0 4px; border-top-left-radius: 20px; }
        .corner-tr { top: -2px; right: -2px; border-width: 4px 4px 0 0; border-top-right-radius: 20px; }
        .corner-bl { bottom: -2px; left: -2px; border-width: 0 0 4px 4px; border-bottom-left-radius: 20px; }
        .corner-br { bottom: -2px; right: -2px; border-width: 0 4px 4px 0; border-bottom-right-radius: 20px; }

        .scanner-frame-box::before, .scanner-frame-box::after {
            content: '';
            position: absolute;
            width: 30px;
            height: 30px;
            border-color: #ffffff;
            border-style: solid;
        }

        #camera-preview-full {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -1;
            border-radius: 12px;
            display: none;
        }

        .scanner-instruction {
            margin-top: 25px;
            color: #ffffff;
            font-size: 14px;
            font-weight: 500;
            text-align: center;
        }

        .scanner-footer-actions {
            width: 100%;
            display: flex;
            justify-style: space-around;
            align-items: center;
            padding-bottom: 10px;
        }

        .scanner-action-btn {
            background: transparent;
            border: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        .scanner-icon-circle {
            width: 50px;
            height: 50px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .scanner-action-btn:hover .scanner-icon-circle {
            background: rgba(255, 255, 255, 0.25);
        }

        .scanner-action-btn span {
            color: #ffffff;
            font-size: 13px;
            font-weight: 500;
        }

        #gallery-input {
            display: none;
        }

        /* 5. Mã QR Cá Nhân */
        .my-qr-screen {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg-app);
            z-index: 110;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 20px 16px 35px 16px;
        }

        .my-qr-header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .scan-icon-top {
            background: transparent;
            border: none;
            cursor: pointer;
        }

        .modern-qr-card {
            width: 100%;
            max-width: 300px;
            background: var(--qr-card-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--qr-card-border);
            border-radius: 32px;
            padding: 30px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        .my-qr-code-box {
            padding: 16px;
            background: var(--qr-box-bg);
            border-radius: 24px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 8px 25px rgba(0,0,0,0.2);
            overflow: hidden;
        }

        .my-qr-bottom-actions {
            width: 100%;
            max-width: 300px;
            display: flex;
            gap: 12px;
            justify-content: center;
        }

        .my-qr-btn {
            flex: 1;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 14px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
            cursor: pointer;
        }

        .my-qr-btn:active {
            transform: scale(0.96);
            background: var(--bg-hover);
        }

        .my-qr-btn span {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-main);
        }

        .my-qr-footer-hint {
            color: var(--text-sub);
            font-size: 13px;
            text-align: center;
            margin-bottom: 5px;
        }

        /* 6. Chi tiết trò chuyện (Messenger Đen - Xám) */
        .chat-view {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg-app);
            z-index: 120;
            flex-direction: column;
        }

        .chat-view-header {
            padding: 12px 16px;
            background: var(--bg-header);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .chat-view-body {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
            background: #000000;
        }

        .msg-bubble {
            max-width: 72%;
            padding: 10px 14px;
            border-radius: 18px;
            font-size: 14px;
            line-height: 1.4;
            word-wrap: break-word;
        }

        /* Tin nhắn bên trái (đối phương nhận được) */
        .msg-left {
            align-self: flex-start;
            background: var(--bg-bubble-left);
            color: var(--text-main);
            border-bottom-left-radius: 4px;
        }

        /* Tin nhắn bên phải (bạn gửi đi) */
        .msg-right {
            align-self: flex-end;
            background: var(--bg-bubble-right);
            color: #ffffff;
            border-bottom-right-radius: 4px;
        }

        .chat-view-footer {
            padding: 10px 16px;
            background: var(--bg-header);
            border-top: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .chat-input {
            flex: 1;
            background: var(--bg-search);
            border: 1px solid var(--border-color);
            outline: none;
            color: var(--text-main);
            padding: 10px 16px;
            border-radius: 20px;
            font-size: 14px;
        }

        .send-btn {
            background: transparent;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 4px;
        }

        .send-btn .svg-icon {
            stroke: #ffffff;
            fill: #ffffff;
            width: 20px;
            height: 20px;
        }
    </style>
</head>
<body>

    <div class="app-container">

        <!-- Splash Logo -->
        <div class="splash-screen" id="splashScreen">
            <img src="https://i.ibb.co/qF7z5b41/image.png" alt="Logo" class="splash-logo">
            <div class="footer-text">by tien</div>
        </div>

        <!-- Giao diện Danh sách Chat -->
        <div class="chat-list-container" id="chatListContainer">
            <div class="chat-list-header">
                <div class="header-title">Đoạn chat</div>
                <div class="header-actions">
                    <button class="settings-icon-btn" onclick="openSettings()" title="Cài đặt">
                        <svg class="svg-icon" viewBox="0 0 24 24">
                            <circle cx="12" cy="12" r="3"></circle>
                            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                        </svg>
                    </button>
                </div>
            </div>

            <div class="search-container">
                <div class="search-box">
                    <svg class="svg-icon" viewBox="0 0 24 24">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                    <input type="text" id="searchInput" oninput="renderChatList()" placeholder="Tìm kiếm...">
                </div>
            </div>

            <div class="chat-list" id="chatList"></div>
        </div>

        <!-- Màn hình Cài đặt -->
        <div class="settings-screen" id="settingsScreen">
            <div class="settings-header">
                <button class="back-btn" onclick="closeSettings()" title="Quay lại">
                    <svg class="svg-icon" viewBox="0 0 24 24">
                        <line x1="19" y1="12" x2="5" y2="12"></line>
                        <polyline points="12 19 5 12 12 5"></polyline>
                    </svg>
                </button>
                <div style="font-size: 16px; font-weight: bold;">Cài đặt</div>
            </div>
            <div class="settings-content">
                <div class="settings-item" onclick="openQRScannerScreen()">
                    <div class="settings-item-title">Mã QR của bạn</div>
                    <svg class="svg-icon" viewBox="0 0 24 24">
                        <rect x="3" y="3" width="7" height="7"></rect>
                        <rect x="14" y="3" width="7" height="7"></rect>
                        <rect x="3" y="14" width="7" height="7"></rect>
                        <path d="M14 14h3v3h-3z"></path>
                    </svg>
                </div>

                <!-- Mục Tìm kiếm hình ảnh tương tự ngay dưới Mã QR -->
                <div class="image-search-box">
                    <div class="settings-item-title">Tìm kiếm hình ảnh tương tự</div>
                    <div class="image-search-actions">
                        <button class="library-btn" onclick="document.getElementById('similar-img-input').click()">
                            <svg class="svg-icon" viewBox="0 0 24 24">
                                <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                                <circle cx="8.5" cy="8.5" r="1.5"></circle>
                                <polyline points="21 15 16 10 5 21"></polyline>
                            </svg>
                            <span>Thư viện ảnh</span>
                        </button>
                        <input type="file" id="similar-img-input" accept="image/*" style="display: none;" onchange="handleSimilarImageSelect(event)">
                    </div>
                    <img id="similar-img-preview" class="preview-img" alt="Xem trước ảnh">
                    <button id="similar-img-search-btn" class="search-submit-btn" onclick="executeSimilarImageSearch()">Tìm kiếm ảnh tương tự</button>
                </div>
            </div>
        </div>

        <!-- Màn hình Quét QR -->
        <div class="qr-scanner-screen" id="qrScannerScreen">
            <video id="camera-preview-full" playsinline></video>
            
            <div class="scanner-header">
                <button class="back-btn" onclick="closeQRScannerScreen()">
                    <svg class="svg-icon" viewBox="0 0 24 24">
                        <line x1="19" y1="12" x2="5" y2="12"></line>
                        <polyline points="12 19 5 12 12 5"></polyline>
                    </svg>
                </button>
                <div class="scanner-title">Quét</div>
                <div style="width: 24px;"></div>
            </div>

            <div class="scanner-body">
                <div class="scanner-frame-box">
                    <div class="corner-tl"></div>
                    <div class="corner-tr"></div>
                    <div class="corner-bl"></div>
                    <div class="corner-br"></div>
                </div>
                <div class="scanner-instruction">Quét mã QR để kết nối</div>
            </div>

            <div class="scanner-footer-actions">
                <button class="scanner-action-btn" onclick="openMyQRScreen()">
                    <div class="scanner-icon-circle">
                        <svg class="svg-icon" viewBox="0 0 24 24" style="stroke: #fff;">
                            <rect x="3" y="3" width="7" height="7"></rect>
                            <rect x="14" y="3" width="7" height="7"></rect>
                            <rect x="3" y="14" width="7" height="7"></rect>
                            <path d="M14 14h3v3h-3z"></path>
                            <path d="M19 19v2h2v-2z"></path>
                            <path d="M14 21h2v-2h-2z"></path>
                            <path d="M21 14h-2v3h2z"></path>
                        </svg>
                    </div>
                    <span>Mã QR của tôi</span>
                </button>

                <button class="scanner-action-btn" onclick="document.getElementById('gallery-input').click()">
                    <div class="scanner-icon-circle">
                        <svg class="svg-icon" viewBox="0 0 24 24" style="stroke: #fff;">
                            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                            <circle cx="8.5" cy="8.5" r="1.5"></circle>
                            <polyline points="21 15 16 10 5 21"></polyline>
                        </svg>
                    </div>
                    <span>Thư viện</span>
                </button>
                <input type="file" id="gallery-input" accept="image/*" onchange="scanQRCodeFromGallery(event)">
            </div>
        </div>

        <!-- Màn hình Mã QR Cá Nhân -->
        <div class="my-qr-screen" id="myQRScreen">
            <div class="my-qr-header">
                <button class="back-btn" onclick="closeMyQRScreen()">
                    <svg class="svg-icon" viewBox="0 0 24 24">
                        <line x1="19" y1="12" x2="5" y2="12"></line>
                        <polyline points="12 19 5 12 12 5"></polyline>
                    </svg>
                </button>
                <button class="scan-icon-top" onclick="switchToScannerFromMyQR()" title="Mở máy quét">
                    <svg class="svg-icon" viewBox="0 0 24 24">
                        <path d="M4 7V5a2 2 0 0 1 2-2h2"></path>
                        <path d="M20 7V5a2 2 0 0 0-2-2h-2"></path>
                        <path d="M4 17v2a2 2 0 0 0 2 2h2"></path>
                        <path d="M20 17v2a2 2 0 0 1-2 2h-2"></path>
                        <line x1="4" y1="12" x2="20" y2="12"></line>
                    </svg>
                </button>
            </div>

            <div class="modern-qr-card">
                <div class="my-qr-code-box" id="myQRCodeBox"></div>
            </div>

            <div class="my-qr-bottom-actions">
                <button class="my-qr-btn" onclick="copyMyLink()">
                    <svg class="svg-icon" viewBox="0 0 24 24">
                        <path d="M10 13a5 5 0 0 0 7.545 4.546l3.03-3.03a5 5 0 0 0-7.071-7.071L13.414 9.879"></path>
                        <path d="M14 11a5 5 0 0 0-7.546-4.546l-3.03 3.03a5 5 0 0 0 7.071 7.071L10.586 14.121"></path>
                    </svg>
                    <span>Sao chép Liên kết</span>
                </button>

                <button class="my-qr-btn" onclick="shareMyLink()">
                    <svg class="svg-icon" viewBox="0 0 24 24">
                        <path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"></path>
                        <polyline points="16 6 12 2 8 6"></polyline>
                        <line x1="12" y1="2" x2="12" y2="15"></line>
                    </svg>
                    <span>Chia sẻ liên kết</span>
                </button>
            </div>

            <div class="my-qr-footer-hint">Quét mã QR để kết nối</div>
        </div>

        <!-- Chi tiết Trò chuyện -->
        <div class="chat-view" id="chatView">
            <div class="chat-view-header">
                <button class="back-btn" onclick="closeChatView()" title="Quay lại">
                    <svg class="svg-icon" viewBox="0 0 24 24">
                        <line x1="19" y1="12" x2="5" y2="12"></line>
                        <polyline points="12 19 5 12 12 5"></polyline>
                    </svg>
                </button>
                <div class="chat-avatar" id="chatViewAvatar" style="width: 36px; height: 36px; font-size: 14px;">?</div>
                <div style="font-size: 16px; font-weight: bold; color: var(--text-main);" id="chatViewTitle">Người dùng</div>
            </div>
            <div class="chat-view-body" id="chatViewBody"></div>
            <div class="chat-view-footer">
                <input type="text" class="chat-input" id="chatInput" placeholder="Nhắn tin..." onkeypress="handleKeyPress(event)">
                <button class="send-btn" onclick="sendMessage()" title="Gửi">
                    <svg class="svg-icon" viewBox="0 0 24 24">
                        <line x1="22" y1="2" x2="11" y2="13"></line>
                        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                    </svg>
                </button>
            </div>
        </div>

    </div>

    <script>
        // Đăng ký Service Worker an toàn cho Android/Chrome (bỏ khởi tạo qua Blob bị chặn security sandbox)
        if ('serviceWorker' in navigator && location.protocol === 'https:') {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').catch((err) => {
                    console.log('ServiceWorker không khả dụng hoặc chưa khởi tạo tệp sw.js:', err);
                });
            });
        }

        let chatData = JSON.parse(localStorage.getItem('scarlet_chats')) || [];
        let activeChatId = null;
        let videoStream = null;
        let qrInstance = null;

        function generateQRCode() {
            const qrBox = document.getElementById("myQRCodeBox");
            qrBox.innerHTML = ''; 

            const computedStyle = getComputedStyle(document.documentElement);
            const darkColor = computedStyle.getPropertyValue('--qr-dark-color').trim() || "#000000";
            const lightColor = computedStyle.getPropertyValue('--qr-light-color').trim() || "#ffffff";

            qrInstance = new QRCode(qrBox, {
                text: "USER_CONNECT_CODE_8888",
                width: 175,
                height: 175,
                colorDark: darkColor,
                colorLight: lightColor,
                correctLevel: QRCode.CorrectLevel.H
            });
        }

        window.addEventListener('DOMContentLoaded', () => {
            generateQRCode();

            setTimeout(() => {
                const splash = document.getElementById('splashScreen');
                const chatList = document.getElementById('chatListContainer');

                if (splash) {
                    splash.classList.add('fade-out');
                    chatList.style.display = 'flex';
                    setTimeout(() => chatList.classList.add('visible'), 50);
                    renderChatList();

                    setTimeout(() => {
                        splash.style.display = 'none';
                    }, 600);
                }
            }, 1850);
        });

        function saveChatData() {
            localStorage.setItem('scarlet_chats', JSON.stringify(chatData));
        }

        function openSettings() {
            document.getElementById('settingsScreen').style.display = 'flex';
        }

        function closeSettings() {
            document.getElementById('settingsScreen').style.display = 'none';
        }

        /* Xử lý tìm kiếm hình ảnh tương tự */
        function handleSimilarImageSelect(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const previewImg = document.getElementById('similar-img-preview');
                const searchBtn = document.getElementById('similar-img-search-btn');

                previewImg.src = e.target.result;
                previewImg.style.display = 'block';
                searchBtn.style.display = 'block';
            };
            reader.readAsDataURL(file);
        }

        function executeSimilarImageSearch() {
            alert("Đã chọn ảnh thành công! Bạn có thể gửi ảnh này tới API tìm kiếm hình ảnh (như Google Lens hoặc API riêng của bạn) để trả về kết quả.");
        }

        async function openQRScannerScreen() {
            closeSettings();
            document.getElementById('qrScannerScreen').style.display = 'flex';
            try {
                videoStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
                const video = document.getElementById('camera-preview-full');
                video.style.display = 'block';
                video.srcObject = videoStream;
                video.play();
                requestAnimationFrame(tickCameraScan);
            } catch (err) {
                console.log("Không thể mở camera tự động:", err);
                alert("Vui lòng đảm bảo bạn đang dùng HTTPS và đã cấp quyền Camera trên Android.");
            }
        }

        function closeQRScannerScreen() {
            stopCamera();
            document.getElementById('qrScannerScreen').style.display = 'none';
        }

        function stopCamera() {
            if (videoStream) {
                videoStream.getTracks().forEach(track => track.stop());
                videoStream = null;
            }
            const video = document.getElementById('camera-preview-full');
            video.style.display = 'none';
        }

        function tickCameraScan() {
            const scannerScreen = document.getElementById('qrScannerScreen');
            if (scannerScreen.style.display !== 'flex') return;

            const video = document.getElementById('camera-preview-full');
            if (video.readyState === video.HAVE_ENOUGH_DATA) {
                const canvas = document.createElement('canvas');
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                
                const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                const code = jsQR(imageData.data, imageData.width, imageData.height);

                if (code) {
                    stopCamera();
                    addFriendFromQRData(code.data);
                    return;
                }
            }
            requestAnimationFrame(tickCameraScan);
        }

        function scanQRCodeFromGallery(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const context = canvas.getContext('2d');
                    canvas.width = img.width;
                    canvas.height = img.height;
                    context.drawImage(img, 0, 0, img.width, img.height);
                    
                    const imageData = context.getImageData(0, 0, canvas.width, canvas.height);
                    const code = jsQR(imageData.data, imageData.width, imageData.height);

                    if (code) {
                        closeQRScannerScreen();
                        addFriendFromQRData(code.data);
                    } else {
                        alert("Không tìm thấy mã QR trong ảnh này.");
                    }
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function openMyQRScreen() {
            stopCamera();
            document.getElementById('qrScannerScreen').style.display = 'none';
            document.getElementById('myQRScreen').style.display = 'flex';
        }

        function closeMyQRScreen() {
            document.getElementById('myQRScreen').style.display = 'none';
        }

        function switchToScannerFromMyQR() {
            closeMyQRScreen();
            openQRScannerScreen();
        }

        function copyMyLink() {
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText("https://scarlet.app/connect");
                alert("Đã sao chép liên kết!");
            } else {
                alert("Liên kết: https://scarlet.app/connect");
            }
        }

        function shareMyLink() {
            if (navigator.share) {
                navigator.share({
                    title: 'Scarlet App',
                    url: 'https://scarlet.app/connect'
                }).catch(() => {});
            } else {
                copyMyLink();
            }
        }

        function addFriendFromQRData(qrContent) {
            let friendName = "Người dùng (" + qrContent.substring(0, 6) + ")";

            let existing = chatData.find(c => c.id === qrContent);
            if (!existing) {
                existing = {
                    id: qrContent,
                    name: friendName,
                    messages: []
                };
                chatData.unshift(existing);
                saveChatData();
            }

            renderChatList();
            openChatView(existing.id);
        }

        function renderChatList() {
            const chatListEl = document.getElementById('chatList');
            const searchVal = document.getElementById('searchInput').value.toLowerCase();
            chatListEl.innerHTML = '';

            const filteredChats = chatData.filter(c => c.name.toLowerCase().includes(searchVal));

            if (filteredChats.length === 0) {
                chatListEl.innerHTML = `
                    <div class="empty-chat-state">
                        Chưa có cuộc trò chuyện nào.<br>Vào Cài đặt để mở Mã QR kết nối.
                    </div>`;
                return;
            }

            filteredChats.forEach(chat => {
                const lastMsg = chat.messages.length > 0 
                    ? chat.messages[chat.messages.length - 1].text 
                    : 'Hãy bắt đầu trò chuyện!';
                
                const item = document.createElement('div');
                item.className = 'chat-item';
                item.onclick = () => openChatView(chat.id);
                item.innerHTML = `
                    <div class="chat-avatar">${chat.name.charAt(0).toUpperCase()}</div>
                    <div class="chat-info">
                        <div class="chat-name">${chat.name}</div>
                        <div class="chat-last-msg">${lastMsg}</div>
                    </div>
                `;
                chatListEl.appendChild(item);
            });
        }

        function openChatView(chatId) {
            activeChatId = chatId;
            const chat = chatData.find(c => c.id === chatId);
            if (!chat) return;

            document.getElementById('chatViewTitle').innerText = chat.name;
            document.getElementById('chatViewAvatar').innerText = chat.name.charAt(0).toUpperCase();
            document.getElementById('chatView').style.display = 'flex';
            renderMessages();
        }

        function closeChatView() {
            activeChatId = null;
            document.getElementById('chatView').style.display = 'none';
            renderChatList();
        }

        function renderMessages() {
            const chat = chatData.find(c => c.id === activeChatId);
            const body = document.getElementById('chatViewBody');
            body.innerHTML = '';

            if (!chat) return;

            chat.messages.forEach(msg => {
                const bubble = document.createElement('div');
                bubble.className = `msg-bubble ${msg.sender === 'me' ? 'msg-right' : 'msg-left'}`;
                bubble.innerText = msg.text;
                body.appendChild(bubble);
            });

            body.scrollTop = body.scrollHeight;
        }

        function sendMessage() {
            const input = document.getElementById('chatInput');
            const text = input.value.trim();
            if (!text || !activeChatId) return;

            const chat = chatData.find(c => c.id === activeChatId);
            if (!chat) return;

            chat.messages.push({ sender: 'me', text: text });
            input.value = '';
            renderMessages();
            saveChatData();
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') sendMessage();
        }
    </script>
</body>
</html>
