<!DOCTYPE html>
<html lang="vi">
<head>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>scarlet</title>

    <script>
        if (location.protocol !== 'https:' && location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') {
            location.href = 'https:' + window.location.href.substring(window.location.protocol.length);
        }
    </script>

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="scarlet">
    <link rel="apple-touch-icon" href="https://sf-static.upanhlaylink.com/img/image_20260809b47476b2a5ac532de2516ba96d639ab7.jpg">
    <link rel="manifest" href="manifest.json">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsQR@1.4.0/dist/jsQR.js"></script>
    
    <style>
        :root {
            --bg-body: #0a0a0a;
            --bg-app: #000000;
            --bg-card: #18191a;
            --bg-hover: #242526;
            --bg-search: #242526;
            --bg-header: #121212;
            --bg-bubble-left: #242526;
            --bg-bubble-right: #3a3b3c;
            --text-main: #ffffff;
            --text-sub: #b0b3b8;
            --icon-stroke: #ffffff;
            --border-color: #2f3031;
            --qr-card-bg: rgba(255, 255, 255, 0.06);
            --qr-card-border: rgba(255, 255, 255, 0.12);
            --qr-box-bg: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            transition: background-color 0.2s ease, color 0.2s ease, border-color 0.2s ease;
        }

        body, html {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background-color: var(--bg-body);
        }

        .app-container {
            width: 100%;
            max-width: 420px;
            height: 100%;
            max-height: 850px;
            background: var(--bg-app);
            box-shadow: 0 4px 25px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            position: relative;
            border-radius: 12px;
            overflow: hidden;
        }

        .svg-icon {
            width: 20px;
            height: 20px;
            fill: none;
            stroke: var(--icon-stroke);
            stroke-width: 2.2;
            stroke-linecap: round;
            stroke-linejoin: round;
            display: inline-block;
            vertical-align: middle;
        }

        /* Splash */
        .splash-screen {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-color: var(--bg-app);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 99;
            transition: opacity 0.6s cubic-bezier(0.4, 0, 0.2, 1), filter 0.6s ease;
        }

        .splash-screen.fade-out {
            opacity: 0;
            filter: blur(8px);
            pointer-events: none;
        }

        .splash-logo {
            width: 130px; height: 130px;
            object-fit: contain;
            opacity: 0;
            transform: scale(0.85);
            animation: scarletSplash 0.8s cubic-bezier(0.215, 0.61, 0.355, 1) forwards;
        }

        .footer-text {
            position: absolute;
            bottom: 24px;
            font-weight: 900;
            color: var(--text-main);
            font-size: 14px;
            text-transform: lowercase;
        }

        @keyframes scarletSplash {
            0% { opacity: 0; transform: scale(0.85); }
            100% { opacity: 1; transform: scale(1); }
        }

        /* Danh sách chat */
        .chat-list-container {
            display: none;
            flex-direction: column;
            height: 100%; width: 100%;
            background-color: var(--bg-app);
            color: var(--text-main);
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        .chat-list-container.visible { opacity: 1; }

        .chat-list-header {
            padding: 15px 16px 10px 16px;
            background: var(--bg-app);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-title { font-size: 24px; font-weight: bold; color: var(--text-main); }

        .header-actions { display: flex; gap: 15px; align-items: center; }

        .settings-icon-btn {
            background: var(--bg-search);
            color: var(--text-main);
            border: none;
            width: 36px; height: 36px;
            border-radius: 50%;
            display: flex; justifyContent: center; align-items: center;
            cursor: pointer;
        }

        .search-container { padding: 0 16px 12px 16px; background: var(--bg-app); }

        .search-box {
            display: flex; align-items: center;
            background: var(--bg-search);
            border-radius: 20px;
            padding: 8px 14px; gap: 10px;
        }

        .search-box input {
            flex: 1; background: transparent; border: none; outline: none;
            color: var(--text-main); font-size: 14px;
        }

        .chat-list {
            flex: 1; overflow-y: auto; padding: 0 16px;
            display: flex; flex-direction: column; gap: 4px;
        }

        .chat-item {
            display: flex; align-items: center; gap: 12px;
            padding: 10px; border-radius: 12px; cursor: pointer;
        }

        .chat-item:hover { background: var(--bg-hover); }

        .chat-avatar {
            width: 48px; height: 48px; border-radius: 50%;
            background: #3a3b3c; border: 1px solid var(--border-color);
            display: flex; align-items: center; justify-content: center;
            font-weight: bold; font-size: 18px; color: white; flex-shrink: 0;
        }

        .chat-info { flex: 1; overflow: hidden; }

        .chat-name { font-size: 15px; font-weight: 600; color: var(--text-main); margin-bottom: 2px; }

        .chat-last-msg {
            font-size: 13px; color: var(--text-sub);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }

        .empty-chat-state {
            text-align: center; color: var(--text-sub);
            margin-top: 50px; font-size: 14px; line-height: 1.5;
        }

        /* Cài đặt */
        .settings-screen {
            display: none; flex-direction: column;
            height: 100%; width: 100%;
            background-color: var(--bg-app);
            color: var(--text-main);
            position: absolute; top: 0; left: 0; z-index: 60;
        }

        .settings-header {
            padding: 12px 16px; background: var(--bg-header);
            border-bottom: 1px solid var(--border-color);
            display: flex; align-items: center; gap: 15px;
        }

        .back-btn {
            background: transparent; border: none; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            padding: 4px; border-radius: 50%;
        }

        .settings-content {
            flex: 1; padding: 16px; overflow-y: auto;
            display: flex; flex-direction: column; align-items: center; gap: 16px;
        }

        .settings-item {
            width: 100%; background: var(--bg-card); padding: 16px;
            border-radius: 12px; display: flex; justify-content: space-between;
            align-items: center; cursor: pointer;
        }

        .settings-item-title { font-size: 16px; font-weight: bold; color: var(--text-main); }

        /* Giao diện tìm kiếm hình ảnh tương tự */
        .image-search-box {
            width: 100%; background: var(--bg-card); padding: 16px;
            border-radius: 12px; display: flex; flex-direction: column; gap: 12px;
        }

        .image-search-actions { display: flex; gap: 10px; align-items: center; }

        .library-btn {
            flex: 1; background: var(--bg-hover);
            border: 1px solid var(--border-color); color: var(--text-main);
            padding: 10px 14px; border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            gap: 8px; cursor: pointer; font-size: 14px; font-weight: 500;
        }

        .preview-img {
            width: 100%; max-height: 200px; object-fit: contain;
            border-radius: 8px; border: 1px solid var(--border-color);
            display: none; background: #000;
        }

        .search-submit-btn {
            background: #2374e1; color: #ffffff; border: none;
            padding: 12px; border-radius: 8px; cursor: pointer;
            font-size: 14px; font-weight: 600; display: none; width: 100%;
        }

        .search-submit-btn:disabled { background: #555; cursor: not-allowed; }

        /* Khung hiển thị danh sách kết quả xem hàng loạt đã sửa triệt để lỗi sọc ngang */
        .search-results-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            width: 100%;
            max-height: 420px;
            overflow-y: auto;
            background: #0d0d0d;
            padding: 8px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
        }

        .result-card {
            background: var(--bg-hover);
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            text-decoration: none;
            border: 1px solid var(--border-color);
            width: 100%;
        }

        .result-card-media {
            width: 100%;
            height: 120px;
            min-height: 120px;
            object-fit: cover;
            background: #1e1e1e;
            display: block;
        }

        .result-card-title {
            padding: 8px 8px 4px 8px;
            font-size: 12px;
            font-weight: 500;
            color: var(--text-main);
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-overflow: ellipsis;
            line-height: 1.3;
            min-height: 36px;
        }

        .result-card-source {
            padding: 0 8px 8px 8px;
            font-size: 10px;
            color: var(--text-sub);
        }

        /* Quét QR & Cá Nhân */
        .qr-scanner-screen, .my-qr-screen, .chat-view {
            display: none; position: absolute; top: 0; left: 0;
            width: 100%; height: 100%; background: #000000;
            z-index: 100; flex-direction: column;
        }

        .qr-scanner-screen {
            justify-content: space-between; align-items: center;
            padding: 20px 16px 30px 16px;
        }

        .scanner-header, .my-qr-header {
            width: 100%; display: flex; align-items: center; justify-content: space-between;
        }

        .scanner-title { font-size: 17px; font-weight: 600; color: #ffffff; }

        .scanner-body {
            width: 100%; flex: 1; display: flex;
            flex-direction: column; justify-content: center; align-items: center;
        }

        .scanner-frame-box {
            width: 240px; height: 240px; position: relative;
            display: flex; justify-content: center; align-items: center;
            border: 2px dashed rgba(255, 255, 255, 0.3); border-radius: 24px;
        }

        #camera-preview-full {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%; object-fit: cover;
            z-index: -1; display: none;
        }

        .scanner-footer-actions {
            width: 100%; display: flex; justify-content: space-around; align-items: center;
        }

        .scanner-action-btn {
            background: transparent; border: none; display: flex;
            flex-direction: column; align-items: center; gap: 8px;
            cursor: pointer; color: white; font-size: 13px;
        }

        .scanner-icon-circle {
            width: 50px; height: 50px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px); border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
        }

        .my-qr-screen {
            background: var(--bg-app); z-index: 110;
            justify-content: space-between; align-items: center;
            padding: 20px 16px 35px 16px;
        }

        .modern-qr-card {
            width: 100%; max-width: 300px;
            background: var(--qr-card-bg); backdrop-filter: blur(20px);
            border: 1px solid var(--qr-card-border); border-radius: 32px;
            padding: 30px 20px; display: flex; justify-content: center; align-items: center;
        }

        .my-qr-code-box { padding: 16px; background: var(--qr-box-bg); border-radius: 24px; }

        .my-qr-bottom-actions { width: 100%; max-width: 300px; display: flex; gap: 12px; }

        .my-qr-btn {
            flex: 1; background: var(--bg-card); border: 1px solid var(--border-color);
            border-radius: 20px; padding: 14px 10px; display: flex; flex-direction: column;
            align-items: center; gap: 6px; cursor: pointer; color: var(--text-main); font-size: 13px;
        }

        /* Chat view */
        .chat-view { z-index: 120; background: var(--bg-app); }

        .chat-view-header {
            padding: 12px 16px; background: var(--bg-header);
            border-bottom: 1px solid var(--border-color); display: flex; align-items: center; gap: 12px;
        }

        .chat-view-body {
            flex: 1; padding: 16px; overflow-y: auto;
            display: flex; flex-direction: column; gap: 8px; background: #000000;
        }

        .msg-bubble {
            max-width: 72%; padding: 10px 14px; border-radius: 18px;
            font-size: 14px; line-height: 1.4; word-wrap: break-word;
        }

        .msg-left { background: var(--bg-bubble-left); color: var(--text-main); border-bottom-left-radius: 4px; align-self: flex-start; }
        .msg-right { background: var(--bg-bubble-right); color: #ffffff; border-bottom-right-radius: 4px; align-self: flex-end; }

        .chat-view-footer {
            padding: 10px 16px; background: var(--bg-header);
            border-top: 1px solid var(--border-color); display: flex; align-items: center; gap: 10px;
        }

        .chat-input {
            flex: 1; background: var(--bg-search); border: 1px solid var(--border-color);
            outline: none; color: var(--text-main); padding: 10px 16px; border-radius: 20px; font-size: 14px;
        }

        .send-btn { background: transparent; border: none; cursor: pointer; }
    </style>
</head>
<body>

    <div class="app-container">

        <!-- Splash Logo -->
        <div class="splash-screen" id="splashScreen">
            <img src="https://i.ibb.co/qF7z5b41/image.png" alt="Logo" class="splash-logo">
            <div class="footer-text">by tien</div>
        </div>

        <!-- Chat List -->
        <div class="chat-list-container" id="chatListContainer">
            <div class="chat-list-header">
                <div class="header-title">Đoạn chat</div>
                <div class="header-actions">
                    <button class="settings-icon-btn" onclick="openSettings()" title="Cài đặt">
                        <svg class="svg-icon" viewBox="0 0 24 24">
                            <circle cx="12" cy="12" r="3"></circle>
                            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                        </svg>
                    </button>
                </div>
            </div>

            <div class="search-container">
                <div class="search-box">
                    <svg class="svg-icon" viewBox="0 0 24 24">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                    <input type="text" id="searchInput" oninput="renderChatList()" placeholder="Tìm kiếm...">
                </div>
            </div>

            <div class="chat-list" id="chatList"></div>
        </div>

        <!-- Màn hình Cài đặt -->
        <div class="settings-screen" id="settingsScreen">
            <div class="settings-header">
                <button class="back-btn" onclick="closeSettings()" title="Quay lại">
                    <svg class="svg-icon" viewBox="0 0 24 24">
                        <line x1="19" y1="12" x2="5" y2="12"></line>
                        <polyline points="12 19 5 12 12 5"></polyline>
                    </svg>
                </button>
                <div style="font-size: 16px; font-weight: bold;">Cài đặt</div>
            </div>
            <div class="settings-content">
                <div class="settings-item" onclick="openQRScannerScreen()">
                    <div class="settings-item-title">Mã QR của bạn</div>
                    <svg class="svg-icon" viewBox="0 0 24 24">
                        <rect x="3" y="3" width="7" height="7"></rect>
                        <rect x="14" y="3" width="7" height="7"></rect>
                        <rect x="3" y="14" width="7" height="7"></rect>
                        <path d="M14 14h3v3h-3z"></path>
                    </svg>
                </div>

                <!-- Tìm kiếm hình ảnh tương tự -->
                <div class="image-search-box">
                    <div class="settings-item-title">Tìm kiếm hình ảnh tương tự</div>
                    <div class="image-search-actions">
                        <button class="library-btn" onclick="document.getElementById('similar-img-input').click()">
                            <svg class="svg-icon" viewBox="0 0 24 24">
                                <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                                <circle cx="8.5" cy="8.5" r="1.5"></circle>
                                <polyline points="21 15 16 10 5 21"></polyline>
                            </svg>
                            <span>Thư viện ảnh</span>
                        </button>
                        <input type="file" id="similar-img-input" accept="image/*" style="display: none;" onchange="handleSimilarImageSelect(event)">
                    </div>
                    <img id="similar-img-preview" class="preview-img" alt="Xem trước ảnh">
                    <button id="similar-img-search-btn" class="search-submit-btn" onclick="executeSimilarImageSearch()">Tìm kiếm qua API</button>
                    
                    <!-- Khung xem kết quả dạng lưới -->
                    <div id="search-results-container" class="search-results-container" style="display: none;"></div>
                </div>
            </div>
        </div>

        <!-- QR Scanner -->
        <div class="qr-scanner-screen" id="qrScannerScreen">
            <video id="camera-preview-full" playsinline></video>
            
            <div class="scanner-header">
                <button class="back-btn" onclick="closeQRScannerScreen()">
                    <svg class="svg-icon" viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
                </button>
                <div class="scanner-title">Quét</div>
                <div style="width: 24px;"></div>
            </div>

            <div class="scanner-body">
                <div class="scanner-frame-box"></div>
                <div class="scanner-instruction" style="margin-top:20px; color:#fff;">Quét mã QR để kết nối</div>
            </div>

            <div class="scanner-footer-actions">
                <button class="scanner-action-btn" onclick="openMyQRScreen()">
                    <div class="scanner-icon-circle">
                        <svg class="svg-icon" viewBox="0 0 24 24" style="stroke: #fff;"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect><path d="M14 14h3v3h-3z"></path></svg>
                    </div>
                    <span>Mã QR của tôi</span>
                </button>
                <button class="scanner-action-btn" onclick="document.getElementById('gallery-input').click()">
                    <div class="scanner-icon-circle">
                        <svg class="svg-icon" viewBox="0 0 24 24" style="stroke: #fff;"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
                    </div>
                    <span>Thư viện</span>
                </button>
                <input type="file" id="gallery-input" accept="image/*" style="display:none;" onchange="scanQRCodeFromGallery(event)">
            </div>
        </div>

        <!-- Mã QR Cá Nhân -->
        <div class="my-qr-screen" id="myQRScreen">
            <div class="my-qr-header">
                <button class="back-btn" onclick="closeMyQRScreen()">
                    <svg class="svg-icon" viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
                </button>
            </div>

            <div class="modern-qr-card">
                <div class="my-qr-code-box" id="myQRCodeBox"></div>
            </div>

            <div class="my-qr-bottom-actions">
                <button class="my-qr-btn" onclick="copyMyLink()">
                    <span>Sao chép Liên kết</span>
                </button>
            </div>
        </div>

        <!-- Chat View -->
        <div class="chat-view" id="chatView">
            <div class="chat-view-header">
                <button class="back-btn" onclick="closeChatView()">
                    <svg class="svg-icon" viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
                </button>
                <div class="chat-avatar" id="chatViewAvatar" style="width: 36px; height: 36px; font-size: 14px;">?</div>
                <div style="font-size: 16px; font-weight: bold; color: var(--text-main);" id="chatViewTitle">Người dùng</div>
            </div>
            <div class="chat-view-body" id="chatViewBody"></div>
            <div class="chat-view-footer">
                <input type="text" class="chat-input" id="chatInput" placeholder="Nhắn tin..." onkeypress="handleKeyPress(event)">
                <button class="send-btn" onclick="sendMessage()">
                    <svg class="svg-icon" viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                </button>
            </div>
        </div>

    </div>

    <script>
        if ('serviceWorker' in navigator && location.protocol === 'https:') {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').catch((err) => {
                    console.log('ServiceWorker chưa sẵn sàng:', err);
                });
            });
        }

        let chatData = JSON.parse(localStorage.getItem('scarlet_chats')) || [];
        let activeChatId = null;
        let videoStream = null;
        let qrInstance = null;
        let selectedBase64Image = null;

        const SERPAPI_KEY = "5821b29e718f2cfa1d151c2e56ff7b889ea4440b53fce916d63a34f4afaccbef"; 
        const IMGBB_API_KEY = "370e7a4c6c7be4e0a50fa20108dd4946"; 

        function generateQRCode() {
            const qrBox = document.getElementById("myQRCodeBox");
            qrBox.innerHTML = ''; 

            qrInstance = new QRCode(qrBox, {
                text: "USER_CONNECT_CODE_8888",
                width: 175,
                height: 175,
                colorDark: "#000000",
                colorLight: "#ffffff",
                correctLevel: QRCode.CorrectLevel.H
            });
        }

        window.addEventListener('DOMContentLoaded', () => {
            generateQRCode();

            setTimeout(() => {
                const splash = document.getElementById('splashScreen');
                const chatList = document.getElementById('chatListContainer');

                if (splash) {
                    splash.classList.add('fade-out');
                    chatList.style.display = 'flex';
                    setTimeout(() => chatList.classList.add('visible'), 50);
                    renderChatList();

                    setTimeout(() => {
                        splash.style.display = 'none';
                    }, 600);
                }
            }, 1850);
        });

        function openSettings() { document.getElementById('settingsScreen').style.display = 'flex'; }
        function closeSettings() { document.getElementById('settingsScreen').style.display = 'none'; }

        function handleSimilarImageSelect(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const previewImg = document.getElementById('similar-img-preview');
                const searchBtn = document.getElementById('similar-img-search-btn');
                const resultsContainer = document.getElementById('search-results-container');

                selectedBase64Image = e.target.result;
                previewImg.src = selectedBase64Image;
                previewImg.style.display = 'block';
                searchBtn.style.display = 'block';
                
                resultsContainer.style.display = 'none';
                resultsContainer.innerHTML = '';
            };
            reader.readAsDataURL(file);
        }

        async function executeSimilarImageSearch() {
            if (!selectedBase64Image) return;

            const searchBtn = document.getElementById('similar-img-search-btn');
            const resultsContainer = document.getElementById('search-results-container');
            
            searchBtn.disabled = true;
            searchBtn.innerText = "Đang phân tích hình ảnh...";
            resultsContainer.style.display = 'grid';
            resultsContainer.innerHTML = "<div style='color:var(--text-sub); font-size:13px; grid-column:span 2; padding:20px; text-align:center;'>Đang kết nối dữ liệu hình ảnh...</div>";

            try {
                // 1. Tải ảnh lên ImgBB
                const formData = new FormData();
                formData.append("image", selectedBase64Image.split(',')[1]);

                const imgbbResponse = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, {
                    method: "POST",
                    body: formData
                });
                const imgbbData = await imgbbResponse.json();

                if (!imgbbData || !imgbbData.success) {
                    throw new Error("Lỗi khi tải hình ảnh lên server.");
                }

                const imageUrl = imgbbData.data.url;

                // 2. Tìm kiếm qua Google Lens API bằng Proxy CORS ổn định
                const targetSerpApiUrl = `https://serpapi.com/search.json?engine=google_lens&url=${encodeURIComponent(imageUrl)}&hl=vi&gl=vn&api_key=${SERPAPI_KEY}`;
                const proxyUrl = `https://corsproxy.io/?${encodeURIComponent(targetSerpApiUrl)}`;

                const response = await fetch(proxyUrl);
                if (!response.ok) {
                    throw new Error("Dịch vụ tìm kiếm không phản hồi.");
                }

                const searchData = await response.json();
                resultsContainer.innerHTML = "";

                if (searchData.error) {
                    throw new Error(searchData.error);
                }

                // 3. Render danh sách ảnh xem trước
                const items = searchData.visual_matches || searchData.images_results || [];

                if (items.length > 0) {
                    items.forEach(item => {
                        const imgUrl = item.thumbnail || (item.images && item.images[0] ? item.images[0].url : item.original || '');
                        if (!imgUrl) return;

                        const card = document.createElement("a");
                        card.className = "result-card";
                        card.href = item.link || item.source_page || "#";
                        card.target = "_blank";
                        card.rel = "noopener noreferrer";

                        const fallbackImg = "data:image/svg+xml;charset=UTF-8,%3Csvg%20width%3D%22150%22%20height%3D%22120%22%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%3E%3Crect%20width%3D%22100%25%22%20height%3D%22100%25%22%20fill%3D%22%23222%22%2F%3E%3Ctext%20x%3D%2250%25%22%20y%3D%2250%25%22%20fill%3D%22%23777%22%20text-anchor%3D%22middle%22%20font-size%3D%2212%22%3EH%C3%ACnh%20%E1%BA%A3nh%3C%2Ftext%3E%3C%2Fsvg%3E";

                        card.innerHTML = `
                            <img class="result-card-media" src="${imgUrl}" alt="Hình ảnh khớp" loading="lazy" onerror="this.onerror=null; this.src='${fallbackImg}';">
                            <div class="result-card-title">${item.title || "Hình ảnh tương tự"}</div>
                            <div class="result-card-source">${item.source || "Google Lens"}</div>
                        `;
                        resultsContainer.appendChild(card);
                    });
                } else {
                    resultsContainer.innerHTML = "<div style='color:var(--text-sub); font-size:13px; grid-column:span 2; padding:20px; text-align:center;'>Không tìm thấy hình ảnh tương tự nào.</div>";
                }

            } catch (error) {
                console.error("Lỗi API:", error);
                resultsContainer.innerHTML = `<div style='color:#ff4d4d; font-size:12px; grid-column:span 2; padding:15px; text-align:center;'>Lỗi: ${error.message || 'Không thể lấy dữ liệu.'}</div>`;
            } finally {
                searchBtn.disabled = false;
                searchBtn.innerText = "Tìm kiếm qua API";
            }
        }

        async function openQRScannerScreen() {
            closeSettings();
            document.getElementById('qrScannerScreen').style.display = 'flex';
            try {
                videoStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
                const video = document.getElementById('camera-preview-full');
                video.style.display = 'block';
                video.srcObject = videoStream;
                video.play();
                requestAnimationFrame(tickCameraScan);
            } catch (err) {
                alert("Hãy cấp quyền Camera trên HTTPS.");
            }
        }

        function closeQRScannerScreen() {
            stopCamera();
            document.getElementById('qrScannerScreen').style.display = 'none';
        }

        function stopCamera() {
            if (videoStream) {
                videoStream.getTracks().forEach(track => track.stop());
                videoStream = null;
            }
        }

        function tickCameraScan() {
            const scannerScreen = document.getElementById('qrScannerScreen');
            if (scannerScreen.style.display !== 'flex') return;

            const video = document.getElementById('camera-preview-full');
            if (video.readyState === video.HAVE_ENOUGH_DATA) {
                const canvas = document.createElement('canvas');
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                
                const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                const code = jsQR(imageData.data, imageData.width, imageData.height);

                if (code) {
                    stopCamera();
                    addFriendFromQRData(code.data);
                    return;
                }
            }
            requestAnimationFrame(tickCameraScan);
        }

        function scanQRCodeFromGallery(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const context = canvas.getContext('2d');
                    canvas.width = img.width;
                    canvas.height = img.height;
                    context.drawImage(img, 0, 0, img.width, img.height);
                    
                    const imageData = context.getImageData(0, 0, canvas.width, canvas.height);
                    const code = jsQR(imageData.data, imageData.width, imageData.height);

                    if (code) {
                        closeQRScannerScreen();
                        addFriendFromQRData(code.data);
                    } else {
                        alert("Không tìm thấy mã QR.");
                    }
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function openMyQRScreen() {
            stopCamera();
            document.getElementById('qrScannerScreen').style.display = 'none';
            document.getElementById('myQRScreen').style.display = 'flex';
        }

        function closeMyQRScreen() { document.getElementById('myQRScreen').style.display = 'none'; }

        function copyMyLink() { alert("Đã sao chép liên kết!"); }

        function addFriendFromQRData(qrContent) {
            let friendName = "Người dùng (" + qrContent.substring(0, 6) + ")";
            let existing = chatData.find(c => c.id === qrContent);
            if (!existing) {
                existing = { id: qrContent, name: friendName, messages: [] };
                chatData.unshift(existing);
                localStorage.setItem('scarlet_chats', JSON.stringify(chatData));
            }
            renderChatList();
            openChatView(existing.id);
        }

        function renderChatList() {
            const chatListEl = document.getElementById('chatList');
            const searchVal = document.getElementById('searchInput').value.toLowerCase();
            chatListEl.innerHTML = '';

            const filteredChats = chatData.filter(c => c.name.toLowerCase().includes(searchVal));

            if (filteredChats.length === 0) {
                chatListEl.innerHTML = `<div class="empty-chat-state">Chưa có cuộc trò chuyện nào.<br>Vào Cài đặt để mở Mã QR kết nối.</div>`;
                return;
            }

            filteredChats.forEach(chat => {
                const lastMsg = chat.messages.length > 0 ? chat.messages[chat.messages.length - 1].text : 'Hãy bắt đầu trò chuyện!';
                const item = document.createElement('div');
                item.className = 'chat-item';
                item.onclick = () => openChatView(chat.id);
                item.innerHTML = `
                    <div class="chat-avatar">${chat.name.charAt(0).toUpperCase()}</div>
                    <div class="chat-info">
                        <div class="chat-name">${chat.name}</div>
                        <div class="chat-last-msg">${lastMsg}</div>
                    </div>
                `;
                chatListEl.appendChild(item);
            });
        }

        function openChatView(chatId) {
            activeChatId = chatId;
            const chat = chatData.find(c => c.id === chatId);
            if (!chat) return;

            document.getElementById('chatViewTitle').innerText = chat.name;
            document.getElementById('chatViewAvatar').innerText = chat.name.charAt(0).toUpperCase();
            document.getElementById('chatView').style.display = 'flex';
            renderMessages();
        }

        function closeChatView() {
            activeChatId = null;
            document.getElementById('chatView').style.display = 'none';
            renderChatList();
        }

        function renderMessages() {
            const chat = chatData.find(c => c.id === activeChatId);
            const body = document.getElementById('chatViewBody');
            body.innerHTML = '';
            if (!chat) return;

            chat.messages.forEach(msg => {
                const bubble = document.createElement('div');
                bubble.className = `msg-bubble ${msg.sender === 'me' ? 'msg-right' : 'msg-left'}`;
                bubble.innerText = msg.text;
                body.appendChild(bubble);
            });
            body.scrollTop = body.scrollHeight;
        }

        function sendMessage() {
            const input = document.getElementById('chatInput');
            const text = input.value.trim();
            if (!text || !activeChatId) return;

            const chat = chatData.find(c => c.id === activeChatId);
            if (!chat) return;

            chat.messages.push({ sender: 'me', text: text });
            input.value = '';
            renderMessages();
            localStorage.setItem('scarlet_chats', JSON.stringify(chatData));
        }

        function handleKeyPress(e) { if (e.key === 'Enter') sendMessage(); }
    </script>
</body>
</html>
