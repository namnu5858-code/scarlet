<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giao diện Chat Đổi Màu Theo Thiết Bị</title>
    <style>
        :root {
            --bg-color: #f4f5f8;
            --chat-bg: #ffffff;
            --text-color: #1c1e21;
            --input-bg: rgba(0, 0, 0, 0.05);
            --input-border: rgba(0, 0, 0, 0.12);
            --input-text: #1c1e21;
            --placeholder-color: #8a8d91;
            --button-bg: #0084ff;
            --button-hover: #0073e6;
            --button-icon: #ffffff;
            --shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #000000;
                --chat-bg: #0a0a0c;
                --text-color: #e4e6eb;
                --input-bg: rgba(255, 255, 255, 0.06);
                --input-border: rgba(255, 255, 255, 0.15);
                --input-text: #ffffff;
                --placeholder-color: #7d838c;
                --button-bg: rgba(255, 255, 255, 0.12);
                --button-hover: rgba(255, 255, 255, 0.22);
                --button-icon: #ffffff;
                --shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
            }
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .chat-container {
            width: 100%;
            max-width: 600px;
            height: 90vh;
            background-color: var(--chat-bg);
            border-radius: 20px;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid var(--input-border);
        }

        .messages-area {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message {
            max-width: 75%;
            padding: 10px 16px;
            border-radius: 18px;
            font-size: 15px;
            line-height: 1.4;
            align-self: flex-start;
        }

        .message.received {
            background-color: var(--input-bg);
            color: var(--text-color);
            border-bottom-left-radius: 4px;
        }

        .message.sent {
            background-color: var(--input-bg);
            color: var(--text-color);
            border-bottom-left-radius: 4px;
        }

        .input-bar {
            padding: 15px 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            background-color: var(--chat-bg);
        }

        .input-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            background-color: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: 30px;
            padding: 12px 20px;
            backdrop-filter: blur(10px);
            transition: all 0.2s ease;
        }

        .input-wrapper:focus-within {
            border-color: rgba(0, 132, 255, 0.6);
            box-shadow: 0 0 0 2px rgba(0, 132, 255, 0.2);
        }

        .chat-input {
            width: 100%;
            background: transparent;
            border: none;
            outline: none;
            color: var(--input-text);
            font-size: 16px;
        }

        .chat-input::placeholder {
            color: var(--placeholder-color);
        }

        .send-button {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background-color: var(--button-bg);
            border: 1px solid var(--input-border);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s ease;
            flex-shrink: 0;
        }

        .send-button:hover {
            background-color: var(--button-hover);
            transform: scale(1.05);
        }

        .send-button svg {
            width: 20px;
            height: 20px;
            fill: var(--button-icon);
            transform: translateX(1px);
        }
    </style>
</head>
<body>

    <div class="chat-container">
        <div class="messages-area" id="messagesArea">
            <div class="message received">
                Xin chào! Khung chat đã được tối giản và căn lề trái hoàn toàn.
            </div>
        </div>

        <div class="input-bar">
            <div class="input-wrapper">
                <input type="text" class="chat-input" id="messageInput" placeholder="Nhập tin nhắn..." autocomplete="off">
            </div>
            <button class="send-button" id="sendBtn" aria-label="Gửi">
                <svg viewBox="0 0 24 24">
                    <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path>
                </svg>
            </button>
        </div>
    </div>

    <script>
        const sendBtn = document.getElementById('sendBtn');
        const messageInput = document.getElementById('messageInput');
        const messagesArea = document.getElementById('messagesArea');

        function sendMessage() {
            const text = messageInput.value.trim();
            if (text !== "") {
                const messageDiv = document.createElement('div');
                messageDiv.className = 'message sent';
                messageDiv.textContent = text;
                messagesArea.appendChild(messageDiv);
                
                messageInput.value = "";
                messagesArea.scrollTop = messagesArea.scrollHeight;
            }
        }

        sendBtn.addEventListener('click', sendMessage);
        messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });
    </script>
</body>
</html>
