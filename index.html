<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giao Diện Hình Ảnh & Video</title>
    <style>
        /* Cấu hình cơ bản */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Roboto', Arial, sans-serif;
            background-color: #0f0f0f; /* Tông màu tối kiểu YouTube */
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 1000px;
            background-color: #181818;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            text-align: center;
        }

        /* Khung chứa thông điệp / Lời chúc ở trung tâm */
        .message-box {
            background: linear-gradient(135deg, #272727, #212121);
            border: 1px solid #383838;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 30px;
        }
        .message-box p {
            font-size: 1.1rem;
            line-height: 1.6;
            color: #f1f1f1;
            font-weight: 500;
        }

        /* Bố cục lưới đối xứng, thẳng hàng kiểu YouTube */
        .media-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            justify-content: center;
        }

        /* Khung từng thẻ media (Video/Hình ảnh) */
        .media-card {
            background-color: #212121;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #303030;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .media-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 6px 16px rgba(0,0,0,0.4);
        }

        /* Đảm bảo hình ảnh/video luôn thẳng, không bị chéo */
        .media-wrapper {
            position: relative;
            width: 100%;
            padding-top: 56.25%; /* Tỉ lệ chuẩn 16:9 của YouTube */
            background-color: #000;
        }
        .media-wrapper img, 
        .media-wrapper video, 
        .media-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover; /* Giữ hình ảnh phẳng và không gãy khung */
            border: none;
        }

        .media-title {
            padding: 12px;
            font-size: 0.95rem;
            text-align: left;
            color: #aaaaaa;
        }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- ĐOẠN NỘI DUNG (COPY) GIỮ NGUYÊN BÊN TRÊN -->
        <div class="message-box">
            <p>Bạn ấy không nói gì thêm để mình giữ copy.</p>
        </div>

        <!-- BỐ CỤC LƯỚI BẢO ĐẢM THẲNG HÀNG & ĐỐI XỨNG -->
        <div class="media-grid">
            
            <!-- Ô Media 1 -->
            <div class="media-card">
                <div class="media-wrapper">
                    <!-- Thay link hình hoặc video của bạn vào src bên dưới -->
                    <img src="https://via.placeholder.com/600x337" alt="Hình ảnh 1">
                </div>
                <div class="media-title">Nội dung / Video 01</div>
            </div>

            <!-- Ô Media 2 -->
            <div class="media-card">
                <div class="media-wrapper">
                    <img src="https://via.placeholder.com/600x337" alt="Hình ảnh 2">
                </div>
                <div class="media-title">Nội dung / Video 02</div>
            </div>

            <!-- Ô Media 3 -->
            <div class="media-card">
                <div class="media-wrapper">
                    <img src="https://via.placeholder.com/600x337" alt="Hình ảnh 3">
                </div>
                <div class="media-title">Nội dung / Video 03</div>
            </div>

            <!-- Ô Media 4 -->
            <div class="media-card">
                <div class="media-wrapper">
                    <img src="https://via.placeholder.com/600x337" alt="Hình ảnh 4">
                </div>
                <div class="media-title">Nội dung / Video 04</div>
            </div>

        </div>

    </div>

</body>
</html>
