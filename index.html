<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>Cam Thung Middle School - 3D Campus Fireworks</title>

<style>
*{
  box-sizing:border-box;
  -webkit-user-select:none;
  user-select:none;
  -webkit-touch-callout:none;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#8fd4f5;
  touch-action:none;
  font-family:Arial,sans-serif;
}

#game-container{
  position:fixed;
  top:0;
  left:0;
  width:100vw;
  height:100vh;
  z-index:1;
}

canvas{
  display:block;
  width:100vw !important;
  height:100vh !important;
}

#loading{
  position:absolute;
  top:14px;
  right:16px;
  padding:8px 14px;
  border-radius:10px;
  background:rgba(0,0,0,.42);
  color:white;
  font-size:12px;
  z-index:30;
  pointer-events:none;
}
</style>

<script type="importmap">
{
  "imports":{
    "three":"https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>

<body>

<div id="game-container"></div>
<div id="loading">Đang dựng khuôn viên trường 3D...</div>

<script type="module">
import * as THREE from "three";

// ============================================================
// SCENE & RENDERER
// ============================================================

const container = document.getElementById("game-container");
const loading = document.getElementById("loading");

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x8fd4f5);
scene.fog = new THREE.FogExp2(0xbfeafa, 0.0012);

const cameraPivot = new THREE.Object3D();
scene.add(cameraPivot);

const camera = new THREE.PerspectiveCamera(
  60,
  window.innerWidth / window.innerHeight,
  0.1,
  3000
);
camera.position.set(0, 35, 110);
camera.lookAt(0, 10, 0);
cameraPivot.add(camera);

const renderer = new THREE.WebGLRenderer({
  antialias: true,
  powerPreference: "high-performance"
});

renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;

container.appendChild(renderer.domElement);

// ============================================================
// LIGHTING & MATERIALS
// ============================================================

const hemisphere = new THREE.HemisphereLight(0xe8f8ff, 0x516b3b, 1.5);
scene.add(hemisphere);

const sunlight = new THREE.DirectionalLight(0xfff3d2, 2.2);
sunlight.position.set(100, 130, 80);
sunlight.castShadow = true;
scene.add(sunlight);

const MAT = {
  grass: new THREE.MeshStandardMaterial({ color: 0x73b951, roughness: .9 }),
  redTile: new THREE.MeshStandardMaterial({ color: 0xa94c3d, roughness: .78 }),
  yellowWall: new THREE.MeshStandardMaterial({ color: 0xe7d16a, roughness: .8 }),
  whiteConcrete: new THREE.MeshStandardMaterial({ color: 0xeeeeee, roughness: .6 }),
  darkMetal: new THREE.MeshStandardMaterial({ color: 0x30383b, roughness: .55, metalness: .65 }),
  stemGreen: new THREE.MeshStandardMaterial({ color: 0x2e7d32, roughness: .6 }),
  petalYellow: new THREE.MeshStandardMaterial({ color: 0xffd54f, roughness: .4 }),
  flowerCenter: new THREE.MeshStandardMaterial({ color: 0x5d4037, roughness: .9 })
};

const sharedBoxGeo = new THREE.BoxGeometry(1, 1, 1);
const sharedCylinderGeo = new THREE.CylinderGeometry(1, 1, 1, 8);

function box(w, h, d, x, y, z, material, parent = scene) {
  const mesh = new THREE.Mesh(sharedBoxGeo, material);
  mesh.scale.set(w, h, d);
  mesh.position.set(x, y, z);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  parent.add(mesh);
  return mesh;
}

// ============================================================
// FULL CAMPUS RECONSTRUCTION (KHUÔN VIÊN TRƯỜNG & HOA HƯỚNG DƯƠNG)
// ============================================================

const campus = new THREE.Group();
scene.add(campus);

// Nền cỏ & Sân gạch đỏ
box(2500, 1, 2500, 0, -0.7, 0, MAT.grass, campus);
box(240, .45, 190, 0, 0, 0, MAT.redTile, campus);

// Dãy nhà chính
box(140, 24, 28, 0, 12, -60, MAT.yellowWall, campus);
box(144, 2, 30, 0, 25, -60, MAT.redTile, campus);

// Cổng trường & Bức tường tên trường
box(8, 16, 8, -35, 8, 85, MAT.whiteConcrete, campus);
box(8, 16, 8, 35, 8, 85, MAT.whiteConcrete, campus);
box(62, 4, 4, 0, 14, 85, MAT.darkMetal, campus);
box(30, 10, 4, -55, 5, 85, MAT.yellowWall, campus); // Tường tên trường bên trái

// Hàm tạo Hoa Hướng Dương
function buildSunflower(x, z, scale = 1) {
  const flowerGroup = new THREE.Group();
  flowerGroup.position.set(x, 0, z);
  flowerGroup.scale.set(scale, scale, scale);

  // Thân cây
  const stem = new THREE.Mesh(sharedCylinderGeo, MAT.stemGreen);
  stem.scale.set(0.2, 3, 0.2);
  stem.position.y = 1.5;
  stem.castShadow = true;
  flowerGroup.add(stem);

  // Nhụy hoa
  const center = new THREE.Mesh(sharedCylinderGeo, MAT.flowerCenter);
  center.scale.set(0.8, 0.2, 0.8);
  center.rotation.x = Math.PI / 4;
  center.position.y = 3;
  center.castShadow = true;
  flowerGroup.add(center);

  // Cánh hoa tỏa tròn
  const petalCount = 12;
  for (let i = 0; i < petalCount; i++) {
    const angle = (i / petalCount) * Math.PI * 2;
    const petal = new THREE.Mesh(sharedBoxGeo, MAT.petalYellow);
    petal.scale.set(0.3, 0.08, 0.9);
    petal.position.set(
      Math.sin(angle) * 0.9,
      3 + Math.cos(angle) * 0.1,
      Math.cos(angle) * 0.9
    );
    petal.rotation.y = angle;
    petal.rotation.x = Math.PI / 4;
    petal.castShadow = true;
    flowerGroup.add(petal);
  }

  campus.add(flowerGroup);
}

// Trồng vườn hoa hướng dương hai bên sân trường
for (let i = -80; i <= 80; i += 16) {
  buildSunflower(i, -35, 1.2);
  buildSunflower(i, 35, 1.2);
}

// ============================================================
// AUDIO SYNTHESIZER (ÂM THANH PHÁO HOA)
// ============================================================

let audioCtx = null;

function initAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (audioCtx.state === 'suspended') {
    audioCtx.resume();
  }
}

function playLaunchSound() {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(120, audioCtx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(500, audioCtx.currentTime + 0.35);
  gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.35);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + 0.35);
}

function playExplosionSound() {
  if (!audioCtx) return;
  const bufferSize = audioCtx.sampleRate * 0.45;
  const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i = 0; i < bufferSize; i++) {
    data[i] = Math.random() * 2 - 1;
  }
  const noise = audioCtx.createBufferSource();
  noise.buffer = buffer;

  const filter = audioCtx.createBiquadFilter();
  filter.type = 'lowpass';
  filter.frequency.setValueAtTime(700, audioCtx.currentTime);
  filter.frequency.exponentialRampToValueAtTime(25, audioCtx.currentTime + 0.45);

  const gain = audioCtx.createGain();
  gain.gain.setValueAtTime(0.35, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.45);

  noise.connect(filter);
  filter.connect(gain);
  gain.connect(audioCtx.destination);
  noise.start();
}

window.addEventListener("pointerdown", initAudio);

// ============================================================
// OPTIMIZED FIREWORKS SYSTEM (BẮN TỪ TÂM SÂN & LAN TỎA MỌI HƯỚNG)
// ============================================================

const PARTICLE_COUNT = 70;
const FIREWORK_COLORS = [0xff3355, 0x33ff66, 0x3399ff, 0xffff33, 0xff33ff, 0x00ffff, 0xff9900];

function createCircleTexture() {
  const canvas = document.createElement('canvas');
  canvas.width = 32;
  canvas.height = 32;
  const ctx = canvas.getContext('2d');
  const gradient = ctx.createRadialGradient(16, 16, 0, 16, 16, 16);
  gradient.addColorStop(0, 'rgba(255,255,255,1)');
  gradient.addColorStop(0.4, 'rgba(255,255,255,0.8)');
  gradient.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = gradient;
  ctx.beginPath();
  ctx.arc(16, 16, 16, 0, Math.PI * 2);
  ctx.fill();
  return new THREE.CanvasTexture(canvas);
}

const particleTexture = createCircleTexture();
const fireworks = [];

class CenterFirework {
  constructor() {
    // Bắn xuất phát từ trung tâm sân trường (0,0,0)
    this.startX = (Math.random() - 0.5) * 10;
    this.startZ = (Math.random() - 0.5) * 10;
    this.startY = 0;
    
    // Đổ lệch góc để đạn pháo lan tỏa ra các hướng xung quanh bầu trời
    const launchAngle = Math.random() * Math.PI * 2;
    const spreadDistance = 25 + Math.random() * 40;
    this.targetX = this.startX + Math.cos(launchAngle) * spreadDistance;
    this.targetZ = this.startZ + Math.sin(launchAngle) * spreadDistance;
    this.targetY = 35 + Math.random() * 20; // Bay cao vừa đủ tầm nhìn
    
    this.currentX = this.startX;
    this.currentY = this.startY;
    this.currentZ = this.startZ;
    this.progress = 0;
    this.speed = 0.02 + Math.random() * 0.01;
    
    this.state = 'launching';
    
    // Rocket Vệt Bay
    const rocketGeo = new THREE.BufferGeometry();
    rocketGeo.setAttribute('position', new THREE.Float32BufferAttribute([this.currentX, this.currentY, this.currentZ], 3));
    const rocketMat = new THREE.PointsMaterial({
      color: 0xffffff,
      size: 1.5,
      map: particleTexture,
      transparent: true,
      blending: THREE.AdditiveBlending,
      depthWrite: false
    });
    this.rocket = new THREE.Points(rocketGeo, rocketMat);
    scene.add(this.rocket);

    playLaunchSound();
  }

  explode() {
    scene.remove(this.rocket);
    this.rocket.geometry.dispose();
    this.rocket.material.dispose();

    this.state = 'exploded';
    this.color = FIREWORK_COLORS[Math.floor(Math.random() * FIREWORK_COLORS.length)];
    
    const positions = new Float32Array(PARTICLE_COUNT * 3);
    this.velocities = [];

    for (let i = 0; i < PARTICLE_COUNT; i++) {
      positions[i * 3] = this.currentX;
      positions[i * 3 + 1] = this.currentY;
      positions[i * 3 + 2] = this.currentZ;

      // Hướng tỏa tròn đều dạng cầu đẹp mắt
      const theta = Math.random() * Math.PI * 2;
      const phi = Math.acos((Math.random() * 2) - 1);
      const spd = 0.35 + Math.random() * 0.45;

      this.velocities.push(new THREE.Vector3(
        Math.sin(phi) * Math.cos(theta) * spd,
        Math.sin(phi) * Math.sin(theta) * spd,
        Math.cos(phi) * spd
      ));
    }

    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));

    const mat = new THREE.PointsMaterial({
      color: this.color,
      size: 2.0,
      map: particleTexture,
      transparent: true,
      opacity: 1.0,
      blending: THREE.AdditiveBlending,
      depthWrite: false
    });

    this.particles = new THREE.Points(geo, mat);
    scene.add(this.particles);

    playExplosionSound();
  }

  update() {
    if (this.state === 'launching') {
      this.progress += this.speed;
      this.currentX = THREE.MathUtils.lerp(this.startX, this.targetX, this.progress);
      this.currentY = THREE.MathUtils.lerp(this.startY, this.targetY, this.progress);
      this.currentZ = THREE.MathUtils.lerp(this.startZ, this.targetZ, this.progress);

      const pos = this.rocket.geometry.attributes.position.array;
      pos[0] = this.currentX;
      pos[1] = this.currentY;
      pos[2] = this.currentZ;
      this.rocket.geometry.attributes.position.needsUpdate = true;

      if (this.progress >= 1.0) {
        this.explode();
      }
    } else if (this.state === 'exploded') {
      const pos = this.particles.geometry.attributes.position.array;
      
      for (let i = 0; i < PARTICLE_COUNT; i++) {
        pos[i * 3] += this.velocities[i].x;
        pos[i * 3 + 1] += this.velocities[i].y;
        pos[i * 3 + 2] += this.velocities[i].z;

        this.velocities[i].y -= 0.007; // Trọng lực nhẹ
        this.velocities[i].multiplyScalar(0.98); // Lực cản không khí
      }

      this.particles.geometry.attributes.position.needsUpdate = true;
      this.particles.material.opacity -= 0.014;

      if (this.particles.material.opacity <= 0) {
        this.state = 'dead';
        scene.remove(this.particles);
        this.particles.geometry.dispose();
        this.particles.material.dispose();
      }
    }
  }
}

// Ẩn màn hình chờ khi dựng cảnh xong
setTimeout(() => {
  loading.style.display = "none";
}, 800);

// ============================================================
// RENDER LOOP
// ============================================================

let lastFireworkTime = 0;

function animate(time) {
  requestAnimationFrame(animate);

  // Xoay nhẹ góc nhìn quanh toàn cảnh trường
  cameraPivot.rotation.y += 0.0015;

  // Bắn pháo hoa liên tục từ tâm lan tỏa ra xung quanh mỗi 0.6 - 1.0 giây
  if (time - lastFireworkTime > 600 + Math.random() * 400) {
    fireworks.push(new CenterFirework());
    lastFireworkTime = time;
  }

  // Cập nhật hệ thống pháo hoa
  for (let i = fireworks.length - 1; i >= 0; i--) {
    fireworks[i].update();
    if (fireworks[i].state === 'dead') {
      fireworks.splice(i, 1);
    }
  }

  renderer.render(scene, camera);
}

window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

animate(0);
</script>

</body>
</html>
