<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>Cam Thung Middle School - 3D Campus</title>

<style>
*{
  box-sizing:border-box;
  -webkit-user-select:none;
  user-select:none;
  -webkit-touch-callout:none;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#8fd4f5;
  touch-action:none;
  font-family:Arial,sans-serif;
}

#game-container{
  position:fixed;
  top:0;
  left:0;
  width:100vw;
  height:100vh;
  z-index:1;
}

canvas{
  display:block;
  width:100vw !important;
  height:100vh !important;
}

.glass-ui{
  background:rgba(255,255,255,.18);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  border:1px solid rgba(255,255,255,.4);
  box-shadow:0 8px 32px rgba(0,0,0,.18);
}

#joystick-wrapper{
  position:absolute;
  left:32px;
  bottom:32px;
  width:120px;
  height:120px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:20;
  touch-action:none;
}

#joystick-stick{
  position:absolute;
  width:52px;
  height:52px;
  border-radius:50%;
  background:rgba(255,255,255,.58);
  border:1px solid rgba(255,255,255,.85);
  box-shadow:0 4px 14px rgba(0,0,0,.18);
  pointer-events:none;
}

#jump-btn{
  position:absolute;
  right:32px;
  bottom:38px;
  width:72px;
  height:72px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:20;
  touch-action:none;
  transition:background .3s ease,transform .1s ease;
}

#jump-btn.flying{
  background:rgba(255,215,0,.55);
  border-color:rgba(255,255,255,.9);
  box-shadow:0 0 15px rgba(255,215,0,.6);
}

#jump-btn:active{
  transform:scale(.94);
}

#jump-btn svg{
  width:34px;
  height:34px;
  fill:none;
  stroke:white;
  stroke-width:2.5;
  stroke-linecap:round;
  stroke-linejoin:round;
}

#loading{
  position:absolute;
  top:14px;
  right:16px;
  padding:8px 14px;
  border-radius:10px;
  background:rgba(0,0,0,.42);
  color:white;
  font-size:12px;
  z-index:30;
  pointer-events:none;
}

/* ============================================================
   ROBLOX STYLE CHAT UI (BOTTOM LEFT WITH TOGGLE) - BLACK THEME
   ============================================================ */

#zalo-chat-wrapper {
  position: absolute;
  left: 20px;
  bottom: 170px;
  z-index: 40;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
}

#zalo-chat-toggle-btn {
  width: 50px;
  height: 50px;
  border-radius: 50%;
  background: #111;
  border: 2px solid rgba(255,255,255,0.4);
  color: white;
  font-size: 22px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  box-shadow: 0 4px 15px rgba(0,0,0,0.5);
  transition: transform 0.2s ease, background 0.2s ease;
  outline: none;
}

#zalo-chat-toggle-btn:active {
  transform: scale(0.92);
}

#roblox-chat-container{
  width: 320px;
  height: 180px;
  background: rgba(15,15,15,0.85);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border-radius: 8px;
  border: 1px solid rgba(255,255,255,0.15);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  box-shadow: 0 6px 24px rgba(0,0,0,0.6);
  margin-bottom: 10px;
  transition: all 0.3s ease;
  transform-origin: bottom left;
}

#roblox-chat-container.minimized {
  opacity: 0;
  transform: scale(0.8);
  pointer-events: none;
  height: 0;
  margin-bottom: 0;
  border: none;
}

#roblox-chat-header {
  background: rgba(30, 30, 30, 0.95);
  padding: 6px 10px;
  color: white;
  font-size: 12px;
  font-weight: bold;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid rgba(255,255,255,0.1);
}

#roblox-chat-close {
  background: none;
  border: none;
  color: white;
  font-size: 16px;
  cursor: pointer;
}

#roblox-chat-messages{
  flex:1;
  padding:10px;
  overflow-y:auto;
  font-size:13px;
  color:#fff;
  display:flex;
  flex-direction:column;
  gap:6px;
  scroll-behavior:smooth;
}

.chat-msg{
  background:rgba(0,0,0,0.4);
  padding:6px 10px;
  border-radius:6px;
  word-break:break-word;
  line-height:1.35;
}

.chat-msg span.admin-tag {
  color: #ff3366;
  font-weight: bold;
  text-shadow: 0 0 5px rgba(255,51,102,0.5);
}

/* Hiệu ứng 7 màu lấp lánh động cho tên nam */
@keyframes rainbowGlow {
  0% { color: #ff0000; text-shadow: 0 0 8px #ff0000; }
  14% { color: #ff7f00; text-shadow: 0 0 8px #ff7f00; }
  28% { color: #ffff00; text-shadow: 0 0 8px #ffff00; }
  42% { color: #00ff00; text-shadow: 0 0 8px #00ff00; }
  57% { color: #00ffff; text-shadow: 0 0 8px #00ffff; }
  71% { color: #0000ff; text-shadow: 0 0 8px #0000ff; }
  85% { color: #8b00ff; text-shadow: 0 0 8px #8b00ff; }
  100% { color: #ff0000; text-shadow: 0 0 8px #ff0000; }
}

.chat-msg span.rainbow-nam {
  font-weight: bold;
  animation: rainbowGlow 3s infinite linear;
}

#roblox-chat-input-wrap{
  padding:8px;
  background:rgba(10,10,10,0.9);
  border-top:1px solid rgba(255,255,255,0.1);
}

#roblox-chat-input{
  width:100%;
  height:32px;
  background:rgba(255,255,255,0.1);
  border:1px solid rgba(255,255,255,0.2);
  border-radius:6px;
  padding:0 10px;
  color:#fff;
  font-size:13px;
  outline:none;
  -webkit-user-select:text;
  user-select:text;
}

#roblox-chat-input::placeholder{
  color:rgba(255,255,255,0.5);
}

/* ============================================================
   MÀN HÌNH KÍNH
   ============================================================ */

#screen-hint{
  position:absolute;
  left:50%;
  top:18px;
  transform:translateX(-50%);
  padding:9px 15px;
  border-radius:12px;
  background:rgba(0,0,0,.55);
  color:white;
  font-size:13px;
  z-index:25;
  pointer-events:none;
  opacity:0;
  transition:opacity .25s ease;
}

#screen-hint.show{
  opacity:1;
}

#browser-overlay{
  position:fixed;
  inset:0;
  z-index:100;
  display:none;
  background:rgba(0,0,0,.88);
  padding:
    max(10px,env(safe-area-inset-top))
    max(8px,env(safe-area-inset-right))
    max(10px,env(safe-area-inset-bottom))
    max(8px,env(safe-area-inset-left));
}

#browser-overlay.open{
  display:flex;
  flex-direction:column;
}

#browser-bar{
  width:100%;
  min-height:52px;
  display:flex;
  align-items:center;
  gap:7px;
  padding:6px;
  border-radius:14px;
  background:rgba(35,35,35,.96);
}

.browser-btn{
  width:38px;
  height:38px;
  flex:0 0 38px;
  border:0;
  border-radius:10px;
  background:#444;
  color:white;
  font-size:18px;
  touch-action:manipulation;
}

#browser-url{
  flex:1;
  min-width:0;
  height:38px;
  border:0;
  outline:none;
  border-radius:10px;
  padding:0 12px;
  background:#fff;
  color:#111;
  font-size:15px;
  -webkit-user-select:text;
  user-select:text;
}

#browser-frame-wrap{
  position:relative;
  flex:1;
  min-height:0;
  margin-top:7px;
  overflow:hidden;
  border-radius:14px;
  background:white;
}

#browser-frame{
  width:100%;
  height:100%;
  border:0;
  background:white;
}

#browser-warning{
  position:absolute;
  left:12px;
  right:12px;
  bottom:12px;
  padding:10px 12px;
  border-radius:10px;
  background:rgba(0,0,0,.75);
  color:white;
  font-size:12px;
  line-height:1.4;
  pointer-events:none;
  opacity:.85;
}
</style>

<script type="importmap">
{
  "imports":{
    "three":"https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>

<body>

<div id="game-container"></div>

<!-- YouTube Player ẩn nhúng chuẩn API -->
<div id="youtube-player-container" style="display:none;">
  <div id="yt-player"></div>
</div>

<!-- Giao diện Khung Chat kiểu Roblox Đen có nút đóng mở ở góc trái -->
<div id="zalo-chat-wrapper">
  <div id="roblox-chat-container" class="minimized">
    <div id="roblox-chat-header">
      <span>Trò chuyện / Lệnh Nhạc</span>
      <button id="roblox-chat-close">✕</button>
    </div>
    <div id="roblox-chat-messages">
      <div class="chat-msg"><span class="admin-tag">Hệ thống:</span> Bấm S (bật nhạc), A (tạm dừng) hoặc nhập lệnh chat.</div>
    </div>
    <div id="roblox-chat-input-wrap">
      <input id="roblox-chat-input" type="text" placeholder="Nhập lệnh hoặc chat..." autocomplete="off">
    </div>
  </div>
  <button id="zalo-chat-toggle-btn" title="Mở khung chat">💬</button>
</div>

<div id="loading">
Đang dựng khuôn viên trường 3D...
</div>

<div id="screen-hint">
Chạm chính xác vào màn hình kính để mở
</div>

<div id="joystick-wrapper" class="glass-ui">
  <div id="joystick-stick"></div>
</div>

<div id="jump-btn" class="glass-ui">
  <svg viewBox="0 0 24 24">
    <path d="M12 19V5"></path>
    <path d="M5 12l7-7 7 7"></path>
  </svg>
</div>

<!-- ==========================================================
     BROWSER OVERLAY
     ========================================================== -->

<div id="browser-overlay">

  <div id="browser-bar">

    <button class="browser-btn" id="browser-back">‹</button>
    <button class="browser-btn" id="browser-forward">›</button>

    <input
      id="browser-url"
      type="url"
      inputmode="url"
      autocomplete="off"
      autocapitalize="none"
      spellcheck="false"
      placeholder="Tìm kiếm với DuckDuckGo hoặc nhập địa chỉ web"
      value="https://duckduckgo.com"
    >

    <button class="browser-btn" id="browser-go">↵</button>
    <button class="browser-btn" id="browser-close">×</button>

  </div>

  <div id="browser-frame-wrap">

    <iframe
      id="browser-frame"
      title="Trình duyệt DuckDuckGo"
      src="https://duckduckgo.com"
      allow="autoplay; fullscreen; picture-in-picture; encrypted-media"
      allowfullscreen>
    </iframe>

    <div id="browser-warning">
      Một số website không cho phép hiển thị bên trong iframe do chính sách bảo mật X-Frame-Options.
    </div>

  </div>

</div>

<!-- Tải thư viện YouTube IFrame Player API -->
<script src="https://www.youtube.com/iframe_api"></script>

<script type="module">

import * as THREE from "three";
import {GLTFLoader} from "three/addons/loaders/GLTFLoader.js";

// ============================================================
// XỬ LÝ ÂM THANH YOUTUBE API & KHUNG CHAT ROBLOX STYLE
// ============================================================

let ytPlayer = null;
window.onYouTubeIframeAPIReady = function() {
  ytPlayer = new YT.Player('yt-player', {
    height: '0',
    width: '0',
    videoId: '6dEKnnPzxSc',
    playerVars: {
      'autoplay': 0,
      'loop': 1,
      'playlist': '6dEKnnPzxSc'
    },
    events: {
      'onReady': (event) => {}
    }
  });
};

const chatContainer = document.getElementById("roblox-chat-container");
const chatToggleBtn = document.getElementById("zalo-chat-toggle-btn");
const chatCloseBtn = document.getElementById("roblox-chat-close");
const chatInput = document.getElementById("roblox-chat-input");
const chatMessages = document.getElementById("roblox-chat-messages");

chatToggleBtn.addEventListener("click", () => {
  chatContainer.classList.toggle("minimized");
  if (!chatContainer.classList.contains("minimized")) {
    chatInput.focus();
  }
});

chatCloseBtn.addEventListener("click", () => {
  chatContainer.classList.add("minimized");
});

function pushChatMessage(sender, text, isSystem = false) {
  const div = document.createElement("div");
  div.className = "chat-msg";
  
  if (isSystem) {
    div.innerHTML = `<span class="admin-tag">${sender}:</span> ${text}`;
  } else {
    // Nếu là nam thì áp dụng hiệu ứng 7 màu lấp lánh động, ngược lại hiển thị bình thường
    if (sender === "nam") {
      div.innerHTML = `<span class="rainbow-nam">${sender}</span>: ${text}`;
    } else {
      div.textContent = `${sender}: ${text}`;
    }
  }
  chatMessages.appendChild(div);
  chatMessages.scrollTop = chatMessages.scrollHeight;
}

function handleMusicCommand(cmd) {
  const lower = cmd.toLowerCase();
  if (!ytPlayer || typeof ytPlayer.playVideo !== 'function') {
    pushChatMessage("Hệ thống", "Trình phát YouTube đang tải, vui lòng thử lại sau giây lát!", true);
    return;
  }
  
  if (lower === "s" || lower === "play") {
    ytPlayer.playVideo();
    pushChatMessage("Hệ thống", "Đã phát nhạc nền YouTube!", true);
  } else if (lower === "a" || lower === "pause") {
    ytPlayer.pauseVideo();
    pushChatMessage("Hệ thống", "Đã tạm dừng nhạc nền!", true);
  }
}

// Lắng nghe lệnh từ khung chat
chatInput.addEventListener("keydown", (e) => {
  if (e.key === "Enter") {
    const val = chatInput.value.trim();
    if (val) {
      pushChatMessage("nam", val);
      handleMusicCommand(val);
      chatInput.value = "";
    }
    chatInput.blur();
  }
});

// Lắng nghe phím tắt bàn phím (S để bật, A để dừng)
window.addEventListener("keydown", (e) => {
  if (document.activeElement === chatInput) return;

  const key = e.key.toUpperCase();
  if (key === "S") {
    handleMusicCommand("s");
  } else if (key === "A") {
    handleMusicCommand("a");
  } else if (e.key === "/") {
    e.preventDefault();
    chatContainer.classList.remove("minimized");
    chatInput.focus();
  }
});

// ============================================================
// SCENE & RENDERER
// ============================================================

const container=document.getElementById("game-container");
const loading=document.getElementById("loading");

const scene=new THREE.Scene();

scene.background=new THREE.Color(0x8fd4f5);

scene.fog=new THREE.FogExp2(
  0xbfeafa,
  0.0012
);

const cameraPivot=new THREE.Object3D();
scene.add(cameraPivot);

const camera=new THREE.PerspectiveCamera(
  60,
  window.innerWidth/window.innerHeight,
  0.1,
  3000
);
cameraPivot.add(camera);

let cameraDistance=10;
let targetCameraDistance=10;

let cameraAngleX=0.1;
let cameraAngleY=0;

let targetCameraAngleX=0.1;
let targetCameraAngleY=0;

const renderer=new THREE.WebGLRenderer({
  antialias:true,
  powerPreference:"high-performance"
});

renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.12;

container.appendChild(renderer.domElement);

// ============================================================
// CAMERA COLLISION
// ============================================================

const raycaster=new THREE.Raycaster();
const cameraCollisionObjects=[];

function updateCamera(){

  cameraAngleY=THREE.MathUtils.lerp(
    cameraAngleY,
    targetCameraAngleY,
    0.18
  );

  cameraAngleX=THREE.MathUtils.lerp(
    cameraAngleX,
    targetCameraAngleX,
    0.18
  );

  cameraDistance=THREE.MathUtils.lerp(
    cameraDistance,
    targetCameraDistance,
    0.12
  );

  cameraPivot.rotation.y=cameraAngleY;
  cameraPivot.rotation.x=cameraAngleX;

  const origin=cameraPivot.position.clone();

  const dir=new THREE.Vector3(0,0,1)
    .applyQuaternion(cameraPivot.quaternion);

  raycaster.set(origin,dir);

  let actualDistance=cameraDistance;

  if(cameraCollisionObjects.length>0){

    const hits=raycaster.intersectObjects(
      cameraCollisionObjects,
      true
    );

    if(
      hits.length>0 &&
      hits[0].distance<cameraDistance
    ){

      actualDistance=Math.max(
        hits[0].distance-0.3,
        0.5
      );
    }
  }

  camera.position.set(
    0,
    0,
    actualDistance
  );

  camera.lookAt(cameraPivot.position);
}

// ============================================================
// LIGHTING
// ============================================================

const hemisphere=new THREE.HemisphereLight(
  0xe8f8ff,
  0x516b3b,
  1.5
);

scene.add(hemisphere);

const sunlight=new THREE.DirectionalLight(
  0xfff3d2,
  2.2
);

sunlight.position.set(100,130,80);
sunlight.castShadow=true;

sunlight.shadow.mapSize.width=2048;
sunlight.shadow.mapSize.height=2048;

sunlight.shadow.camera.near=1;
sunlight.shadow.camera.far=400;

sunlight.shadow.camera.left=-250;
sunlight.shadow.camera.right=250;
sunlight.shadow.camera.top=250;
sunlight.shadow.camera.bottom=-250;

sunlight.shadow.bias=-0.0003;

scene.add(sunlight);

// ============================================================
// MATERIALS
// ============================================================

const MAT={};

MAT.redTile=new THREE.MeshStandardMaterial({
  color:0xa94c3d,
  roughness:.78
});

MAT.lightBlue=new THREE.MeshStandardMaterial({
  color:0x9ed9ec,
  roughness:.7
});

MAT.white=new THREE.MeshStandardMaterial({
  color:0xf4f5f0,
  roughness:.72
});

MAT.yellow=new THREE.MeshStandardMaterial({
  color:0xe7d16a,
  roughness:.8
});

MAT.darkMetal=new THREE.MeshStandardMaterial({
  color:0x30383b,
  roughness:.55,
  metalness:.65
});

MAT.steel=new THREE.MeshStandardMaterial({
  color:0xadb7ba,
  roughness:.35,
  metalness:.8
});

MAT.roofMetal=new THREE.MeshStandardMaterial({
  color:0x68777b,
  roughness:.65,
  metalness:.45
});

MAT.glass=new THREE.MeshPhysicalMaterial({
  color:0x76b9d2,
  roughness:.08,
  metalness:.05,
  transparent:true,
  opacity:.68
});

MAT.concrete=new THREE.MeshStandardMaterial({
  color:0xb8b9b3,
  roughness:.9
});

// ============================================================
// HELPER
// ============================================================

function box(
  w,
  h,
  d,
  x,
  y,
  z,
  material,
  parent=scene
){

  const mesh=new THREE.Mesh(
    new THREE.BoxGeometry(w,h,d),
    material
  );

  mesh.position.set(x,y,z);
  mesh.castShadow=true;
  mesh.receiveShadow=true;

  parent.add(mesh);

  return mesh;
}

// ============================================================
// CAMPUS & GROUND
// ============================================================

const campus=new THREE.Group();
scene.add(campus);

const CAMPUS_W=260;
const CAMPUS_D=210;

const baseGround=box(
  2500,
  1,
  2500,
  0,
  -0.7,
  0,
  new THREE.MeshStandardMaterial({
    color:0x73b951,
    roughness:1
  }),
  campus
);

cameraCollisionObjects.push(baseGround);

const courtyard=box(
  240,
  .45,
  190,
  0,
  0,
  0,
  MAT.redTile,
  campus
);

cameraCollisionObjects.push(courtyard);

const tileLineMaterial=new THREE.MeshStandardMaterial({
  color:0x5e2b26,
  roughness:.9
});

for(let x=-120;x<=120;x+=6){

  box(
    .12,
    .03,
    190,
    x,
    .235,
    0,
    tileLineMaterial,
    campus
  );
}

for(let z=-95;z<=95;z+=6){

  box(
    240,
    .03,
    .12,
    0,
    .235,
    z,
    tileLineMaterial,
    campus
  );
}

// ============================================================
// FENCE
// ============================================================

function createFenceX(z){

  box(
    CAMPUS_W,
    2,
    1,
    0,
    1,
    z,
    MAT.yellow,
    campus
  );

  for(let x=-130;x<=130;x+=4){

    box(
      .16,
      2.5,
      .16,
      x,
      2.25,
      z,
      MAT.darkMetal,
      campus
    );
  }

  box(
    CAMPUS_W,
    .16,
    .16,
    0,
    3.4,
    z,
    MAT.darkMetal,
    campus
  );

  box(
    CAMPUS_W,
    .16,
    .16,
    0,
    2.35,
    z,
    MAT.darkMetal,
    campus
  );
}

function createFenceZ(x){

  box(
    1,
    2,
    CAMPUS_D,
    x,
    1,
    0,
    MAT.yellow,
    campus
  );

  for(let z=-105;z<=105;z+=4){

    box(
      .16,
      2.5,
      .16,
      x,
      2.25,
      z,
      MAT.darkMetal,
      campus
    );
  }

  box(
    .16,
    .16,
    CAMPUS_D,
    x,
    3.4,
    0,
    MAT.darkMetal,
    campus
  );

function openBrowser(){

    .classList.add("open");

function checkScreenTouch(clientX,clientY){

  const rect=renderer.domElement.getBoundingClientRect();

  screenPointer.x=
    ((clientX-rect.left)/rect.width)*2-1;

  screenPointer.y=
    -((clientY-rect.top)/rect.height)*2+1;

  screenRaycaster.setFromCamera(
    screenPointer,
    camera
  );

  const hits=screenRaycaster.intersectObject(
    interactiveScreen,
    true
  );

  if(hits.length>0){
    openBrowser();
    return true;
  }

  return false;
}

renderer.domElement.addEventListener(
  "pointerdown",
  function(event){

    if(event.pointerType==="mouse"){

      checkScreenTouch(
        event.clientX,
        event.clientY
      );

    }
  },
  {passive:true}
);

renderer.domElement.addEventListener(
  "touchstart",
  function(event){

    if(event.touches.length!==1) return;

    const touch=event.touches[0];

    const joyRect=joystick.getBoundingClientRect();

    if(
      touch.clientX>=joyRect.left &&
      touch.clientX<=joyRect.right &&
      touch.clientY>=joyRect.top &&
      touch.clientY<=joyRect.bottom
    ){
      return;
    }

    if(
      touch.clientX>=jumpRect.left &&
      touch.clientX<=jumpRect.right &&
      touch.clientY>=jumpRect.top &&
      touch.clientY<=jumpRect.bottom
    ){
      return;
    }

    checkScreenTouch(
      touch.clientX,
      touch.clientY
    );

  },
  {passive:true}
);

const joystick=document.getElementById(
  "joystick-wrapper"
);

const stick=document.getElementById(
  "joystick-stick"
);

let joystickTouch=null;

let centerX=0;
let centerY=0;

const radius=40;

joystick.addEventListener(
  "touchstart",
  function(event){

    event.preventDefault();

    const touch=event.changedTouches[0];

    joystickTouch=touch.identifier;

    const rect=joystick.getBoundingClientRect();

    centerX=rect.left+rect.width/2;
    centerY=rect.top+rect.height/2;

    updateJoystick(touch);

  },
  {passive:false}
);

function updateJoystick(touch){

  const dx=touch.clientX-centerX;
  const dy=touch.clientY-centerY;

  const distance=Math.hypot(dx,dy);
  const angle=Math.atan2(dy,dx);

  const limited=Math.min(
    distance,
    radius
  );

  const x=Math.cos(angle)*limited;
  const y=Math.sin(angle)*limited;

  stick.style.transform=
    `translate(${x}px,${y}px)`;

  input.x=x/radius;
  input.y=-y/radius;
}

function resetJoystick(){

  joystickTouch=null;

  input.set(0,0);

  velocity.x=0;
  velocity.z=0;

  stick.style.transform=
    "translate(0px,0px)";
}

window.addEventListener(

    for(
      let i=0;
      i<event.changedTouches.length;
      i++

      if(
        event.changedTouches[i].identifier===
        joystickTouch
      ){

        updateJoystick(
          event.changedTouches[i]
        );
      }
    }
  },
  {passive:false}
);

window.addEventListener(
  "touchend",
  function(event){

    for(
      let i=0;
      i<event.changedTouches.length;
      i++
    ){

      if(
        event.changedTouches[i].identifier===
        joystickTouch
      ){

        resetJoystick();
      }
    }
  }
);

  "touchcancel",
  resetJoystick
);

let cameraTouch=null;

let lastX=0;
let lastY=0;

let initialPinchDistance=null;
let initialCameraDistance=
  targetCameraDistance;

window.addEventListener(
  "wheel",
  function(event){

    event.preventDefault();

    const zoomSensitivity=.015;

    targetCameraDistance+=
      event.deltaY*zoomSensitivity;

    targetCameraDistance=
      THREE.MathUtils.clamp(
        targetCameraDistance,
        1.5,
        60
      );

  },
  {passive:false}
);

window.addEventListener(
  "touchstart",
  function(event){

    if(event.touches.length===2){

      initialPinchDistance=
        Math.hypot(
          event.touches[0].clientX-
          event.touches[1].clientX,

          event.touches[0].clientY-
          event.touches[1].clientY
        );

      initialCameraDistance=
        targetCameraDistance;

      return;
    }

    const touch=
      event.changedTouches[0];

    if(
      touch.identifier!==joystickTouch &&
      cameraTouch===null
    ){

      cameraTouch=
        touch.identifier;

      lastX=touch.clientX;
      lastY=touch.clientY;
    }

  }
);

window.addEventListener(
  "touchmove",
  function(event){

    if(
      event.touches.length===2 &&
      initialPinchDistance!==null
    ){

      const currentDistance=
        Math.hypot(
          event.touches[0].clientX-
          event.touches[1].clientX,

          event.touches[0].clientY-
          event.touches[1].clientY
        );

      if(currentDistance>0){

        const factor=
          initialPinchDistance/
          currentDistance;

        targetCameraDistance=
          THREE.MathUtils.clamp(
            initialCameraDistance*factor,
            1.5,
            60
          );
      }

      return;
    }

    for(
      let i=0;
      i<event.changedTouches.length;
      i++
    ){

      const touch=
        event.changedTouches[i];

      if(
        touch.identifier===
        cameraTouch
      ){

        const dx=
          touch.clientX-lastX;

        const dy=
          touch.clientY-lastY;

        targetCameraAngleY-=
          dx*.005;

        targetCameraAngleX=
          THREE.MathUtils.clamp(
            targetCameraAngleX+
            dy*.005,

            -Math.PI/2+.01,
            Math.PI/2-.05
          );

        lastX=touch.clientX;
        lastY=touch.clientY;
      }
    }

  },
  {passive:false}
);

window.addEventListener(
  "touchend",
  function(event){

    if(event.touches.length<2){
      initialPinchDistance=null;
    }

    for(
      let i=0;
      i<event.changedTouches.length;
      i++
    ){

      if(
        event.changedTouches[i].identifier===
        cameraTouch
      ){

        cameraTouch=null;
      }
    }

  }
);

window.addEventListener(
  "touchcancel",
  function(){

    cameraTouch=null;
    initialPinchDistance=null;

  }
);

let animationTime=0;
let animationBlend=0;

function animateLeaves(delta,moving){

  if(!model) return;

  leafMeshes.forEach(
    (mesh,index)=>{

      const original=
        initialData.get(mesh);

      if(!original) return;

      const speed=
        .72+(index%7)*.085;

      const phase=index*.67;

      const t=
        animationTime*speed+phase;

      const wave1=Math.sin(t);
      const wave2=
        Math.sin(t*1.73+index);

      const wave3=
        Math.cos(t*.57+index*.4);

      const movement=
        (
          wave1*.62+
          wave2*.23+
          wave3*.15
        )*animationBlend;

      const side=
        index%2===0?1:-1;

      mesh.rotation.z=
        original.rotation.z+
        movement*.30*side;

      mesh.rotation.x=
        original.rotation.x+
        wave3*.15*animationBlend;

      mesh.rotation.y=
        original.rotation.y+
        wave2*.10*animationBlend;
    }
  );
}

function animateSunflower(
  delta,
  moving
){

  if(!model) return;

  const target=
    moving?1:0;

  animationBlend=
    THREE.MathUtils.lerp(
      animationBlend,
      target,
      Math.min(delta*7,1)
    );

  if(moving){
    animationTime+=delta*9.5;
  }

  const wave=
    Math.sin(animationTime);

  const bounce=
    Math.abs(wave)*.10*animationBlend;

  model.position.y=
    THREE.MathUtils.lerp(
      model.position.y,
      .22+bounce,
      Math.min(delta*13,1)
    );

  model.rotation.z=
    THREE.MathUtils.lerp(
      model.rotation.z,
      wave*.035*animationBlend,
      Math.min(delta*8,1)
    );

  animateLeaves(
    delta,
    moving
  );

  armMeshes.forEach(
    (mesh,index)=>{

      const original=
        initialData.get(mesh);

      if(!original) return;

      const side=
        index%2===0?1:-1;

      mesh.rotation.z=
        original.rotation.z+
        wave*.32*
        side*
        animationBlend;
    }
  );

  rootMeshes.forEach(
    (mesh,index)=>{

      const original=
        initialData.get(mesh);

      if(!original) return;

      const side=
        index%2===0?1:-1;

      mesh.rotation.z=
        original.rotation.z+
        Math.sin(
          animationTime+Math.PI
        )*.20*
        side*
        animationBlend;
    }
  );
}

// ============================================================
// GAME LOOP
// ============================================================

const clock=new THREE.Clock();

function animate(){

  requestAnimationFrame(animate);

  const delta=
    Math.min(
      clock.getDelta(),
      .05
    );

  const moving=
    input.lengthSq()>.01;

  if(moving){

    const forward=
      new THREE.Vector3(
        0,
        0,
        -1
      );

    const right=
      new THREE.Vector3(
        1,
        0,
        0
      );

    forward.applyAxisAngle(
      new THREE.Vector3(0,1,0),
      cameraAngleY
    );

    right.applyAxisAngle(
      new THREE.Vector3(0,1,0),
      cameraAngleY
    );

    const movement=
      new THREE.Vector3();

    movement.addScaledVector(
      right,
      input.x
    );

    movement.addScaledVector(
      forward,
      input.y
    );

    if(movement.lengthSq()>0){

      movement.normalize();

      velocity.x=
        movement.x*moveSpeed;

      velocity.z=
        movement.z*moveSpeed;

      if(model){

        const targetRotation=
          Math.atan2(
            movement.x,
            movement.z
          );

        let difference=
          targetRotation-
          model.rotation.y;

        difference=
          Math.atan2(
            Math.sin(difference),
            Math.cos(difference)
          );

        model.rotation.y+=
          difference*
          Math.min(delta*10,1);
      }
    }

  }else{

    velocity.x=0;
    velocity.z=0;
  }

  animateSunflower(
    delta,
    moving
  );

  // ==========================================================
  // FLYING
  // ==========================================================

  if(isFlying){

    if(isJumpHolding){

      velocity.y=
        THREE.MathUtils.lerp(
          velocity.y,
          50,
          delta*5
        );

    }else{

      velocity.y=
        THREE.MathUtils.lerp(
          velocity.y,
          0,
          delta*3
        );
    }

  }else{

    velocity.y+=
      gravity*delta;
  }

  player.position.y+=
    velocity.y*delta;

  if(player.position.y<=0){

    player.position.y=0;

    velocity.y=0;

    grounded=true;

    if(isFlying){

      isFlying=false;

      jump.classList.remove(
        "flying"
      );

      moveSpeed=walkSpeed;
    }
  }

  player.position.x+=
    velocity.x*delta;

  player.position.z+=
    velocity.z*delta;

  cameraPivot.position.copy(
    player.position
  );

  cameraPivot.position.y+=1.6;

  updateCamera();

  renderer.render(
    scene,
    camera
  );
}

animate();

// ============================================================
// RESIZE
// ============================================================

function onResize(){

  const width=
    window.innerWidth;

  const height=
    window.innerHeight;

  camera.aspect=
    width/height;

  camera.updateProjectionMatrix();

  renderer.setSize(
    width,
    height
  );

  renderer.setPixelRatio(
    Math.min(
      window.devicePixelRatio,
      2
    )
  );
}

window.addEventListener(
  "resize",
  onResize
);

window.addEventListener(
  "orientationchange",
  function(){

    setTimeout(
      onResize,
      100
    );

  }
);

onResize();

// ============================================================
// SERVICE WORKER
// ============================================================

if("serviceWorker" in navigator){

  window.addEventListener(
    "load",
    ()=>{
      navigator.serviceWorker
        .register(
          "./service-worker.js"
        )
        .then(
          reg=>{
            console.log(
              "Service Worker đã đăng ký thành công!",
              reg
            );
          }
        )
        .catch(
          err=>{
            console.error(
              "Lỗi đăng ký Service Worker:",
              err
            );
          }
        );
    }
  );
}

</script>
