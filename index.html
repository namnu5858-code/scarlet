<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Mo Hinh Toa Nha Chu L va Man Hinh Dong Ho</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #111;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #clock-screen {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: #ffffff;
            font-size: 36px;
            font-weight: bold;
            background: rgba(0, 0, 0, 0.6);
            padding: 10px 25px;
            border-radius: 30px;
            letter-spacing: 2px;
            pointer-events: none;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
            text-align: center;
        }
    </style>
</head>
<body>
    <div id="clock-screen">22:36 - 20/10/2026</div>

    <!-- Three.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // Khởi tạo Scene, Camera và Renderer
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a1a);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(200, 150, 250);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Ánh sáng
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
        directionalLight.position.set(100, 200, 100);
        scene.add(directionalLight);

        // Tạo sân trường
        const courtyardGeo = new THREE.PlaneGeometry(400, 400);
        const courtyardMat = new THREE.MeshStandardMaterial({ color: 0x333333, roughness: 0.8 });
        const courtyard = new THREE.Mesh(courtyardGeo, courtyardMat);
        courtyard.rotation.x = -Math.PI / 2;
        scene.add(courtyard);

        // Tạo khối nhà hình chữ L (gồm 2 tòa nhà kết nối tại nút giao)
        const buildingMat = new THREE.MeshStandardMaterial({ color: 0xcccccc, roughness: 0.4 });

        // Tòa nhà chính (chiều rộng 145)
        const buildingMainGeo = new THREE.BoxGeometry(145, 80, 40);
        const buildingMain = new THREE.Mesh(buildingMainGeo, buildingMat);
        buildingMain.position.set(0, 40, -20);
        scene.add(buildingMain);

        // Tòa nhà phụ (chiều sâu 73)
        const buildingSubGeo = new THREE.BoxGeometry(40, 80, 73);
        const buildingSub = new THREE.Mesh(buildingSubGeo, buildingMat);
        buildingSub.position.set(-52.5, 40, 26.5);
        scene.add(buildingSub);

        // Xử lý responsive khi đổi kích thước màn hình
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Hàm chuyển động render
        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
