<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>Cam Thung Middle School - 3D Campus</title>

<style>
*{
  box-sizing:border-box;
  -webkit-user-select:none;
  user-select:none;
  -webkit-touch-callout:none;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#8fd4f5;
  touch-action:none;
  font-family:Arial,sans-serif;
}

#game-container{
  position:fixed;
  top:0;
  left:0;
  width:100vw;
  height:100vh;
  z-index:1;
}

canvas{
  display:block;
  width:100vw !important;
  height:100vh !important;
}

.glass-ui{
  background:rgba(255,255,255,.18);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  border:1px solid rgba(255,255,255,.4);
  box-shadow:0 8px 32px rgba(0,0,0,.18);
}

#joystick-wrapper{
  position:absolute;
  left:32px;
  bottom:32px;
  width:120px;
  height:120px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:20;
  touch-action:none;
}

#joystick-stick{
  position:absolute;
  width:52px;
  height:52px;
  border-radius:50%;
  background:rgba(255,255,255,.58);
  border:1px solid rgba(255,255,255,.85);
  box-shadow:0 4px 14px rgba(0,0,0,.18);
  pointer-events:none;
}

#jump-btn{
  position:absolute;
  right:32px;
  bottom:38px;
  width:72px;
  height:72px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:20;
  touch-action:none;
  transition:background .3s ease,transform .1s ease;
}

#jump-btn.flying{
  background:rgba(255,215,0,.55);
  border-color:rgba(255,255,255,.9);
  box-shadow:0 0 15px rgba(255,215,0,.6);
}

#jump-btn:active{
  transform:scale(.94);
}

#jump-btn svg{
  width:34px;
  height:34px;
  fill:none;
  stroke:white;
  stroke-width:2.5;
  stroke-linecap:round;
  stroke-linejoin:round;
}

#loading{
  position:absolute;
  top:14px;
  right:16px;
  padding:8px 14px;
  border-radius:10px;
  background:rgba(0,0,0,.42);
  color:white;
  font-size:12px;
  z-index:30;
  pointer-events:none;
}

/* ============================================================
   MÀN HÌNH KÍNH YOUTUBE
   ============================================================ */

#screen-hint{
  position:absolute;
  left:50%;
  top:18px;
  transform:translateX(-50%);
  padding:9px 15px;
  border-radius:12px;
  background:rgba(0,0,0,.55);
  color:white;
  font-size:13px;
  z-index:25;
  pointer-events:none;
  opacity:0;
  transition:opacity .25s ease;
}

#screen-hint.show{
  opacity:1;
}

#browser-overlay{
  position:fixed;
  inset:0;
  z-index:100;
  display:none;
  background:rgba(15,15,15,.95);
  padding:
    max(10px,env(safe-area-inset-top))
    max(8px,env(safe-area-inset-right))
    max(10px,env(safe-area-inset-bottom))
    max(8px,env(safe-area-inset-left));
}

#browser-overlay.open{
  display:flex;
  flex-direction:column;
}

#browser-bar{
  width:100%;
  min-height:52px;
  display:flex;
  align-items:center;
  gap:8px;
  padding:6px;
  border-radius:14px;
  background:rgba(35,35,35,.96);
}

.browser-btn{
  width:40px;
  height:40px;
  flex:0 0 40px;
  border:0;
  border-radius:10px;
  background:#cc0000;
  color:white;
  font-size:16px;
  touch-action:manipulation;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
}

#browser-close{
  background:#444;
}

#browser-url{
  flex:1;
  min-width:0;
  height:40px;
  border:1px solid #444;
  outline:none;
  border-radius:10px;
  padding:0 14px;
  background:#222;
  color:#fff;
  font-size:15px;
  -webkit-user-select:text;
  user-select:text;
}

#browser-frame-wrap{
  position:relative;
  flex:1;
  min-height:0;
  margin-top:8px;
  overflow:hidden;
  border-radius:14px;
  background:#0f0f0f;
  display:flex;
  flex-direction:column;
}

#video-player-container{
  width:100%;
  height:240px;
  background:#000;
  display:none;
}

#video-player-container iframe{
  width:100%;
  height:100%;
  border:0;
}

#search-results{
  flex:1;
  overflow-y:auto;
  padding:12px;
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(220px, 1fr));
  gap:12px;
}

.video-card{
  background:#1f1f1f;
  border-radius:8px;
  overflow:hidden;
  cursor:pointer;
  transition:transform .2s;
}

.video-card:active{
  transform:scale(0.98);
}

.video-card img{
  width:100%;
  aspect-ratio:16/9;
  object-fit:cover;
}

.video-info{
  padding:8px 10px;
}

.video-title{
  color:#fff;
  font-size:13px;
  font-weight:bold;
  line-clamp:2;
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  overflow:hidden;
  line-height:1.3;
}

.video-channel{
  color:#aaa;
  font-size:11px;
  margin-top:4px;
}
</style>

<script type="importmap">
{
  "imports":{
    "three":"https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>

<body>

<div id="game-container"></div>

<div id="loading">
Đang dựng khuôn viên trường 3D...
</div>

<div id="screen-hint">
Chạm chính xác vào màn hình kính để mở YouTube
</div>

<div id="joystick-wrapper" class="glass-ui">
  <div id="joystick-stick"></div>
</div>

<div id="jump-btn" class="glass-ui">
  <svg viewBox="0 0 24 24">
    <path d="M12 19V5"></path>
    <path d="M5 12l7-7 7 7"></path>
  </svg>
</div>

<!-- BROWSER OVERLAY -->
<div id="browser-overlay">
  <div id="browser-bar">
    <input
      id="browser-url"
      type="text"
      autocomplete="off"
      placeholder="Tìm kiếm video YouTube..."
      value="Truong THCS Cam Thung"
    >
    <button class="browser-btn" id="browser-go">🔍</button>
    <button class="browser-btn" id="browser-close">×</button>
  </div>

  <div id="browser-frame-wrap">
    <div id="video-player-container">
      <iframe id="youtube-player" src="" allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe>
    </div>
    <div id="search-results"></div>
  </div>
</div>

<script type="module">

import * as THREE from "three";
import {GLTFLoader} from "three/addons/loaders/GLTFLoader.js";

// YOUTUBE API KEY
const YOUTUBE_API_KEY = "AIzaSyCNhZt6ZKBuvcIbj_z7Nybmwai0YNzq8SU";

// ============================================================
// SCENE & RENDERER
// ============================================================

const container=document.getElementById("game-container");
const loading=document.getElementById("loading");

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x8fd4f5);
scene.fog=new THREE.FogExp2(0xbfeafa, 0.0012);

const cameraPivot=new THREE.Object3D();
scene.add(cameraPivot);

const camera=new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 3000);
cameraPivot.add(camera);

let cameraDistance=10;
let targetCameraDistance=10;
let cameraAngleX=0.1;
let cameraAngleY=0;
let targetCameraAngleX=0.1;
let targetCameraAngleY=0;

const renderer=new THREE.WebGLRenderer({
  antialias:true,
  powerPreference:"high-performance"
});

renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.12;

container.appendChild(renderer.domElement);

// ============================================================
// CAMERA COLLISION
// ============================================================

const raycaster=new THREE.Raycaster();
const cameraCollisionObjects=[];

function updateCamera(){
  cameraAngleY=THREE.MathUtils.lerp(cameraAngleY, targetCameraAngleY, 0.18);
  cameraAngleX=THREE.MathUtils.lerp(cameraAngleX, targetCameraAngleX, 0.18);
  cameraDistance=THREE.MathUtils.lerp(cameraDistance, targetCameraDistance, 0.12);

  cameraPivot.rotation.y=cameraAngleY;
  cameraPivot.rotation.x=cameraAngleX;

  const origin=cameraPivot.position.clone();
  const dir=new THREE.Vector3(0,0,1).applyQuaternion(cameraPivot.quaternion);

  raycaster.set(origin,dir);
  let actualDistance=cameraDistance;

  if(cameraCollisionObjects.length>0){
    const hits=raycaster.intersectObjects(cameraCollisionObjects, true);
    if(hits.length>0 && hits[0].distance<cameraDistance){
      actualDistance=Math.max(hits[0].distance-0.3, 0.5);
    }
  }

  camera.position.set(0, 0, actualDistance);
  camera.lookAt(cameraPivot.position);
}

// ============================================================
// LIGHTING
// ============================================================

const hemisphere=new THREE.HemisphereLight(0xe8f8ff, 0x516b3b, 1.5);
scene.add(hemisphere);

const sunlight=new THREE.DirectionalLight(0xfff3d2, 2.2);
sunlight.position.set(100,130,80);
sunlight.castShadow=true;
sunlight.shadow.mapSize.width=2048;
sunlight.shadow.mapSize.height=2048;
sunlight.shadow.camera.near=1;
sunlight.shadow.camera.far=400;
sunlight.shadow.camera.left=-250;
sunlight.shadow.camera.right=250;
sunlight.shadow.camera.top=250;
sunlight.shadow.camera.bottom=-250;
sunlight.shadow.bias=-0.0003;

scene.add(sunlight);

// ============================================================
// MATERIALS
// ============================================================

const MAT={};
MAT.redTile=new THREE.MeshStandardMaterial({color:0xa94c3d, roughness:.78});
MAT.lightBlue=new THREE.MeshStandardMaterial({color:0x9ed9ec, roughness:.7});
MAT.white=new THREE.MeshStandardMaterial({color:0xf4f5f0, roughness:.72});
MAT.yellow=new THREE.MeshStandardMaterial({color:0xe7d16a, roughness:.8});
MAT.darkMetal=new THREE.MeshStandardMaterial({color:0x30383b, roughness:.55, metalness:.65});
MAT.steel=new THREE.MeshStandardMaterial({color:0xadb7ba, roughness:.35, metalness:.8});
MAT.roofMetal=new THREE.MeshStandardMaterial({color:0x68777b, roughness:.65, metalness:.45});
MAT.glass=new THREE.MeshPhysicalMaterial({color:0x76b9d2, roughness:.08, metalness:.05, transparent:true, opacity:.68});
MAT.concrete=new THREE.MeshStandardMaterial({color:0xb8b9b3, roughness:.9});

// ============================================================
// HELPER
// ============================================================

function box(w, h, d, x, y, z, material, parent=scene){
  const mesh=new THREE.Mesh(new THREE.BoxGeometry(w,h,d), material);
  mesh.position.set(x,y,z);
  mesh.castShadow=true;
  mesh.receiveShadow=true;
  parent.add(mesh);
  return mesh;
}

// ============================================================
// CAMPUS & GROUND
// ============================================================

const campus=new THREE.Group();
scene.add(campus);

const CAMPUS_W=260;
const CAMPUS_D=210;

const baseGround=box(2500, 1, 2500, 0, -0.7, 0, new THREE.MeshStandardMaterial({color:0x73b951, roughness:1}), campus);
cameraCollisionObjects.push(baseGround);

const courtyard=box(240, .45, 190, 0, 0, 0, MAT.redTile, campus);
cameraCollisionObjects.push(courtyard);

const tileLineMaterial=new THREE.MeshStandardMaterial({color:0x5e2b26, roughness:.9});

for(let x=-120;x<=120;x+=6){
  box(.12, .03, 190, x, .235, 0, tileLineMaterial, campus);
}
for(let z=-95;z<=95;z+=6){
  box(240, .03, .12, 0, .235, z, tileLineMaterial, campus);
}

// ============================================================
// FENCE
// ============================================================

function createFenceX(z){
  box(CAMPUS_W, 2, 1, 0, 1, z, MAT.yellow, campus);
  for(let x=-130;x<=130;x+=4){
    box(.16, 2.5, .16, x, 2.25, z, MAT.darkMetal, campus);
  }
  box(CAMPUS_W, .16, .16, 0, 3.4, z, MAT.darkMetal, campus);
  box(CAMPUS_W, .16, .16, 0, 2.35, z, MAT.darkMetal, campus);
}

function createFenceZ(x){
  box(1, 2, CAMPUS_D, x, 1, 0, MAT.yellow, campus);
  for(let z=-105;z<=105;z+=4){
    box(.16, 2.5, .16, x, 2.25, z, MAT.darkMetal, campus);
  }
  box(.16, .16, CAMPUS_D, x, 3.4, 0, MAT.darkMetal, campus);
}

createFenceX(-105);
createFenceX(105);
createFenceZ(-130);
createFenceZ(130);

// ============================================================
// BUILDING A & B
// ============================================================

const buildingA=new THREE.Group();
campus.add(buildingA);
const bA=box(145, 16, 17, -45, 8, -55, MAT.lightBlue, buildingA);
cameraCollisionObjects.push(bA);

const buildingB=new THREE.Group();
campus.add(buildingB);
const bB=box(70, 16, 30, 75, 8, -10, MAT.lightBlue, buildingB);
cameraCollisionObjects.push(bB);

// ============================================================
// MÀN HÌNH 3D YOUTUBE
// ============================================================

const screenGroup=new THREE.Group();
screenGroup.name="InteractiveGlassScreen";
campus.add(screenGroup);

const SCREEN_X=-10;
const SCREEN_Z=10;
const SCREEN_W=16.0;
const SCREEN_H=9.0;
const SCREEN_D=0.3;

const screenCanvas=document.createElement('canvas');
screenCanvas.width=2048;
screenCanvas.height=1152;
const ctx=screenCanvas.getContext('2d');

function drawYouTubeUI(){
  ctx.fillStyle='#0f0f0f';
  ctx.fillRect(0,0,2048,1152);

  ctx.beginPath();
  ctx.roundRect(924,350,200,140,30);
  ctx.fillStyle='#ff0000';
  ctx.fill();

  ctx.beginPath();
  ctx.moveTo(1004,390);
  ctx.lineTo(1064,420);
  ctx.lineTo(1004,450);
  ctx.fillStyle='#ffffff';
  ctx.fill();

  ctx.fillStyle='#ffffff';
  ctx.font='bold 72px Arial';
  ctx.textAlign='center';
  ctx.fillText('YouTube Player',1024,580);

  ctx.font='32px Arial';
  ctx.fillStyle='#aaaaaa';
  ctx.fillText('Chạm trực tiếp để tìm kiếm và phát Video',1024,650);
}

drawYouTubeUI();

const screenTexture=new THREE.CanvasTexture(screenCanvas);
screenTexture.colorSpace=THREE.SRGBColorSpace;

const screenFrameMaterial=new THREE.MeshStandardMaterial({color:0x111315, roughness:.2, metalness:.85});
const screenDisplayMaterial=new THREE.MeshBasicMaterial({map:screenTexture});

box(SCREEN_W+.6, SCREEN_H+.6, SCREEN_D, SCREEN_X, (SCREEN_H+.6)/2+1.2, SCREEN_Z, screenFrameMaterial, screenGroup);

const interactiveScreen=box(SCREEN_W, SCREEN_H, SCREEN_D+.02, SCREEN_X, SCREEN_H/2+1.5, SCREEN_Z-.02, screenDisplayMaterial, screenGroup);

box(.6, 3.0, .6, SCREEN_X-5.5, 0, SCREEN_Z, screenFrameMaterial, screenGroup);
box(.6, 3.0, .6, SCREEN_X+5.5, 0, SCREEN_Z, screenFrameMaterial, screenGroup);

// ============================================================
// INTERACTION & YOUTUBE API INTEGRATION
// ============================================================

const screenRaycaster=new THREE.Raycaster();
const screenPointer=new THREE.Vector2();

function openBrowser(){
  const overlay = document.getElementById("browser-overlay");
  if(!overlay.classList.contains("open")){
    overlay.classList.add("open");
    searchYouTube(document.getElementById("browser-url").value);
  }
}

function checkScreenTouch(clientX,clientY){
  const rect=renderer.domElement.getBoundingClientRect();
  screenPointer.x=((clientX-rect.left)/rect.width)*2-1;
  screenPointer.y=-((clientY-rect.top)/rect.height)*2+1;

  screenRaycaster.setFromCamera(screenPointer, camera);
  const hits=screenRaycaster.intersectObject(interactiveScreen, true);

  if(hits.length>0){
    openBrowser();
    return true;
  }
  return false;
}

renderer.domElement.addEventListener("pointerdown", (e) => {
  if(e.pointerType==="mouse") checkScreenTouch(e.clientX, e.clientY);
}, {passive:true});

renderer.domElement.addEventListener("touchstart", (e) => {
  if(e.touches.length === 1) checkScreenTouch(e.touches[0].clientX, e.touches[0].clientY);
}, {passive:true});

// ============================================================
// YOUTUBE SEARCH & PLAY FUNCTIONS
// ============================================================

async function searchYouTube(query) {
  if(!query.trim()) return;
  const url = `https://www.googleapis.com/youtube/v3/search?part=snippet&maxResults=12&q=${encodeURIComponent(query)}&type=video&key=${YOUTUBE_API_KEY}`;
  
  try {
    const response = await fetch(url);
    const data = await response.json();
    displayResults(data.items || []);
  } catch (error) {
    console.error("Lỗi gọi YouTube API:", error);
  }
}

function displayResults(items) {
  const container = document.getElementById("search-results");
  container.innerHTML = "";

  items.forEach(item => {
    const videoId = item.id.videoId;
    const snippet = item.snippet;

    const card = document.createElement("div");
    card.className = "video-card";
    card.innerHTML = `
      <img src="${snippet.thumbnails.medium.url}" alt="${snippet.title}">
      <div class="video-info">
        <div class="video-title">${snippet.title}</div>
        <div class="video-channel">${snippet.channelTitle}</div>
      </div>
    `;

    card.addEventListener("click", () => playVideo(videoId));
    container.appendChild(card);
  });
}

function playVideo(videoId) {
  const playerWrap = document.getElementById("video-player-container");
  const iframe = document.getElementById("youtube-player");
  playerWrap.style.display = "block";
  iframe.src = `https://www.youtube.com/embed/${videoId}?autoplay=1`;
}

document.getElementById("browser-go").addEventListener("click", () => {
  searchYouTube(document.getElementById("browser-url").value);
});

document.getElementById("browser-url").addEventListener("keydown", (e) => {
  if(e.key === "Enter") searchYouTube(e.target.value);
});

document.getElementById("browser-close").addEventListener("click", () => {
  document.getElementById("browser-overlay").classList.remove("open");
  document.getElementById("youtube-player").src = "";
  document.getElementById("video-player-container").style.display = "none";
});

// ============================================================
// PLAYER & MODEL LOADER
// ============================================================

const player=new THREE.Group();
scene.add(player);

let model=null;
const loader=new GLTFLoader();

loader.load("scene.gltf", (gltf) => {
  model=gltf.scene;
  model.position.y=.22;
  player.add(model);
  loading.style.display="none";
}, undefined, () => {
  loading.textContent="Không tìm thấy scene.gltf";
});

// ============================================================
// CONTROLS & GAME LOOP
// ============================================================

const input=new THREE.Vector2(0,0);
const velocity=new THREE.Vector3(0,0,0);
const joystick=document.getElementById("joystick-wrapper");
const stick=document.getElementById("joystick-stick");
let joystickTouch=null;

joystick.addEventListener("touchstart", (e) => {
  e.preventDefault();
  const touch=e.changedTouches[0];
  joystickTouch=touch.identifier;
  updateJoystick(touch);
}, {passive:false});

function updateJoystick(touch){
  const rect=joystick.getBoundingClientRect();
  const dx=touch.clientX - (rect.left + rect.width/2);
  const dy=touch.clientY - (rect.top + rect.height/2);
  const angle=Math.atan2(dy,dx);
  const dist=Math.min(Math.hypot(dx,dy), 40);

  stick.style.transform=`translate(${Math.cos(angle)*dist}px,${Math.sin(angle)*dist}px)`;
  input.x=Math.cos(angle)*(dist/40);
  input.y=-Math.sin(angle)*(dist/40);
}

window.addEventListener("touchmove", (e) => {
  for(let t of e.changedTouches){
    if(t.identifier === joystickTouch) updateJoystick(t);
  }
}, {passive:false});

window.addEventListener("touchend", () => {
  joystickTouch=null;
  input.set(0,0);
  stick.style.transform="translate(0px,0px)";
});

const clock=new THREE.Clock();

function animate(){
  requestAnimationFrame(animate);
  const delta=Math.min(clock.getDelta(), .05);

  if(input.lengthSq() > .01){
    const forward=new THREE.Vector3(0,0,-1).applyAxisAngle(new THREE.Vector3(0,1,0), cameraAngleY);
    const right=new THREE.Vector3(1,0,0).applyAxisAngle(new THREE.Vector3(0,1,0), cameraAngleY);
    const movement=new THREE.Vector3().addScaledVector(right, input.x).addScaledVector(forward, input.y).normalize();

    player.position.x += movement.x * 30 * delta;
    player.position.z += movement.z * 30 * delta;

    if(model) model.rotation.y = Math.atan2(movement.x, movement.z);
  }

  cameraPivot.position.copy(player.position);
  cameraPivot.position.y += 1.6;
  updateCamera();

  renderer.render(scene, camera);
}

animate();

window.addEventListener("resize", () => {
  camera.aspect=window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

</script>
</body>
</html>
