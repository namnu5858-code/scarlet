<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D School Project</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
        }
        #chat-toggle-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 1000;
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        #chat-container {
            position: fixed;
            bottom: 70px;
            right: 20px;
            width: 300px;
            height: 400px;
            background: white;
            border: 1px solid #ccc;
            border-radius: 5px;
            display: none;
            flex-direction: column;
            z-index: 1000;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }
        #chat-messages {
            flex: 1;
            padding: 10px;
            overflow-y: auto;
        }
        #chat-input-area {
            display: flex;
            padding: 10px;
            border-top: 1px solid #ccc;
        }
        #chat-input {
            flex: 1;
            padding: 5px;
        }
        #send-btn {
            padding: 5px 10px;
            margin-left: 5px;
        }
        #youtube-player {
            width: 1px;
            height: 1px;
            position: absolute;
            opacity: 0;
            pointer-events: none;
            overflow: hidden;
        }
    </style>
</head>
<body>

    <div id="canvas-container"></div>

    <div id="youtube-player">
        <div id="player"></div>
    </div>

    <button id="chat-toggle-btn">Chat / Nhạc</button>

    <div id="chat-container">
        <div id="chat-messages"></div>
        <div id="chat-input-area">
            <input type="text" id="chat-input" placeholder="Nhập tin nhắn hoặc lệnh...">
            <button id="send-btn">Gửi</button>
        </div>
    </div>

    <script src="[https://www.youtube.com/iframe_api](https://www.youtube.com/iframe_api)"></script>
    <script>
        let player;
        function onYouTubeIframeAPIReady() {
            player = new YT.Player('player', {
                height: '0',
                width: '0',
                videoId: 'YOUR_YOUTUBE_VIDEO_ID',
                playerVars: {
                    'autoplay': 1,
                    'loop': 1,
                    'playlist': 'YOUR_YOUTUBE_VIDEO_ID'
                },
                events: {
                    'onReady': (event) => {
                        event.target.playVideo();
                    }
                }
            });
        }

        const chatToggleBtn = document.getElementById('chat-toggle-btn');
        const chatContainer = document.getElementById('chat-container');
        const chatInput = document.getElementById('chat-input');
        const sendBtn = document.getElementById('send-btn');
        const chatMessages = document.getElementById('chat-messages');

        chatToggleBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            if (chatContainer.style.display === 'none' || chatContainer.style.display === '') {
                chatContainer.style.display = 'flex';
            } else {
                chatContainer.style.display = 'none';
            }
        });

        function handleMessage() {
            const text = chatInput.value.trim();
            if (!text) return;

            const msgDiv = document.createElement('div');
            msgDiv.textContent = text;
            chatMessages.appendChild(msgDiv);
            chatInput.value = '';
            chatMessages.scrollTop = chatMessages.scrollHeight;

            if (text.toLowerCase() === 'play' && player && player.playVideo) {
                player.playVideo();
            }
        }

        sendBtn.addEventListener('click', handleMessage);
        chatInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                handleMessage();
            }
        });

        window.addEventListener('keydown', (e) => {
            if (e.key === 't' || e.key === 'T') {
                if (document.activeElement !== chatInput) {
                    if (chatContainer.style.display === 'none' || chatContainer.style.display === '') {
                        chatContainer.style.display = 'flex';
                    } else {
                        chatContainer.style.display = 'none';
                    }
                }
            }
        });
    </script>
</body>
</html>
