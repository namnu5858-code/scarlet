<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Messenger Style Notes</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #18191a; color: #e4e6eb; padding: 16px; }

    .notes-container {
      display: flex;
      gap: 16px;
      overflow-x: auto;
      padding: 20px 10px;
    }

    .note-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      width: 72px;
      flex-shrink: 0;
      cursor: pointer;
    }

    /* Bong bóng suy nghĩ (Note bubble) */
    .note-bubble {
      position: absolute;
      top: -24px;
      background: #3a3b3c;
      color: #fff;
      padding: 6px 10px;
      border-radius: 16px;
      font-size: 11px;
      max-width: 90px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
      z-index: 2;
    }

    /* Đuôi bong bóng suy nghĩ */
    .note-bubble::after {
      content: '';
      position: absolute;
      bottom: -4px;
      left: 50%;
      transform: translateX(-50%);
      border-width: 5px 5px 0;
      border-style: solid;
      border-color: #3a3b3c transparent;
    }

    /* Khung Avatar */
    .avatar-wrapper {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      overflow: hidden;
      position: relative;
      border: 2px solid #2e89ff;
    }

    .avatar-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .add-btn {
      position: absolute;
      bottom: 0;
      right: 0;
      background: #2e89ff;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: bold;
      border: 2px solid #18191a;
    }

    .user-name {
      font-size: 12px;
      margin-top: 6px;
      color: #b0b3b8;
      text-align: center;
    }

    /* Modal tạo Ghi chú */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      align-items: center;
      justify-content: center;
      z-index: 10;
    }

    .modal-content {
      background: #242526;
      padding: 20px;
      border-radius: 12px;
      width: 90%;
      max-width: 320px;
      text-align: center;
    }

    .modal-content input {
      width: 100%;
      padding: 10px;
      margin: 12px 0;
      border-radius: 8px;
      border: 1px solid #3a3b3c;
      background: #3a3b3c;
      color: #fff;
    }

    .modal-actions { display: flex; gap: 8px; }
    .btn { flex: 1; padding: 8px; border-radius: 6px; border: none; cursor: pointer; font-weight: bold; }
    .btn-submit { background: #2e89ff; color: #fff; }
    .btn-cancel { background: #3a3b3c; color: #ccc; }
  </style>
</head>
<body>

  <h3>Ghi chú</h3>
  
  <!-- Danh sách Ghi chú ngang -->
  <div class="notes-container" id="notesList">
    <!-- Nút Tạo ghi chú cá nhân -->
    <div class="note-item" onclick="openModal()">
      <div id="myBubble" class="note-bubble" style="display:none;">Thì thầm to nhỏ</div>
      <div class="avatar-wrapper">
        <img src="https://i.pravatar.cc/100?img=12" alt="Bạn">
        <div class="add-btn">+</div>
      </div>
      <span class="user-name">Ghi chú của bạn</span>
    </div>

    <!-- Ghi chú mẫu của Bạn bè -->
    <div class="note-item">
      <div class="note-bubble">Đang học bài... 📚</div>
      <div class="avatar-wrapper">
        <img src="https://i.pravatar.cc/100?img=5" alt="Avatar">
      </div>
      <span class="user-name">Hải Yến</span>
    </div>

    <div class="note-item">
      <div class="note-bubble">Đi cà phê không? ☕</div>
      <div class="avatar-wrapper">
        <img src="https://i.pravatar.cc/100?img=8" alt="Avatar">
      </div>
      <span class="user-name">Minh Hoàng</span>
    </div>
  </div>

  <!-- Dialog Nhập Ghi chú -->
  <div class="modal" id="noteModal">
    <div class="modal-content">
      <h4>Tạo ghi chú mới</h4>
      <input type="text" id="noteText" placeholder="Chia sẻ suy nghĩ (tối đa 60 ký tự)..." maxlength="60">
      <div class="modal-actions">
        <button class="btn btn-cancel" onclick="closeModal()">Hủy</button>
        <button class="btn btn-submit" onclick="saveMyNote()">Đăng</button>
      </div>
    </div>
  </div>

  <script>
    function openModal() {
      document.getElementById('noteModal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('noteModal').style.display = 'none';
    }

    function saveMyNote() {
      const text = document.getElementById('noteText').value.trim();
      const myBubble = document.getElementById('myBubble');

      if (text) {
        myBubble.innerText = text;
        myBubble.style.display = 'block';
      } else {
        myBubble.style.display = 'none';
      }

      closeModal();
    }
  </script>
</body>
</html>
