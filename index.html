<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>Cam Thượng Middle School - 3D Campus</title>

<style>
*{
  box-sizing:border-box;
  -webkit-user-select:none;
  user-select:none;
  -webkit-touch-callout:none;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#8fd4f5;
  touch-action:none;
  font-family:Arial,sans-serif;
}

#game-container{
  position:fixed;
  inset:0;
  width:100vw;
  height:100vh;
  z-index:1;
}

canvas{
  display:block;
  width:100vw!important;
  height:100vh!important;
}

.glass-ui{
  background:rgba(255,255,255,.18);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  border:1px solid rgba(255,255,255,.4);
  box-shadow:0 8px 32px rgba(0,0,0,.18);
}

#joystick-wrapper{
  position:absolute;
  left:32px;
  bottom:32px;
  width:120px;
  height:120px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:30;
  touch-action:none;
}

#joystick-stick{
  position:absolute;
  width:52px;
  height:52px;
  border-radius:50%;
  background:rgba(255,255,255,.58);
  border:1px solid rgba(255,255,255,.85);
  box-shadow:0 4px 14px rgba(0,0,0,.18);
  pointer-events:none;
}

#jump-btn{
  position:absolute;
  right:32px;
  bottom:38px;
  width:72px;
  height:72px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:30;
  touch-action:none;
}

#jump-btn.flying{
  background:rgba(255,215,0,.55);
  border-color:rgba(255,255,255,.9);
  box-shadow:0 0 15px rgba(255,215,0,.6);
}

#jump-btn:active{
  transform:scale(.94);
}

#jump-btn svg{
  width:34px;
  height:34px;
  fill:none;
  stroke:white;
  stroke-width:2.5;
  stroke-linecap:round;
  stroke-linejoin:round;
}

#loading{
  position:absolute;
  top:14px;
  right:16px;
  padding:8px 14px;
  border-radius:10px;
  background:rgba(0,0,0,.42);
  color:white;
  font-size:12px;
  z-index:40;
  pointer-events:none;
}

#screen-hint{
  position:absolute;
  left:50%;
  top:18px;
  transform:translateX(-50%);
  padding:9px 15px;
  border-radius:12px;
  background:rgba(0,0,0,.55);
  color:white;
  font-size:13px;
  z-index:40;
  pointer-events:none;
  opacity:0;
  transition:opacity .25s ease;
}

#screen-hint.show{
  opacity:1;
}

/* ============================================================
   WEB DISPLAY NẰM TRỰC TIẾP TRÊN MÀN HÌNH 3D
   ============================================================ */

#web-screen{
  position:fixed;
  z-index:15;
  display:none;
  overflow:hidden;
  background:#fff;
  border-radius:2px;
  box-shadow:0 0 0 4px #111315,0 8px 30px rgba(0,0,0,.35);
  transform-origin:center center;
  pointer-events:auto;
}

#web-screen.open{
  display:block;
}

#web-screen iframe{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  border:0;
  background:white;
}

#web-screen-bar{
  position:absolute;
  top:0;
  left:0;
  right:0;
  height:36px;
  display:flex;
  align-items:center;
  gap:5px;
  padding:4px;
  background:rgba(25,25,25,.96);
  z-index:5;
}

.web-btn{
  width:28px;
  height:28px;
  border:0;
  border-radius:7px;
  background:#444;
  color:#fff;
  font-size:16px;
  padding:0;
}

#web-url{
  flex:1;
  min-width:0;
  height:28px;
  border:0;
  border-radius:7px;
  outline:none;
  padding:0 8px;
  font-size:12px;
  color:#111;
  background:#fff;
  -webkit-user-select:text;
  user-select:text;
}

#web-frame{
  position:absolute;
  top:36px!important;
  left:0;
  right:0;
  bottom:0;
  width:100%!important;
  height:calc(100% - 36px)!important;
}

#web-note{
  position:absolute;
  left:8px;
  right:8px;
  bottom:8px;
  padding:6px 8px;
  border-radius:7px;
  background:rgba(0,0,0,.7);
  color:white;
  font-size:10px;
  z-index:10;
  pointer-events:none;
  opacity:.8;
}

</style>

<script type="importmap">
{
  "imports":{
    "three":"https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>

<body>

<div id="game-container"></div>

<div id="loading">
Đang dựng khuôn viên trường 3D...
</div>

<div id="screen-hint">
Chạm vào màn hình để sử dụng Web
</div>

<div id="joystick-wrapper" class="glass-ui">
  <div id="joystick-stick"></div>
</div>

<div id="jump-btn" class="glass-ui">
  <svg viewBox="0 0 24 24">
    <path d="M12 19V5"></path>
    <path d="M5 12l7-7 7 7"></path>
  </svg>
</div>

<!-- ==========================================================
     WEB BROWSER TRỰC TIẾP TRÊN MÀN HÌNH
     ========================================================== -->

<div id="web-screen">

  <div id="web-screen-bar">

    <button class="web-btn" id="web-back">‹</button>
    <button class="web-btn" id="web-forward">›</button>

    <input
      id="web-url"
      type="url"
      inputmode="url"
      autocomplete="off"
      autocapitalize="none"
      spellcheck="false"
      value="https://www.youtube.com"
    >

    <button class="web-btn" id="web-go">↵</button>
    <button class="web-btn" id="web-close">×</button>

  </div>

  <iframe
    id="web-frame"
    src="https://www.youtube.com"
    allow="autoplay; fullscreen; picture-in-picture; encrypted-media; microphone; camera"
    allowfullscreen>
  </iframe>

  <div id="web-note">
    Website không cho phép iframe có thể không hiển thị được trong trình duyệt.
  </div>

</div>

<script type="module">

import * as THREE from "three";
import {GLTFLoader} from "three/addons/loaders/GLTFLoader.js";

/* ============================================================
   SCENE
   ============================================================ */

const container=document.getElementById("game-container");
const loading=document.getElementById("loading");

const scene=new THREE.Scene();

scene.background=new THREE.Color(0x8fd4f5);

scene.fog=new THREE.FogExp2(
  0xbfeafa,
  0.0012
);

/* ============================================================
   CAMERA
   ============================================================ */

const cameraPivot=new THREE.Object3D();
scene.add(cameraPivot);

const camera=new THREE.PerspectiveCamera(
  60,
  window.innerWidth/window.innerHeight,
  .1,
  3000
);

cameraPivot.add(camera);

let cameraDistance=10;
let targetCameraDistance=10;

let cameraAngleX=.1;
let cameraAngleY=0;

let targetCameraAngleX=.1;
let targetCameraAngleY=0;

const renderer=new THREE.WebGLRenderer({
  antialias:true,
  powerPreference:"high-performance"
});

renderer.setSize(
  window.innerWidth,
  window.innerHeight
);

renderer.setPixelRatio(
  Math.min(window.devicePixelRatio,2)
);

renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.12;

container.appendChild(renderer.domElement);

const raycaster=new THREE.Raycaster();
const cameraCollisionObjects=[];

function updateCamera(){

  cameraAngleY=THREE.MathUtils.lerp(
    cameraAngleY,
    targetCameraAngleY,
    .18
  );

  cameraAngleX=THREE.MathUtils.lerp(
    cameraAngleX,
    targetCameraAngleX,
    .18
  );

  cameraDistance=THREE.MathUtils.lerp(
    cameraDistance,
    targetCameraDistance,
    .12
  );

  cameraPivot.rotation.y=cameraAngleY;
  cameraPivot.rotation.x=cameraAngleX;

  const origin=cameraPivot.position.clone();

  const dir=new THREE.Vector3(0,0,1)
    .applyQuaternion(cameraPivot.quaternion);

  raycaster.set(origin,dir);

  let actualDistance=cameraDistance;

  const hits=raycaster.intersectObjects(
    cameraCollisionObjects,
    true
  );

  if(
    hits.length &&
    hits[0].distance<cameraDistance
  ){

    actualDistance=Math.max(
      hits[0].distance-.3,
      .5
    );
  }

  camera.position.set(
    0,
    0,
    actualDistance
  );

  camera.lookAt(cameraPivot.position);
}

/* ============================================================
   LIGHT
   ============================================================ */

scene.add(
  new THREE.HemisphereLight(
    0xe8f8ff,
    0x516b3b,
    1.5
  )
);

const sunlight=new THREE.DirectionalLight(
  0xfff3d2,
  2.2
);

sunlight.position.set(100,130,80);
sunlight.castShadow=true;

sunlight.shadow.mapSize.width=2048;
sunlight.shadow.mapSize.height=2048;

sunlight.shadow.camera.near=1;
sunlight.shadow.camera.far=400;
sunlight.shadow.camera.left=-250;
sunlight.shadow.camera.right=250;
sunlight.shadow.camera.top=250;
sunlight.shadow.camera.bottom=-250;

sunlight.shadow.bias=-.0003;

scene.add(sunlight);

/* ============================================================
   MATERIALS
   ============================================================ */

const MAT={};

MAT.redTile=new THREE.MeshStandardMaterial({
  color:0xa94c3d,
  roughness:.78
});

MAT.lightBlue=new THREE.MeshStandardMaterial({
  color:0x9ed9ec,
  roughness:.7
});

MAT.white=new THREE.MeshStandardMaterial({
  color:0xf4f5f0,
  roughness:.72
});

MAT.yellow=new THREE.MeshStandardMaterial({
  color:0xe7d16a,
  roughness:.8
});

MAT.darkMetal=new THREE.MeshStandardMaterial({
  color:0x30383b,
  roughness:.55,
  metalness:.65
});

MAT.steel=new THREE.MeshStandardMaterial({
  color:0xadb7ba,
  roughness:.35,
  metalness:.8
});

MAT.roofMetal=new THREE.MeshStandardMaterial({
  color:0x68777b,
  roughness:.65,
  metalness:.45
});

MAT.glass=new THREE.MeshPhysicalMaterial({
  color:0x76b9d2,
  roughness:.08,
  metalness:.05,
  transparent:true,
  opacity:.68
});

MAT.concrete=new THREE.MeshStandardMaterial({
  color:0xb8b9b3,
  roughness:.9
});

MAT.greenStair=new THREE.MeshStandardMaterial({
  color:0x3d9b45,
  roughness:.72
});

MAT.greenDark=new THREE.MeshStandardMaterial({
  color:0x267133,
  roughness:.8
});

MAT.stairConcrete=new THREE.MeshStandardMaterial({
  color:0xd5d7d1,
  roughness:.9
});

/* ============================================================
   BOX HELPER
   ============================================================ */

function box(
  w,h,d,
  x,y,z,
  material,
  parent=scene
){

  const mesh=new THREE.Mesh(
    new THREE.BoxGeometry(w,h,d),
    material
  );

  mesh.position.set(x,y,z);

  mesh.castShadow=true;
  mesh.receiveShadow=true;

  parent.add(mesh);

  return mesh;
}

/* ============================================================
   CAMPUS
   ============================================================ */

const campus=new THREE.Group();
scene.add(campus);

const CAMPUS_W=260;
const CAMPUS_D=210;

const baseGround=box(
  2500,1,2500,
  0,-.7,0,
  new THREE.MeshStandardMaterial({
    color:0x73b951,
    roughness:1
  }),
  campus
);

cameraCollisionObjects.push(baseGround);

const courtyard=box(
  240,.45,190,
  0,0,0,
  MAT.redTile,
  campus
);

cameraCollisionObjects.push(courtyard);

/* ============================================================
   TILES
   ============================================================ */

const tileLineMaterial=
  new THREE.MeshStandardMaterial({
    color:0x5e2b26,
    roughness:.9
  });

for(let x=-120;x<=120;x+=6){

  box(
    .12,.03,190,
    x,.235,0,
    tileLineMaterial,
    campus
  );
}

for(let z=-95;z<=95;z+=6){

  box(
    240,.03,.12,
    0,.235,z,
    tileLineMaterial,
    campus
  );
}

/* ============================================================
   FENCE
   ============================================================ */

function createFenceX(z){

  box(
    CAMPUS_W,2,1,
    0,1,z,
    MAT.yellow,
    campus
  );

  for(let x=-130;x<=130;x+=4){

    box(
      .16,2.5,.16,
      x,2.25,z,
      MAT.darkMetal,
      campus
    );
  }

  box(
    CAMPUS_W,.16,.16,
    0,3.4,z,
    MAT.darkMetal,
    campus
  );

  box(
    CAMPUS_W,.16,.16,
    0,2.35,z,
    MAT.darkMetal,
    campus
  );
}

function createFenceZ(x){

  box(
    1,2,CAMPUS_D,
    x,1,0,
    MAT.yellow,
    campus
  );

  for(let z=-105;z<=105;z+=4){

    box(
      .16,2.5,.16,
      x,2.25,z,
      MAT.darkMetal,
      campus
    );
  }

  box(
    .16,.16,CAMPUS_D,
    x,3.4,0,
    MAT.darkMetal,
    campus
  );
}

createFenceX(-105);
createFenceX(105);
createFenceZ(-130);
createFenceZ(130);

/* ============================================================
   BUILDING A
   ============================================================ */

const buildingA=new THREE.Group();
campus.add(buildingA);

const A_HEIGHT=16;

const bA=box(
  145,
  A_HEIGHT,
  17,
  -45,
  A_HEIGHT/2,
  -55,
  MAT.lightBlue,
  buildingA
);

cameraCollisionObjects.push(bA);

box(
  145,1.2,17.5,
  -45,.6,-55,
  MAT.white,
  buildingA
);

for(let y=4;y<16;y+=4){

  box(
    145,.22,17.5,
    -45,y,-55,
    MAT.white,
    buildingA
  );
}

for(let floor=0;floor<4;floor++){

  const y=2+floor*4;

  for(let x=-112;x<=22;x+=13){

    box(
      8.2,2.25,.2,
      x,y,-63.65,
      MAT.glass,
      buildingA
    );

    box(
      8.7,.15,.15,
      x,y-1.15,-63.82,
      MAT.darkMetal,
      buildingA
    );

    box(
      8.7,.15,.15,
      x,y+1.15,-63.82,
      MAT.darkMetal,
      buildingA
    );

    box(
      .15,2.4,.15,
      x-4.25,y,-63.82,
      MAT.darkMetal,
      buildingA
    );

    box(
      .15,2.4,.15,
      x+4.25,y,-63.82,
      MAT.darkMetal,
      buildingA
    );
  }
}

for(let floor=1;floor<=3;floor++){

  const y=floor*4;

  box(
    145,.28,5,
    -45,y,-45,
    MAT.concrete,
    buildingA
  );

  for(let x=-112;x<=22;x+=5){

    box(
      .12,2,.12,
      x,y+1,-42.6,
      MAT.steel,
      buildingA
    );
  }

  box(
    145,.12,.12,
    -45,y+2,-42.6,
    MAT.steel,
    buildingA
  );

  box(
    145,.12,.12,
    -45,y+.8,-42.6,
    MAT.steel,
    buildingA
  );
}

/* ============================================================
   BUILDING B
   ============================================================ */

const buildingB=new THREE.Group();
campus.add(buildingB);

const BX=75;
const BZ=-10;

const bB=box(
  70,16,30,
  BX,8,BZ,
  MAT.lightBlue,
  buildingB
);

cameraCollisionObjects.push(bB);

box(
  70,1.2,31,
  BX,.6,BZ,
  MAT.white,
  buildingB
);

for(let y=4;y<16;y+=4){

  box(
    70,.22,31,
    BX,y,BZ,
    MAT.white,
    buildingB
  );
}

for(let floor=0;floor<4;floor++){

  const y=2+floor*4;

  for(let x=47;x<=103;x+=14){

    box(
      8,2.3,.18,
      x,y,BZ-15.15,
      MAT.glass,
      buildingB
    );

    box(
      8.5,.15,.15,
      x,y-1.2,BZ-15.3,
      MAT.darkMetal,
      buildingB
    );

    box(
      8.5,.15,.15,
      x,y+1.2,BZ-15.3,
      MAT.darkMetal,
      buildingB
    );

    box(
      .15,2.4,.15,
      x-4.15,y,BZ-15.3,
      MAT.darkMetal,
      buildingB
    );

    box(
      .15,2.4,.15,
      x+4.15,y,BZ-15.3,
      MAT.darkMetal,
      buildingB
    );
  }
}

for(let floor=1;floor<=3;floor++){

  const y=floor*4;

  box(
    70,.3,5.5,
    BX,y,BZ-17.8,
    MAT.concrete,
    buildingB
  );

  for(let x=41;x<=109;x+=4){

    box(
      .12,2.2,.12,
      x,y+1.1,BZ-20.2,
      MAT.steel,
      buildingB
    );
  }

  box(
    70,.12,.12,
    BX,y+2.15,BZ-20.2,
    MAT.steel,
    buildingB
  );

  box(
    70,.12,.12,
    BX,y+.75,BZ-20.2,
    MAT.steel,
    buildingB
  );
}

/* ============================================================
   CẦU THANG XANH LỚN TRƯỚC BUILDING B
   ============================================================ */

const greenStair=new THREE.Group();
greenStair.name="LargeGreenStaircase";
campus.add(greenStair);

/*
   Cầu thang nằm ở phía trước Building B,
   nối từ sân lên hành lang tầng cao.
*/

const stairX=BX;
const stairFrontZ=BZ-31;

const stairWidth=18;
const stairDepth=15;
const stairHeight=4.0;

const stairCount=10;
const stepHeight=stairHeight/stairCount;
const stepDepth=stairDepth/stairCount;

for(let i=0;i<stairCount;i++){

  const h=stepHeight*(i+1);

  const step=box(
    stairWidth,
    h,
    stepDepth*(i+1),
    stairX,
    h/2,
    stairFrontZ+(stepDepth*(i+1))/2,
    MAT.greenStair,
    greenStair
  );

  step.receiveShadow=true;
  step.castShadow=true;
}

/* Mặt bậc sáng hơn */

for(let i=0;i<stairCount;i++){

  const h=stepHeight*(i+1);

  box(
    stairWidth+.08,
    .10,
    stepDepth+.08,
    stairX,
    h+.05,
    stairFrontZ+stepDepth*(i+.5),
    MAT.greenDark,
    greenStair
  );
}

/* Hai má cầu thang */

box(
  .45,
  stairHeight+.5,
  stairDepth,
  stairX-stairWidth/2-.35,
  stairHeight/2,
  stairFrontZ+stairDepth/2,
  MAT.greenDark,
  greenStair
);

box(
  .45,
  stairHeight+.5,
  stairDepth,
  stairX+stairWidth/2+.35,
  stairHeight/2,
  stairFrontZ+stairDepth/2,
  MAT.greenDark,
  greenStair
);

/* Chiếu nghỉ trên */

box(
  stairWidth+2,
  .45,
  5,
  stairX,
  stairHeight,
  BZ-15,
  MAT.greenStair,
  greenStair
);

/* ============================================================
   LAN CAN CẦU THANG
   ============================================================ */

function createStairRail(side){

  const railX=
    stairX+
    side*(stairWidth/2+1.0);

  const railStartZ=
    stairFrontZ;

  const railEndZ=
    stairFrontZ+stairDepth;

  const railHeight=1.15;

  const posts=6;

  for(let i=0;i<=posts;i++){

    const t=i/posts;

    const z=
      THREE.MathUtils.lerp(
        railStartZ,
        railEndZ,
        t
      );

    const y=
      stepHeight*
      Math.min(
        Math.floor(t*stairCount)+1,
        stairCount
      )+
      railHeight/2;

    box(
      .12,
      railHeight,
      .12,
      railX,
      y,
      z,
      MAT.greenDark,
      greenStair
    );
  }

  const rail=new THREE.Mesh(
    new THREE.CylinderGeometry(
      .09,.09,
      Math.sqrt(
        stairDepth*stairDepth+
        stairHeight*stairHeight
      ),
      12
    ),
    MAT.greenDark
  );

  rail.position.set(
    railX,
    stairHeight+railHeight,
    stairFrontZ+stairDepth/2
  );

  rail.rotation.x=
    Math.atan2(
      stairDepth,
      stairHeight
    );

  rail.rotation.z=Math.PI/2;

  greenStair.add(rail);
}

createStairRail(-1);
createStairRail(1);

/* ============================================================
   MÁI CHE CẦU THANG
   ============================================================ */

const stairRoof=new THREE.Group();
stairRoof.name="GreenStairRoof";
greenStair.add(stairRoof);

const roofY=stairHeight+3.8;

box(
  stairWidth+5,
  .35,
  stairDepth+5,
  stairX,
  roofY,
  stairFrontZ+stairDepth/2,
  MAT.greenDark,
  stairRoof
);

box(
  .35,
  roofY,
  .35,
  stairX-stairWidth/2-1.8,
  roofY/2,
  stairFrontZ+1,
  MAT.greenDark,
  stairRoof
);

box(
  .35,
  roofY,
  .35,
  stairX+stairWidth/2+1.8,
  roofY/2,
  stairFrontZ+1,
  MAT.greenDark,
  stairRoof
);

box(
  .35,
  roofY,
  .35,
  stairX-stairWidth/2-1.8,

const webCorners=[
  new THREE.Vector3(
    -SCREEN_W/2,
    SCREEN_H,
    0
  ),
  new THREE.Vector3(
    SCREEN_W/2,
    SCREEN_H,
    0
  ),
  new THREE.Vector3(
    SCREEN_W/2,
    0,
    0
  ),
  new THREE.Vector3(
    -SCREEN_W/2,
    0,
    0
  )
];

function projectScreenCorner(localPoint){

  const worldPoint=
    interactiveScreen.localToWorld(
      localPoint.clone()
    );

  worldPoint.project(camera);

  return {
    x:(worldPoint.x+1)*.5*window.innerWidth,
    y:(1-worldPoint.y)*.5*window.innerHeight
  };
}

function updateWebScreenPosition(){

  if(!webScreen.classList.contains("open"))
    return;

  const p0=
    projectScreenCorner(webCorners[0]);

  const p1=
    projectScreenCorner(webCorners[1]);

  const p2=
    projectScreenCorner(webCorners[2]);

  const p3=
    projectScreenCorner(webCorners[3]);

  const width=
    Math.max(
      Math.hypot(
        p1.x-p0.x,
        p1.y-p0.y
      ),
      Math.hypot(
        p2.x-p3.x,
        p2.y-p3.y
      )
    );

  const height=
    Math.max(
      Math.hypot(
        p3.x-p0.x,
        p3.y-p0.y
      ),
      Math.hypot(
        p2.x-p1.x,
        p2.y-p1.y
      )
    );

  const centerX=
    (p0.x+p1.x+p2.x+p3.x)/4;

  const centerY=
    (p0.y+p1.y+p2.y+p3.y)/4;

  const angle=
    Math.atan2(
      p1.y-p0.y,
      p1.x-p0.x
    );

  webScreen.style.left=
    `${centerX-width/2}px`;

  webScreen.style.top=
    `${centerY-height/2}px`;

  webScreen.style.width=
    `${width}px`;

  webScreen.style.height=
    `${height}px`;

  webScreen.style.transform=
    `rotate(${angle}rad)`;
}

const screenRaycaster=
  new THREE.Raycaster();

const screenPointer=
  new THREE.Vector2();

function checkScreenTouch(
  clientX,
  clientY
){

  const rect=
    renderer.domElement.getBoundingClientRect();

  screenPointer.x=
    ((clientX-rect.left)/rect.width)*2-1;

  screenPointer.y=
    -((clientY-rect.top)/rect.height)*2+1;

  screenRaycaster.setFromCamera(
    screenPointer,
    camera
  );

  const hits=
    screenRaycaster.intersectObject(
      interactiveScreen,
      true
    );

  if(hits.length){

    openWebScreen();

    return true;
  }

  return false;
}

renderer.domElement.addEventListener(
  "pointerdown",
  event=>{

    if(event.pointerType==="mouse"){

      checkScreenTouch(
        event.clientX,
        event.clientY
      );
    }
  }
);

/* ============================================================

   ============================================================ */

const joystick=
  document.getElementById(
    "joystick-wrapper"
  );

const stick=
  document.getElementById(
    "joystick-stick"
  );

let joystickTouch=null;

let centerX=0;
let centerY=0;

const radius=40;

joystick.addEventListener(
  "touchstart",
  event=>{

    event.preventDefault();

    const touch=
      event.changedTouches[0];

    joystickTouch=
      touch.identifier;

    const rect=
      joystick.getBoundingClientRect();

    centerX=
      rect.left+
      rect.width/2;

    centerY=
      rect.top+
      rect.height/2;

    updateJoystick(touch);
  },
  {passive:false}
);

function updateJoystick(touch){

  const dx=
    touch.clientX-centerX;

  const dy=
    touch.clientY-centerY;

  const distance=
    Math.hypot(dx,dy);

  const angle=
    Math.atan2(dy,dx);

  const limited=
    Math.min(distance,radius);

  const x=
    Math.cos(angle)*limited;

  const y=
    Math.sin(angle)*limited;

  stick.style.transform=
    `translate(${x}px,${y}px)`;

  input.x=x/radius;
  input.y=-y/radius;
}

function resetJoystick(){

  joystickTouch=null;

  input.set(0,0);

  velocity.x=0;
  velocity.z=0;

  stick.style.transform=
    "translate(0px,0px)";
}

window.addEventListener(
  "touchmove",
  event=>{

    for(
      let i=0;
      i<event.changedTouches.length;
      i++
    ){

      if(
        event.changedTouches[i].identifier===
        joystickTouch
      ){

        updateJoystick(
          event.changedTouches[i]
        );
      }
    }
  },
  {passive:false}
);

window.addEventListener(
  "touchend",
  event=>{

    for(
      let i=0;
      i<event.changedTouches.length;
      i++
    ){

      if(
        event.changedTouches[i].identifier===
        joystickTouch
      ){

        resetJoystick();
      }
    }
  }
);

window.addEventListener(

);

/* ============================================================

let cameraTouch=null;

let lastX=0;
let lastY=0;

let initialPinchDistance=null;
let initialCameraDistance=
  targetCameraDistance;

window.addEventListener(
  "wheel",
  event=>{

    event.preventDefault();

    targetCameraDistance+=
      event.deltaY*.015;

    targetCameraDistance=
      THREE.MathUtils.clamp(
        targetCameraDistance,
        1.5,
        60
      );
  },
  {passive:false}
);

window.addEventListener(
  "touchstart",
  event=>{

    if(
      event.touches.length===2
    ){

      initialPinchDistance=
        Math.hypot(
          event.touches[0].clientX-
          event.touches[1].clientX,

          event.touches[0].clientY-
          event.touches[1].clientY
        );

      initialCameraDistance=
        targetCameraDistance;

      return;
    }

    const touch=
      event.changedTouches[0];

    if(
      touch.identifier!==joystickTouch &&
      cameraTouch===null
    ){

      cameraTouch=
        touch.identifier;

      lastX=touch.clientX;
      lastY=touch.clientY;
    }
  }
);

window.addEventListener(
  "touchmove",
  event=>{

    if(
      event.touches.length===2 &&
      initialPinchDistance!==null
    ){

      const currentDistance=
        Math.hypot(
          event.touches[0].clientX-
          event.touches[1].clientX,

          event.touches[0].clientY-
          event.touches[1].clientY
        );

      if(currentDistance>0){

        const factor=
          initialPinchDistance/
          currentDistance;

        targetCameraDistance=
          THREE.MathUtils.clamp(
            initialCameraDistance*factor,
            1.5,
            60
          );
      }

      return;
    }

    for(
      let i=0;
      i<event.changedTouches.length;
      i++
    ){

      const touch=
        event.changedTouches[i];

      if(
        touch.identifier===
        cameraTouch
      ){

        const dx=
          touch.clientX-lastX;

        const dy=
          touch.clientY-lastY;

        targetCameraAngleY-=
          dx*.005;

        targetCameraAngleX=
          THREE.MathUtils.clamp(
            targetCameraAngleX+
            dy*.005,

            -Math.PI/2+.01,
            Math.PI/2-.05
          );

        lastX=touch.clientX;
        lastY=touch.clientY;
      }
    }
  },
  {passive:false}
);

window.addEventListener(
  "touchend",
  event=>{

    if(event.touches.length<2){
      initialPinchDistance=null;
    }

    for(
      let i=0;
      i<event.changedTouches.length;
      i++
    ){

      if(
        event.changedTouches[i].identifier===
        cameraTouch
      ){

        cameraTouch=null;
      }
    }
  }
);

window.addEventListener(
  "touchcancel",
  ()=>{

    cameraTouch=null;
    initialPinchDistance=null;
  }
);

/* ============================================================
   ANIMATION
   ============================================================ */

let animationTime=0;
let animationBlend=0;

function animateLeaves(
  delta,
  moving
){

  if(!model)
    return;

  leafMeshes.forEach(
    (mesh,index)=>{

      const original=
        initialData.get(mesh);

      if(!original)
        return;

      const speed=
        .72+(index%7)*.085;

      const phase=
        index*.67;

      const t=
        animationTime*speed+phase;

      const wave1=Math.sin(t);

      const wave2=
        Math.sin(
          t*1.73+index
        );

      const wave3=
        Math.cos(
          t*.57+index*.4
        );

      const movement=
        (
          wave1*.62+
          wave2*.23+
          wave3*.15
        )*
        animationBlend;

      const side=
        index%2===0?1:-1;

      mesh.rotation.z=
        original.rotation.z+
        movement*.30*side;

      mesh.rotation.x=
        original.rotation.x+
        wave3*.15*
        animationBlend;

      mesh.rotation.y=
        original.rotation.y+
        wave2*.10*
        animationBlend;
    }
  );
}

function animateSunflower(
  delta,
  moving
){

  if(!model)
    return;

  const target=
    moving?1:0;

  animationBlend=
    THREE.MathUtils.lerp(
      animationBlend,
      target,
      Math.min(delta*7,1)
    );

  if(moving){
    animationTime+=delta*9.5;
  }

  const wave=
    Math.sin(animationTime);

  const bounce=
    Math.abs(wave)*
    .10*
    animationBlend;

  model.position.y=
    THREE.MathUtils.lerp(
      model.position.y,
      .22+bounce,
      Math.min(delta*13,1)
    );

  model.rotation.z=
    THREE.MathUtils.lerp(
      model.rotation.z,
      wave*.035*animationBlend,
      Math.min(delta*8,1)
    );

  animateLeaves(
    delta,
    moving
  );

  armMeshes.forEach(
    (mesh,index)=>{

      const original=
        initialData.get(mesh);

      if(!original)
        return;

      const side=
        index%2===0?1:-1;

      mesh.rotation.z=
        original.rotation.z+
        wave*.32*
        side*
        animationBlend;
    }
  );

  rootMeshes.forEach(
    (mesh,index)=>{

      const original=
        initialData.get(mesh);

      if(!original)
        return;

      const side=
        index%2===0?1:-1;

      mesh.rotation.z=
        original.rotation.z+
        Math.sin(
          animationTime+Math.PI
        )*.20*
        side*
        animationBlend;
    }
  );
}

  if(moving){

    const forward=
      new THREE.Vector3(
        0,0,-1
      );

    const right=
      new THREE.Vector3(
        1,0,0
      );

    forward.applyAxisAngle(
      new THREE.Vector3(0,1,0),
      cameraAngleY
    );

    right.applyAxisAngle(
      new THREE.Vector3(0,1,0),
      cameraAngleY
    );

    const movement=
      new THREE.Vector3();

    movement.addScaledVector(
      right,
      input.x
    );

    movement.addScaledVector(
      forward,
      input.y
    );

    if(movement.lengthSq()>0){

      movement.normalize();

      velocity.x=
        movement.x*moveSpeed;

      velocity.z=
        movement.z*moveSpeed;

      if(model){

        const targetRotation=
          Math.atan2(
            movement.x,
            movement.z
          );

        let difference=
          targetRotation-
          model.rotation.y;

        difference=
          Math.atan2(
            Math.sin(difference),
            Math.cos(difference)
          );

        model.rotation.y+=
          difference*
          Math.min(delta*10,1);
      }
    }

  }else{

    velocity.x=0;
    velocity.z=0;
  }

  animateSunflower(
    delta,
    moving
  );

  /* ==========================================================
     FLY / JUMP
     ========================================================== */

  if(isFlying){

    if(isJumpHolding){

      velocity.y=
        THREE.MathUtils.lerp(
          velocity.y,
          8,
          delta*5
        );

    }else{

      velocity.y=
        THREE.MathUtils.lerp(
          velocity.y,
          0,
          delta*3
        );
    }

  }else{

    velocity.y+=
      gravity*delta;
  }

  player.position.y+=
    velocity.y*delta;

  if(player.position.y<=0){

    player.position.y=0;

    velocity.y=0;

    grounded=true;

    if(isFlying){

      isFlying=false;

      jump.classList.remove(
        "flying"
      );

      moveSpeed=walkSpeed;
    }
  }

  player.position.x+=
    velocity.x*delta;

  player.position.z+=
    velocity.z*delta;

  cameraPivot.position.copy(
    player.position
  );

  cameraPivot.position.y+=1.6;

  updateCamera();

  renderer.render(
    scene,
    camera
  );

  updateWebScreenPosition();
}

animate();

/* ============================================================
   RESIZE
   ============================================================ */

function onResize(){

  const width=
    window.innerWidth;

  const height=
    window.innerHeight;

  camera.aspect=
    width/height;

  camera.updateProjectionMatrix();

  renderer.setSize(
    width,
    height
  );

  renderer.setPixelRatio(
    Math.min(
      window.devicePixelRatio,
      2
    )
  );

  updateWebScreenPosition();
}

window.addEventListener(
  "resize",
  onResize
);

window.addEventListener(
  "orientationchange",
  ()=>{
    setTimeout(
      onResize,
      100
    );
  }
);

onResize();

/* ============================================================
   SERVICE WORKER
   ============================================================ */

if("serviceWorker" in navigator){

  window.addEventListener(
    "load",
    ()=>{

      navigator.serviceWorker
        .register(
          "./service-worker.js"
        )
        .then(
          reg=>{
            console.log(
              "Service Worker đã đăng ký thành công!",
              reg
            );
          }
        )
        .catch(
          err=>{
            console.error(
              "Lỗi đăng ký Service Worker:",
              err
            );
          }
        );
    }
  );
}

</script>
