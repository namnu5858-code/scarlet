<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#050507" />
  <title>Scarlet Studio</title>
  <style>
    :root {
      --bg-void: #050507;
      --bg-surface: #0e0e13;
      --bg-elevated: #16161e;
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-strong: rgba(255, 255, 255, 0.16);
      --text-primary: #f5f5f7;
      --text-secondary: #9a9aa6;
      --text-muted: #63636e;
      --accent: #ffffff;
      --accent-soft: rgba(255, 255, 255, 0.12);
      --danger: #ff453a;
      --success: #30d158;
      --stage-max: 440px;
      --radius-pill: 999px;
      --radius-card: 24px;
      --radius-cam: 32px;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: var(--bg-void);
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow-x: hidden;
      overscroll-behavior: none;
    }

    .app-shell {
      min-height: 100dvh;
      width: 100%;
      background-color: var(--bg-void);
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding-top: var(--safe-top);
      padding-bottom: calc(var(--safe-bottom) + 24px);
    }

    .stage {
      width: 100%;
      max-width: var(--stage-max);
      min-height: calc(100dvh - var(--safe-top) - var(--safe-bottom) - 24px);
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding: 14px 16px 20px;
      background-color: var(--bg-void);
      position: relative;
    }

    /* Top Bar */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      min-height: 44px;
    }

    .brand-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      height: 38px;
      padding: 0 14px;
      border-radius: var(--radius-pill);
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.02em;
      color: var(--text-primary);
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--success);
      box-shadow: 0 0 8px rgba(48, 209, 88, 0.55);
      flex-shrink: 0;
    }

    .status-dot.offline {
      background: var(--danger);
      box-shadow: none;
    }

    .seg-control {
      position: relative;
      display: inline-grid;
      grid-template-columns: repeat(2, 1fr);
      padding: 3px;
      border-radius: var(--radius-pill);
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      height: 38px;
      min-width: 176px;
    }

    .seg-btn {
      position: relative;
      z-index: 1;
      border: 0;
      background: transparent;
      color: var(--text-secondary);
      font-size: 12.5px;
      font-weight: 600;
      border-radius: var(--radius-pill);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      transition: color 0.2s var(--ease-out), transform 0.12s var(--ease-out);
      padding: 0 12px;
    }

    .seg-btn[aria-selected="true"] {
      color: var(--bg-void);
      background: var(--text-primary);
    }

    .seg-btn:active {
      transform: scale(0.96);
    }

    /* Views */
    .view {
      display: none;
      flex-direction: column;
      gap: 14px;
    }

    .view.active {
      display: flex;
      animation: fadeIn 0.22s var(--ease-out);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Camera Viewport */
    .camera-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: var(--radius-cam);
      overflow: hidden;
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      contain: layout style paint;
      will-change: transform;
    }

    .camera-media {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transform: translateZ(0);
      transition: filter 0.25s var(--ease-out), transform 0.25s var(--ease-out);
    }

    .camera-media.mirrored {
      transform: scaleX(-1) translateZ(0);
    }

    .camera-media.filter-vivid {
      filter: contrast(1.12) saturate(1.22);
    }

    .camera-media.filter-mono {
      filter: grayscale(1) contrast(1.15);
    }

    .camera-media.filter-warm {
      filter: sepia(0.22) saturate(1.15) brightness(1.03);
    }

    .camera-placeholder {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 24px;
      text-align: center;
      background: var(--bg-surface);
    }

    .camera-placeholder.hidden {
      display: none;
    }

    .cam-hud-top {
      position: absolute;
      top: 12px;
      left: 12px;
      right: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      pointer-events: none;
      z-index: 2;
    }

    .hud-pill {
      pointer-events: auto;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 32px;
      padding: 0 11px;
      border-radius: var(--radius-pill);
      background: rgba(5, 5, 7, 0.68);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border-subtle);
      color: var(--text-primary);
      font-size: 11.5px;
      font-weight: 500;
      cursor: pointer;
      transition: transform 0.12s var(--ease-out), background 0.15s var(--ease-out);
    }

    .hud-pill:active {
      transform: scale(0.94);
    }

    .shutter-flash {
      position: absolute;
      inset: 0;
      background: #ffffff;
      opacity: 0;
      pointer-events: none;
      z-index: 3;
      transition: opacity 0.14s ease-out;
    }

    .shutter-flash.active {
      opacity: 0.85;
    }

    /* Controls Strip */
    .filter-strip {
      display: flex;
      align-items: center;
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: none;
      padding: 2px 0;
    }

    .filter-strip::-webkit-scrollbar {
      display: none;
    }

    .chip-btn {
      flex: 0 0 auto;
      height: 32px;
      padding: 0 13px;
      border-radius: var(--radius-pill);
      border: 1px solid var(--border-subtle);
      background: var(--bg-surface);
      color: var(--text-secondary);
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.16s var(--ease-out);
    }

    .chip-btn[aria-pressed="true"] {
      background: var(--text-primary);
      color: var(--bg-void);
      border-color: var(--text-primary);
      font-weight: 600;
    }

    .chip-btn:active {
      transform: scale(0.95);
    }

    /* Capture Row */
    .capture-bar {
      display: grid;
      grid-template-columns: 48px 1fr 48px;
      align-items: center;
      gap: 12px;
      padding: 2px 4px;
    }

    .icon-action {
      width: 46px;
      height: 46px;
      border-radius: var(--radius-pill);
      border: 1px solid var(--border-subtle);
      background: var(--bg-surface);
      color: var(--text-primary);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.12s var(--ease-out), border-color 0.15s var(--ease-out);
    }

    .icon-action:active {
      transform: scale(0.93);
    }

    .shutter-wrap {
      display: flex;
      justify-content: center;
    }

    .shutter-btn {
      width: 68px;
      height: 68px;
      border-radius: var(--radius-pill);
      background: transparent;
      border: 3px solid var(--text-primary);
      padding: 5px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.12s var(--ease-out);
    }

    .shutter-inner {
      width: 100%;
      height: 100%;
      border-radius: var(--radius-pill);
      background: var(--text-primary);
      transition: transform 0.14s var(--ease-out), background 0.14s var(--ease-out);
    }

    .shutter-btn:active {
      transform: scale(0.94);
    }

    .shutter-btn:active .shutter-inner {
      transform: scale(0.86);
    }

    /* Widgets Row */
    .widgets-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .widget-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-card);
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .widget-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11.5px;
      color: var(--text-secondary);
      font-weight: 500;
    }

    .rating-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 4px;
    }

    .rate-dot-btn {
      width: 30px;
      height: 30px;
      border-radius: var(--radius-pill);
      border: 1px solid var(--border-subtle);
      background: var(--bg-elevated);
      color: var(--text-secondary);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s var(--ease-out);
    }

    .rate-dot-btn.active {
      background: var(--text-primary);
      color: var(--bg-void);
      border-color: var(--text-primary);
    }

    .rate-dot-btn:active {
      transform: scale(0.9);
    }

    .weather-main {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
    }

    .temp-val {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.03em;
    }

    .weather-meta {
      font-size: 11.5px;
      color: var(--text-secondary);
    }

    /* Caption Input */
    .caption-box {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-pill);
      padding: 6px 6px 6px 14px;
    }

    .caption-input {
      flex: 1;
      min-width: 0;
      border: 0;
      background: transparent;
      color: var(--text-primary);
      font-size: 13px;
      outline: none;
    }

    .caption-input::placeholder {
      color: var(--text-muted);
    }

    .send-btn {
      height: 34px;
      padding: 0 14px;
      border-radius: var(--radius-pill);
      border: 0;
      background: var(--text-primary);
      color: var(--bg-void);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: transform 0.12s var(--ease-out), opacity 0.15s var(--ease-out);
    }

    .send-btn:active {
      transform: scale(0.95);
    }

    /* History View */
    .history-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .history-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-card);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .history-img {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      display: block;
      background: var(--bg-elevated);
    }

    .history-body {
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .history-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11.5px;
      color: var(--text-secondary);
    }

    .history-caption {
      font-size: 13px;
      color: var(--text-primary);
      line-height: 1.4;
      word-break: break-word;
    }

    .empty-state {
      padding: 48px 20px;
      text-align: center;
      color: var(--text-secondary);
      font-size: 13px;
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-card);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    /* Toast */
    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(var(--safe-bottom) + 20px);
      transform: translateX(-50%) translateY(16px);
      background: var(--bg-elevated);
      color: var(--text-primary);
      border: 1px solid var(--border-strong);
      padding: 9px 16px;
      border-radius: var(--radius-pill);
      font-size: 12.5px;
      font-weight: 500;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.18s var(--ease-out), transform 0.22s var(--ease-out);
      z-index: 50;
      white-space: nowrap;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
    }

    @media (min-width: 768px) {
      .app-shell {
        align-items: center;
        padding-top: 28px;
        padding-bottom: 28px;
      }

      .stage {
        min-height: auto;
        border-radius: 36px;
        border: 1px solid var(--border-subtle);
        padding: 18px;
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.75);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <main class="stage" id="app" aria-label="Scarlet Studio">
      <header class="topbar">
        <div class="brand-pill" title="Trạng thái kết nối">
          <span class="status-dot" id="netDot"></span>
          <span>SCARLET</span>
        </div>

        <nav class="seg-control" role="tablist" aria-label="Chuyển chế độ">
          <button class="seg-btn" id="tabCamera" role="tab" aria-selected="true" aria-controls="viewCamera" type="button">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"></path>
              <circle cx="12" cy="13" r="3"></circle>
            </svg>
            <span>Chụp</span>
          </button>
          <button class="seg-btn" id="tabHistory" role="tab" aria-selected="false" aria-controls="viewHistory" type="button">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="12" r="10"></circle>
              <polyline points="12 6 12 12 16 14"></polyline>
            </svg>
            <span>Lịch sử</span>
          </button>
        </nav>
      </header>

      <!-- CAMERA VIEW -->
      <section class="view active" id="viewCamera" role="tabpanel" aria-labelledby="tabCamera">
        <div class="camera-wrap" id="cameraWrap">
          <div class="cam-hud-top">
            <button class="hud-pill" id="btnToggleCam" type="button" aria-label="Bật hoặc tắt camera">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <polygon points="5 3 19 12 5 21 5 3"></polygon>
              </svg>
              <span id="camStateText">Bật cam</span>
            </button>

            <button class="hud-pill" id="btnCycleWeather" type="button" aria-label="Đổi trạng thái thời tiết">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"></path>
              </svg>
              <span id="hudWeatherText">26°C · Mát</span>
            </button>
          </div>

          <div class="shutter-flash" id="shutterFlash"></div>

          <video class="camera-media mirrored" id="videoEl" autoplay playsinline muted></video>
          <img class="camera-media" id="previewImg" alt="Ảnh đã chọn hoặc chụp" style="display:none;" />

          <div class="camera-placeholder" id="placeholderEl">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color:var(--text-secondary)">
              <path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"></path>
              <circle cx="12" cy="13" r="3"></circle>
            </svg>
            <p style="font-size:13px;color:var(--text-secondary);max-width:240px;line-height:1.45;">
              Bật camera trực tiếp hoặc chọn ảnh từ máy để bắt đầu
            </p>
          </div>
        </div>

        <div class="filter-strip" role="group" aria-label="Bộ lọc ảnh">
          <button class="chip-btn" type="button" data-filter="none" aria-pressed="true">Gốc</button>
          <button class="chip-btn" type="button" data-filter="vivid" aria-pressed="false">Rực rỡ</button>
          <button class="chip-btn" type="button" data-filter="warm" aria-pressed="false">Ấm áp</button>
          <button class="chip-btn" type="button" data-filter="mono" aria-pressed="false">Đen trắng</button>
        </div>

        <div class="capture-bar">
          <button class="icon-action" id="btnPickFile" type="button" aria-label="Chọn ảnh từ thiết bị">
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
              <circle cx="8.5" cy="8.5" r="1.5"></circle>
              <polyline points="21 15 16 10 5 21"></polyline>
            </svg>
          </button>
          <input type="file" id="fileInput" accept="image/*" class="sr-only" />

          <div class="shutter-wrap">
            <button class="shutter-btn" id="btnShutter" type="button" aria-label="Chụp ảnh">
              <span class="shutter-inner"></span>
            </button>
          </div>

          <button class="icon-action" id="btnSwitchCam" type="button" aria-label="Đổi camera trước hoặc sau">
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M11 19H4a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h5"></path>
              <path d="M13 5h7a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2h-5"></path>
              <circle cx="12" cy="12" r="3"></circle>
              <path d="m18 22-3-3 3-3"></path>
              <path d="m6 2 3 3-3 3"></path>
            </svg>
          </button>
        </div>

        <div class="widgets-grid">
          <div class="widget-card">
            <div class="widget-header">
              <span>Đánh giá</span>
              <span id="ratingLabel">5/5</span>
            </div>
            <div class="rating-row" role="group" aria-label="Chọn mức đánh giá">
              <button class="rate-dot-btn" type="button" data-rate="1">1</button>
              <button class="rate-dot-btn" type="button" data-rate="2">2</button>
              <button class="rate-dot-btn" type="button" data-rate="3">3</button>
              <button class="rate-dot-btn" type="button" data-rate="4">4</button>
              <button class="rate-dot-btn active" type="button" data-rate="5">5</button>
            </div>
          </div>

          <div class="widget-card">
            <div class="widget-header">
              <span>Thời tiết</span>
              <span id="weatherLoc">Hà Nội</span>
            </div>
            <div class="weather-main">
              <span class="temp-val" id="tempVal">26°C</span>
              <span class="weather-meta" id="condVal">Mát mẻ</span>
            </div>
          </div>
        </div>

        <form class="caption-box" id="postForm">
          <input
            type="text"
            class="caption-input"
            id="captionInput"
            placeholder="Thêm ghi chú ngắn cho khung hình..."
            maxlength="140"
            autocomplete="off"
          />
          <button class="send-btn" type="submit" id="btnSavePost">
            <span>Lưu</span>
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <line x1="22" y1="2" x2="11" y2="13"></line>
              <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
            </svg>
          </button>
        </form>
      </section>

      <!-- HISTORY VIEW -->
      <section class="view" id="viewHistory" role="tabpanel" aria-labelledby="tabHistory">
        <div class="history-list" id="historyList"></div>
      </section>
    </main>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    (() => {
      const DB_NAME = 'ScarletStudioDB';
      const DB_VERSION = 1;
      const STORE_NAME = 'captures';
      const MAX_ITEMS = 30;
      const MAX_PHOTO_DIM = 1280;

      const WEATHER_PRESETS = [
        { temp: '26°C', cond: 'Mát mẻ', hud: '26°C · Mát' },
        { temp: '29°C', cond: 'Nắng nhẹ', hud: '29°C · Nắng' },
        { temp: '23°C', cond: 'Gió thu', hud: '23°C · Gió' },
        { temp: '24°C', cond: 'Mưa rào', hud: '24°C · Mưa' }
      ];

      const state = {
        stream: null,
        facingMode: 'user',
        filter: 'none',
        rating: 5,
        weatherIdx: 0,
        draftDataUrl: null,
        activeObjectUrl: null,
        rafId: null,
        toastTimer: null
      };

      const el = {
        netDot: document.getElementById('netDot'),
        tabCamera: document.getElementById('tabCamera'),
        tabHistory: document.getElementById('tabHistory'),
        viewCamera: document.getElementById('viewCamera'),
        viewHistory: document.getElementById('viewHistory'),
        btnToggleCam: document.getElementById('btnToggleCam'),
        camStateText: document.getElementById('camStateText'),
        btnCycleWeather: document.getElementById('btnCycleWeather'),
        hudWeatherText: document.getElementById('hudWeatherText'),
        tempVal: document.getElementById('tempVal'),
        condVal: document.getElementById('condVal'),
        shutterFlash: document.getElementById('shutterFlash'),
        videoEl: document.getElementById('videoEl'),
        previewImg: document.getElementById('previewImg'),
        placeholderEl: document.getElementById('placeholderEl'),
        btnPickFile: document.getElementById('btnPickFile'),
        fileInput: document.getElementById('fileInput'),
        btnShutter: document.getElementById('btnShutter'),
        btnSwitchCam: document.getElementById('btnSwitchCam'),
        ratingLabel: document.getElementById('ratingLabel'),
        postForm: document.getElementById('postForm'),
        captionInput: document.getElementById('captionInput'),
        historyList: document.getElementById('historyList'),
        toast: document.getElementById('toast')
      };

      function haptic(pattern = 10) {
        if (navigator.vibrate) {
          try { navigator.vibrate(pattern); } catch (_) {}
        }
      }

      function showToast(msg) {
        el.toast.textContent = msg;
        el.toast.classList.add('show');
        clearTimeout(state.toastTimer);
        state.toastTimer = setTimeout(() => {
          el.toast.classList.remove('show');
        }, 2000);
      }

      function updateNetStatus() {
        el.netDot.classList.toggle('offline', !navigator.onLine);
      }

      function openDB() {
        return new Promise((resolve, reject) => {
          if (!('indexedDB' in window)) return reject(new Error('No IndexedDB'));
          const req = indexedDB.open(DB_NAME, DB_VERSION);
          req.onupgradeneeded = () => {
            const db = req.result;
            if (!db.objectStoreNames.contains(STORE_NAME)) {
              db.createObjectStore(STORE_NAME, { keyPath: 'id' });
            }
          };
          req.onsuccess = () => resolve(req.result);
          req.onerror = () => reject(req.error);
        });
      }

      async function saveCaptureToDB(item) {
        const db = await openDB();
        return new Promise((resolve, reject) => {
          const tx = db.transaction(STORE_NAME, 'readwrite');
          const store = tx.objectStore(STORE_NAME);
          store.put(item);

          const countReq = store.getAllKeys();
          countReq.onsuccess = () => {
            const keys = countReq.result;
            if (keys.length > MAX_ITEMS) {
              const sorted = keys.sort((a, b) => Number(a) - Number(b));
              const excess = sorted.slice(0, sorted.length - MAX_ITEMS);
              excess.forEach((k) => store.delete(k));
            }
          };

          tx.oncomplete = () => resolve();
          tx.onerror = () => reject(tx.error);
        });
      }

      async function getCapturesFromDB() {
        const db = await openDB();
        return new Promise((resolve, reject) => {
          const tx = db.transaction(STORE_NAME, 'readonly');
          const store = tx.objectStore(STORE_NAME);
          const req = store.getAll();
          req.onsuccess = () => {
            const rows = (req.result || []).sort((a, b) => b.createdAt - a.createdAt);
            resolve(rows);
          };
          req.onerror = () => reject(req.error);
        });
      }

      function revokeDraftObjectUrl() {
        if (state.activeObjectUrl) {
          URL.revokeObjectURL(state.activeObjectUrl);
          state.activeObjectUrl = null;
        }
      }

      function stopCamera() {
        if (state.stream) {
          state.stream.getTracks().forEach((t) => t.stop());
          state.stream = null;
        }
        el.videoEl.srcObject = null;
        el.camStateText.textContent = 'Bật cam';
        if (!state.draftDataUrl) {
          el.videoEl.style.display = 'none';
          el.placeholderEl.classList.remove('hidden');
        }
      }

      async function startCamera() {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          showToast('Trình duyệt chưa hỗ trợ camera');
          return;
        }
        stopCamera();
        try {
          const stream = await navigator.mediaDevices.getUserMedia({
            video: {
              facingMode: state.facingMode,
              width: { ideal: 1080 },
              height: { ideal: 1080 }
            },
            audio: false
          });
          state.stream = stream;
          revokeDraftObjectUrl();
          state.draftDataUrl = null;
          el.previewImg.style.display = 'none';
          el.placeholderEl.classList.add('hidden');
          el.videoEl.style.display = 'block';
          el.videoEl.classList.toggle('mirrored', state.facingMode === 'user');
          el.videoEl.srcObject = stream;
          await el.videoEl.play().catch(() => {});
          el.camStateText.textContent = 'Tắt cam';
        } catch (_) {
          showToast('Không thể truy cập camera');
        }
      }

      function applyFilterClass(target, filterName) {
        target.classList.remove('filter-vivid', 'filter-warm', 'filter-mono');
        if (filterName !== 'none') {
          target.classList.add(`filter-${filterName}`);
        }
      }

      function setFilter(filterName) {
        state.filter = filterName;
        applyFilterClass(el.videoEl, filterName);
        applyFilterClass(el.previewImg, filterName);
        document.querySelectorAll('.chip-btn').forEach((btn) => {
          btn.setAttribute('aria-pressed', String(btn.dataset.filter === filterName));
        });
      }

      function setRating(val) {
        state.rating = val;
        el.ratingLabel.textContent = `${val}/5`;
        document.querySelectorAll('.rate-dot-btn').forEach((btn) => {
          btn.classList.toggle('active', Number(btn.dataset.rate) === val);
        });
      }

      function cycleWeather() {
        state.weatherIdx = (state.weatherIdx + 1) % WEATHER_PRESETS.length;
        const w = WEATHER_PRESETS[state.weatherIdx];
        el.tempVal.textContent = w.temp;
        el.condVal.textContent = w.cond;
        el.hudWeatherText.textContent = w.hud;
        haptic(8);
      }

      function renderSquareCanvas(source, srcW, srcH, mirror) {
        const size = Math.min(Math.max(Math.min(srcW, srcH), 320), MAX_PHOTO_DIM);
        const canvas = document.createElement('canvas');
        canvas.width = size;
        canvas.height = size;
        const ctx = canvas.getContext('2d', { alpha: false });

        ctx.fillStyle = '#050507';
        ctx.fillRect(0, 0, size, size);

        if (state.filter === 'vivid') ctx.filter = 'contrast(1.12) saturate(1.22)';
        else if (state.filter === 'warm') ctx.filter = 'sepia(0.22) saturate(1.15) brightness(1.03)';
        else if (state.filter === 'mono') ctx.filter = 'grayscale(1) contrast(1.15)';
        else ctx.filter = 'none';

        const side = Math.min(srcW, srcH);
        const sx = (srcW - side) / 2;
        const sy = (srcH - side) / 2;

        ctx.save();
        if (mirror) {
          ctx.translate(size, 0);
          ctx.scale(-1, 1);
        }
        ctx.drawImage(source, sx, sy, side, side, 0, 0, size, size);
        ctx.restore();

        return canvas.toDataURL('image/jpeg', 0.84);
      }

      function triggerFlash() {
        if (state.rafId) cancelAnimationFrame(state.rafId);
        state.rafId = requestAnimationFrame(() => {
          el.shutterFlash.classList.add('active');
          setTimeout(() => {
            el.shutterFlash.classList.remove('active');
          }, 120);
        });
      }

      function handleShutter() {
        haptic(14);
        triggerFlash();

        if (state.stream && el.videoEl.videoWidth > 0) {
          const dataUrl = renderSquareCanvas(
            el.videoEl,
            el.videoEl.videoWidth,
            el.videoEl.videoHeight,
            state.facingMode === 'user'
          );
          state.draftDataUrl = dataUrl;
          stopCamera();
          el.placeholderEl.classList.add('hidden');
          el.previewImg.src = dataUrl;
          applyFilterClass(el.previewImg, 'none');
          el.previewImg.style.display = 'block';
          showToast('Đã chụp khung hình');
          return;
        }

        if (state.draftDataUrl) {
          showToast('Đã sẵn sàng lưu khung hình');
          return;
        }

        el.fileInput.click();
      }

      function handleFileSelected(e) {
        const file = e.target.files && e.target.files[0];
        if (!file) return;

        revokeDraftObjectUrl();
        const objUrl = URL.createObjectURL(file);
        state.activeObjectUrl = objUrl;

        const img = new Image();
        img.onload = () => {
          const dataUrl = renderSquareCanvas(img, img.naturalWidth, img.naturalHeight, false);
          state.draftDataUrl = dataUrl;
          revokeDraftObjectUrl();
          stopCamera();
          el.placeholderEl.classList.add('hidden');
          el.previewImg.src = dataUrl;
          applyFilterClass(el.previewImg, 'none');
          el.previewImg.style.display = 'block';
          showToast('Đã tải ảnh');
        };
        img.onerror = () => {
          revokeDraftObjectUrl();
          showToast('Không đọc được ảnh');
        };
        img.src = objUrl;
        e.target.value = '';
      }

      function formatTime(ts) {
        try {
          return new Intl.DateTimeFormat('vi-VN', {
            hour: '2-digit',
            minute: '2-digit',
            day: '2-digit',
            month: '2-digit'
          }).format(new Date(ts));
        } catch (_) {
          return '';
        }
      }

      async function renderHistory() {
        try {
          const items = await getCapturesFromDB();
          el.historyList.innerHTML = '';

          if (!items.length) {
            const empty = document.createElement('div');
            empty.className = 'empty-state';
            empty.textContent = 'Chưa có khung hình nào được lưu.';
            el.historyList.appendChild(empty);
            return;
          }

          const frag = document.createDocumentFragment();
          for (const item of items) {
            const card = document.createElement('article');
            card.className = 'history-card';

            const img = document.createElement('img');
            img.className = 'history-img';
            img.src = item.photo;
            img.alt = item.caption || 'Ảnh đã lưu';
            img.loading = 'lazy';
            img.decoding = 'async';

            const body = document.createElement('div');
            body.className = 'history-body';

            const meta = document.createElement('div');
            meta.className = 'history-meta';

            const timeSpan = document.createElement('span');
            timeSpan.textContent = formatTime(item.createdAt);

            const infoSpan = document.createElement('span');
            infoSpan.textContent = `${item.rating}/5 · ${item.weather || ''}`;

            meta.append(timeSpan, infoSpan);
            body.appendChild(meta);

            if (item.caption) {
              const cap = document.createElement('p');
              cap.className = 'history-caption';
              cap.textContent = item.caption;
              body.appendChild(cap);
            }

            card.append(img, body);
            frag.appendChild(card);
          }

          el.historyList.appendChild(frag);
        } catch (_) {
          el.historyList.innerHTML = '<div class="empty-state">Không thể mở lịch sử lưu trữ.</div>';
        }
      }

      function switchTab(tabName) {
        const isCam = tabName === 'camera';
        el.tabCamera.setAttribute('aria-selected', String(isCam));
        el.tabHistory.setAttribute('aria-selected', String(!isCam));
        el.viewCamera.classList.toggle('active', isCam);
        el.viewHistory.classList.toggle('active', !isCam);
        if (!isCam) {
          renderHistory();
        }
      }

      el.tabCamera.addEventListener('click', () => switchTab('camera'), { passive: true });
      el.tabHistory.addEventListener('click', () => switchTab('history'), { passive: true });

      el.btnToggleCam.addEventListener('click', () => {
        if (state.stream) stopCamera();
        else startCamera();
      }, { passive: true });

      el.btnSwitchCam.addEventListener('click', () => {
        state.facingMode = state.facingMode === 'user' ? 'environment' : 'user';
        if (state.stream) startCamera();
        else showToast(state.facingMode === 'user' ? 'Camera trước' : 'Camera sau');
      }, { passive: true });

      el.btnCycleWeather.addEventListener('click', cycleWeather, { passive: true });
      el.btnPickFile.addEventListener('click', () => el.fileInput.click(), { passive: true });
      el.fileInput.addEventListener('change', handleFileSelected, { passive: true });
      el.btnShutter.addEventListener('click', handleShutter, { passive: true });

      document.querySelectorAll('.chip-btn').forEach((btn) => {
        btn.addEventListener('click', () => setFilter(btn.dataset.filter), { passive: true });
      });

      document.querySelectorAll('.rate-dot-btn').forEach((btn) => {
        btn.addEventListener('click', () => setRating(Number(btn.dataset.rate)), { passive: true });
      });

      el.postForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        if (!state.draftDataUrl && state.stream && el.videoEl.videoWidth > 0) {
          state.draftDataUrl = renderSquareCanvas(
            el.videoEl,
            el.videoEl.videoWidth,
            el.videoEl.videoHeight,
            state.facingMode === 'user'
          );
        }

        if (!state.draftDataUrl) {
          showToast('Hãy chụp hoặc chọn ảnh trước');
          return;
        }

        const w = WEATHER_PRESETS[state.weatherIdx];
        const record = {
          id: Date.now(),
          createdAt: Date.now(),
          photo: state.draftDataUrl,
          caption: el.captionInput.value.trim(),
          rating: state.rating,
          weather: `${w.temp} ${w.cond}`
        };

        try {
          await saveCaptureToDB(record);
          el.captionInput.value = '';
          state.draftDataUrl = null;
          el.previewImg.removeAttribute('src');
          el.previewImg.style.display = 'none';
          el.placeholderEl.classList.remove('hidden');
          haptic([10, 30, 10]);
          showToast('Đã lưu vào lịch sử');
        } catch (_) {
          showToast('Lưu thất bại');
        }
      });

      window.addEventListener('online', updateNetStatus, { passive: true });
      window.addEventListener('offline', updateNetStatus, { passive: true });
      window.addEventListener('pagehide', () => {
        stopCamera();
        revokeDraftObjectUrl();
      }, { passive: true });

      updateNetStatus();
      setRating(5);
    })();
  </script>
</body>
</html>
