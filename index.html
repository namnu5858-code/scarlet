<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>Cam Thượng Middle School - 3D Campus</title>

<style>
*{
  box-sizing:border-box;
  -webkit-user-select:none;
  user-select:none;
  -webkit-touch-callout:none;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#9bdcff;
  touch-action:none;
  font-family:Arial,sans-serif;
}

#game-container{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
}

canvas{
  display:block;
}

.glass-ui{
  background:rgba(255,255,255,.18);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  border:1px solid rgba(255,255,255,.4);
  box-shadow:0 8px 32px rgba(0,0,0,.18);
}

#joystick-wrapper{
  position:absolute;
  left:32px;
  bottom:32px;
  width:120px;
  height:120px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:20;
  touch-action:none;
}

#joystick-stick{
  position:absolute;
  width:52px;
  height:52px;
  border-radius:50%;
  background:rgba(255,255,255,.58);
  border:1px solid rgba(255,255,255,.85);
  box-shadow:0 4px 14px rgba(0,0,0,.18);
  pointer-events:none;
}

#jump-btn{
  position:absolute;
  right:32px;
  bottom:38px;
  width:72px;
  height:72px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:20;
  touch-action:none;
  transition: background 0.3s ease, transform 0.1s ease;
}

#jump-btn.flying{
  background:rgba(255, 215, 0, 0.55);
  border-color:rgba(255, 255, 255, 0.9);
  box-shadow: 0 0 15px rgba(255, 215, 0, 0.6);
}

#jump-btn:active{
  transform:scale(.94);
}

#jump-btn svg{
  width:34px;
  height:34px;
  fill:none;
  stroke:white;
  stroke-width:2.5;
  stroke-linecap:round;
  stroke-linejoin:round;
}

#loading{
  position:absolute;
  top:14px;
  right:16px;
  padding:8px 14px;
  border-radius:10px;
  background:rgba(0,0,0,.42);
  color:white;
  font-size:12px;
  z-index:30;
  pointer-events:none;
}
</style>

<script type="importmap">
{
  "imports":{
    "three":"https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>

<body>

<div id="game-container"></div>

<div id="loading">
Đang dựng khuôn viên trường 3D...
</div>

<div id="joystick-wrapper" class="glass-ui">
  <div id="joystick-stick"></div>
</div>

<div id="jump-btn" class="glass-ui">
  <svg viewBox="0 0 24 24">
    <path d="M12 19V5"></path>
    <path d="M5 12l7-7 7 7"></path>
  </svg>
</div>

<script type="module">

import * as THREE from "three";
import {GLTFLoader} from "three/addons/loaders/GLTFLoader.js";

// ============================================================
// SCENE
// ============================================================

const container=document.getElementById("game-container");
const loading=document.getElementById("loading");

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x8fd4f5);
scene.fog=new THREE.FogExp2(0xbfeafa, 0.0018);

// ============================================================
// CAMERA
// ============================================================

const cameraPivot=new THREE.Object3D();
scene.add(cameraPivot);

const camera=new THREE.PerspectiveCamera(
  60,
  window.innerWidth/window.innerHeight,
  0.1,
  2000
);
cameraPivot.add(camera);

let cameraDistance=10;
let targetCameraDistance=10;

let cameraAngleX=0.05; 
let cameraAngleY=0;

let targetCameraAngleX=0.05;
let targetCameraAngleY=0;

function updateCamera(){
  cameraAngleY = THREE.MathUtils.lerp(cameraAngleY, targetCameraAngleY, 0.15);
  cameraAngleX = THREE.MathUtils.lerp(cameraAngleX, targetCameraAngleX, 0.15);
  cameraDistance = THREE.MathUtils.lerp(cameraDistance, targetCameraDistance, 0.15);

  cameraPivot.rotation.y=cameraAngleY;
  cameraPivot.rotation.x=cameraAngleX;

  camera.position.set(0, 0, cameraDistance);
  camera.lookAt(cameraPivot.position);
}

// ============================================================
// RENDERER
// ============================================================

const renderer=new THREE.WebGLRenderer({
  antialias:true,
  powerPreference:"high-performance"
});

renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.12;

container.appendChild(renderer.domElement);

// ============================================================
// LIGHTING
// ============================================================

const hemisphere=new THREE.HemisphereLight(0xe8f8ff, 0x516b3b, 1.5);
scene.add(hemisphere);

const sunlight=new THREE.DirectionalLight(0xfff3d2, 2.2);
sunlight.position.set(100, 130, 80);
sunlight.castShadow=true;
sunlight.shadow.mapSize.width=2048;
sunlight.shadow.mapSize.height=2048;
sunlight.shadow.camera.near=1;
sunlight.shadow.camera.far=300;
sunlight.shadow.camera.left=-180;
sunlight.shadow.camera.right=180;
sunlight.shadow.camera.top=180;
sunlight.shadow.camera.bottom=-180;
sunlight.shadow.bias=-0.0003;
scene.add(sunlight);

// ============================================================
// MATERIALS
// ============================================================

const MAT={};

MAT.redTile=new THREE.MeshStandardMaterial({
  color:0xa94c3d,
  roughness:.78
});

MAT.lightBlue=new THREE.MeshStandardMaterial({
  color:0x9ed9ec,
  roughness:.7
});

MAT.white=new THREE.MeshStandardMaterial({
  color:0xf4f5f0,
  roughness:.72
});

MAT.yellow=new THREE.MeshStandardMaterial({
  color:0xe7d16a,
  roughness:.8
});

MAT.yellowBright=new THREE.MeshStandardMaterial({
  color:0xf1df83,
  roughness:.72
});

MAT.blueSign=new THREE.MeshStandardMaterial({
  color:0x155a9b,
  roughness:.45
});

MAT.darkMetal=new THREE.MeshStandardMaterial({
  color:0x30383b,
  roughness:.55,
  metalness:.65
});

MAT.steel=new THREE.MeshStandardMaterial({
  color:0xadb7ba,
  roughness:.35,
  metalness:.8
});

MAT.greenRoof=new THREE.MeshStandardMaterial({
  color:0x315d3b,
  roughness:.82
});

MAT.roofMetal=new THREE.MeshStandardMaterial({
  color:0x68777b,
  roughness:.65,
  metalness:.45
});

MAT.glass=new THREE.MeshPhysicalMaterial({
  color:0x76b9d2,
  roughness:.08,
  metalness:.05,
  transparent:true,
  opacity:.68
});

MAT.blackboard=new THREE.MeshStandardMaterial({
  color:0x17231f,
  roughness:.9
});

MAT.wood=new THREE.MeshStandardMaterial({
  color:0x9b6034,
  roughness:.85
});

MAT.treeTrunk=new THREE.MeshStandardMaterial({
  color:0x68452d,
  roughness:1
});

MAT.treeLeaf=new THREE.MeshStandardMaterial({
  color:0x2f8137,
  roughness:.92
});

MAT.treeLeafDark=new THREE.MeshStandardMaterial({
  color:0x23652d,
  roughness:.95
});

MAT.concrete=new THREE.MeshStandardMaterial({
  color:0xb8b9b3,
  roughness:.9
});

// ============================================================
// HELPER FUNCTIONS
// ============================================================

function box(w,h,d,x,y,z,material,parent=scene){
  const mesh=new THREE.Mesh(new THREE.BoxGeometry(w,h,d), material);
  mesh.position.set(x,y,z);
  mesh.castShadow=true;
  mesh.receiveShadow=true;
  parent.add(mesh);
  return mesh;
}

function cylinder(radius,height,x,y,z,material,segments=20,parent=scene){
  const mesh=new THREE.Mesh(
    new THREE.CylinderGeometry(radius,radius,height,segments),
    material
  );
  mesh.position.set(x,y,z);
  mesh.castShadow=true;
  mesh.receiveShadow=true;
  parent.add(mesh);
  return mesh;
}

function textPlane(text,width,height,x,y,z,rotationY=0){
  const canvas=document.createElement("canvas");
  canvas.width=1024;
  canvas.height=256;
  const ctx=canvas.getContext("2d");
  ctx.clearRect(0,0,1024,256);
  ctx.fillStyle="#ffffff";
  ctx.font="bold 72px Arial";
  ctx.textAlign="center";
  ctx.textBaseline="middle";
  ctx.fillText(text,512,128);

  const texture=new THREE.CanvasTexture(canvas);
  texture.colorSpace=THREE.SRGBColorSpace;

  const material=new THREE.MeshBasicMaterial({
    map:texture,
    transparent:true
  });

  const mesh=new THREE.Mesh(new THREE.PlaneGeometry(width,height), material);
  mesh.position.set(x,y,z);
  mesh.rotation.y=rotationY;
  scene.add(mesh);
  return mesh;
}

// ============================================================
// CAMPUS
// ============================================================

const campus=new THREE.Group();
scene.add(campus);

const CAMPUS_W=260;
const CAMPUS_D=210;

// Ground Outside
box(900, 1, 900, 0, -0.7, 0, new THREE.MeshStandardMaterial({

  roughness:1
}), campus);

// SÂN TRƯỜNG LÁT GẠCH ĐỎ VỚI ĐƯỜNG VIỀN SẮC NÉT
const courtyard=box(240, 0.45, 190, 0, 0, 0, MAT.redTile, campus);

const tileLineMaterial=new THREE.MeshStandardMaterial({
  color:0x5e2b26, // Đường viền gạch sẫm màu
  roughness:.9
});

// Đường kẻ dọc
for(let x=-120; x<=120; x+=6){

}

// Đường kẻ ngang
for(let z=-95; z<=95; z+=6){

}

// ============================================================
// FENCE
// ============================================================

function createFenceX(z){
  box(CAMPUS_W, 2.0, 1.0, 0, 1, z, MAT.yellow, campus);
  for(let x=-130; x<=130; x+=4){
    box(.16, 2.5, .16, x, 2.25, z, MAT.darkMetal, campus);

function createFenceZ(x){

  for(let z=-105; z<=105; z+=4){

  }
  box(.16, .16, CAMPUS_D, x, 3.4, 0, MAT.darkMetal, campus);

createFenceX(105);
createFenceZ(-130);
createFenceZ(130);

// ============================================================
// MAIN GATE
// ============================================================

const gateX=65;

for(let i=0; i<9; i++){

}
for(let y=1; y<=6; y+=1.3){

}

// ============================================================
// BUILDINGS (A, B, C)
// ============================================================

const buildingA=new THREE.Group();
campus.add(buildingA);
const A_HEIGHT=16;

box(145, A_HEIGHT, 17, -45, A_HEIGHT/2, -55, MAT.lightBlue, buildingA);
box(17, A_HEIGHT, 70, -109, A_HEIGHT/2, -20, MAT.lightBlue, buildingA);
box(145, 1.2, 17.5, -45, .6, -55, MAT.white, buildingA);
box(17.5, 1.2, 70, -109, .6, -20, MAT.white, buildingA);

for(let y=4; y<16; y+=4){
  box(145, .22, 17.5, -45, y, -55, MAT.white, buildingA);
  box(17.5, .22, 70, -109, y, -20, MAT.white, buildingA);
}

for(let floor=0; floor<4; floor++){
  const y=2.0+floor*4;
  for(let x=-112; x<=22; x+=13){
    box(8.2, 2.25, .20, x, y, -63.65, MAT.glass, buildingA);
    box(8.7, .15, .15, x, y-1.15, -63.82, MAT.darkMetal, buildingA);
    box(8.7, .15, .15, x, y+1.15, -63.82, MAT.darkMetal, buildingA);
    box(.15, 2.4, .15, x-4.25, y, -63.82, MAT.darkMetal, buildingA);
    box(.15, 2.4, .15, x+4.25, y, -63.82, MAT.darkMetal, buildingA);
  }
}

for(let floor=1; floor<=3; floor++){
  const y=floor*4;
  box(145, .28, 5, -45, y, -45, MAT.concrete, buildingA);
  for(let x=-112; x<=22; x+=5){
    box(.12, 2.0, .12, x, y+1, -42.6, MAT.steel, buildingA);
  }

  box(145, .12, .12, -45, y+.8, -42.6, MAT.steel, buildingA);
}

const buildingB=new THREE.Group();
campus.add(buildingB);
const BX=75, BZ=-10;

box(70, 16, 30, BX, 8, BZ, MAT.lightBlue, buildingB);
box(70, 1.2, 31, BX, .6, BZ, MAT.white, buildingB);

for(let y=4; y<16; y+=4){
  box(70, .22, 31, BX, y, BZ, MAT.white, buildingB);
}

for(let floor=0; floor<4; floor++){
  const y=2+floor*4;
  for(let x=47; x<=103; x+=14){
    box(8, 2.3, .18, x, y, BZ-15.15, MAT.glass, buildingB);

    box(8.5, .15, .15, x, y+1.2, BZ-15.3, MAT.darkMetal, buildingB);

// CẦU THANG

campus.add(stairGroup);
const stairX=43, stairZ=BZ-24;

const stairRoof=new THREE.Mesh(new THREE.BoxGeometry(16, .6, 31), MAT.greenRoof);
stairRoof.position.set(stairX, 14.2, stairZ+7);

stairRoof.castShadow=true;
stairRoof.receiveShadow=true;

// BUILDING C
const buildingC=new THREE.Group();
campus.add(buildingC);
const CX=-15, CZ=-91;

box(120, 1.1, 18.5, CX, .55, CZ, MAT.white, buildingC);

// PARKING

campus.add(parking);
const parkingZ=72;

box(150, .5, 30, -5, .25, parkingZ, MAT.concrete, parking);

function createMotorbike(x,z){
  const bike=new THREE.Group();
  const wheelMat=new THREE.MeshStandardMaterial({color:0x181b1d, roughness:.7});
  const bodyMat=new THREE.MeshStandardMaterial({color:0x303d46, metalness:.3, roughness:.55});

  const wheel1=new THREE.Mesh(new THREE.CylinderGeometry(1.25, 1.25, .45, 18), wheelMat);
  wheel1.rotation.z=Math.PI/2;
  wheel1.position.set(0, 1.25, -2.4);
  bike.add(wheel1);

  const wheel2=wheel1.clone();
  wheel2.position.z=2.4;
  bike.add(wheel2);

  const body=new THREE.Mesh(new THREE.BoxGeometry(1.5, .8, 4), bodyMat);
  body.position.y=2;
  bike.add(body);

  const seat=new THREE.Mesh(new THREE.BoxGeometry(1.4, .3, 1.7), MAT.blackboard);
  seat.position.set(0, 2.8, .5);
  bike.add(seat);

  bike.position.set(x, 0, z);
  bike.rotation.y=Math.PI/2;
  bike.traverse(o=>{ if(o.isMesh){ o.castShadow=true; o.receiveShadow=true; } });
  parking.add(bike);
}

for(let x=-65; x<=55; x+=10){
  createMotorbike(x, parkingZ-5);
}

// TREES
function createTree(x,z,scale=1){
  cylinder(3.8, 1.2, x, .6, z, MAT.concrete, 32, campus);
  cylinder(3.1, .18, x, 1.22, z, new THREE.MeshStandardMaterial({color:0x513823, roughness:1}), 24, campus);

  const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.9, 1.15, 7, 12), MAT.treeTrunk);
  trunk.position.set(x, 5, z);
  trunk.scale.setScalar(scale);
  trunk.castShadow=true;
  campus.add(trunk);

  const crownGroup=new THREE.Group();
  crownGroup.position.set(x, 8, z);
  crownGroup.scale.setScalar(scale);
  campus.add(crownGroup);

  const positions=[
    [0,2,0,3.7],[-3,1,0,3.0],[3,1,0,3.0],[0,1,3,3.0],
    [0,1,-3,3.0],[-2,3,1,2.7],[2,3,-1,2.7]
  ];

  positions.forEach((p,index)=>{
    const leaf=new THREE.Mesh(new THREE.SphereGeometry(p[3],16,12), index%2===0?MAT.treeLeaf:MAT.treeLeafDark);
    leaf.position.set(p[0],p[1],p[2]);
    leaf.castShadow=true;
    leaf.receiveShadow=true;
    crownGroup.add(leaf);
  });
}

createTree(-75,10,1.1);
createTree(-25,25,1.0);
createTree(20,10,1.1);
createTree(92,25,.95);
createTree(-20,-25,1.0);
createTree(25,-48,.95);
createTree(-75,-25,.9);

// WALKWAYS
const walkwayMat=new THREE.MeshStandardMaterial({color:0xb76653, roughness:.85});
box(15, .12, 70, gateX, .29, 70, walkwayMat, campus);
box(110, .12, 8, 0, .29, 45, walkwayMat, campus);
box(8, .12, 120, -5, .29, -20, walkwayMat, campus);

// ============================================================
// PLAYER & MODEL
// ============================================================

const player=new THREE.Group();
scene.add(player);

let model=null;
const leafMeshes=[];
const armMeshes=[];
const rootMeshes=[];
const initialData=new Map();

const loader=new GLTFLoader();
loader.load("scene.gltf", function(gltf){
  model=gltf.scene;
  model.traverse(function(object){
    if(!object.isMesh)return;
    object.castShadow=true;
    object.receiveShadow=true;
    initialData.set(object, {
      position:object.position.clone(),
      rotation:object.rotation.clone(),
      scale:object.scale.clone()
    });
    const name=object.name.toLowerCase();
    if(name.includes("leaf")||name.includes("leaves")||name.includes("foliage")||name.includes("la")) leafMeshes.push(object);
    if(name.includes("arm")||name.includes("hand")||name.includes("tay")) armMeshes.push(object);
    if(name.includes("root")||name.includes("re")) rootMeshes.push(object);
  });
  player.add(model);
  loading.style.display="none";
}, undefined, function(error){
  loading.textContent="Không tìm thấy scene.gltf";
});

// ============================================================
// MOVEMENT & SPEED CONFIG (TỐC ĐỘ BAY 35 KM/H ~ 9.72 M/S)
// ============================================================

const input=new THREE.Vector2(0,0);
const velocity=new THREE.Vector3(0,0,0);
const walkSpeed=6.0;

// 35 km/h = 9.7222 m/s
const FLY_SPEED = 9.7222; 

let moveSpeed=walkSpeed;
const gravity=-20;
let grounded=true;
let isFlying=false;

// ============================================================
// JOYSTICK
// ============================================================

const joystick=document.getElementById("joystick-wrapper");
const stick=document.getElementById("joystick-stick");
let joystickTouch=null;
let centerX=0, centerY=0;
const radius=40;

joystick.addEventListener("touchstart", function(event){
  event.preventDefault();
  const touch=event.changedTouches[0];
  joystickTouch=touch.identifier;
  const rect=joystick.getBoundingClientRect();
  centerX=rect.left+rect.width/2;
  centerY=rect.top+rect.height/2;
  updateJoystick(touch);
}, {passive:false});

function updateJoystick(touch){
  const dx=touch.clientX-centerX;
  const dy=touch.clientY-centerY;
  const distance=Math.hypot(dx,dy);
  const angle=Math.atan2(dy,dx);
  const limited=Math.min(distance,radius);
  const x=Math.cos(angle)*limited;
  const y=Math.sin(angle)*limited;
  stick.style.transform=`translate(${x}px,${y}px)`;
  input.x=x/radius;
  input.y=-y/radius;
}

function resetJoystick(){
  joystickTouch=null;
  input.set(0,0);
  stick.style.transform="translate(0px,0px)";
}

window.addEventListener("touchmove", function(event){
  for(let i=0; i<event.changedTouches.length; i++){
    if(event.changedTouches[i].identifier===joystickTouch){
      updateJoystick(event.changedTouches[i]);
    }
  }
}, {passive:false});

window.addEventListener("touchend", function(event){
  for(let i=0; i<event.changedTouches.length; i++){
    if(event.changedTouches[i].identifier===joystickTouch) resetJoystick();
  }
});
window.addEventListener("touchcancel", resetJoystick);

// ============================================================
// JUMP & FLY CONTROL (2 CLICKS = BAY 35KM/H, 3 CLICKS = HẠ CÁNH)
// ============================================================

const jump=document.getElementById("jump-btn");
let tapCount = 0;
let tapTimer = null;

jump.addEventListener("touchstart", function(event){
  event.preventDefault();
  
  tapCount++;

  clearTimeout(tapTimer);
  tapTimer = setTimeout(() => {
    
    if (tapCount === 1) {
      // 1 Tap: Nhảy đơn hoặc đẩy hướng lên nhẹ khi đang bay
      if (isFlying) {
        velocity.y = 5.0;
      } else if (grounded) {
        velocity.y = 8;
        grounded = false;
      }
    } 
    else if (tapCount === 2) {
      // 2 Taps: Bật chế độ bay với tốc độ 35 km/h
      isFlying = true;
      jump.classList.add("flying");
      velocity.y = 3.0; 
      moveSpeed = FLY_SPEED;
    } 
    else if (tapCount >= 3) {
      // 3 Taps: Hạ cánh đáp xuống ngay lập tức
      isFlying = false;
      jump.classList.remove("flying");
      moveSpeed = walkSpeed;
      velocity.y = -10; // Đẩy nhanh xuống mặt đất
    }

    tapCount = 0;
  }, 300); // Khoảng thời gian nhấp liên tiếp

}, {passive:false});

// ============================================================
// CAMERA & SWIPE / ZOOM CONTROL (GIỚI HẠN KHÔNG CHO NHÌN DƯỚI GẠCH)
// ============================================================

let cameraTouch=null;
let lastX=0, lastY=0;
let pinchDistance=0;

window.addEventListener("touchstart", function(event){
  if(event.touches.length===2){
    pinchDistance=Math.hypot(
      event.touches[0].clientX - event.touches[1].clientX,
      event.touches[0].clientY - event.touches[1].clientY
    );
    return;
  }

  const touch=event.changedTouches[0];
  if (touch.identifier !== joystickTouch && cameraTouch === null) {
    cameraTouch = touch.identifier;
    lastX = touch.clientX;
    lastY = touch.clientY;
  }
});

window.addEventListener("touchmove", function(event){
  // Tối ưu Zoom 2 ngón mượt mà
  if(event.touches.length===2){
    const current=Math.hypot(
      event.touches[0].clientX - event.touches[1].clientX,
      event.touches[0].clientY - event.touches[1].clientY
    );
    const difference = pinchDistance - current;
    targetCameraDistance += difference * 0.03;
    targetCameraDistance = THREE.MathUtils.clamp(targetCameraDistance, 3.0, 30.0);
    pinchDistance = current;
    return;
  }

  for(let i=0; i<event.changedTouches.length; i++){
    const touch=event.changedTouches[i];
    if(touch.identifier===cameraTouch){
      const dx=touch.clientX-lastX;
      const dy=touch.clientY-lastY;

      targetCameraAngleY -= dx * 0.005;

      // GIỚI HẠN GÓC NHÌN: Không cho xoay cắm xuống dưới mặt gạch
      // Giá trị tối đa (Math.PI / 2.2) ngăn camera chui xuống dưới đất
      targetCameraAngleX = THREE.MathUtils.clamp(
        targetCameraAngleX + dy * 0.005,
        -Math.PI / 4,     // Ngẩng lên tối đa
        Math.PI / 2.2     // Nhìn xuống tối đa (vẫn ở trên mặt gạch)
      );

      lastX=touch.clientX;
      lastY=touch.clientY;
    }
  }
}, {passive:false});

window.addEventListener("touchend", function(event){
  for(let i=0; i<event.changedTouches.length; i++){
    if(event.changedTouches[i].identifier===cameraTouch){
      cameraTouch=null;
    }
  }
});

window.addEventListener("touchcancel", function(){ cameraTouch=null; });

// ============================================================
// ANIMATION HOẠT ẢNH HOẠT ĐỘNG
// ============================================================

let animationTime=0;
let animationBlend=0;

function animateLeaves(delta,moving){
  if(!model)return;
  leafMeshes.forEach((mesh,index)=>{
    const original=initialData.get(mesh);
    if(!original)return;
    const speed=.72+(index%7)*.085;
    const phase=index*.67;
    const t=animationTime*speed+phase;
    const wave1=Math.sin(t);
    const wave2=Math.sin(t*1.73+index);
    const wave3=Math.cos(t*.57+index*.4);

    const movement=(wave1*.62 + wave2*.23 + wave3*.15) * animationBlend;
    const side=index%2===0?1:-1;

    mesh.rotation.z=original.rotation.z + movement*.30*side;
    mesh.rotation.x=original.rotation.x + wave3*.15*animationBlend;
    mesh.rotation.y=original.rotation.y + wave2*.10*animationBlend;
  });
}

function animateSunflower(delta,moving){
  if(!model)return;
  const target=moving?1:0;
  animationBlend=THREE.MathUtils.lerp(animationBlend, target, Math.min(delta*7,1));

  if(moving){ animationTime+=delta*9.5; }

  const wave=Math.sin(animationTime);
  const bounce=Math.abs(wave)*.10*animationBlend;

  model.position.y=THREE.MathUtils.lerp(model.position.y, bounce, Math.min(delta*13,1));
  model.rotation.z=THREE.MathUtils.lerp(model.rotation.z, wave*.035*animationBlend, Math.min(delta*8,1));

  animateLeaves(delta,moving);

  armMeshes.forEach((mesh,index)=>{
    const original=initialData.get(mesh);
    if(!original)return;
    const side=index%2===0?1:-1;
    mesh.rotation.z=original.rotation.z + wave*.32*side*animationBlend;
  });

  rootMeshes.forEach((mesh,index)=>{
    const original=initialData.get(mesh);
    if(!original)return;
    const side=index%2===0?1:-1;
    mesh.rotation.z=original.rotation.z + Math.sin(animationTime+Math.PI)*.20*side*animationBlend;
  });
}

// ============================================================
// GAME LOOP
// ============================================================

const clock=new THREE.Clock();

function animate(){
  requestAnimationFrame(animate);
  const delta=Math.min(clock.getDelta(),.05);
  const moving=input.lengthSq()>.01;

  if(moving){
    const forward=new THREE.Vector3(0,0,-1);
    const right=new THREE.Vector3(1,0,0);

    forward.applyAxisAngle(new THREE.Vector3(0,1,0),cameraAngleY);
    right.applyAxisAngle(new THREE.Vector3(0,1,0),cameraAngleY);

    const movement=new THREE.Vector3();
    movement.addScaledVector(right,input.x);
    movement.addScaledVector(forward,input.y);

    if(movement.lengthSq()>0){
      movement.normalize();
      velocity.x=movement.x*moveSpeed;
      velocity.z=movement.z*moveSpeed;

      if(model){
        const targetRotation=Math.atan2(movement.x,movement.z);
        let difference=targetRotation-model.rotation.y;
        difference=Math.atan2(Math.sin(difference),Math.cos(difference));
        model.rotation.y+=difference*Math.min(delta*10,1);
      }
    }
  } else {
    velocity.x=0;
    velocity.z=0;
  }

  animateSunflower(delta,moving);

  // VẬT LÝ VÀ BAY
  if (isFlying) {
    velocity.y = THREE.MathUtils.lerp(velocity.y, 0, delta * 3);
  } else {
    velocity.y += gravity * delta;
  }

  player.position.y += velocity.y * delta;

  // GIỚI HẠN MẶT ĐẤT
  if(player.position.y <= 0){
    player.position.y = 0;
    velocity.y = 0;
    grounded = true;
    if (isFlying) {
      isFlying = false;
      jump.classList.remove("flying");
      moveSpeed = walkSpeed;
    }
  }

  player.position.x += velocity.x * delta;
  player.position.z += velocity.z * delta;

  // CẬP NHẬT TẦM NHÌN CAMERA
  cameraPivot.position.copy(player.position);
  cameraPivot.position.y += 1.6;

  updateCamera();
  renderer.render(scene,camera);
}

animate();

// ============================================================
// RESIZE
// ============================================================

window.addEventListener("resize", function(){
  camera.aspect=window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

</script>
