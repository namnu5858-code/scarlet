<title>Cam Thượng Middle School - 3D Campus</title>

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  font-family:Arial,sans-serif;
  touch-action:none;
}
#game-container{
  position:fixed;
  inset:0;
  overflow:hidden;
}
canvas{
  display:block;
  width:100%;
  height:100%;
}
.glass-ui{
  background:rgba(20,30,40,.48);
  border:1px solid rgba(255,255,255,.25);
  box-shadow:0 8px 30px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.16);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
}

/* Loading */
#loading{
  position:fixed;
  inset:0;
  z-index:1000;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#fff;
  background:#8fd4f5;
  font-size:18px;
  text-align:center;
}

/* Joystick */
#joystick-wrapper{
  position:fixed;
  left:22px;
  bottom:22px;
  width:120px;
  height:120px;
  border-radius:50%;
  z-index:20;
  display:flex;
  align-items:center;
  justify-content:center;
  touch-action:none;
}
#joystick-base{
  width:100%;
  height:100%;
  border-radius:50%;
  background:rgba(255,255,255,.12);
  border:2px solid rgba(255,255,255,.28);
  position:relative;
}
#joystick-stick{
  position:absolute;
  width:52px;
  height:52px;
  left:50%;
  top:50%;
  margin:-26px 0 0 -26px;
  border-radius:50%;
  background:rgba(255,255,255,.72);
  border:2px solid rgba(255,255,255,.75);
  box-shadow:0 5px 18px rgba(0,0,0,.3);
}

/* Jump */
#jump-btn{
  position:fixed;
  right:24px;
  bottom:28px;
  width:72px;
  height:72px;
  border-radius:50%;
  z-index:20;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#fff;
  touch-action:none;
  user-select:none;
}
#jump-btn.flying{
  background:rgba(255,200,30,.55);
  box-shadow:0 0 28px rgba(255,210,40,.75);
}
#jump-btn svg{
  width:34px;
  height:34px;
  fill:none;
  stroke:#fff;
  stroke-width:3;
  stroke-linecap:round;
  stroke-linejoin:round;
}

/* 3D browser screen */
#browser-screen{
  position:absolute;
  left:50%;
  top:50%;
  width:5.5px;
  height:3.35px;
  transform-origin:center center;
  pointer-events:none;
  z-index:8;
  display:none;
}

#browser-surface{
  position:absolute;
  inset:0;
  overflow:hidden;
  border-radius:.12px;
  background:#050505;
  border:.035px solid rgba(255,255,255,.55);
  box-shadow:
    0 0 .18px rgba(255,255,255,.25),
    0 .18px .35px rgba(0,0,0,.6);
}

/*
  DOM browser is projected over the 3D screen.
  It stays interactive while the rest of the scene remains touch controlled.
*/
#web-display{
  position:fixed;
  left:0;
  top:0;
  width:100%;
  height:100%;
  z-index:15;
  pointer-events:none;
  display:none;
}

#web-window{
  position:absolute;
  overflow:hidden;
  border-radius:14px;
  background:#fff;
  border:2px solid rgba(255,255,255,.55);
  box-shadow:0 15px 45px rgba(0,0,0,.5);
  pointer-events:auto;
}

#browser-toolbar{
  height:46px;
  background:#f5f5f5;
  display:flex;
  align-items:center;
  gap:6px;
  padding:5px 7px;
  border-bottom:1px solid #ddd;
}

.browser-btn{
  width:34px;
  height:34px;
  border:0;
  border-radius:9px;
  background:#fff;
  color:#333;
  font-size:18px;
  flex:none;
}

#url{
  flex:1;
  min-width:0;
  height:34px;
  border:1px solid #d0d0d0;
  border-radius:17px;
  padding:0 13px;
  font-size:14px;
  outline:none;
  background:#fff;
}

#web-frame{
  width:100%;
  height:calc(100% - 46px);
  border:0;
  display:block;
  background:#fff;
}

/* Message shown if a website refuses iframe embedding */
#embed-message{
  position:absolute;
  inset:46px 0 0;
  display:none;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:25px;
  background:#fff;
  color:#222;
  font-size:15px;
  line-height:1.5;
}
#embed-message button{
  margin-top:12px;
  border:0;
  border-radius:10px;
  padding:10px 16px;
  background:#1a73e8;
  color:#fff;
  font-size:14px;
}
</style>

/* =========================================================

========================================================= */

function windowsRow(
  startX,
  y,
  z,
  count,
  spacing,
  side=1
){

}

/* =========================================================
   GREEN STAIR AREA
========================================================= */

function stair(
  x,
  y,
  z,
  w,
  h,
  d,
  steps=6
){

  const group=new THREE.Group();

  for(let i=0;i<steps;i++){

    const step=new THREE.Mesh(
      new THREE.BoxGeometry(
        w,
        h,
        d
      ),
      MAT.green
    );

    step.position.set(
      0,
      i*h/2,
      i*(d/steps)
    );

    step.castShadow=true;
    step.receiveShadow=true;

    group.add(step);
  }

  group.position.set(x,y,z);

  scene.add(group);

  return group;
}

stair(

);

}

/* =========================================================
   GATE TEXT
========================================================= */

function createTextTexture(text){

  const c=document.createElement("canvas");
  c.width=1600;
  c.height=260;

  const ctx=c.getContext("2d");

  ctx.clearRect(0,0,c.width,c.height);

  ctx.fillStyle="#ffffff";
  ctx.font="bold 105px Arial";
  ctx.textAlign="center";
  ctx.textBaseline="middle";

  ctx.fillText(
    text,
    c.width/2,
    c.height/2
  );

  const tex=new THREE.CanvasTexture(c);
  tex.colorSpace=THREE.SRGBColorSpace;

  return tex;
}

/* =========================================================
   SUNFLOWER CHARACTER
========================================================= */

let sunflower=null;
let mixer=null;

const loader=new GLTFLoader();

loader.load(
  "scene.gltf",
  gltf=>{

    sunflower=gltf.scene;

    sunflower.position.set(
      0,
      0,
      35
    );

    sunflower.scale.setScalar(1);

    sunflower.traverse(o=>{
      if(o.isMesh){
        o.castShadow=true;
        o.receiveShadow=true;
      }
    });

    scene.add(sunflower);

    if(gltf.animations && gltf.animations.length){

      mixer=new THREE.AnimationMixer(sunflower);

      const action=mixer.clipAction(
        gltf.animations[0]
      );

      action.play();
    }

    document.getElementById("loading").style.display="none";
  },

  undefined,

  ()=>{
    document.getElementById("loading").style.display="none";
  }
);

/* =========================================================
   PLAYER
========================================================= */

const player=new THREE.Object3D();

player.position.set(
  0,
  0,
  35
);

scene.add(player);

const input=new THREE.Vector2(0,0);
const velocity=new THREE.Vector3(0,0,0);

/*
  290 km/h = 80.556 m/s
*/
const walkSpeed=80.556;

/*
  350 km/h = 97.222 m/s
  Giữ nguyên tốc độ bay.
*/
const FLY_SPEED=97.222;

let moveSpeed=walkSpeed;

const gravity=-20;

let grounded=true;
let isFlying=false;

let yaw=0;
let pitch=-.18;

let cameraDistance=10;

/* =========================================================
   CAMERA
========================================================= */

function updateCamera(){

  const minPitch=-.95;
  const maxPitch=.75;

  pitch=THREE.MathUtils.clamp(
    pitch,
    minPitch,
    maxPitch
  );

  const target=new THREE.Vector3(
    player.position.x,
    player.position.y+2.4,
    player.position.z
  );

  const offset=new THREE.Vector3();

  offset.x=
    Math.sin(yaw)*
    Math.cos(pitch)*
    cameraDistance;

  offset.y=
    Math.sin(pitch)*
    cameraDistance;

  offset.z=
    Math.cos(yaw)*
    Math.cos(pitch)*
    cameraDistance;

  camera.position.copy(
    target.clone().add(offset)
  );

  /*
    Không cho camera xuống dưới mặt đất.
  */
  if(camera.position.y<.55){
    camera.position.y=.55;
  }

  camera.lookAt(target);
}

/* =========================================================
   JOYSTICK
========================================================= */

const joystick=document.getElementById(
  "joystick-wrapper"
);

const stick=document.getElementById(
  "joystick-stick"
);

let joystickPointer=null;

function setJoystick(clientX,clientY){

  const r=joystick.getBoundingClientRect();

  const cx=r.left+r.width/2;
  const cy=r.top+r.height/2;

  let dx=clientX-cx;
  let dy=clientY-cy;

  const max=34;

  const len=Math.hypot(dx,dy);

  if(len>max){

    dx=dx/len*max;
    dy=dy/len*max;
  }

  stick.style.transform=
    `translate(${dx}px,${dy}px)`;

  input.set(
    dx/max,
    -dy/max
  );
}

function resetJoystick(){

  input.set(0,0);

  stick.style.transform=
    "translate(0px,0px)";

  /*
    Không có quán tính:
    thả joystick là dừng ngay.
  */
  velocity.x=0;
  velocity.z=0;
}

joystick.addEventListener(
  "pointerdown",
  e=>{

    e.preventDefault();

    joystickPointer=e.pointerId;

    joystick.setPointerCapture(
      e.pointerId
    );

    setJoystick(
      e.clientX,
      e.clientY
    );
  }
);

joystick.addEventListener(
  "pointermove",
  e=>{

    if(e.pointerId!==joystickPointer)return;

    e.preventDefault();

    setJoystick(
      e.clientX,
      e.clientY
    );
  }
);

joystick.addEventListener(
  "pointerup",
  e=>{

    if(e.pointerId!==joystickPointer)return;

    joystickPointer=null;
    resetJoystick();
  }
);

joystick.addEventListener(
  "pointercancel",
  ()=>{
    joystickPointer=null;
    resetJoystick();
  }
);

/* =========================================================
   JUMP / FLY
========================================================= */

const jump=document.getElementById(
  "jump-btn"
);

let isJumpHolding=false;
let tapCount=0;
let tapTimer=null;

function doJump(){

  if(isFlying)return;

  if(grounded){

    velocity.y=9.5;
    grounded=false;
  }
}

function startFlying(){

  isFlying=true;
  grounded=false;

  moveSpeed=FLY_SPEED;

  jump.classList.add("flying");

  velocity.y=0;
}

function land(){

  isFlying=false;
  grounded=true;

  moveSpeed=walkSpeed;

  jump.classList.remove("flying");

  velocity.y=0;

  player.position.y=0;
}

jump.addEventListener(
  "pointerdown",
  e=>{

    e.preventDefault();

    isJumpHolding=true;

    tapCount++;

    clearTimeout(tapTimer);

    tapTimer=setTimeout(()=>{

      if(tapCount===1){
        doJump();
      }

      if(tapCount===2){
        startFlying();
      }

      if(tapCount>=3){
        land();
      }

      tapCount=0;

    },260);
  }
);

jump.addEventListener(
  "pointerup",
  ()=>{
    isJumpHolding=false;
  }
);

jump.addEventListener(
  "pointercancel",
  ()=>{
    isJumpHolding=false;
  }
);

/* =========================================================
   CAMERA TOUCH
========================================================= */

let lookPointer=null;
let lastX=0;
let lastY=0;

renderer.domElement.addEventListener(
  "pointerdown",
  e=>{

    /*
      Không lấy touch camera nếu chạm vào
      khu vực trình duyệt.
    */
    if(
      e.target.closest &&
      e.target.closest("#web-display")
    ){
      return;
    }

    lookPointer=e.pointerId;

    lastX=e.clientX;
    lastY=e.clientY;
  }
);

renderer.domElement.addEventListener(
  "pointermove",
  e=>{

    if(e.pointerId!==lookPointer)return;

    const dx=e.clientX-lastX;
    const dy=e.clientY-lastY;

    yaw-=dx*.005;
    pitch-=dy*.004;

    lastX=e.clientX;
    lastY=e.clientY;
  }
);

renderer.domElement.addEventListener(
  "pointerup",
  e=>{

    if(e.pointerId===lookPointer){
      lookPointer=null;
    }
  }
);

renderer.domElement.addEventListener(
  "pointercancel",
  e=>{

    if(e.pointerId===lookPointer){
      lookPointer=null;
    }
  }
);

/* =========================================================
   PINCH / WHEEL ZOOM
========================================================= */

let pinchStart=null;
let pinchDistance=0;

renderer.domElement.addEventListener(
  "touchstart",
  e=>{

    if(e.touches.length===2){

      const a=e.touches[0];
      const b=e.touches[1];

      pinchDistance=Math.hypot(
        a.clientX-b.clientX,
        a.clientY-b.clientY
      );

      pinchStart=cameraDistance;
    }
  },
  {passive:true}
);

renderer.domElement.addEventListener(
  "touchmove",
  e=>{

    if(
      e.touches.length===2 &&
      pinchStart!==null
    ){

      const a=e.touches[0];
      const b=e.touches[1];

      const d=Math.hypot(
        a.clientX-b.clientX,
        a.clientY-b.clientY
      );

      const change=d-pinchDistance;

      cameraDistance=THREE.MathUtils.clamp(
        pinchStart-change*.015,
        4,
        30
      );
    }
  },
  {passive:true}
);

renderer.domElement.addEventListener(
  "touchend",
  e=>{

    if(e.touches.length<2){

      pinchStart=null;
    }
  },
  {passive:true}
);

renderer.domElement.addEventListener(
  "wheel",
  e=>{

    cameraDistance=THREE.MathUtils.clamp(
      cameraDistance+e.deltaY*.01,
      4,
      30
    );
  },
  {passive:true}
);

/* =========================================================
   MOVEMENT
========================================================= */

const clock=new THREE.Clock();

function updateMovement(delta){

  const moving=
    Math.abs(input.x)>.03 ||
    Math.abs(input.y)>.03;

  if(moving){

    const forward=new THREE.Vector3(
      Math.sin(yaw),
      0,
      Math.cos(yaw)
    );

    const right=new THREE.Vector3(
      Math.cos(yaw),
      0,
      -Math.sin(yaw)
    );

    const movement=new THREE.Vector3();

    movement.addScaledVector(
      right,
      input.x
    );

    movement.addScaledVector(
      forward,
      input.y
    );

    if(movement.lengthSq()>0){
      movement.normalize();
    }

    velocity.x=
      movement.x*
      moveSpeed;

    velocity.z=
      movement.z*
      moveSpeed;

  }else{

    /*
      Dừng hoàn toàn ngay khi thả joystick.
    */
    velocity.x=0;
    velocity.z=0;
  }

  if(isFlying){

    if(isJumpHolding){

      velocity.y=
        THREE.MathUtils.lerp(
          velocity.y,
          50,
          delta*5
        );

    }else{

      velocity.y=
        THREE.MathUtils.lerp(
          velocity.y,
          0,
          delta*3
        );
    }

  }else{

    velocity.y+=gravity*delta;
  }

  player.position.x+=velocity.x*delta;
  player.position.y+=velocity.y*delta;
  player.position.z+=velocity.z*delta;

  /*
    Giới hạn trong khuôn viên.
  */
  const halfW=CAMPUS_W/2-3;
  const halfD=CAMPUS_D/2-3;

  player.position.x=
    THREE.MathUtils.clamp(
      player.position.x,
      -halfW,
      halfW
    );

  player.position.z=
    THREE.MathUtils.clamp(
      player.position.z,
      -halfD,
      halfD
    );

  if(player.position.y<=0){

    player.position.y=0;
    velocity.y=0;
    grounded=true;

    if(isFlying){

      isFlying=false;

      jump.classList.remove("flying");

      moveSpeed=walkSpeed;
    }
  }
}

/* =========================================================
   3D SCREEN → BROWSER POSITION
========================================================= */

const webDisplay=
  document.getElementById("web-display");

const webWindow=
  document.getElementById("web-window");

const frame=
  document.getElementById("web-frame");

function projectScreen(){

  const worldPos=
    new THREE.Vector3();

  screenDisplay.getWorldPosition(
    worldPos
  );

  const projected=
    worldPos.clone().project(camera);

  const sx=
    (projected.x*.5+.5)*
    innerWidth;

  const sy=
    (-projected.y*.5+.5)*
    innerHeight;

  /*
    X/Y của màn hình theo camera.
  */
  const rightWorld=
    new THREE.Vector3(1,0,0)
      .applyQuaternion(
        screenGroup.quaternion
      )
      .project(camera);

  const upWorld=
    new THREE.Vector3(0,1,0)
      .applyQuaternion(
        screenGroup.quaternion
      )
      .project(camera);

  const pxPerWorldX=
    Math.max(
      20,
      Math.abs(
        rightWorld.x*
        innerWidth*
        2.75
      )
    );

  const pxPerWorldY=
    Math.max(
      20,
      Math.abs(
        upWorld.y*
        innerHeight*
        1.675
      )
    );

  const width=
    Math.min(
      innerWidth*.82,
      pxPerWorldX
    );

  const height=
    Math.min(
      innerHeight*.55,
      pxPerWorldY
    );

  /*
    Khi màn hình quay nghiêng theo camera,
    web window vẫn được giữ đúng vùng hiển thị.
  */
  webWindow.style.left=
    `${sx-width/2}px`;

  webWindow.style.top=
    `${sy-height/2}px`;

  webWindow.style.width=
    `${width}px`;

  webWindow.style.height=
    `${height}px`;
}

/*
  Hiển thị sẵn ngay từ đầu.
*/
webDisplay.style.display="block";

/* =========================================================
   BROWSER CONTROLS
========================================================= */

const url=
  document.getElementById("url");

const backBtn=
  document.getElementById("backBtn");

const forwardBtn=
  document.getElementById("forwardBtn");

const reloadBtn=
  document.getElementById("reloadBtn");

const goBtn=
  document.getElementById("goBtn");

const embedMessage=
  document.getElementById("embed-message");

const openExternal=
  document.getElementById("openExternal");

function normalizeURL(value){

  value=value.trim();

  if(!value){
    return "https://www.google.com/";
  }

  if(
    !/^https?:\/\//i.test(value)
  ){

    value=
      "https://www.google.com/search?q="+
      encodeURIComponent(value);
  }

  return value;
}

function navigate(value){

  const target=
    normalizeURL(value);

  url.value=target;

  embedMessage.style.display="none";

  frame.style.display="block";

  frame.src=target;
}

goBtn.addEventListener(
  "click",
  e=>{

    e.stopPropagation();

    navigate(url.value);
  }
);

url.addEventListener(
  "keydown",
  e=>{

    e.stopPropagation();

    if(e.key==="Enter"){

      e.preventDefault();

      navigate(url.value);
    }
  }
);

url.addEventListener(
  "pointerdown",
  e=>{
    e.stopPropagation();
  }
);

url.addEventListener(
  "touchstart",
  e=>{
    e.stopPropagation();
  },
  {passive:false}
);

backBtn.addEventListener(
  "click",
  e=>{

    e.stopPropagation();

    try{
      frame.contentWindow.history.back();
    }catch{}
  }
);

forwardBtn.addEventListener(
  "click",
  e=>{

    e.stopPropagation();

    try{
      frame.contentWindow.history.forward();
    }catch{}
  }
);

reloadBtn.addEventListener(
  "click",
  e=>{

    e.stopPropagation();

    try{
      frame.contentWindow.location.reload();
    }catch{
      frame.src=frame.src;
    }
  }
);

openExternal.addEventListener(
  "click",
  e=>{

    e.stopPropagation();

    window.open(
      url.value,
      "_blank"
    );
  }
);

  iframe có thể bị một số website chặn.

/* =========================================================
   RESIZE
========================================================= */

addEventListener(
  "resize",
  ()=>{
    camera.aspect=
      innerWidth/innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
      innerWidth,
      innerHeight
    );

    projectScreen();
  }
);

/* =========================================================
   LOOP
========================================================= */

function animate(){

  requestAnimationFrame(animate);

  const delta=
    Math.min(
      clock.getDelta(),
      .05
    );

  updateMovement(delta);

  if(mixer){
    mixer.update(delta);
  }

  /*
    Sunflower đi theo player.
  */
  if(sunflower){

    sunflower.position.x=
      player.position.x;

    sunflower.position.z=
      player.position.z;

    sunflower.position.y=
      player.position.y;

    sunflower.rotation.y=
      yaw;
  }

  updateCamera();

  projectScreen();

  renderer.render(
    scene,
    camera
  );
}

updateCamera();
animate();
