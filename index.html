<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Garden School 3D</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    user-select:none;
    -webkit-user-select:none;
    touch-action:none;
}

html,body,#game{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
}

canvas{
    display:block;
    width:100%;
    height:100%;
}

#hud{
    position:fixed;
    inset:0;
    pointer-events:none;
}

#info{
    position:absolute;
    top:16px;
    left:16px;
    color:white;
    font:bold 14px Arial;
    text-shadow:0 2px 4px #000;
}

#hpPanel{
    position:absolute;
    top:14px;
    right:14px;
    width:220px;
    padding:9px 11px;
    border-radius:15px;
    background:rgba(20,20,25,.72);
    border:2px solid rgba(255,255,255,.25);
    backdrop-filter:blur(8px);
}

#hpText{
    color:white;
    font:bold 14px Arial;
    margin-bottom:6px;
    text-shadow:0 2px 3px #000;
}

#hpOuter{
    height:15px;
    background:#351515;
    border-radius:20px;
    overflow:hidden;
    border:2px solid rgba(255,255,255,.35);
}

#hpInner{
    width:100%;
    height:100%;
    background:#e53935;
    border-radius:20px;
}

#crosshair{
    position:absolute;
    left:50%;
    top:50%;
    width:14px;
    height:14px;
    transform:translate(-50%,-50%);
    border:2px solid rgba(255,255,255,.8);
    border-radius:50%;
}

#joystickZone{
    position:absolute;
    left:20px;
    bottom:25px;
    width:145px;
    height:145px;
    pointer-events:auto;
}

#joystickBase{
    position:absolute;
    inset:0;
    border-radius:50%;
    background:rgba(255,255,255,.12);
    border:2px solid rgba(255,255,255,.25);
}

#joystickStick{
    position:absolute;
    left:50%;
    top:50%;
    width:65px;
    height:65px;
    transform:translate(-50%,-50%);
    border-radius:50%;
    background:rgba(255,255,255,.35);
    border:2px solid rgba(255,255,255,.5);
}

#actions{
    position:absolute;
    right:18px;
    bottom:22px;
    width:195px;
    height:195px;
    pointer-events:none;
}

.action{
    position:absolute;
    width:66px;
    height:66px;
    border-radius:50%;
    border:2px solid rgba(255,255,255,.45);
    background:rgba(20,20,25,.58);
    backdrop-filter:blur(7px);
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font:bold 29px Arial;
    box-shadow:0 5px 14px rgba(0,0,0,.35);
    pointer-events:auto;
}

.action:active{
    transform:scale(.9);
}

#fire{
    right:0;
    bottom:48px;
    width:80px;
    height:80px;
    font-size:34px;
}

#jump{
    right:88px;
    bottom:0;
}

#skill1{
    left:0;
    bottom:0;
}

#skill2{
    left:20px;
    bottom:88px;
}

#skill3{
    left:90px;
    bottom:104px;
}

#gameOver{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.72);
    align-items:center;
    justify-content:center;
    flex-direction:column;
    color:white;
    pointer-events:auto;
}

#gameOver h1{
    font:800 42px Arial;
    margin-bottom:14px;
}

#restart{
    padding:14px 26px;
    border:0;
    border-radius:14px;
    font:bold 17px Arial;
}
</style>
</head>

<body>

<div id="game">

<canvas id="canvas"></canvas>

<div id="hud">

<div id="info">
    WAVE <span id="wave">1</span>
    &nbsp;•&nbsp;
    ZOMBIE <span id="zcount">0</span>
</div>

<div id="hpPanel">
    <div id="hpText">HP 100 / 100</div>
    <div id="hpOuter">
        <div id="hpInner"></div>
    </div>
</div>

<div id="crosshair"></div>

<div id="joystickZone">
    <div id="joystickBase"></div>
    <div id="joystickStick"></div>
</div>

<div id="actions">
    <div class="action" id="skill1">✦</div>
    <div class="action" id="skill2">◉</div>
    <div class="action" id="skill3">✹</div>
    <div class="action" id="jump">↑</div>
    <div class="action" id="fire">●</div>
</div>

</div>

<div id="gameOver">
    <h1>GAME OVER</h1>
    <button id="restart">CHƠI LẠI</button>
</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>

/* =========================================================
   THREE.JS
========================================================= */

const canvas=document.getElementById("canvas");

const renderer=new THREE.WebGLRenderer({
    canvas:canvas,
    antialias:true,
    powerPreference:"high-performance"
});

renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;

const scene=new THREE.Scene();

scene.background=new THREE.Color(0x8fc9f2);

const camera=new THREE.PerspectiveCamera(
    65,
    innerWidth/innerHeight,
    .1,
    700
);


/* =========================================================
   ÁNH SÁNG
========================================================= */

scene.add(
    new THREE.HemisphereLight(
        0xbfe8ff,
        0x49613f,
        1.7
    )
);

const sunLight=new THREE.DirectionalLight(
    0xffffff,
    2.2
);

sunLight.position.set(-80,120,70);
sunLight.castShadow=true;

sunLight.shadow.mapSize.width=2048;
sunLight.shadow.mapSize.height=2048;

sunLight.shadow.camera.left=-100;
sunLight.shadow.camera.right=100;
sunLight.shadow.camera.top=100;
sunLight.shadow.camera.bottom=-100;

scene.add(sunLight);


/* =========================================================
   MẶT ĐẤT
========================================================= */

const ground=new THREE.Mesh(
    new THREE.PlaneGeometry(180,180),
    new THREE.MeshStandardMaterial({
        color:0x9b9d96,
        roughness:.92
    })
);

ground.rotation.x=-Math.PI/2;
ground.receiveShadow=true;

scene.add(ground);


/* =========================================================
   SÂN TRƯỜNG
========================================================= */

const yard=new THREE.Mesh(
    new THREE.PlaneGeometry(90,75),
    new THREE.MeshStandardMaterial({
        color:0xcfd1cc,
        roughness:.8
    })
);

yard.rotation.x=-Math.PI/2;
yard.position.set(0,.02,-16);

scene.add(yard);


/* =========================================================
   LỐI VÀO CỔNG
========================================================= */

const entrancePath=new THREE.Mesh(
    new THREE.PlaneGeometry(12,55),
    new THREE.MeshStandardMaterial({
        color:0x777b78,
        roughness:.9
    })
);

entrancePath.rotation.x=-Math.PI/2;
entrancePath.position.set(0,.025,-35);

scene.add(entrancePath);


/* =========================================================
   HÀNG RÀO
========================================================= */

function createFence(x,z,w){

    const mat=new THREE.MeshStandardMaterial({
        color:0xdce5e7,
        roughness:.65
    });

    const group=new THREE.Group();

    for(const y of [1.5,2.6]){

        const rail=new THREE.Mesh(
            new THREE.BoxGeometry(w,.16,.16),
            mat
        );

        rail.position.set(0,y,0);

        group.add(rail);
    }

    for(let i=0;i<=Math.floor(w/2);i++){

        const post=new THREE.Mesh(
            new THREE.BoxGeometry(.13,3,.13),
            mat
        );

        post.position.set(
            -w/2+i*2,
            1.5,
            0
        );

        group.add(post);
    }

    group.position.set(x,0,z);

    scene.add(group);
}

createFence(-31,-16,50);
createFence(31,-16,50);


/* =========================================================
   CỔNG TRƯỜNG LỚN
========================================================= */

function createMainGate(){

    const gate=new THREE.Group();

    const pillarMat=new THREE.MeshStandardMaterial({
        color:0xe5eeee,
        roughness:.5
    });

    const greenMat=new THREE.MeshStandardMaterial({
        color:0x13833d,
        roughness:.4
    });

    const blueMat=new THREE.MeshStandardMaterial({
        color:0x61b9d8,
        roughness:.5
    });

    for(const x of [-9,9]){

        const pillar=new THREE.Mesh(
            new THREE.BoxGeometry(2.6,7,2.8),
            pillarMat
        );

        pillar.position.set(x,3.5,0);
        pillar.castShadow=true;

        gate.add(pillar);

        const cap=new THREE.Mesh(
            new THREE.BoxGeometry(3,.45,3.2),
            greenMat
        );

        cap.position.set(x,7.15,0);

        gate.add(cap);
    }

    const top=new THREE.Mesh(
        new THREE.BoxGeometry(17,1.35,2.3),
        greenMat
    );

    top.position.set(0,6.4,0);

    gate.add(top);

    const roof=new THREE.Mesh(
        new THREE.BoxGeometry(19,.55,3.1),
        blueMat
    );

    roof.position.set(0,7.25,0);

    gate.add(roof);


    /* BẢNG TÊN */

    const sign=new THREE.Mesh(
        new THREE.BoxGeometry(11,1.5,.22),
        new THREE.MeshStandardMaterial({
            color:0xf1f5f2
        })
    );

    sign.position.set(0,6.35,-1.22);

    gate.add(sign);


    const signCanvas=document.createElement("canvas");

    signCanvas.width=1000;
    signCanvas.height=160;

    const ctx=signCanvas.getContext("2d");

    ctx.fillStyle="#f1f5f2";
    ctx.fillRect(0,0,1000,160);

    ctx.fillStyle="#126b38";
    ctx.font="bold 62px Arial";
    ctx.textAlign="center";
    ctx.textBaseline="middle";

    ctx.fillText(
        "TRƯỜNG TRUNG HỌC CƠ SỞ",
        500,
        80
    );

    const texture=new THREE.CanvasTexture(signCanvas);

    const textPlane=new THREE.Mesh(
        new THREE.PlaneGeometry(10.7,1.28),
        new THREE.MeshBasicMaterial({
            map:texture,
            transparent:true
        })
    );

    textPlane.position.set(0,6.35,-1.36);

    gate.add(textPlane);


    /* CỔNG SẮT */

    const gateMat=new THREE.MeshStandardMaterial({
        color:0x16723d,
        roughness:.35,
        metalness:.2
    });

    for(const side of [-1,1]){

        const panel=new THREE.Mesh(
            new THREE.BoxGeometry(7.7,4.8,.22),
            gateMat
        );

        panel.position.set(
            side*4.9,
            2.4,
            -1
        );

        gate.add(panel);

        for(let i=0;i<9;i++){

            const bar=new THREE.Mesh(
                new THREE.BoxGeometry(.16,4.2,.28),
                gateMat
            );

            bar.position.set(
                side*4.9-3.2*side+i*.8*side,
                2.4,
                -1.18
            );

            gate.add(bar);
        }
    }

    gate.position.set(0,0,-62);

    scene.add(gate);
}

createMainGate();


/* =========================================================
   TRƯỜNG 5 TẦNG
========================================================= */

function createFiveFloorSchool(){

    const school=new THREE.Group();

    const wallMat=new THREE.MeshStandardMaterial({
        color:0x9dd9e7,
        roughness:.65
    });

    const accentMat=new THREE.MeshStandardMaterial({
        color:0x55b4d0,
        roughness:.5
    });

    const floorMat=new THREE.MeshStandardMaterial({
        color:0xe9f1f2,
        roughness:.6
    });

    const windowMat=new THREE.MeshStandardMaterial({
        color:0x284d5e,
        roughness:.2,
        metalness:.15
    });

    const width=42;
    const depth=10;
    const floorHeight=3.3;
    const floors=5;

    const body=new THREE.Mesh(
        new THREE.BoxGeometry(
            width,
            floorHeight*floors,
            depth
        ),
        wallMat
    );

    body.position.set(
        0,
        floorHeight*floors/2,
        -15
    );

    body.castShadow=true;
    body.receiveShadow=true;

    school.add(body);


    /* DẢI PHÂN TẦNG */

    for(let i=1;i<floors;i++){

        const strip=new THREE.Mesh(
            new THREE.BoxGeometry(
                width+.25,
                .18,
                depth+.25
            ),
            floorMat
        );

        strip.position.set(
            0,
            i*floorHeight,
            -15
        );

        school.add(strip);
    }


    /* MÁI */

    const roof=new THREE.Mesh(
        new THREE.BoxGeometry(
            width+2,
            .65,
            depth+2
        ),
        accentMat
    );

    roof.position.set(
        0,
        floorHeight*floors+.35,
        -15
    );

    school.add(roof);


    /* CỬA SỔ */

    for(let floor=0;floor<floors;floor++){

        const y=floor*floorHeight+1.7;

        for(let x=-18;x<=18;x+=4){

            const win=new THREE.Mesh(
                new THREE.BoxGeometry(
                    2.4,
                    1.8,
                    .16
                ),
                windowMat
            );

            win.position.set(
                x,
                y,
                -9.86
            );

            school.add(win);

            const divider=new THREE.Mesh(
                new THREE.BoxGeometry(
                    .12,
                    1.75,
                    .22
                ),
                floorMat
            );

            divider.position.set(
                x,
                y,
                -9.98
            );

            school.add(divider);
        }
    }


    /* HÀNH LANG */

    for(let floor=0;floor<floors;floor++){

        const y=floor*floorHeight+1.5;

        const rail=new THREE.Mesh(
            new THREE.BoxGeometry(
                width,
                .12,
                .12
            ),
            floorMat
        );

        rail.position.set(
            0,
            y,
            -8.2
        );

        school.add(rail);

        for(let x=-20;x<=20;x+=2){

            const post=new THREE.Mesh(
                new THREE.BoxGeometry(
                    .08,
                    1.2,
                    .08
                ),
                floorMat
            );

            post.position.set(
                x,
                y-.6,
                -8.2
            );

            school.add(post);
        }
    }


    /* CỬA CHÍNH */

    const door=new THREE.Mesh(
        new THREE.BoxGeometry(6,5.5,.5),
        new THREE.MeshStandardMaterial({
            color:0x356a72,
            roughness:.4
        })
    );

    door.position.set(
        0,
        2.75,
        -9.65
    );

    school.add(door);


    /* MÁI SẢNH */

    const entranceRoof=new THREE.Mesh(
        new THREE.BoxGeometry(9,.45,4),
        accentMat
    );

    entranceRoof.position.set(
        0,
        5.8,
        -11
    );

    school.add(entranceRoof);


    /* CẦU THANG XANH LỚN */

    const stairs=new THREE.Group();

    const stairMat=new THREE.MeshStandardMaterial({
        color:0x208b51,
        roughness:.55
    });

    for(let i=0;i<10;i++){

        const step=new THREE.Mesh(
            new THREE.BoxGeometry(
                8,
                .35,
                1.1
            ),
            stairMat
        );

        step.position.set(
            0,
            .175+i*.35,
            -11-i*1
        );

        stairs.add(step);
    }


    /* TAY VỊN */

    const railMat=new THREE.MeshStandardMaterial({
        color:0xf1f4ef
    });

    for(const side of [-1,1]){

        const rail=new THREE.Mesh(
            new THREE.BoxGeometry(
                .16,
                3.8,
                10
            ),
            railMat
        );

        rail.position.set(
            side*4.2,
            1.9,
            -16
        );

        rail.rotation.x=-.22;

        stairs.add(rail);
    }

    school.add(stairs);

    scene.add(school);
}

createFiveFloorSchool();


/* =========================================================
   CÂY CHI TIẾT
========================================================= */

function createDetailedTree(x,z,scale=1){

    const tree=new THREE.Group();

    const trunkMat=new THREE.MeshStandardMaterial({
        color:0x62402b,
        roughness:.9
    });

    const leafMat=new THREE.MeshStandardMaterial({
        color:0x28783c,
        roughness:.8
    });

    const trunk=new THREE.Mesh(
        new THREE.CylinderGeometry(
            .28,
            .42,
            3.4,
            10
        ),
        trunkMat
    );

    trunk.position.y=1.7;
    trunk.castShadow=true;

    tree.add(trunk);


    for(let i=0;i<5;i++){

        const branch=new THREE.Mesh(
            new THREE.CylinderGeometry(
                .09,
                .16,
                1.5,
                7
            ),
            trunkMat
        );

        const a=i/5*Math.PI*2;

        branch.position.set(
            Math.cos(a)*.55,
            3.1,
            Math.sin(a)*.55
        );

        branch.rotation.z=Math.cos(a)*.55;
        branch.rotation.x=Math.sin(a)*.55;

        tree.add(branch);
    }


    for(let i=0;i<7;i++){

        const leaf=new THREE.Mesh(
            new THREE.IcosahedronGeometry(
                1.25+Math.random()*.35,
                1
            ),
            leafMat
        );

        const a=i/7*Math.PI*2;

        leaf.position.set(
            Math.cos(a)*1.1,
            3.8+Math.sin(i)*.35,
            Math.sin(a)*1.1
        );

        leaf.castShadow=true;

        tree.add(leaf);
    }

    tree.position.set(x,0,z);
    tree.scale.setScalar(scale);

    scene.add(tree);
}

createDetailedTree(-17,-28,1.05);
createDetailedTree(17,-28,1.05);
createDetailedTree(-22,-8,.9);
createDetailedTree(22,-8,.9);


/* =========================================================
   NHÂN VẬT HOA
========================================================= */

function createPlayer(){

    const player=new THREE.Group();

    const stemMat=new THREE.MeshStandardMaterial({
        color:0x4eaa42,
        roughness:.65
    });

    const stemCurve=new THREE.CatmullRomCurve3([
        new THREE.Vector3(0,0,0),
        new THREE.Vector3(.05,1.2,0),
        new THREE.Vector3(-.04,2.4,0),
        new THREE.Vector3(0,3.4,0)
    ]);

    const stem=new THREE.Mesh(
        new THREE.TubeGeometry(
            stemCurve,
            18,
            .38,
            10
        ),
        stemMat
    );

    stem.castShadow=true;
    player.add(stem);


    /* LÁ */

    function createLeaf(side,rotation){

        const group=new THREE.Group();

        const mat=new THREE.MeshStandardMaterial({
            color:0x3e9d39,
            roughness:.65,
            side:THREE.DoubleSide
        });

        const shape=new THREE.Shape();

        shape.moveTo(0,0);

        shape.quadraticCurveTo(
            1.3,.25,
            2.1,0
        );

        shape.quadraticCurveTo(
            1.25,-.8,
            0,0
        );

        const leaf=new THREE.Mesh(
            new THREE.ShapeGeometry(shape),
            mat
        );

        leaf.rotation.x=-Math.PI/2;
        leaf.scale.setScalar(side);

        group.add(leaf);

        const vein=new THREE.Mesh(
            new THREE.CylinderGeometry(
                .025,
                .04,
                1.7,
                5
            ),
            new THREE.MeshStandardMaterial({
                color:0x24732b
            })
        );

        vein.rotation.z=Math.PI/2;
        vein.position.set(side*.75,.02,0);

        group.add(vein);

        group.position.set(
            side*.25,
            1.7,
            0
        );

        group.rotation.y=rotation;

        return group;
    }

    player.add(createLeaf(1,.15));
    player.add(createLeaf(-1,-.15));
    player.add(createLeaf(1,1));
    player.add(createLeaf(-1,-1));


    /* 4 RỄ */

    const rootMat=new THREE.MeshStandardMaterial({
        color:0x9a6537,
        roughness:.95
    });

    for(let i=0;i<4;i++){

        const angle=i/4*Math.PI*2+.25;

        const curve=new THREE.CatmullRomCurve3([
            new THREE.Vector3(0,0,0),
            new THREE.Vector3(
                Math.cos(angle)*.35,
                -.15,
                Math.sin(angle)*.35
            ),
            new THREE.Vector3(
                Math.cos(angle)*.9,
                -.35,
                Math.sin(angle)*.9
            ),
            new THREE.Vector3(
                Math.cos(angle)*1.35,
                -.42,
                Math.sin(angle)*1.35
            )
        ]);

        const root=new THREE.Mesh(
            new THREE.TubeGeometry(
                curve,
                14,
                .11,
                7
            ),
            rootMat
        );

        root.castShadow=true;
        player.add(root);

        for(let j=0;j<3;j++){

            const branchCurve=new THREE.CatmullRomCurve3([
                curve.getPoint(.45+j*.12),
                new THREE.Vector3(
                    Math.cos(angle+.4)*(0.65+j*.18),
                    -.5-j*.04,
                    Math.sin(angle+.4)*(0.65+j*.18)
                ),
                new THREE.Vector3(
                    Math.cos(angle+.4)*(1.05+j*.18),
                    -.56-j*.05,
                    Math.sin(angle+.4)*(1.05+j*.18)
                )
            ]);

            const branch=new THREE.Mesh(
                new THREE.TubeGeometry(
                    branchCurve,
                    8,
                    .045,
                    5
                ),
                rootMat
            );

            player.add(branch);
        }
    }


    /* MẶT */

    const faceGroup=new THREE.Group();

    const face=new THREE.Mesh(
        new THREE.SphereGeometry(
            1.55,
            32,
            20
        ),
        new THREE.MeshStandardMaterial({
            color:0xf4c83e,
            roughness:.55
        })
    );

    face.scale.set(1,.82,.38);

    face.position.set(
        0,
        4.45,
        .18
    );

    face.castShadow=true;

    faceGroup.add(face);


    /* CÁNH HOA */

    const petalMat=new THREE.MeshStandardMaterial({
        color:0xf8d64c,
        roughness:.55
    });

    for(let i=0;i<18;i++){

        const a=i/18*Math.PI*2;

        const petal=new THREE.Mesh(
            new THREE.SphereGeometry(
                .68,
                16,
                10
            ),
            petalMat
        );

        petal.scale.set(
            .7,
            1.35,
            .28
        );

        petal.position.set(
            Math.cos(a)*1.48,
            4.45+Math.sin(a)*1.28,
            .05
        );

        petal.rotation.z=-a;

        faceGroup.add(petal);
    }


    /* MẮT */

    const eyeWhite=new THREE.MeshStandardMaterial({
        color:0xffffff
    });

    const eyeBlack=new THREE.MeshStandardMaterial({
        color:0x151515
    });

    for(const x of [-.55,.55]){

        const eye=new THREE.Mesh(
            new THREE.SphereGeometry(
                .34,
                20,
                16
            ),
            eyeWhite
        );

        eye.scale.z=.3;

        eye.position.set(
            x,
            4.65,
            .67
        );

        faceGroup.add(eye);

        const pupil=new THREE.Mesh(
            new THREE.SphereGeometry(
                .17,
                16,
                12
            ),
            eyeBlack
        );

        pupil.scale.z=.25;

        pupil.position.set(
            x,
            4.65,
            .93
        );

        faceGroup.add(pupil);
    }


    /* NỤ CƯỜI CHÉO */

    const smileCurve=new THREE.CatmullRomCurve3([
        new THREE.Vector3(-.75,4.15,.68),
        new THREE.Vector3(-.25,4.05,.76),
        new THREE.Vector3(.25,4.18,.78),
        new THREE.Vector3(.75,4.38,.68)
    ]);

    const smile=new THREE.Mesh(
        new THREE.TubeGeometry(
            smileCurve,
            20,
            .075,
            8
        ),
        new THREE.MeshStandardMaterial({
            color:0x492019
        })
    );

    faceGroup.add(smile);

    player.add(faceGroup);

    player.position.set(
        0,
        0,
        -53
    );

    scene.add(player);

    return player;
}

const player=createPlayer();


/* =========================================================
   ZOMBIE
========================================================= */

const zombies=[];

function createZombie(){

    const z=new THREE.Group();

    const skinMat=new THREE.MeshStandardMaterial({
        color:0x6d8f68,
        roughness:.8
    });

    const shirtMat=new THREE.MeshStandardMaterial({
        color:0x5d6575,
        roughness:.8
    });

    const body=new THREE.Mesh(
        new THREE.CapsuleGeometry(
            .65,
            1.2,
            6,
            12
        ),
        shirtMat
    );

    body.position.y=1.4;
    z.add(body);

    const head=new THREE.Mesh(
        new THREE.SphereGeometry(
            .7,
            20,
            16
        ),
        skinMat
    );

    head.position.y=2.75;
    z.add(head);

    const eyeMat=new THREE.MeshStandardMaterial({
        color:0x111111
    });

    for(const x of [-.25,.25]){

        const eye=new THREE.Mesh(
            new THREE.SphereGeometry(.09,8,8),
            eyeMat
        );

        eye.position.set(
            x,
            2.85,
            .63
        );

        z.add(eye);
    }

    const a=Math.random()*Math.PI*2;

    z.position.set(
        Math.cos(a)*(16+Math.random()*8),
        0,
        -18+Math.sin(a)*(16+Math.random()*8)
    );

    scene.add(z);

    zombies.push({
        mesh:z,
        hp:100,
        speed:.8+Math.random()*.35
    });
}


/* =========================================================
   ĐẠN NĂNG LƯỢNG
========================================================= */

const projectiles=[];

function shoot(){

    const dir=new THREE.Vector3();

    camera.getWorldDirection(dir);

    const start=player.position.clone();

    start.y+=4.35;

    start.add(
        dir.clone().multiplyScalar(1.25)
    );

    const ball=new THREE.Mesh(
        new THREE.SphereGeometry(
            .24,
            16,
            12
        ),
        new THREE.MeshBasicMaterial({
            color:0xfff36a
        })
    );

    ball.position.copy(start);

    const glow=new THREE.Mesh(
        new THREE.SphereGeometry(
            .43,
            16,
            12
        ),
        new THREE.MeshBasicMaterial({
            color:0xffe44d,
            transparent:true,
            opacity:.23
        })
    );

    ball.add(glow);

    scene.add(ball);

    projectiles.push({
        mesh:ball,
        velocity:dir.multiplyScalar(32),
        life:1.8
    });
}


/* =========================================================
   KỸ NĂNG
========================================================= */

let shieldTime=0;

function skillBurst(){

    for(let i=-2;i<=2;i++){

        const dir=new THREE.Vector3();

        camera.getWorldDirection(dir);

        dir.x+=i*.08;
        dir.normalize();

        const ball=new THREE.Mesh(
            new THREE.SphereGeometry(.22,14,10),
            new THREE.MeshBasicMaterial({
                color:0x7ffaff
            })
        );

        ball.position.copy(
            player.position
        );

        ball.position.y+=4.35;

        scene.add(ball);

        projectiles.push({
            mesh:ball,
            velocity:dir.multiplyScalar(28),
            life:1.4
        });
    }
}

function skillShield(){
    shieldTime=4;
}

function skillPulse(){

    for(const z of zombies){

        const d=z.mesh.position.distanceTo(
            player.position
        );

        if(d<9){

            const push=z.mesh.position
                .clone()
                .sub(player.position)
                .normalize();

            z.mesh.position.add(
                push.multiplyScalar(5)
            );

            z.hp-=35;
        }
    }
}


/* =========================================================
   JOYSTICK
========================================================= */

let moveX=0;
let moveY=0;
let joystickActive=false;
let joystickId=null;

const joystickZone=document.getElementById(
    "joystickZone"
);

const joystickStick=document.getElementById(
    "joystickStick"
);

function joystickMove(e){

    const rect=joystickZone.getBoundingClientRect();

    const cx=rect.left+rect.width/2;
    const cy=rect.top+rect.height/2;

    let dx=e.clientX-cx;
    let dy=e.clientY-cy;

    const max=52;
    const len=Math.hypot(dx,dy);

    if(len>max){

        dx=dx/len*max;
        dy=dy/len*max;
    }

    joystickStick.style.transform=
        `translate(calc(-50% + ${dx}px),calc(-50% + ${dy}px))`;

    moveX=dx/max;
    moveY=dy/max;
}

joystickZone.addEventListener(
    "pointerdown",
    e=>{
        joystickActive=true;
        joystickId=e.pointerId;
        joystickZone.setPointerCapture(e.pointerId);
        joystickMove(e);
    }
);

joystickZone.addEventListener(
    "pointermove",
    e=>{
        if(
            joystickActive &&
            e.pointerId===joystickId
        ){
            joystickMove(e);
        }
    }
);

joystickZone.addEventListener(
    "pointerup",
    ()=>{
        joystickActive=false;
        moveX=0;
        moveY=0;
        joystickStick.style.transform=
            "translate(-50%,-50%)";
    }
);


/* =========================================================
   CAMERA KÉO BẰNG TAY
========================================================= */

let cameraDragging=false;
let cameraPointerId=null;

let lastX=0;
let lastY=0;

let yaw=0;
let pitch=-.18;

canvas.addEventListener(
    "pointerdown",
    e=>{
        cameraDragging=true;
        cameraPointerId=e.pointerId;
        lastX=e.clientX;
        lastY=e.clientY;
        canvas.setPointerCapture(e.pointerId);
    }
);

canvas.addEventListener(
    "pointermove",
    e=>{

        if(
            !cameraDragging ||
            e.pointerId!==cameraPointerId
        ) return;

        const dx=e.clientX-lastX;
        const dy=e.clientY-lastY;

        lastX=e.clientX;
        lastY=e.clientY;

        yaw-=dx*.006;
        pitch-=dy*.004;

        pitch=Math.max(
            -.9,
            Math.min(.45,pitch)
        );
    }
);

canvas.addEventListener(
    "pointerup",
    ()=>{
        cameraDragging=false;
    }
);

/* =========================================================
   DI CHUYỂN
========================================================= */

player.userData.jumpVelocity=0;

function updatePlayer(dt){

    const speed=7;

    const forward=new THREE.Vector3(
        Math.sin(yaw),
        0,
        Math.cos(yaw)
    );

    const right=new THREE.Vector3(
        Math.cos(yaw),
        0,
        -Math.sin(yaw)
    );

    const movement=new THREE.Vector3();

    movement.add(
        right.multiplyScalar(moveX)
    );

    movement.add(
        forward.multiplyScalar(-moveY)
    );

    if(movement.length()>.01){

        movement.normalize();

        player.position.add(
            movement.multiplyScalar(speed*dt)
        );

        player.rotation.y=
            Math.atan2(
                movement.x,
                movement.z
            );
    }

    player.position.x=
        THREE.MathUtils.clamp(
            player.position.x,
            -38,
            38
        );

    player.position.z=
        THREE.MathUtils.clamp(
            player.position.z,
            -60,
            15
        );


    if(player.userData.jumpVelocity!==0){

        player.userData.jumpVelocity-=18*dt;

        player.position.y+=
            player.userData.jumpVelocity*dt;

        if(player.position.y<=0){

            player.position.y=0;
            player.userData.jumpVelocity=0;
        }
    }
}


/* =========================================================
   ZOMBIE AI
========================================================= */

let damageTimer=0;

function updateZombies(dt){

    damageTimer-=dt;

    for(let i=zombies.length-1;i>=0;i--){

        const z=zombies[i];

        if(z.hp<=0){

            scene.remove(z.mesh);
            zombies.splice(i,1);

            continue;
        }

        const dir=player.position
            .clone()
            .sub(z.mesh.position);

        dir.y=0;

        const distance=dir.length();

        if(distance>1.8){

            dir.normalize();

            z.mesh.position.add(
                dir.multiplyScalar(
                    z.speed*dt
                )
            );

            z.mesh.lookAt(
                player.position.x,
                z.mesh.position.y,
                player.position.z
            );

        }else if(damageTimer<=0){

            if(shieldTime<=0){

                playerHP-=10;

                updateHP();
            }

            damageTimer=.7;
        }
    }
}


/* =========================================================
   ĐẠN
========================================================= */

function updateProjectiles(dt){

    for(
        let i=projectiles.length-1;
        i>=0;
        i--
    ){

        const p=projectiles[i];

        p.mesh.position.add(
            p.velocity.clone().multiplyScalar(dt)
        );

        p.life-=dt;

        let hit=false;

        for(const z of zombies){

            const target=z.mesh.position.clone();

            target.y+=2;

            if(
                p.mesh.position.distanceTo(target)
                <1.15
            ){

                z.hp-=45;
                hit=true;
                break;
            }
        }

        if(p.life<=0 || hit){

            scene.remove(p.mesh);
            projectiles.splice(i,1);
        }
    }
}


/* =========================================================
   HP
========================================================= */

let playerHP=100;

function updateHP(){

    playerHP=Math.max(0,playerHP);

    document.getElementById("hpInner")
        .style.width=playerHP+"%";

    document.getElementById("hpText")
        .textContent=
        `HP ${playerHP} / 100`;

    if(playerHP<=0){
        document.getElementById("gameOver")
            .style.display="flex";
    }
}


/* =========================================================
   WAVE
========================================================= */

let wave=1;
let waveTimer=0;

function updateWave(dt){

    waveTimer-=dt;

    if(
        zombies.length===0 &&
        waveTimer<=0
    ){

        const count=3+wave*2;

        for(let i=0;i<count;i++){

            setTimeout(()=>{
                createZombie();
            },i*350);
        }

        document.getElementById("wave")
            .textContent=wave;

        wave++;

        waveTimer=10;
    }

    document.getElementById("zcount")
        .textContent=zombies.length;
}


/* =========================================================
   CAMERA
========================================================= */

function updateCamera(){

    const distance=10;

    const target=player.position.clone();

    target.y+=3;

    const camPos=new THREE.Vector3();

    camPos.x=
        target.x+
        Math.sin(yaw)*distance;

    camPos.z=
        target.z+
        Math.cos(yaw)*distance;

    camPos.y=
        target.y-
        Math.sin(pitch)*distance;

    camera.position.lerp(
        camPos,
        .15
    );

    camera.lookAt(target);
}


/* =========================================================
   ANIMATION HOA
========================================================= */

let animationTime=0;

function animatePlayer(dt){

    animationTime+=dt;

    const moving=
        Math.abs(moveX)+Math.abs(moveY)>.1;

    if(moving){

        player.rotation.z=
            Math.sin(animationTime*9)*.025;
    }else{

        player.rotation.z=
            Math.sin(animationTime*2)*.012;
    }
}

/* =========================================================
   MÂY
========================================================= */

const clouds=[];

function createCloud(x,y,z){

    const cloud=new THREE.Group();

    const mat=new THREE.MeshStandardMaterial({
        color:0xffffff,
        transparent:true,
        opacity:.82
    });

    for(let i=0;i<5;i++){

        const c=new THREE.Mesh(
            new THREE.SphereGeometry(
                2+Math.random()*1.7,
                14,
                10
            ),
            mat
        );

        c.position.set(
            i*2.1-4,
            Math.random()*.8,
            Math.random()*1.5
        );

        cloud.add(c);
    }

    cloud.position.set(x,y,z);

    scene.add(cloud);

    clouds.push(cloud);
}

createCloud(-25,38,-55);
createCloud(25,42,-80);
createCloud(50,35,-30);

========================================================= */

camera.position.set(
    0,
    5,
    -50
);

camera.lookAt(
    0,
    3,
    -35
);

for(let i=0;i<3;i++){
    createZombie();
}

updateHP();


/* =========================================================
   GAME LOOP
========================================================= */

let lastTime=performance.now();

function animate(){

    requestAnimationFrame(animate);

    const now=performance.now();

    let dt=(now-lastTime)/1000;

    lastTime=now;

    dt=Math.min(dt,.05);

    updatePlayer(dt);
    updateZombies(dt);
    updateProjectiles(dt);
    updateWave(dt);
    updateCamera();
    animatePlayer(dt);

    shieldTime=Math.max(
        0,
        shieldTime-dt
    );


    for(const cloud of clouds){

        cloud.position.x+=dt*.45;

        if(cloud.position.x>100){
            cloud.position.x=-100;
        }
    }

    renderer.render(
        scene,
        camera
    );
}

animate();
