<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>Trường THCS Cam Thượng - 3D</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
    user-select:none;
    -webkit-user-select:none;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#87b9df;
    touch-action:none;
    font-family:Arial,sans-serif;
}

canvas{
    display:block;
    width:100%;
    height:100%;
    touch-action:none;
}

#jumpButton{
    position:fixed;
    right:24px;
    bottom:30px;
    width:78px;
    height:78px;
    border-radius:50%;
    border:3px solid rgba(255,255,255,.9);
    background:rgba(30,120,220,.72);
    color:white;
    font-size:15px;
    font-weight:bold;
    z-index:20;
    box-shadow:0 5px 18px rgba(0,0,0,.35);
    touch-action:none;
}

#jumpButton:active{
    transform:scale(.92);
    background:rgba(20,90,180,.9);
}

#info{
    position:fixed;
    left:12px;
    top:12px;
    z-index:10;
    padding:7px 10px;
    border-radius:10px;
    color:white;
    background:rgba(0,0,0,.35);
    font-size:11px;
    pointer-events:none;
    line-height:1.45;
}

#crosshair{
    position:fixed;
    left:50%;
    top:50%;
    width:7px;
    height:7px;
    margin-left:-3.5px;
    margin-top:-3.5px;
    border:1px solid rgba(255,255,255,.8);
    border-radius:50%;
    z-index:5;
    pointer-events:none;
}

#loading{
    position:fixed;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#8ec5e8;
    color:white;
    font-size:18px;
    font-weight:bold;
    z-index:100;
}
</style>
</head>

<body>

<div id="loading">Đang dựng mô hình 3D...</div>

<div id="info">
    Khuôn viên Trường THCS Cam Thượng<br>
    Chạm nút NHẢY: nhảy • 2 lần: bay • 3 lần: rơi
</div>

<div id="crosshair"></div>
<button id="jumpButton">NHẢY</button>

<script src="https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.min.js"></script>

<script>
/* =========================================================
   1. KHỞI TẠO THREE.JS
========================================================= */

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x8ec5e8);

scene.fog = new THREE.Fog(
    0x8ec5e8,
    450,
    1000
);

const camera = new THREE.PerspectiveCamera(
    65,
    innerWidth / innerHeight,
    0.1,
    1800
);

camera.position.set(
    0,
    8,
    30
);

const renderer = new THREE.WebGLRenderer({
    antialias:true,
    powerPreference:"high-performance"
});

renderer.setPixelRatio(
    Math.min(window.devicePixelRatio,1.5)
);

renderer.setSize(
    innerWidth,
    innerHeight
);

renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

renderer.outputColorSpace = THREE.SRGBColorSpace;

document.body.appendChild(renderer.domElement);


/* =========================================================
   2. ÁNH SÁNG
========================================================= */

const hemiLight = new THREE.HemisphereLight(
    0xbfe8ff,
    0x5e7048,
    2.0
);

scene.add(hemiLight);

const sunLight = new THREE.DirectionalLight(
    0xffffff,
    3.0
);

sunLight.position.set(
    180,
    280,
    120
);

sunLight.castShadow = true;

sunLight.shadow.mapSize.width = 2048;
sunLight.shadow.mapSize.height = 2048;

sunLight.shadow.camera.left = -500;
sunLight.shadow.camera.right = 500;
sunLight.shadow.camera.top = 500;
sunLight.shadow.camera.bottom = -500;

sunLight.shadow.camera.near = 1;
sunLight.shadow.camera.far = 900;

scene.add(sunLight);


/* =========================================================
   3. MATERIAL
========================================================= */

const MAT = {

    grass: new THREE.MeshStandardMaterial({
        color:0x6d9f50,
        roughness:1
    }),

    yard: new THREE.MeshStandardMaterial({
        color:0xb87967,
        roughness:.85
    }),

    tileLine: new THREE.MeshStandardMaterial({
        color:0xe4b9a6,
        roughness:.8
    }),

    concrete: new THREE.MeshStandardMaterial({
        color:0xd9d9d9,
        roughness:.9
    }),

    white: new THREE.MeshStandardMaterial({
        color:0xf5f5f5,
        roughness:.8
    }),

    blueWall: new THREE.MeshStandardMaterial({
        color:0x8dbbd3,
        roughness:.85
    }),

    darkBlue: new THREE.MeshStandardMaterial({
        color:0x3c83a7,
        roughness:.8
    }),

    roof: new THREE.MeshStandardMaterial({
        color:0x4d5961,
        roughness:.9
    }),

    window: new THREE.MeshStandardMaterial({
        color:0x78c8ee,
        metalness:.15,
        roughness:.25
    }),

    windowDark: new THREE.MeshStandardMaterial({
        color:0x31596d,
        metalness:.2,
        roughness:.35
    }),

    metal: new THREE.MeshStandardMaterial({
        color:0x454b4f,
        metalness:.75,
        roughness:.3
    }),

    gateBlue: new THREE.MeshStandardMaterial({
        color:0x2678aa,
        metalness:.25,
        roughness:.45
    }),

    yellow: new THREE.MeshStandardMaterial({
        color:0xf0d36b,
        roughness:.8
    }),

    green: new THREE.MeshStandardMaterial({
        color:0x4e9b53,
        roughness:.85
    }),

    treeTrunk: new THREE.MeshStandardMaterial({
        color:0x69462c,
        roughness:1
    }),

    leaf: new THREE.MeshStandardMaterial({
        color:0x3c8d43,
        roughness:1
    }),

    skin: new THREE.MeshStandardMaterial({
        color:0xf0b28e,
        roughness:.85
    }),

    shirt: new THREE.MeshStandardMaterial({
        color:0xeeeeee,
        roughness:.9
    }),

    pants: new THREE.MeshStandardMaterial({
        color:0x30353c,
        roughness:.9
    }),

    shoe: new THREE.MeshStandardMaterial({
        color:0xffffff,
        roughness:.7
    }),

    black: new THREE.MeshStandardMaterial({
        color:0x151515,
        roughness:.7
    })
};


/* =========================================================
   4. HÀM TẠO HÌNH CƠ BẢN
========================================================= */

function box(
    w,
    h,
    d,
    material,
    x=0,
    y=0,
    z=0,
    parent=scene
){
    const geometry = new THREE.BoxGeometry(w,h,d);
    const mesh = new THREE.Mesh(geometry,material);

    mesh.position.set(x,y,z);

    mesh.castShadow = true;
    mesh.receiveShadow = true;

    parent.add(mesh);

    return mesh;
}

function cylinder(
    radiusTop,
    radiusBottom,
    height,
    material,
    x=0,
    y=0,
    z=0,
    parent=scene,
    segments=16
){
    const geometry = new THREE.CylinderGeometry(
        radiusTop,
        radiusBottom,
        height,
        segments
    );

    const mesh = new THREE.Mesh(
        geometry,
        material
    );

    mesh.position.set(x,y,z);

    mesh.castShadow = true;
    mesh.receiveShadow = true;

    parent.add(mesh);

    return mesh;
}

function sphere(
    radius,
    material,
    x=0,
    y=0,
    z=0,
    parent=scene,
    segments=20
){
    const geometry = new THREE.SphereGeometry(
        radius,
        segments,
        segments
    );

    const mesh = new THREE.Mesh(
        geometry,
        material
    );

    mesh.position.set(x,y,z);

    mesh.castShadow = true;
    mesh.receiveShadow = true;

    parent.add(mesh);

    return mesh;
}


/* =========================================================
   5. NỀN ĐẤT 900 x 900
========================================================= */

box(
    900,
    2,
    900,
    MAT.grass,
    0,
    -1,
    0
);


/* =========================================================
   6. KHUÔN VIÊN 260 x 210
========================================================= */

const CAMPUS_W = 260;
const CAMPUS_D = 210;

box(
    CAMPUS_W,
    0.35,
    CAMPUS_D,
    MAT.yard,
    0,
    0.12,
    0
);


/* =========================================================
   7. LƯỚI ĐƯỜNG VIỀN Ô GẠCH
========================================================= */

const tileSize = 5;

for(
    let x = -CAMPUS_W/2;
    x <= CAMPUS_W/2;
    x += tileSize
){
    box(
        0.14,
        0.08,
        CAMPUS_D,
        MAT.tileLine,
        x,
        0.34,
        0
    );
}

for(
    let z = -CAMPUS_D/2;
    z <= CAMPUS_D/2;
    z += tileSize
){
    box(
        CAMPUS_W,
        0.08,
        0.14,
        MAT.tileLine,
        0,
        0.35,
        z
    );
}


/* =========================================================
   8. ĐƯỜNG VIỀN KHUÔN VIÊN
========================================================= */

box(
    CAMPUS_W,
    0.45,
    2.5,
    MAT.concrete,
    0,
    0.48,
    -CAMPUS_D/2
);

box(
    CAMPUS_W,
    0.45,
    2.5,
    MAT.concrete,
    0,
    0.48,
    CAMPUS_D/2
);

box(
    2.5,
    0.45,
    CAMPUS_D,
    MAT.concrete,
    -CAMPUS_W/2,
    0.48,
    0
);

box(
    2.5,
    0.45,
    CAMPUS_D,
    MAT.concrete,
    CAMPUS_W/2,
    0.48,
    0
);


/* =========================================================
   9. TƯỜNG BAO
========================================================= */

const WALL_H = 2.8;

box(
    CAMPUS_W,
    WALL_H,
    0.8,
    MAT.white,
    0,
    WALL_H/2,
    -CAMPUS_D/2
);

    CAMPUS_W,
    WALL_H,
    0.8,

    WALL_H/2,
    CAMPUS_D/2

/* =========================================================
   10. CỔNG CHÍNH PHÍA TRƯỚC - BÊN PHẢI
========================================================= */

const gateX = 58;

    12,

);

    5.5,
    12,
    5.5,
    MAT.yellow,
    gateX + 18,

box(
    40,
    4.5,
    1.2,
    MAT.gateBlue,

    11,

/* =========================================================
   11. CHỮ TÊN TRƯỜNG TRÊN BIỂN CỔNG
========================================================= */

function createTextTexture(text){
    const canvas = document.createElement("canvas");
    canvas.width = 1200;
    canvas.height = 220;

    const ctx = canvas.getContext("2d");

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 78px Arial";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    ctx.fillText(
        text,
        canvas.width/2,
        canvas.height/2
    );

    const texture = new THREE.CanvasTexture(canvas);
    texture.colorSpace = THREE.SRGBColorSpace;

    return texture;
}

const schoolTextMaterial =
    new THREE.MeshBasicMaterial({
        map:createTextTexture(
            "TRƯỜNG THCS CAM THƯỢNG"
        ),
        transparent:true
    });

const schoolText = new THREE.Mesh(
    new THREE.PlaneGeometry(36,6.6),
    schoolTextMaterial
);

schoolText.position.set(
    gateX,
    11,
    gateZ - 0.66
);

scene.add(schoolText);


/* =========================================================
   12. CỔNG SẮT GẤP / TRƯỢT
========================================================= */

for(let i=0;i<8;i++){

    const x =
        gateX - 15 + i * 4.25;

    box(
        0.7,
        5.8,
        0.35,
        MAT.metal,
        x,
        3.2,
        gateZ - 1.2
    );

    box(
        3.7,
        0.35,
        0.35,
        MAT.metal,
        x + 1.75,
        5.6,
        gateZ - 1.2
    );
}


/* =========================================================
   13. LỐI VÀO CỔNG
========================================================= */

box(
    44,
    0.12,
    24,
    MAT.concrete,
    gateX,
    0.42,
    gateZ + 13
);


/* =========================================================
   14. HÀM TẠO CỬA SỔ
========================================================= */

function createWindow(
    x,
    y,
    z,
    rotY=0,
    parent=scene
){

    const group = new THREE.Group();

    group.position.set(x,y,z);
    group.rotation.y = rotY;

    box(
        4.8,
        3.0,
        0.25,
        MAT.window,
        0,
        0,
        0,
        group
    );

    box(
        0.22,
        3.1,
        0.3,
        MAT.windowDark,
        0,
        0,
        -0.18,
        group
    );

    box(
        4.9,
        0.22,
        0.3,
        MAT.windowDark,
        0,
        0,
        -0.18,
        group
    );

    box(
        0.22,
        3.1,
        0.3,
        MAT.windowDark,
        -1.6,
        0,
        -0.18,
        group
    );

    box(
        0.22,
        3.1,
        0.3,
        MAT.windowDark,
        1.6,
        0,
        -0.18,
        group
    );

    box(
        4.9,
        0.22,
        0.3,
        MAT.windowDark,
        0,
        0,
        -0.18,
        group
    );

    parent.add(group);

    return group;
}


/* =========================================================
   15. HÀM TẠO CỬA
========================================================= */

function createDoor(
    x,
    y,
    z,
    rotY=0,
    parent=scene
){

    const group = new THREE.Group();

    group.position.set(x,y,z);
    group.rotation.y = rotY;

    box(
        3.2,
        5.2,
        0.35,
        MAT.windowDark,
        0,
        2.6,
        0,
        group
    );

    box(
        0.14,
        5.1,
        0.4,
        MAT.metal,
        0,
        2.6,
        -0.22,
        group
    );

    box(
        0.14,
        5.1,
        0.4,
        MAT.metal,
        -1.55,
        2.6,
        -0.22,
        group
    );

    box(
        0.14,
        5.1,
        0.4,
        MAT.metal,
        1.55,
        2.6,
        -0.22,
        group
    );

    parent.add(group);

    return group;
}


/* =========================================================
   16. TÒA NHÀ A - HÌNH CHỮ L - 4 TẦNG
========================================================= */

const buildingA = new THREE.Group();

buildingA.position.set(
    -48,
    0,
    8
);

scene.add(buildingA);


/* ---------------------------------------------------------
   Kích thước
--------------------------------------------------------- */

const A_FLOOR_H = 4.1;
const A_FLOORS = 4;
const A_TOTAL_H = A_FLOOR_H * A_FLOORS;

const A_LONG = 92;
const A_SHORT = 58;
const A_DEPTH = 15;


/* =========================================================
   17. HAI NHÁNH CHỮ L
========================================================= */

for(let floor=0;floor<A_FLOORS;floor++){

    const baseY =
        0.55 + floor * A_FLOOR_H;

    /* Nhánh dài */

    box(
        A_LONG,
        A_FLOOR_H,
        A_DEPTH,
        MAT.blueWall,
        0,
        baseY + A_FLOOR_H/2,
        0,
        buildingA
    );

    /* Nhánh vuông góc */

    box(
        A_DEPTH,
        A_FLOOR_H,
        A_SHORT,
        MAT.blueWall,
        -(A_LONG/2 - A_DEPTH/2),
        baseY + A_FLOOR_H/2,
        A_SHORT/2 - A_DEPTH/2,
        buildingA
    );

    /* Dải trắng giữa tầng */

    box(
        A_LONG + 0.8,
        0.38,
        A_DEPTH + 0.35,
        MAT.white,
        0,
        baseY,
        0,
        buildingA
    );

    box(
        A_DEPTH + 0.35,
        0.38,
        A_SHORT + 0.8,
        MAT.white,
        -(A_LONG/2 - A_DEPTH/2),
        baseY,
        A_SHORT/2 - A_DEPTH/2,
        buildingA
    );

    /* Chân tường trắng */

    if(floor===0){

        box(
            A_LONG + 1,
            1.2,
            A_DEPTH + .5,
            MAT.white,
            0,
            0.6,
            0,
            buildingA
        );

        box(
            A_DEPTH + .5,
            1.2,
            A_SHORT + 1,
            MAT.white,
            -(A_LONG/2 - A_DEPTH/2),
            0.6,
            A_SHORT/2 - A_DEPTH/2,
            buildingA
        );
    }
}


/* =========================================================
   18. MÁI TÒA A
========================================================= */

box(
    A_LONG + 2,
    1.0,
    A_DEPTH + 2,
    MAT.roof,
    0,
    A_TOTAL_H + 1.05,
    0,
    buildingA
);

box(
    A_DEPTH + 2,
    1.0,
    A_SHORT + 2,
    MAT.roof,
    -(A_LONG/2 - A_DEPTH/2),
    A_TOTAL_H + 1.05,
    A_SHORT/2 - A_DEPTH/2,
    buildingA
);


/* =========================================================
   19. CỬA SỔ TÒA A - NHÁNH DÀI
========================================================= */

for(let floor=0;floor<4;floor++){

    const y =
        3.0 + floor*A_FLOOR_H;

    for(let i=0;i<9;i++){

        const x =
            -38 + i*9.5;

        createWindow(
            x,
            y,
            -A_DEPTH/2 - .25,
            0,
            buildingA
        );
    }
}


/* =========================================================
   20. CỬA SỔ TÒA A - MẶT SAU NHÁNH DÀI
========================================================= */

for(let floor=0;floor<4;floor++){

    const y =
        3.0 + floor*A_FLOOR_H;

    for(let i=0;i<9;i++){

        const x =
            -38 + i*9.5;

        createWindow(
            x,
            y,
            A_DEPTH/2 + .25,
            Math.PI,
            buildingA
        );
    }
}


/* =========================================================
   21. CỬA SỔ NHÁNH VUÔNG GÓC
========================================================= */

for(let floor=0;floor<4;floor++){

    const y =
        3.0 + floor*A_FLOOR_H;

    for(let i=0;i<5;i++){

        const z =
            7 + i*9.2;

        createWindow(
            -A_LONG/2 - .25,
            y,
            z,
            Math.PI/2,
            buildingA
        );
    }
}


/* =========================================================
   22. CỬA CHÍNH TÒA A
========================================================= */

createDoor(
    0,
    0,
    -A_DEPTH/2 - .35,
    0,
    buildingA
);


/* =========================================================
   23. HÀNH LANG TÒA A
========================================================= */

for(let floor=0;floor<4;floor++){

    const y =

    box(
        A_LONG - 8,
        0.25,
        4.0,
        MAT.concrete,
        0,
        y,
        -A_DEPTH/2 - 2.5,
        buildingA
    );
}


/* =========================================================
   24. CẦU THANG NỘI BỘ TÒA A
========================================================= */

function createStaircase(
    x,
    z,
    rotation=0,
    parent=buildingA
){

    const stairGroup = new THREE.Group();

    stairGroup.position.set(x,0,z);
    stairGroup.rotation.y = rotation;

    const stepsPerFloor = 10;
    const stepH = A_FLOOR_H / stepsPerFloor;
    const stepD = 1.15;
    const width = 5.2;

    for(let floor=0;floor<3;floor++){

        const baseY =
            0.7 + floor*A_FLOOR_H;

        for(let i=0;i<stepsPerFloor;i++){

            box(
                width,
                stepH*(i+1),
                stepD,
                MAT.concrete,
                0,
                baseY + stepH*(i+1)/2,
                i*stepD,
                stairGroup
            );
        }

        box(
            width,
            0.3,
            5,
            MAT.concrete,
            0,
            baseY + A_FLOOR_H,
            stepsPerFloor*stepD + 2.5,
            stairGroup
        );
    }

    parent.add(stairGroup);

    return stairGroup;
}

createStaircase(
    -18,
    4,
    0,
    buildingA
);


/* =========================================================
   25. KHU VỰC LỄ ĐƯỜNG / SÂN KHẤU

        box(

            MAT.white,

========================================================= */

const keys = {
    forward:false,
    backward:false,
    left:false,
    right:false,
    up:false,
    down:false
};

window.addEventListener(
    "keydown",
    e => {

        if(e.code==="KeyW" || e.code==="ArrowUp")
            keys.forward=true;

        if(e.code==="KeyS" || e.code==="ArrowDown")
            keys.backward=true;

        if(e.code==="KeyA" || e.code==="ArrowLeft")
            keys.left=true;

        if(e.code==="KeyD" || e.code==="ArrowRight")
            keys.right=true;

        if(e.code==="Space"){
            e.preventDefault();

            if(!e.repeat)
                jumpAction();
        }

        if(e.code==="ShiftLeft" || e.code==="ShiftRight")
            keys.down=true;
    }
);

window.addEventListener(
    "keyup",
    e => {

        if(e.code==="KeyW" || e.code==="ArrowUp")
            keys.forward=false;

        if(e.code==="KeyS" || e.code==="ArrowDown")
            keys.backward=false;

        if(e.code==="KeyA" || e.code==="ArrowLeft")
            keys.left=false;

        if(e.code==="KeyD" || e.code==="ArrowRight")
            keys.right=false;

        if(e.code==="ShiftLeft" || e.code==="ShiftRight")
            keys.down=false;
    }
);


/* =========================================================
   32. CAMERA
========================================================= */

let yaw = 0;
let pitch = -0.12;

const cameraTarget = new THREE.Vector3();

let lookPointerId = null;
let lastLookX = 0;
let lastLookY = 0;


/* Chỉ vùng bên phải màn hình điều khiển camera */

renderer.domElement.addEventListener(
    "pointerdown",
    e => {

        if(e.pointerType==="touch"){

            if(
                e.clientX > innerWidth * .42 &&
                e.clientY < innerHeight - 125
            ){

                lookPointerId = e.pointerId;

                lastLookX = e.clientX;
                lastLookY = e.clientY;

                renderer.domElement.setPointerCapture(
                    e.pointerId
                );
            }
        }
        else{

            lookPointerId = e.pointerId;

            lastLookX = e.clientX;
            lastLookY = e.clientY;

            renderer.domElement.setPointerCapture(
                e.pointerId
            );
        }
    }
);

renderer.domElement.addEventListener(
    "pointermove",
    e => {

        if(e.pointerId !== lookPointerId)
            return;

        const dx =
            e.clientX - lastLookX;

        const dy =
            e.clientY - lastLookY;

        lastLookX = e.clientX;
        lastLookY = e.clientY;

        yaw -= dx * .005;
        pitch -= dy * .004;

        pitch = THREE.MathUtils.clamp(
            pitch,
            -1.45,
            1.35
        );
    }
);

renderer.domElement.addEventListener(
    "pointerup",
    e => {

        if(e.pointerId===lookPointerId){

            lookPointerId=null;

            try{
                renderer.domElement.releasePointerCapture(
                    e.pointerId
                );
            }catch(err){}
        }
    }
);


/* =========================================================
   33. ĐIỀU KHIỂN DI CHUYỂN CẢM ỨNG
========================================================= */

let movePointerId = null;

let moveStartX = 0;
let moveStartY = 0;

let moveX = 0;
let moveY = 0;

renderer.domElement.addEventListener(
    "pointerdown",
    e => {

        if(e.pointerType!=="touch")
            return;

        if(e.clientY > innerHeight - 130)
            return;

        if(e.clientX <= innerWidth * .42){

            movePointerId = e.pointerId;

            moveStartX = e.clientX;
            moveStartY = e.clientY;

            moveX = 0;
            moveY = 0;

            renderer.domElement.setPointerCapture(
                e.pointerId
            );
        }
    }
);

renderer.domElement.addEventListener(
    "pointermove",
    e => {

        if(e.pointerId !== movePointerId)
            return;

        const dx =
            e.clientX - moveStartX;

        const dy =
            e.clientY - moveStartY;

        const maxDistance = 70;

        moveX =
            THREE.MathUtils.clamp(
                dx/maxDistance,
                -1,
                1
            );

        moveY =
            THREE.MathUtils.clamp(
                dy/maxDistance,
                -1,
                1
            );
    }
);

function endMove(e){

    if(e.pointerId===movePointerId){

        movePointerId=null;

        moveX=0;
        moveY=0;

        try{
            renderer.domElement.releasePointerCapture(
                e.pointerId
            );
        }catch(err){}
    }
}

renderer.domElement.addEventListener(
    "pointerup",
    endMove
);

renderer.domElement.addEventListener(
    "pointercancel",
    endMove
);


/* =========================================================
   34. NÚT NHẢY - 1 / 2 / 3 LẦN
========================================================= */

const jumpButton =
    document.getElementById("jumpButton");

let tapTimer = null;

function jumpAction(){

    const now = performance.now();

    if(
        now - state.lastJumpTime >
        650
    ){

        state.jumpCount = 0;
    }

    state.jumpCount++;

    state.lastJumpTime = now;

    if(state.jumpCount===1){

        if(!state.flying && state.grounded){

            state.velocityY = 9.5;
            state.grounded = false;
        }

        tapTimer = setTimeout(
            () => {

                state.jumpCount=0;

            },
            600
        );
    }

    else if(state.jumpCount===2){

        clearTimeout(tapTimer);

        state.flying=true;

        state.velocityY=0;

        state.jumpCount=0;
    }

    else if(state.jumpCount>=3){

        clearTimeout(tapTimer);

        state.flying=false;

        state.grounded=false;

        state.velocityY=0;

        state.jumpCount=0;
    }
}

jumpButton.addEventListener(
    "pointerdown",
    e => {

        e.preventDefault();

        jumpAction();
    }
);


/* =========================================================
   35. HÀM HƯỚNG DI CHUYỂN
========================================================= */

const forward = new THREE.Vector3();
const right = new THREE.Vector3();
const movement = new THREE.Vector3();

function getCameraDirection(){

    forward.set(
        -Math.sin(yaw),
        0,
        -Math.cos(yaw)
    );

    right.set(
        Math.cos(yaw),
        0,
        -Math.sin(yaw)
    );
}


/* =========================================================
   36. GIỚI HẠN KHUÔN VIÊN
========================================================= */

const campusLimitX =
    CAMPUS_W/2 - 4;

const campusLimitZ =
    CAMPUS_D/2 - 4;


/* =========================================================
   37. CẬP NHẬT NHÂN VẬT
========================================================= */

function updatePlayer(delta){

    getCameraDirection();

    movement.set(0,0,0);

    let inputX =
        keys.right ? 1 : 0;

    inputX -=
        keys.left ? 1 : 0;

    let inputForward =
        keys.forward ? 1 : 0;

    inputForward -=
        keys.backward ? 1 : 0;


    if(movePointerId!==null){

        inputX = moveX;

        inputForward = -moveY;
    }


    if(inputX!==0 || inputForward!==0){

        movement
            .addScaledVector(
                right,
                inputX
            )
            .addScaledVector(
                forward,
                inputForward
            );

        if(movement.lengthSq()>0){

            movement.normalize();

            const speed =
                state.flying
                ? state.flySpeed
                : state.speed;

            player.position.addScaledVector(
                movement,
                speed*delta
            );

            player.rotation.y =
                Math.atan2(
                    movement.x,
                    movement.z
                );

            state.walkTime += delta*9;

            const swing =
                Math.sin(
                    state.walkTime
                )*.5;

            leftLeg.rotation.x =
                swing;

            rightLeg.rotation.x =
                -swing;

            leftArm.rotation.x =
                -swing*.7;

            rightArm.rotation.x =
                swing*.7;
        }
    }
    else{

        leftLeg.rotation.x *= .8;
        rightLeg.rotation.x *= .8;

        leftArm.rotation.x *= .8;
        rightArm.rotation.x *= .8;
    }


    /* ---------------------------------------------
       FLY MODE
    --------------------------------------------- */

    if(state.flying){

        let vertical = 0;

        if(keys.up)
            vertical += 1;

        if(keys.down)
            vertical -= 1;

        /*
          Khi bay trên iPhone:
          kéo tay di chuyển lên -> nhân vật bay lên
          kéo tay di chuyển xuống -> nhân vật bay xuống
        */

        if(movePointerId!==null){

            vertical = -moveY;

            if(
                Math.abs(vertical)<.12
            ){
                vertical=0;
            }
        }

        player.position.y +=
            vertical *
            state.verticalSpeed *
            delta;

        player.position.y =
            Math.max(
                1.05,
                player.position.y
            );
    }

    else{

        state.velocityY -=
            state.gravity*delta;

        player.position.y +=
            state.velocityY*delta;

        if(player.position.y<=1.05){

            player.position.y=1.05;

            state.velocityY=0;

            state.grounded=true;
        }
        else{

            state.grounded=false;
        }
    }


    /* ---------------------------------------------
       GIỚI HẠN KHUÔN VIÊN
    --------------------------------------------- */

    player.position.x =
        THREE.MathUtils.clamp(
            player.position.x,
            -campusLimitX,
            campusLimitX
        );

    player.position.z =
        THREE.MathUtils.clamp(
            player.position.z,
            -campusLimitZ,
            campusLimitZ
        );
}


/* =========================================================
   38. CAMERA KHÔNG CHUI XUỐNG ĐẤT
========================================================= */

function updateCamera(){

    const distance = 10;

    const horizontal =
        Math.cos(pitch)*distance;

    camera.position.set(
        player.position.x
        - Math.sin(yaw)*horizontal,

        player.position.y
        + 4
        + Math.sin(pitch)*distance,

        player.position.z
        - Math.cos(yaw)*horizontal
    );

    cameraTarget.set(
        player.position.x,
        player.position.y+2.1,
        player.position.z
    );

    camera.lookAt(cameraTarget);

    if(camera.position.y < .7){

        camera.position.y=.7;
    }
}
